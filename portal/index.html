async function doLogin(){
  const btn = $("loginBtn"), err = $("err");
  btn.disabled = true; btn.textContent = "Signing in…"; err.textContent = "";
  try{
    ME = (await api("/auth/login", {method:"POST", body:{username:$("u").value, password:$("p").value}})).user;
    /* Launched from the home-screen shortcut with no session yet: the flag has
       to survive the sign-in, or a freshly installed app drops you in the
       office portal instead of the field. boot() only sees the flag when a
       session already exists, which is the second time onwards. */
    if(new URLSearchParams(location.search).get("surveillance")) return openSurveillanceLauncher();
    await render();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

async function doAccept(token){
  const btn = $("acceptBtn"), err = $("err");
  err.textContent = "";
  if($("p1").value !== $("p2").value){ err.textContent = "Those passwords do not match."; return; }
  btn.disabled = true; btn.textContent = "Creating…";
  try{
    ME = (await api(`/invite/${token}/accept`, {method:"POST", body:{password:$("p1").value}})).user;
    history.replaceState({}, "", "/portal/");   // keep the token out of the address bar
    await render();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = "Create my account";
  }
}

async function doLogout(){
  try{ await api("/auth/logout", {method:"POST"}); }catch{}
  ME = null; CASES = []; USERS = []; INVITES = []; PKGS = null; TAB = "cases"; LAST_LINK = ""; LAST_EMAILED = false; RESET_BOX = null; paint();
}

/* The case workspace. A case is not a record to read, it is work in progress,
   so opening one lands on tabs rather than one long detail list. Only the tabs
   that do something today are shown — an empty "Evidence" tab would promise a
   feature that is not there. */
async function openCase(caseNo, tab){
  WS_CASE = caseNo; WS_TAB = tab || "overview"; WS_ERR = ""; SUBJ_FORM = null; ACT_MODAL = null; VIEW = "case";
  REP_VIEW = "preview"; REP_VERS = {}; EV_TAB = "all";
  if(isExample(caseNo)){
    WS = null;   // examples are page-held demo data; they have no live workspace
    return paintCase();
  }
  try{
    const [sub, ws] = await Promise.all([
      api("/submissions/" + encodeURIComponent(caseNo)),
      api("/cases/" + encodeURIComponent(caseNo) + "/workspace"),
    ]);
    WS = { ...ws, submission: sub.submission };
  }catch(e){ alert(e.message); return; }
  // Landing straight on the Package panel (the dashboard's Build jump) needs
  // the build fetched, exactly as the tab click would have done.
  if(WS_TAB === "package"){ PKG = null; return loadPackage(); }
  paintCase();
}

async function reloadWorkspace(){
  if(!WS_CASE || isExample(WS_CASE)) return;
  try{
    const ws = await api("/cases/" + encodeURIComponent(WS_CASE) + "/workspace");
    WS = { ...ws, submission: WS ? WS.submission : null };
  }catch(e){ WS_ERR = e.message; }
  paintCase();
}

/* UIBUILD P6 — the case page navigates in four sections, with the panels as
   sub-tabs inside them. WS_TAB stays the single routing key (openCase, the
   dashboard's pkgJump and every in-panel jump keep working unchanged); the
   active section is DERIVED from it, never stored, so the two cannot drift.
   An investigator's four sections are their own — nothing administrative. */
function wsSections(){
  /* The 4th element is the bottom-bar label (UIBUILD P15) — the same four
     sections, phone-width words. The 5th is its icon: a word in small caps is
     not something you recognise at a glance in a car, which is what the owner
     hit on 2026-08-14. The glyphs match .sv-nav wherever the label does, so
     the field bar and the case bar read as one system rather than two. */
  if(ME.role === "admin"){
    return [
      ["overview",  "Overview",          [["overview","Overview"], ["details","Intake details"], ["subject","Subject"]], "Home", "&#8962;"],
      ["fieldwork", "Fieldwork",         [["field","Field work"], ["activity","Activity log"]], "Field", "&#128065;"],
      ["repev",     "Report & Evidence", [["reports","Reports"], ["evidence","Evidence"], ["package","Package"]], "Report", "&#128196;"],
      ["admin",     "Admin",             [["assign","Assignment"], ["auth","Authorization"], ["expenses","Expenses"],
                                          ["notes","Internal notes"], ["comms","Comm log"], ["tasks","Tasks"],
                                          ["billing","Billing & closing"]], "Admin", "&#9881;"],
    ];
  }
  const assignment = [["overview","Overview"], ["subject","Subject"], ["tasks","Tasks"],
                      ["comms","Comm log"], ["notes","Internal notes"]];
  // The authorization view joins the assignment context once hours are set —
  // an investigator works to a cap they can see, and nothing about money.
  if(WS && WS.authorization && WS.authorization.authorized_hours != null) assignment.push(["auth","Authorization"]);
  return [
    ["assignment", "Assignment", assignment, "Home", "&#8962;"],
    ["activity",   "Activity",   [["field","Field work"], ["activity","Activity log"], ["expenses","Expenses"]], "Activity", "&#9998;"],
    ["evidence",   "Evidence",   [["evidence","Evidence"]], "Evidence", "&#128247;"],
    ["report",     "Report",     [["reports","Reports"]], "Report", "&#128196;"],
  ];
}
function wsSectionFor(tab){
  const secs = wsSections();
  return secs.find(s => s[2].some(t => t[0] === tab)) || secs[0];
}

function authPanel(a, admin){
  if(!a) return "";
  const bar = (used, total, pct, level) => {
    if(total == null) return "";
    const w = Math.max(0, Math.min(100, pct || 0));
    const tone = level >= 100 ? "over" : level >= 90 ? "high" : level >= 75 ? "warn" : "";
    return `<div class="meter ${tone}"><i style="width:${w}%"></i></div>`;
  };
  const hoursSet = a.authorized_hours != null;
  return `<div class="feebox">
    ${hoursSet ? `
      <div class="row"><span>Confirmed authorization</span><b>${esc(a.authorized_hours)} hours</b></div>
      <div class="row"><span>Used</span><b>${esc(a.hours_used)} hours</b></div>
      <div class="row"><span>Remaining</span><b>${esc(a.hours_remaining)} hours</b></div>
      ${bar(a.hours_used, a.authorized_hours, a.percent_used, a.warn_level)}
      ${a.warn_level != null ? `<div class="warnline ${a.warn_level >= 100 ? "over" : ""}">
         ${a.warn_level >= 100
           ? "<b>Authorization is used up.</b> Request more before any further work."
           : `<b>${esc(a.percent_used)}% of the authorization is used.</b> Past the ${esc(a.warn_level)}% mark.`}
       </div>` : ""}`
      : (((WS && WS.submission && WS.submission.payload) || {}).authorized_hours_status === "pending"
          ? `<div class="row"><span>Authorized hours</span><b>Authorization pending</b></div>
             <div class="warnline"><b>The carrier submitted this assignment with authorization pending.</b>
               Confirm the hours with them before any billable field work starts.</div>`
          : `<div class="row"><span>Authorized hours</span><span>Not set</span></div>`)}
    ${admin && a.package_price != null ? `
      <div class="row"><span>Authorized package</span><b>$${esc(a.package_price.toLocaleString())} &middot; ${esc(a.package_label)}</b></div>` : ""}
    ${admin && a.authorized_budget != null ? `
      <div class="row" style="border-top:1px solid #cfe6ec;margin-top:8px;padding-top:8px">
        <span>Authorized budget</span><b>$${esc(a.authorized_budget.toLocaleString())}</b></div>
      <div class="row"><span>Billable so far</span><b>$${esc(a.billable_so_far.toLocaleString())}</b></div>
      <div class="row"><span>Remaining</span><b>$${esc(a.budget_remaining.toLocaleString())}</b></div>
      <div class="row"><span style="color:var(--muted);font-size:.82rem">Billed at $${esc(a.billed_at_rate)}/hr</span><span></span></div>` : ""}
    ${admin && a.retainer ? `
      <div class="row" style="border-top:1px solid #cfe6ec;margin-top:8px;padding-top:8px">
        <span>Original retainer</span><b>$${esc(a.retainer.amount.toLocaleString())}</b></div>
      <div class="row"><span>Received</span><b>${a.retainer.received ? "Yes" : "Not yet"}</b></div>
      <div class="row"><span>Applied so far</span><b>$${esc(a.retainer.applied.toLocaleString())}</b></div>
      <div class="row"><span>Remaining retainer</span><b>$${esc(a.retainer.remaining.toLocaleString())}</b></div>
      ${a.retainer.approx_hours_remaining != null ? `<div class="row">
        <span style="color:var(--muted);font-size:.82rem">&asymp; ${esc(a.retainer.approx_hours_remaining)} hours at this case's rate</span><span></span></div>` : ""}` : ""}
    ${a.miles_total ? `<div class="row"><span>Miles logged</span><span>${esc(a.miles_total)}</span></div>` : ""}
  </div>`;
}

/* The activity panel is the TIMELINE (UIBUILD P10): the day's story first,
   with one prominent + Add activity that opens the sheet. The form no longer
   sits on the page. */
function activityPanel(){
  const a = (WS && WS.activity) || [];
  const open = WS && WS.open_day;
  const evLive = ((WS && WS.evidence) || []).filter(ev2 => !ev2.deleted_at);
  const byDay = {};
  for(const e of a){ (byDay[e.at_date] = byDay[e.at_date] || []).push(e); }
  const counts = e => {
    const mine = evLive.filter(ev2 => ev2.entry_id === e.id);
    const p = mine.filter(ev2 => String(ev2.content_type || "").startsWith("image/")).length;
    const v = mine.filter(ev2 => String(ev2.content_type || "").startsWith("video/")).length;
    return (p ? `<span class="tl-counts">&#128247; ${p}</span>` : "")
         + (v ? `<span class="tl-counts">&#127909; ${v}</span>` : "");
  };
  const canEdit = e => ME.role === "admin" || (e.investigator && e.investigator === ME.display_name);

  return `
    ${open ? `<div class="dayon"><b>Investigation day running</b> &mdash; started ${esc(t12(open.start_time))} on ${esc(fmtDay(open.day_date))}.
        Entries are attached to it automatically.
        <button class="btn sm ghost" data-act="wsTab" data-tab="field" style="margin-left:8px">End the day</button></div>`
      : `<div class="note">No investigation day is running. You can still log entries; starting a day
         is what totals the hours and mileage.
         <button class="btn sm ghost" data-act="wsTab" data-tab="field" style="margin-left:8px">Start a day</button></div>`}

    <div class="ambar"><button class="btn addact" data-act="actOpen">+ Add activity</button></div>

    ${a.length ? Object.keys(byDay).map(d => `
      <div class="tl-day">${esc(fmtDay(d))}</div>
      <ol class="tl">
        ${byDay[d].map(e => e.removed_at ? `<li class="tl-i" style="opacity:.5">
          <div class="tl-t">${esc(t12(e.at_time))}</div>
          <div class="tl-b">
            <div class="tl-d" style="text-decoration:line-through">${esc(e.description)}</div>
            <div class="tl-m">Removed ${when(e.removed_at)}${e.removed_by ? " by " + esc(e.removed_by) : ""}
              &mdash; kept on the record, left out of the report
              <button class="tl-edit" data-act="actRestore" data-id="${e.id}">Put it back</button></div>
          </div></li>` : `<li class="tl-i">
          <div class="tl-t">${esc(t12(e.at_time))}</div>
          <div class="tl-b">
            <span class="tag ${esc(e.kind)}">${esc(label(e.kind))}</span>
            <div class="tl-d">${esc(e.description)}</div>
            ${e.location ? `<div class="tl-m">at ${esc(e.location)}</div>` : ""}
            ${e.vehicle ? `<div class="tl-m">vehicle: ${esc(e.vehicle)}</div>` : ""}
            ${e.subject_documented || e.video_acquired || e.photo_acquired || counts(e) ? `<div>
              ${counts(e)}
              ${evLive.filter(ev2 => ev2.entry_id === e.id)
                .map(ev2 => `<a class="tag rs-submitted" style="text-decoration:none"
                  href="/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${ev2.id}/file"
                  target="_blank" rel="noopener">&#128206; ${esc(ev2.filename)}</a>`).join("")}
              ${e.subject_documented ? '<span class="tag cap-sd">Subject documented</span>' : ""}
              ${e.video_acquired ? '<span class="tag cap-va">Video</span>' : ""}
              ${e.photo_acquired ? '<span class="tag cap-pa">Photo</span>' : ""}</div>` : ""}
            ${e.internal_note ? `<div class="tl-n">internal: ${esc(e.internal_note)}</div>` : ""}
            <div class="tl-m">${esc(e.investigator || "")}${e.edited_at ? " · edited" : ""}${
              canEdit(e) ? `<button class="tl-edit" data-act="actEdit" data-id="${e.id}">Edit</button>
                <button class="tl-edit" style="color:#a6392f" data-act="actDelete" data-id="${e.id}">Delete</button>` : ""}</div>
          </div></li>`).join("")}
      </ol>`).join("")
      : `<div class="empty">Nothing logged on this case yet. + Add activity starts the story.</div>`}
    ${ACT_MODAL ? actModalHtml() : ""}`;
}

/* --------------------------- the Add Activity sheet (UIBUILD P8/P9) */

function actModalHtml(){
  const m = ACT_MODAL;
  return `<div class="amwrap" data-act="actClose">
    <div class="amsheet" data-act="amNoop" role="dialog" aria-modal="true" aria-label="Add activity">
      <div class="amhead">
        <b>${m.edit ? "Correct the entry" : "Add activity"}</b>
        <button class="amx" data-act="actClose" aria-label="Close">&times;</button>
      </div>
      ${m.edit ? amComposeHtml() : `
        <div class="amtabs">
          <button class="amtab ${m.tab === "quick" ? "on" : ""}" data-act="actTab" data-t="quick">Quick</button>
          <button class="amtab ${m.tab === "custom" ? "on" : ""}" data-act="actTab" data-t="custom">Custom</button>
        </div>
        ${m.tab === "custom" ? amCustomHtml() : (m.pick != null ? amComposeHtml() : amQuickListHtml())}`}
    </div>
  </div>`;
}

function amQuickListHtml(){
  const m = ACT_MODAL;
  const favs = favLines();
  const lineRow = line => {
    const fav = favs.includes(line);
    return `<div class="amline">
      <button class="amstar ${fav ? "on" : ""}" data-act="actStar" data-line="${esc(line)}"
        aria-label="${fav ? "Unfavorite" : "Favorite"}" title="${fav ? "Unfavorite" : "Favorite"}">${fav ? "&#9733;" : "&#9734;"}</button>
      <button class="ampick" data-act="actPick" data-line="${esc(line)}">${esc(line)}${
        line === NO_CHANGE_LINE ? ' <span class="amtag">one tap &mdash; logs now</span>' : ""}</button>
    </div>`;
  };
  const q = (m.search || "").trim().toLowerCase();
  if(q){
    const hits = [...new Set([...favs, ...ALL_LINES])].filter(l => l.toLowerCase().includes(q));
    return `${amSearchBox()}
      ${hits.length ? hits.map(lineRow).join("") : `<div class="empty">No stock line matches. The Custom tab writes anything.</div>`}`;
  }
  const lines = m.cat === "fav" ? favs : ((ACTION_GROUPS.find(g => g[0] === m.cat) || ACTION_GROUPS[0])[2]);
  return `${amSearchBox()}
    <div class="amcats">
      <button class="amcat ${m.cat === "fav" ? "on" : ""}" data-act="actCat" data-c="fav">&#9733; Favorites</button>
      ${ACTION_GROUPS.map(([k, lbl]) => `<button class="amcat ${m.cat === k ? "on" : ""}" data-act="actCat" data-c="${k}">${lbl}</button>`).join("")}
    </div>
    ${lines.length ? lines.map(lineRow).join("")
      : `<div class="empty">Nothing starred yet. The &#9734; beside any line keeps it here.</div>`}`;
}

function amSearchBox(){
  return `<label class="f"><span>What happened?</span>
    <input id="am_q" value="${esc(ACT_MODAL.search || "")}" placeholder="Search the stock lines&hellip;"
      autocomplete="off" data-act-input="amSearch"></label>`;
}

/* The compose step (P9): the picked line, editable, with the time taken from
   the clock and the rarely-needed fields behind one fold. Also the edit form —
   the same shape, minus what the Worker does not allow to change. */
function amComposeHtml(){
  const m = ACT_MODAL;
  const { date: today, time: now } = stampNow();
  const pre = m.pre || {};
  const isArrival = !m.edit && m.pick === ARRIVAL_LINE;
  return `<form class="amform" data-act="quickAdd">
    ${m.edit ? "" : `<button type="button" class="btn sm ghost" data-act="actBack" style="margin-bottom:10px">&larr; All lines</button>
    <div class="two">
      <label class="f"><span>Date</span><input id="qa_date" type="date" value="${today}"></label>
      <label class="f"><span>Time <span class="opt">now &mdash; editable</span></span><input id="qa_time" type="time" value="${now}"></label>
    </div>`}
    ${isArrival ? `
    <div class="two">
      <label class="f"><span>Vehicles present <span class="opt">optional</span></span>
        <input id="qa_vp" placeholder="e.g. Subject&#39;s white GMC Sierra in the driveway" data-act-input="amArrival"></label>
      <label class="f"><span>View <span class="opt">optional</span></span>
        <select id="qa_view" data-act-input="amArrival">

        </select></label>
    </div>
    <div class="two">
      <label class="f"><span>Position <span class="opt">optional</span></span>
        <select id="qa_place" data-act-input="amArrival">
          <option value="">Not specified</option>
          ${ARRIVAL_PLACE.map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join("")}
        </select></label>
      <label class="f"><span>Position detail <span class="opt">optional</span></span>
        <input id="qa_pos" placeholder="e.g. with a clear view of the front door" data-act-input="amArrival"></label>
    </div>` : ""}
    <label class="f"><span>${m.edit ? "What happened" : "The line <span class=\"opt\">edit freely</span>"}</span>
      <textarea id="qa_desc" rows="3" data-act-input="amDirty">${esc(m.edit ? (pre.description || "") : m.pick)}</textarea></label>
    ${m.edit ? "" : `<div class="capgrid">
      <label class="cap"><input type="checkbox" id="qa_sd"><span>Subject documented</span></label>
      <label class="cap"><input type="checkbox" id="qa_pa"><span>Photo taken</span></label>
      <label class="cap"><input type="checkbox" id="qa_va"><span>Video acquired</span></label>
    </div>`}
    <details class="amfold" ${m.edit && (pre.location || pre.vehicle || pre.internal_note) ? "open" : ""}>
      <summary>More details</summary>
      <div class="two" style="margin-top:8px">
        <label class="f"><span>Location <span class="opt">optional</span></span>
          <input id="qa_loc" value="${esc(pre.location || "")}" placeholder="e.g. 2214 Old Forest Rd"></label>
        <label class="f"><span>Vehicle <span class="opt">optional</span></span>
          <input id="qa_veh" value="${esc(pre.vehicle || "")}" placeholder="e.g. White GMC Sierra XKT-2209"></label>
      </div>
      <label class="f"><span>Internal note <span class="opt">never client-facing</span></span>
        <input id="qa_note" value="${esc(pre.internal_note || "")}"></label>
      ${(() => {   // link already-uploaded files to this moment (P9)
        if(m.edit) return "";
        const linkable = ((WS && WS.evidence) || []).filter(e => !e.deleted_at && !e.entry_id).slice(0, 6);
        return linkable.length ? `<div style="margin-top:8px">
          <span style="font-size:.8rem;font-weight:700;color:var(--muted)">Link evidence to this moment</span>
          ${linkable.map(e => `<label class="cap" style="display:flex;margin-top:4px">
            <input type="checkbox" class="qa-ev" data-id="${e.id}"><span>${esc(e.filename)}${e.note ? ` — ${esc(String(e.note).slice(0, 40))}` : ""}</span></label>`).join("")}
        </div>` : "";
      })()}
    </details>
    <button class="btn" type="submit">${m.edit ? "Save the correction" : "Add to log"}</button>
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;
}

/* Reports. The draft is assembled from the log, then it is a document someone
   writes — so the editor is a plain textarea, and nothing moves to the next
   stage without a person pressing a button. */
function reportsPanel(){
  const admin = ME.role === "admin";
  const reports = (WS && WS.reports) || [];
  const days = ((WS && WS.days) || []).filter(d => d.end_time);
  const reported = new Set(reports.map(r => r.day_id));
  const spare = days.filter(d => !reported.has(d.id));
  const open = reports.find(r => r.id === WS_REPORT);

  const badge = s => `<span class="tag rs-${esc(s)}">${esc(reportLabel(s))}</span>`;

  return `
    ${spare.length ? `<form class="quick" data-act="genReport">

          <select id="r_day">${spare.map(d =>
            `<option value="${d.id}">${esc(d.day_date)} — ${esc(d.start_time)}–${esc(d.end_time || "")}${
              d.hours != null ? ` (${esc(d.hours)} hrs)` : ""}</option>`).join("")}</select></label>
        <button class="btn" type="submit">Generate draft</button>
        <p class="hint">It assembles the chronology from what you logged and formats the times.

        ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
      </form>`
      : `<div class="note">${days.length
          ? "Every completed day on this case already has a report."
          : `End an investigation day first &mdash; a report is drafted from a day's activity log.
             <button class="btn sm ghost" data-act="wsTab" data-tab="field" style="margin-left:8px">Go to Field work</button>`}</div>`}

    ${reports.length ? `<div class="rlist">${reports.map(r => `
      <button class="rcard${r.id === WS_REPORT ? " on" : ""}" data-act="openReport" data-id="${r.id}">

}

/* UIBUILD P11 — the report preview screen. The document leads; the panel nav
   walks its ingredients (chronology, the day, attachments, the submitted
   versions); the actions sit at the bottom, and editing is a step you take,
   not the resting state. */
function reportOpenHtml(open, admin, badge){
  const editable = admin || ["draft","needs_revision"].includes(open.status);
  const day = ((WS && WS.days) || []).find(d => d.id === open.day_id);
  const dayEntries = ((WS && WS.activity) || []).filter(e => e.day_id === open.day_id);
  const entryIds = new Set(dayEntries.map(e => e.id));
  const attached = ((WS && WS.evidence) || []).filter(e => !e.deleted_at && entryIds.has(e.entry_id));
  const vers = REP_VERS[open.id];

  const views = [["preview","Draft preview"], ["chronology","Chronology"], ["summary","Summary"],
                 ["attachments","Attachments"], ["versions","Versions"]];
  const nav = `<div class="rpnav">${views.map(([k, lbl]) =>
    `<button class="${REP_VIEW === k ? "on" : ""}" data-act="repView" data-v="${k}">${lbl}${
      k === "attachments" && attached.length ? ` (${attached.length})` : ""}</button>`).join("")}</div>`;

  const body =
      REP_VIEW === "edit" && editable ? `
        <textarea id="r_body" rows="16" class="rbody">${esc(open.body)}</textarea>
        <div class="ractions">
          <button class="btn sm" data-act="saveReport" data-id="${open.id}">Save changes</button>
          <button class="btn sm ghost" data-act="repView" data-v="preview">Done editing</button>
        </div>`
    : REP_VIEW === "chronology" ? (dayEntries.length
        ? `<ol class="tl">${dayEntries.map(e => `<li class="tl-i">
             <div class="tl-t">${esc(t12(e.at_time))}</div>
             <div class="tl-b"><div class="tl-d">${esc(e.description)}</div>
               ${e.location ? `<div class="tl-m">at ${esc(e.location)}</div>` : ""}</div></li>`).join("")}</ol>`
        : `<div class="empty">No activity entries are attached to this report's day.</div>`)
    : REP_VIEW === "summary" ? (day
        ? `<dl class="detail">
             <dt>Day</dt><dd>${esc(fmtDay(day.day_date))}</dd>
             <dt>Window</dt><dd>${esc(t12(day.start_time))}${day.end_time ? " – " + esc(t12(day.end_time)) : ""}</dd>
             ${day.hours != null ? `<dt>Hours</dt><dd>${esc(day.hours)}</dd>` : ""}
             ${day.miles != null ? `<dt>Miles</dt><dd>${esc(day.miles)}</dd>` : ""}
             ${day.investigator ? `<dt>Investigator</dt><dd>${esc(day.investigator)}</dd>` : ""}
             ${day.summary ? `<dt>Day summary</dt><dd>${esc(day.summary)}</dd>` : ""}
           </dl>`
        : `<div class="empty">This report is not tied to a recorded day.</div>`)
    : REP_VIEW === "attachments" ? (attached.length
        ? `<div class="rlist">${attached.map(e => `<div class="rcard" style="cursor:default">
             <div class="rc-h"><b><a href="/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${e.id}/file"
               target="_blank" rel="noopener">${esc(e.filename)}</a></b></div>
             ${e.note ? `<div class="tl-n">${esc(e.note)}</div>` : ""}
           </div>`).join("")}</div>`
        : `<div class="empty">Nothing is linked to this day's moments yet. Files attach from the
           Evidence panel, or from the Add Activity fold.</div>`)
    : REP_VIEW === "versions" ? (!vers
        ? `<div class="empty">Loading the submitted versions&hellip;</div>`
        : vers.length
        ? vers.map((v, i) => `<details class="amfold" ${i === 0 ? "open" : ""}>
             <summary>Submitted ${when(v.submitted_at)}${v.submitted_by ? " by " + esc(v.submitted_by) : ""}</summary>
             <pre class="rvbody">${esc(v.body)}</pre>
           </details>`).join("")
        : `<div class="empty">Not submitted yet. Each submission preserves its exact text here.</div>`)
    : `
      <div id="repdoc">
        <div class="doc-head">
          <div><h2>Always Precise Investigations, LLC</h2>
            <div style="font-size:.85rem;color:#44505c">Confidential investigative work product</div></div>
          <div style="text-align:right">
            <div style="font-weight:800;letter-spacing:.06em">INVESTIGATIVE REPORT${
              ["draft","needs_revision"].includes(open.status) ? " — DRAFT" : ""}</div>
            <div class="mono" style="font-size:.8rem">${esc(WS_CASE)}</div>
            <div style="font-size:.85rem">${esc(fmtDay(open.report_date))}</div>
            ${open.investigator ? `<div style="font-size:.8rem;color:#44505c">Investigator: ${esc(open.investigator)}</div>` : ""}
          </div>
        </div>
        <pre class="rvbody">${esc(open.body)}</pre>
      </div>`;

  return `<div class="quick" style="margin-top:14px">
    <div class="rc-h" style="margin-bottom:8px"><b>${esc(open.report_date)}</b> ${badge(open.status)}</div>
    ${nav}
    ${body}
    <div class="ractions" style="margin-top:10px">
      ${editable && REP_VIEW !== "edit"
        ? `<button class="btn sm ghost" data-act="repView" data-v="edit">Edit report</button>` : ""}
      <button class="btn sm ghost" data-act="repPrint">Download draft</button>
      ${["draft","needs_revision"].includes(open.status)
        ? `<button class="btn sm" data-act="reportStatus" data-id="${open.id}" data-to="submitted">Submit report</button>` : ""}
      ${admin && open.status === "submitted" ? `
        <button class="btn sm ghost" data-act="reportStatus" data-id="${open.id}" data-to="needs_revision">Send back</button>
        <button class="btn sm" data-act="reportStatus" data-id="${open.id}" data-to="approved">Approve</button>` : ""}
      ${admin && open.status === "approved"
        ? `<button class="btn sm" data-act="reportStatus" data-id="${open.id}" data-to="delivered">Mark delivered</button>` : ""}
    </div>
    ${admin && open.status === "submitted"
      ? `<label class="f" style="margin-top:10px"><span>Note back to the investigator <span class="opt">optional</span></span>
           <input id="r_note" placeholder="What needs changing"></label>` : ""}
    ${!admin && open.status === "submitted"
      ? `<p class="hint">With the office for review. The submitted text is preserved under Versions.</p>` : ""}
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </div>`;
}

async function loadReportVersions(id){
  try{ REP_VERS[id] = (await api(`/cases/${encodeURIComponent(WS_CASE)}/reports/${id}/versions`)).versions; }

  paintCase();

/* Priority 20 — the nine operational stages. The select offers every stage
   except closed: closing goes through the checklist, and the Worker refuses
   the shortcut. A closed case shows closed as its current value so re-saving
   is a no-op rather than an error. */
function STAGE_OPTS(s){
  const wsStage = WS && WS.case_no === s.case_no ? WS.stage : null;
  const cur = wsStage || s.stage || (s.status === "new" ? "open" : s.status) || "open";
  const stages = ["open","assigned","in_progress","report_review","awaiting_client",
                  "complete","on_hold","cancelled"];
  const list = cur === "closed" ? ["closed", ...stages] : stages;
  return list.map(v => `<option value="${v}" ${v === cur ? "selected" : ""}>${esc(label(v))}</option>`).join("");
}

/* The closing checklist: eight attestations, the only door to closed. */
function closurePanel(){
  if(ME.role !== "admin" || !WS || !WS.closure) return "";
  const c = WS.closure;
  if(c.closed_at){
    return `<div class="feebox" style="margin-top:14px">
      <div class="row"><span><b>Case closed</b></span>
        <span>${esc(c.closed_by || "")} &middot; ${when(c.closed_at)}</span></div>
      <div class="row"><span style="color:var(--muted);font-size:.85rem">Reopen by setting a status
        above and saving.</span><span></span></div>
    </div>`;
  }
  const done = c.items.filter(([k]) => c.checklist[k]).length;
  return `<form class="quick" data-act="saveClosure" style="margin-top:14px">
    <h3 style="margin:0 0 8px;font-size:1rem">Close the case <span class="opt">${done}/${c.items.length} confirmed</span></h3>
    ${c.items.map(([k, l]) => `
      <label class="cap"><input type="checkbox" id="cl_${k}" ${c.checklist[k] ? "checked" : ""}><span>${esc(l)}</span></label>`).join("")}
    <div style="margin-top:10px">
      <button class="btn ghost sm" type="submit">Save checklist</button>
      <button class="btn sm" type="button" data-act="closeCase">Close the case</button>
    </div>
    <p class="hint">Every line is your confirmation, not the system's guess. Closing needs all
      ${c.items.length}; the case can be reopened later from the status above.</p>
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;
}

async function saveClosureTicks(){
  WS_ERR = "";
  const checklist = {};
  for(const [k] of ((WS && WS.closure && WS.closure.items) || [])){
    const el = $("cl_" + k);
    if(el) checklist[k] = el.checked;
  }
  try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/closure`, {method:"POST", body:{checklist}}); }
  catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function doCloseCase(){
  await saveClosureTicks();          // what is on screen is what gets judged
  if(WS_ERR) return;
  WS_ERR = "";
  try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/close`, {method:"POST", body:{}}); }
  catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}


/* Priority 6 — evidence, with the free-plan failsafe. Uploads land in the
   private R2 bucket through the Worker, which refuses anything that could
   push the account past the free tier. Both roles upload and read on their
   cases; classification and deletion are the office's. */
function evidencePanel(){
  const admin = ME.role === "admin";
  const rows = (WS && WS.evidence) || [];
  const mb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
  const clsLabel = c => ({client_deliverable:"Client deliverable", internal_only:"Internal only",
    do_not_use:"Do not use", needs_review:"Needs review", needs_redaction:"Needs redaction"})[c] || c;
  const clsTone = c => c === "client_deliverable" ? "rs-approved" : c === "do_not_use" ? "rs-needs_revision"
    : c === "needs_redaction" ? "rs-submitted" : "rs-draft";

  const kindOf = e => String(e.content_type || "").startsWith("image/") ? "photos"
    : String(e.content_type || "").startsWith("video/") ? "video" : "docs";
  const fileUrl = e => `/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${e.id}/file`;
  const momentOf = e => {
    if(!e.entry_id) return "";
    const m = ((WS && WS.activity) || []).find(a => a.id === e.entry_id);
    return m ? `<div class="tl-m">&#128206; ${esc(t12(m.at_time))} — ${esc(String(m.description || "").slice(0, 44))}</div>` : "";
  };

  // The gallery card (UIBUILD P12): the picture leads, the classification is
  // a compact badge, and the admin controls stay small under it.
  const card = e => e.deleted_at
    ? `<div class="evcard" style="opacity:.55">
        <div class="evtile">&#128465;</div>
        <div class="rc-h" style="margin-top:6px"><b>${esc(e.filename)}</b><span class="tag rs-draft">deleted</span></div>
        <div class="tl-m">${mb(e.size_bytes)} &middot; removed ${when(e.deleted_at)} &mdash; the record stays</div>
      </div>`
    : `<div class="evcard">
        ${kindOf(e) === "photos"
          ? `<a href="${fileUrl(e)}" target="_blank" rel="noopener"><img class="evthumb" src="${fileUrl(e)}" alt="${esc(e.filename)}" loading="lazy"></a>`
          : `<div class="evtile">${kindOf(e) === "video" ? "&#127909;" : "&#128196;"}</div>`}
        <div class="rc-h" style="margin-top:6px"><b><a href="${fileUrl(e)}"
             target="_blank" rel="noopener">${esc(e.filename)}</a></b>
          <span class="tag ${clsTone(e.classification)}">${esc(clsLabel(e.classification))}</span>
          ${kindOf(e) === "video" ? `<span class="tag">Portal</span>` : ""}</div>
        <div class="tl-m">${mb(e.size_bytes)} &middot; ${esc(e.uploaded_by || "")} &middot; ${when(e.uploaded_at)}</div>
        ${e.note ? `<div class="tl-n">${esc(e.note)}</div>` : ""}
        ${momentOf(e)}
        ${admin ? `<div style="margin-top:6px"><select data-act="evClass" data-id="${e.id}" style="font-size:.78rem">
            ${["needs_review","client_deliverable","internal_only","needs_redaction","do_not_use"]
              .map(c => `<option value="${c}" ${c === e.classification ? "selected" : ""}>${clsLabel(c)}</option>`).join("")}
          </select>
          <button class="btn sm ghost" data-act="evDelete" data-id="${e.id}">Delete</button></div>` : ""}
      </div>`;

  return `
    <form class="quick" data-act="evUpload">
      <label class="f"><span>File <span class="opt">photos, video, documents &mdash; originals are never overwritten</span></span>
        <input id="ev_file" type="file"></label>
      <div class="two">
        ${admin ? `<label class="f"><span>Classification</span>
          <select id="ev_class">${["needs_review","client_deliverable","internal_only","needs_redaction","do_not_use"]
            .map(c => `<option value="${c}">${clsLabel(c)}</option>`).join("")}</select></label>` : ""}
        <label class="f"><span>Note <span class="opt">optional</span></span>
          <input id="ev_note" placeholder="e.g. Subject loading lumber, clip 2 of 3."></label>
      </div>
      <label class="f"><span>Attach to <span class="opt">a subject's photo, or the activity moment a clip documents</span></span>
        <select id="ev_link">
          <option value="">Nothing in particular</option>
          ${((WS && WS.subjects) || []).length ? `<optgroup label="Subjects">
            ${WS.subjects.map(sj => `<option value="s:${sj.id}">${esc(sj.name)}</option>`).join("")}</optgroup>` : ""}
          ${((WS && WS.activity) || []).length ? `<optgroup label="Recent activity">
            ${WS.activity.slice(0, 8).map(a => `<option value="e:${a.id}">${esc(t12(a.at_time))} — ${esc(String(a.description || "").slice(0, 48))}</option>`).join("")}</optgroup>` : ""}
        </select></label>
      <button class="btn" type="submit">Upload evidence</button>
      <p class="hint">The free-plan failsafe is on: uploads stop before storage could ever bill.
        Large video should be split into parts.</p>
      ${WS_NOTICE ? `<div class="note">${esc(WS_NOTICE)}</div>` : ""}
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>
    <div class="evtabs">${[["all","All"], ["photos","Photos"], ["video","Video"], ["docs","Documents"]]
      .map(([k, lbl]) => {
        const n = k === "all" ? rows.length : rows.filter(e => !e.deleted_at && kindOf(e) === k).length;
        return `<button class="evtab ${EV_TAB === k ? "on" : ""}" data-act="evTab" data-t="${k}">${lbl}${n ? ` (${n})` : ""}</button>`;
      }).join("")}</div>
    ${(() => {
      const shown = EV_TAB === "all" ? rows : rows.filter(e => !e.deleted_at && kindOf(e) === EV_TAB);
      return shown.length ? `<div class="evgrid">${shown.map(card).join("")}</div>`
        : `<div class="empty">${rows.length ? "Nothing of this type on the case." : "Nothing stored on this case yet."}</div>`;
    })()}`;
}

async function uploadEvidenceFile(){
  WS_ERR = ""; WS_NOTICE = "";
  const f = $("ev_file") && $("ev_file").files[0];
  if(!f){ WS_ERR = "Pick a file first."; return paintCase(); }
  const fd = new FormData();
  fd.append("file", f);
  if($("ev_class")) fd.append("classification", $("ev_class").value);
  fd.append("note", $("ev_note").value);
  const link = $("ev_link") ? $("ev_link").value : "";
  if(link.startsWith("s:")) fd.append("subject_id", link.slice(2));
  if(link.startsWith("e:")) fd.append("entry_id", link.slice(2));
  try{
    const res = await fetch(`/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence`,
      {method: "POST", credentials: "same-origin", body: fd});
    const d = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(d.error || ("Upload failed (" + res.status + ")"));
    WS_NOTICE = "Stored. " + (d.usage ? d.usage.percent_of_free + "% of the free plan used." : "");
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function setEvidenceClass(id, cls){
  WS_ERR = "";
  try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/evidence/${id}`, {method:"POST", body:{classification: cls}}); }
  catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function deleteEvidenceRow(id){
  WS_ERR = "";
  try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/evidence/${id}/delete`, {method:"POST", body:{}}); }
  catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}


/* The Case Package (CASEBUILD.md + UXSIMPLIFY P9/P13/P16/P17). One screen
   that says what is done, what is missing, and finalizes the client package
   behind the Worker's gates. Admin-only — an investigator never selects
   client deliverables. */
let PKG = null;   // buildState from the Worker

async function loadPackage(){
  try{ PKG = await api(`/cases/${encodeURIComponent(WS_CASE)}/build`); }
  catch(e){ PKG = null; WS_ERR = e.message; }
  paintCase();
}

function pkgMark(state){   // done | part | none | warn — never color alone
  return state === "done" ? '<span class="pk-s">&#10003;</span>'
       : state === "part" ? '<span class="pk-s">&#9685;</span>'
       : state === "warn" ? '<span class="pk-s">!</span>'
       : '<span class="pk-s">&#9675;</span>';
}

/* Which selected items still ship, and which do not — HIGH #4 (2026-08-14).
   One place, because the document FILTERS on this and the admin notice COUNTS
   it, and a document that printed one set while the screen reported another
   would be worse than either mistake alone.

   Two different reasons an item does not ship, and they must not be confused:
   buildState's evidence query already drops deleted rows, so a deleted item is
   simply ABSENT from PKG.evidence rather than present-and-reclassified. Calling
   a deleted file "no longer client-deliverable" sends the admin to a
   classification that is not the problem. */
function pkgShipping(){
  const items = (PKG && PKG.items) || [];
  const evById = Object.fromEntries(((PKG && PKG.evidence) || []).map(e => [e.id, e]));
  const ships = e => e && !e.deleted_at && e.classification === "client_deliverable";
  return {
    evById,
    ship: items.filter(i => ships(evById[i.evidence_id])),
    gone: items.filter(i => !evById[i.evidence_id]).length,
    heldBack: items.filter(i => { const e = evById[i.evidence_id]; return e && !ships(e); }).length,
  };
}

/* The admin's half of the same fact, and it lives OUTSIDE #pkgdoc on purpose —
   the print stylesheet makes only #pkgdoc visible, so this is seen on screen
   and never by the client. The office needs to know an exhibit it selected is
   not going out; the client must not be told that withheld evidence exists at
   all, which is the whole point of withholding it. */
function pkgWithheldNote(){
  const { gone, heldBack } = pkgShipping();
  const n = gone + heldBack;
  if(!n) return "";
  const why = [
    heldBack ? `${heldBack} no longer marked client-deliverable` : "",
    gone ? `${gone} deleted from evidence` : "",
  ].filter(Boolean).join(", ");
  return `<div class="pkg-miss"><b>${n} selected item${n === 1 ? "" : "s"} withheld from the document</b>
    <p style="margin:4px 0">${esc(why)}. The document below prints without ${n === 1 ? "it" : "them"},
      and says nothing about ${n === 1 ? "it" : "them"} &mdash; the client is never told that withheld
      material exists. Nothing is removed from the case; reclassify or unselect in Evidence.</p></div>`;
}

function packagePanel(){
  if(!PKG) return `<div class="empty">Loading the package&hellip;</div>`;
  const b = PKG.build;
  const ev = PKG.evidence || [];
  const items = PKG.items || [];
  const inPkg = id => items.some(i => i.evidence_id === id);
  const photos = ev.filter(e => String(e.content_type || "").startsWith("image/"));
  const videos = ev.filter(e => String(e.content_type || "").startsWith("video/"));
  const others = ev.filter(e => !String(e.content_type || "").startsWith("image/")
                             && !String(e.content_type || "").startsWith("video/"));
  const eligible = e => e.classification === "client_deliverable";
  const act = (WS && WS.activity || []).length;
  const rep = PKG.approved_report ? "done" : ((WS && WS.reports || []).length ? "part" : "none");
  const inv = (PKG.invoices || [])[0];

  /* The mini-dashboard: state blocks, each a door (UXSIMPLIFY P9/P14/P19). */
  const blocks = `
    <div class="pkg-blocks">
      <button class="pkg-b ${act ? "done" : ""}" data-act="wsTab" data-tab="activity">
        <b>Activity</b><span class="pk-v">${act} entr${act === 1 ? "y" : "ies"}</span>${pkgMark(act ? "done" : "none")}</button>
      <button class="pkg-b ${rep === "done" ? "done" : rep === "part" ? "part" : ""}" data-act="wsTab" data-tab="reports">
        <b>Report</b><span class="pk-v">${PKG.approved_report ? "Approved" : (WS && WS.reports || []).length ? "In review" : "None"}</span>${pkgMark(rep)}</button>
      <button class="pkg-b ${photos.some(eligible) ? "done" : photos.length ? "part" : ""}" data-act="wsTab" data-tab="evidence">
        <b>Photos</b><span class="pk-v">${photos.length}</span>${pkgMark(photos.some(eligible) ? "done" : photos.length ? "part" : "none")}</button>
      ${videos.length ? `<button class="pkg-b ${videos.some(eligible) ? "done" : "part"}" data-act="wsTab" data-tab="evidence">
        <b>Video</b><span class="pk-v">${videos.length}</span>${pkgMark(videos.some(eligible) ? "done" : "part")}</button>` : ""}
      <button class="pkg-b ${b && b.status === "finalized" ? "done" : b ? "part" : ""}">
        <b>Case build</b><span class="pk-v">${b ? (b.status === "finalized" ? "Finalized" : "Draft v" + b.version) : "Not started"}</span>${pkgMark(b && b.status === "finalized" ? "done" : b ? "part" : "none")}</button>
      <button class="pkg-b ${inv ? (inv.status === "paid" ? "done" : "part") : ""}" data-act="tab" data-tab="invoices">
        <b>Invoice</b><span class="pk-v">${inv ? label(inv.status) : "Not created"}</span>${pkgMark(inv ? (inv.status === "paid" ? "done" : "part") : "none")}</button>
    </div>`;

  if(!b){
    return `${blocks}
      <p class="hint">The package pulls the approved report and the client-deliverable
        photos, video and documents into one deliverable, behind hard gates.</p>
      <button class="btn" data-act="pkgStart">Start the package build</button>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}`;
  }

  /* What's missing (UXSIMPLIFY P16): only what stands between here and
     finalized, each line the Worker's own words. */
  /* On a FINALIZED package the same gates are still the truth, and they used to
     be hidden — HIGH #4 (2026-08-14). The strip rendered only while the status
     was not "finalized", which is precisely when Download works, so material
     reclassified to "do not use" after finalizing left no warning anywhere on
     the one screen that ships it. The gates are not suppressed any more; only
     the wording changes, because "to finish this package" is the wrong sentence
     for something already finished. */
  const missing = !PKG.gates.length ? "" : b.status !== "finalized" ? `
    <div class="pkg-miss"><b>To finish this package</b>
      <ul>${PKG.gates.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>` : `
    <div class="pkg-miss"><b>This finalized package needs attention</b>
      <p style="margin:4px 0">It was finalized when everything in it was cleared to ship.
        Something has changed since:</p>
      <ul>${PKG.gates.map(g => `<li>${esc(g)}</li>`).join("")}</ul>
      <p style="margin:4px 0">Anything no longer client-deliverable is already left out of the
        document below. Nothing is deleted &mdash; reclassify it, or build a new version.</p></div>`;

  const pick = (list, kind) => list.length ? `
    <h3 style="margin:14px 0 4px;font-size:.95rem">${kind}</h3>
    <div class="pkg-pick">${list.map(e => {
      const on = inPkg(e.id);
      const img = String(e.content_type || "").startsWith("image/");
      const item = items.find(i => i.evidence_id === e.id);
      return `<div class="pkg-item${on ? " on" : ""}">
        ${img ? `<img src="/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${e.id}/file" alt="">` : ""}
        <div style="margin:4px 0 2px;word-break:break-all"><b>${esc(e.filename)}</b></div>
        <div style="color:var(--muted)">${eligible(e) ? "Client deliverable" : esc(e.classification.replace(/_/g, " "))}</div>
        ${b.status === "draft" ? (on
          ? `<button class="btn sm ghost" data-act="pkgRemove" data-id="${item ? item.id : ""}">Remove</button>`
          : `<button class="btn sm" data-act="pkgAdd" data-id="${e.id}">Add</button>`) : (on ? "In package" : "")}
      </div>`;
    }).join("")}</div>` : "";

  const doc = pkgDocHtml();

  /* UIBUILD P13 — the build's own six steps, each with a state. "n/a" is a
     state too: a package type without video owes no video. */
  const nPhoto = items.filter(i => i.role === "photo").length;
  const nVideo = items.filter(i => i.role === "video").length;
  const nDoc = items.filter(i => i.role === "document").length;
  /* The effective package type — 'custom' is a marker beside the stored
     column, not a value in it (see build_custom in schema.sql). Custom owes
     no type-based judgement about video: the admin chose the contents. */
  const ptype = PKG.package_type || b.package_type;
  const videoWanted = ptype === "custom" || ["report_photos_video", "full"].includes(ptype);
  const reps = PKG.reports || [];
  const steps = [
    ["Review",   reps.length ? "done" : "none"],
    ["Evidence", (nPhoto + nDoc) ? "done" : "none"],
    ["Video",    !videoWanted ? "na" : nVideo ? "done" : "none"],
    ["Package",  ptype ? "done" : "none"],
    ["Preview",  reps.length ? "done" : "none"],
    ["Finalize", b.status === "finalized" ? "done" : "none"],
  ];
  const stepsRail = `<div class="pkg-steps">${steps.map(([lbl, st], i) =>
    `<span class="pkg-step ${st}">${st === "done" ? "&#10003;" : st === "na" ? "&mdash;" : i + 1} ${lbl}${
      st === "na" ? " (n/a)" : ""}</span>`).join("")}</div>`;

  // P13 — what is in the box, in one glance.
  const contents = `<div class="feebox" style="margin:10px 0">
    <div class="row"><span><b>Package contents</b></span><span></span></div>
    <div class="row"><span>Final report</span><b>${reps.length
      ? (reps.length === 1 ? "1 day, approved" : `${reps.length} days, approved`)
      : "Not attached"}</b></div>
    <div class="row"><span>Photographs</span><b>${nPhoto}</b></div>
    <div class="row"><span>Video</span><b>${videoWanted ? nVideo : "Not in this package type"}</b></div>
    <div class="row"><span>Documents</span><b>${nDoc}</b></div>
    <div class="row"><span>Evidence index</span><b>${items.length} exhibit${items.length === 1 ? "" : "s"}</b></div>
  </div>`;

  /* P13 — video delivery, honestly. A copy button only when a link exists;
     otherwise the state of the world in plain words. */
  /* A delivery link is the OTHER way held-back material reaches a client, and
     it used to be filtered on the link alone — HIGH #4 (2026-08-14). The
     document now refuses anything not client-deliverable, but a share URL sits
     beside it with a Copy button and hands over the same file, so hold a video
     back and the document dropped it while the link still shipped it. The link
     is only offered while the evidence behind it is IN this package and still
     cleared to ship; `ev` already excludes deleted rows, so a deleted file has
     no link to copy either. Provider-side revocation is a separate thing and
     is not built (Dropbox is unconfigured) — this stops the portal OFFERING a
     link it should not, which is the half that exists to be got wrong today. */
  const shares = (PKG.external_files || []).filter(x => {
    if(!x.external_share_url || x.share_revoked_at) return false;
    const e = ev.find(y => y.id === x.evidence_id);
    return !!e && eligible(e) && inPkg(e.id);
  });
  const dropboxOff = PKG.providers && PKG.providers.dropbox && !PKG.providers.dropbox.configured;
  const delivery = nVideo ? `<div class="feebox" style="margin:10px 0">
    <div class="row"><span><b>Video delivery</b></span><span></span></div>
    ${shares.length ? shares.map(x => `
      <div class="row"><span>${esc(x.delivery_name || "Video link")}</span>
        <button class="btn sm" data-act="pkgCopyLink" data-url="${esc(x.external_share_url)}">Copy video link</button></div>
      ${x.share_expires_at ? `<div class="row"><span style="color:var(--muted);font-size:.82rem">Expires</span><span>${when(x.share_expires_at)}</span></div>` : ""}
      ${x.share_created_at ? `<div class="row"><span style="color:var(--muted);font-size:.82rem">Created</span><span>${when(x.share_created_at)}</span></div>` : ""}`).join("")
    : `<div class="row"><span style="color:var(--muted);font-size:.85rem">${dropboxOff
        ? "Dropbox is not connected — video is provided separately for now."
        : "No delivery link yet."}</span><span></span></div>`}
  </div>` : "";

  /* UIBUILD P14 — the completed package: every artifact, its state, one door. */
  const completedView = `
    ${contents}${delivery}
    <div class="feebox">
      <div class="row"><span><b>Package finalized</b> &mdash; v${b.version}</span>
        <span>${when(b.finalized_at)}</span></div>
      ${b.delivered_at ? `<div class="row"><span>Delivered</span><span>${when(b.delivered_at)}</span></div>` : ""}
      <div class="row"><span>${pkgMark(PKG.approved_report ? "done" : "none")} Final report</span>
        <button class="btn sm ghost" data-act="wsTab" data-tab="reports">Open report</button></div>
      <div class="row"><span>${pkgMark(nPhoto ? "done" : "none")} Photographs (${nPhoto})</span>
        <button class="btn sm ghost" data-act="evJump" data-t="photos">View</button></div>
      ${videoWanted ? `<div class="row"><span>${pkgMark(nVideo ? "done" : "none")} Video (${nVideo})</span>
        ${shares.length
          ? `<button class="btn sm" data-act="pkgCopyLink" data-url="${esc(shares[0].external_share_url)}">Copy delivery link</button>`
          : `<span style="color:var(--muted);font-size:.82rem">Provided separately</span>`}</div>` : ""}
      <div class="row"><span>${pkgMark(items.length ? "done" : "none")} Evidence index (${items.length})</span>
        <span style="color:var(--muted);font-size:.82rem">In the package document</span></div>
      <div class="row"><span>${pkgMark(inv ? (inv.status === "paid" ? "done" : "part") : "none")} Invoice${inv ? " — " + esc(label(inv.status)) : ""}</span>
        <button class="btn sm ghost" data-act="tab" data-tab="invoices">View</button></div>
      <div class="row"><span>${pkgMark("done")} Client package</span>
        <button class="btn sm" data-act="pkgPrint">Download</button></div>
    </div>
    <div class="actions">
      ${!b.delivered_at ? `<button class="btn ghost" data-act="pkgDelivered">Mark delivered</button>` : ""}
      <button class="btn ghost" data-act="pkgReopen">Reopen and rebuild</button>
    </div>`;

  return `${blocks}${stepsRail}${missing}${pkgWithheldNote()}
    ${b.status === "draft" ? `
      ${contents}${delivery}
      ${daysPanel()}
      <label class="f" style="max-width:340px"><span>Package type</span>
        <select data-act="pkgType">
          ${[["report_only","Report only"],["report_photos","Report + photos"],
             ["report_photos_video","Report + photos + video link"],["full","Full client package"],
             ["custom","Custom package"]]
            .map(([v, l]) => `<option value="${v}" ${ptype === v ? "selected" : ""}>${l}</option>`).join("")}
        </select></label>
      ${ptype === "custom" ? `<p class="hint" style="margin:-4px 0 10px">The contents below are
        exactly what ships. Only the client-deliverable rule still applies.</p>` : ""}
      ${pick(photos, "Photos")}${pick(videos, "Video")}${pick(others, "Documents")}
      <div class="actions" style="border-top:1px solid var(--line);padding-top:12px;margin-top:10px">
        <button class="btn ghost" data-act="pkgPrint">Preview package</button>
        <button class="btn" data-act="pkgFinalize">Finalize the package</button>
      </div>`
    : completedView}
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    ${doc}`;
}

/* MASTER §13 — "Do not assume one case = one day." Which approved days the
   package carries, which are still out, and the Combined Summary that only
   makes sense once there is more than one. */
function daysPanel(){
  const b = PKG && PKG.build;
  if(!b) return "";
  const reps = PKG.reports || [];
  const avail = PKG.available_reports || [];
  const draft = b.status === "draft";
  const rows = reps.map((r, i) => `<div class="row">
      <span><b>Investigation &mdash; Day ${i + 1}</b> &middot; ${esc(fmtDay(r.report_date))}${
        r.hours != null ? ` &middot; ${esc(String(r.hours))} h` : ""}${
        r.investigator ? ` &middot; ${esc(r.investigator)}` : ""}</span>
      ${draft && reps.length > 1
        ? `<button class="btn sm ghost" data-act="pkgRepRemove" data-id="${r.id}">Remove</button>`
        : `<span style="color:var(--muted);font-size:.82rem">${esc(label(r.status))}</span>`}
    </div>`).join("");
  const availRows = draft ? avail.map(r => `<div class="row">
      <span style="color:var(--muted)">${esc(fmtDay(r.report_date))} &mdash; approved, not in the package</span>
      <button class="btn sm" data-act="pkgRepAdd" data-id="${r.id}">Add day</button>
    </div>`).join("") : "";
  const total = reps.reduce((n, r) => n + (Number(r.hours) || 0), 0);
  return `<div class="feebox" style="margin:10px 0">
    <div class="row"><span><b>Days in this package</b></span>

      &mdash; approve a daily report and it appears here.</span><span></span></div>`}
    ${availRows}
  </div>
  ${reps.length > 1 && draft ? `<label class="f"><span>Combined summary
    <span class="opt">optional &mdash; opens the multi-day report</span></span>
    <textarea data-act="pkgSummary" rows="4" placeholder="One paragraph covering the investigation as a whole. The dates, days, hours and exhibit counts below are filled in for you.">${esc(PKG.summary || "")}</textarea></label>` : ""}`;
}

/* The factual half of the Combined Summary: derived at render time, never
   stored, so adding a day cannot leave a stale sentence behind. */
function pkgSynopsis(reps, nPhoto, nVideo){
  if(!reps.length) return "";
  const hours = reps.reduce((n, r) => n + (Number(r.hours) || 0), 0);
  const miles = reps.reduce((n, r) => n + (Number(r.miles) || 0), 0);
  const first = fmtDay(reps[0].report_date);
  const last = fmtDay(reps[reps.length - 1].report_date);
  const span = reps.length === 1 ? `on ${first}` : `between ${first} and ${last}`;
  const bits = [`${reps.length} day${reps.length === 1 ? "" : "s"} of surveillance ${span}`];
  if(hours) bits.push(`${Math.round(hours * 10) / 10} hours of documented field time`);
  if(miles) bits.push(`${Math.round(miles)} miles travelled`);
  const ex = [];
  if(nPhoto) ex.push(`${nPhoto} photograph${nPhoto === 1 ? "" : "s"}`);
  if(nVideo) ex.push(`${nVideo} video exhibit${nVideo === 1 ? "" : "s"}`);
  if(ex.length) bits.push(ex.join(" and ") + " are included");
  return bits.join("; ") + ".";
}

/* The document — exactly what prints (case information, objective, each
   investigation day, combined summary, photographs, video listing, evidence
   index). Photos are embedded; video is listed, never embedded.

   Every <img> points at the ORIGINAL evidence route. The document holds no
   copy and writes nothing back, so printing a package can never overwrite
   the evidence it was built from (MASTER §13). */
function pkgDocHtml(){
  const b = PKG && PKG.build;
  if(!b) return "";
  const items = PKG.items || [];
  const evById = Object.fromEntries((PKG.evidence || []).map(e => [e.id, e]));
  /* The document prints only what is still cleared to ship — HIGH #4
     (2026-08-14). The finalize gate refuses held-back material, but it runs at
     finalize and nothing re-ran afterwards: reclassify a photo to "do not use"
     on a package already finalized and it went on printing, while the gate
     strip that would have said so was suppressed on exactly the finalized
     builds where Download still worked. Held-back material reaching a client
     is the single outcome the classification system exists to prevent, so the
     check belongs where the material is rendered, not only where it is
     approved. Withheld items are COUNTED and named below rather than silently
     dropped — a document that quietly loses an exhibit is its own problem. */
  const rows = pkgShipping().ship.map((i, n) => {
    const e = evById[i.evidence_id] || {};

      </div>
    </div>
    ${infoRows.length ? `<h3>CASE INFORMATION</h3>
      <table class="doc-table"><tbody>${infoRows.map(([k, v]) =>
        `<tr><td style="width:34%"><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join("")}</tbody></table>` : ""}
    ${ci && ci.objective ? `<h3>ASSIGNMENT OBJECTIVE</h3>
      <div style="white-space:pre-line;font-size:.95rem">${esc(ci.objective)}</div>` : ""}
    ${reps.length > 1 ? `<h3>COMBINED SUMMARY</h3>
      ${PKG.summary ? `<div style="white-space:pre-line;font-size:.95rem;margin-bottom:8px">${esc(PKG.summary)}</div>` : ""}

/* Printing re-reads the package first — HIGH #4 (2026-08-14). The document
   filters held-back material at RENDER time, which is only as fresh as the DOM
   it rendered into. The package tab loads once on entry, so an admin who held
   something back from another tab, another device or the Evidence tab of a
   second window could still hit Download here and print the copy this screen
   drew before the change. Reloading first costs one request at the only moment
   that matters, and it is the moment the file leaves the building. If the
   reload fails the print is abandoned rather than falling back on stale data —
   printing nothing is recoverable, printing held-back material is not. */
async function pkgPrint(){
  await loadPackage();
  if(!PKG){ WS_ERR = WS_ERR || "Could not re-check the package before printing."; paintCase(); return; }
  document.body.classList.add("printing-package");
  window.print();
  setTimeout(() => document.body.classList.remove("printing-package"), 400);
}

async function pkgApi(path, body){
  WS_ERR = "";
  try{ PKG = await api(path, {method: "POST", body: body || {}}); }
  catch(e){
    WS_ERR = e.message;
    if(e.gates) WS_ERR = "Not ready: " + e.gates.join(" ");
    await loadPackage(); return;
  }
  paintCase();
}

/* The case, in the same shape a /packages row has — so the overview reuses
   pkgProgress and pkgNextStep instead of growing a second opinion (P24). */
function wsPkgShape(){
  const days = (WS && WS.days) || [];
  const live = ((WS && WS.evidence) || []).filter(e => !e.deleted_at);
  const reports = (WS && WS.reports) || [];
  const best = reports.find(r => ["approved", "delivered"].includes(r.status))
            || reports.find(r => r.status === "submitted") || reports[0] || null;
  return {
    activity_count: ((WS && WS.activity) || []).filter(e => !e.removed_at).length,
    report_status: best ? best.status : null,
    photos: live.filter(e => String(e.content_type || "").startsWith("image/")).length,
    videos: live.filter(e => String(e.content_type || "").startsWith("video/")).length,
    build_status: (WS && WS.build_status) || null,
    invoice_status: (WS && WS.invoice_status) || null,
    days: days.length,
    open_day: days.some(d => !d.end_time),
  };
}

/* ===================== Active Surveillance Mode (SURVEILLANCE.md) =========
   THE RULE, from the owner: this is a VIEW of the existing case. Same login,
   same case, same investigation day, same activity log, same evidence, same
   report. There is no surveillance table and there must never be one — leave
   the mode and everything is already in the normal portal.
   ========================================================================= */

/* The timer derives from the SERVER's record of when the day was started
   (case_days.created_at), corrected by the skew measured against the Worker's
   own clock. Nothing counts ticks, so sleeping the phone, reloading, or a
   device clock that is simply wrong cannot move it (P2). */
/* Breaks are subtracted, and a running pause FREEZES the display — because
   `paused_at` is a server instant, so the number stops moving without anything
   here counting or stopping a tick. Same rule as always: every quantity in
   this sum comes from the server. */
function svElapsed(){
  const d = WS && WS.open_day;
  if(!d || !d.started_at) return null;
  const upto = d.paused_at ? Date.parse(d.paused_at) : (Date.now() + SV_SKEW);
  const ms = upto - Date.parse(d.started_at) - (Number(d.paused_ms) || 0);
  return ms > 0 ? ms : 0;
}
function svPaused(){ return Boolean(WS && WS.open_day && WS.open_day.paused_at); }
function svClock(ms){
  const s = Math.floor(ms / 1000);
  const p = n => String(n).padStart(2, "0");
  return `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
}
function svTickStart(){
  if(SV_TICK) clearInterval(SV_TICK);
  SV_TICK = setInterval(() => {
    const el = $("svTimer"), ms = svElapsed();
    if(el && ms != null) el.textContent = svClock(ms);
  }, 1000);
}
function svTickStop(){ if(SV_TICK){ clearInterval(SV_TICK); SV_TICK = null; } }

async function openSurveillanceLauncher(){
  SV = {tab: "launcher", entry: null, heard: null, err: "", ok: "", cat: "arrival", search: ""};
  document.body.classList.add("surv");
  paint();
  try{ SV.launcher = await api("/my/active"); }
  catch(e){ SV.launcher = {active: null, assignments: []}; SV.err = e.message; }
  paint();
}

async function enterSurveillance(caseNo){
  SV = {tab: "home", entry: null, heard: null, err: "", ok: "", cat: "arrival", search: ""};
  document.body.classList.add("surv");
  if(WS_CASE !== caseNo || !WS){
    WS_CASE = caseNo; WS = null;
    paint();
    try{
      const [sub, ws] = await Promise.all([
        api("/submissions/" + encodeURIComponent(caseNo)),
        api("/cases/" + encodeURIComponent(caseNo) + "/workspace"),
      ]);
      WS = { ...ws, submission: sub.submission };
    }catch(e){ SV.err = e.message; }
  }
  if(WS && WS.server_now) SV_SKEW = Date.parse(WS.server_now) - Date.now();
  svTickStart();
  paint();
}
function exitSurveillance(){
  svTickStop();
  SV = null;
  document.body.classList.remove("surv");
  VIEW = "case"; WS_TAB = "overview";
  paint();
}
async function svReload(){
  try{
    const ws = await api("/cases/" + encodeURIComponent(WS_CASE) + "/workspace");
    WS = { ...ws, submission: WS ? WS.submission : null };
    if(ws.server_now) SV_SKEW = Date.parse(ws.server_now) - Date.now();
  }catch(e){ SV.err = e.message; }
  paint();
}

/* Voice (P8). Level 1 is the phone's own keyboard dictation, which every text
   field here already accepts. Level 2 is this: the browser's speech API where
   it exists, ALWAYS reviewed before it becomes a log entry — nothing spoken is
   ever submitted straight into the record. */
function svMicHtml(){
  const supported = typeof window !== "undefined"
    && (window.SpeechRecognition || window.webkitSpeechRecognition);
  if(SV.heard != null){
    return `<div class="sv-heard">
      <div style="font-weight:800;margin-bottom:6px">Heard &mdash; read it before it goes in</div>
      <textarea id="sv_heard" rows="4">${esc(SV.heard)}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn sm" data-act="svUseText">Use this text</button>

      </div>
      <div style="font-size:.78rem;color:#5c6775;margin-top:8px">
        Dictation is handled by your device or browser; this page keeps no audio.
        Nothing is logged until you press Use.</div>
    </div>`;
  }
  if(!supported){
    return `<button class="sv-mic" data-act="svNoMic">&#127908; Tap to speak
      <div style="font-weight:400;font-size:.78rem;opacity:.75;margin-top:4px">
        Not available in this browser &mdash; the keyboard's own dictation works in every field</div></button>`;
  }
  return `<button class="sv-mic ${SV.listening ? "live" : ""}" data-act="svMic">
    ${SV.listening ? "&#9679; Listening&hellip; tap to stop" : "&#127908; Tap to speak"}</button>`;

/* INTAKE-NA: what a marked-unavailable field says on an admin's screen. The
   submitter chose these words' meaning on the form; the review repeats them
   rather than showing a blank that reads as an error. */
const NA_WORDS = { not_available: "Not available at submission", unknown: "Unknown at submission",
  approximate: "Approximate", asap: "As soon as available", flexible: "Flexible",
  tbd: "To be determined", pending: "Authorization pending" };

/* Intentionally-unavailable fields, in words — the INFORMATION STILL NEEDED
   summary. Reads the redacted payload it is given, so an investigator's copy
   lists only what they can already see. */
function stillNeeded(p, claim){
  const map = [
    ["claim_number", "Claim number"], ["date_of_loss", "Date of loss"],
    ["subject_address", claim ? "Claimant address" : "Subject address"],
    ["subject_description", "Vehicle / description"],
    ["start_date", "Requested start"], ["authorized_hours", "Authorization"],
    ["billing_email", "Billing contact"],
  ];
  const items = [];
  for(const [k, lbl] of map){
    const st = p[k + "_status"];
    if(st === "approximate" && p[k]) items.push(`${lbl} — approximate`);
    else if(st && !p[k]) items.push(`${lbl} — ${(NA_WORDS[st] || st).toLowerCase()}`);
  }
  return items;
}

/* Completeness reads as words, never a score (INTAKE-NA). */
function completeness(s){
  const p = s.payload || {};
  const claim = s.kind === "claims";
  const contact = p.client_email || p.client_phone || p.adjuster_email || p.adjuster_phone;
  const identity = claim ? (p.carrier && (p.subject_name || p.claim_number)) : p.client_name;
  if(!contact || !identity) return ["Missing critical information", "rs-needs_revision"];
  if(stillNeeded(p, claim).length) return ["Additional information helpful", "rs-submitted"];
  return ["Ready for review", "rs-approved"];
}

/* The intake detail, split so the workspace can show what the field needs
   (subject) apart from what the office needs (everything). Both read from the
   same submission — the Worker has already removed whatever this role may not
   see, so nothing here decides that. */
function detailList(s, mode){
  const p = s.payload || {};
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
  const rowS = (k, v, st) => v
    ? `<dt>${esc(k)}</dt><dd>${esc(v)}${st === "approximate" ? ' <i style="color:var(--muted)">(approximate)</i>' : ""}</dd>`
    : st ? `<dt>${esc(k)}</dt><dd><i style="color:var(--muted)">${esc(NA_WORDS[st] || "Not available yet")}</i></dd>` : "";
  const claim = s.kind === "claims";
  const sig = safeImage(p.signature);

  const needed = stillNeeded(p, claim);
  const neededBox = needed.length ? `<div class="note" style="margin-bottom:12px">
    <b>Information still needed</b> — marked unavailable at submission on purpose, never an error.
    <ul style="margin:6px 0 0 18px">${needed.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    <div style="margin-top:8px"><button class="btn sm ghost" data-act="wsTab" data-tab="comms">Request it via the Comm log</button>
      <span style="font-size:.8rem;color:var(--muted)">The assignment is never treated as lost — details arrive as the case develops.</span></div>
  </div>` : "";

  if(mode === "subject"){
    return `${neededBox}<dl class="detail">
      ${row(claim ? "Claimant" : "Subject", p.subject_name)}${rowS("Address", p.subject_address, p.subject_address_status)}
      ${rowS("Description", p.subject_description, p.subject_description_status)}
      ${row(claim ? "Injury & restrictions" : "Relationship", p.subject_relationship)}
      ${row("Prior surveillance", p.prior_surveillance)}
      ${row(claim ? "Scope" : "Objective", p.objective)}
      ${row("Permitted days", p.permitted_days)}${row("Permitted times", p.permitted_times)}
      ${row("Weekend", p.weekend_authorized)}${row("Geographic limits", p.geographic_limits)}
      ${row("Field notes", p.notes)}
    </dl>`;
  }
  const [words, tone] = completeness(s);
  return `${ME.role === "admin" ? `<div style="margin-bottom:10px"><span class="tag ${tone}">${esc(words)}</span></div>` : ""}
  ${neededBox}
  <dl class="detail">
    ${claim ? `${row("Carrier / TPA", p.carrier)}${rowS("Claim number", p.claim_number, p.claim_number_status)}${row("Policy number", p.policy_number)}
               ${row("Claim type", p.claim_type)}${rowS("Date of loss", p.date_of_loss, p.date_of_loss_status)}${row("Adjuster", p.adjuster)}
               ${row("Adjuster email", p.adjuster_email)}${row("Adjuster phone", p.adjuster_phone)}
               ${row("Defense counsel", p.defense_counsel)}` : ""}
    ${row(claim ? "Assigning contact" : "Client", p.client_name)}${row("Phone", p.client_phone)}${row("Email", p.client_email)}
    ${claim ? "" : `${row("Address", p.client_address)}${row("Best time", p.best_time)}`}
    ${row(claim ? "Claimant" : "Subject", p.subject_name)}
    ${row(claim ? "Scope" : "Objective", p.objective)}
    ${/* MASTER-HANDOFF §7: what the client picked on the intake is REQUESTED.
          Calling it "authorized" would read as though the firm had approved a
          package the client chose for themselves. The confirmed figure is the
          one an admin sets on the Authorization panel, and only that one is
          ever paired with money. */""}
    ${rowS("Requested authorization", p.authorized_hours, p.authorized_hours_status)}${row("Not to exceed", p.not_to_exceed)}
    ${rowS("Requested start", p.start_date, p.start_date_status)}${row("Priority", p.priority)}
    ${row(claim ? "Deadline" : "Timeline", p.timeline)}${row("Attachments", p.attachments)}
    ${claim ? `${row("Billing reference", p.billing_reference)}${rowS("Invoices to", p.billing_email, p.billing_email_status)}${row("Billing notes", p.billing_notes)}` : ""}
    ${row(claim ? "Authorized by" : "Signed by", p.signed_name)}
    ${row("Received", when(s.created_at))}
  </dl>
  ${sig ? `<div><div style="font-size:.8rem;color:var(--muted)">Signature</div><img class="sig" src="${esc(sig)}" alt="signature"></div>` : ""}`;
}

function subjectsPanel(s){
  if(!WS) return "";
  const subs = WS.subjects || [];
  const p = (s && s.payload) || {};
  const fr = (l, v) => v ? `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>` : "";

  const vehLine = v => `<div class="tl-m">${esc([v.year, v.color, v.make, v.model].filter(Boolean).join(" "))}${
      v.plate ? ` &mdash; ${esc(v.plate)}${v.plate_state ? " (" + esc(v.plate_state) + ")" : ""}` : ""}
      <button class="btn sm ghost" data-act="vehEdit" data-sid="${v.subject_id}" data-vid="${v.id}">Edit</button></div>
    ${v.registered_owner ? `<div class="tl-n">Registered to ${esc(v.registered_owner)}</div>` : ""}
    ${v.notes ? `<div class="tl-n">${esc(v.notes)}</div>` : ""}`;

  const card = sub => {
    const editing = SUBJ_FORM && SUBJ_FORM.mode === "edit" && SUBJ_FORM.id === sub.id;
    return `<div class="rcard" style="cursor:default">
      <div class="rc-h"><b>${esc(sub.name)}</b>${sub.alias ? ` <span class="tl-m">&ldquo;${esc(sub.alias)}&rdquo;</span>` : ""}
        ${!SUBJ_FORM ? `<button class="btn sm ghost" data-act="subjEdit" data-id="${sub.id}">Edit</button>
        <button class="btn sm ghost" data-act="vehAdd" data-sid="${sub.id}">Add vehicle</button>` : ""}</div>
      ${editing ? subjForm(sub, sub.id) : `<dl class="detail">
        ${fr("Date of birth", sub.dob)}${fr("Height", sub.height)}${fr("Weight", sub.weight)}
        ${fr("Hair", sub.hair)}${fr("Descriptors", sub.descriptors)}${fr("Addresses", sub.addresses)}
        ${fr("Employer", sub.employer)}${fr("Phone", sub.phone)}
        ${fr("Social accounts", sub.social_accounts)}${fr("Notes", sub.notes)}
      </dl>`}
      ${(sub.vehicles || []).length && !editing ? `<div style="margin-top:4px"><b style="font-size:.85rem">Vehicles</b>${sub.vehicles.map(vehLine).join("")}</div>` : ""}
      ${(() => {
        const media = ((WS && WS.evidence) || []).filter(e => e.subject_id === sub.id && !e.deleted_at);
        return media.length && !editing ? `<div style="margin-top:6px"><b style="font-size:.85rem">Photos &amp; files</b>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${media.map(e => {
            const href = `/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${e.id}/file`;
            return String(e.content_type || "").startsWith("image/")
              ? `<a href="${href}" target="_blank" rel="noopener"><img src="${href}" alt="${esc(e.filename)}"
                   style="max-height:72px;border-radius:6px;border:1px solid var(--line)"></a>`
              : `<a class="tag rs-draft" style="text-decoration:none" href="${href}" target="_blank" rel="noopener">${esc(e.filename)}</a>`;
          }).join("")}</div></div>` : "";
      })()}
      ${SUBJ_FORM && SUBJ_FORM.mode === "veh" && SUBJ_FORM.sid === sub.id ? vehForm(sub) : ""}
    </div>`;
  };

  return `<h3 style="margin:18px 0 6px;font-size:1rem">Subjects &amp; vehicles</h3>
    ${subs.length ? `<div class="rlist">${subs.map(card).join("")}</div>`
      : `<p class="hint">No structured subject records yet. The intake snapshot above stays as
         received; records added here are the working copy the field can keep current.</p>`}
    ${SUBJ_FORM && SUBJ_FORM.mode === "new" ? subjForm(SUBJ_FORM.pre, null) : ""}
    ${!SUBJ_FORM ? `<div style="margin-top:8px">
        <button class="btn sm" data-act="subjNew">Add a subject</button>
        ${!subs.length && p.subject_name ? `<button class="btn sm ghost" data-act="subjFromIntake">Start from the intake subject</button>` : ""}
      </div>` : ""}`;
}

async function saveSubjectRec(id){
  WS_ERR = "";
  const body = {};
  for(const k of ["name","alias","dob","height","weight","hair","descriptors","addresses","employer","phone","social_accounts","notes"]){
    const el = $("sf_" + k);
    if(el) body[k] = el.value;
  }
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/subjects` + (id ? `/${id}` : ""), {method:"POST", body});
    SUBJ_FORM = null;
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function saveVehicleRec(sid, vid){
  WS_ERR = "";
  const body = {};
  for(const k of ["year","make","model","color","plate","plate_state","registered_owner","notes"]){
    const el = $("vf_" + k);
    if(el) body[k] = el.value;
  }
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/subjects/${sid}/vehicles` + (vid ? `/${vid}` : ""), {method:"POST", body});
    SUBJ_FORM = null;
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}


/* ------------------------------------------------------------- invoices */

/* The office's money desk (INVOICING.md). Admin-only — nothing here is ever
   rendered for an investigator, and the Worker refuses them anyway. The
   document block below is exactly what prints: Print / Save as PDF hides
   everything else on the page. */
const INV_STATUS_LABEL = s => ({draft:"Draft", ready:"Ready", sent_to_bill:"Sent to BILL",
  sent_to_client:"Sent to client", partially_paid:"Partially paid", paid:"Paid",
  overdue:"Overdue", void:"Void"})[s] || s;
const usd = n => "$" + Number(n || 0).toLocaleString("en-US",
  {minimumFractionDigits: (Number(n) % 1 ? 2 : 0), maximumFractionDigits: 2});

function invoicesView(){
  if(INV_OPEN) return invoiceDetailView();
  if(!INVOICES) return `<div class="card"><div class="empty">Loading invoices&hellip;</div></div>`;
  const sm = INVOICES.summary || {};
  const stat = (label, v, tone) => `<div class="stat ${tone || ""}">
    <div class="stat-n">${v}</div><div class="stat-l">${esc(label)}</div></div>`;
  const rows = (INVOICES.invoices || []).map(i => `<tr data-act="invOpen" data-id="${i.id}" style="cursor:pointer">
      <td><b>${esc(i.invoice_no)}</b><div class="mono">${esc(i.case_no)}</div></td>
      <td class="hide">${esc((i.bill_to || "").split("\n")[0])}${i.refs.claim_number ? `<div class="mono">${esc(i.refs.claim_number)}</div>` : ""}</td>
      <td class="hide">${esc(fmtDay(i.issue_date || "") || "—")}</td>
      <td>${esc(fmtDay(i.due_date || "") || "—")}</td>
      <td>${usd(i.total)}</td>
      <td>${usd(i.balance_due)}</td>
      <td><span class="tag ${esc(i.display_status)}">${esc(INV_STATUS_LABEL(i.display_status))}</span></td>
    </tr>`).join("");
  return `<div class="stats">
      ${stat("Outstanding", usd(sm.outstanding), sm.outstanding ? "warn" : "")}
      ${stat("Due soon", sm.due_soon || 0)}
      ${stat("Overdue", sm.overdue || 0, sm.overdue ? "warn" : "")}
      ${stat("Paid this month", usd(sm.paid_this_month))}
      ${stat("Drafts", sm.drafts || 0)}
    </div>
    <div class="card">
      <div class="bar"><h2 style="margin:0">Invoices</h2>
        <select data-act="invFilterStatus">
          ${[["","All statuses"],["draft","Draft"],["ready","Ready"],["sent_to_bill","Sent to BILL"],
             ["overdue","Overdue"],["partially_paid","Partially paid"],["paid","Paid"],["void","Void"]]
            .map(([v,l]) => `<option value="${v}" ${INV_FILTER.status === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <select data-act="invFilterType">
          ${[["","Both sides"],["insurance","Insurance"],["private","Private"]]
            .map(([v,l]) => `<option value="${v}" ${INV_FILTER.type === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <input data-act="invFilterQ" placeholder="Search # / case / claim" value="${esc(INV_FILTER.q)}" style="max-width:220px">
      </div>
      ${rows ? `<div style="overflow-x:auto"><table>
          <thead><tr><th>Invoice</th><th class="hide">Bill to</th><th class="hide">Issued</th>
            <th>Due</th><th>Amount</th><th>Balance</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`
        : `<div class="empty">No invoices${INV_FILTER.status || INV_FILTER.type || INV_FILTER.q ? " match" : " yet — open a case and use Create invoice"}.</div>`}
      ${INV_MSG ? `<div class="note" style="margin-top:8px">${esc(INV_MSG)}</div>` : ""}
    </div>`;
}

function invoiceDocHtml(i){
