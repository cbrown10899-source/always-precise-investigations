/* Priority 6 — evidence, with the free-plan failsafe. Uploads land in the
   private R2 bucket through the Worker, which refuses anything that could
   push the account past the free tier. Both roles upload and read on their
   cases; classification and deletion are the office's. */
/* THE OFFICE DOOR into the same generator Active Surveillance opens, and the
   record of every timestamped copy made for this case.

   There is no video in the portal to list. Video is device-first (owner,
   2026-08-17): the original stays on the device that shot it and the copy is
   made and saved there, so what the portal holds is the record — which
   original, starting at what instant, in what zone, by whom, whether a later
   correction replaced it, and whether it reached a device. `vstLabel` re-derives
   the wording from the stored instant and zone, so the line here is the same
   text that was burned into the picture rather than a second rendering of it. */
/* THE PHOTOGRAPH'S OWN CARD on the media screen, beside the video one rather
   than inside it: that card's paragraph is about clips on a device, and a
   control saying "Photo timestamp" underneath it would have the screen
   explaining the wrong thing.

   It counts only LIVE copies. A superseded one is still in the case and still
   in the gallery, but "3 timestamped photographs" when two of them were
   corrections of the same picture is a number that misleads at a glance. */
function pstPanelHtml(){
  const rows = (WS && WS.photo_stamps) || [];
  const live = rows.filter(r => !r.superseded_at).length;
  return `<div class="card" style="margin-bottom:14px">
    <div class="rc-h"><b>Photo timestamp</b>${live ? `<span class="tag">${live}</span>` : ""}</div>
    <p class="hint" style="margin:4px 0 8px">Pick a photograph already on this case and the date
      and time are burned into the bottom-right corner of a copy. The original is never changed
      &mdash; the copy is filed beside it and both stay in the case.</p>
    <button class="btn sm" data-act="pstLaunch" data-case="${esc(WS_CASE)}">Photo timestamp</button>
  </div>`;
}

function vstPanelHtml(){

    <div class="rc-h"><b>Video timestamp</b>${rows.length ? `<span class="tag">${rows.length}</span>` : ""}</div>
    <p class="hint" style="margin:4px 0 8px">Pick the clip on this device, set the moment it

    <button class="btn sm" data-act="vstOpen" data-case="${esc(WS_CASE)}">Video timestamp</button>
    ${rows.length ? `<div style="margin-top:10px">${rows.map(r => `
      <div class="vsrow ${r.superseded_at ? "old" : ""}">
        <div class="rc-h"><b>${esc(r.original_name)}</b>

        ${r.original_hash ? `<div class="tl-m">SHA-256 ${esc(r.original_hash.slice(0, 16))}&hellip;</div>` : ""}
      </div>`).join("")}</div>`
      : `<div class="empty" style="margin-top:8px">No timestamped copy has been made on this case yet.</div>`}
  </div>`;
}

/* UNIT 11 — EVIDENCE INTEGRITY on the page.

   The page DRAWS the record and asks; every answer is the Worker's. Nothing
   here computes a hash, fetches a byte or decides who may act — the buttons
   are admin-only because the routes are, and the block renders for both roles
   because the workspace already sends each role exactly what it may see. */
let EV_VERIFY = {};   // evidence id -> the verify answer, transient until repaint asks again
let EV_IBUSY = 0;     // evidence id currently being recorded/verified
let MAN = null, MAN_ERR = "", MAN_OPEN = false, MAN_BUSY = false;

function integRecFor(id){
  const list = (WS && WS.integrity) || [];
  return Array.isArray(list) ? list.find(r => r.artifact_kind === "evidence" && r.artifact_id === id) : null;
}

function integHtml(e){
  const admin = ME.role === "admin";
  /* Null means the TABLE has not arrived — unknown, which is not the same as
     "not recorded", and the card must not claim either way. */
  if(!WS || WS.integrity === null || WS.integrity === undefined) return "";
  if(e.deleted_at) return "";
  const r = integRecFor(e.id);
  const v = EV_VERIFY[e.id];
  const busy = EV_IBUSY === e.id;
  const roleLine = r
    ? (r.artifact_role === "derivative"
        ? `Timestamped derivative${r.source_ref ? ` &middot; <span class="im">source: ${esc(r.source_ref)}</span>` : ""}`
        : "Original")
    : "";
  const abbr = h => h ? `${h.slice(0, 4)}&hellip;${h.slice(-4)}` : "";
  const verdict = !v ? "" :
    v.status === "match" ? `<div class="iv-match">Current bytes match the recorded hash.</div>` :
    v.status === "mismatch" ? `<div class="iv-mismatch">Current bytes do NOT match the recorded hash.</div>
        <div class="hash">now: ${esc(v.current_sha256 || "")}</div>` :
    v.status === "not_recorded" ? `<div class="im">No hash recorded yet — nothing to compare.</div>` :
    `<div class="iv-un">Could not be checked right now${v.code === "too_large" ? " — the file is larger than this check can hold" : ""}. ${esc(v.message && v.message.includes("removed") ? "The file was removed from the case." : "")}</div>`;
  return `<div class="integ" data-eid="${e.id}">
      <div class="ih">Integrity
        ${r && r.sha256 ? `<span class="tag rs-approved">Hash recorded</span>` : `<span class="tag rs-draft">Not yet recorded</span>`}
      </div>
      ${r ? `<div class="im">${roleLine}</div>
        <div>SHA-256: <span class="hash">${abbr(r.sha256)}</span>
          <button class="btn sm ghost" data-act="ihCopy" data-hash="${esc(r.sha256 || "")}">Copy</button></div>
        <details><summary>Full hash</summary><div class="hash">${esc(r.sha256 || "")}</div></details>
        <div class="im">Recorded ${when(r.recorded_at)}${r.recorded_by ? ` &middot; ${esc(r.recorded_by)}` : ""}
          &middot; ${r.hash_origin === "device" ? "hashed on the generating device" : "hashed by the portal"}
          &middot; ${r.storage_provider === "dropbox" ? "Dropbox" : r.storage_provider === "r2" ? "Cloudflare" : esc(r.storage_provider || "")}</div>`
      : `<div class="im">No hash has been captured for this file yet.</div>`}
      ${verdict}
      ${admin ? `<div style="margin-top:5px">
          ${r && r.sha256
            ? `<button class="btn sm ghost" data-act="ihVerify" data-id="${e.id}" ${busy ? "disabled" : ""}>${busy ? "Checking&hellip;" : "Verify integrity"}</button>`
            : `<button class="btn sm ghost" data-act="ihRecord" data-id="${e.id}" ${busy ? "disabled" : ""}>${busy ? "Reading&hellip;" : "Record integrity hash"}</button>`}
        </div>` : ""}
    </div>`;
}

async function ihRecord(id){
  EV_IBUSY = id; delete EV_VERIFY[id]; paintCase();
  try {
    const r = await api(`/cases/${encodeURIComponent(WS_CASE)}/evidence/${id}/record-hash`, { method: "POST" });
    /* The workspace copy is what every card draws from; splice the fresh record
       in rather than reloading the whole case for one row. */
    if(r.integrity && Array.isArray(WS.integrity)){
      WS.integrity = WS.integrity.filter(x => !(x.artifact_kind === "evidence" && x.artifact_id === id));
      WS.integrity.unshift(r.integrity);
    }
    if(r.re_recorded && r.changed){
      EV_VERIFY[id] = { status: "mismatch", current_sha256: r.sha256,
        message: "The bytes read now differ from the earlier record — both are kept." };
    }
  } catch(err){ WS_ERR = err.message || "The hash could not be recorded."; }
  EV_IBUSY = 0; paintCase();
}

async function ihVerify(id){
  EV_IBUSY = id; paintCase();
  try { EV_VERIFY[id] = await api(`/cases/${encodeURIComponent(WS_CASE)}/evidence/${id}/verify`, { method: "POST" }); }
  catch(err){ EV_VERIFY[id] = { status: "unavailable", message: err.message || "" }; }
  EV_IBUSY = 0; paintCase();
}

  const other = o => `<div class="man-i">

        ${o.filed_at ? ` &middot; filed ${when(o.filed_at)}` : ""}
        &middot; ${o.hash_origin === "device" ? "hashed on the generating device" : "hashed by the portal"}</div>
      ${o.sha256 ? `<div class="hash">SHA-256 ${esc(o.sha256)}</div>` : ""}
    </div>`;
  return `
    <div class="rc-h" style="margin:2px 0 6px"><b>Evidence manifest</b>
      <button class="btn sm ghost" data-act="manBack">Back to Case media</button>
      <button class="btn sm ghost" data-act="manPrint">Print / save as PDF</button>
      <button class="btn sm ghost" data-act="manOpen">Re-read</button></div>
    ${(MAN.missing_sources || []).length ? `<div class="note">Integrity records are not set up on this
        database yet (run portal-setup once) &mdash; the files are listed without hashes.</div>` : ""}
    <div id="mandoc">
      <h2 style="font-size:1.05rem">Evidence Integrity Manifest &mdash; ${esc(MAN.case_no)}</h2>
      <div class="man-m">${MAN.case && MAN.case.client ? `Client: ${esc(MAN.case.client)} &middot; ` : ""}${MAN.case && MAN.case.subject ? `Subject: ${esc(MAN.case.subject)} &middot; ` : ""}Generated ${when(MAN.generated_at)}</div>
      <div class="man-m" style="margin:4px 0 8px">${MAN.counts.total} file(s) &middot; ${MAN.counts.recorded} with a recorded hash &middot; ${MAN.counts.not_recorded} not yet recorded${MAN.counts.removed ? ` &middot; ${MAN.counts.removed} removed` : ""}</div>
      ${MAN.items.length ? MAN.items.map(item).join("") : `<div class="man-m">No files are stored on this case.</div>`}
      ${MAN.other_artifacts && MAN.other_artifacts.length ? `
        <h3 style="font-size:.92rem;margin:12px 0 2px">Filed report PDFs and timestamped video copies</h3>
        ${MAN.other_artifacts.map(other).join("")}` : ""}
      <div class="man-m" style="margin-top:10px">A recorded SHA-256 states that the portal read exactly
        these bytes when the record was made. It is an integrity record kept by this portal, not a
        third-party authentication.</div>
    </div>`;
}

function evidencePanel(){
  const admin = ME.role === "admin";
  /* The manifest is a VIEW over this same panel's records; opened, it takes the

  if(MAN_OPEN && admin) return manifestHtml();
  const rows = (WS && WS.evidence) || [];
  const mb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
  const clsLabel = c => ({client_deliverable:"Client deliverable", internal_only:"Internal only",
    do_not_use:"Do not use", needs_review:"Needs review", needs_redaction:"Needs redaction"})[c] || c;
  const clsTone = c => c === "client_deliverable" ? "rs-approved" : c === "do_not_use" ? "rs-needs_revision"

  const kindOf = e => String(e.content_type || "").startsWith("image/") ? "photos"

  // The gallery card (UIBUILD P12): the picture leads, the classification is
  // a compact badge, and the admin controls stay small under it.
  const card = e => e.deleted_at

          : `<div class="evtile">${kindOf(e) === "video" ? "&#127909;" : "&#128196;"}</div>`}
        <div class="rc-h" style="margin-top:6px"><b><button class="evlink" data-act="evOpen"
             data-src="${fileUrl(e)}" data-name="${esc(e.filename)}"
             data-type="${esc(e.content_type || "")}"><u>${esc(e.filename)}</u></button></b>
          <span class="tag ${clsTone(e.classification)}">${esc(clsLabel(e.classification))}</span>

        <div class="tl-m">${mb(e.size_bytes)} &middot; ${esc(e.uploaded_by || "")} &middot; ${when(e.uploaded_at)}</div>

  return `

         already on. The heading is the entry point's name; each control below

         when the Worker refuses video would be the screen telling a lie. -->
    <div class="rc-h" style="margin:2px 0 6px"><b>Upload video / picture</b></div>
    <form class="quick" data-act="evUpload">
      <label class="f"><span>Picture or document <span class="opt">the original is never overwritten</span></span>
        <input id="ev_file" type="file" accept="image/*,application/pdf,.doc,.docx,.txt,.rtf,.csv,.xlsx"></label>
      <div class="two">
        ${admin ? `<label class="f"><span>Classification</span>
          <select id="ev_class">${["needs_review","client_deliverable","internal_only","needs_redaction","do_not_use"]
            .map(c => `<option value="${c}">${clsLabel(c)}</option>`).join("")}</select></label>` : ""}
        <label class="f"><span>Note <span class="opt">optional</span></span>
          <input id="ev_note" placeholder="e.g. Subject loading lumber, clip 2 of 3."></label>
      </div>
      <label class="f"><span>Attach to <span class="opt">a subject's photo, or the activity moment a clip documents</span></span>
        <select id="ev_link">
          <option value="">Nothing in particular</option>
          ${((WS && WS.subjects) || []).length ? `<optgroup label="Subjects">
            ${WS.subjects.map(sj => `<option value="s:${sj.id}">${esc(sj.name)}</option>`).join("")}</optgroup>` : ""}
          ${((WS && WS.activity) || []).length ? `<optgroup label="Recent activity">
            ${WS.activity.slice(0, 8).map(a => `<option value="e:${a.id}">${esc(t12(a.at_time))} — ${esc(String(a.description || "").slice(0, 48))}</option>`).join("")}</optgroup>` : ""}
        </select></label>
      <button class="btn" type="submit">Upload picture or document</button>
      <p class="hint">The free-plan failsafe is on: uploads stop before storage could ever bill.

        <b>Video timestamp</b> above makes the timestamped copy there.</p>
      ${WS_NOTICE ? `<div class="note">${esc(WS_NOTICE)}</div>` : ""}
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>
    <!-- CASE MEDIA is what is already here, kept apart from the entry point
         above it: adding and looking at are two different jobs and were reading
         as one panel. -->
    <div class="rc-h" style="margin:14px 0 6px"><b>Case media</b>
      ${admin ? `<button class="btn sm ghost" data-act="manOpen">Evidence manifest</button>` : ""}</div>
    <div class="evtabs">${[["all","All"], ["photos","Photos"], ["video","Video"], ["docs","Documents"]]
      .map(([k, lbl]) => {
        const n = k === "all" ? rows.length : rows.filter(e => !e.deleted_at && kindOf(e) === k).length;
        return `<button class="evtab ${EV_TAB === k ? "on" : ""}" data-act="evTab" data-t="${k}">${lbl}${n ? ` (${n})` : ""}</button>`;
      }).join("")}</div>
    ${(() => {
      const shown = EV_TAB === "all" ? rows : rows.filter(e => !e.deleted_at && kindOf(e) === EV_TAB);
      return shown.length ? `<div class="evgrid">${shown.map(card).join("")}</div>`
        : `<div class="empty">${rows.length ? "Nothing of this type on the case." : "Nothing stored on this case yet."}</div>`;
    })()}
    ${dbxCaseLinksHtml(WS_CASE)}`;
}

async function uploadEvidenceFile(){
  WS_ERR = ""; WS_NOTICE = "";
  const f = $("ev_file") && $("ev_file").files[0];
  if(!f){ WS_ERR = "Pick a file first."; return paintCase(); }
  const fd = new FormData();
  fd.append("file", f);
  if($("ev_class")) fd.append("classification", $("ev_class").value);
  fd.append("note", $("ev_note").value);
  const link = $("ev_link") ? $("ev_link").value : "";
  if(link.startsWith("s:")) fd.append("subject_id", link.slice(2));
  if(link.startsWith("e:")) fd.append("entry_id", link.slice(2));
  try{
    const res = await fetch(`/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence`,
      {method: "POST", credentials: "same-origin", body: fd});
    const d = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(d.error || ("Upload failed (" + res.status + ")"));
    WS_NOTICE = "Stored. " + (d.usage ? d.usage.percent_of_free + "% of the free plan used." : "");
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

/* The Case Package (CASEBUILD.md + UXSIMPLIFY P9/P13/P16/P17). One screen
   that says what is done, what is missing, and finalizes the client package
   behind the Worker's gates. Admin-only — an investigator never selects
   client deliverables. */
let PKG = null;   // buildState from the Worker

async function loadPackage(){
  try{ PKG = await api(`/cases/${encodeURIComponent(WS_CASE)}/build`); }
  catch(e){ PKG = null; WS_ERR = e.message; }
  paintCase();
}

function pkgMark(state){   // done | part | none | warn — never color alone
  return state === "done" ? '<span class="pk-s">&#10003;</span>'
       : state === "part" ? '<span class="pk-s">&#9685;</span>'
       : state === "warn" ? '<span class="pk-s">!</span>'
       : '<span class="pk-s">&#9675;</span>';
}

/* Which selected items still ship, and which do not — HIGH #4 (2026-08-14).
   One place, because the document FILTERS on this and the admin notice COUNTS
   it, and a document that printed one set while the screen reported another
   would be worse than either mistake alone.

   Two different reasons an item does not ship, and they must not be confused:
   buildState's evidence query already drops deleted rows, so a deleted item is
   simply ABSENT from PKG.evidence rather than present-and-reclassified. Calling
   a deleted file "no longer client-deliverable" sends the admin to a
   classification that is not the problem. */
function pkgShipping(){
  const items = (PKG && PKG.items) || [];
  const evById = Object.fromEntries(((PKG && PKG.evidence) || []).map(e => [e.id, e]));
  const ships = e => e && !e.deleted_at && e.classification === "client_deliverable";
  return {
    evById,
    ship: items.filter(i => ships(evById[i.evidence_id])),
    gone: items.filter(i => !evById[i.evidence_id]).length,
    heldBack: items.filter(i => { const e = evById[i.evidence_id]; return e && !ships(e); }).length,
  };
}

/* The admin's half of the same fact, and it lives OUTSIDE #pkgdoc on purpose —
   the print stylesheet makes only #pkgdoc visible, so this is seen on screen
   and never by the client. The office needs to know an exhibit it selected is
   not going out; the client must not be told that withheld evidence exists at
   all, which is the whole point of withholding it. */
function pkgWithheldNote(){
  const { gone, heldBack } = pkgShipping();
  const n = gone + heldBack;
  if(!n) return "";
  const why = [
    heldBack ? `${heldBack} no longer marked client-deliverable` : "",
    gone ? `${gone} deleted from evidence` : "",
  ].filter(Boolean).join(", ");
  return `<div class="pkg-miss"><b>${n} selected item${n === 1 ? "" : "s"} withheld from the document</b>
    <p style="margin:4px 0">${esc(why)}. The document below prints without ${n === 1 ? "it" : "them"},
      and says nothing about ${n === 1 ? "it" : "them"} &mdash; the client is never told that withheld
      material exists. Nothing is removed from the case; reclassify or unselect in Evidence.</p></div>`;
}

function packagePanel(){
  if(!PKG) return `<div class="empty">Loading the package&hellip;</div>`;
  const b = PKG.build;
  const ev = PKG.evidence || [];
  const items = PKG.items || [];
  const inPkg = id => items.some(i => i.evidence_id === id);
  const photos = ev.filter(e => String(e.content_type || "").startsWith("image/"));
  const videos = ev.filter(e => String(e.content_type || "").startsWith("video/"));
  const others = ev.filter(e => !String(e.content_type || "").startsWith("image/")
                             && !String(e.content_type || "").startsWith("video/"));
  const eligible = e => e.classification === "client_deliverable";
  const act = (WS && WS.activity || []).length;
  /* `approved_report` now means "a report the package may carry" — an admin's
     own draft qualifies (see the Worker's latestShippableReport). The mark can
     say done, but the WORD may not say "Approved" about a draft: a staff
     screen must not assert a status the row does not hold. Read the actual
     statuses for the label; keep the readiness for the mark. */
  const repRows = (WS && WS.reports) || [];
  const repApproved = repRows.some(r => ["approved", "delivered"].includes(r.status));
  const rep = PKG.approved_report ? "done" : (repRows.length ? "part" : "none");
  const inv = (PKG.invoices || [])[0];

  /* The mini-dashboard: state blocks, each a door (UXSIMPLIFY P9/P14/P19). */
  const blocks = `
    <div class="pkg-blocks">
      <button class="pkg-b ${act ? "done" : ""}" data-act="wsTab" data-tab="activity">
        <b>Activity</b><span class="pk-v">${act} entr${act === 1 ? "y" : "ies"}</span>${pkgMark(act ? "done" : "none")}</button>
      <button class="pkg-b ${rep === "done" ? "done" : rep === "part" ? "part" : ""}" data-act="wsTab" data-tab="reports">
        <b>Report</b><span class="pk-v">${repApproved ? "Approved"
          : PKG.approved_report ? "Ready" : repRows.length ? "In review" : "None"}</span>${pkgMark(rep)}</button>
      <button class="pkg-b ${photos.some(eligible) ? "done" : photos.length ? "part" : ""}" data-act="wsTab" data-tab="evidence">
        <b>Photos</b><span class="pk-v">${photos.length}</span>${pkgMark(photos.some(eligible) ? "done" : photos.length ? "part" : "none")}</button>
      ${videos.length ? `<button class="pkg-b ${videos.some(eligible) ? "done" : "part"}" data-act="wsTab" data-tab="evidence">
        <b>Video</b><span class="pk-v">${videos.length}</span>${pkgMark(videos.some(eligible) ? "done" : "part")}</button>` : ""}
      <button class="pkg-b ${b && b.status === "finalized" ? "done" : b ? "part" : ""}">
        <b>Case build</b><span class="pk-v">${b ? (b.status === "finalized" ? "Finalized" : "Draft v" + b.version) : "Not started"}</span>${pkgMark(b && b.status === "finalized" ? "done" : b ? "part" : "none")}</button>
      <button class="pkg-b ${inv ? (inv.status === "paid" ? "done" : "part") : ""}" data-act="tab" data-tab="invoices">
        <b>Invoice</b><span class="pk-v">${inv ? label(inv.status) : "Not created"}</span>${pkgMark(inv ? (inv.status === "paid" ? "done" : "part") : "none")}</button>
    </div>`;

  if(!b){
    return `${blocks}
      <p class="hint">The package pulls the approved report and the client-deliverable
        photos, video and documents into one deliverable, behind hard gates.</p>
      <button class="btn" data-act="pkgStart">Start the package build</button>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}`;
  }

  /* What's missing (UXSIMPLIFY P16): only what stands between here and
     finalized, each line the Worker's own words. */
  /* On a FINALIZED package the same gates are still the truth, and they used to
     be hidden — HIGH #4 (2026-08-14). The strip rendered only while the status
     was not "finalized", which is precisely when Download works, so material
     reclassified to "do not use" after finalizing left no warning anywhere on
     the one screen that ships it. The gates are not suppressed any more; only
     the wording changes, because "to finish this package" is the wrong sentence
     for something already finished. */
  const missing = !PKG.gates.length ? "" : b.status !== "finalized" ? `
    <div class="pkg-miss"><b>To finish this package</b>
      <ul>${PKG.gates.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>` : `
    <div class="pkg-miss"><b>This finalized package needs attention</b>
      <p style="margin:4px 0">It was finalized when everything in it was cleared to ship.
        Something has changed since:</p>
      <ul>${PKG.gates.map(g => `<li>${esc(g)}</li>`).join("")}</ul>
      <p style="margin:4px 0">Anything no longer client-deliverable is already left out of the
        document below. Nothing is deleted &mdash; reclassify it, or build a new version.</p></div>`;

  const pick = (list, kind) => list.length ? `
    <h3 style="margin:14px 0 4px;font-size:.95rem">${kind}</h3>
    <div class="pkg-pick">${list.map(e => {
      const on = inPkg(e.id);
      const img = String(e.content_type || "").startsWith("image/");
      const item = items.find(i => i.evidence_id === e.id);
      return `<div class="pkg-item${on ? " on" : ""}">
        ${img ? `<img src="/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${e.id}/file" alt="">` : ""}
        <div style="margin:4px 0 2px;word-break:break-all"><b>${esc(e.filename)}</b></div>
        <div style="color:var(--muted)">${eligible(e) ? "Client deliverable" : esc(e.classification.replace(/_/g, " "))}</div>
        ${(() => {
          if(b.status !== "draft") return on ? "In package" : "";
          if(on) return `<button class="btn sm ghost" data-act="pkgRemove" data-id="${item ? item.id : ""}">Remove</button>`;
          const sup = pstSupersededForPackage(e, ev);
          return sup
            ? `<div class="pkg-sup">The timestamped copy goes in its place.</div>
               <button class="btn sm ghost" data-act="pkgAdd" data-id="${e.id}">Add anyway</button>`
            : `<button class="btn sm" data-act="pkgAdd" data-id="${e.id}">Add</button>`;
        })()}
      </div>`;
    }).join("")}</div>` : "";

  const doc = pkgDocHtml();

  /* UIBUILD P13 — the build's own six steps, each with a state. "n/a" is a
     state too: a package type without video owes no video. */
  const nPhoto = items.filter(i => i.role === "photo").length;
  const nVideo = items.filter(i => i.role === "video").length;
  const nDoc = items.filter(i => i.role === "document").length;
  /* The effective package type — 'custom' is a marker beside the stored
     column, not a value in it (see build_custom in schema.sql). Custom owes
     no type-based judgement about video: the admin chose the contents. */
  const ptype = PKG.package_type || b.package_type;
  const videoWanted = ptype === "custom" || ["report_photos_video", "full"].includes(ptype);
  const reps = PKG.reports || [];
  const steps = [
    ["Review",   reps.length ? "done" : "none"],
    ["Evidence", (nPhoto + nDoc) ? "done" : "none"],
    ["Video",    !videoWanted ? "na" : nVideo ? "done" : "none"],
    ["Package",  ptype ? "done" : "none"],
    ["Preview",  reps.length ? "done" : "none"],
    ["Finalize", b.status === "finalized" ? "done" : "none"],
  ];
  const stepsRail = `<div class="pkg-steps">${steps.map(([lbl, st], i) =>
    `<span class="pkg-step ${st}">${st === "done" ? "&#10003;" : st === "na" ? "&mdash;" : i + 1} ${lbl}${
      st === "na" ? " (n/a)" : ""}</span>`).join("")}</div>`;

  // P13 — what is in the box, in one glance.
  const contents = `<div class="feebox" style="margin:10px 0">
    <div class="row"><span><b>Package contents</b></span><span></span></div>
    <div class="row"><span>Final report</span><b>${reps.length
      ? (reps.length === 1 ? "1 day, approved" : `${reps.length} days, approved`)
      : "Not attached"}</b></div>
    <div class="row"><span>Photographs</span><b>${nPhoto}</b></div>
    <div class="row"><span>Video</span><b>${videoWanted ? nVideo : "Not in this package type"}</b></div>
    <div class="row"><span>Documents</span><b>${nDoc}</b></div>
    <div class="row"><span>Evidence index</span><b>${items.length} exhibit${items.length === 1 ? "" : "s"}</b></div>
  </div>`;

  /* P13 — video delivery, honestly. A copy button only when a link exists;
     otherwise the state of the world in plain words. */
  /* A delivery link is the OTHER way held-back material reaches a client, and
     it used to be filtered on the link alone — HIGH #4 (2026-08-14). The
     document now refuses anything not client-deliverable, but a share URL sits
     beside it with a Copy button and hands over the same file, so hold a video
     back and the document dropped it while the link still shipped it. The link
     is only offered while the evidence behind it is IN this package and still
     cleared to ship; `ev` already excludes deleted rows, so a deleted file has
     no link to copy either. Provider-side revocation is a separate thing and
     is not built (Dropbox is unconfigured) — this stops the portal OFFERING a
     link it should not, which is the half that exists to be got wrong today. */
  const shares = (PKG.external_files || []).filter(x => {
    if(!x.external_share_url || x.share_revoked_at) return false;
    const e = ev.find(y => y.id === x.evidence_id);
    return !!e && eligible(e) && inPkg(e.id);
  });
  const dropboxOff = PKG.providers && PKG.providers.dropbox && !PKG.providers.dropbox.configured;
  const delivery = nVideo ? `<div class="feebox" style="margin:10px 0">
    <div class="row"><span><b>Video delivery</b></span><span></span></div>
    ${shares.length ? shares.map(x => `
      <div class="row"><span>${esc(x.delivery_name || "Video link")}</span>
        <button class="btn sm" data-act="pkgCopyLink" data-url="${esc(x.external_share_url)}">Copy video link</button></div>
      ${x.share_expires_at ? `<div class="row"><span style="color:var(--muted);font-size:.82rem">Expires</span><span>${when(x.share_expires_at)}</span></div>` : ""}
      ${x.share_created_at ? `<div class="row"><span style="color:var(--muted);font-size:.82rem">Created</span><span>${when(x.share_created_at)}</span></div>` : ""}`).join("")
    : `<div class="row"><span style="color:var(--muted);font-size:.85rem">${dropboxOff
        ? "Dropbox is not connected — video is provided separately for now."
        : "No delivery link yet."}</span><span></span></div>`}
  </div>` : "";

  /* UIBUILD P14 — the completed package: every artifact, its state, one door. */
  const completedView = `
    ${contents}${delivery}
    <div class="feebox">
      <div class="row"><span><b>Package finalized</b> &mdash; v${b.version}</span>
        <span>${when(b.finalized_at)}</span></div>
      ${b.delivered_at ? `<div class="row"><span>Delivered</span><span>${when(b.delivered_at)}</span></div>` : ""}
      <div class="row"><span>${pkgMark(PKG.approved_report ? "done" : "none")} Final report</span>
        <button class="btn sm ghost" data-act="wsTab" data-tab="reports">Open report</button></div>
      <div class="row"><span>${pkgMark(nPhoto ? "done" : "none")} Photographs (${nPhoto})</span>
        <button class="btn sm ghost" data-act="evJump" data-t="photos">View</button></div>
      ${videoWanted ? `<div class="row"><span>${pkgMark(nVideo ? "done" : "none")} Video (${nVideo})</span>
        ${shares.length
          ? `<button class="btn sm" data-act="pkgCopyLink" data-url="${esc(shares[0].external_share_url)}">Copy delivery link</button>`
          : `<span style="color:var(--muted);font-size:.82rem">Provided separately</span>`}</div>` : ""}
      <div class="row"><span>${pkgMark(items.length ? "done" : "none")} Evidence index (${items.length})</span>
        <span style="color:var(--muted);font-size:.82rem">In the package document</span></div>
      <div class="row"><span>${pkgMark(inv ? (inv.status === "paid" ? "done" : "part") : "none")} Invoice${inv ? " — " + esc(label(inv.status)) : ""}</span>
        <button class="btn sm ghost" data-act="tab" data-tab="invoices">View</button></div>
      <div class="row"><span>${pkgMark("done")} Client package</span>
        <button class="btn sm" data-act="pkgPdf">Download PDF</button></div>
    </div>
    <div class="actions">
      ${""/* A REAL FILE IS THE PRIMARY ACTION (owner, 2026-08-18). Print stays,
             because printing to paper is still a thing an office does, but it
             is no longer the only way to get the report out of the screen. */}
      <button class="btn" data-act="pkgPdf">Download PDF</button>
      <button class="btn ghost" data-act="pkgPdfDropbox">Save PDF to Dropbox</button>
      <button class="btn ghost" data-act="pkgPrint">Print</button>
      ${!b.delivered_at ? `<button class="btn ghost" data-act="pkgDelivered">Mark delivered</button>` : ""}
      <button class="btn ghost" data-act="pkgReopen">Reopen and rebuild</button>
    </div>`;

  return `${blocks}${stepsRail}${missing}${pkgWithheldNote()}
    ${b.status === "draft" ? `
      ${contents}${delivery}
      ${daysPanel()}
      <label class="f" style="max-width:340px"><span>Package type</span>
        <select data-act="pkgType">
          ${[["report_only","Report only"],["report_photos","Report + photos"],
             ["report_photos_video","Report + photos + video link"],["full","Full client package"],
             ["custom","Custom package"]]
            .map(([v, l]) => `<option value="${v}" ${ptype === v ? "selected" : ""}>${l}</option>`).join("")}
        </select></label>

        exactly what ships. Only the client-deliverable rule still applies.</p>` : ""}
      ${pick(photos, "Photos")}${pick(videos, "Video")}${pick(others, "Documents")}
      <div class="actions" style="border-top:1px solid var(--line);padding-top:12px;margin-top:10px">
        <button class="btn ghost" data-act="pkgPrint">Preview package</button>
        <button class="btn" data-act="pkgFinalize">Finalize the package</button>
      </div>`
    : completedView}
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    ${tmplPickerHtml()}
    ${doc}`;
}

/* MASTER §13 — "Do not assume one case = one day." Which approved days the
   package carries, which are still out, and the Combined Summary that only
   makes sense once there is more than one. */
function daysPanel(){
  const b = PKG && PKG.build;
  if(!b) return "";
  const reps = PKG.reports || [];
  const avail = PKG.available_reports || [];
  const draft = b.status === "draft";
  const rows = reps.map((r, i) => `<div class="row">
      <span><b>Investigation &mdash; Day ${i + 1}</b> &middot; ${esc(fmtDay(r.report_date))}${
        r.hours != null ? ` &middot; ${esc(String(r.hours))} h` : ""}${
        r.investigator ? ` &middot; ${esc(r.investigator)}` : ""}</span>
      ${draft && reps.length > 1
        ? `<button class="btn sm ghost" data-act="pkgRepRemove" data-id="${r.id}">Remove</button>`
        : `<span style="color:var(--muted);font-size:.82rem">${esc(label(r.status))}</span>`}
    </div>`).join("");
  const availRows = draft ? avail.map(r => `<div class="row">
      <span style="color:var(--muted)">${esc(fmtDay(r.report_date))} &mdash; approved, not in the package</span>
      <button class="btn sm" data-act="pkgRepAdd" data-id="${r.id}">Add day</button>
    </div>`).join("") : "";
  const total = reps.reduce((n, r) => n + (Number(r.hours) || 0), 0);
  return `<div class="feebox" style="margin:10px 0">
    <div class="row"><span><b>Days in this package</b></span>
      <span style="color:var(--muted);font-size:.82rem">${reps.length} day${reps.length === 1 ? "" : "s"}${
        total ? ` &middot; ${Math.round(total * 10) / 10} h` : ""}</span></div>
    ${rows || `<div class="row"><span style="color:var(--muted);font-size:.85rem">No approved report yet
      &mdash; approve a daily report and it appears here.</span><span></span></div>`}
    ${availRows}
  </div>
  ${reps.length > 1 && draft ? `<label class="f"><span>Combined summary
    <span class="opt">optional &mdash; opens the multi-day report</span></span>
    <textarea data-act="pkgSummary" rows="4" placeholder="One paragraph covering the investigation as a whole. The dates, days, hours and exhibit counts below are filled in for you.">${esc(PKG.summary || "")}</textarea></label>` : ""}`;
}

/* The factual half of the Combined Summary: derived at render time, never
   stored, so adding a day cannot leave a stale sentence behind. */
function pkgSynopsis(reps, nPhoto, nVideo){
  if(!reps.length) return "";
  const hours = reps.reduce((n, r) => n + (Number(r.hours) || 0), 0);
  const miles = reps.reduce((n, r) => n + (Number(r.miles) || 0), 0);
  const first = fmtDay(reps[0].report_date);
  const last = fmtDay(reps[reps.length - 1].report_date);
  const span = reps.length === 1 ? `on ${first}` : `between ${first} and ${last}`;
  const bits = [`${reps.length} day${reps.length === 1 ? "" : "s"} of surveillance ${span}`];
  if(hours) bits.push(`${Math.round(hours * 10) / 10} hours of documented field time`);
  if(miles) bits.push(`${Math.round(miles)} miles travelled`);
  const ex = [];
  if(nPhoto) ex.push(`${nPhoto} photograph${nPhoto === 1 ? "" : "s"}`);
  if(nVideo) ex.push(`${nVideo} video exhibit${nVideo === 1 ? "" : "s"}`);
  if(ex.length) bits.push(ex.join(" and ") + " are included");
  return bits.join("; ") + ".";
}

/* The document — exactly what prints (case information, objective, each
   investigation day, combined summary, photographs, video listing, evidence
   index). Photos are embedded; video is listed, never embedded.

   Every <img> points at the ORIGINAL evidence route. The document holds no
   copy and writes nothing back, so printing a package can never overwrite
   the evidence it was built from (MASTER §13). */
/* =============================================== UNIT 9: REPORT TEMPLATES

   SIX STYLES, ONE ENGINE. Everything below is CONFIGURATION for the single
   document renderer beneath it — a title, section headings, their order, and
   which optional sections a style includes. Nothing here invents a fact, edits
   a timestamp, touches an activity entry, or renders anything the general
   format could not already render.

   AND THERE IS STILL ONE PDF. The PDF is built from the rendered `#pkgdoc`
   (see the note above the PDF writer), so a template that changes the document
   changes the preview, the print view, the downloaded file and the Dropbox
   copy together. That is why the template is a config over the renderer rather
   than a second renderer: six of these would be six things to drift.

   `sections` is the ORDER, and a section that has no content is skipped by the
   renderer whichever template asked for it — a heading over nothing is how a
   document starts implying it has something to say.

   THE WORDING IS LABELS, NEVER NARRATIVE. A template may call a section
   "Observed Activities" instead of "Narrative"; it may not write a sentence
   about what was observed. No template asserts service was effected, a custody
   arrangement was breached or a claim was fraudulent — those are conclusions,
   and this system only ever prints conclusions a person actually wrote. */
const REPORT_TEMPLATES = {
  surveillance: {
    label: "Surveillance",
    blurb: "Chronological field observation report",
    title: "SURVEILLANCE REPORT",
    heads: { narrative: "CHRONOLOGICAL OBSERVATIONS", days: "SURVEILLANCE — DAY",
             objective: "ASSIGNMENT / OBJECTIVE", info: "CASE INFORMATION",
             photos: "PHOTOGRAPHIC EVIDENCE" },
    sections: ["info", "objective", "subject", "summary", "narrative", "photos", "videos", "index"],
  },
  domestic: {
    label: "Domestic / Custody",
    blurb: "Family and domestic investigation format",
    title: "INVESTIGATION REPORT",
    heads: { narrative: "OBSERVATIONS / FINDINGS", days: "OBSERVATIONS — DAY",
             objective: "ASSIGNMENT", info: "CASE INFORMATION", subject: "PARTIES",
             photos: "PHOTOGRAPHIC EVIDENCE" },
    sections: ["info", "objective", "subject", "summary", "narrative", "photos", "videos", "index"],
  },
  insurance: {
    label: "Insurance",
    blurb: "Claim-focused investigation format",
    title: "INVESTIGATION REPORT",
    heads: { info: "CLAIM INFORMATION", objective: "ASSIGNMENT",
             narrative: "OBSERVED ACTIVITIES", days: "INVESTIGATION ACTIVITY — DAY",
             subject: "SUBJECT / VEHICLE INFORMATION", photos: "PHOTOGRAPHIC EVIDENCE" },
    sections: ["info", "objective", "subject", "summary", "narrative", "photos", "videos", "index"],
  },
  legal: {
    label: "Legal",
    blurb: "Law-firm and litigation matter format",
    title: "LEGAL INVESTIGATION REPORT",
    heads: { info: "MATTER INFORMATION", objective: "ASSIGNMENT",
             narrative: "FINDINGS / OBSERVATIONS", days: "INVESTIGATION ACTIVITY — DAY",
             dates: "IMPORTANT DATES", photos: "EVIDENCE" },
    sections: ["info", "dates", "objective", "subject", "summary", "narrative", "photos", "videos", "index"],
  },
  process: {
    label: "Process / Locate",
    blurb: "Locate and service activity format",
    title: "INVESTIGATION REPORT",
    heads: { objective: "ASSIGNMENT", subject: "SUBJECT / KNOWN ADDRESSES",
             narrative: "LOCATE ATTEMPTS / OBSERVED INFORMATION",
             days: "ATTEMPTS — DAY", info: "CASE INFORMATION" },
    sections: ["info", "objective", "subject", "narrative", "summary", "photos", "videos", "index"],
  },
  general: {
    label: "General",
    blurb: "Flexible standard investigation report",
    title: "INVESTIGATIVE REPORT",
    heads: {},
    sections: ["info", "objective", "summary", "narrative", "photos", "videos", "index"],
  },
};
/* The headings the general format has always used. A template overrides the
   ones it wants and inherits the rest, so a new template cannot accidentally
   blank a section's name. */
const TEMPLATE_HEADS = { info: "CASE INFORMATION", objective: "ASSIGNMENT OBJECTIVE",
  summary: "COMBINED SUMMARY", narrative: "NARRATIVE", days: "INVESTIGATION — DAY",
  subject: "SUBJECT INFORMATION", dates: "IMPORTANT DATES", photos: "PHOTOGRAPHS",
  videos: "VIDEO EVIDENCE", index: "EVIDENCE INDEX" };

function tmplDef(id){ return REPORT_TEMPLATES[id] || REPORT_TEMPLATES.general; }
function tmplHead(id, key){
  const t = tmplDef(id);
  return (t.heads && t.heads[key]) || TEMPLATE_HEADS[key] || key.toUpperCase();
}

/* THE DEFAULT IS INFERRED ONLY WHERE THE RECORD IS DETERMINISTIC — the case's
   own type or its category marker, never a guess at free text. Anything the
   mapping does not recognise is General, and the admin can change any of it.
   This chooses what the picker OPENS on; it never writes by itself. */
function tmplDefaultFor(){
  const ci = (PKG && PKG.case_info) || {};
  const c = (CASES || []).find(x => x.case_no === WS_CASE) || {};
  if(c.legal) return "legal";
  if(c.kind === "claims" || ci.claim_number || ci.carrier) return "insurance";
  const type = String(ci.case_type || "").toLowerCase();
  const svc = String(ci.service || "").toLowerCase();
  if(/custody|domestic|cohabitation|infidelity|adultery/.test(type)) return "domestic";
  if(/locate|skip trace/.test(type) || /process serv/.test(svc)) return "process";
  if(/surveillance/.test(type) || /surveillance/.test(svc)) return "surveillance";
  return "general";
}
/* What the document is actually printing in: the build's stored choice when it
   has one, otherwise the general format every existing report already prints
   in. The DEFAULT above is an opening suggestion for the picker, not a silent
   restyle of a document nobody chose a style for. */
function tmplCurrent(){
  const t = PKG && PKG.template;
  return REPORT_TEMPLATES[t] ? t : "general";
}

function tmplPickerHtml(){
  if(!PKG || !PKG.build) return "";
  const cur = tmplCurrent(), draft = PKG.build.status === "draft";
  const suggested = tmplDefaultFor();
  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Report template</h2>
      <span class="count">${esc(tmplDef(cur).label)}</span></div>
    <div class="tmplgrid">
      ${Object.entries(REPORT_TEMPLATES).map(([id, t]) => `
        <button class="tmplcard${id === cur ? " on" : ""}" data-act="tmplPick" data-t="${id}"
          ${draft ? "" : "disabled"} aria-pressed="${id === cur ? "true" : "false"}">
          <div class="tmpl-n">${esc(t.label)}${id === cur ? ` <span class="tmpl-on">Selected</span>` : ""}</div>
          <div class="tmpl-s">${esc(t.blurb)}</div>
          ${id === suggested && id !== cur ? `<div class="tmpl-sug">Suggested for this case</div>` : ""}
        </button>`).join("")}
    </div>
    ${draft
      ? `<p class="hint">The style changes the document's headings and the order of its sections.
          It never changes the report, the evidence or the times &mdash; and the preview below,
          the printed page, the downloaded PDF and the Dropbox copy all come from it.</p>`
      : `<p class="hint">This package is finalized, so its template is fixed at
          <b>${esc(tmplDef(cur).label)}</b>. Reopen the build to change it &mdash; a document a
          client may already have is not restyled underneath them.</p>`}
    ${PKG.template_msg ? `<div class="note">${esc(PKG.template_msg)}</div>` : ""}
  </div>`;
}

function pkgDocHtml(){
  const b = PKG && PKG.build;
  if(!b) return "";
  const items = PKG.items || [];
  const evById = Object.fromEntries((PKG.evidence || []).map(e => [e.id, e]));
  /* The document prints only what is still cleared to ship — HIGH #4
     (2026-08-14). The finalize gate refuses held-back material, but it runs at
     finalize and nothing re-ran afterwards: reclassify a photo to "do not use"
     on a package already finalized and it went on printing, while the gate
     strip that would have said so was suppressed on exactly the finalized
     builds where Download still worked. Held-back material reaching a client
     is the single outcome the classification system exists to prevent, so the
     check belongs where the material is rendered, not only where it is
     approved. Withheld items are COUNTED and named below rather than silently
     dropped — a document that quietly loses an exhibit is its own problem. */
  const rows = pkgShipping().ship.map((i, n) => {
    const e = evById[i.evidence_id] || {};
    return { n: n + 1, role: i.role, e,
      time: e.entry_time ? t12(e.entry_time) : "",
      desc: e.note || e.entry_description || e.filename || "" };
  });
  const photos = rows.filter(r => r.role === "photo");
  const videos = rows.filter(r => r.role === "video");
  /* Multi-day: every attached report, oldest first. Falls back to the single
     report so a package built before build_reports existed still renders. */
  const reps = (PKG.reports && PKG.reports.length) ? PKG.reports
    : (PKG.report ? [PKG.report] : []);
  const ci = PKG.case_info;
  /* The masthead a carrier's file needs. Anything absent is simply absent —
     no "N/A", no placeholder, the same rule the intake form works to. */
  const infoRows = !ci ? [] : [
    ["Case number", WS_CASE],
    ["Prepared for", ci.carrier || ""],
    ["Case type", ci.case_type || ci.service || ""],
    ["Subject", ci.subject_name || ""],
    ["Claim number", ci.claim_number || ""],
    ["Date of loss", ci.date_of_loss ? fmtDay(ci.date_of_loss) : ""],
    ["Claim type", ci.claim_type || ""],
    ["Investigator", ci.investigator || ""],
    ["Authorized hours", ci.authorized_hours != null ? String(ci.authorized_hours) : ""],
    ["Days of investigation", reps.length ? String(reps.length) : ""],
  ].filter(([, v]) => v);
  /* UNIT 9 — THE TEMPLATE DECIDES ORDER AND LABELS, NOTHING ELSE. Every
     section below renders the same records it always did; the template says
     what each is called and which order they come in, and a section with
     nothing in it is skipped whichever template asked for it. */
  const tid = tmplCurrent(), tdef = tmplDef(tid);
  const H = k => esc(tmplHead(tid, k));
  const rule = ` style="border-top:1px solid var(--line);padding-top:14px"`;
  let drawn = 0;
  const sec = body => { if(!body) return ""; drawn++; return body; };

  /* The subject block is drawn from the case's OWN recorded fields. It is
     offered by the templates that make sense of it and skipped when the case
     records none of them — never filled with a placeholder. */
  const subjRows = !ci ? [] : [
    ["Subject", ci.subject_name || ""],
    ["Description", ci.subject_description || ""],
    ["Address", ci.subject_address || ""],
    ["Vehicle", ci.vehicle || ""],
  ].filter(([, v]) => v);
  /* Dates the record actually holds. Nothing is derived from another date —
     the standing rule from the legal intake. */
  const dateRows = !ci ? [] : [
    ["Hearing", ci.hearing_date ? fmtDay(ci.hearing_date) : ""],
    ["Trial", ci.trial_date ? fmtDay(ci.trial_date) : ""],
    ["Investigation deadline", ci.deadline ? fmtDay(ci.deadline) : ""],
  ].filter(([, v]) => v);

  const BLOCK = {
    info: () => infoRows.length ? `<h3>${H("info")}</h3>
      <table class="doc-table"><tbody>${infoRows.map(([k, v]) =>
        `<tr><td style="width:34%"><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join("")}</tbody></table>` : "",
    dates: () => dateRows.length ? `<h3${drawn ? rule : ""}>${H("dates")}</h3>
      <table class="doc-table"><tbody>${dateRows.map(([k, v]) =>
        `<tr><td style="width:34%"><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join("")}</tbody></table>` : "",
    objective: () => (ci && ci.objective) ? `<h3${drawn ? rule : ""}>${H("objective")}</h3>
      <div style="white-space:pre-line;font-size:.95rem">${esc(ci.objective)}</div>` : "",
    subject: () => subjRows.length ? `<h3${drawn ? rule : ""}>${H("subject")}</h3>
      <table class="doc-table"><tbody>${subjRows.map(([k, v]) =>
        `<tr><td style="width:34%"><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join("")}</tbody></table>` : "",
    /* The combined summary stays exactly what it was: the admin's own
       paragraph, and facts DERIVED at render time so adding a day cannot
       leave a stale sentence behind. */
    summary: () => reps.length > 1 ? `<h3${drawn ? rule : ""}>${H("summary")}</h3>
      ${PKG.summary ? `<div style="white-space:pre-line;font-size:.95rem;margin-bottom:8px">${esc(PKG.summary)}</div>` : ""}
      <div style="font-size:.95rem">${esc(pkgSynopsis(reps, photos.length, videos.length))}</div>` : "",
    narrative: () => reps.length ? reps.map((r, i) => `
      <h3${i || drawn ? rule : ""}>${
        reps.length > 1 ? `${H("days")} ${i + 1}` : H("narrative")} <span style="font-weight:400;font-size:.85rem;color:var(--muted)">${
        esc(fmtDay(r.report_date))}${r.start_time ? ` &middot; ${esc(t12(r.start_time))}${
        r.end_time ? `&ndash;${esc(t12(r.end_time))}` : ""}` : ""}${
        r.hours != null ? ` &middot; ${esc(String(r.hours))} h` : ""}${
        r.investigator ? ` &middot; ${esc(r.investigator)}` : ""}</span></h3>
      ${r.narrative ? `<div style="white-space:pre-line;font-size:.95rem;margin:0 0 10px">${esc(r.narrative)}</div>` : ""}
      <div style="white-space:pre-line;font-size:.95rem">${esc(r.body)}</div>`).join("")
      : `<p style="color:var(--muted)">No report attached yet.</p>`,
    photos: () => photos.length ? `<h3${drawn ? rule : ""}>${H("photos")}</h3>
      ${photos.map(r => `<div style="margin:0 0 14px">
        <img src="/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${r.e.id}/file" alt="">
        <div style="font-size:.85rem;color:var(--muted)">Photo ${String(r.n).padStart(2, "0")}${r.time ? ` &middot; ${esc(r.time)}` : ""} &middot; ${esc(r.desc)}</div>
      </div>`).join("")}` : "",
    videos: () => videos.length ? `<h3${drawn ? rule : ""}>${H("videos")}</h3>
      ${videos.map((r, i2) => `<div style="margin:0 0 10px">
        <b>Video ${String(i2 + 1).padStart(2, "0")}</b>${r.time ? ` &middot; ${esc(r.time)}` : ""}
        <div style="font-size:.9rem">${esc(r.desc)}</div>
      </div>`).join("")}
      <p style="font-size:.9rem"><b>VIDEO DELIVERY</b> &mdash; Selected video evidence is provided
        through the accompanying electronic evidence delivery. Video package reference: ${esc(WS_CASE)}.</p>` : "",
    index: () => rows.length ? `<h3${drawn ? rule : ""}>${H("index")}</h3>
      <table class="doc-table"><thead><tr><th>Exhibit</th><th>Time</th><th>Type</th><th>Description</th><th>Delivery</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td>${r.role === "photo" ? "Photo" : r.role === "video" ? "Video" : "Document"} ${String(r.n).padStart(2, "0")}</td>
          <td>${esc(r.time)}</td><td>${esc(r.role)}</td><td>${esc(r.desc)}</td>
          <td>${r.role === "video" ? "Video delivery" : "Report"}</td>
        </tr>`).join("")}</tbody></table>` : "",
  };

  return `<h3 style="margin:18px 0 6px;font-size:1rem">The document <span class="opt">exactly what prints</span></h3>
  <div id="pkgdoc">
    <div class="doc-head">
      <div><h2>Always Precise Investigations, LLC</h2>
        <div style="font-size:.85rem;color:var(--muted)">Va DCJS #11-9159 &middot; (434) 907-0975</div></div>
      <div style="text-align:right">
        <div style="font-size:1.1rem;font-weight:800;letter-spacing:.05em">${esc(tdef.title)}</div>
        <div><b>${esc(WS_CASE)}</b></div>

    </div>
    ${(tdef.sections || REPORT_TEMPLATES.general.sections)
      .map(k => sec(BLOCK[k] ? BLOCK[k]() : "")).join("")}
    ${""/* Nothing about withheld material belongs in HERE. #pkgdoc is the only
          region the print stylesheet leaves visible, so anything inside it is
          the CLIENT's document — and a client must never be told that evidence

          do-not-use. Naming a count would disclose the very material the

    <p style="font-size:.85rem;border-top:1px solid var(--line);padding-top:10px;color:var(--muted)">
      Prepared by Always Precise Investigations, LLC. The investigator may provide testimony

/* Printing re-reads the package first — HIGH #4 (2026-08-14). The document
   filters held-back material at RENDER time, which is only as fresh as the DOM
   it rendered into. The package tab loads once on entry, so an admin who held
   something back from another tab, another device or the Evidence tab of a
   second window could still hit Download here and print the copy this screen
   drew before the change. Reloading first costs one request at the only moment
   that matters, and it is the moment the file leaves the building. If the
   reload fails the print is abandoned rather than falling back on stale data —
   printing nothing is recoverable, printing held-back material is not. */
/* ------------------------------------------------ the report as a real file

   Owner, 2026-08-18: "Final Reports need a real PDF file, not Print only."

   MADE HERE, ON THIS MACHINE. The package document is already rendered on this
   screen, so the PDF is built from THAT — the same device-first shape as the
   video timestamping, and for the same two reasons. The Worker's CPU budget is
   small enough that signing in already strains it, and a second server-side
   rendering of a document that exists in front of the operator is a second
   thing to drift from the first.

   BUILT FROM THE RENDERED DOCUMENT, not from the data behind it. #pkgdoc is
   already the one place that decides what a client may see — it renders only
   currently-deliverable evidence and it is re-read before anything leaves. A
   PDF assembled from PKG instead would be a second renderer of the same rules,
   and the day they disagreed the wrong one would be the one that was posted.

   NO LIBRARY. A PDF that is text in the base-14 fonts plus JPEG images needs no
   font embedding and no compression, so this writes the file directly rather
   than pulling in a megabyte of dependency for a page that is deliberately
   dependency-free. */

const PDF_PAGE = { w: 612, h: 792, m: 54 };   // US Letter, 3/4 inch margins

function pdfChunk(str){
  const a = new Uint8Array(str.length);
  for(let i = 0; i < str.length; i++) a[i] = str.charCodeAt(i) & 255;
  return a;
}

/* WinAnsi, with the typographer's characters this document actually uses
   folded to something the base-14 fonts can draw. A stray em dash must not
   become a missing glyph in the middle of a client's report. */
function pdfLatin(str){
  let out = "";
  for(const ch of String(str)){
    const c = ch.charCodeAt(0);
    if(ch === "\\" || ch === "(" || ch === ")") out += "\\" + ch;
    else if(c === 0x2014 || c === 0x2013) out += "-";
    else if(c === 0x2018 || c === 0x2019) out += "'";
    else if(c === 0x201c || c === 0x201d) out += '"';
    else if(c === 0x2026) out += "...";
    else if(c < 32) out += " ";
    else if(c < 127) out += ch;
    else if(c < 256) out += "\\" + c.toString(8).padStart(3, "0");
    else out += "?";
  }
  return out;
}

/* Measured with the browser's own Helvetica rather than a table of AFM widths
   typed in from memory. Arial and Helvetica agree on almost every glyph, and
   the wrap is to 97% of the column so a small disagreement shortens a line
   instead of running it into the margin. */
let PDF_MEAS = null;
function pdfWidth(text, size, bold){
  if(!PDF_MEAS) PDF_MEAS = document.createElement("canvas").getContext("2d");
  PDF_MEAS.font = (bold ? "bold " : "") + size + "px Helvetica, Arial, sans-serif";
  return PDF_MEAS.measureText(text).width;
}

function pdfWrapLines(text, size, bold, maxW){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";
  for(const w of words){
    const next = line ? line + " " + w : w;
    if(pdfWidth(next, size, bold) <= maxW){ line = next; continue; }
    if(line) lines.push(line);
    /* A single word too long for the column is broken rather than allowed to
       overrun — a case number or a filename can do this. */
    if(pdfWidth(w, size, bold) > maxW){
      let part = "";
      for(const ch of w){
        if(pdfWidth(part + ch, size, bold) > maxW){ lines.push(part); part = ch; }
        else part += ch;
      }
      line = part;
    } else line = w;
  }
  if(line) lines.push(line);
  return lines.length ? lines : [""];
}

/* The images are already loaded on screen, so they are drawn from the DOM
   element rather than fetched a second time. Everything goes through a canvas
   and comes out as JPEG, which normalises PNG and anything else the camera
   produced into the one format a PDF can carry with no re-encoding. */
async function pdfImageBytes(el){
  if(!el.complete || !el.naturalWidth){
    await new Promise((res) => {
      el.addEventListener("load", res, {once:true});
      el.addEventListener("error", res, {once:true});
      setTimeout(res, 5000);
    });
  }
  if(!el.naturalWidth) return null;
  const cap = 1500;
  const k = Math.min(1, cap / Math.max(el.naturalWidth, el.naturalHeight));
  const w = Math.max(1, Math.round(el.naturalWidth * k));
  const h = Math.max(1, Math.round(el.naturalHeight * k));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);
  g.drawImage(el, 0, 0, w, h);
  let url;
  try{ url = c.toDataURL("image/jpeg", 0.82); }catch{ return null; }
  const bin = atob(url.slice(url.indexOf(",") + 1));
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return { bytes, w, h };
}

const PDF_BLOCKS = new Set(["DIV","P","LI","UL","OL","TABLE","THEAD","TBODY","TR",
                            "SECTION","H1","H2","H3","H4","H5","H6","FIGURE","HEADER"]);

function pdfCollectOps(el, ops){
  for(const node of el.children){
    const tag = node.tagName;
    if(tag === "IMG"){ ops.push({t:"img", el:node}); continue; }
    if(tag === "TR"){
      const cells = [...node.children].map((c) => c.textContent.replace(/\s+/g, " ").trim());
      const line = cells.filter(Boolean).join("   ");
      if(line) ops.push({t:"text", s:line, size:9.5, bold:false, after:2});
      continue;
    }
    if(/^H[1-6]$/.test(tag)){
      const s = node.textContent.replace(/\s+/g, " ").trim();
      if(s) ops.push({t:"text", s, size: tag === "H2" ? 15 : 11.5, bold:true, before:12, after:6});
      continue;
    }
    const kids = [...node.children];
    if(kids.some((k) => PDF_BLOCKS.has(k.tagName) || k.tagName === "IMG")){
      pdfCollectOps(node, ops);
      continue;
    }
    /* The narrative bodies are white-space:pre-line, so their newlines ARE the
       paragraphing. Collapsing them would run a day's report into one block. */
    let pre = false;
    try{ pre = /pre/.test(getComputedStyle(node).whiteSpace || ""); }catch{}
    if(pre){
      for(const raw of node.textContent.split("\n")){
        const t = raw.replace(/[ \t]+/g, " ").trim();
        ops.push(t ? {t:"text", s:t, size:10, bold:false, after:3} : {t:"gap", h:6});
      }
      continue;
    }
    const s = node.textContent.replace(/\s+/g, " ").trim();
    if(s) ops.push({t:"text", s, size:10, bold:false, after:5});
  }
}

async function pdfFromDoc(root){
  const M = PDF_PAGE.m, PW = PDF_PAGE.w, PH = PDF_PAGE.h, CW = PW - M * 2;
  const ops = [];
  pdfCollectOps(root, ops);

  const loaded = new Map();
  for(const op of ops){
    if(op.t !== "img" || loaded.has(op.el)) continue;
    let got = null;
    try{ got = await pdfImageBytes(op.el); }catch{ got = null; }
    loaded.set(op.el, got);
  }
  const order = [...loaded.keys()].filter((k) => loaded.get(k));
  const imgNum = (el) => order.indexOf(el) + 1;

  const pages = [];
  let stream = "", used = new Set(), y = PH - M;
  const flush = () => { pages.push({ stream, used: [...used] }); stream = ""; used = new Set(); y = PH - M; };

  for(const op of ops){
    if(op.t === "gap"){ y -= op.h; continue; }
    if(op.t === "text"){
      const lead = op.size * 1.32;
      y -= (op.before || 0);
      for(const ln of pdfWrapLines(op.s, op.size, op.bold, CW * 0.97)){
        if(y - lead < M) flush();
        y -= lead;
        stream += "BT /" + (op.bold ? "F2" : "F1") + " " + op.size + " Tf "
          + M + " " + y.toFixed(2) + " Td (" + pdfLatin(ln) + ") Tj ET\n";
      }
      y -= (op.after || 0);
      continue;
    }
    if(op.t === "img"){
      const im = loaded.get(op.el);
      if(!im) continue;
      let w = CW, h = im.h * (CW / im.w);
      const maxH = (PH - M * 2) * 0.78;
      if(h > maxH){ h = maxH; w = im.w * (h / im.h); }
      if(y - h - 8 < M) flush();
      y -= h;
      used.add(op.el);
      stream += "q " + w.toFixed(2) + " 0 0 " + h.toFixed(2) + " " + M + " "
        + y.toFixed(2) + " cm /Im" + imgNum(op.el) + " Do Q\n";
      y -= 8;
      continue;
    }
  }
  flush();

  /* Object numbering has to be settled before anything is written, because
     /Pages names its children and each page names its content stream. */
  const nImg = order.length;
  const firstImg = 5;
  const firstPage = firstImg + nImg;          // content, page, content, page...
  const pageNum = (i) => firstPage + i * 2 + 1;
  const objects = [];

  objects.push({ num: 1, parts: ["<< /Type /Catalog /Pages 2 0 R >>"] });
  objects.push({ num: 2, parts: ["<< /Type /Pages /Kids ["
    + pages.map((_, i) => pageNum(i) + " 0 R").join(" ")
    + "] /Count " + pages.length + " >>"] });
  objects.push({ num: 3, parts: ["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>"] });
  objects.push({ num: 4, parts: ["<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"] });

  order.forEach((el, i) => {
    const im = loaded.get(el);
    objects.push({ num: firstImg + i, parts: [
      "<< /Type /XObject /Subtype /Image /Width " + im.w + " /Height " + im.h
      + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "
      + im.bytes.length + " >>\nstream\n",
      im.bytes,
      "\nendstream",
    ] });
  });

  pages.forEach((pg, i) => {
    const body = pdfChunk(pg.stream);
    objects.push({ num: firstPage + i * 2, parts: [
      "<< /Length " + body.length + " >>\nstream\n", body, "\nendstream" ] });
    const xo = pg.used.length
      ? " /XObject << " + pg.used.map((el) => "/Im" + imgNum(el) + " " + (firstImg + order.indexOf(el)) + " 0 R").join(" ") + " >>"
      : "";
    objects.push({ num: pageNum(i), parts: [
      "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "]"
      + " /Resources << /Font << /F1 3 0 R /F2 4 0 R >>" + xo + " >>"
      + " /Contents " + (firstPage + i * 2) + " 0 R >>" ] });
  });

  const out = [];
  let len = 0;
  const push = (x) => { const b = typeof x === "string" ? pdfChunk(x) : x; out.push(b); len += b.length; };
  const offsets = [];
  push("%PDF-1.4\n");
  push(new Uint8Array([37, 226, 227, 207, 211, 10]));   // marks the file binary
  for(const o of objects){
    offsets[o.num] = len;
    push(o.num + " 0 obj\n");
    for(const part of o.parts) push(part);
    push("\nendobj\n");
  }
  const xref = len;
  const total = objects.length + 1;
  let table = "xref\n0 " + total + "\n0000000000 65535 f \n";
  for(let i = 1; i < total; i++) table += String(offsets[i] || 0).padStart(10, "0") + " 00000 n \n";
  push(table);
  push("trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
  return new Blob(out, { type: "application/pdf" });
}

/* THE PACKAGE IS RE-READ FIRST, for the reason pkgPrint already re-reads: this
   is the moment the file leaves the building, and a tab that has been open
   since before someone reclassified an exhibit would otherwise put the copy it
   drew earlier into a PDF that is then emailed. If the re-read fails, no PDF is
   made at all — producing nothing is recoverable, producing withheld material
   is not. */
async function pkgPdfBuild(){
  WS_ERR = "";
  await loadPackage();
  if(!PKG){ WS_ERR = "Could not re-check the package before making the PDF."; paintCase(); return null; }
  paintCase();
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  const root = document.getElementById("pkgdoc");
  if(!root){ WS_ERR = "The package document is not on screen."; paintCase(); return null; }
  try{ return await pdfFromDoc(root); }
  catch(e){ WS_ERR = "The PDF could not be built: " + e.message; paintCase(); return null; }
}

function pkgPdfName(){
  const v = PKG && PKG.build && PKG.build.version;
  return (WS_CASE || "case") + " report" + (v ? " v" + v : "") + ".pdf";
}

async function pkgDownloadPdf(){
  const blob = await pkgPdfBuild();
  if(!blob) return;
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = pkgPdfName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  WS_NOTICE = "PDF downloaded.";
  paintCase();
}

/* SAVED TO THE CASE'S OWN Reports FOLDER, and nowhere else — no R2 copy. A
   failure here is reported and the PDF is still downloadable, so a Dropbox
   outage costs a click rather than the document. */
async function pkgSavePdfToDropbox(){
  const b = PKG && PKG.build;
  if(!b) return;
  const blob = await pkgPdfBuild();
  if(!blob) return;
  const fd = new FormData();
  fd.append("file", new File([blob], pkgPdfName(), { type: "application/pdf" }));
  try{
    const res = await fetch(API + "/build/" + b.id + "/report-pdf",
      { method: "POST", credentials: "same-origin", body: fd });
    const d = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(d.error || ("Could not save the PDF (" + res.status + ")"));
    WS_NOTICE = "Saved to Dropbox — " + (d.path || "Reports");
  }catch(e){ WS_ERR = e.message; }
  await loadPackage();
  paintCase();
}

async function pkgPrint(){
  await loadPackage();
  if(!PKG){ WS_ERR = WS_ERR || "Could not re-check the package before printing."; paintCase(); return; }
  document.body.classList.add("printing-package");
  window.print();
  setTimeout(() => document.body.classList.remove("printing-package"), 400);
}

async function pkgApi(path, body){
  WS_ERR = "";
  try{ PKG = await api(path, {method: "POST", body: body || {}}); }
  catch(e){
    WS_ERR = e.message;
    if(e.gates) WS_ERR = "Not ready: " + e.gates.join(" ");
    await loadPackage(); return;
  }
  paintCase();
}

/* Priority 19 — follow-up tasks. Admin-created; assigning one to an
   investigator is the office choosing to tell them, and that assignment is
   the only way a task reaches one. The one write the field has is marking
   their own task done. */
function tasksPanel(){
  const admin = ME.role === "admin";
  const tasks = (WS && WS.tasks) || [];
  const today = ymdLocal();
  const priTag = p => p === "urgent" ? `<span class="tag rs-needs_revision">urgent</span>`
    : p === "high" ? `<span class="tag rs-submitted">high</span>`
    : p === "low" ? `<span class="tag rs-draft">low</span>` : "";

  const composer = !admin ? "" : `
    <form class="quick" data-act="addTask">
      <label class="f"><span>What needs doing</span>
        <input id="t_task" placeholder="e.g. Call the adjuster to confirm the second day."></label>
      <div class="two">
        <label class="f"><span>Assigned to</span>
          <select id="t_who"><option value="">The office</option>
            ${USERS.filter(u => u.active).map(u =>
              `<option value="${u.id}">${esc(u.display_name || u.username)}</option>`).join("")}</select></label>
        <label class="f"><span>Due <span class="opt">optional</span></span><input id="t_due" type="date"></label>
      </div>
      <label class="f"><span>Priority</span>
        <select id="t_pri">${[["normal","Normal"],["high","High"],["urgent","Urgent"],["low","Low"]]
          .map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></label>
      <button class="btn" type="submit">Add task</button>
      <p class="hint">A task assigned to an investigator shows on their view of this case and on
        their dashboard when overdue. Office tasks stay with the office.</p>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>`;

  const row = t => {
    const overdue = t.status === "open" && t.due_date && t.due_date < today;
    return `<div class="rcard" style="cursor:default${t.status !== "open" ? ";opacity:.65" : ""}">
      <div class="rc-h"><b>${esc(t.task)}</b>${priTag(t.priority)}
        ${t.status === "open"
          ? `<button class="btn sm" data-act="taskStatus" data-id="${t.id}" data-s="done">Done</button>
             ${admin ? `<button class="btn sm ghost" data-act="taskStatus" data-id="${t.id}" data-s="cancelled">Cancel</button>` : ""}`
          : `<span class="tag ${t.status === "done" ? "rs-approved" : "rs-draft"}">${esc(t.status)}</span>
             ${admin ? `<button class="btn sm ghost" data-act="taskStatus" data-id="${t.id}" data-s="open">Reopen</button>` : ""}`}</div>
      <div class="tl-m">${t.assignee ? esc(t.assignee) : "The office"}${
        t.due_date ? ` &middot; due ${esc(fmtDay(t.due_date))}` : ""}${
        overdue ? ` &middot; <b style="color:#a33">overdue</b>` : ""}</div>
    </div>`;
  };

  return `${composer}
    ${tasks.length ? `<div class="rlist">${tasks.map(row).join("")}</div>`
      : `<div class="empty">${admin ? "No tasks on this case yet."
          : "Nothing is assigned to you on this case."}</div>`}`;
}

/* UIBUILD P5 — the case header. Identity on the left, state on the right.
   Who is paying appears for the office only: an investigator's header is the
   subject and the case number, mirroring what the Worker already redacts.
   Status stays a single control on the Assignment panel — the header chip and
   Edit case both route there rather than duplicating a live form. */
function caseHeader(s, a, admin){
  const p = s.payload || {};
  const claim = s.kind === "claims";
  const stage = (WS && WS.stage) || s.status || "open";
  const assignee = admin && s.assigned_to ? USERS.find(u => u.id === s.assigned_to) : null;
  const clientLine = claim ? (p.carrier || p.client_name || "") : (p.client_name || "");
  return `<div class="caseheader">
    <div>
      <span class="tag ${claim ? "claims" : "consumer"}">${esc(a.case_type || (claim ? "Claim assignment" : "Client intake"))}</span>
      <span class="case" style="display:inline-block;margin-left:8px">${esc(WS_CASE)}</span>
      ${admin && clientLine ? `<div class="ch-client"><b>${esc(clientLine)}</b>${claim && p.claim_number ? ` &middot; Claim ${esc(p.claim_number)}` : ""}</div>` : ""}
      ${p.subject_name ? `<div class="ch-sub">${claim ? "Claimant" : "Subject"}: ${esc(p.subject_name)}</div>` : ""}
    </div>

        ? `<span class="ch-status" data-act="wsTab" data-tab="assign" title="Change status on Assignment"><span class="tag ${esc(stage)}">${esc(label(stage))}</span></span>

/* The case, in the same shape a /packages row has — so the overview reuses
   pkgProgress and pkgNextStep instead of growing a second opinion (P24). */
function wsPkgShape(){
  const days = (WS && WS.days) || [];
  const live = ((WS && WS.evidence) || []).filter(e => !e.deleted_at);
  const reports = (WS && WS.reports) || [];
  const best = reports.find(r => ["approved", "delivered"].includes(r.status))
            || reports.find(r => r.status === "submitted") || reports[0] || null;
  return {
    activity_count: ((WS && WS.activity) || []).filter(e => !e.removed_at).length,
    report_status: best ? best.status : null,
    photos: live.filter(e => String(e.content_type || "").startsWith("image/")).length,
    videos: live.filter(e => String(e.content_type || "").startsWith("video/")).length,
    build_status: (WS && WS.build_status) || null,
    invoice_status: (WS && WS.invoice_status) || null,
    days: days.length,
    open_day: days.some(d => !d.end_time),
  };
}
