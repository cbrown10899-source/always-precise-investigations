/* ===================== Active Surveillance Mode (SURVEILLANCE.md) =========
   THE RULE, from the owner: this is a VIEW of the existing case. Same login,
   same case, same investigation day, same activity log, same evidence, same
   report. There is no surveillance table and there must never be one — leave
   the mode and everything is already in the normal portal.
   ========================================================================= */

/* The timer derives from the SERVER's record of when the day was started
   (case_days.created_at), corrected by the skew measured against the Worker's
   own clock. Nothing counts ticks, so sleeping the phone, reloading, or a
   device clock that is simply wrong cannot move it (P2). */
/* Breaks are subtracted, and a running pause FREEZES the display — because
   `paused_at` is a server instant, so the number stops moving without anything
   here counting or stopping a tick. Same rule as always: every quantity in
   this sum comes from the server. */
function svElapsed(){
  const d = WS && WS.open_day;
  if(!d || !d.started_at) return null;
  const upto = d.paused_at ? Date.parse(d.paused_at) : (Date.now() + SV_SKEW);
  const ms = upto - Date.parse(d.started_at) - (Number(d.paused_ms) || 0);
  return ms > 0 ? ms : 0;
}
function svPaused(){ return Boolean(WS && WS.open_day && WS.open_day.paused_at); }
function svClock(ms){
  const s = Math.floor(ms / 1000);
  const p = n => String(n).padStart(2, "0");
  return `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
}
function svTickStart(){
  if(SV_TICK) clearInterval(SV_TICK);
  SV_TICK = setInterval(() => {
    const el = $("svTimer"), ms = svElapsed();
    if(el && ms != null) el.textContent = svClock(ms);
  }, 1000);
}
function svTickStop(){ if(SV_TICK){ clearInterval(SV_TICK); SV_TICK = null; } }

async function openSurveillanceLauncher(){
  SV = {tab: "launcher", entry: null, heard: null, err: "", ok: "", cat: "arrival", search: ""};
  document.body.classList.add("surv");
  paint();
  try{ SV.launcher = await api("/my/active"); }
  catch(e){ SV.launcher = {active: null, assignments: []}; SV.err = e.message; }
  paint();
}

async function enterSurveillance(caseNo){
  SV = {tab: "home", entry: null, heard: null, err: "", ok: "", cat: "arrival", search: ""};
  document.body.classList.add("surv");
  if(WS_CASE !== caseNo || !WS){
    WS_CASE = caseNo; WS = null; retainerEnter(caseNo);
    paint();
    try{
      const [sub, ws] = await Promise.all([
        api("/submissions/" + encodeURIComponent(caseNo)),
        api("/cases/" + encodeURIComponent(caseNo) + "/workspace"),
      ]);
      WS = { ...ws, submission: sub.submission };
    }catch(e){ SV.err = e.message; }
  }
  if(WS && WS.server_now) SV_SKEW = Date.parse(WS.server_now) - Date.now();
  svTickStart();
  paint();
}
function exitSurveillance(){
  svTickStop();
  SV = null;
  document.body.classList.remove("surv");
  VIEW = "case"; WS_TAB = "overview";
  paint();
}
async function svReload(){
  try{
    const ws = await api("/cases/" + encodeURIComponent(WS_CASE) + "/workspace");
    WS = { ...ws, submission: WS ? WS.submission : null };
    if(ws.server_now) SV_SKEW = Date.parse(ws.server_now) - Date.now();
  }catch(e){ SV.err = e.message; }
  paint();
}

function svView(){
  const s = (WS && WS.submission) || {};
  const p = s.payload || {};
  const claim = s.kind === "claims";
  const open = WS && WS.open_day;
  /* SURVEILLANCE P25 — every screen inside the mode has a way back to the
     field home that does NOT leave the mode. "Exit active mode" is the other
     thing, and it is deliberately in the header, not next to this. */
  const back = SV.tab !== "home" && WS
    ? `<div class="sv-backbar">
         <button class="sv-back" data-act="svTab" data-t="home">&larr; Back to active surveillance</button>
       </div>` : "";
  const body =
      !WS            ? `<div class="sv-body"><div class="sv-card">Loading the assignment&hellip;</div></div>`
    : SV.tab === "activity" ? svActivityScreen()
    : SV.tab === "timeline"  ? svTimelineScreen()
    : SV.tab === "evidence"  ? svEvidenceScreen()
    : SV.tab === "report"    ? svReportScreen()
    : SV.tab === "case"      ? svCaseDrawer()
    : SV.tab === "endday"    ? svEndDayScreen()
    :                          svHomeScreen();

  /* MOBILE PR 1 — THE SCREEN SAYS WHO IS BEING WATCHED. The case number alone
     is an identifier, not an identity, and on a phone it was wrapping across two
     lines while nothing on screen named the subject.

     `subject_name` is ALREADY in this payload and already authorised for this
     role — the subject is who is watched, never who is paying, so the Worker's
     allow-list sends it and the redaction drops the client's identity rather
     than the subject's. No new field is read, no route changes and no boundary
     moves. (The allow-list's own name is deliberately not written in this file;
     a test fails if it reappears here.) If there is no subject the line is
     simply absent rather than inventing a label for one. */
  const subject = p.subject_name || s.subject_name || "";
  return `<div class="sv">
    <div class="sv-head">
      <span class="tag ${claim ? "claims" : "consumer"}">${claim ? "Claim" : "Private"}</span>
      <span class="case">${esc(WS_CASE)}</span>
    </div>
    ${subject ? `<div class="sv-ident">${claim ? "Claimant" : "Subject"}:
      <b>${esc(subject)}</b></div>` : ""}
    ${back}
    ${body}
    <div class="sv-nav">
      ${[["home","&#8962;","Home"], ["activity","&#9998;","Activity"],
         ["evidence","&#128247;","Media"], ["report","&#128196;","Report"],
         ["case","&#8942;","Case"]].map(([k, ic, lbl]) =>
        `<button class="${SV.tab === k || (k === "activity" && SV.tab === "timeline") ? "on" : ""}"
           data-act="svTab" data-t="${k}"><b>${ic}</b>${lbl}</button>`).join("")}
    </div>
  </div>`;
}

/* SURVEILLANCE P1 — the door into the field view, at the top of the case where
   a phone finds it first. It wears the app's own icon, so the button in the
   portal and the shortcut on the home screen are visibly the same thing. */
function svLaunchButton(){
  const open = WS && WS.open_day;
  return `<button class="sv-go ${open ? "live" : ""}" data-act="svEnter" data-case="${esc(WS_CASE)}">
    <img src="/portal/icon-192.png" alt="" width="56" height="56">
    <div>
      <b>${open ? "Resume active surveillance" : "Active Surveillance Mode"}</b>
      <span>${open
        ? "A day is running on this case &mdash; pick it back up"
        : "The field view: start a day, log it one-handed, add photos"}</span>
    </div>
    <span class="go">&rarr;</span>
  </button>`;
}

/* SURVEILLANCE P16 — what the home-screen icon opens. With a day running it
   resumes it; with none it lists the assignments that could start one. This is
   the same signed-in website, not a second app. */
function svLauncher(){
  const d = SV.launcher || {};
  const a = d.active;
  if(a){
    const skew = d.server_now ? Date.parse(d.server_now) - Date.now() : 0;
    const ms = Math.max(0, (Date.now() + skew) - Date.parse(a.started_at));
    return `<div class="sv">
      <div class="sv-head"><span class="case">Active surveillance</span>
        <button class="sv-x" data-act="svLeaveLauncher">&larr; The full portal</button></div>
      <div class="sv-body">
        <div class="sv-day">Day running</div>
        <div class="sv-timer">${svClock(ms)}</div>
        <div class="sv-since">${esc(a.case_no)}${a.subject_name ? " &middot; " + esc(a.subject_name) : ""}</div>
        <button class="sv-btn gold" data-act="svEnter" data-case="${esc(a.case_no)}">Resume active surveillance</button>
      </div></div>`;
  }
  const list = d.assignments || [];
  return `<div class="sv">
    <div class="sv-head"><span class="case">My surveillance assignments</span>
      <button class="sv-x" data-act="svLeaveLauncher">&larr; The full portal</button></div>
    <div class="sv-body">
      ${list.length ? list.map(c => `<button class="sv-launch" data-act="svEnter" data-case="${esc(c.case_no)}">
          <div style="font-weight:800">${esc(c.subject_name || c.case_no)}</div>
          <div style="color:#8fb4d9;font-size:.82rem" class="mono">${esc(c.case_no)}</div>
        </button>`).join("")
        : `<div class="sv-card">No assignments yet. The office assigns cases and they appear here.</div>`}
      <div style="color:#8fb4d9;font-size:.8rem;padding:8px 2px">
        Opening one starts or resumes its investigation day.</div>
    </div></div>`;
}

function svHomeScreen(){
  const open = WS && WS.open_day;
  const days = (WS && WS.days) || [];
  const acts = (WS && WS.activity) || [];
  const a = (WS && WS.authorization) || {};
  const last = acts[0];
  const note = (SV.err ? `<div class="sv-err">${esc(SV.err)}</div>` : "")
             + (SV.ok ? `<div class="sv-ok">${esc(SV.ok)}</div>` : "");

  if(!open){
    // No day running: the one screen is starting one (P3).
    const { date: today, time: now } = stampNow();
    return `<div class="sv-body">
      ${note}
      <div class="sv-day">Day ${days.length + 1}</div>
      <div class="sv-timer">--:--:--</div>
      <div class="sv-since">No investigation day running.</div>
      <div class="sv-card">
        <h3>Start the day</h3>
        <label class="sv-f"><span>Date</span><input id="sv_date" type="date" value="${today}"></label>
        <label class="sv-f"><span>Start time</span><input id="sv_start" type="time" value="${now}"></label>
        <label class="sv-f"><span>Beginning mileage <span style="opacity:.7">optional</span></span>
          <input id="sv_smiles" inputmode="decimal"></label>
      </div>
      <button class="sv-btn gold" data-act="svStartDay">Start investigation day</button>
    </div>`;
  }

  const ms = svElapsed();
  /* MOBILE PR 1 — THE SCREEN IS ORDERED BY HOW OFTEN A THING IS PRESSED.

     Measured on the previous layout at 390x844 with a day running: 275px of an
     844px screen before the first field control, and the order down the page was
     End investigation day (215px) -> Pause (283) -> Activity/Photo/Video/Note
     (358) -> Tap to speak (602). The control pressed ONCE A SHIFT was the
     loudest, highest and easiest to hit by accident; the four pressed all day
     were below it, and the microphone was off the first screen.

     The clock still informs — it is the first thing on the page and still
     readable at a glance from a driver's seat — but it is one line rather than
     four, and it no longer owns the screen.

     NOTHING FUNCTIONAL MOVED. `svElapsed`, `svClock`, `svPaused` and the
     `#svTimer` id the tick updater writes into are all untouched, as are every
     control's `data-act`. This is ordering and type size. */
  return `<div class="sv-body">
    ${note}
    ${""/* §1 and §16.1 — COMPACT. Two lines, not five. The controls an
           investigator reaches for are Quick Activity, Voice, Photo, Video and
           End day; every row of status above them is a row their thumb has to
           travel past while holding a camera in the other hand. Everything the
           old block said is still here, on two lines instead of four. */}
    <div class="sv-status${svPaused() ? " paused" : ""}">
      <div class="sv-st-line">
        <span class="sv-st-dot${svPaused() ? " paused" : ""}"></span>
        <span class="sv-st-word">${svPaused() ? "ON A BREAK" : "ACTIVE"}</span>
        <span class="sv-timer${svPaused() ? " paused" : ""}" id="svTimer">${
          ms == null ? "--:--:--" : svClock(ms)}</span>
      </div>
      <div class="sv-st-sub">Day ${days.length} &middot; ${svPaused()
        ? "not billed while stopped"
        : `since ${esc(t12(open.start_time))}`} &middot; ${esc(fmtDay(open.day_date))}${
        open.start_mileage != null ? ` &middot; ${esc(open.start_mileage)} mi` : ""}</div>
    </div>

    <div class="sv-quad">
      <button class="sv-q" data-act="svTab" data-t="activity"><b>&#9998;</b>Activity</button>
      <button class="sv-q" data-act="svPhoto"><b>&#128247;</b>Photo</button>
      <button class="sv-q" data-act="svVideo"><b>&#127909;</b>Video</button>
      <button class="sv-q" data-act="svNote"><b>&#128221;</b>Note</button>
    </div>

    ${svCaptureHtml()}
    ${svVoicePanelHtml()}
    ${svMicHtml()}

    ${""/* §10 — LAST ACTIVITY, correctable HERE. The spec is explicit: the
           investigator "must be able to correct the most recent activity
           without navigating away from the Active Surveillance Home screen",
           which is the difference between fixing a typo at the wheel and
           losing the thread of what you were watching.

           It posts to the SAME route the timeline's Edit uses, which is §11:
           voice-created and hand-typed activity share one edit system, and
           nothing about how an entry was made changes what correcting it
           does. */}
    <div class="sv-card">
      <h3>Last activity</h3>
      ${!last ? `<div style="color:#8fb4d9">Nothing logged yet today.</div>`
        : last.removed_at ? `
          <div class="sv-row"><span>${esc(t12(last.at_time))}</span></div>
          <div style="font-size:.95rem;text-decoration:line-through;opacity:.55">${
            esc(String(last.description || "").slice(0, 200))}</div>
          <div style="font-size:.82rem;color:#8fb4d9;margin-top:4px">Removed &mdash; not in the report.</div>
          <button class="sv-btn line" style="margin-top:8px" data-act="svRestore"
            data-id="${last.id}">Put it back</button>`
        : SV.lastEdit === last.id ? `
          <div class="sv-row"><span>${esc(t12(last.at_time))}</span></div>
          <textarea id="sv_last_edit" rows="3"
            style="width:100%">${esc(String(last.description || ""))}</textarea>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="sv-btn gold" data-act="svLastSave" data-id="${last.id}">Save</button>
            <button class="sv-btn line" data-act="svLastCancel">Cancel</button>
          </div>
          <div style="font-size:.78rem;color:#8fb4d9;margin-top:6px">Only the wording changes here.
            The time, place and vehicle on the entry are left exactly as they are.</div>`
        : `
          <div class="sv-row"><span>${esc(t12(last.at_time))}</span>${
            last.source === "voice" ? `<span style="font-size:.72rem;letter-spacing:.06em;
              opacity:.75">&#127908; VOICE</span>` : ""}</div>
          <div style="font-size:.95rem">${esc(String(last.description || "").slice(0, 200))}</div>
          <div style="display:flex;gap:16px;margin-top:8px">
            <button class="sv-tap" style="padding:0" data-act="svLastEdit" data-id="${last.id}">Edit</button>
            <button class="sv-tap" style="padding:0;color:#e79a9a" data-act="svDelete"
              data-id="${last.id}">Remove</button>
          </div>`}
      <button class="sv-btn line" style="margin-top:10px" data-act="svTab" data-t="timeline">View timeline</button>
    </div>

    ${a.authorized_hours != null ? `<div class="sv-card">
      <h3>Authorization</h3>
      <div class="sv-row"><span>Remaining</span><b>${esc(a.hours_remaining)} hours</b></div>
      ${a.warn_level != null ? `<div class="sv-warn">${a.warn_level >= 100
        ? "<b>Authorization is used up.</b> Contact the office before further work."
        : `<b>${esc(a.percent_used)}% used.</b> Past the ${esc(a.warn_level)}% mark.`}</div>` : ""}
    </div>` : ""}

    <div class="sv-shift">
      ${svPaused()
        ? `<button class="sv-btn gold" data-act="svResume">Resume the day</button>
           <button class="sv-btn line" data-act="svTab" data-t="endday">End investigation day</button>`
        : `<button class="sv-btn line" data-act="svPause">Pause &mdash; taking a break</button>
           <button class="sv-btn line end" data-act="svTab" data-t="endday">End investigation day</button>`}
    </div>
  </div>`;
}

/* ------------------------------------- the voice command registry (§4, §5, §7)

   SURVEILLANCE-VOICE.md §4: "ONE centralized command registry. No scattered
   phrase matching through UI components." This is it — the only place in the
   portal that turns something spoken into a canonical command, and the only
   place that decides what a recognized command is stored as.

   §5: a known command stores STANDARDIZED language, not the raw transcript.
   The wording below is this implementation's, not the owner's, except the two
   sentences §5 gives verbatim (NO_CHANGE_RESIDENCE and MOBILE_RESIDENCE_CHECK).
   It is all in one table so any of it can be reworded in one edit.

   §4 also says the SPOKEN ALIASES that arrived truncated "must not be
   inferred". So each `say` list holds the owner's own words and nothing
   reconstructed. VEHICLE_OBSERVED is deliberately left with NO alias: its
   fragment is the bare word "observed", and registering that would quietly
   file "subject observed" as a vehicle sighting — a command that never matches
   is honest, one that matches the wrong thing is not. Those rows are waiting
   on the owner's phrasing, not on code.

   WHAT THIS SLICE DOES NOT DO. It does not listen for a wake word, does not
   run a hands-free loop, and does not write `source = voice` — that last one
   needs a companion table decided deliberately (`activity_log` has no `source`
   column and ALTER TABLE is not idempotent here). This is §4/§5/§7 only,
   feeding the transcript review that already exists. Nothing auto-submits, and
   nothing about the existing flow was reversed. */

const VOICE_WAKE = "mobile";

const VOICE_COMMANDS = [
  { id: "ARRIVAL", text: "Investigator arrived on location.",
    say: ["arrival", "arrived"] },
  { id: "NO_CHANGE_RESIDENCE", text: "No change observed at the residence.",
    say: ["no change at residence", "no change at the residence"] },
  { id: "NO_CHANGE", text: "No change observed.",
    say: ["no change"] },
  { id: "MOBILE_RESIDENCE_CHECK", text: "Mobile check of residence was conducted.",
    say: ["doing a drive by check of residence", "drive by check of residence", "drive by check"] },
  { id: "MOBILE_CHECK", text: "Mobile check was conducted.",
    say: ["mobile check"] },
  { id: "SUBJECT_OBSERVED", text: "Subject observed.",
    say: ["subject observed"] },
  { id: "SUBJECT_DEPARTED", text: "Subject departed the location.",
    say: ["departed"] },
  { id: "SUBJECT_ARRIVED", text: "Subject arrived at the location.",
    say: ["subject arrived"] },
  { id: "SUBJECT_RETURNED", text: "Subject returned to the location.",
    say: ["subject returned"] },
  /* The owner supplied these two explicitly (2026-08-18) after the §4 fragment
     arrived as the bare word "observed". BARE "observed" IS DELIBERATELY NOT
     MAPPED, on their instruction and for the reason it was left unaliased in
     the first place: it would swallow "subject observed" and file a person as
     a vehicle. */
  { id: "VEHICLE_OBSERVED", text: "Subject vehicle observed.",
    say: ["vehicle observed", "vehicle sighting"] },
  { id: "SUBJECT_VEHICLE_PRESENT", text: "Subject vehicle present at the location.",
    say: ["subject vehicle present"] },
  { id: "SUBJECT_VEHICLE_ABSENT", text: "Subject vehicle absent from the location.",
    say: ["vehicle absent"] },
  { id: "LOST_VISUAL", text: "Visual contact lost.",
    say: ["lost visual"] },
  { id: "REGAINED_VISUAL", text: "Visual contact regained.",
    say: ["regained visual"] },
  { id: "POSITION_CHANGE", text: "Surveillance position changed.",
    say: ["changing position"] },
  { id: "DIRECT_VIEW", text: "Direct view of the location established.",
    say: ["direct view"] },
  { id: "INDIRECT_VIEW", text: "Indirect view of the location only.",
    say: ["indirect view"] },
  { id: "NO_ACTIVITY", text: "No activity observed.",
    say: ["no activity"] },
  { id: "STATIONARY_SURVEILLANCE", text: "Stationary surveillance conducted.",
    say: ["stationary surveillance"] },
  { id: "MOBILE_SURVEILLANCE", text: "Mobile surveillance conducted.",
    say: ["conducting mobile surveillance"] },
  /* §6B. Not an activity sentence — it is the door into free-form dictation,
     which §6 says must never file itself. */
  { id: "FREE_FORM_DICTATION_MODE", text: null, dictation: true,
    say: ["note"] },
  /* §13 — THESE FILE NOTHING. "Never fake evidence creation": a spoken word
     cannot open a camera, because the browser requires a gesture before
     capture, and it must never write a record claiming a picture that does not
     exist. What they do is PREPARE the capture and wait for the one tap. */
  { id: "TAKE_PHOTO", text: null, capture: "photo",
    say: ["take photo", "take a photo", "photo"] },
  { id: "TAKE_VIDEO", text: null, capture: "video",
    say: ["take video", "video"] },
];

/* The wake word lives with the registry, because §4 wants ONE place that
   decides what a spoken phrase means and "was this even addressed to us" is
   the first half of that decision. */
function voiceHasWake(spoken){
  const n = voiceNormalize(spoken);
  return n === VOICE_WAKE || n.startsWith(VOICE_WAKE + " ");
}
function voiceIsWakeOnly(spoken){
  return voiceNormalize(spoken) === VOICE_WAKE;
}

/* What the operator actually SAID, with the wake word taken off the front so
   the entry reads as their sentence rather than as an instruction to the
   portal. A leading "note" goes too: that word was how they asked for free
   text, not part of the observation. Nothing else is rewritten — it is their
   record, and tidying someone's words is how a log stops matching what
   happened. */
function voiceSpokenWords(spoken){
  return String(spoken == null ? "" : spoken).trim()
    .replace(/^\s*mobile\b[\s,.:;-]*/i, "")
    .replace(/^\s*note\b[\s,.:;-]*/i, "")
    .trim();
}

function voiceNormalize(str){
  return String(str == null ? "" : str).toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

/* "Mobile, no change" and "no change" are the same command. The wake word is
   stripped for matching, but the unstripped form is matched too, because a
   couple of the owner's aliases carry "mobile" inside them ("Mobile check"). */
function voiceForms(spoken){
  const full = voiceNormalize(spoken);
  const bare = full.startsWith(VOICE_WAKE + " ") ? full.slice(VOICE_WAKE.length + 1).trim() : full;
  return bare === full ? [full] : [full, bare];
}

/* §7 — NEVER GUESS. Three outcomes and no fourth: one command matched, more
   than one could have, or none did. The longest alias wins, so "no change at
   residence" is not filed as the shorter "no change"; a genuine tie between
   two DIFFERENT commands is reported as ambiguous rather than resolved by the
   order this table happens to be written in. */
function voiceMatch(spoken){
  const forms = voiceForms(spoken);
  if(!forms[0]) return {status: "empty"};
  let best = [], bestLen = -1;
  for(const cmd of VOICE_COMMANDS){
    for(const alias of cmd.say){
      const a = voiceNormalize(alias);
      if(!a) continue;
      if(!forms.some((f) => f === a || f.startsWith(a + " "))) continue;
      if(a.length > bestLen){ bestLen = a.length; best = [cmd]; }
      else if(a.length === bestLen && best.indexOf(cmd) < 0) best.push(cmd);
    }
  }
  const said = forms[forms.length - 1];
  if(!best.length) return {status: "unrecognized", said};
  if(best.length > 1) return {status: "ambiguous", said, candidates: best.slice()};
  const cmd = best[0];
  if(cmd.capture) return {status: "capture", said, command: cmd};
  if(cmd.dictation) return {status: "dictation", said, command: cmd};
  return {status: "ok", said, command: cmd, text: cmd.text};
}

/* Voice (P8). Level 1 is the phone's own keyboard dictation, which every text
   field here already accepts. Level 2 is this: the browser's speech API where
   it exists, ALWAYS reviewed before it becomes a log entry — nothing spoken is
   ever submitted straight into the record. */
/* ------------------------------------ VOICE COMMAND MODE (§2, §9, §14, §16)

   §14: explicit activation, and the microphone is inactive when off. This
   never starts itself — opening Active Surveillance does not arm anything, and
   there is no path here that turns it on as a side effect of something else.

   §2's loop: listening for "Mobile" -> a command -> file it -> back to
   listening, without the investigator touching the button between commands.
   A single utterance carrying both ("Mobile, no change at residence") is
   handled in one step, because that is how people actually speak; saying just
   "Mobile" arms it and waits, which is the two-step form the spec describes.

   §16 is a truth-in-labelling rule and it is enforced, not just written: this
   is FOREGROUND functionality, so the loop stops when the page is hidden and
   says so. An investigator who believes the phone is listening in their pocket
   stops narrating, and the hole in the day's log is found when the report is
   written. The honest failure costs one restart; the dishonest one costs the
   evidence. */

const VOICE_STATE_LABEL = {
  off:        "Voice mode off",
  wake:       "Listening for “Mobile…”",
  command:    "Listening for the command…",
  processing: "Processing…",
  permission: "Microphone permission needed",
  stopped:    "Voice mode stopped",
};

/* ---------------------------------- WHAT SAFARI ACTUALLY DID (device bug, 2026-08-18)

   Reported live on iPhone: voice mode says ON, iOS shows the microphone
   indicator, and saying "Mobile" produces nothing — while "Tap to speak" also
   does nothing. Two different symptoms, and neither is visible from here: this
   container has no speech engine at all, so the only honest instrument is one
   that shows what the DEVICE did.

   Every SpeechRecognition event is recorded with a timestamp, alongside the
   calls this page makes itself. That distinction is the whole diagnostic value:
   "we called start() and the engine never said start" is a different fault from
   "start, audiostart, speechstart, then end with no result", and they have
   different fixes. Newest first, because on a phone the top of the list is what
   you can see. */
const VOICE_ENGINE_EVENTS = ['start', 'audiostart', 'soundstart', 'speechstart',
  'result', 'nomatch', 'error', 'speechend', 'soundend', 'audioend', 'end'];
const VOICE_LOG_MAX = 28;

function svVoiceLog(what, detail){
  const v = svVoice();
  if(!v.log) v.log = [];
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const ss = String(d.getSeconds()).padStart(2, "0");
  const ms = String(d.getMilliseconds()).padStart(3, "0");
  v.log.unshift({t: `${hh}:${mm}:${ss}.${ms}`, e: String(what),
                 d: detail == null ? "" : String(detail).slice(0, 120)});
  if(v.log.length > VOICE_LOG_MAX) v.log.length = VOICE_LOG_MAX;
}

/* ONE ENGINE AT A TIME, and this is a real defect rather than a Safari quirk.
   The page had TWO recognisers — the loop's and "Tap to speak"'s — and a
   browser gives the page ONE speech session. Starting a second while the first
   is live throws InvalidStateError on some engines and is silently ignored on
   others, and "silently ignored" is exactly what a button that does nothing
   looks like. */
function svSpeechOwner(){
  if(SV.voice && SV.voice.rec) return "voice";
  if(SV.listening && SV._rec) return "mic";
  return null;
}

function svVoiceSupported(){
  return typeof window !== "undefined"
    && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}

function svVoice(){
  if(!SV.voice){
    SV.voice = {on: false, state: "off", msg: "", err: "", armed: false,
                rec: null, filing: false, last: null};
  }
  return SV.voice;
}

function svVoiceToggle(){
  const v = svVoice();
  if(v.on) return svVoiceStop("off");
  /* §14 — all of: an investigator, an authorised case, an ACTIVE surveillance
     session, and this explicit act. The first two are the Worker's to enforce
     (§15, and it does); the running day is the one this screen knows about. */
  if(!(WS && WS.open_day)){
    v.err = "Start the investigation day first — voice mode files activity onto a running day.";
    return paint();
  }
  if(!svVoiceSupported()){
    v.err = "This browser has no speech recognition. Your keyboard's own dictation still works in every field.";
    return paint();
  }
  /* Take the one speech session cleanly. "Tap to speak" may be holding it, and
     starting a second engine on top of it is the defect this bug report is
     half made of. */
  if(SV.listening && SV._rec){
    svVoiceLog("stopping Tap to speak first");
    try{ SV._rec.stop(); }catch{}
    SV.listening = false; SV._rec = null;
  }
  v.on = true; v.err = ""; v.msg = ""; v.armed = false; v.last = null;
  svVoiceLog("voice mode ON");
  svVoiceListen();
  paint();
}

function svVoiceStop(reason){
  const v = svVoice();
  if(v.on || v.rec) svVoiceLog("voice mode stopping", reason);
  v.on = false;
  v.armed = false;
  v.filing = false;
  v.state = reason === "off" ? "off" : "stopped";
  if(reason === "hidden"){
    v.err = "Voice mode stopped because this page went into the background. "
          + "It only listens while it is on screen.";
  }
  if(v.rec){
    /* Clear onend FIRST, or the restart it exists for fires on the way out and
       turns the microphone straight back on. */
    try{ v.rec.onend = null; v.rec.onresult = null; v.rec.onerror = null; v.rec.stop(); }catch{}
    v.rec = null;
  }
  paint();
}

function svVoiceListen(){
  const v = svVoice();
  if(!v.on) return;
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec;
  try{ rec = new Ctor(); }catch{ v.on = false; v.state = "off";
    v.err = "The microphone could not be opened."; return paint(); }
  v.rec = rec;
  rec.lang = "en-US";
  /* NOT CONTINUOUS. iOS Safari does not honour it — the session starts, the
     microphone indicator comes on, and no result is ever delivered, which is
     the reported symptom exactly. One-shot recognition restarted on `end` is
     the portable shape and behaves the same on desktop, so there is one code
     path rather than a device sniff. */
  rec.continuous = false;
  rec.interimResults = false;
  rec.maxAlternatives = 1;

  /* EVERY engine event, whether or not this page acts on it. What is missing
     from the log is as diagnostic as what is in it. */
  for(const name of VOICE_ENGINE_EVENTS){
    rec["on" + name] = (e) => {
      if(name === "error") svVoiceLog("error", (e && e.error) || "unknown");
      else if(name === "result") svVoiceLog("result", svVoiceTranscript(e));
      else svVoiceLog(name);
      svVoiceEngineEvent(name, e);
      if(v.on || name === "error" || name === "end") paint();
    };
  }

  svVoiceLog("start() called");
  try{ rec.start(); }
  catch(err){
    /* An engine that refuses to start while another session is live, or
       without a fresh user gesture, must not leave the panel claiming ON. */
    svVoiceLog("start() threw", err && err.message);
    v.on = false; v.state = "off"; v.rec = null;
    v.err = "The microphone would not start: " + ((err && err.message) || "unknown")
          + ". Tap voice mode on again.";
    return paint();
  }
  v.state = v.armed ? "command" : "wake";
}

function svVoiceTranscript(e){
  try{
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r && r.isFinal && r[0]) return r[0].transcript;
    }
    const r0 = e.results && e.results[0];
    return r0 && r0[0] ? r0[0].transcript : "";
  }catch{ return ""; }
}

/* The engine's events, in one place, so the log above and the behaviour below
   can never disagree about what happened. */
function svVoiceEngineEvent(name, e){
  const v = svVoice();
  if(name === "result"){
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r && r.isFinal) svVoiceHeard(r[0] ? r[0].transcript : "");
    }
    return;
  }
  if(name === "error"){
    const err = (e && e.error) || "";
    if(err === "not-allowed" || err === "service-not-allowed"){
      v.on = false; v.state = "permission"; v.rec = null;
      v.err = "The microphone was not allowed, so voice mode is off.";
      return;
    }
    /* no-speech and aborted are ordinary — the engine gives up after a pause
       and `end` puts it back. They are logged, never hidden, but they do not
       stop anything. */
    return;
  }
  if(name === "end"){
    /* ONE-SHOT, SO `end` IS THE NORMAL CASE, not a failure. Restart unless the
       operator turned it off or the page went to the background (§16). */
    if(!v.on) return;
    if(typeof document !== "undefined" && document.hidden) return;
    svVoiceLog("restarting");
    try{ if(v.rec) v.rec.start(); }
    catch(err){
      /* iOS can refuse a restart that did not come from a user gesture. Say so
         rather than sitting there claiming to listen. */
      svVoiceLog("restart threw", err && err.message);
      setTimeout(() => {
        if(!v.on) return;
        try{ if(v.rec) v.rec.start(); svVoiceLog("restart retried"); }
        catch(err2){
          svVoiceLog("restart failed", err2 && err2.message);
          v.on = false; v.state = "off"; v.rec = null;
          v.err = "The microphone stopped and this browser would not restart it on its own. "
                + "Tap voice mode on again.";
          paint();
        }
      }, 400);
    }
  }
}

/* §9 — brief. "NO CHANGE · 10:42 AM", never a spoken paragraph. */
/* §8's other half, from this side: ONE name per utterance, kept across every
   retry. A POST that landed and whose response was lost is indistinguishable
   from one that never arrived, so the client says which utterance it is and
   the Worker answers with the entry that already exists. */
function svVoiceEventId(){
  const a = new Uint8Array(12);
  (window.crypto || {}).getRandomValues ? window.crypto.getRandomValues(a)
    : a.forEach((_, i) => { a[i] = Math.floor(Math.random() * 256); });
  return [...a].map((b) => b.toString(16).padStart(2, "0")).join("");
}

function svVoiceQueue(){
  const v = svVoice();
  if(!v.queue) v.queue = [];
  return v.queue;
}

/* WHAT WAS SAID IS NOT LOST BECAUSE THE SIGNAL WAS NOT THERE. A surveillance
   position is exactly where there is no bar of service, and the observation is
   the thing this feature exists to keep. It is held in memory and sent when the
   network comes back — every attempt carrying the same event id, so an entry
   that actually landed is never written twice.

   KNOWN LIMIT, stated rather than discovered: the queue does not survive the
   page being closed. Persisting a claimant's narrative to this phone's local
   storage is a data-boundary decision nobody has made, and it is not one to
   take as a side effect of a retry loop. */
async function svVoiceFlush(){
  const v = svVoice();
  const q = svVoiceQueue();
  if(v.flushing || !q.length) return;
  v.flushing = true;
  let sent = 0;
  while(q.length){
    const item = q[0];
    try{
      await api(`/cases/${encodeURIComponent(item.caseNo)}/activity`,
        {method: "POST", body: item.body});
      q.shift(); sent++;
    }catch(e){
      /* A refusal is permanent; a dropped connection is not. Only the second
         is worth retrying, or a malformed entry would retry until the battery
         died. */
      if(e && e.status && e.status < 500){ q.shift(); v.err = e.message; continue; }
      break;
    }
  }
  v.flushing = false;
  if(sent){ v.err = ""; await svReload(); }
  paint();
}

function svVoiceScheduleFlush(){
  const v = svVoice();
  if(v.flushTimer) return;
  v.flushTimer = setInterval(() => {
    const q = svVoiceQueue();
    if(!q.length){ clearInterval(v.flushTimer); v.flushTimer = null; return; }
    svVoiceFlush();
  }, 20000);
}

if(typeof window !== "undefined"){
  window.addEventListener("online", () => { if(svVoiceQueue().length) svVoiceFlush(); });
}

function svVoiceConfirm(label, when){
  return String(label).replace(/_/g, " ") + " · " + t12(hmLocal(when));
}

async function svVoiceHeard(raw){
  const v = svVoice();
  if(!v.on) return;
  const said = String(raw || "").trim();
  if(!said) return;

  /* NOT EVERYTHING IN THE CAR IS FOR US. While voice mode is on the microphone
     hears the radio, the passenger and the road; only an utterance carrying the
     wake word — or the one immediately after "Mobile" on its own — is treated
     as addressed to the portal. This is the one thing that must stay strict:
     without it the day's log fills with the passenger's half of a phone call. */
  if(!voiceHasWake(said) && !v.armed) return;

  if(voiceIsWakeOnly(said)){
    v.armed = true; v.state = "command"; v.err = ""; return paint();
  }

  /* AFTER "MOBILE", NOTHING SPOKEN IS THROWN AWAY (owner, 2026-08-18).

     This reverses what §7 asked for, deliberately and on the owner's
     instruction, and the reasoning is worth keeping because it is a judgement
     about which failure costs more. §7 was written to stop a misheard phrase
     filing itself as an official record. The first build honoured that by
     PAUSING the loop and asking — and at the wheel that is worse: the
     investigator carries on narrating to a microphone that stopped listening,
     and the hole in the log is found when the report is written.

     THE PART OF §7 THAT STILL HOLDS, and it is the part that mattered: an
     uncertain phrase never gets a CANONICAL COMMAND. "Mobile change" fits both
     NO_CHANGE and CHANGE_POSITION, which are opposite facts about the same
     minute, and guessing between them puts a claim in the evidence log that
     nobody made. Saving the words actually spoken asserts nothing false — it
     records what was said, marked as voice, editable, with the raw transcript
     kept beside it. */
  const m = voiceMatch(said);

  /* §13 — PREPARE THE CAPTURE, CLAIM NOTHING. A spoken word cannot open a
     camera: the browser wants a gesture before it will, and iOS means it. So
     the command puts the capture one tap away and says so, and NOTHING is
     written until a file actually arrives. "Never fake evidence creation" is
     the whole instruction, and an activity entry saying a photograph was taken
     would be exactly that. The loop keeps listening while it waits. */
  if(m.status === "capture"){
    SV.capture = {kind: m.command.capture};
    v.msg = "";
    v.err = "";
    v.armed = false;
    v.state = v.on ? "wake" : "off";
    return paint();
  }

  const known = m.status === "ok";
  const text = known ? m.text : voiceSpokenWords(said);
  const commandId = known ? m.command.id : null;
  if(!text) return;                       // "Mobile," and nothing else

  /* §8 — one spoken command, ONE record. Engines re-emit a final result, and a
     filing loop turns that into a duplicate in the evidence log. Two guards,
     because §8 says not to rely on matching text alone: nothing files while a
     file is in flight, and the same thing again inside six seconds is the
     engine hearing it twice rather than the investigator saying it twice. For
     free speech the key is the words, since there is no command id to key on.

     NOT COVERED: retries after an offline period, which §8 also names. That
     half needs a server-side event key and is not built. */
  const key = commandId || ("free:" + voiceNormalize(text));
  const now = Date.now();
  if(v.filing) return;
  if(v.last && v.last.id === key && now - v.last.at < 6000){
    v.armed = false; v.state = "wake"; return paint();
  }
  v.filing = true;
  v.last = {id: key, at: now};
  v.state = "processing"; v.err = ""; paint();

  const when = new Date();
  const stamp = stampNow();
  const body = {
    at_date: stamp.date, at_time: stamp.time, kind: "activity",
    description: text, source: "voice", command_id: commandId, heard: said,
    /* Named once, kept through every retry — that is what lets the Worker tell
       a lost response from a lost request. */
    event_id: svVoiceEventId(),
  };
  const caseNo = WS_CASE;
  try{
    await api(`/cases/${encodeURIComponent(caseNo)}/activity`, {method: "POST", body});
    v.msg = svVoiceConfirm(known ? m.command.id : "VOICE NOTE", when);
  }catch(e){
    if(e && e.status && e.status < 500){
      /* Refused, not dropped. Retrying a malformed entry forever helps nobody. */
      v.err = e.message;
      v.last = null;
    }else{
      /* NO SIGNAL IS THE ORDINARY CASE HERE — a surveillance position is
         exactly where there is no bar of service. The observation is kept and
         sent when the network returns; it is not the investigator's problem
         that the road had no coverage. */
      svVoiceQueue().push({caseNo, body});
      svVoiceScheduleFlush();
      v.msg = "";
      v.err = "No connection — held on this phone and it will send itself.";
    }
  }
  v.filing = false;
  v.armed = false;
  /* BACK TO LISTENING EITHER WAY. The loop does not stop for a phrase it did
     not recognise — that was the whole complaint. */
  v.state = v.on ? "wake" : "off";
  await svReload();
}

/* §16 — foreground only, and enforced rather than merely stated. */
if(typeof document !== "undefined"){
  document.addEventListener("visibilitychange", () => {
    if(document.hidden && SV && SV.voice && SV.voice.on) svVoiceStop("hidden");
  });
}

/* §13 — THE CAPTURE, PREPARED AND NOT CLAIMED. A spoken command cannot open a
   camera: the browser wants a gesture and iOS enforces it. So the voice command
   puts this one tap away, high on the screen where a thumb already is, and
   NOTHING is recorded until a file actually arrives — which is the existing
   upload path's own rule, unchanged. */
function svCaptureHtml(){
  const c = SV.capture;
  if(!c) return "";
  const photo = c.kind === "photo";
  return `<div class="sv-capture">
    <div class="sv-capture-h">${photo ? "&#128247; Photo ready" : "&#127909; Video ready"}</div>
    <p class="sv-capture-p">Your phone needs one tap before it will open the
      ${photo ? "camera" : "video tool"}. Nothing is logged until the
      ${photo ? "picture" : "clip"} actually arrives.</p>
    <button class="sv-btn gold" data-act="svCaptureGo">${
      photo ? "Open the camera" : "Open the video tool"}</button>
    <button class="sv-btn line" data-act="svCaptureCancel">Not now</button>
  </div>`;
}

/* §14's states, in the one place they are drawn. The panel is ABOVE the
   review, so when the loop hands over to a question the operator can see that
   voice mode paused and why — a control that goes quiet without saying so is
   how someone ends up talking to a microphone that stopped listening. */
function svVoicePanelHtml(){
  const v = svVoice();
  const supported = svVoiceSupported();
  const day = !!(WS && WS.open_day);
  const label = VOICE_STATE_LABEL[v.state] || VOICE_STATE_LABEL.off;
  return `<div class="sv-voice">
    <button class="sv-voicebtn${v.on ? " on" : ""}" data-act="svVoiceToggle"
      ${supported && day ? "" : "disabled"}>${v.on
        ? "&#127908; Voice mode ON &mdash; tap to stop"
        : "&#127908; Voice mode OFF &mdash; tap to start"}</button>
    <div class="sv-voicestate${v.on ? " live" : ""}">${esc(label)}</div>
    ${v.msg ? `<div class="sv-ok">&#10003; ${esc(v.msg)}</div>` : ""}
    ${v.err ? `<div class="sv-err">${esc(v.err)}</div>` : ""}
    ${""/* Held work is SHOWN. An entry waiting in a queue nobody can see is an
           entry the investigator believes was filed. */}
    ${(v.queue && v.queue.length) ? `<div class="sv-voicewait">${v.queue.length}
      ${v.queue.length === 1 ? "entry is" : "entries are"} held on this phone and will send
      when there is signal. <button class="sv-tap" data-act="svVoiceRetry">Try now</button></div>` : ""}
    ${v.on ? `<div class="sv-voicenote">Say &ldquo;Mobile&rdquo; and the command &mdash; or
      just say what happened, and it is saved in your own words for you to tidy later.
      It keeps listening between entries, so you do not tap between them.
      <b>It only listens while this page is on screen</b>, not when the phone is locked
      or this is in the background.</div>` : ""}
    ${!supported ? `<div class="sv-voicenote">This browser has no speech recognition, so
      voice mode cannot start here. Your keyboard&rsquo;s own dictation still works in
      every field.</div>`
      : !day ? `<div class="sv-voicenote">Voice mode files activity onto a running day,
        so start the investigation day first.</div>` : ""}
    ${svVoiceLogHtml()}
  </div>`;
}

/* THE DEVICE SPEAKS FOR ITSELF. Shown on the phone, because that is the only
   place the engine exists — a log in a console nobody can open on an iPhone in
   a car is not a diagnostic. It appears once there is something to show and can
   be cleared, so it costs nothing when it is not wanted. */
function svVoiceLogHtml(){
  const v = svVoice();
  const log = v.log || [];
  if(!log.length) return "";
  /* OPEN BY DEFAULT. This exists to be read during a device test, and a
     diagnostic behind a tap is one the operator will not think to open when
     the thing they are debugging is why nothing happened. Collapsed content
     also is not text on the page, which is its own kind of invisible. */
  const hidden = v.logHidden === true;
  return `<div class="sv-voicelog">
    <div class="sv-voiceloghead">
      <b>Speech events (${log.length}) &mdash; what this device actually did</b>
      <button class="sv-tap" data-act="svVoiceLogToggle">${hidden ? "Show" : "Hide"}</button>
    </div>
    ${hidden ? "" : `<div class="sv-voicelogrows">
      ${log.map((r) => `<div><span>${esc(r.t)}</span><b>${esc(r.e)}</b>${
        r.d ? `<i>${esc(r.d)}</i>` : ""}</div>`).join("")}
    </div>
    <button class="sv-tap" data-act="svVoiceLogClear">Clear the log</button>`}
  </div>`;
}

function svMicHtml(){
  const supported = typeof window !== "undefined"
    && (window.SpeechRecognition || window.webkitSpeechRecognition);
  if(SV.heard != null){
    const m = voiceMatch(SV.heard);

    /* §7 — NEVER GUESS. More than one command could have been meant, so the
       portal asks instead of choosing. Nothing is prefilled and nothing is
       logged: the operator picks, or keeps their own words. */
    if(m.status === "ambiguous" && SV.voiceText == null){
      return `<div class="sv-heard">
        <div style="font-weight:800;margin-bottom:6px">Which did you mean?</div>
        <div style="font-size:.85rem;color:#5c6775;margin-bottom:8px">Heard
          &ldquo;${esc(SV.heard)}&rdquo; &mdash; more than one command fits it, so nothing
          has been chosen for you.</div>
        ${m.candidates.map((c, i) => `<button class="btn sm" style="display:block;width:100%;
          text-align:left;margin-bottom:6px" data-act="svPickCmd"
          data-i="${i}">${esc(c.text)}</button>`).join("")}
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn sm ghost" data-act="svKeepWords">Use my own words instead</button>
          <button class="btn sm ghost" data-act="svDiscard">Discard</button>
        </div>
      </div>`;
    }

    /* §5 — a recognized command stores STANDARDIZED language, not the raw
       transcript. The transcript is shown above it so the operator can see
       what it was matched from, and the box stays editable because the review
       is the point. */
    const std = SV.voiceText != null ? SV.voiceText
      : m.status === "ok" ? m.text
      : m.status === "dictation"
        ? String(SV.heard).replace(/^\s*mobile[\s,]*/i, "").replace(/^\s*note[\s,]*/i, "").trim()
        : SV.heard;
    const standardized = SV.voiceText != null || m.status === "ok";
    return `<div class="sv-heard">
      <div style="font-weight:800;margin-bottom:6px">${
        standardized ? "Recognized &mdash; read it before it goes in"
                     : m.status === "dictation" ? "Note &mdash; read it before it goes in"
                                                : "Heard &mdash; read it before it goes in"}</div>
      ${standardized || m.status === "dictation" ? `<div style="font-size:.8rem;color:#5c6775;
        margin-bottom:6px">Heard &ldquo;${esc(SV.heard)}&rdquo;</div>` : ""}
      <textarea id="sv_heard" rows="4">${esc(std)}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn sm" data-act="svUseText">Use this text</button>
        <button class="btn sm ghost" data-act="svDiscard">Discard</button>
      </div>
      <div style="font-size:.78rem;color:#5c6775;margin-top:8px">
        ${standardized ? "Standard wording for that command &mdash; edit it if this time was different. " : ""}Dictation is handled by your device or browser; this page keeps no audio.
        Nothing is logged until you press Use.</div>
    </div>`;
  }
  if(!supported){
    return `<button class="sv-mic" data-act="svNoMic">&#127908; Tap to speak
      <div style="font-weight:400;font-size:.78rem;opacity:.75;margin-top:4px">
        Not available in this browser &mdash; the keyboard's own dictation works in every field</div></button>`;
  }
  return `<button class="sv-mic ${SV.listening ? "live" : ""}" data-act="svMic">
    ${SV.listening ? "&#9679; Listening&hellip; tap to stop" : "&#127908; Tap to speak"}</button>`;
}

function svCaseDrawer(){
  const s = (WS && WS.submission) || {};
  const p = s.payload || {};
  const claim = s.kind === "claims";
  const a = (WS && WS.authorization) || {};
  const subjects = (WS && WS.subjects) || [];
  const row = (k, v) => v ? `<div class="sv-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>` : "";
  const na = (k, st) => !st ? "" : `<div class="sv-row"><span>${esc(k)}</span><b style="opacity:.7">Not known yet</b></div>`;
  return `<div class="sv-body">
    <div class="sv-card">
      <h3>${claim ? "Claimant" : "Subject"}</h3>
      ${row("Name", p.subject_name)}
      ${p.subject_address ? row("Address", p.subject_address) : na("Address", p.subject_address_status)}
      ${p.subject_description ? row("Vehicle / description", p.subject_description)
        : na("Vehicle / description", p.subject_description_status)}
      ${row(claim ? "Injury & restrictions" : "Relationship", p.subject_relationship)}
    </div>
    ${subjects.length ? `<div class="sv-card"><h3>Subjects on file</h3>
      ${subjects.map(sj => `<div class="sv-row"><span>${esc(sj.name)}</span><b>${
        (sj.vehicles || []).length} vehicle${(sj.vehicles || []).length === 1 ? "" : "s"}</b></div>`).join("")}
    </div>` : ""}
    <div class="sv-card">
      <h3>The assignment</h3>
      ${row(claim ? "Scope" : "Objective", p.objective)}
      ${row("Permitted days", p.permitted_days)}${row("Permitted times", p.permitted_times)}
      ${row("Weekend", p.weekend_authorized)}${row("Geographic limits", p.geographic_limits)}
      ${row("Priority", p.priority)}
      ${a.authorized_hours != null ? `<div class="sv-row"><span>Hours remaining</span><b>${esc(a.hours_remaining)}</b></div>`
        : p.authorized_hours_status === "pending"
        ? `<div class="sv-row"><span>Authorization</span><b>Pending</b></div>` : ""}
      ${row("Field notes", p.notes)}
    </div>
    <div style="color:#8fb4d9;font-size:.8rem;padding:0 2px 8px">
      This is the fieldwork view. Billing, the client's identity and the office's
      notes stay with the office &mdash; the server never sends them here.</div>
    ${svExitBlock()}
  </div>`;
}

/* MOBILE PR 2 — LEAVING THE MODE IS A THUMB ACTION NOW.

   It lived in the sticky header at roughly y30-70 of an 844px screen: the
   top-right corner, the furthest point on the phone from a right thumb, and
   still wrapping to two lines at 390px. It is the control you reach for when
   you are done, so it was in the worst place it could be.

   It moves into the Case drawer — the `⋮` item the bottom bar already has —
   rather than becoming a sixth top-level item, because six targets across
   390px narrows every one of them. That also puts it behind one deliberate
   tap, which is the right amount of friction: findable, not fumbled into.

   `svExit` itself is untouched. This is where the control lives, not what it
   does. It is deliberately NOT gold and reads as leaving a screen, so it stays
   distinct from End investigation day, which ends the billable clock. */
function svExitBlock(){
  return `<div class="sv-exitblock">
    <button class="sv-btn line" data-act="svExit">&larr; Exit active mode</button>
    <p class="sv-exitnote">Leaves the field view and returns to the full portal.
      It does not end your investigation day.</p>
  </div>`;
}

function svTimelineScreen(){
  const acts = (WS && WS.activity) || [];
  const ev = ((WS && WS.evidence) || []).filter(e => !e.deleted_at);
  const counts = e => {
    const mine = ev.filter(x => x.entry_id === e.id);
    const ph = mine.filter(x => String(x.content_type || "").startsWith("image/")).length;
    const vi = mine.filter(x => String(x.content_type || "").startsWith("video/")).length;
    return (ph ? `&#128247; ${ph} ` : "") + (vi ? `&#127909; ${vi}` : "");
  };
  const live = acts.filter(e => !e.removed_at);
  return `<div class="sv-body">
    ${SV.err ? `<div class="sv-err">${esc(SV.err)}</div>` : ""}
    <div class="sv-card">
      <h3>Timeline &middot; ${live.length} entr${live.length === 1 ? "y" : "ies"}</h3>
      ${acts.length ? `<ul class="sv-tl">${acts.map(e => e.removed_at ? `<li style="opacity:.45">
        <div class="t">${esc(t12(e.at_time))}</div>
        <div style="text-decoration:line-through">${esc(e.description)}</div>
        <div class="m">Removed ${when(e.removed_at)} &mdash; not in the report
          <button class="sv-back" style="padding:2px 0 0" data-act="svRestore" data-id="${e.id}">Put it back</button></div>
      </li>` : `<li>
        <div class="t">${esc(t12(e.at_time))}</div>
        <div>${esc(e.description)}</div>
        <div class="m">${counts(e)}${e.location ? " &middot; " + esc(e.location) : ""}${e.edited_at ? " &middot; edited" : ""}</div>
        <div style="display:flex;gap:14px;margin-top:6px">
          <button class="sv-back" style="padding:0" data-act="svEdit" data-id="${e.id}">Edit</button>
          <button class="sv-back" style="padding:0;color:#e79a9a" data-act="svDelete" data-id="${e.id}">Delete</button>
        </div>
      </li>`).join("")}</ul>` : `<div style="color:#8fb4d9">Nothing logged yet.</div>`}
    </div>
    <button class="sv-btn gold" data-act="svTab" data-t="activity">+ Add activity</button>
  </div>`;
}

/* Quick activity (P5–P7). The same ACTION_GROUPS and favorites the desktop
   sheet uses — one vocabulary, so a line starred in the office is starred in
   the field. Every entry posts to the same /activity route. */
function svActivityScreen(){
  const e = SV.entry;
  if(e){
    const now = new Date().toTimeString().slice(0,5);
    return `<div class="sv-body">
      ${SV.err ? `<div class="sv-err">${esc(SV.err)}</div>` : ""}
      <button class="sv-x" style="padding:0 0 10px" data-act="svPick" data-line="">&larr; ${
        e.edit ? "Back to the timeline" : "All actions"}</button>
      <div class="sv-card">
        <label class="sv-f"><span>Time</span><input id="sv_time" type="time" value="${esc(e.time || now)}"></label>
        ${!e.edit && e.pick === ARRIVAL_LINE ? `
        <label class="sv-f"><span>Vehicles present &mdash; optional</span>
          <input id="sv_vp" data-act-input="svArrival" placeholder="e.g. Subject&#39;s white GMC Sierra in the driveway"></label>
        <label class="sv-f"><span>View &mdash; optional</span>
          <select id="sv_view" data-act-input="svArrival">
            <option value="">Not specified</option>
            ${ARRIVAL_VIEW.map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join("")}
          </select></label>
        <label class="sv-f"><span>Position &mdash; optional</span>
          <select id="sv_place" data-act-input="svArrival">
            <option value="">Not specified</option>
            ${ARRIVAL_PLACE.map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join("")}
          </select></label>
        <label class="sv-f"><span>Position detail &mdash; optional</span>
          <input id="sv_pos" data-act-input="svArrival" placeholder="e.g. with a clear view of the front door"></label>` : ""}
        <label class="sv-f"><span>Details &mdash; edit freely</span>
          <textarea id="sv_desc" rows="4" data-act-input="svDirty">${esc(e.text || "")}</textarea></label>
        ${e.edit ? "" : `
        <label class="cap" style="color:#e8eef5"><input type="checkbox" id="sv_sd"><span>Subject documented</span></label>
        <label class="cap" style="color:#e8eef5"><input type="checkbox" id="sv_pa"><span>Photo taken</span></label>
        <label class="cap" style="color:#e8eef5"><input type="checkbox" id="sv_va"><span>Video acquired</span></label>`}
        <details style="margin-top:10px" ${e.edit && (e.loc || e.veh || e.note) ? "open" : ""}>
          <summary style="color:#8fb4d9;cursor:pointer">More details</summary>
          <label class="sv-f" style="margin-top:8px"><span>Location</span><input id="sv_loc" value="${esc(e.loc || "")}"></label>
          <label class="sv-f"><span>Vehicle</span><input id="sv_veh" value="${esc(e.veh || "")}"></label>
          <label class="sv-f"><span>Internal note &mdash; never client-facing</span><input id="sv_note" value="${esc(e.note || "")}"></label>
        </details>
      </div>
      <button class="sv-btn gold" data-act="svSaveEntry">${e.edit ? "Save the correction" : "Save activity"}</button>
      ${e.edit ? `<button class="sv-btn line" data-act="svDelete" data-id="${e.edit}">Delete this entry</button>` : ""}
    </div>`;
  }
  const favs = favLines();
  const q = (SV.search || "").trim().toLowerCase();
  const lines = q
    ? [...new Set([...favs, ...ALL_LINES])].filter(l => l.toLowerCase().includes(q))
    : (SV.cat === "fav" ? favs : ((ACTION_GROUPS.find(g => g[0] === SV.cat) || ACTION_GROUPS[0])[2]));
  return `<div class="sv-body">
    ${SV.err ? `<div class="sv-err">${esc(SV.err)}</div>` : ""}
    ${SV.ok ? `<div class="sv-ok">${esc(SV.ok)}
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn sm" data-act="svAddAnother">Add another</button>
        <button class="btn sm ghost" data-act="svTab" data-t="timeline">View timeline</button>
      </div></div>` : ""}
    <label class="sv-f"><span>Search or pick an action</span>
      <input id="sv_q" value="${esc(SV.search || "")}" placeholder="Search&hellip;" data-act-input="svSearch"></label>
    ${q ? "" : `<div class="sv-cats">
      <button class="sv-cat ${SV.cat === "fav" ? "on" : ""}" data-act="svCat" data-c="fav">&#9733; Favorites</button>
      ${ACTION_GROUPS.map(([k, lbl]) =>
        `<button class="sv-cat ${SV.cat === k ? "on" : ""}" data-act="svCat" data-c="${k}">${lbl}</button>`).join("")}
    </div>`}
    ${lines.length ? lines.map(l =>
      `<button class="sv-pick" data-act="svPick" data-line="${esc(l)}">${esc(l)}${
        l === NO_CHANGE_LINE ? ` <span style="color:#8fb4d9;font-size:.78rem">&mdash; one tap</span>` : ""}</button>`).join("")
      : `<div style="color:#8fb4d9">Nothing matches. Custom text works from any action.</div>`}
  </div>`;
}

  const isImg = e => String(e.content_type || "").startsWith("image/");

/* The record of every timestamped copy made for this case. The field view and
   the office Evidence tab draw the same list from the same data — the portal
   holds the record, never the video, so this IS what it knows. */
function svVideoStampsHtml(){
  const rows = (WS && WS.video_stamps) || [];
  if(!rows.length) return "";
  return `<div class="sv-card">
    <h3>Timestamped video &middot; ${rows.length}</h3>
    ${rows.slice(0, 10).map(r => `<div class="sv-row" style="${r.superseded_at ? "opacity:.6" : ""}">
      <span>${esc(r.original_name)}</span>
      <b>${esc(vstLabelOf(r))}</b></div>
      <div style="font-size:.76rem;color:#8fb4d9;margin:-2px 0 8px">${
        r.superseded_at ? "replaced by a later copy &middot; " : ""}${
        r.saved_at ? "saved to a device" : "not recorded as saved"}</div>`).join("")}
    <div style="font-size:.78rem;color:#8fb4d9">No video is stored in the portal.
      These are the records of copies made on a device.</div>
  </div>`;
}

/* End day (P14). A confirmation with the totals, never a one-tap action and
   never something a voice command can do. */
function svEndDayScreen(){
  const open = WS && WS.open_day;
  if(!open) return `<div class="sv-body"><div class="sv-card">No day is running.</div></div>`;

/* INTAKE-NA: what a marked-unavailable field says on an admin's screen. The
   submitter chose these words' meaning on the form; the review repeats them
   rather than showing a blank that reads as an error. */
const NA_WORDS = { not_available: "Not available at submission", unknown: "Unknown at submission",
  approximate: "Approximate", asap: "As soon as available", flexible: "Flexible",
  tbd: "To be determined", pending: "Authorization pending" };

/* Intentionally-unavailable fields, in words — the INFORMATION STILL NEEDED
   summary. Reads the redacted payload it is given, so an investigator's copy
   lists only what they can already see. */
function stillNeeded(p, claim){
  const map = [
    ["claim_number", "Claim number"], ["date_of_loss", "Date of loss"],
    ["subject_address", claim ? "Claimant address" : "Subject address"],
    ["subject_description", "Vehicle / description"],
    ["start_date", "Requested start"], ["authorized_hours", "Authorization"],
    ["billing_email", "Billing contact"],
  ];
  const items = [];
  for(const [k, lbl] of map){
    const st = p[k + "_status"];
    if(st === "approximate" && p[k]) items.push(`${lbl} — approximate`);
    else if(st && !p[k]) items.push(`${lbl} — ${(NA_WORDS[st] || st).toLowerCase()}`);
  }
  return items;
}

/* Completeness reads as words, never a score (INTAKE-NA). */
function completeness(s){
  const p = s.payload || {};
  const claim = s.kind === "claims";
  const contact = p.client_email || p.client_phone || p.adjuster_email || p.adjuster_phone;
  const identity = claim ? (p.carrier && (p.subject_name || p.claim_number)) : p.client_name;
  if(!contact || !identity) return ["Missing critical information", "rs-needs_revision"];
  if(stillNeeded(p, claim).length) return ["Additional information helpful", "rs-submitted"];
  return ["Ready for review", "rs-approved"];
}

/* The intake detail, split so the workspace can show what the field needs
   (subject) apart from what the office needs (everything). Both read from the
   same submission — the Worker has already removed whatever this role may not
   see, so nothing here decides that. */
function detailList(s, mode){
  const p = s.payload || {};
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
  const rowS = (k, v, st) => v
    ? `<dt>${esc(k)}</dt><dd>${esc(v)}${st === "approximate" ? ' <i style="color:var(--muted)">(approximate)</i>' : ""}</dd>`
    : st ? `<dt>${esc(k)}</dt><dd><i style="color:var(--muted)">${esc(NA_WORDS[st] || "Not available yet")}</i></dd>` : "";
  const claim = s.kind === "claims";
  const sig = safeImage(p.signature);

  const needed = stillNeeded(p, claim);
  const neededBox = needed.length ? `<div class="note" style="margin-bottom:12px">
    <b>Information still needed</b> — marked unavailable at submission on purpose, never an error.
    <ul style="margin:6px 0 0 18px">${needed.map(t => `<li>${esc(t)}</li>`).join("")}</ul>
    <div style="margin-top:8px"><button class="btn sm ghost" data-act="wsTab" data-tab="comms">Request it via the Comm log</button>
      <span style="font-size:.8rem;color:var(--muted)">The assignment is never treated as lost — details arrive as the case develops.</span></div>
  </div>` : "";

  if(mode === "subject"){
    return `${neededBox}<dl class="detail">
      ${row(claim ? "Claimant" : "Subject", p.subject_name)}${rowS("Address", p.subject_address, p.subject_address_status)}
      ${rowS("Description", p.subject_description, p.subject_description_status)}
      ${row(claim ? "Injury & restrictions" : "Relationship", p.subject_relationship)}
      ${row("Prior surveillance", p.prior_surveillance)}
      ${row(claim ? "Scope" : "Objective", p.objective)}
      ${row("Permitted days", p.permitted_days)}${row("Permitted times", p.permitted_times)}
      ${row("Weekend", p.weekend_authorized)}${row("Geographic limits", p.geographic_limits)}
      ${row("Field notes", p.notes)}
    </dl>`;
  }
  const [words, tone] = completeness(s);
  return `${ME.role === "admin" ? `<div style="margin-bottom:10px"><span class="tag ${tone}">${esc(words)}</span></div>` : ""}
  ${neededBox}
  <dl class="detail">
    ${claim ? `${row("Carrier / TPA", p.carrier)}${rowS("Claim number", p.claim_number, p.claim_number_status)}${row("Policy number", p.policy_number)}
               ${row("Claim type", p.claim_type)}${rowS("Date of loss", p.date_of_loss, p.date_of_loss_status)}${row("Adjuster", p.adjuster)}
               ${row("Adjuster email", p.adjuster_email)}${row("Adjuster phone", p.adjuster_phone)}
               ${row("Defense counsel", p.defense_counsel)}` : ""}
    ${row(claim ? "Assigning contact" : "Client", p.client_name)}${row("Phone", p.client_phone)}${row("Email", p.client_email)}
    ${claim ? "" : `${row("Address", p.client_address)}${row("Best time", p.best_time)}`}
    ${row(claim ? "Claimant" : "Subject", p.subject_name)}
    ${row(claim ? "Scope" : "Objective", p.objective)}
    ${/* MASTER-HANDOFF §7: what the client picked on the intake is REQUESTED.
          Calling it "authorized" would read as though the firm had approved a
          package the client chose for themselves. The confirmed figure is the
          one an admin sets on the Authorization panel, and only that one is
          ever paired with money. */""}
    ${rowS("Requested authorization", p.authorized_hours, p.authorized_hours_status)}${row("Not to exceed", p.not_to_exceed)}
    ${rowS("Requested start", p.start_date, p.start_date_status)}${row("Priority", p.priority)}
    ${row(claim ? "Deadline" : "Timeline", p.timeline)}${row("Attachments", p.attachments)}
    ${claim ? `${row("Billing reference", p.billing_reference)}${rowS("Invoices to", p.billing_email, p.billing_email_status)}${row("Billing notes", p.billing_notes)}` : ""}
    ${row(claim ? "Authorized by" : "Signed by", p.signed_name)}
    ${row("Received", when(s.created_at))}
  </dl>
  ${sig ? `<div><div style="font-size:.8rem;color:var(--muted)">Signature</div><img class="sig" src="${esc(sig)}" alt="signature"></div>` : ""}`;
}

async function saveSubjectRec(id){
  WS_ERR = "";
  const body = {};
  for(const k of ["name","alias","dob","height","weight","hair","descriptors","addresses","employer","phone","social_accounts","notes"]){
    const el = $("sf_" + k);
    if(el) body[k] = el.value;

  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/subjects` + (id ? `/${id}` : ""), {method:"POST", body});
    SUBJ_FORM = null;
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function saveVehicleRec(sid, vid){

  for(const k of ["year","make","model","color","plate","plate_state","registered_owner","notes"]){
    const el = $("vf_" + k);

  }catch(e){ WS_ERR = e.message; }

}

/* The office's money desk (INVOICING.md). Admin-only — nothing here is ever
   rendered for an investigator, and the Worker refuses them anyway. The

   everything else on the page. */
const INV_STATUS_LABEL = s => ({draft:"Draft", ready:"Ready", sent_to_bill:"Sent to BILL",
  sent_to_client:"Sent to client", partially_paid:"Partially paid", paid:"Paid",
  overdue:"Overdue", void:"Void"})[s] || s;
const usd = n => "$" + Number(n || 0).toLocaleString("en-US",
  {minimumFractionDigits: (Number(n) % 1 ? 2 : 0), maximumFractionDigits: 2});

function invoicesView(){
  if(INV_OPEN) return invoiceDetailView();
  if(!INVOICES) return `<div class="card"><div class="empty">Loading invoices&hellip;</div></div>`;
  const sm = INVOICES.summary || {};
  const stat = (label, v, tone) => `<div class="stat ${tone || ""}">
    <div class="stat-n">${v}</div><div class="stat-l">${esc(label)}</div></div>`;
  const rows = (INVOICES.invoices || []).map(i => `<tr data-act="invOpen" data-id="${i.id}" style="cursor:pointer">
      <td><b>${esc(i.invoice_no)}</b><div class="mono">${esc(i.case_no)}</div></td>

      <td class="hide">${esc(fmtDay(i.issue_date || "") || "—")}</td>
      <td>${esc(fmtDay(i.due_date || "") || "—")}</td>
      <td>${usd(i.total)}</td>
      <td>${usd(i.balance_due)}</td>
      <td><span class="tag ${esc(i.display_status)}">${esc(INV_STATUS_LABEL(i.display_status))}</span></td>
    </tr>`).join("");
  return `<div class="stats">
      ${stat("Outstanding", usd(sm.outstanding), sm.outstanding ? "warn" : "")}
      ${stat("Due soon", sm.due_soon || 0)}
      ${stat("Overdue", sm.overdue || 0, sm.overdue ? "warn" : "")}
      ${stat("Paid this month", usd(sm.paid_this_month))}
      ${stat("Drafts", sm.drafts || 0)}
    </div>
    <div class="card">
      <div class="bar"><h2 style="margin:0">Invoices</h2>
        <select data-act="invFilterStatus">
          ${[["","All statuses"],["draft","Draft"],["ready","Ready"],["sent_to_bill","Sent to BILL"],
             ["overdue","Overdue"],["partially_paid","Partially paid"],["paid","Paid"],["void","Void"]]

          ${[["","Both sides"],["insurance","Insurance"],["private","Private"]]
            .map(([v,l]) => `<option value="${v}" ${INV_FILTER.type === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <input data-act="invFilterQ" placeholder="Search # / case / claim" value="${esc(INV_FILTER.q)}" style="max-width:220px">
      </div>
      ${rows ? `<div style="overflow-x:auto"><table>
          <thead><tr><th>Invoice</th><th class="hide">Bill to</th><th class="hide">Issued</th>
            <th>Due</th><th>Amount</th><th>Balance</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`
        : `<div class="empty">No invoices${INV_FILTER.status || INV_FILTER.type || INV_FILTER.q ? " match" : " yet — open a case and use Create invoice"}.</div>`}
      ${INV_MSG ? `<div class="note" style="margin-top:8px">${esc(INV_MSG)}</div>` : ""}
    </div>`;
}

async function loadInvoices(){
  try{ INVOICES = await api("/invoices" + (Object.values(INV_FILTER).some(Boolean)
    ? `?status=${encodeURIComponent(INV_FILTER.status)}&type=${encodeURIComponent(INV_FILTER.type)}&q=${encodeURIComponent(INV_FILTER.q)}` : ""));
    INV_SETTINGS = INVOICES.settings;
  }catch(e){ INVOICES = {invoices: [], summary: {}}; INV_MSG = e.message; }
  paint();
}

async function openInvoice(id){
  try{
    const d = await api("/invoices/" + id);
    INV_OPEN = d.invoice; INV_WARN = d.warnings || []; INV_EVENTS = d.events || [];
    INV_SETTINGS = d.settings; INV_MSG = "";
  }catch(e){ INV_MSG = e.message; }
  if(TAB !== "invoices"){ TAB = "invoices"; }
  VIEW = "list";
  paint();
}

function invLinesFromDom(){
  const lines = [];
  for(let idx = 0; idx < (INV_OPEN.lines || []).length; idx++){
    const el = $("il_d_" + idx);
    if(!el) continue;
    lines.push({ description: el.value, qty: $("il_q_" + idx).value,
                 rate: $("il_r_" + idx).value, amount: $("il_a_" + idx).value });
  }
  return lines;
}

async function saveInvoiceFields(){
  INV_MSG = "";
  const refs = {};
  for(const k of ["claim_number","po_number","authorization_number","vendor_number","adjuster",
                  "service_dates","client_reference","special_instructions"]){
    const el = $("ir_" + k); if(el) refs[k] = el.value;
  }
  try{
    const body = { internal_notes: $("iv_inotes").value };
    if($("iv_billto") && !$("iv_billto").disabled){
      Object.assign(body, { bill_to: $("iv_billto").value, billing_email: $("iv_bemail").value,
        payment_terms: $("iv_terms").value, issue_date: $("iv_issue").value || null,
        due_date: $("iv_due").value || null, client_notes: $("iv_cnotes").value, refs });
    }
    const d = await api("/invoices/" + INV_OPEN.id, {method: "POST", body});
    INV_OPEN = d.invoice; INV_MSG = "Saved.";
  }catch(e){ INV_MSG = e.message; }
  paint();
}

async function saveInvoiceLines(){
  INV_MSG = "";
  try{
    const d = await api(`/invoices/${INV_OPEN.id}/lines`, {method: "POST", body: {lines: invLinesFromDom()}});
    INV_OPEN = d.invoice; INV_MSG = "Lines saved.";
  }catch(e){ INV_MSG = e.message; }
  paint();
}

async function setInvStatus(status){
  INV_MSG = "";
  try{
    const d = await api(`/invoices/${INV_OPEN.id}/status`, {method: "POST", body: {status}});
    INV_OPEN = d.invoice; INV_WARN = d.warnings || [];
  }catch(e){ INV_MSG = e.message; }

async function saveInvBill(){

  try{
    const d = await api(`/invoices/${INV_OPEN.id}/bill`, {method: "POST", body: {
      external_invoice_id: $("ib_inv").value, external_customer_id: $("ib_cust").value,
      external_status: $("ib_status").value }});
    INV_OPEN = d.invoice; INV_MSG = "BILL reference saved.";
  }catch(e){ INV_MSG = e.message; }

}

async function recordInvPayment(){
  INV_MSG = "";
  try{
    const d = await api(`/invoices/${INV_OPEN.id}/payments`, {method: "POST", body: {
      amount: $("ip_amt").value, paid_date: $("ip_date").value,
      method: $("ip_method").value, reference: $("ip_ref").value }});
    INV_OPEN = d.invoice; INV_MSG = d.invoice.status === "paid" ? "Paid in full." : "Payment recorded.";
  }catch(e){ INV_MSG = e.message; }
  await openInvoice(INV_OPEN.id);
}

function copyInvoiceDetails(){
  const i = INV_OPEN;
  const lineTxt = (i.lines || []).map(l => `  ${l.description}: ${usd(l.amount)}`).join("\n");
  const txt = [`Invoice #: ${i.invoice_no}`,
    `Bill to: ${(i.bill_to || "").replace(/\n/g, " — ")}`,
    i.refs.claim_number ? `Claim #: ${i.refs.claim_number}` : "",
    `Case #: ${i.case_no}`, lineTxt,
    `Amount: ${usd(i.total)}`,
    i.payment_terms ? `Terms: ${i.payment_terms}` : "",
    i.due_date ? `Due: ${i.due_date}` : ""].filter(Boolean).join("\n");
  try{ navigator.clipboard.writeText(txt); INV_MSG = "Billing details copied — paste into BILL."; }
  catch(e){ INV_MSG = "Could not reach the clipboard."; }
  paint();
}

async function createInvoiceFor(caseNo, fromAuth){
  try{
    const d = await api(`/cases/${encodeURIComponent(caseNo)}/invoices`, {method: "POST",
      body: fromAuth ? {from_authorization: true} : {}});
    await openInvoice(d.invoice.id);
  }catch(e){
    if(String(e.message).includes("duplicate")){
      if(confirm(e.message)){
        const d2 = await api(`/cases/${encodeURIComponent(caseNo)}/invoices`, {method: "POST",
          body: {confirm_duplicate: true, ...(fromAuth ? {from_authorization: true} : {})}});
        return openInvoice(d2.invoice.id);
      }
      return;
    }
    WS_ERR = e.message; paintCase();
  }
}

    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;

  const pendingOffer = offers.find(o => o.status === "offered");
  const formOrWhy = s.assigned_to != null
    ? `<p class="note" style="margin-top:14px">Assigned — to offer this case to someone else, unassign it first.</p>`
    : pendingOffer
    ? `<p class="note" style="margin-top:14px">Waiting on <b>${esc(pendingOffer.investigator || "")}</b> —
       withdraw that offer to send a different one.</p>`
    : offerForm;
  return `${offerRows}${formOrWhy}<div class="actions">
      <label class="f"><span>Assigned to</span>
        <select id="asg">
          <option value="">— unassigned —</option>
          ${USERS.filter(u => u.active).map(u => `<option value="${u.id}" ${u.id === s.assigned_to ? "selected" : ""}>${esc(u.display_name || u.username)}</option>`).join("")}

      <label class="f"><span>Status</span>
        <select id="sts">${STAGE_OPTS(s)}</select></label>
      <button class="btn" data-act="saveCase" data-case="${esc(s.case_no)}">Save</button>
      <div class="err" id="derr" style="width:100%"></div>
    </div>`;
}

async function svSaveEntry(oneTap){
  SV.err = "";
  // An edit changes the four fields the Worker allows and is stamped by it.
  if(!oneTap && SV.entry && SV.entry.edit){
    try{
      await api(`/cases/${encodeURIComponent(WS_CASE)}/activity/${SV.entry.edit}`, {method:"POST", body:{
        description: $("sv_desc").value,
        location: $("sv_loc") ? $("sv_loc").value : "",
        vehicle: $("sv_veh") ? $("sv_veh").value : "",
        internal_note: $("sv_note") ? $("sv_note").value : "",
      }});
      SV.entry = null; SV.tab = "timeline";
    }catch(e){ SV.err = e.message; }
    return svReload();
  }
  const now = new Date();
  const body = oneTap ? {
    kind: "activity", description: oneTap,
    at_date: ymdLocal(now), at_time: now.toTimeString().slice(0,5),
  } : {
    kind: "activity",
    /* The date that goes with THIS time, not the date it happens to be when
       the button is finally tapped. `sv_time` was stamped when the entry was
       started; taking the date at submit pairs two different instants, so an
       entry begun at 23:58 and saved at 00:02 filed on the new day carrying
       the old day's time — and the timeline orders by at_date then at_time, so
       it sorted ahead of everything that really came before it. Making both
       halves local was not enough; they have to be the SAME moment. The
       fallback covers an entry restored without a stamp. */
    at_date: SV.entry.date || ymdLocal(),
    at_time: $("sv_time").value,
    description: $("sv_desc").value,
    location: $("sv_loc") ? $("sv_loc").value : "",
    vehicle: $("sv_veh") ? $("sv_veh").value : "",
    internal_note: $("sv_note") ? $("sv_note").value : "",
