  /* Invoices */
  .inv-line{display:grid;grid-template-columns:1fr 70px 90px 100px 34px;gap:6px;margin-bottom:6px;align-items:center;}
  .inv-line input{width:100%;}
  @media(max-width:640px){.inv-line{grid-template-columns:1fr 54px 70px 80px 30px;}}
  .inv-tot{text-align:right;font-size:1.05rem;margin:8px 0 2px;}
  .inv-tot b{font-size:1.35rem;color:var(--navy);}
  #invdoc{border:1px solid var(--line);border-radius:10px;padding:26px 28px;background:#fff;margin-top:14px;}
  #invdoc h2{margin:0;}
  .doc-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:14px;}
  .doc-refs dt{font-weight:700;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .doc-refs dd{margin:0 0 6px;}
  .doc-table{width:100%;border-collapse:collapse;margin:12px 0;}
  .doc-table th,.doc-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem;}
  .doc-table th:last-child,.doc-table td:last-child,.doc-table th.n,.doc-table td.n{text-align:right;}
  .doc-due{text-align:right;font-size:1.15rem;margin-top:10px;}
  .doc-due b{font-size:1.5rem;color:var(--navy);}
  /* The Case Package view (UXSIMPLIFY P9/P13/P16/P17) */
  .pkg-blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0 14px;}
  .pkg-b{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;}
  .pkg-b b{display:block;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .pkg-b .pk-v{font-size:1.05rem;font-weight:700;margin-top:2px;}
  .pkg-b .pk-s{font-size:.95rem;margin-left:6px;}
  .pkg-b.done{border-color:var(--ok-line);background:var(--ok-soft);}
  .pkg-b.part{border-color:#e9d8a6;background:#fdfaf1;}
  .pkg-miss{border-left:3px solid var(--gold-2);background:var(--gold-soft);border-radius:0 8px 8px 0;padding:12px 14px;margin:10px 0;}
  .pkg-miss li{margin:4px 0 4px 16px;}
  .pkg-pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
  .pkg-item{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;width:118px;font-size:.72rem;}
  .pkg-item img{width:100%;height:64px;object-fit:cover;border-radius:5px;}
  .pkg-item.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
  #pkgdoc{border:1px solid var(--line);border-radius:10px;padding:26px 28px;background:#fff;margin-top:14px;}
  #pkgdoc img{max-width:100%;border-radius:6px;}
  /* UIBUILD P1: the navigation rail. Same .tabs machinery, new shape — a
     fixed sidebar at desktop widths, a drawer behind the burger on mobile. */
  /* THE ICON IS SMALL; THE TARGET IS NOT (owner, 2026-08-15). At 1.4rem with
     4px of padding this was about 30px square — under Apple's 44px minimum and
     well under the 50-52px this file uses for every other phone control. The
     glyph stays compact and the button grows around it, so nothing looks
     heavier and a thumb lands on it. Measured by a test at phone width, not
     eyeballed. */
  /* `.top button` styles the sign-out and would beat a bare `.burger` on
     specificity (0-1-1 over 0-1-0) whatever the source order — the dead-rule
     lesson again, this time horizontal. Every burger rule carries `.top` so
     the contest cannot happen. */
  .top .burger{display:none;background:var(--nav-on);border:1px solid #4a6b91;color:#fff;font-size:1.3rem;
    cursor:pointer;border-radius:10px;padding:0;min-width:46px;min-height:46px;
    align-items:center;justify-content:center;margin-left:0;
    /* Above the backdrop (55): while the drawer is open the visible ✕ must be
       the thing a tap actually reaches, not the dim behind it. */
    position:relative;z-index:70;}
  .top .burger:active{background:#2c4a6e;}
  .top .burger .b-close{display:none;}
  body.navopen .top .burger{background:#2c4a6e;border-color:#7592b5;}
  body.navopen .top .burger .b-open{display:none;}
  body.navopen .top .burger .b-close{display:inline;}
  /* The backdrop is display-gated by body.navopen, so there is no JS state to
     forget; z-index sits under the drawer (60) and over everything else. */
  .navback{display:none;position:fixed;inset:0;background:rgba(9,18,30,.45);border:0;
    padding:0;cursor:pointer;z-index:55;}
  body.navopen .navback{display:block;}
  /* NAVIGATION GROUPS (owner, 2026-08-16). The rail was eight flat doors that
     said nothing about which part of the business each belongs to. Three
     labelled groups do.

     The headers are DIVs, never buttons. Every selector in this file and in the
     suite reaches the rail as `.tabs button`, so a header rendered as a button
     would be tabbable, focusable, counted as a destination and — worst — a
     candidate for a `hasText` click. A div cannot be any of those by accident. */
  .navgrp{font-size:.67rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:#7f97b3;padding:15px 12px 5px;-webkit-user-select:none;user-select:none;}
  .navgrp:first-child{padding-top:2px;}
  /* 44px is Apple's minimum and this file holds every other phone control to
     50-52px. The rail's own padding put a desktop item at about 41px and a
     drawer item barely over the line; the floor is stated rather than implied,
     and a test measures it at phone width. */
  body.withnav .tabs button{min-height:44px;}
  /* The rail's one gold accent: it marks where you are, ALONGSIDE the changed
     background and aria-current, never instead of them. Nothing in this portal
     may be carried by colour alone. */
  body.withnav .tabs button.on{box-shadow:inset 3px 0 0 var(--gold);}
  /* The two doors that DO something rather than going somewhere, kept apart
     from the destinations above them and pinned to the foot of the rail. */
  .navfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;
    padding-top:16px;border-top:1px solid var(--field-line);}
  @media(min-width:900px){
    /* `flex-wrap:nowrap` is LOAD-BEARING, not tidying. `.tabs` is a wrapping
       row at the top of this file, and turning it into a column here kept the
       wrap — so once the items were taller than the rail they wrapped into a
       SECOND COLUMN and the navigation ran off the side. Measured on the phone
       drawer: 296px wide, 460px of content, every child 224px or less. A
       vertical navigation list scrolls (there is `overflow-y:auto` right here
       for it); it must never wrap. */
    body.withnav .tabs{position:fixed;left:0;top:58px;bottom:0;width:198px;flex-direction:column;
      flex-wrap:nowrap;
      align-items:stretch;gap:2px;padding:14px 10px;margin:0;background:var(--navy-2);border-radius:0;
      overflow-y:auto;z-index:40;}
    body.withnav .tabs button{text-align:left;color:#c9d6e4;background:transparent;border-radius:8px;
      padding:9px 12px;font-weight:600;}
    body.withnav .tabs button.on{background:var(--nav-on);color:#fff;}
    body.withnav .tabs button:hover{background:#1a3350;color:#fff;}
    /* .navfoot owns the pin to the bottom now; these two only describe
       themselves. Two rules both claiming margin-top is how one of them
       silently stops mattering. */
    body.withnav .tabs .side-intake{display:block;text-align:center;background:var(--gold);
      color:var(--navy-2);font-weight:800;border-radius:9px;padding:11px 12px;text-decoration:none;
      font:inherit;font-weight:800;border:0;cursor:pointer;width:100%;}
    /* The field door, at the top level. Outlined rather than gold: it is a
       primary action but it must not out-shout "+ Intake a Client". */
    body.withnav .tabs .side-surv{display:block;text-align:left;
      background:var(--field-bg);color:var(--field-ink);border:1px solid var(--field-line);border-radius:9px;
      padding:10px 12px;font:inherit;font-weight:700;cursor:pointer;width:100%;}
    body.withnav .tabs .side-surv:hover{background:#16283d;color:#fff;}
    /* Timestamp Video reads as the same KIND of thing as the field door and is
       deliberately quieter than it: both are doors that do something, and
       Active Surveillance is the one somebody reaches for mid-shift. */
    body.withnav .tabs .side-vst{display:block;text-align:left;
      background:var(--field-bg);color:var(--field-ink);border:1px solid var(--field-line);border-radius:9px;
      padding:10px 12px;font:inherit;font-weight:700;cursor:pointer;width:100%;}
    body.withnav .tabs .side-vst:hover{background:#16283d;color:#fff;}
    body.withnav #app{margin-left:198px;}
  }
  @media(max-width:899px){
    body.withnav .tabs{display:none;}
    /* The drawer runs to bottom:0, so its foot block lands on the home
       indicator unless it is cleared. max() is correct whether or not the
       viewport reports an inset — calc(14px + env(...)) adds nothing at all
       without viewport-fit=cover, which this page deliberately does not set.
       The field bar and the case section bar already use exactly this. */
    body.withnav.navopen .tabs{display:flex;position:fixed;left:0;top:0;bottom:0;width:76%;max-width:300px;
      /* See the rail above — same inherited wrap, same second column. This is
         the one that was actually reached: the drawer was a single item away
         from wrapping, and adding one more door to the foot tipped it over. */
      flex-direction:column;flex-wrap:nowrap;align-items:stretch;gap:2px;background:var(--navy-2);z-index:60;
      padding:60px 12px max(14px, env(safe-area-inset-bottom));
      overflow-y:auto;box-shadow:6px 0 24px rgba(9,18,30,.35);}
    body.withnav.navopen .tabs button{text-align:left;color:#c9d6e4;background:transparent;border-radius:8px;padding:11px 12px;}
    body.withnav.navopen .tabs button.on{background:var(--nav-on);color:#fff;}
    body.withnav.navopen .tabs .side-intake{display:block;text-align:center;
      background:var(--gold);color:var(--navy-2);font-weight:800;border-radius:9px;padding:11px;text-decoration:none;
      font:inherit;font-weight:800;border:0;cursor:pointer;width:100%;}
    body.withnav.navopen .tabs .side-surv{display:block;text-align:left;
      background:var(--field-bg);color:var(--field-ink);border:1px solid var(--field-line);border-radius:9px;
      padding:11px 12px;font:inherit;font-weight:700;cursor:pointer;width:100%;}
    body.withnav.navopen .tabs .side-vst{display:block;text-align:left;
      background:var(--field-bg);color:var(--field-ink);border:1px solid var(--field-line);border-radius:9px;
      padding:11px 12px;font:inherit;font-weight:700;cursor:pointer;width:100%;}
    /* The base rule below is deliberately ABOVE this media query. It used to
       sit after it, and with equal specificity the later rule won: the burger
       was display:none at every width, the sidebar was hidden under 900px, and
       a phone had NO navigation at all while an iPad in landscape looked fine.
       Never move the base rule back below this block. */
    /* inline-flex, not inline-block: the centring above only applies to a flex
       container, and without it the 50px box holds an off-centre glyph. */
    .top .burger{display:inline-flex;}
  }
  /* Reports & Packages stacks three existing panels; the gap lives on the
     container so no panel carries a margin that depends on its position. */
  .deliverystack{display:grid;gap:14px;}
  /* Case Package cards (UIBUILD P3) */
  /* A CARD MAY NOT WIDEN THE PAGE (2026-08-16). At 390px the dashboard scrolled
     sideways by about 20px, and the cause was not the dashboard: a grid item
     defaults to `min-width:auto`, so its track is floored at its own min-content
     width, and a case number is one unbreakable token. Any long case number —
     this suite plants a deliberately hostile one — therefore pushed its own
     column past the phone and took the page with it.

     Three parts, all of them needed:
       min(290px,100%)      the track floor may not exceed the container
       min-width:0          the item may shrink below its min-content width
       overflow-wrap:anywhere  the token itself may break; unlike break-word
                            this one also reduces the intrinsic min-content
                            size, which is what actually sizes the track
     A case number is data from a public form. It is never going to be short
     because we would like it to be. */
  .pkgcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:14px;margin-top:10px;}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    min-width:0;overflow-wrap:anywhere;}
  .pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .pc-ring{flex:0 0 auto;}
  .pc-mods{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 8px;}
  .pc-m{flex:1 1 40px;min-width:52px;text-align:center;font-size:.62rem;color:var(--muted);
    border:1px solid var(--line);border-radius:8px;padding:5px 2px;cursor:pointer;background:#fff;}
  .pc-m b{display:block;font-size:.86rem;color:var(--ink,var(--ink));}
  .pc-m.done{border-color:var(--ok-line);background:var(--ok-soft);}
  .pc-m.part{border-color:#e9d8a6;background:#fdfaf1;}
  .pc-next{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);
    padding-top:10px;margin-top:4px;}
  /* UNIT 5 (owner: "Intake Accept-style controls can appear narrow/unfinished").
     Measured at 320–1200px: Accept rendered 42–60px wide and up to 119px TALL —
     the flex row gave the ghost cluster the width and squeezed the PRIMARY
     action to its min-content, wrapping "Accept →" letter by letter. A primary
     action never shrinks below its own words. */
  .pc-next > .btn{flex:none;white-space:nowrap;min-height:44px;}
  @media(max-width:560px){
    .pc-next{flex-direction:column;align-items:stretch;}
    .pc-next > .btn{width:100%;}
  }
  .pc-next small{display:block;color:var(--muted);font-size:.72rem;}
  /* The same 44px floor `.bandhead .btn` already takes, and for the same reason:
     `.btn.sm` is 7px of padding on a .82rem line, about 35px. This row is where
     the office acts on a lead from a phone, and §10 has just added a sixth
     button to it — flooring the new one and leaving its five neighbours short
     is not a thing a row of buttons can do. */
  .pc-next .btn{min-height:44px;}
  /* UIBUILD Phase 2 — the case page: P5 header, P6 sections, P7 overview. */
  .caseheader{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;
    margin-bottom:14px;}
  .ch-client{font-size:.92rem;margin-top:4px;}
  .ch-sub{font-size:.85rem;color:var(--muted);margin-top:2px;}
  .ch-right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  /* THE STATUS CHIP IS ACTIONABLE, SO ITS TARGET IS 44px — BUT A CHIP INFLATED
     TO BUTTON SIZE STOPS READING AS A STATUS. Measured before: 56x24, so only
     the height was short, and padding it out to 44 would have painted a pill
     nearly twice its proper depth in the one corner of the screen that is meant
     to be scanned rather than pressed.

     So the target and the pill are separated: `.ch-status` is a transparent box
     that owns the 44px and carries the `data-act`, and the `.tag` inside keeps
     the shared scale untouched. Layout rather than an overlay, deliberately —
     `.ch-right` is a 6px-gap column, and a pseudo-element stretched 10px each
     way would have reached into the Edit case button's own target and started
     stealing its taps.

     `cursor` moved here from `.ch-right .tag` on purpose: an investigator's
     header renders the same chip with no `data-act` on it, and the old rule
     gave that one a pointer too — a control that is not one. */
  .ch-status{display:inline-flex;align-items:center;justify-content:flex-end;
    min-height:44px;min-width:44px;cursor:pointer;}
  /* The same 44px floor `.bandhead .btn` and `.pc-next .btn` already take.
     Edit case is the header's one action and was about 35px — `.btn.sm` is 7px
     of padding on a .82rem line. The LABEL is untouched: this raises the target
     a thumb has to hit, not the size of the text, which is why it is a
     min-height and not a font or padding change. */
  .ch-right .btn{min-height:44px;}
  .ch-line{font-size:.8rem;color:var(--muted);}
  .wsecs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;-webkit-overflow-scrolling:touch;}
  .wsecs button{flex:none;font:inherit;font-size:.76rem;font-weight:800;letter-spacing:.05em;
    text-transform:uppercase;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    color:var(--muted);padding:8px 14px;cursor:pointer;white-space:nowrap;}
  .wsecs button.on{background:var(--navy-2);border-color:var(--navy-2);color:#fff;}
  .wsecs .sec-s{display:none;}
  .wsecs .sec-i{display:none;}
  /* UIBUILD P15 — on a phone the section bar is the bottom navigation:
     fixed under the thumb, short labels, the add button pinned above it. */
  @media(max-width:640px){
    /* The bottom bar is the ONLY navigation a phone has on a case, so it has
       to announce itself. The owner could not see it or hit it (2026-08-14),
       and it got three things wrong at once: it sat 6px off the screen edge,
       its targets were about 33px tall — under Apple's 44px minimum — and it
       was four small-caps words with nothing to recognise at a glance.

       `max(14px, env(...))` is the load-bearing bit. Without
       `viewport-fit=cover` iOS reports a safe-area inset of ZERO, so the old
       calc() added nothing and the buttons pressed against the bottom edge,
       where the home indicator lives and a thumb cannot land cleanly. The
       max() guarantees real clearance whether or not the browser reports an
       inset, and needs no change to the viewport meta. */
    .casepage .wsecs{position:fixed;left:0;right:0;bottom:0;z-index:65;background:var(--navy-2);
      margin:0;padding:6px 6px max(14px,env(safe-area-inset-bottom));gap:4px;
      justify-content:space-around;border-radius:0;border-top:1px solid #2f5580;
      box-shadow:0 -6px 18px rgba(9,18,30,.34);}
    .casepage .wsecs button{flex:1;background:transparent;border:0;color:#dbe9f7;
      border-radius:10px;padding:6px 2px;text-align:center;min-height:52px;position:relative;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      font-size:.68rem;letter-spacing:.03em;}
    .casepage .wsecs button .sec-i{display:block;font-size:1.3rem;line-height:1;}
    .casepage .wsecs button.on{background:var(--nav-on);color:#fff;}
    /* "You are here" has to survive a glance in a car at dusk, so it is a gold
       cap rather than a slightly different navy. */
    .casepage .wsecs button.on::before{content:"";position:absolute;top:-6px;left:24%;right:24%;
      height:3px;border-radius:0 0 3px 3px;background:var(--gold);}
    .casepage .wsecs .sec-l{display:none;}
    .casepage .wsecs .sec-s{display:inline;}
    .casepage{padding-bottom:100px;}
    .addact{bottom:96px;}
  }
  .ovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:14px;}
  .ovcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;}
  .ovcard h3{margin:0 0 8px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
  /* EDIT CASE IS A FORM SOMEONE FILLS IN ON A PHONE. Apple's minimum tap
     target is 44px and the default input height is under it, so every control
     on this panel is floored — scoped to the panel so no other layout moves. */
  .editcase input, .editcase select, .editcase .btn{min-height:44px;}
  .editcase .f{margin-bottom:8px;}
  .ov-row{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:3px 0;}
  .ov-row b{text-align:right;}
  .ov-mods{list-style:none;margin:8px 0 0;padding:0;}
  .ov-mods button{display:flex;justify-content:space-between;width:100%;gap:8px;font:inherit;font-size:.85rem;
    background:none;border:0;border-bottom:1px solid var(--line);padding:6px 2px;cursor:pointer;text-align:left;}
  .ov-mods li:last-child button{border-bottom:0;}
  .ov-ring{display:flex;justify-content:center;margin-bottom:4px;}
  .ov-next{background:var(--gold-soft);border:1px solid #e3d3ae;}
  .ov-next .nx{font-size:1.02rem;font-weight:800;color:var(--navy-2);margin:2px 0 10px;}
  .ov-recent{margin:0;padding:0;list-style:none;}
  .ov-recent li{display:flex;gap:10px;font-size:.86rem;padding:5px 0;border-bottom:1px solid var(--line);}
  .ov-recent li:last-child{border-bottom:0;}
  .ov-recent .t{flex:0 0 auto;color:var(--muted);font-size:.78rem;padding-top:2px;}
  .ov-foot{margin-top:10px;}
  /* UIBUILD Phase 3 — the Add Activity sheet (P8/P9) and the timeline-first
     panel (P10). Desktop: a centered panel. Mobile: a bottom sheet, with the
     add button pinned above the thumb. */
  .ambar{margin:0 0 14px;}
  .addact{font-weight:800;}
  .amwrap{position:fixed;inset:0;background:rgba(9,18,30,.45);z-index:80;display:flex;
    justify-content:center;align-items:flex-start;padding:6vh 16px;}
  .amsheet{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:86vh;
    overflow-y:auto;padding:16px 18px;}
  /* THE EVIDENCE VIEWER. Every evidence image and file in the portal opens here
     instead of in a new tab. The installed app is `display:standalone` scoped to
     `/portal/`, and the file route lives under `/portal-api/` — so a `_blank`
     link left the app with no chrome, no back button and no bottom bar, which is
     exactly what the owner reported. One viewer, six call sites.

     `object-fit:contain` with max width AND height is what "scales down but is
     never cropped to fit" means in CSS — `cover` would crop, and a bare
     max-width would let a tall photo run off the bottom. */
  .evview{position:fixed;inset:0;z-index:120;background:#0b1622;display:flex;
    flex-direction:column;}
  .evview-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;
    padding-top:max(8px, env(safe-area-inset-top));background:var(--navy);
    border-bottom:1px solid var(--field-line);}
  .evview-bar .evback{display:inline-flex;align-items:center;justify-content:center;
    gap:7px;min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--field-edge-2);
    border-radius:9px;background:var(--navy-2);color:#fff;font:inherit;font-size:.9rem;
    font-weight:700;cursor:pointer;}
  .evview-name{color:var(--head-ink);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;min-width:0;flex:1;}
  .evview-body{flex:1;min-height:0;display:flex;align-items:center;
    justify-content:center;padding:12px;
    padding-bottom:max(12px, env(safe-area-inset-bottom));overflow:auto;}
  .evview-body img, .evview-body video{max-width:100%;max-height:100%;
    object-fit:contain;border-radius:8px;}
  .evview-other{color:var(--head-ink);text-align:center;font-size:.9rem;line-height:1.6;
    max-width:34ch;}
  .evview-other a{color:#8fc6dc;}
  /* The page behind must not scroll while the viewer is up. */
  body.evopen, body.vstopen, body.pstopen{overflow:hidden;}
  /* The copy, checked before it is filed. Bounded by height as well as width so
     a tall picture does not push the buttons off a phone screen. */
  .pst-prev{display:block;width:100%;max-height:46vh;object-fit:contain;
    border-radius:9px;background:var(--field-deep);border:1px solid var(--field-line);}
  .pst-mini{padding:0;font-size:.76rem;}
  .pst-inc{display:flex;gap:10px;align-items:flex-start;background:#12243a;
    border:1px solid #2b4a6b;border-radius:10px;padding:11px 12px;margin-top:10px;
    cursor:pointer;}
  .pst-inc input{width:22px;height:22px;flex:none;margin-top:1px;}
  .pst-inc b{display:block;font-size:.9rem;color:#fff;}
  .pst-inc small{display:block;margin-top:3px;font-size:.78rem;color:var(--field-muted);line-height:1.5;}
  .pkg-sup{font-size:.74rem;color:var(--muted);line-height:1.4;margin:3px 0 4px;}
  .pst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
    gap:8px;margin-top:10px;}
  .pst-pick{display:block;width:100%;min-height:44px;padding:6px;border-radius:10px;
    border:1px solid var(--field-edge-3);background:var(--field-deep);color:var(--field-ink-2);font:inherit;
    font-size:.72rem;cursor:pointer;text-align:center;}
  .pst-pick img{display:block;width:100%;height:76px;object-fit:cover;border-radius:7px;
    background:var(--field-panel);}
  .pst-pick span{display:block;margin-top:5px;word-break:break-all;line-height:1.3;}

  /* ------------------------------------------- video timestamp generator

     A sibling root like the evidence viewer, for the same reason and one more:
     rendering a clip takes as long as the clip runs, and the screen underneath
     must not be torn down and rebuilt while it does. Reached from Active
     Surveillance and from the case's Evidence tab — one generator, two doors.

     Dark like the field view, because that is where it is mostly used, and
     every control is at least 44px so it works one-handed at 390px. */
  .vst{position:fixed;inset:0;z-index:125;background:#0b1622;display:flex;
    flex-direction:column;color:#dce9f5;}
  .vst-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;
    padding-top:max(8px, env(safe-area-inset-top));background:var(--navy);
    border-bottom:1px solid var(--field-line);}
  .vst-bar b{font-size:.95rem;flex:1;min-width:0;}
  .vst-x{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    min-height:44px;min-width:44px;padding:0 14px;border:1px solid var(--field-edge-2);
    border-radius:9px;background:var(--navy-2);color:#fff;font:inherit;font-size:.9rem;
    font-weight:700;cursor:pointer;}
  .vst-body{flex:1;min-height:0;overflow:auto;padding:14px 12px;
    padding-bottom:max(18px, env(safe-area-inset-bottom));}
  .vst-body>*{max-width:640px;margin-left:auto;margin-right:auto;}
  .vst-card{background:#0f1d31;border:1px solid var(--field-line);border-radius:12px;
    padding:12px;margin-bottom:12px;}
  .vst-card h4{margin:0 0 8px;font-size:.95rem;color:#fff;}
  .vst-k{display:flex;gap:10px;justify-content:space-between;font-size:.85rem;
    padding:3px 0;border-bottom:1px solid #17293f;}
  .vst-k:last-child{border-bottom:0;}
  .vst-k span:first-child{color:var(--field-muted);}
  .vst-k span:last-child{text-align:right;word-break:break-word;min-width:0;}
  /* The date and time parts. `minmax(0,1fr)` so a narrow phone shrinks the
     boxes instead of pushing the row off the side — no horizontal overflow at
     390px is a requirement, not a preference. */
  .vst-when{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:8px;}
  .vst-f{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .vst-f span{font-size:.72rem;color:var(--field-muted);text-transform:uppercase;
    letter-spacing:.04em;}
  .vst-f input, .vst-f select{min-height:46px;width:100%;box-sizing:border-box;
    border:1px solid var(--field-edge-3);border-radius:9px;background:var(--field-deep);color:#fff;
    font:inherit;font-size:1rem;padding:0 8px;text-align:center;}
  .vst-res{margin-top:10px;text-align:center;font-size:1.05rem;font-weight:700;
    color:#ffd9a0;letter-spacing:.01em;line-height:1.5;}
  .vst-res small{display:block;font-weight:400;font-size:.76rem;color:var(--field-muted);
    letter-spacing:0;}
  .vst-btn{display:block;width:100%;box-sizing:border-box;min-height:52px;
    border-radius:10px;border:1px solid var(--field-edge-2);background:#16293f;color:#fff;
    font:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px;
    padding:0 12px;}
  .vst-btn.go{background:linear-gradient(180deg,#d7a44e,#b8863a);border-color:#e0b671;
    color:#20160a;}
  .vst-btn[disabled]{opacity:.5;cursor:default;}
  /* The compatibility stop. It takes the place of the action, so there is no
     prominent button sitting under a fatal error. */
  .vst-stop{border:1px solid #7a4a4a;background:#25161a;border-radius:10px;
    padding:12px;margin-top:10px;}
  .vst-stop b{color:#ffc9c9;display:block;margin-bottom:6px;}
  .vst-stop p{margin:6px 0 0;font-size:.84rem;color:#d9c3c3;line-height:1.55;}
  /* The device read-out. Monospace and pre-wrapped so the columns line up and a
     phone can still show it without scrolling sideways. */
  .vst-diag{margin:10px 0 0;padding:10px;border:1px solid var(--field-line);border-radius:8px;
    background:#0a1420;color:#bcd3e8;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.72rem;line-height:1.6;white-space:pre-wrap;word-break:break-word;overflow-x:auto;}
  .vst-prev{width:100%;border-radius:10px;background:#000;display:block;}
  .vst-bar2{height:10px;border-radius:6px;background:#12243a;overflow:hidden;
    border:1px solid var(--field-line);margin-top:10px;}
  .vst-bar2 i{display:block;height:100%;background:#d7a44e;transition:width .2s;}
  .vst-note{font-size:.8rem;color:var(--field-muted);line-height:1.55;margin:8px 0 0;}
  .vst-err{font-size:.85rem;color:#ffb3b3;line-height:1.5;margin:8px 0 0;}
  .vst-ok{font-size:.85rem;color:#9fe0b0;line-height:1.5;margin:8px 0 0;}
  /* The record list, shown in the case's Evidence tab. */
  .vsrow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;
    margin-bottom:8px;}
  .vsrow.old{opacity:.6;}
  @media(max-width:420px){
    .vst-when{grid-template-columns:repeat(2, minmax(0,1fr));}
  }
  /* The six call sites wrap their thumbnail in this instead of an anchor, so a
     tap opens the viewer and nothing navigates. */
  .evlink{display:block;padding:0;border:0;background:transparent;cursor:pointer;
    font:inherit;color:inherit;text-align:left;}
  @media(max-width:640px){
    .amwrap{align-items:flex-end;padding:0;}
    .amsheet{border-radius:14px 14px 0 0;max-height:88vh;max-width:none;}
    .addact{position:fixed;left:14px;right:14px;bottom:14px;z-index:70;
      box-shadow:0 6px 18px rgba(9,18,30,.35);}
  }
  .amhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .amx{background:none;border:0;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 8px;}
  .amtabs{display:flex;gap:6px;margin-bottom:12px;}
  .amtab{flex:1;font:inherit;font-weight:800;padding:9px;border:1px solid var(--line);
    background:var(--panel);border-radius:9px;cursor:pointer;color:var(--muted);}
  .amtab.on{background:var(--navy-2);border-color:var(--navy-2);color:#fff;}
  .amcats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
  .amcat{font:inherit;font-size:.78rem;font-weight:700;padding:7px 11px;border:1px solid var(--line);
    border-radius:16px;background:#fff;cursor:pointer;}
  .amcat.on{border-color:var(--teal);background:var(--info-bg);color:var(--navy);}
  .amline{display:flex;gap:6px;align-items:stretch;margin-bottom:6px;}
  .amstar{flex:0 0 auto;font-size:1.05rem;border:1px solid var(--line);background:#fff;
    border-radius:8px;cursor:pointer;color:var(--gold-2);padding:0 10px;}
  .ampick{flex:1;text-align:left;font:inherit;font-size:.9rem;padding:10px 12px;
    border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
  .ampick:hover{border-color:var(--teal);background:#f4fafb;}
  .amtag{font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--teal);}
  .amfold{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:10px 0;}
  .amfold summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted);}
  .tl-edit{margin-left:8px;font-size:.72rem;background:none;border:0;color:var(--teal);
    cursor:pointer;font-weight:700;padding:0;}
  .tl-counts{display:inline-block;font-size:.78rem;color:var(--muted);margin-right:6px;}
  /* UIBUILD Phase 4 — the report preview screen (P11) and evidence gallery (P12). */
  .rpnav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 12px;
    -webkit-overflow-scrolling:touch;}
  .rpnav button{flex:none;font:inherit;font-size:.82rem;font-weight:700;background:none;border:0;
    border-bottom:2px solid transparent;color:var(--muted);padding:8px 10px;cursor:pointer;white-space:nowrap;}
  .rpnav button.on{color:var(--navy);border-bottom-color:var(--teal);}
  #repdoc{border:1px solid var(--line);border-radius:10px;padding:26px 28px;background:#fff;}
  #repdoc h2{margin:0;}
  .rvbody{white-space:pre-wrap;font:inherit;font-size:.92rem;margin:10px 0 0;overflow-x:auto;}
  .evtabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;}
  .evtab{font:inherit;font-size:.78rem;font-weight:700;padding:7px 11px;border:1px solid var(--line);
    border-radius:16px;background:#fff;cursor:pointer;}
  .evtab.on{border-color:var(--teal);background:var(--info-bg);color:var(--navy);}
  .evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
  .evcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;}
  .evthumb{width:100%;height:110px;object-fit:cover;border-radius:8px;background:var(--panel);display:block;}
  .evtile{width:100%;height:110px;border-radius:8px;background:#eef2f5;display:flex;
    align-items:center;justify-content:center;font-size:2rem;}
  .ovthumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .ovthumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;}
  /* ---- Active Surveillance Mode (SURVEILLANCE.md). A dark field view of the
     same case: usable one-handed, at dusk, from a vehicle. Large targets,
     one primary action per screen, nothing that needs a careful tap. ---- */
  body.surv{background:var(--field-bg);}
  .sv{position:fixed;inset:0;background:var(--field-bg);color:var(--field-ink);overflow-y:auto;
    padding:0 0 96px;-webkit-overflow-scrolling:touch;z-index:70;}
  .sv-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--field-line-2);
    position:sticky;top:0;background:var(--field-bg);z-index:2;}
  /* The case number is an identifier and reads as one — it must not break in
     the middle. It was wrapping as "API-20260815-" / "5002" on a phone, which
     is the kind of thing that gets read back wrong over a radio. The Exit
     control is left exactly as it is; its reachability is Mobile PR 2. */
  .sv-head .case{color:var(--field-label);background:none;padding:0;font-size:.84rem;
    white-space:nowrap;font-variant-numeric:tabular-nums;}
  .sv-x{margin-left:auto;background:none;border:0;color:var(--field-label);font:inherit;font-size:.82rem;
    font-weight:700;cursor:pointer;padding:6px 4px;}
  .sv-body{padding:18px 16px;max-width:640px;margin:0 auto;}
  .sv-day{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--field-label);text-align:center;}
  /* Big enough to read at a glance from the driver's seat, small enough that
     it is not the whole screen — the owner's call after using it. */
  .sv-timer{font-size:2rem;font-weight:800;letter-spacing:.02em;text-align:center;
    font-variant-numeric:tabular-nums;margin:2px 0;}
  /* A stopped clock has to LOOK stopped at a glance in a car at dusk — the
     number alone is not a signal, because a frozen number reads as a live one. */
  .sv-timer.paused{color:var(--field-label);}
  .sv-timer.paused::after{content:" PAUSED";font-size:.72rem;letter-spacing:.14em;
    vertical-align:middle;color:var(--gold);}
  /* Contextual back, inside the mode. Exit active mode leaves; this does not. */
  .sv-back{background:none;border:0;color:var(--field-label);font:inherit;font-size:.86rem;font-weight:700;
    cursor:pointer;padding:8px 2px 12px;display:inline-block;}
  .sv-backbar{padding:6px 16px 0;max-width:640px;margin:0 auto;}
  /* Looks like .sv-back, means something else. The field home asserts it
     carries NO back control, so an edit and a remove must not wear that
     class merely because they are the same size. */
  .sv-tap{background:none;border:0;color:var(--field-label);font:inherit;font-size:.86rem;font-weight:700;
    cursor:pointer;padding:8px 2px 12px;display:inline-block;}
  .sv-since{text-align:center;color:var(--field-label);font-size:.82rem;margin-bottom:18px;}

  /* ===== MOBILE PR 1 — the field screen ranked by what gets pressed =====
     The clock was four stacked lines and a 2rem number; with the header that
     was 275px of an 844px screen before the first field control. It is one row
     now. The time is still the emphatic thing IN that row — an investigator
     reads it at a glance from a driver's seat — it simply no longer owns the
     screen. Nothing about how it is derived changed. */
  .sv-status{padding:7px 12px 8px;margin-bottom:8px;border-radius:12px;
    background:#101f31;border:1px solid var(--field-line-2);}
  /* Still the biggest thing on the block — it is read at a glance in a car —
     but the block around it is two lines, not five. */
  .sv-status .sv-timer{font-size:1.35rem;margin:0;line-height:1.15;}
  .sv-st-day{font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--field-label);font-weight:800;}
  .sv-st-state{font-size:.8rem;color:var(--field-label);}
  /* A stopped clock still has to LOOK stopped: the gold edge is visible before
     the word is read, which is the point in a car at dusk. */
  .sv-status.paused{border-color:var(--gold);background:#161d26;}

  /* WHO IS BEING WATCHED, under the case number. Full width so a long name does
     not fight the Exit control for the same row. */
  .sv-ident{padding:8px 16px;color:var(--head-ink);font-size:.88rem;background:var(--field-bg);
    border-bottom:1px solid var(--field-line-2);max-width:640px;margin:0 auto;}
  .sv-ident b{color:#fff;}

  /* END OF SHIFT, AT THE END OF THE SCREEN. Pressed once a day, and one of them
     stops the billable clock — so it sits past everything used DURING the day
     rather than under the thumb. Same controls, same actions, same confirmation
     screen; only the position and the emphasis changed, and End day is no
     longer the gold one while a day is running. */
  .sv-shift{margin-top:22px;padding-top:16px;border-top:1px solid var(--field-line-2);}
  .sv-shift .sv-btn.end{border-color:#4a3a1e;color:#e6c98a;}
  /* MOBILE PR 2 — the date rides in the status row instead of owning a line of
     its own. It wraps to a second line of that row on a narrow phone, which is
     the row growing rather than the page. */
  .sv-st-when{font-size:.78rem;color:#7fa3c6;flex-basis:100%;text-align:center;}
  /* Leaving the mode, at the end of the Case drawer and in the thumb zone. Not
     gold: this leaves a screen, while End investigation day stops the billable
     clock, and the two must not look like the same weight of decision. */
  .sv-exitblock{margin-top:20px;padding-top:16px;border-top:1px solid var(--field-line-2);}
  .sv-exitnote{margin:8px 2px 0;color:var(--field-label);font-size:.8rem;line-height:1.5;}
  .sv-btn{display:block;width:100%;font:inherit;font-size:1rem;font-weight:800;padding:16px;
    border-radius:12px;border:0;cursor:pointer;background:var(--nav-on);color:#fff;margin-bottom:10px;}
  .sv-btn.gold{background:var(--gold);color:var(--navy-2);}
  .sv-btn.line{background:transparent;border:1.5px solid var(--field-edge);color:var(--field-ink);}
  .sv-quad{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
  .sv-q{font:inherit;font-size:.95rem;font-weight:700;padding:20px 10px;border-radius:12px;
    border:1.5px solid var(--field-line);background:var(--field-panel);color:var(--field-ink);cursor:pointer;text-align:center;}
  .sv-q b{display:block;font-size:1.5rem;margin-bottom:4px;font-weight:400;}
  .sv-card{background:var(--field-panel);border:1px solid var(--field-line);border-radius:12px;padding:14px 16px;margin-bottom:12px;}
  .sv-card h3{margin:0 0 8px;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--field-label);}
  .sv-row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:.92rem;}
  .sv-row b{text-align:right;}
  .sv-f{display:block;margin-bottom:12px;}
  .sv-f span{display:block;font-size:.82rem;color:var(--field-label);margin-bottom:5px;}
  .sv-f input,.sv-f textarea,.sv-f select{width:100%;font:inherit;font-size:1rem;padding:13px 12px;
    border-radius:10px;border:1.5px solid var(--field-edge);background:var(--field-bg);color:var(--field-ink);}
  .sv-tl{list-style:none;margin:0;padding:0;}
  .sv-tl li{border-bottom:1px solid var(--field-line-2);padding:11px 0;}
  .sv-tl .t{color:var(--field-label);font-size:.8rem;font-variant-numeric:tabular-nums;}
  .sv-tl .m{color:var(--field-label);font-size:.8rem;margin-top:3px;}
  /* Same clearance rule as the case bar above, for the same reason: with a
     reported inset of zero this used to sit flush on the screen edge. */
  .sv-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--field-panel);
    border-top:1px solid #2a4a70;z-index:80;box-shadow:0 -6px 18px rgba(5,11,20,.45);
    padding-bottom:max(12px,env(safe-area-inset-bottom));}
  .sv-nav button{flex:1;font:inherit;font-size:.7rem;font-weight:700;background:none;border:0;
    color:#a8c6e4;padding:10px 2px;cursor:pointer;min-height:50px;position:relative;}
  .sv-nav button b{display:block;font-size:1.25rem;font-weight:400;margin-bottom:2px;}
  .sv-nav button.on{color:#fff;}
  .sv-nav button.on::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;
    border-radius:0 0 3px 3px;background:var(--gold);}
  .sv-mic{width:100%;font:inherit;font-size:1rem;font-weight:800;padding:16px;border-radius:12px;
    border:1.5px dashed var(--field-edge);background:var(--field-panel);color:var(--field-ink);cursor:pointer;margin-bottom:10px;}
  .sv-mic.live{border-style:solid;border-color:var(--gold);color:var(--gold);}
  /* §16.1 MOBILE PRIORITY. Full width, one thumb, and a target well above the
     44px minimum — this is pressed in a car, at night, without looking. */
  .sv-voice{margin-bottom:12px;}
  .sv-voicebtn{width:100%;font:inherit;font-size:1.02rem;font-weight:800;min-height:56px;
    padding:16px;border-radius:12px;border:1.5px solid var(--field-edge);background:var(--field-panel);
    color:var(--field-ink);cursor:pointer;}
  .sv-voicebtn.on{background:#1d3a24;border-color:#3f8a52;color:#d6ffe2;}
  .sv-voicebtn[disabled]{opacity:.55;cursor:default;}
  .sv-voicestate{text-align:center;font-weight:800;font-size:.95rem;color:#9fc4e8;
    padding:8px 2px 2px;}
  .sv-voicestate.live{color:#8ee0a4;}
  .sv-voicenote{color:var(--field-label);font-size:.8rem;line-height:1.45;padding:6px 2px 0;}
  .sv-voicewait{background:#2b2410;border:1px solid #6b5a2f;color:#f0dfae;border-radius:10px;
    padding:9px 11px;margin-top:8px;font-size:.84rem;line-height:1.45;}
  /* §1/§16.1 — two lines, and the controls start higher because of it. */
  .sv-st-line{display:flex;align-items:center;justify-content:center;gap:10px;}
  .sv-st-dot{width:9px;height:9px;border-radius:50%;background:#4ec27a;flex:none;}
  .sv-st-dot.paused{background:var(--gold);}
  .sv-st-word{font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--field-label);font-weight:800;}
  .sv-st-sub{text-align:center;font-size:.74rem;color:#7fa3c6;padding-top:1px;line-height:1.3;}
  /* §13 — prepared, prominent, and one tap from the camera. */
  .sv-capture{background:#1d3a24;border:1px solid #3f8a52;border-radius:12px;
    padding:12px 14px;margin-bottom:12px;}
  .sv-capture-h{font-weight:800;font-size:1rem;color:#d6ffe2;}
  .sv-capture-p{color:#a9d8ba;font-size:.82rem;line-height:1.45;margin:6px 0 10px;}
  .sv-voicelog{margin-top:10px;background:#0f1e2e;border:1px solid #223c58;border-radius:10px;
    padding:8px 10px;}
  .sv-voiceloghead{display:flex;gap:10px;align-items:center;justify-content:space-between;
    color:#9fc4e8;font-size:.82rem;font-weight:700;padding:2px 0 4px;}
  .sv-voicelogrows{max-height:240px;overflow:auto;margin-top:6px;}
  .sv-voicelogrows div{display:flex;gap:8px;align-items:baseline;font-size:.78rem;
    padding:3px 0;border-top:1px solid #1a2e45;}
  .sv-voicelogrows span{color:#7d9cbb;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .sv-voicelogrows b{color:var(--field-ink);}
  .sv-voicelogrows i{color:#c9a86a;font-style:normal;}
  .sv-heard{background:#f4f7fa;color:var(--ink);border-radius:12px;padding:14px;margin-bottom:12px;}
  .sv-heard textarea{width:100%;font:inherit;font-size:.95rem;border:1px solid #cfd8e0;
    border-radius:8px;padding:10px;background:#fff;color:var(--ink);}
  .sv-err{background:#3a1d1d;border:1px solid #6b2f2f;color:#ffc9c9;border-radius:10px;
    padding:11px 13px;margin-bottom:12px;font-size:.9rem;}
  .sv-ok{background:#12331f;border:1px solid #2c5f3d;color:#b7f0c9;border-radius:10px;
    padding:14px;margin-bottom:12px;text-align:center;font-weight:700;}
  .sv-warn{background:#3a2f14;border:1px solid #6b5a2f;color:#f0dfb7;border-radius:10px;
    padding:11px 13px;margin-bottom:12px;font-size:.9rem;}
  .sv-pick{display:block;width:100%;text-align:left;font:inherit;font-size:.95rem;padding:14px 13px;
    border:1px solid var(--field-line);border-radius:10px;background:var(--field-panel);color:var(--field-ink);cursor:pointer;margin-bottom:7px;}
  .sv-cats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
  .sv-cat{font:inherit;font-size:.78rem;font-weight:700;padding:9px 13px;border:1px solid var(--field-line);
    border-radius:18px;background:var(--field-panel);color:var(--field-label);cursor:pointer;}
  .sv-cat.on{background:var(--nav-on);color:#fff;border-color:#2f5480;}
  .sv-launch{background:var(--field-panel);border:1px solid var(--field-line);border-radius:12px;padding:14px 16px;
    margin-bottom:10px;cursor:pointer;width:100%;text-align:left;color:var(--field-ink);font:inherit;}
  /* The launch button IS the app icon — the same mark that sits on the phone's
     home screen, so the two are recognisably one thing. */
  .sv-go{display:flex;align-items:center;gap:14px;width:100%;font:inherit;text-align:left;
    background:var(--field-bg);color:var(--field-ink);border:1px solid var(--field-line);border-radius:14px;
    padding:12px 16px 12px 12px;cursor:pointer;margin-bottom:14px;}
  .sv-go img{width:56px;height:56px;border-radius:12px;flex:0 0 auto;}
  .sv-go b{display:block;font-size:1rem;}
  .sv-go span{display:block;font-size:.8rem;color:var(--field-label);margin-top:2px;}
  .sv-go .go{margin-left:auto;color:var(--gold);font-weight:800;font-size:1.2rem;}
  .sv-go.live{border-color:var(--gold);}
  /* UIBUILD Phase 5 — the Case Build steps rail (P13). */
  .pkg-steps{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px;}
  .pkg-step{font-size:.74rem;font-weight:700;padding:6px 10px;border:1px solid var(--line);
    border-radius:14px;background:#fff;color:var(--muted);white-space:nowrap;}
  .pkg-step.done{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok-ink);}
  .pkg-step.na{opacity:.55;}
  .pkg-step.on{border-color:var(--teal);background:var(--info-bg);color:var(--navy);}
  /* ---------------------------------------------- UNIT 10 — the case timeline
     A VERTICAL OPERATIONAL TIMELINE, not a table. The grid is three columns on
     a desk — time, rail, body — and ONE on a phone, where a 44px-wide time
     column beside a wrapping description is how a chronology becomes unreadable.
     New names on purpose: `.tl` already belongs to the activity log at the other
     end of this stylesheet, and the last three source-order casualties here all
     began as a class name two rules were fighting over. */
  .tl2-wrap{min-width:0;}
  .tl2-bar{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
  .tl2-chips{margin-bottom:6px;}
  .tl2-chips .lens b{font-weight:800;color:var(--navy);}
  .tl2-sep{width:1px;align-self:stretch;background:var(--line);margin:2px 4px;}
  .tl2-chips .lens.on b{color:#fff;}
  .tl2-dates{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:2px 0 10px;}
  .tl2-dates .f{margin:0;}
  .tl2-dates input{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 9px;}
  .tl2-note{font-size:.82rem;color:var(--muted);margin:0 0 8px;}
  .tl2-wrap.busy .tl2-doc{opacity:.5;}
  .tl2-doc{min-width:0;}
  .tl2-ctx{border:1px solid var(--line);border-radius:10px;background:#fbfbf9;
    padding:11px 14px;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;}
  .tl2-ctxn{font-size:1.02rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tl2-ctxb{font-size:.85rem;color:var(--ink);overflow-wrap:anywhere;min-width:0;}
  .tl2-ctxb span{display:block;font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);font-weight:700;}
  .tl2-day{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
    color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:5px;margin:18px 0 4px;}
  .tl2-day:first-child{margin-top:2px;}
  ol.tl2{list-style:none;margin:0;padding:0;}
  .tl2-i{display:grid;grid-template-columns:78px 24px minmax(0,1fr);gap:0 10px;
    padding:11px 0 12px;border-bottom:1px solid #efefe9;min-width:0;}
  .tl2-i:last-child{border-bottom:0;}
  .tl2-i.off{opacity:.55;}
  .tl2-i.off .tl2-t{text-decoration:line-through;}
  .tl2-when{text-align:right;padding-top:2px;min-width:0;}
  .tl2-h{display:block;font-weight:800;font-size:.9rem;color:var(--ink);white-space:nowrap;}
  .tl2-allday{color:var(--muted);font-weight:700;}
  .tl2-z{display:block;font-size:.64rem;letter-spacing:.06em;color:var(--muted);font-weight:700;}
  .tl2-line{position:relative;display:flex;justify-content:center;}
  .tl2-line::before{content:"";position:absolute;top:26px;bottom:-13px;width:1px;background:var(--line);}
  .tl2-i:last-child .tl2-line::before{display:none;}
  .tl2-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:.72rem;font-style:normal;border:1px solid var(--line);
    background:#fff;flex:0 0 auto;}
  .tl2-body{min-width:0;overflow-wrap:anywhere;}
  .tl2-head{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:3px;}
  .tl2-kind{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
    padding:2px 7px;border-radius:4px;border:1px solid var(--line);background:#fff;color:var(--muted);}
  .tl2-state{font-size:.66rem;font-weight:700;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:1px 8px;background:#fafaf7;}
  .tl2-t{font-size:.96rem;line-height:1.45;color:var(--ink);font-weight:600;}
  .tl2-d{font-size:.86rem;line-height:1.45;color:var(--muted);margin-top:2px;}
  .tl2-att{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .tl2-attl{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
    color:var(--muted);}
  .tl2-file{font:inherit;font-size:.78rem;font-weight:600;border:1px solid var(--info-line);background:var(--info-bg);
    color:var(--info-ink);border-radius:6px;padding:3px 8px;cursor:pointer;max-width:100%;
    overflow-wrap:anywhere;text-align:left;}
  .tl2-m{margin-top:5px;display:flex;gap:5px 12px;flex-wrap:wrap;align-items:center;
    font-size:.78rem;color:var(--muted);}
  .tl2-go{font:inherit;font-size:.78rem;font-weight:700;background:none;border:0;padding:0;
    color:var(--teal);cursor:pointer;text-decoration:underline;}
  .tl2-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);
    margin-top:14px;padding-top:12px;}
  .tl2-count{font-size:.82rem;color:var(--muted);font-weight:600;margin-right:auto;}
  /* The event categories, as the dot and the badge. Colour is never the only
     indicator — the badge carries the word beside it, which is Unit 8's rule
     one screen along. */
  .tl2-dot.c-activity,.tl2-kind.c-activity{border-color:var(--info-line);background:var(--info-bg);color:var(--info-ink);}
  .tl2-dot.c-media,.tl2-kind.c-media{border-color:var(--media-line);background:var(--media-soft);color:var(--media-ink);}
  .tl2-dot.c-reports,.tl2-kind.c-reports{border-color:#c9c2a8;background:#f7f4ea;color:#6b5a26;}
  .tl2-dot.c-payments,.tl2-kind.c-payments{border-color:var(--ok-line);background:#f0f9f4;color:var(--ok-ink);}
  .tl2-dot.c-case,.tl2-kind.c-case{border-color:#c3ccd8;background:var(--panel);color:#33465e;}
  .tl2-dot.c-package,.tl2-kind.c-package{border-color:#e6c48f;background:#fdf5e6;color:#7a5f2a;}
  .tl2-dot.c-legal,.tl2-kind.c-legal{border-color:#e2aca6;background:#fbefee;color:#a6392f;}
  @media print{
    body.printing-invoice *{visibility:hidden !important;}
    body.printing-invoice #invdoc, body.printing-invoice #invdoc *{visibility:visible !important;}
    body.printing-invoice #invdoc{position:absolute;left:0;top:0;width:100%;border:0;padding:0;}
    body.printing-package *{visibility:hidden !important;}
    body.printing-package #pkgdoc, body.printing-package #pkgdoc *{visibility:visible !important;}
    body.printing-package #pkgdoc{position:absolute;left:0;top:0;width:100%;border:0;padding:0;}
    body.printing-report *{visibility:hidden !important;}
    body.printing-report #repdoc, body.printing-report #repdoc *{visibility:visible !important;}
    body.printing-report #repdoc{position:absolute;left:0;top:0;width:100%;border:0;padding:0;}
    /* UNIT 10 — the timeline prints the SAME rendering that is on screen. There
       is no second document and no PDF writer: the browser's own print dialog
       is what saves one, on an explicit action, and nothing is stored. */
    body.printing-timeline *{visibility:hidden !important;}
    body.printing-timeline #tldoc, body.printing-timeline #tldoc *{visibility:visible !important;}
    body.printing-timeline #tldoc{position:absolute;left:0;top:0;width:100%;border:0;padding:0;}
    /* The "Open …" action means nothing on paper; the attached FILENAMES do,
       so they print as plain text rather than as buttons. */
    body.printing-timeline .tl2-go{visibility:hidden !important;}
    body.printing-timeline .tl2-file{border:0;background:none;padding:0;color:#333;}
    body.printing-timeline .tl2-i{break-inside:avoid;}
    /* UNIT 11 — the evidence manifest prints the same way: the rendering on
       screen IS the document, the browser's dialog saves the PDF, and nothing
       is stored or uploaded by printing. */
    body.printing-manifest *{visibility:hidden !important;}
    body.printing-manifest #mandoc, body.printing-manifest #mandoc *{visibility:visible !important;}
    body.printing-manifest #mandoc{position:absolute;left:0;top:0;width:100%;border:0;padding:0;}
    body.printing-manifest .man-i{break-inside:avoid;}
  }
  @media(max-width:640px){.cal-cell{min-height:54px;} .cal-ev{font-size:.58rem;padding:1px 3px;}}
  .comprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 0 8px;}
  .comprow input{width:90px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
  .capgrid{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 6px;}
  .cap{display:flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600;cursor:pointer;}
  .cap input{width:17px;height:17px;}
  .tag.cap-sd{background:var(--ok-bg);color:var(--ok-ink);} .tag.cap-va{background:var(--info-bg-2);color:var(--info-ink);}
  .tag.cap-pa{background:var(--media-bg);color:var(--media-ink);}
  .opt{font-weight:400;color:var(--muted);font-size:.78rem;}
  /* UNIT 11 — the integrity block on an evidence card, and the manifest.
     `.integ` is its own prefix (nothing else owns it) and the full digest
     always breaks anywhere: sixty-four characters with no spaces is the
     textbook horizontal overflow. */
  .integ{margin-top:6px;padding:7px 9px;background:var(--panel2,#f6f7f9);border:1px solid var(--line);border-radius:8px;font-size:.8rem;}
  .integ .ih{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:600;}
  .integ .hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:var(--muted);}
  .integ .im{color:var(--muted);}
  .integ details{margin-top:3px;} .integ summary{cursor:pointer;color:var(--muted);}
  .iv-match{color:var(--ok-ink);font-weight:600;} .iv-mismatch{color:#a02121;font-weight:600;}
  .iv-un{color:#8a6d1d;font-weight:600;}
  #mandoc{border:1px solid var(--line);border-radius:10px;padding:26px 28px;background:#fff;margin-top:14px;}
  #mandoc h2{margin:0;}
  .man-i{padding:9px 0;border-bottom:1px solid var(--line);}
  .man-i .hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;font-size:.78rem;}
  .man-m{color:#555;font-size:.8rem;}
  /* PAYMENTS.md §2/§14 — the send area explains the next step in body-size type,
     not the 0.78rem muted footnote it used to be. Desktop puts the button and
     the panel side by side; the wrap does the mobile stack with no breakpoint. */
  .sendcta{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;
    border-top:1px solid var(--line);padding-top:16px;margin-top:6px;}
  .nextstep{flex:1 1 260px;background:var(--info-bg);border:1px solid var(--info-line);border-radius:8px;
    padding:11px 14px;color:var(--ink);font-size:.95rem;line-height:1.55;}
  .nextstep b{display:block;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;
    color:var(--info-ink);margin-bottom:3px;}
  .nextstep ul{list-style:none;margin:5px 0 0;padding:0;}
  .nextstep li{font-weight:600;}
  .nextstep li::before{content:"\2713";color:var(--good);font-weight:800;margin-right:7px;}
  /* PAYMENTS.md §10 — the returned-intake state on the lead card. Amber, not
     red: a retainer that has not arrived yet is the ordinary next step, not a
     fault. */
  .retpend{background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:8px;
    padding:9px 12px;margin:8px 0 2px;font-size:.88rem;line-height:1.5;}
  .rp-ok{color:#1c8a4d;font-weight:700;}
  .rp-due{font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    font-size:.8rem;color:var(--gold-ink);}
  .rp-sent{color:var(--muted);font-size:.82rem;margin-top:3px;}
  .dayon{background:var(--info-bg);border:1px solid var(--info-line);border-radius:8px;padding:10px 12px;
    font-size:.88rem;margin-bottom:12px;}
  .meter{height:8px;border-radius:999px;background:#dbe6ea;overflow:hidden;margin:8px 0 2px;}
  .meter i{display:block;height:100%;background:var(--teal);}
  .meter.warn i{background:#d19a1f;} .meter.high i{background:#c9711f;} .meter.over i{background:#b23a2c;}
  .warnline{font-size:.85rem;color:var(--gold-deep);background:var(--gold-bg);border:1px solid var(--gold-3);
    border-radius:8px;padding:8px 10px;margin-top:8px;}
  .warnline.over{color:var(--bad-ink);background:var(--bad-bg);border-color:var(--bad-line);}
  .tl-day{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin:16px 0 6px;}
  .tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);}
  .tl-i{display:flex;gap:10px;padding:8px 0 8px 12px;position:relative;}
  .tl-i::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;
    border-radius:50%;background:var(--teal);}
  .tl-t{flex:none;width:64px;font-family:ui-monospace,monospace;font-size:.82rem;font-weight:700;color:var(--navy);}
  .tl-b{flex:1;min-width:0;}
  .tl-d{font-size:.92rem;}
  .tl-m{font-size:.78rem;color:var(--muted);}
  .tl-n{font-size:.78rem;color:var(--gold-deep);}
  /* reports */
  .rlist{display:grid;gap:8px;margin-top:14px;}
  .rcard{text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;cursor:pointer;width:100%;}
  .rcard:hover{border-color:var(--teal);}
  .rcard.on{border-color:var(--teal);background:var(--teal-wash);}
  .rc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rbody{width:100%;font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.86rem;line-height:1.55;border:1px solid var(--line);border-radius:8px;
    padding:12px;background:#fff;resize:vertical;}
  .rbody[readonly]{background:#f4f6f8;color:var(--muted);}
  .ractions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .tag.rs-draft{background:var(--neutral-bg);color:var(--neutral-ink);}
  .tag.rs-submitted{background:var(--info-bg-2);color:var(--info-ink);}
  .tag.rs-needs_revision{background:#fdf0da;color:var(--gold-deep);}
  .tag.rs-approved{background:var(--ok-bg);color:var(--ok-ink);}
  .tag.rs-delivered{background:var(--navy-3);color:#fff;}
  @media(max-width:560px){

  /* THE PHONE PADDING FIX LIVED ABOVE THE BASE RULE AND WAS DEAD.

     base rule won and the phone collapse never applied. Measured at 375px:
     the report editor was 223px wide — main(16) + .card(22) + .dlg(22) +
     .quick(14) of padding a side is 148px of chrome on a 375px screen. This
     block therefore lives AFTER every base rule it overrides (the bottom of
     the stylesheet), and a test measures the computed padding rather than
     trusting source order again. Scoped to the case screen; the portal-wide
     pass is roadmap item 5, not this. */
  .casepage{max-width:980px;margin:0 auto;}

  .tag.xr{background:var(--ok-bg);color:var(--ok-ink);} .tag.xb{background:var(--info-bg-2);color:var(--info-ink);}

  .notecard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .notebody{white-space:pre-wrap;font-size:.92rem;margin:6px 0 4px;}
  .tag.nv-admin{background:var(--bad-bg);color:var(--bad-ink);} .tag.nv-team{background:var(--neutral-bg);color:var(--neutral-ink);}
  .tag.nv-client{background:#f3e2bd;color:#6b4f12;}
  /* .ex-note is the amber advisory strip. It no longer marks an example —

  .ex-note{background:var(--gold-bg);border:1px solid var(--gold-3);color:#6b4f12;border-radius:8px;
    padding:11px 14px;font-size:.88rem;margin-bottom:14px;}
  .tag.demo-tag{background:var(--media-bg);color:var(--media-ink);margin-left:6px;}

  .empty-title{font-weight:600;color:var(--ink);margin-bottom:4px;}
  .empty-hint{font-size:.9rem;color:var(--muted);}

  .linkbox{background:#f1f7f9;border:1px solid #cfe6ec;border-radius:8px;padding:12px 14px;margin-top:12px;}

  dialog{border:0;border-radius:12px;padding:0;max-width:760px;width:calc(100% - 32px);box-shadow:0 18px 50px rgba(10,20,32,.34);}

  .sig{max-width:250px;border-bottom:1px solid #c7ccd3;margin-top:4px;}
  .dlg .actions{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:8px;}

  /* UNIT 5 — stacked records for phone-width tables. Same markup, same
     handlers; the label a stacked cell prints over itself comes from its own

     the row did not. Scoped by .stacktbl so dense desktop tables that read

  @media(max-width:560px){

  }
  /* UNIT 5 — the activity feed rows: full-width buttons so the whole row is
     the door to its case, metadata quiet, nothing loaded but text. */
  .ra-list{display:grid;gap:6px;}

     from hover so a tab-through reads as a tab-through. */
  .btn:focus-visible,.qtool:focus-visible,.tabs button:focus-visible,
  /* --------------------------------------- UNIT 9: report templates */
  .tmplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:10px;}
  .tmplcard{text-align:left;font:inherit;padding:12px 14px;border:1px solid var(--line);

  .srchlist{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .srchrow{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;width:100%;

  .srchtype{flex:0 0 auto;font-size:.66rem;font-weight:800;letter-spacing:.04em;

  .srchtype-subject{background:#e6f2ea;color:#22613c;}
  .srchtype-vehicle{background:var(--warn-bg);color:#8a5116;}

  .sev{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.04em;

  .sev-attention{background:#fdf3e3;color:#875314;border:1px solid #eddcbd;}

  .qwhy{font-size:.83rem;color:var(--muted);margin-top:2px;}

  /* ------------------------------------------ UNIT 7: clients & firms */
  .profbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;}
  .profsearch{flex:1 1 260px;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;
    border:1px solid var(--line);}
  .lenses{display:flex;gap:6px;flex-wrap:wrap;}
  /* Contacts are CARDS, at every width — a firm's people are read as people,
     and on a phone a table of them is unusable. */
  .ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:10px;}
  .ccard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;

  .cc-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .cc-role{font-size:.82rem;color:var(--muted);margin-top:2px;}

  .rowline{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
    border-bottom:1px solid var(--line);font-size:.9rem;}
  .rowline span{color:var(--muted);}
  .rowline:last-of-type{border-bottom:0;}
  .clickrow{cursor:pointer;}
  /* POSSIBLE EXISTING PROFILE. Amber, because it is a question rather than a
     failure: nothing was saved and nothing was merged. */
  .dupwarn{border:1px solid #e0b34a;background:#fdf7e8;border-radius:10px;padding:12px 14px;
    margin:10px 0;font-size:.88rem;}
  .duprow{display:flex;gap:10px;align-items:center;justify-content:space-between;
    flex-wrap:wrap;padding:5px 0;}
  .pickrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;}
  .pickbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;
    background:#f7fafc;}
  .picklist{display:flex;flex-direction:column;gap:6px;margin:8px 0;}
  .pickitem{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;text-align:left;font:inherit;
    padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;
    min-height:44px;}
  .pickitem:hover{border-color:var(--teal);}
  .usingprof{border:1px solid var(--teal);background:var(--teal-wash);border-radius:12px;
    padding:12px 14px;margin:0 0 14px;}
  .sheet-card.on{border-color:var(--teal);background:var(--teal-wash);}
  .lens:focus-visible,.pickitem:focus-visible,.srchrow:focus-visible,.tmplcard:focus-visible,.evtab:focus-visible,.rpnav button:focus-visible,
  .top .burger:focus-visible,.navback:focus-visible,
  input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--teal);outline-offset:2px;}
  /* UNIT 14 — storage health meter. .sh- prefix; token colors only. */
  .shbar{height:8px;border-radius:4px;background:var(--panel);border:1px solid var(--line);overflow:hidden;margin-top:4px;}
  .shfill{height:100%;border-radius:4px;}
  .linklike{background:none;border:0;padding:0;font:inherit;color:var(--info-ink);text-decoration:underline;cursor:pointer;}

  /* UNIT 12 — daily summary builder, base rules. The phone overrides live in
     the media block BELOW this, at the end of the stylesheet, because source
     order has killed three rules in this file already. .dsb- is its own
     prefix, per the class-name-contest rule. */
  .dsb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 12px;margin-top:6px;}
  .dsb-act{display:flex;flex-direction:column;gap:6px;padding:6px 4px;border-bottom:1px dashed var(--line);}
  .dsb-act > label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;}
  .dsb-act input[type=checkbox]{margin-top:3px;flex:none;}
  .dsb-actrow{display:flex;gap:8px;flex-wrap:wrap;margin-left:26px;}
  .dsb-actrow select,.dsb-actrow input{font-size:.85rem;}
  .dsb-chip{display:inline-block;font-size:.62rem;font-weight:700;letter-spacing:.06em;
    color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
    vertical-align:middle;margin-left:4px;}
  .rvnarr{white-space:pre-line;font-size:.95rem;margin:0 0 12px;padding-bottom:10px;
    border-bottom:1px solid var(--line);}

  /* Item 4's mobile report fix — every value here was MEASURED at 375px
     before it was changed; the suite asserts the numbers, not the look. */
  @media(max-width:560px){
    .casepage .card{padding:14px;}
    .dlg{padding:12px;}
    .wspanel .quick{padding:10px;}
    /* 13.76px told iOS to zoom the page the moment the report editor was
       focused — anything under 16px does. The report is the longest text an
       admin edits on a phone; it gets the full 16. */
    .rbody{font-size:16px;}
    /* Five sub-tabs overflowed by 307px with "Versions" fully hidden and no
       affordance that more existed. Wrapping shows all five; 44px is the
       same tap floor the field bars already enforce. */
    .rpnav{flex-wrap:wrap;}
    .rpnav button{min-height:44px;}
    .ractions .btn{min-height:44px;}
    /* UNIT 5 — the .rbody rule above, made the portal-wide rule it always
       should have been: ANY input under 16px makes iOS zoom the page on
       focus, not just the report editor. And every form control on a phone
       meets the same 44px floor the field bars set. */
    input,select,textarea{font-size:16px;}
    input:not([type="checkbox"]):not([type="radio"]),select{min-height:44px;}
    .btn{min-height:44px;}
    .evtab,.lens{min-height:44px;}
    /* UNIT 7 — the directory on a phone. The filter row stacks, the search box
       is full width, and a contact is a card rather than a row: an admin takes
       a call standing up and needs the number, not a table. */
    .profbar{flex-direction:column;align-items:stretch;}
    .profbar .lenses{overflow-x:auto;}
    .ccards{grid-template-columns:1fr;}
    .cc-acts .btn{min-height:44px;}
    .duprow{flex-direction:column;align-items:flex-start;}
    .pickitem{min-height:52px;}
    /* UNIT 8 on a phone: a result is a stacked card, never a row that runs off
       the side; the filter strip scrolls inside itself rather than widening the
       page; and a queue row's action is full width so it cannot be a 40px
       target beside a long sentence. */
    /* The template picker stacks; each card keeps a comfortable target. */
    .tmplgrid{grid-template-columns:1fr;}
    .tmplcard{min-height:56px;}
    .srchrow{flex-direction:column;gap:4px;}
    /* The chips WRAP rather than scroll sideways. A scrolling strip keeps the
       page from moving but still leaves its own children hanging past the
       right edge, which is exactly what the overflow probe measures — and a
       filter you have to discover by swiping is worse than one you can see. */
    .attnlenses{flex-wrap:wrap;}
    .qrow{flex-direction:column;align-items:stretch;gap:8px;}
    .qgo .btn{width:100%;min-height:44px;}
    /* UNIT 10 — the timeline on a phone. ONE COLUMN. The three-column grid puts
       a 78px time gutter and a 24px rail beside the description, which at 375px
       leaves the text about 210px and turns every observation into a ladder of
       two-word lines. Stacked, the time and the zone read across the top the way
       a person says them, the rail is dropped rather than shrunk (a 1px line
       nobody can see is decoration paid for in width), and the description gets
       the whole screen. Long filenames wrap because .tl2-file already breaks
       anywhere; the chips wrap rather than scroll, for the reason the Unit 8
       strip does. */
    .tl2-i{grid-template-columns:1fr;gap:0;padding:13px 0 14px;}
    .tl2-when{text-align:left;display:flex;gap:8px;align-items:baseline;padding:0 0 4px;}
    .tl2-h{display:inline;font-size:.95rem;}
    .tl2-z{display:inline;}
    .tl2-line{display:none;}
    .tl2-chips{flex-wrap:wrap;}
    .tl2-ctx{gap:8px 18px;}
    .tl2-dates{flex-direction:column;align-items:stretch;}
    .tl2-dates input{width:100%;}
    .tl2-foot .btn{min-height:44px;}
    .tl2-go,.tl2-file{min-height:44px;display:inline-flex;align-items:center;}
    /* UNIT 11 — integrity on a phone: the block spans the card, the buttons
       meet the floor, and the digest wraps rather than widening anything. */
    .integ .btn{min-height:44px;}
    .integ .ih{row-gap:4px;}
    #mandoc{padding:16px 12px;}
    /* UNIT 12 — the daily summary builder on a phone: everything stacks, the
       checkboxes meet the floor, and nothing scrolls sideways. */
    .dsb-grid{grid-template-columns:1fr;}
    .dsb-actrow{flex-direction:column;align-items:stretch;}
    .dsb-actrow select,.dsb-actrow input{width:100%;}
    .dsb-act > label{min-height:44px;}
    .dsb-act input[type=checkbox]{width:22px;height:22px;}
    /* UNIT 14 — the storage panel's refresh meets the floor. */
    [data-act="shRefresh"]{min-height:44px;}
  }

</style>

<div class="top">
  <div class="wrap">
    <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="10" fill="#13273f"/><path d="M32 12l6 8-6 8-6-8z" fill="#3d97ad"/><path d="M32 30l10 12H22z" fill="#c99a3b"/></svg>
    <div class="name">ALWAYS PRECISE<span>INVESTIGATIONS · CASE PORTAL</span></div>
    <div class="who" id="who" hidden></div>
    <!-- UNIT 5 (owner): "the mobile hamburger control has been too small, oddly
         positioned and unclear as a clickable control." Measured at 320px it sat
         236px from the RIGHT edge — mid-header — on a fully transparent
         background. It now holds the conventional corner, on a real surface,
         with an explicit open state; the glyph pair is swapped by CSS off
         body.navopen so the button always says what tapping it will do. -->
    <button class="burger" id="burger" data-act="navToggle" aria-label="Menu"
      aria-expanded="false" hidden><span class="b-open">&#9776;</span><span class="b-close">&#10005;</span></button>
  </div>
</div>
<!-- The drawer's dim used to be a box-shadow — decoration, not an element — so
     a tap "outside the menu" passed straight through to whatever control sat
     underneath it, and the burger itself was covered by the open drawer with
     nothing left to close it. A real backdrop intercepts those taps and IS the
     close control. -->
<button class="navback" data-act="navToggle" aria-label="Close menu" tabindex="-1"></button>

<main id="app"></main>
<!-- The evidence viewer is a SIBLING of the app root, not a panel inside it.
     That is what makes "close and you are back exactly where you were" a
     structural fact rather than something the close handler has to rebuild:
     the screen underneath is never re-rendered or navigated away from. -->
<div id="evview"></div>
<!-- The video timestamp generator, a sibling root for the same reason: a render
     runs as long as the clip does, and nothing underneath may be rebuilt while
     it is going. -->
<div id="vstamp"></div>
<!-- Timestamp Photo, its own root beside the video one: the copy is drawn from
     an image held in this screen's state, and a repaint underneath must not be
     able to pull it out from under a burn in progress. -->
<div id="pstamp"></div>


<script>
"use strict";

/* The API is mounted on this same domain, at /portal-api/*, by a Cloudflare
   Worker route. It has to be same-origin: a session cookie set by a
   workers.dev hostname would be cross-site and never sent back. */
const API = "/portal-api";

const $ = id => document.getElementById(id);
const app = $("app");
let ME = null, TAB = "cases", CASES = [], USERS = [], INVITES = [], TOTAL = 0, FILTER = "", LAST_LINK = "", LAST_EMAILED = false;
let RESET_BOX = null;   // {userId, url} — the reset link, shown AT the row it belongs to
/* Private-client payment configuration. Admin-only and fetched, never held in
   this file — the handles belong to the firm, not to the page source. */
let PAYCFG = null;      // [{id,label,enabled,display_name,handle,url,instructions,from_default}]
/* What the admin typed but has not successfully saved, per method.
   A failed save repaints from PAYCFG — the last SERVER state — which threw
   away their edits, and did something worse than that: if they had
   deliberately CLEARED the payment link, the repaint put the old one back, so
   the form showed a link present while the error said it was missing. The
   screen contradicted itself about the one field the refusal was about.
   Kept until the save succeeds. */
let PAY_DRAFT = {};
/* The Record Payment form on a private case: open/closed, and the Worker's
   own message when it refuses. */
let RET_FORM = false;
let RET_MSG = "";
let RET_ERR = false;
/* The idempotency token for the payment being recorded right now. Cleared on
   success and when the form opens, so a NEW payment is never mistaken for a
   retry of the last one. */
let RET_TOKEN = "";
/* Set when the Worker says an old attempt's outcome cannot be established. The
   only escape is a NEW attempt, and it has to be the admin's decision — the
   page must not quietly reissue a token, because "nobody knows whether that
   money was recorded" is answered by looking at the payment list, not by
   pressing the same button harder. */
let RET_STUCK = false;
/* What the admin typed, kept across repaints. The form's inputs are rebuilt by
   every paint, so without this an error — or pressing Start a new attempt —
   silently emptied the amount they had entered, and the next press sent a
   payment with no figure in it. */
let RET_DRAFT = {};
/* One place that puts the retainer form back to nothing, so a new case, a
   cancel and a fresh Record payment cannot each remember to clear a different
   subset. Every one of these is page-level state about ONE case. */
function retainerReset(){
  RET_FORM = false; RET_MSG = ""; RET_ERR = false;
  RET_STUCK = false; RET_TOKEN = ""; RET_DRAFT = {};
}
/* Which case the state above belongs to. */

/* The arrival sentence generator (MASTER §10, SURVEILLANCE P6).

   P6 lists five position options in one breath — direct, indirect, primary
   route, secondary, mobile — but they are TWO independent things, and reading
   them as one list is a mistake worth not repeating. MASTER §10's own canonical
   example combines two of them at once:

     "…established an indirect surveillance position along the primary route
      of departure."

   A single five-way choice cannot express that sentence: it forces indirect OR
   primary. So VIEW (direct / indirect) and PLACEMENT (primary route / secondary
   route / mobile) are separate, and either may stand alone. The article rides
   with the view — "a direct", "an indirect" — because a generated line has to
   read like a report sentence, not a filled-in blank.
