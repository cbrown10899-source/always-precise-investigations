<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Portal — Always Precise</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1a2c">
<link rel="icon" href="/assets/logo-white.webp">
<!-- Active Surveillance Mode is installable to a phone's home screen. It is
     the same secured site, not a second app: the shortcut only starts at
     ?surveillance=1, which opens the field launcher after the normal login.
     The icons are the firm's own Active Surveillance mark — deliberately NOT
     declared maskable, because an Android mask would crop the corners and take
     the "Always Precise Investigations" banner off the top of it. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="API Surveillance">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* UNIT 13 — THE PALETTE, IN ONE PLACE. Every value below is the one the
     deployed portal was already drawing — this block COMPLETES the token
     layer, it does not restyle. The conceptual roles the owner locked map so:
     primary navy --navy · navy secondary --navy-2 · teal --teal · teal
     hover/active --teal-2 · gold --gold · surface white --card · surface
     light --paper · surface muted --panel · border --line · text --ink ·
     text secondary --muted · success --good · warning --warn · danger --bad ·
     info --info · disabled --disabled · focus --focus.

     THE FIELD FAMILY IS DELIBERATELY APART. Active Surveillance and the two
     timestamp tools run dark and high-contrast because they are used one-
     handed in the dark; their tokens are named --field-* so nobody
     "normalizes" a field control to office styling by accident.

     Semantic chips are PAIRS (bg + ink, sometimes a line): a tint without its
     ink is how a chip drifts illegible. Change a pair together or not at all. */
  :root{
    --navy:#0e1a2c; --navy-2:#13273f; --teal:#2f7d90; --teal-2:#3d97ad;
    --gold:#c99a3b; --ink:#1c2531; --muted:#5c6775; --line:#dfe3e8;
    --paper:#f4f5f7; --card:#fff; --good:#1c8a4d; --bad:#c14133; --warn:#96600f;
    /* conceptual aliases — one vocabulary, zero new colors */
    --info:var(--teal); --focus:var(--teal); --disabled:#6f7d8c;
    /* surfaces and structure */
    --panel:#f2f5f8; --head-ink:#cfe0f0; --head-sub:#9db2c9;
    /* semantic pairs (chips, notes, banners) */
    --ok-bg:#dff2e5; --ok-ink:#1a6b3c; --ok-line:#9fd3b2; --ok-soft:#f4faf6;
    --warn-bg:#fdf1e3;
    --gold-bg:#fdf7ec; --gold-line:#f0dcb6; --gold-ink:#7a5a12;
    --bad-bg:#fdecea; --bad-line:#f5c6c0; --bad-ink:#8a2318;
    --info-bg:#eaf5f7; --info-line:#b7dbe3; --info-ink:#1d5c6c;
    --neutral-bg:#e6ebf0; --neutral-ink:#42505f;
    --info-bg-2:#dcecf2; --teal-wash:#f2f9fa; --navy-3:#12305a; --nav-on:#1f3a58;
    --media-bg:#e3d7f5; --media-ink:#4a2f77; --media-line:#c9b6e8; --media-soft:#f2ecfb;
    --gold-2:#b7924c; --gold-3:#e8cf9e; --gold-deep:#7a5410; --gold-soft:#fbf7ee;
    /* the field family — dark on purpose; see the note above */
    --field-bg:#0d1826; --field-deep:#0b1626; --field-panel:#132538;
    --field-line:#23405f; --field-ink:#e8eef5; --field-label:#8fb4d9;
    --field-muted:#8fa9c2; --field-line-2:#1e3149; --field-edge:#2a456a;
    --field-edge-2:#3a5b80; --field-edge-3:#33526f; --field-ink-2:#cfe2f5;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}

  .top{background:var(--navy);color:#fff;padding:14px 20px;}
  .top .wrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .top .name{font-weight:700;letter-spacing:.03em;line-height:1.15;}
  .top .name span{display:block;font-weight:400;font-size:.72rem;color:var(--head-sub);letter-spacing:.05em;}
  .top .who{margin-left:auto;font-size:.82rem;color:var(--head-ink);text-align:right;}
  .top .who b{display:block;color:#fff;}
  .top button{font:inherit;font-size:.82rem;background:transparent;border:1px solid #3c5878;color:var(--head-ink);border-radius:6px;padding:6px 12px;cursor:pointer;margin-left:12px;}
  .top button:hover{background:#1c3552;}
  /* VISUAL PHASE 1, MOBILE — the header was taking ~290px of an 844px screen:
     the logo block, then the identity wrapping onto a second row, then Sign
     out onto a third. A third of the first screenful spent before any work
     appeared, on the viewport this phase treats as first class. The identity
     goes to one quiet line beside the burger; nothing is removed, and Sign out
     keeps a 44px target. */
  @media(max-width:760px){
    .top{padding:10px 14px;}
    .top .wrap{flex-wrap:nowrap;gap:10px;}
    /* One line each. Left to wrap, the wordmark broke across two rows and the
       Sign out button broke mid-word, which is what a shrunk desktop looks
       like — the thing this phase is meant to stop doing. */
    .top .name{font-size:.82rem;min-width:0;white-space:nowrap;}
    .top .name span{font-size:.6rem;white-space:nowrap;overflow:hidden;
      text-overflow:ellipsis;display:block;max-width:150px;}
    .top .who{font-size:.72rem;line-height:1.25;display:flex;align-items:center;gap:8px;}
    .top .who b{display:inline;}
    /* The role word stays — it is text somebody may be checking, and hiding it
       to save 40px would be trading a fact for a layout. Smaller type and one
       row is enough. */
    .top button{margin-left:0;min-height:44px;padding:6px 10px;white-space:nowrap;}
    .top .who b{white-space:nowrap;}
  }

  main{max-width:1180px;margin:0 auto;padding:22px 16px 70px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{font:inherit;font-size:.9rem;font-weight:600;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--teal-2);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(16,29,51,.05);}
  .card.narrow{max-width:430px;margin:8vh auto 0;}
  h1{font-size:1.28rem;margin-bottom:4px;}
  h2{font-size:1.05rem;margin-bottom:12px;}
  .lead{color:var(--muted);font-size:.92rem;margin-bottom:18px;}
  label.f{display:block;margin-bottom:14px;}
  label.f > span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;}
  input,select,textarea{width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  input:focus,select:focus{outline:2px solid var(--teal-2);border-color:var(--teal-2);}
  /* UNIT 13 — PRIMARY IS NAVY (owner: "Primary: dark navy / Light text"; teal
     is the ACCENT). The teal fill this replaced was the drift the palette
     brief names. Hover darkens within the navy family; teal keeps meaning
     selection, focus and information. */
  .btn{font:inherit;font-size:.95rem;font-weight:700;border:0;border-radius:8px;padding:11px 20px;cursor:pointer;background:var(--navy-2);color:#fff;}
  .btn:hover{background:var(--navy);}
  .btn.accent{background:var(--teal);}
  .btn.accent:hover{background:var(--teal-2);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn.sm{font-size:.82rem;padding:7px 13px;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn.danger{background:var(--bad);}
  .err{color:var(--bad);font-size:.86rem;margin-top:10px;min-height:1em;}
  .okmsg{color:var(--good);font-size:.86rem;margin-top:10px;min-height:1em;}

  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .bar input{max-width:280px;}
  .count{color:var(--muted);font-size:.86rem;margin-left:auto;}
  .note{background:var(--gold-bg);border:1px solid var(--gold-line);color:var(--gold-ink);border-radius:8px;padding:10px 13px;font-size:.86rem;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;}
  tbody tr.click{cursor:pointer;}
  tbody tr.click:hover{background:#f7fafb;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;color:var(--teal);}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;}
  .tag.claims{background:#eaf4f7;color:#1f5c6d;}
  .tag.consumer{background:#f0eee9;color:#6b5a33;}
  .tag.legaltag{background:#e8e2f5;color:#4a3577;}
  .tag.new{background:var(--warn-bg);color:var(--warn);}
  .tag.assigned{background:#eaf4f7;color:#1f5c6d;}
  .tag.in_progress{background:#e8f1fb;color:#1e4f8a;}
  .tag.closed{background:#e9f7ef;color:var(--good);}
  .tag.report_review{background:#f3ecfb;color:#5b3d8a;}
  .tag.awaiting_client{background:var(--warn-bg);color:var(--warn);}
  .tag.complete{background:#e9f7ef;color:var(--good);}
  .tag.on_hold{background:#f1f1f1;color:#666;}
  .tag.cancelled{background:#f1f1f1;color:#888;}
  .tag.open{background:var(--warn-bg);color:var(--warn);}
  .empty{color:var(--muted);padding:26px 4px;font-size:.92rem;}

  /* dashboard strip */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:12px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    min-width:0;overflow-wrap:anywhere;}
  .stat.warn{border-color:var(--gold-3);background:#fdf9f1;}
  .stat-n{font-size:1.7rem;font-weight:800;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums;}
  .stat.warn .stat-n{color:#8a6410;}
  .stat-l{font-size:.82rem;font-weight:700;margin-top:2px;}
  .stat-h{font-size:.75rem;color:var(--muted);margin-top:1px;}
  .stat.live{border-color:#9fd3c0;background:#f0faf6;}
  .stat.live .stat-n{color:var(--ok-ink);}
  .stat.click{cursor:pointer;}
  .stat.click:hover{border-color:var(--teal);}
  .stat.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:var(--teal-wash);}

  /* ============ VISUAL PHASE 1 — hierarchy, not new surfaces ============
     The audit that produced this: eight identical bordered boxes, six of them
     zero, all shouting equally, with the actual work queue pushed below them —
     on a phone, below two whole screenfuls. Nothing here hides a number or
     invents one. Only weight, density and order-on-screen change. */

  /* A ZERO IS STILL THE TRUTH AND STAYS ON SCREEN. It just stops competing with
     the figure that needs somebody. This is the single change that makes the
     strip scannable, and it is presentation only — `0` is still `0`, and a
     failed read still says it could not be read rather than showing zero. */
  .stat.zero{background:#fbfcfd;}
  .stat.zero .stat-n{color:#93a1b0;font-weight:700;}
  .stat.zero .stat-l{font-weight:600;color:#5c6775;}

  /* CURRENT WORK IS A READ-OUT, NOT FOUR HEADLINES. One surface with hairline
     divisions rather than four separate cards, and smaller figures — it reports
     the state of the desk, while Needs attention is the thing that interrupts
     you. Every label and hint is still present and still read by innerText;
     nothing is display:none. */
  .band-work .stats{grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));
    gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;
    overflow:hidden;margin-bottom:12px;}
  .band-work .stat{border:0;border-radius:0;padding:12px 14px;}
  .band-work .stat-n{font-size:1.22rem;}
  .band-work .stat-l{font-size:.79rem;}
  .band-work .stat-h{font-size:.72rem;}
  .band-work .stat.click:hover{background:#f4f9fb;}
  .band-work .stat.on{box-shadow:0 0 0 2px var(--teal) inset;}

  /* THE QUEUE IS THE PRIMARY THING ON THIS PAGE. It gets the one emphatic
     surface: a navy top rule and a little more room, so the eye lands on it
     rather than on the statistics above it. */
  .card.queuecard{border-color:#cdd6df;box-shadow:0 1px 2px rgba(14,26,44,.05);}
  .card.queuecard > .bar{border-bottom:2px solid var(--navy);padding-bottom:10px;}
  .card.queuecard > .bar h2{font-size:1.06rem;}

  /* THE QUIET END OF THE PAGE. Recently completed and the pinned/recent strip
     report what is already dealt with; they should read as reference, not as
     work. */
  .card.quietcard{background:#fbfcfd;border-color:var(--neutral-bg);}
  .card.quietcard > .bar h2{font-size:.95rem;color:#44505c;}
  /* THE DASHBOARD BANDS (owner, 2026-08-16). Navy chrome on the light
     workspace: the band rule and its label are the firm's colours, the cards
     underneath stay paper. No second surface, no dark rewrite — the owner's
     first visual pass is chrome only.

     The gold is one 16px rule per band and nothing else. It is the accent that
     says "this is the firm"; the moment it is also on borders, numbers and
     hovers it stops meaning anything. */
  .band{margin:0 0 22px;}
  .bandhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding-bottom:9px;margin-bottom:13px;border-bottom:1px solid var(--line);}
  .bandhead h2{margin:0;font-size:.78rem;font-weight:800;letter-spacing:.11em;
    text-transform:uppercase;color:var(--navy);display:flex;align-items:center;gap:9px;}
  .bandhead h2::before{content:"";width:16px;height:3px;border-radius:2px;background:var(--gold);}
  .bandhead .bandsub{font-size:.79rem;color:var(--muted);}
  .bandhead .bandgo{margin-left:auto;}
  /* .btn.sm is 7px of padding on a .82rem line — about 35px, under Apple's 44.
     A band's one primary action is exactly the control a thumb goes for. */
  .bandhead .btn{min-height:44px;}
  /* TODAY / NEXT ACTIONS and RECENTLY COMPLETED are ROWS, not cards. Slice one
     went from ten cards to eight for a reason; answering "what do I do next"
     with more tiles would put the busyness straight back. Navy chrome, light
     workspace, no new surface. */
  .queue{display:flex;flex-direction:column;}
  .qrow{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;min-width:0;
    padding:11px 2px;border-top:1px solid var(--line);}
  .qrow:first-child{border-top:0;}
  .qmain{min-width:0;flex:1 1 240px;}
  .qwhat{font-weight:700;font-size:.89rem;overflow-wrap:anywhere;}
  .qwho{font-size:.81rem;color:var(--muted);overflow-wrap:anywhere;margin-top:1px;}
  .qno{font-size:.72rem;color:var(--muted);overflow-wrap:anywhere;}
  .qmore{font-size:.72rem;color:var(--muted);font-weight:600;}
  /* Never colour alone: the row's own words are the status, and the button
     says what it does. The rule below is spacing, not meaning. */
  .qgo{margin-left:auto;flex:0 0 auto;}
  .qgo .btn{min-height:44px;}
  .qfoot{font-size:.79rem;color:var(--muted);padding:10px 2px 0;border-top:1px solid var(--line);}
  /* The counts that are real work but not today's headline. A line of text
     rather than five more cards: the owner asked for fewer busy cards, and
     dropping them outright would lose alerts somebody depends on. */
  .alsoline{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;
    font-size:.83rem;color:var(--muted);margin:-4px 0 22px;padding:0 2px;}
  .alsoline b{color:var(--navy);font-variant-numeric:tabular-nums;}
  .alsoline .alsoitem{background:none;border:0;font:inherit;color:inherit;padding:0;
    display:inline-flex;align-items:center;gap:5px;min-height:44px;}
  .alsoline button.alsoitem{cursor:pointer;text-decoration:underline;text-underline-offset:3px;
    text-decoration-color:#c3ccd6;}
  .alsoline button.alsoitem:hover{color:var(--navy);text-decoration-color:var(--teal);}
  /* Quick tools: one compact row of case-independent utilities, in the same
     visual language as .alsoline so the dashboard gains a shortcut and not a
     fifth equal-weight box. 44px minimum, wraps rather than overflowing. */
  .qtools{margin:0 0 14px;padding:0 2px;}
  /* .qtgrid, not .qgrid — that name was already taken by the field view's
     84px action grid at the other end of this stylesheet, and the later rule
     was silently winning. The third source-order casualty this project has
     records for; a distinct name ends the contest instead of refereeing it. */
  .qtgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));
    gap:8px;margin-top:6px;}
  /* The Timestamp pair reads as a pair: same accent edge on both, and the grid
     keeps them adjacent because they are declared adjacent. */
  .qtgrid .qtool{width:100%;justify-content:flex-start;}
  .qtool.qt-pair{border-left:3px solid var(--teal);}
  .qtools-l{font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);}
  /* IT HAS TO READ AS AN ACTION, and the first two attempts did not.

     White on a near-white page behind a hairline border is technically visible
     and practically invisible — the owner looked at the live dashboard and did
     not see it. The tint that replaced it was barely better: measured, `var(--info-bg)`
     sits THREE luminance points from the page's own `#f4f5f7`, which is no
     separation at all. There is a test that fails below 8, and it caught this.

     Filled navy: unmistakable against a light page, and deliberately NOT the
     teal the bands' own actions use, so a utility does not compete with the
     work queue. Still one 44px row, still not a card. */
  .qtool{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;
    border:1px solid var(--navy);border-radius:9px;background:var(--navy);color:#fff;
    font:inherit;font-size:.9rem;font-weight:700;cursor:pointer;}
  .qtool b{font-weight:400;font-size:1.1rem;line-height:1;}
  .qtool:hover{background:var(--navy-2);border-color:var(--navy-2);}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--info-bg);border:1px solid var(--info-line);
    color:var(--navy);border-radius:999px;padding:3px 6px 3px 11px;font-size:.8rem;font-weight:700;}
  .chip button{border:0;background:none;font:inherit;font-size:1rem;cursor:pointer;color:var(--teal-ink,var(--info-ink));line-height:1;}
  /* MASTER §31 — the Cases tab's lens and the Completed desk. */
  .lead-send{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;
    padding-top:8px;border-top:1px dashed var(--line);}
  .lead-send input{flex:1;min-width:170px;font:inherit;font-size:.85rem;border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;}
  .tag[class*="lead-"]{background:#f4f0e6;border-color:#d9c9a3;color:#7a5f2a;}
  .tag.lead-converted{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok-ink);}
  .tag.lead-declined,.tag.lead-closed_lead{background:#f5f5f5;border-color:#ccc;color:#666;}
  .lensrow{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap;}
  .lens{font:inherit;font-size:.8rem;font-weight:700;padding:6px 14px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;}
  .lens.on{background:var(--navy-2);border-color:var(--navy-2);color:#fff;}
  /* Same three parts as .pkgcards above, and for the same reason: these cards
     carry case numbers too, and the completed desk now has two doors. */
  .donegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(310px,100%),1fr));gap:12px;}
  .donecard{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff;
    min-width:0;overflow-wrap:anywhere;}
  .dc-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .dc-acts{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:10px;}
  /* rate sheets */
  .sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px;}
  .sheet-card{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:15px 16px;cursor:pointer;font:inherit;color:inherit;display:block;width:100%;}
  .sheet-card:hover{border-color:var(--teal);}
  .sheet-card.on{border-color:var(--teal);background:var(--teal-wash);box-shadow:0 0 0 1px var(--teal) inset;}
  .sheet-n{font-weight:800;font-size:1.05rem;color:var(--navy);}
  .sheet-a{font-size:.78rem;color:var(--muted);margin:2px 0 8px;}
  .sheet-s{font-size:.88rem;}
  .sheet-go{margin-top:10px;font-size:.78rem;font-weight:700;color:var(--teal);}
  .sheet-note{font-size:.8rem;color:var(--muted);font-weight:400;max-width:46ch;}
  .loaderr{background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad-ink);border-radius:10px;
    padding:12px 14px;margin-bottom:16px;font-size:.9rem;}
  /* case workspace — built to be usable from a phone in a parked car */
  .wstabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);
    margin:0 0 16px;padding-bottom:0;-webkit-overflow-scrolling:touch;}
  .wstabs button{flex:none;font:inherit;font-size:.88rem;font-weight:700;background:none;border:0;
    border-bottom:2px solid transparent;color:var(--muted);padding:9px 12px;cursor:pointer;white-space:nowrap;}
  .wstabs button.on{color:var(--navy);border-bottom-color:var(--teal);}
  .wspanel{min-height:120px;}
  .quick{background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;}
  .quick .btn{width:100%;}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;margin-bottom:12px;}
  .qk{position:relative;}
  .qk input{position:absolute;opacity:0;pointer-events:none;}
  .qk span{display:block;text-align:center;font-size:.8rem;font-weight:700;padding:10px 4px;

  .qk input:focus-visible + span{outline:2px solid var(--teal);}
  .qk2{display:block;width:100%;text-align:center;font:inherit;font-size:.8rem;font-weight:700;
    padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-w{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0;}
  .cal-cell{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;overflow:hidden;}
  .cal-pad{background:transparent;border-color:transparent;}
  .cal-today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
  .cal-d{font-size:.72rem;font-weight:700;color:var(--muted);}
  .cal-ev{display:block;font-size:.64rem;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--teal);
    border-radius:4px;padding:2px 5px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Rate sheets: the numbers dominate (RATESHEETS.md mobile hierarchy). */
  /* PORTAL-OPS Phase 8 — the pinned / recent strip. Deliberately a row of quiet
     chips rather than a card: this is a shortcut bar above the list, and the
     phase says not to over-engineer it. Wraps instead of scrolling sideways, so
     a long row costs height on a phone and never a horizontal scroll. */
  .rvstrip{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 2px;}
  .rvlab{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-right:2px;}

  .rvchip{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;
    border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer;
    font:inherit;font-size:.78rem;font-weight:700;color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  .rvchip.pin{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold-ink);}
  .favstar.on{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold-ink);}
  .rs-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
  .rs-row:last-child{border-bottom:0;}
  /* `min-width:0` because a flex item's default `min-width:auto` refuses to
     shrink below its content, which is what let this row push past a phone. */
  .rs-l{flex:1;min-width:0;}
  .rs-sub{margin-left:8px;font-size:.78rem;color:var(--muted);font-weight:600;}
  .rs-note{font-size:.84rem;color:var(--muted);margin-top:3px;max-width:56ch;}
  /* NOWRAP BELONGS TO THE MONEY, NOT TO EVERY VALUE. This column was written for
     the retainer and hourly figures, and `white-space:nowrap` on all of it was
     right for those — but two lines on the private sheet carry SENTENCES ("No
     routine add-on fees", "Quoted in advance"), and an unbreakable sentence made
     the row wider than a 390px screen: 413px, a 23px sideways scroll on the
     whole view. Text values wrap now; the figures keep the nowrap they need.
     (No amount is written in this file, deliberately — a test fails on one.) */
  .rs-v{font-weight:700;padding-left:8px;text-align:right;}
  .rs-big .rs-v{white-space:nowrap;font-size:1.55rem;font-weight:800;color:var(--navy);line-height:1.1;}
  .rs-badge{display:inline-block;margin-left:8px;padding:2px 9px;border:1px solid var(--gold-2);color:#8a6d33;
    border-radius:10px;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:2px;}
  .rs-close{margin:14px 0 4px;padding:13px 15px;background:var(--gold-soft);border-left:3px solid var(--gold-2);border-radius:0 8px 8px 0;}
