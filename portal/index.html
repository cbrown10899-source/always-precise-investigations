     reference number — it prints as its own block below, never as a <dt>. */

  const ret = i.retainer;
  return `<div id="invdoc">
    <div class="doc-head">
      <div><h2>${esc(cfg.company_name || "")}</h2>
        <div style="font-size:.85rem;color:var(--muted)">${esc(cfg.company_line || "")}</div></div>
      <div style="text-align:right">
        <div style="font-size:1.2rem;font-weight:800;letter-spacing:.06em">INVOICE</div>
        <div><b>${esc(i.invoice_no)}</b></div>
        <div style="font-size:.88rem">Issued ${esc(fmtDay(i.issue_date || "") || "—")}</div>
        ${i.due_date ? `<div style="font-size:.88rem">Due ${esc(fmtDay(i.due_date))}</div>` : ""}
        ${i.payment_terms ? `<div style="font-size:.88rem">${esc(i.payment_terms)}</div>` : ""}
      </div>
    </div>
    <div style="display:flex;gap:26px;flex-wrap:wrap">
      <div style="flex:1;min-width:220px">
        <div class="doc-refs"><dt>Bill to</dt><dd style="white-space:pre-line">${esc(i.bill_to || "")}</dd>
        ${i.billing_email ? `<dd style="color:var(--muted)">${esc(i.billing_email)}</dd>` : ""}</div>
      </div>
      ${refs.length ? `<dl class="doc-refs" style="flex:1;min-width:200px;margin:0">
        <dt>Case #</dt><dd>${esc(i.case_no)}</dd>
        ${refs.map(([k, v]) => `<dt>${esc(refLabels[k] || k)}</dt><dd>${esc(v)}</dd>`).join("")}
      </dl>` : `<dl class="doc-refs" style="flex:1;min-width:200px;margin:0">
        <dt>Case #</dt><dd>${esc(i.case_no)}</dd></dl>`}
    </div>
    <table class="doc-table"><thead><tr><th>Description</th><th class="n">Qty</th>
      <th class="n">Rate</th><th class="n">Amount</th></tr></thead>
      <tbody>${(i.lines || []).map(l => `<tr><td>${esc(l.description)}</td>
        <td class="n">${l.rate != null ? esc(l.qty) : ""}</td>
        <td class="n">${l.rate != null ? usd(l.rate) : ""}</td>
        <td class="n">${usd(l.amount)}</td></tr>`).join("")}</tbody></table>
    ${i.adjustments ? `<div style="text-align:right;font-size:.92rem">Adjustments: ${usd(i.adjustments)}</div>` : ""}
    ${i.amount_paid ? `<div style="text-align:right;font-size:.95rem">Invoice total ${usd(i.total)}
        &middot; Payments received ${usd(i.amount_paid)}</div>` : ""}
    <div class="doc-due">${i.amount_paid ? "Balance due" : "Total due"} <b>${usd(i.balance_due)}</b></div>
    ${ret ? `<table class="doc-table" style="margin-top:12px"><tbody>
      <tr><td style="width:60%"><b>Retainer held</b></td><td class="n">${usd(ret.amount)}${
        ret.received ? "" : " <span style='color:var(--muted);font-size:.85rem'>(not yet received)</span>"}</td></tr>
      <tr><td>Applied to date${
        (i.lines || []).length ? "" : ""}</td><td class="n">${usd(ret.applied)}</td></tr>
      ${ret.additional_authorized ? `<tr><td>Additional authorization</td>
        <td class="n">${usd(ret.additional_authorized)}</td></tr>` : ""}
      <tr><td><b>${ret.balance < 0 ? "Beyond the retainer" : "Retainer remaining"}</b></td>
        <td class="n"><b>${usd(Math.abs(ret.balance))}</b></td></tr>
    </tbody></table>` : ""}
    ${special ? `<p style="font-size:.9rem;white-space:pre-line"><b>Special instructions</b><br>${esc(special)}</p>` : ""}
    ${i.client_notes ? `<p style="font-size:.9rem">${esc(i.client_notes)}</p>` : ""}
    <p style="font-size:.88rem;color:var(--muted)">${esc(cfg.payment_instructions || "")}</p>
    <p style="font-size:.85rem;border-top:1px solid var(--line);padding-top:10px;color:var(--muted)">${esc(cfg.invoice_footer || "")}</p>
  </div>`;
}

      <div class="two">
        <label class="f"><span>Billing email</span><input id="iv_bemail" value="${esc(i.billing_email || "")}" ${editable ? "" : "disabled"}></label>
        <label class="f"><span>Payment terms</span><input id="iv_terms" value="${esc(i.payment_terms || "")}" ${editable ? "" : "disabled"}></label>
      </div>
      <div class="two">

    ${(i.payments || []).length ? i.payments.map(pm => `<div class="tl-m">${usd(pm.amount)} &middot; ${esc(fmtDay(pm.paid_date))}

    ${i.status !== "void" ? `<form class="quick" data-act="invPay" style="margin-top:8px">

      </div>
      <button class="btn sm" type="submit">Record payment</button>

    ${INV_EVENTS.length ? `<h3 style="margin:16px 0 6px;font-size:1rem">History</h3>
      ${INV_EVENTS.map(e => `<div class="tl-m">${esc(e.action)}${e.detail ? ` &middot; ${esc(e.detail)}` : ""}
        &middot; ${esc(e.who || "")} &middot; ${when(e.at)}</div>`).join("")}` : ""}

    <h3 style="margin:18px 0 6px;font-size:1rem">The document <span class="opt">exactly what prints</span></h3>
    ${invoiceDocHtml(i)}
  </div>`;
}

async function loadInvoices(){
  try{ INVOICES = await api("/invoices" + (Object.values(INV_FILTER).some(Boolean)
    ? `?status=${encodeURIComponent(INV_FILTER.status)}&type=${encodeURIComponent(INV_FILTER.type)}&q=${encodeURIComponent(INV_FILTER.q)}` : ""));
    INV_SETTINGS = INVOICES.settings;
  }catch(e){ INVOICES = {invoices: [], summary: {}}; INV_MSG = e.message; }
  paint();
}

async function openInvoice(id){
  try{

async function addActivityEntry(){
  WS_ERR = "";
  const date = $("a_date").value, time = $("a_time").value;
  try{
    if(QKIND === "mileage" || QKIND === "expense"){
      // These are money, so the real record is the expense; the timeline entry
      // marks when it happened so the day still reads as one story.
      const desc = $("a_desc").value.trim();
      const miles = QKIND === "mileage" ? $("a_miles").value : "";

        expense_date: date, category: QKIND === "mileage" ? "mileage" : $("a_cat").value,
        miles, amount: amt, description: desc,
      }});
      await api(`/cases/${encodeURIComponent(WS_CASE)}/activity`, {method:"POST", body:{
        kind: QKIND, at_date: date, at_time: time,
        description: QKIND === "mileage" ? `${miles} miles — ${desc}` : `$${amt} ${$("a_cat").value} — ${desc}`,
      }});

      if(QKIND === "location" && !loc.trim()){ WS_ERR = "A location entry needs the location."; return paintCase(); }
      if(QKIND === "vehicle" && !veh.trim()){ WS_ERR = "A vehicle entry needs the vehicle."; return paintCase(); }
      await api(`/cases/${encodeURIComponent(WS_CASE)}/activity`, {method:"POST", body:{
        kind: QKIND, at_date: date, at_time: time,
        description: $("a_desc").value,
        location: loc, vehicle: veh,

        video_acquired: $("a_va") ? $("a_va").checked : false,
        photo_acquired: $("a_pa") ? $("a_pa").checked : false,
      }});
    }
    ACT_MODAL = null;   // success closes the sheet; the timeline is the confirmation
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

/* The quick path (P9): a picked line, the clock, and Add to log. Also carries
   the one-tap No-change entry and the correction of an existing entry. */
async function quickAddEntry(oneTapLine){
  WS_ERR = "";
  try{
    if(!oneTapLine && ACT_MODAL && ACT_MODAL.edit){
      // The Worker allows exactly these four fields to change, and stamps it.
      await api(`/cases/${encodeURIComponent(WS_CASE)}/activity/${ACT_MODAL.edit}`, {method:"POST", body:{
        description: $("qa_desc").value,
        location: $("qa_loc").value, vehicle: $("qa_veh").value, internal_note: $("qa_note").value,
      }});
    }else{
      const now = new Date();
      const body = oneTapLine ? {
        kind: "activity", description: oneTapLine,
        at_date: ymdLocal(now), at_time: now.toTimeString().slice(0,5),
      } : {
        kind: "activity",
        at_date: $("qa_date").value, at_time: $("qa_time").value,
        description: $("qa_desc").value,
        location: $("qa_loc").value, vehicle: $("qa_veh").value,
        internal_note: $("qa_note").value,
        subject_documented: $("qa_sd").checked,
        video_acquired: $("qa_va").checked,
        photo_acquired: $("qa_pa").checked,
      };
      // Ticked files ride to the new moment. Read before the paint eats the DOM.
      const links = oneTapLine ? []
        : [...document.querySelectorAll(".qa-ev:checked")].map(x => Number(x.dataset.id));
      const made = await api(`/cases/${encodeURIComponent(WS_CASE)}/activity`, {method:"POST", body});
      for(const evId of links){
        try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/evidence/${evId}/link`,
          {method:"POST", body:{entry_id: made.id}}); }
        catch(e){ WS_ERR = "The entry saved, but a file link failed — " + e.message; }
      }
    }
    ACT_MODAL = null;
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function svSaveEntry(oneTap){
  SV.err = "";
  // An edit changes the four fields the Worker allows and is stamped by it.
  if(!oneTap && SV.entry && SV.entry.edit){
    try{
      await api(`/cases/${encodeURIComponent(WS_CASE)}/activity/${SV.entry.edit}`, {method:"POST", body:{
        description: $("sv_desc").value,
        location: $("sv_loc") ? $("sv_loc").value : "",
        vehicle: $("sv_veh") ? $("sv_veh").value : "",
        internal_note: $("sv_note") ? $("sv_note").value : "",
      }});
      SV.entry = null; SV.tab = "timeline";
    }catch(e){ SV.err = e.message; }
    return svReload();
  }
  const now = new Date();
  const body = oneTap ? {
    kind: "activity", description: oneTap,
    at_date: ymdLocal(now), at_time: now.toTimeString().slice(0,5),
  } : {
    kind: "activity",
    /* The date that goes with THIS time, not the date it happens to be when
       the button is finally tapped. `sv_time` was stamped when the entry was
       started; taking the date at submit pairs two different instants, so an
       entry begun at 23:58 and saved at 00:02 filed on the new day carrying
       the old day's time — and the timeline orders by at_date then at_time, so
       it sorted ahead of everything that really came before it. Making both
       halves local was not enough; they have to be the SAME moment. The
       fallback covers an entry restored without a stamp. */
    at_date: SV.entry.date || ymdLocal(),
    at_time: $("sv_time").value,
    description: $("sv_desc").value,
    location: $("sv_loc") ? $("sv_loc").value : "",
    vehicle: $("sv_veh") ? $("sv_veh").value : "",
    internal_note: $("sv_note") ? $("sv_note").value : "",
    subject_documented: $("sv_sd") ? $("sv_sd").checked : false,
    photo_acquired: $("sv_pa") ? $("sv_pa").checked : false,
    video_acquired: $("sv_va") ? $("sv_va").checked : false,
  };
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/activity`, {method:"POST", body});
    SV.entry = null;
    SV.ok = "✓ Activity saved.";
  }catch(e){ SV.err = e.message; }
  await svReload();
}

/* Photo and video (P10/P11): the phone's own picker, straight to the same
   evidence route. Classification is not offered — field uploads land as
   needs_review and the office decides delivery, which is the existing rule. */
function svPickFile(kind){
  SV.err = ""; SV.ok = "";
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = kind === "photo" ? "image/*" : "video/*";
  if(kind === "photo") inp.capture = "environment";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fd = new FormData();
    fd.append("file", f);
    // Ride with the moment it documents when there is one.
    const last = ((WS && WS.activity) || [])[0];
    if(last) fd.append("entry_id", String(last.id));
    SV.ok = "Uploading…"; paint();
    try{
      const res = await fetch(`/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence`,
        {method:"POST", credentials:"same-origin", body: fd});
      const d = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(d.error || ("Upload failed (" + res.status + ")"));
      SV.ok = `${kind === "photo" ? "Photo" : "Video"} stored${last ? " with the last entry" : ""}.`;
    }catch(e){ SV.err = e.message; SV.ok = ""; }
    await svReload();
  };
  inp.click();
}

/* Voice, level 2 (P8). The transcript is shown and never auto-submitted. */
function svMic(){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec){ SV.err = "This browser has no speech recognition — the keyboard's dictation works in every field."; return paint(); }
  if(SV.listening && SV._rec){ try{ SV._rec.stop(); }catch{} return; }
  const r = new Rec();
  r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 1;
  r.onresult = ev => {
    const said = [...ev.results].map(x => x[0].transcript).join(" ").trim();
    SV.heard = said; SV.listening = false; paint();
  };
  r.onerror = ev => { SV.listening = false; SV.err = "Speech input stopped: " + (ev.error || "unknown"); paint(); };
  r.onend = () => { if(SV.listening){ SV.listening = false; paint(); } };
  SV._rec = r; SV.listening = true; SV.err = ""; paint();
  try{ r.start(); }catch(e){ SV.listening = false; SV.err = e.message; paint(); }
}

/* Manual intake (P17): one POST, then either straight into the case or back
   to the leads desk with the number in hand. */
async function submitManualIntake(openAfter){
  const g = id => { const el2 = $(id); return el2 ? el2.value : ""; };
  const body = {
    kind: NL.kind,
    carrier: g("nl_carrier"), client_name: g("nl_client"),
    client_email: g("nl_email"), client_phone: g("nl_phone"),
    claim_number: g("nl_claim"), policy_number: g("nl_policy"),
    subject_name: g("nl_subject"), objective: g("nl_obj"),
    timeline: g("nl_deadline"), notes: g("nl_notes"),
    service: NL.kind === "claims" ? "Insurance claim assignment" : g("nl_service"),
  };
  try{
    const r = await api("/intakes", {method: "POST", body});
    NL = null;
    if(openAfter){ await render(); return openCase(r.case_no); }
    LEAD_MSG = `Saved as ${r.case_no}. It waits under New until you accept it.`;
    TAB = "leads";
    await render();
  }catch(e){ NL.err = e.message; paint(); }
}

/* --------------------------------------------------------- event routing */
/* One delegated listener. Nothing user-supplied is ever written into an
   inline handler, where the browser would decode it back into script. */

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act === "backToCases"){ VIEW = "list"; render(); }
  else if(act === "navToggle"){ document.body.classList.toggle("navopen"); }
  else if(act === "pkgJump"){ openCase(el.dataset.case, el.dataset.tab === "overview" ? undefined : el.dataset.tab); }
  /* The top-level door into the field view (owner, 2026-08-14). It used to
     exist ONLY inside a case's Overview tab, so on an iPad you had to open
     Cases, open a case and land on Overview before there was any way in —
     and the only other door was ?surveillance=1, which assumes the icon is
     already on the home screen. This is the same launcher that URL opens. */
  else if(act === "surveillance"){
    document.body.classList.remove("navopen");
    openSurveillanceLauncher();
  }
  else if(act === "tab"){
    if(TAB === "leads" && el.dataset.tab !== "leads") LEAD_MSG = "";
    TAB = el.dataset.tab; paint();
    if(TAB === "calendar") loadCalendar(CAL ? CAL.month : "");
    if(TAB === "invoices"){ INV_OPEN = null; INV_MSG = ""; loadInvoices(); }
    if(TAB === "dashboard"){ PKGS = null; loadPackages(); }
    // Arriving at Settings is a fresh start: drafts are for recovering from a
    // refusal in front of you, not for surviving a trip around the portal.
    if(TAB === "settings" && ME.role === "admin"){
      PAY_MSG = ""; PAY_ERR = false; PAY_DRAFT = {}; loadPaymentMethods();
    }
    document.body.classList.remove("navopen");
    if(TAB === "myreports") api("/my/reports").then(d => { MY_REPORTS = d; paint(); }).catch(()=>{});
    if(TAB === "myexpenses"){
      api("/my/expenses").then(d => { MY_EXPENSES = d; paint(); }).catch(()=>{});
      api("/my/comp").then(d => { MY_COMP = d; paint(); }).catch(()=>{});
    }
  }
  else if(act === "openCaseTab"){ openCase(el.dataset.case, el.dataset.tab); }
  else if(act === "paySave"){ savePaymentMethod(el.dataset.id, el.dataset.on === "1"); }
  else if(act === "showExample"){ SHOW_EXAMPLE = true; if(TAB === "settings") TAB = "cases"; paint(); }
  else if(act === "hideExample"){ SHOW_EXAMPLE = false; paint(); }
  else if(act === "logout"){ doLogout(); }
  else if(act === "openCase"){ openCase(el.dataset.case); }
  else if(act === "saveCase"){ saveCase(el.dataset.case); }
  else if(act === "toggleActive"){ toggleActive(Number(el.dataset.id), Number(el.dataset.active)); }
  else if(act === "revokeInvite"){ revokeInvite(Number(el.dataset.id)); }
  else if(act === "reload"){ render(); }
  else if(act === "cardFilter"){
    const label = el.dataset.label;
    CARD_FILTER = CARD_FILTER && CARD_FILTER.label === label
      ? null   // clicking the active card clears it
      : { label, set: new Set(el.dataset.set.split(",").filter(Boolean)) };
    paint();
  }
  else if(act === "clearCardFilter"){ CARD_FILTER = null; paint(); }
  else if(act === "caseView"){
    CASE_VIEW = el.dataset.v;
    if(CASE_VIEW === "completed"){
      // Fetched on every turn of the lens, so the desk is never stale after
      // a case was closed in another tab — and errors show, not vanish.
      COMPLETED = null; paint();
      api("/completed").then(d => { COMPLETED = d; paint(); })
        .catch(e => { COMPLETED = {completed: [], error: e.message}; paint(); });
    } else paint();
  }
  else if(act === "addDemo"){ addDemoCase(); }
  else if(act === "clearDemo"){ clearDemoCases(); }
  else if(act === "wsTab"){ if(WS_TAB !== el.dataset.tab){ WS_NOTICE = ""; ACT_MODAL = null; }
    WS_TAB = el.dataset.tab; WS_ERR = "";
    if(WS_TAB === "package"){ PKG = null; loadPackage(); } else paintCase(); }
  else if(act === "wsSec"){
    // A section opens on its first panel; WS_TAB stays the only routing state.
    const sec = wsSections().find(x => x[0] === el.dataset.sec);
    if(sec){ if(WS_TAB !== sec[2][0][0]){ WS_NOTICE = ""; ACT_MODAL = null; }
      WS_TAB = sec[2][0][0]; WS_ERR = "";
      if(WS_TAB === "package"){ PKG = null; loadPackage(); } else paintCase(); } }
  else if(act === "qkind"){ QKIND = el.dataset.k; WS_ERR = ""; paintCase(); }
  else if(act === "actOpen"){ WS_ERR = "";
    ACT_MODAL = {tab:"quick", cat: favLines().length ? "fav" : "arrival", search:"", pick:null, edit:null};
    paintCase(); }
  else if(act === "actClose"){ ACT_MODAL = null; WS_ERR = ""; paintCase(); }
  else if(act === "actTab"){ if(ACT_MODAL){ ACT_MODAL.tab = el.dataset.t; WS_ERR = ""; paintCase(); } }
  else if(act === "actCat"){ if(ACT_MODAL){ ACT_MODAL.cat = el.dataset.c; paintCase(); } }
  else if(act === "actStar"){ favToggle(el.dataset.line); paintCase(); }
  else if(act === "actPick"){
    if(el.dataset.line === NO_CHANGE_LINE){ quickAddEntry(el.dataset.line); }   // one tap (P9)
    else if(ACT_MODAL){ ACT_MODAL.pick = el.dataset.line; ACT_MODAL.dirty = false; WS_ERR = ""; paintCase(); } }
  else if(act === "actBack"){ if(ACT_MODAL){ ACT_MODAL.pick = null; WS_ERR = ""; paintCase(); } }
  else if(act === "actEdit"){
    const entry = ((WS && WS.activity) || []).find(x => x.id === Number(el.dataset.id));
    if(entry){ WS_ERR = "";
      ACT_MODAL = {tab:"quick", pick:"", edit: entry.id,
        pre:{description: entry.description, location: entry.location,
             vehicle: entry.vehicle, internal_note: entry.internal_note}};
      paintCase(); } }
  else if(act === "actDelete"){
    if(confirm("Remove this entry from the timeline?\n\nIt stops appearing in the report. The record that it was removed, and by whom, stays — and you can put it back."))
      removeActivityEntry(Number(el.dataset.id));
  }
  else if(act === "actRestore"){ restoreActivityEntry(Number(el.dataset.id)); }
  else if(act === "subjNew"){ SUBJ_FORM = {mode:"new", pre:{}}; WS_ERR = ""; paintCase(); }
  else if(act === "subjFromIntake"){
    const p = (WS && WS.submission && WS.submission.payload) || {};
    SUBJ_FORM = {mode:"new", pre:{name: p.subject_name || "", addresses: p.subject_address || "",
                                  descriptors: p.subject_description || ""}};
    WS_ERR = ""; paintCase();
  }
  else if(act === "subjEdit"){ SUBJ_FORM = {mode:"edit", id: Number(el.dataset.id)}; WS_ERR = ""; paintCase(); }
  else if(act === "vehAdd"){ SUBJ_FORM = {mode:"veh", sid: Number(el.dataset.sid)}; WS_ERR = ""; paintCase(); }
  else if(act === "vehEdit"){ SUBJ_FORM = {mode:"veh", sid: Number(el.dataset.sid), vid: Number(el.dataset.vid)}; WS_ERR = ""; paintCase(); }
  else if(act === "subjCancel"){ SUBJ_FORM = null; WS_ERR = ""; paintCase(); }
  else if(act === "taskStatus"){ setTaskStat(Number(el.dataset.id), el.dataset.s); }
  else if(act === "closeCase"){ doCloseCase(); }
  else if(act === "invOpen"){ openInvoice(Number(el.dataset.id)); }
  else if(act === "invBack"){ INV_OPEN = null; INV_MSG = ""; loadInvoices(); }
  else if(act === "invStatus"){ setInvStatus(el.dataset.s); }
  else if(act === "invCopy"){ copyInvoiceDetails(); }
  else if(act === "invPrint"){
    document.body.classList.add("printing-invoice");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-invoice"), 400);
  }
  else if(act === "invAddLine"){
    INV_OPEN.lines = invLinesFromDom().concat([{description: "", qty: "", rate: "", amount: ""}]);
    paint();
  }
  else if(act === "invDelLine"){
    const lines = invLinesFromDom(); lines.splice(Number(el.dataset.i), 1);
    INV_OPEN.lines = lines; paint();
  }
  else if(act === "invSaveLines"){ saveInvoiceLines(); }
  else if(act === "evDelete"){ deleteEvidenceRow(Number(el.dataset.id)); }
  else if(act === "pkgStart"){ pkgApi(`/cases/${encodeURIComponent(WS_CASE)}/build`); }
  else if(act === "pkgAdd"){ pkgApi(`/build/${PKG.build.id}/items`, {evidence_id: Number(el.dataset.id)}); }
  else if(act === "pkgRemove"){ pkgApi(`/build/${PKG.build.id}/items/${el.dataset.id}/remove`); }
  else if(act === "pkgRepAdd"){ pkgApi(`/build/${PKG.build.id}/reports`, {report_id: Number(el.dataset.id)}); }
  else if(act === "pkgRepRemove"){ pkgApi(`/build/${PKG.build.id}/reports/${el.dataset.id}/remove`); }
  else if(act === "pkgFinalize"){ pkgApi(`/build/${PKG.build.id}/finalize`); }
  else if(act === "pkgReopen"){ pkgApi(`/build/${PKG.build.id}/reopen`); }
  else if(act === "pkgDelivered"){ pkgApi(`/build/${PKG.build.id}/delivered`); }
  else if(act === "pkgPrint"){ pkgPrint(); }
  else if(act === "createInvoice"){ createInvoiceFor(el.dataset.case, false); }
  else if(act === "createInvoiceAuth"){ createInvoiceFor(el.dataset.case, true); }
  else if(act === "openReport"){
    WS_REPORT = WS_REPORT === Number(el.dataset.id) ? null : Number(el.dataset.id);
    REP_VIEW = "preview"; WS_ERR = ""; paintCase();
  }
  else if(act === "repView"){
    REP_VIEW = el.dataset.v; WS_ERR = "";
    // Versions load on first look, then stay.
    if(REP_VIEW === "versions" && WS_REPORT && !REP_VERS[WS_REPORT]) loadReportVersions(WS_REPORT);
    else paintCase();
  }
  else if(act === "repPrint"){
    document.body.classList.add("printing-report");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-report"), 400);
  }
  /* ---- Active Surveillance Mode ---- */
  else if(act === "svEnter"){ enterSurveillance(el.dataset.case || WS_CASE); }
  else if(act === "svLeaveLauncher"){ SV = null; document.body.classList.remove("surv"); render(); }
  else if(act === "svExit"){ exitSurveillance(); }
  else if(act === "svTab"){ SV.tab = el.dataset.t; SV.err = ""; if(el.dataset.t !== "activity") SV.ok = ""; paint(); }
  else if(act === "svCat"){ SV.cat = el.dataset.c; SV.search = ""; paint(); }
  else if(act === "svPick"){
    const line = el.dataset.line;
    if(!line){ SV.entry = null; SV.err = ""; paint(); }
    else if(line === NO_CHANGE_LINE){ svSaveEntry(line); }          // one tap
    else { SV.entry = {text: line, pick: line, ...stampNow()};
           SV.dirty = false; SV.ok = ""; SV.err = ""; paint(); }
  }
  else if(act === "svAddAnother"){ SV.ok = ""; SV.entry = null; paint(); }
  else if(act === "svStartDay"){ svStartDay(); }
  else if(act === "svEndDay"){ svEndDay(); }
  else if(act === "svPause"){ svPauseDay(); }
  else if(act === "svResume"){ svResumeDay(); }
  else if(act === "svSaveEntry"){ svSaveEntry(null); }
  else if(act === "svPhoto"){ svPickFile("photo"); }
  else if(act === "svVideo"){ svPickFile("video"); }
  else if(act === "svNote"){
    // A note is an activity entry the office reads and the client never does.
    SV.tab = "activity";
    SV.entry = {text: "", ...stampNow(), note: true};
    SV.ok = ""; SV.err = ""; paint();
  }
  else if(act === "svEdit"){
    const e2 = ((WS && WS.activity) || []).find(x => x.id === Number(el.dataset.id));
    if(e2){ SV.tab = "activity"; SV.err = ""; SV.ok = "";
      SV.entry = {edit: e2.id, text: e2.description, time: e2.at_time,
                  loc: e2.location, veh: e2.vehicle, note: e2.internal_note};
      paint(); } }
  else if(act === "svDelete"){
    if(confirm("Remove this entry from the timeline?\n\nIt stops appearing in the report, and the office can still see that it was removed and put it back."))
      svDeleteEntry(Number(el.dataset.id));
  }
  else if(act === "svRestore"){ svRestoreEntry(Number(el.dataset.id)); }
  else if(act === "svEvDelete"){
    if(confirm("Remove this file?\n\nThe record that it existed stays with the office."))
      svDeleteEvidence(Number(el.dataset.id));
  }
  else if(act === "svEvNote"){ svCaptionEvidence(Number(el.dataset.id)); }
  else if(act === "svMic"){ svMic(); }
  else if(act === "svNoMic"){
    SV.err = "This browser has no in-app speech recognition. Your keyboard's own dictation works in every field here.";
    paint();
  }
  else if(act === "svUseText"){
    const t = $("sv_heard") ? $("sv_heard").value : "";
    SV.heard = null; SV.tab = "activity";
    SV.entry = {text: t, ...stampNow()};
    paint();
  }
  else if(act === "svDiscard"){ SV.heard = null; paint(); }
  else if(act === "svFullReport"){ exitSurveillance(); WS_TAB = "reports"; paintCase(); }
  else if(act === "evTab"){ EV_TAB = el.dataset.t; paintCase(); }
  else if(act === "evJump"){ EV_TAB = el.dataset.t || "all"; WS_TAB = "evidence"; WS_ERR = ""; paintCase(); }
  else if(act === "pkgCopyLink"){
    navigator.clipboard.writeText(el.dataset.url).then(
      () => { el.textContent = "Copied"; setTimeout(() => paintCase(), 900); },
      () => { prompt("Copy the link:", el.dataset.url); });
  }
  else if(act === "saveReport"){ saveReportBody(Number(el.dataset.id)); }
  else if(act === "reportStatus"){ setReportStage(Number(el.dataset.id), el.dataset.to); }
  else if(act === "reviewExpense"){ reviewExpenseEntry(Number(el.dataset.id)); }
  else if(act === "saveUserRates"){ saveUserRates(Number(el.dataset.id)); }
  else if(act === "resetLink"){ requestResetLink(Number(el.dataset.id)); }
  else if(act === "deleteUser"){ deleteUserAccount(Number(el.dataset.id)); }
  else if(act === "copyResetLink"){
    if(RESET_BOX) navigator.clipboard.writeText(RESET_BOX.url).then(() => { el.textContent = "Copied"; });
  }
  else if(act === "acceptOffer"){ respondOffer(Number(el.dataset.id), "accept"); }
  else if(act === "declineOffer"){ respondOffer(Number(el.dataset.id), "decline"); }
  else if(act === "withdrawOffer"){ withdrawOffer(Number(el.dataset.id)); }
  else if(act === "calMonth"){
    const [y, m] = CAL.month.split("-").map(Number);
    const n = new Date(y, m - 1 + Number(el.dataset.d), 1);
    loadCalendar(`${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}`);
  }
  else if(act === "openSheet"){
    OPEN_SHEET = OPEN_SHEET === el.dataset.sheet ? null : el.dataset.sheet;
    SHEET_MSG = ""; SHEET_WIZ = null; paint();
  }
  else if(act === "shWiz"){
    SHEET_WIZ = {sheet: el.dataset.sheet, step: 1, to: "", caseNo: "", note: "", include: true, err: ""};
    SHEET_MSG = ""; paint();
  }
  /* MASTER §5 — the same wizard, opened FROM the lead: the sheet is picked by
     the lead's kind (never by the caller), the address and case number are
     pre-filled, and a successful send stamps the lead server-side. */
  else if(act === "leadSheet"){
    const c = CASES.find(x => x.case_no === el.dataset.case) || {};
    SHEET_WIZ = {sheet: el.dataset.kind === "claims" ? "insurance_assignment" : "private_retainer",
                 step: 1, to: c.client_email || "", caseNo: el.dataset.case, note: "",
                 include: true, err: "", fromLead: true};
    SHEET_MSG = ""; paint();
  }
  else if(act === "leadIntake"){
    const c = CASES.find(x => x.case_no === el.dataset.case) || {};
    LEAD_SEND = {case_no: el.dataset.case, to: c.client_email || "", err: "", busy: false};
    paint();
    const inp = $("ls_to"); if(inp) inp.focus();
  }
  else if(act === "leadIntakeCancel"){ LEAD_SEND = null; paint(); }
  else if(act === "leadIntakeSend"){ sendLeadIntakeMail(el.dataset.case); }
  else if(act === "wizClose"){ SHEET_WIZ = null; paint(); }
  else if(act === "wizStep"){
    wizCollect();
    const s2 = Number(el.dataset.s);
    if(s2 > 1 && !SHEET_WIZ.to){ SHEET_WIZ.err = "Enter the address to send it to."; paint(); }
    else { SHEET_WIZ.err = ""; SHEET_WIZ.step = s2; paint(); }
  }
  else if(act === "wizSend"){ wizSend(); }
  else if(act === "nlKind"){ NL = {kind: el.dataset.k, err: ""}; paint(); }
  else if(act === "nlBack"){ NL = {kind: null, err: ""}; paint(); }
  else if(act === "nlSave"){ submitManualIntake(el.dataset.open === "1"); }
  else if(act === "copyLink"){
    navigator.clipboard.writeText(LAST_LINK).then(() => { el.textContent = "Copied"; });
  }
  else if(act === "mailLink"){
    ev.preventDefault();
    const subject = encodeURIComponent("Your Always Precise case portal login");
    const body = encodeURIComponent(
      "You have been given access to the Always Precise Investigations case portal.\n\n" +
      "Open this link to choose your password:\n" + LAST_LINK +
      "\n\nThe link works once and expires in 7 days.");
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  }
});

document.addEventListener("submit", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  ev.preventDefault();
  const a = el.dataset.act;
  if(a === "login") doLogin();
  else if(a === "invite") doInvite();
  else if(a === "accept") doAccept(new URLSearchParams(location.search).get("invite") || "");
  else if(a === "resetAccept") doResetAccept(new URLSearchParams(location.search).get("reset") || "");
  else if(a === "addActivity") addActivityEntry();
  else if(a === "quickAdd") quickAddEntry(null);
  else if(a === "startDay") startInvestigationDay();
  else if(a === "endDay") endInvestigationDay();
  else if(a === "saveMeta") saveCaseMeta();
  else if(a === "genReport") generateReportDraft();
  else if(a === "addExpense") addExpenseEntry();
  else if(a === "addNote") addNoteEntry();
  else if(a === "addComm") addCommEntry();
  else if(a === "addTask") addTaskEntry();
  else if(a === "saveClosure") saveClosureTicks();
  else if(a === "invSave") saveInvoiceFields();
  else if(a === "invBillSave") saveInvBill();
  else if(a === "invPay") recordInvPayment();
  else if(a === "evUpload") uploadEvidenceFile();
  else if(a === "makeOffer") makeCaseOffer();
  else if(a === "saveDetails") saveCaseDetails();
  else if(a === "saveSubject") saveSubjectRec(el.dataset.id ? Number(el.dataset.id) : null);
  else if(a === "saveVehicle") saveVehicleRec(Number(el.dataset.sid), el.dataset.vid ? Number(el.dataset.vid) : null);
});

document.addEventListener("input", ev => {
  const din = ev.target.dataset ? ev.target.dataset.actInput : "";
  if(din === "svSearch" && SV){ SV.search = ev.target.value; paint();
    const q = $("sv_q"); if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } return; }
  if(din === "svDirty" && SV){ SV.dirty = true; return; }
  if(din === "svArrival" && SV && !SV.dirty){
    // The same generator the desk sheet uses, so a line composed in the car and
    // the same line composed at the office cannot read differently.
    const d = $("sv_desc");
    if(d) d.value = arrivalSentence(
      $("sv_vp") ? $("sv_vp").value : "",
      $("sv_view") ? $("sv_view").value : "",
      $("sv_place") ? $("sv_place").value : "",
      $("sv_pos") ? $("sv_pos").value : "");
    return;
  }
  if(din === "amSearch" && ACT_MODAL){ ACT_MODAL.search = ev.target.value; paintCase(); return; }
  if(din === "amDirty" && ACT_MODAL){ ACT_MODAL.dirty = true; return; }
  if(din === "amArrival" && ACT_MODAL && !ACT_MODAL.dirty){
    // The arrival template (P9): the extras generate the sentence — until the
    // narrative is hand-edited, which makes the hand the author.
    if($("qa_desc")) $("qa_desc").value = arrivalSentence(
      $("qa_vp") ? $("qa_vp").value : "",
      $("qa_view") ? $("qa_view").value : "",
      $("qa_place") ? $("qa_place").value : "",
      $("qa_pos") ? $("qa_pos").value : "");
    return;
  }
  if(ev.target.dataset && ev.target.dataset.act === "filter"){ FILTER = ev.target.value; paint(); }
  if(ev.target.dataset && ev.target.dataset.act === "invFilterStatus"){ INV_FILTER.status = ev.target.value; loadInvoices(); }
  if(ev.target.dataset && ev.target.dataset.act === "invFilterType"){ INV_FILTER.type = ev.target.value; loadInvoices(); }
  if(ev.target.dataset && ev.target.dataset.act === "invFilterQ"){ INV_FILTER.q = ev.target.value; loadInvoices(); }
  if(ev.target.dataset && ev.target.dataset.act === "evClass"){ setEvidenceClass(Number(ev.target.dataset.id), ev.target.value); }
  if(ev.target.dataset && ev.target.dataset.act === "pkgType"){ pkgApi(`/build/${PKG.build.id}/package`, {package_type: ev.target.value}); }
  if(ev.target.dataset && ev.target.dataset.act === "leadStatus"){
    const caseNo = ev.target.dataset.case, v = ev.target.value;
    api(`/leads/${encodeURIComponent(caseNo)}/status`, {method:"POST", body:{status: v}})
      .then(() => { const c = CASES.find(x => x.case_no === caseNo); if(c) c.lead_status = v;
                    LEAD_MSG = `${caseNo} — ${LEAD_LABEL[v] || v}.`; paint(); })
      .catch(e => { LEAD_MSG = e.message; paint(); });
  }
  // Saves on blur, so the admin can write the paragraph without a repaint
  // pulling the cursor out from under them mid-sentence.
  if(ev.target.dataset && ev.target.dataset.act === "pkgSummary"){ pkgApi(`/build/${PKG.build.id}/summary`, {body: ev.target.value}); }
});

/* ------------------------------------------------------------------- boot */

(async function boot(){
  const rtoken = new URLSearchParams(location.search).get("reset");
  if(rtoken){
    try{ app.innerHTML = resetView(await api("/reset/" + encodeURIComponent(rtoken))); }
    catch(e){ app.innerHTML = resetView({error: e.message}); }
    return;
  }
  const token = new URLSearchParams(location.search).get("invite");
  if(token){
    try{
      const s = await api("/invite/" + encodeURIComponent(token));
      app.innerHTML = inviteView(s);
    }catch(e){
      app.innerHTML = inviteView({error: e.message});
    }
    return;
  }
  try{
    ME = (await api("/auth/me")).user;   // resume an existing session
    /* Launched from the home screen (SURVEILLANCE P16): go straight to the
       field launcher — resume a running day, or list what could start one.
       Signing in first still lands here, because the flag survives the load. */
    if(new URLSearchParams(location.search).get("surveillance")){
      await openSurveillanceLauncher();
      return;
    }
    await render();
  }catch{ paint(); }
})();
</script>
