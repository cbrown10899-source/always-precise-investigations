<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Portal — Always Precise</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1a2c">
<link rel="icon" href="/assets/logo-white.webp">
<style>
  :root{
    --navy:#0e1a2c; --navy-2:#13273f; --teal:#2f7d90; --teal-2:#3d97ad;
    --gold:#c99a3b; --ink:#1c2531; --muted:#5c6775; --line:#dfe3e8;
    --paper:#f4f5f7; --card:#fff; --good:#1c8a4d; --bad:#c14133; --warn:#a86a12;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}

  .top{background:var(--navy);color:#fff;padding:14px 20px;}
  .top .wrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .top .name{font-weight:700;letter-spacing:.03em;line-height:1.15;}
  .top .name span{display:block;font-weight:400;font-size:.72rem;color:#9db2c9;letter-spacing:.05em;}
  .top .who{margin-left:auto;font-size:.82rem;color:#cfe0f0;text-align:right;}
  .top .who b{display:block;color:#fff;}
  .top button{font:inherit;font-size:.82rem;background:transparent;border:1px solid #3c5878;color:#cfe0f0;border-radius:6px;padding:6px 12px;cursor:pointer;margin-left:12px;}
  .top button:hover{background:#1c3552;}

  main{max-width:1180px;margin:0 auto;padding:22px 16px 70px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{font:inherit;font-size:.9rem;font-weight:600;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--teal-2);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(16,29,51,.05);}
  .card.narrow{max-width:430px;margin:8vh auto 0;}
  h1{font-size:1.28rem;margin-bottom:4px;}
  h2{font-size:1.05rem;margin-bottom:12px;}
  .lead{color:var(--muted);font-size:.92rem;margin-bottom:18px;}
  label.f{display:block;margin-bottom:14px;}
  label.f > span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;}
  input,select,textarea{width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  input:focus,select:focus{outline:2px solid var(--teal-2);border-color:var(--teal-2);}
  .btn{font:inherit;font-size:.95rem;font-weight:700;border:0;border-radius:8px;padding:11px 20px;cursor:pointer;background:var(--teal);color:#fff;}
  .btn:hover{background:var(--teal-2);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn.sm{font-size:.82rem;padding:7px 13px;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn.danger{background:var(--bad);}
  .err{color:var(--bad);font-size:.86rem;margin-top:10px;min-height:1em;}
  .okmsg{color:var(--good);font-size:.86rem;margin-top:10px;min-height:1em;}

  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .bar input{max-width:280px;}
  .count{color:var(--muted);font-size:.86rem;margin-left:auto;}
  .note{background:#fdf7ec;border:1px solid #f0dcb6;color:#7a5a12;border-radius:8px;padding:10px 13px;font-size:.86rem;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;}
  tbody tr.click{cursor:pointer;}
  tbody tr.click:hover{background:#f7fafb;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;color:var(--teal);}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;}
  .tag.claims{background:#eaf4f7;color:#1f5c6d;}
  .tag.consumer{background:#f0eee9;color:#6b5a33;}
  .tag.new{background:#fdf1e3;color:var(--warn);}
  .tag.assigned{background:#eaf4f7;color:#1f5c6d;}
  .tag.in_progress{background:#e8f1fb;color:#1e4f8a;}
  .tag.closed{background:#e9f7ef;color:var(--good);}
  .empty{color:var(--muted);padding:26px 4px;font-size:.92rem;}

  /* dashboard strip */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .stat.warn{border-color:#e8cf9e;background:#fdf9f1;}
  .stat-n{font-size:1.7rem;font-weight:800;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums;}
  .stat.warn .stat-n{color:#8a6410;}
  .stat-l{font-size:.82rem;font-weight:700;margin-top:2px;}
  .stat-h{font-size:.75rem;color:var(--muted);margin-top:1px;}
  .stat.live{border-color:#9fd3c0;background:#f0faf6;}
  .stat.live .stat-n{color:#1a6b3c;}
  .stat.click{cursor:pointer;}
  .stat.click:hover{border-color:var(--teal);}
  .stat.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:#f2f9fa;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#eaf5f7;border:1px solid #b7dbe3;
    color:var(--navy);border-radius:999px;padding:3px 6px 3px 11px;font-size:.8rem;font-weight:700;}
  .chip button{border:0;background:none;font:inherit;font-size:1rem;cursor:pointer;color:var(--teal-ink,#1d5c6c);line-height:1;}
  /* rate sheets */
  .sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px;}
  .sheet-card{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:15px 16px;cursor:pointer;font:inherit;color:inherit;display:block;width:100%;}
  .sheet-card:hover{border-color:var(--teal);}
  .sheet-card.on{border-color:var(--teal);background:#f2f9fa;box-shadow:0 0 0 1px var(--teal) inset;}
  .sheet-n{font-weight:800;font-size:1.05rem;color:var(--navy);}
  .sheet-a{font-size:.78rem;color:var(--muted);margin:2px 0 8px;}
  .sheet-s{font-size:.88rem;}
  .sheet-go{margin-top:10px;font-size:.78rem;font-weight:700;color:var(--teal);}
  .sheet-note{font-size:.8rem;color:var(--muted);font-weight:400;max-width:46ch;}
  .loaderr{background:#fdecea;border:1px solid #f5c6c0;color:#8a2318;border-radius:10px;
    padding:12px 14px;margin-bottom:16px;font-size:.9rem;}
  /* case workspace — built to be usable from a phone in a parked car */
  .wstabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);
    margin:0 0 16px;padding-bottom:0;-webkit-overflow-scrolling:touch;}
  .wstabs button{flex:none;font:inherit;font-size:.88rem;font-weight:700;background:none;border:0;
    border-bottom:2px solid transparent;color:var(--muted);padding:9px 12px;cursor:pointer;white-space:nowrap;}
  .wstabs button.on{color:var(--navy);border-bottom-color:var(--teal);}
  .wspanel{min-height:120px;}
  .quick{background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;}
  .quick .btn{width:100%;}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;margin-bottom:12px;}
  .qk{position:relative;}
  .qk input{position:absolute;opacity:0;pointer-events:none;}
  .qk span{display:block;text-align:center;font-size:.8rem;font-weight:700;padding:10px 4px;
    border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
  .qk input:checked + span{border-color:var(--teal);background:#eaf5f7;color:var(--navy);}
  .qk input:focus-visible + span{outline:2px solid var(--teal);}
  .qk2{display:block;width:100%;text-align:center;font:inherit;font-size:.8rem;font-weight:700;
    padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
  .qk2.on{border-color:var(--teal);background:#eaf5f7;color:var(--navy);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-w{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0;}
  .cal-cell{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;overflow:hidden;}
  .cal-pad{background:transparent;border-color:transparent;}
  .cal-today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
  .cal-d{font-size:.72rem;font-weight:700;color:var(--muted);}
  .cal-ev{display:block;font-size:.64rem;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--teal);
    border-radius:4px;padding:2px 5px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-ev.cal-run{background:#1a6b3c;}
  .cal-ev.cal-offer{background:#fff;color:var(--teal);border:1px dashed var(--teal);}
  @media(max-width:640px){.cal-cell{min-height:54px;} .cal-ev{font-size:.58rem;padding:1px 3px;}}
  .comprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 0 8px;}
  .comprow input{width:90px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:6px 8px;}
  .capgrid{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 6px;}
  .cap{display:flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600;cursor:pointer;}
  .cap input{width:17px;height:17px;}
  .tag.cap-sd{background:#dff2e5;color:#1a6b3c;} .tag.cap-va{background:#dcecf2;color:#1d5c6c;}
  .tag.cap-pa{background:#e3d7f5;color:#4a2f77;}
  .opt{font-weight:400;color:var(--muted);font-size:.78rem;}
  .dayon{background:#eaf5f7;border:1px solid #b7dbe3;border-radius:8px;padding:10px 12px;
    font-size:.88rem;margin-bottom:12px;}
  .meter{height:8px;border-radius:999px;background:#dbe6ea;overflow:hidden;margin:8px 0 2px;}
  .meter i{display:block;height:100%;background:var(--teal);}
  .meter.warn i{background:#d19a1f;} .meter.high i{background:#c9711f;} .meter.over i{background:#b23a2c;}
  .warnline{font-size:.85rem;color:#7a5410;background:#fdf7ec;border:1px solid #e8cf9e;
    border-radius:8px;padding:8px 10px;margin-top:8px;}
  .warnline.over{color:#8a2318;background:#fdecea;border-color:#f5c6c0;}
  .tl-day{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin:16px 0 6px;}
  .tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);}
  .tl-i{display:flex;gap:10px;padding:8px 0 8px 12px;position:relative;}
  .tl-i::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;
    border-radius:50%;background:var(--teal);}
  .tl-t{flex:none;width:64px;font-family:ui-monospace,monospace;font-size:.82rem;font-weight:700;color:var(--navy);}
  .tl-b{flex:1;min-width:0;}
  .tl-d{font-size:.92rem;}
  .tl-m{font-size:.78rem;color:var(--muted);}
  .tl-n{font-size:.78rem;color:#7a5410;}
  /* reports */
  .rlist{display:grid;gap:8px;margin-top:14px;}
  .rcard{text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;cursor:pointer;width:100%;}
  .rcard:hover{border-color:var(--teal);}
  .rcard.on{border-color:var(--teal);background:#f2f9fa;}
  .rc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rbody{width:100%;font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.86rem;line-height:1.55;border:1px solid var(--line);border-radius:8px;
    padding:12px;background:#fff;resize:vertical;}
  .rbody[readonly]{background:#f4f6f8;color:var(--muted);}
  .ractions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .tag.rs-draft{background:#e6ebf0;color:#42505f;}
  .tag.rs-submitted{background:#dcecf2;color:#1d5c6c;}
  .tag.rs-needs_revision{background:#fdf0da;color:#7a5410;}
  .tag.rs-approved{background:#dff2e5;color:#1a6b3c;}
  .tag.rs-delivered{background:#12305a;color:#fff;}
  @media(max-width:560px){
    .wspanel .two{grid-template-columns:1fr;}
    .tl-t{width:52px;}
    dialog{width:100%;max-width:100%;border-radius:0;margin:0;height:100%;max-height:100%;}
    .dlg{padding:16px;}
  }
  .casepage{max-width:980px;margin:0 auto;}
  .pagebar{margin-bottom:12px;}
  .xrev{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;}
  .xrev label{display:flex;gap:4px;align-items:center;white-space:nowrap;}
  .tag.xr{background:#dff2e5;color:#1a6b3c;} .tag.xb{background:#dcecf2;color:#1d5c6c;}
  .tag.xi{background:#e6ebf0;color:#42505f;}
  .notecard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .notebody{white-space:pre-wrap;font-size:.92rem;margin:6px 0 4px;}
  .tag.nv-admin{background:#fdecea;color:#8a2318;} .tag.nv-team{background:#e6ebf0;color:#42505f;}
  .tag.nv-client{background:#f3e2bd;color:#6b4f12;}
  .ex-note{background:#fdf7ec;border:1px solid #e8cf9e;color:#6b4f12;border-radius:8px;
    padding:11px 14px;font-size:.88rem;margin-bottom:14px;}
  .tag.ex-tag{background:#f3e2bd;color:#6b4f12;margin-left:6px;}
  .tag.demo-tag{background:#e3d7f5;color:#4a2f77;margin-left:6px;}
  tbody tr.ex{background:repeating-linear-gradient(45deg,#fffdf7,#fffdf7 10px,#fdf7ec 10px,#fdf7ec 20px);}
  tbody tr.ex:hover{background:#fdf3e0;}
  tbody tr.ex td:first-child{box-shadow:inset 3px 0 0 #d9b45e;}

  .linkbox{background:#f1f7f9;border:1px solid #cfe6ec;border-radius:8px;padding:12px 14px;margin-top:12px;}
  .linkbox code{display:block;word-break:break-all;font-family:ui-monospace,monospace;font-size:.82rem;color:#14495a;margin-bottom:10px;}

  dialog{border:0;border-radius:12px;padding:0;max-width:760px;width:calc(100% - 32px);box-shadow:0 18px 50px rgba(10,20,32,.34);}
  dialog::backdrop{background:rgba(10,20,32,.55);}
  .dlg{padding:22px;}
  .dlg h2{margin-bottom:2px;}
  .dlg .case{font-family:ui-monospace,monospace;color:var(--teal);font-weight:700;margin-bottom:14px;}
  dl.detail{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:14px 0;font-size:.9rem;}
  dl.detail dt{color:var(--muted);white-space:nowrap;}
  dl.detail dd{word-break:break-word;}
  .sig{max-width:250px;border-bottom:1px solid #c7ccd3;margin-top:4px;}
  .dlg .actions{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:8px;}
  .dlg .actions label.f{margin-bottom:0;min-width:170px;}
  .close{position:absolute;right:14px;top:12px;background:transparent;border:0;font-size:1.5rem;line-height:1;color:var(--muted);cursor:pointer;}
  .rel{position:relative;}
  @media(max-width:760px){
    dl.detail{grid-template-columns:1fr;gap:2px;}
    dl.detail dt{margin-top:8px;}
    th.hide,td.hide{display:none;}
  }
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="10" fill="#13273f"/><path d="M32 12l6 8-6 8-6-8z" fill="#3d97ad"/><path d="M32 30l10 12H22z" fill="#c99a3b"/></svg>
    <div class="name">ALWAYS PRECISE<span>INVESTIGATIONS · CASE PORTAL</span></div>
    <div class="who" id="who" hidden></div>
  </div>
</div>

<main id="app"></main>


<script>
"use strict";

/* The API is mounted on this same domain, at /portal-api/*, by a Cloudflare
   Worker route. It has to be same-origin: a session cookie set by a
   workers.dev hostname would be cross-site and never sent back. */
const API = "/portal-api";

const $ = id => document.getElementById(id);
const app = $("app");
let ME = null, TAB = "cases", CASES = [], USERS = [], INVITES = [], TOTAL = 0, FILTER = "", LAST_LINK = "", LAST_EMAILED = false;
let SUMMARY = null, SHEETS = [], SHEET_MAIL = "", OPEN_SHEET = null, SHEET_MSG = "";
// The open case workspace: which case, which tab, its loaded data, last error.
let WS = null, WS_CASE = null, WS_TAB = "overview", WS_ERR = "", WS_REPORT = null;
let VIEW = "list";   // "list" | "case" — the workspace is a full page, not a popup
let QKIND = "activity";  // which quick-add composer is open on the activity log
let WS_NOTICE = "";      // one-shot "day ended" notice carrying the next step

/* Stock chronology lines, straight from the handoff's examples and the usual
   surveillance phrasing. Picking one fills the description — it stays fully
   editable, this just saves typing the same sentences from a parked car. */
const PHRASES = [
  "Arrived in vicinity of subject residence.",
  "Established stationary surveillance position.",
  "Subject vehicle observed parked at residence.",
  "Subject observed exiting the residence.",
  "Subject departed residence.",
  "Subject arrived at ",
  "Subject departed ",
  "Subject returned to residence.",
  "Lost visual contact with subject vehicle in traffic.",
  "Re-established visual contact with subject.",
  "No activity observed at the residence.",
  "Surveillance discontinued for the day.",
];
let LOAD_ERR = "";        // why the portal could not load, shown rather than hidden
let SCHEMA_MISSING = [];  // tables the database does not have yet
let CARD_FILTER = null;   // {label, set:Set(case numbers)} — a dashboard card's cases
let MY_REPORTS = null, MY_EXPENSES = null, MY_COMP = null, OFFERS = [];   // the investigator's own desk
let CAL = null;   // {month, days, offers}
/* Examples show themselves on a first sign-in and can be recalled later. */
let SHOW_EXAMPLE = false;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function when(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? esc(iso) : d.toLocaleString([], {month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit"});
}
const label = s => ({
  new:"New", assigned:"Assigned", in_progress:"In progress", closed:"Closed",
  activity:"Activity", photo:"Photo", video:"Video", location:"Location",
  vehicle:"Vehicle", note:"Note", mileage:"Mileage", expense:"Expense",
  tolls:"Tolls", parking:"Parking", hotel:"Hotel", airfare:"Airfare", rental:"Rental vehicle",
  records:"Records", database:"Database", equipment:"Equipment", meals:"Meals", other:"Other",
  investigator:"Investigator", admin:"Admin", client_comm:"Client communication",
  strategy:"Strategy", subject:"Subject", evidence:"Evidence", billing:"Billing",
}[s] || s);

/* Only ever render an image the browser will treat as image data. Anything
   else in that field came from a public form and is not to be trusted. */
/* Times are entered 24-hour by the clock widget and read 12-hour by people;
   the reports already write 12-hour, so the timeline matches them. */
function t12(hhmm){
  const h = parseInt(String(hhmm).slice(0,2), 10), m = String(hhmm).slice(3,5);
  if(!Number.isFinite(h)) return String(hhmm || "");
  return `${h % 12 === 0 ? 12 : h % 12}:${m} ${h < 12 ? "AM" : "PM"}`;
}
function fmtDay(d){
  const t = new Date(String(d) + "T00:00:00");   // local midnight — no timezone drift
  return isNaN(t) ? String(d) : t.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"});
}

function safeImage(src){
  return typeof src === "string" && /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(src) ? src : "";
}


/* ------------------------------------------------------------- examples */
/* Two worked cases so a new sign-in shows the real layout instead of an empty
   table. They live here and nowhere else: never fetched, never stored, never
   written to the database. Every case number starts with EXAMPLE- and the
   router only accepts [A-Za-z0-9-], so one could never collide with a real
   case even if it somehow reached the API.

   The data is realistic on purpose — a layout demonstrated with "Lorem ipsum"
   teaches nobody where the claim number goes. The names and numbers are
   invented. */

/* An investigator's copy of a case has the client stripped out of it by the
   Worker before it is sent — carrier, adjuster, claim and policy numbers,
   defense counsel, billing and the signature never arrive. The example has to
   be redacted the same way or it would promise a view that does not exist.

   This list mirrors FIELD_KEEP in case-portal/worker.js. The Worker is what
   enforces it; this only keeps the example honest. A test compares the two so
   they cannot drift apart. */
const FIELD_KEEP = [
  "subject_name", "subject_address", "subject_description", "subject_relationship",
  "objective", "authorized_hours", "timeline", "notes", "attachments",
  "claim_type", "date_of_loss", "prior_surveillance",
  "start_date", "permitted_days", "permitted_times", "weekend_authorized",
  "priority", "geographic_limits",
];

function redactExample(c) {
  const kept = {};
  for (const k of FIELD_KEEP) if (c.payload[k] !== undefined) kept[k] = c.payload[k];
  return { ...c, carrier: null, claim_number: null, client_name: null, payload: kept };
}

/* An investigator only ever has cases assigned to them, so they see the claim
   example and not the unassigned intake — redacted, as a real one would be. */
function examplesFor(role) {
  return role === "admin"
    ? EXAMPLE_CASES
    : EXAMPLE_CASES.filter(c => c.kind === "claims").map(redactExample);
}
function isExample(caseNo) { return String(caseNo || "").startsWith("EXAMPLE-"); }
/* A real database row, but invented — badged everywhere so it can never be
   mistaken for a client's case. The prefix is what the clear route deletes on,
   so nothing without it is ever at risk. */
function isDemo(caseNo) { return String(caseNo || "").startsWith("TEST-"); }

async function api(path, opts = {}){
  const res = await fetch(API + path, {
    credentials: "same-origin",
    headers: opts.body ? {"Content-Type":"application/json"} : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if(res.status === 401 && ME){ ME = null; paint(); throw new Error("Your session ended. Please sign in again."); }
  if(!res.ok) throw new Error(data.error || "That did not work. Please try again.");
  return data;
}

/* The dashboard strip answers one question: what needs my attention today?
   Every card that can act carries the case numbers behind its count, so
   clicking it shows exactly those cases instead of leaving a number to go
   hunting after. Cards whose data does not exist yet — client responses,
   expenses, closure — arrive with their features rather than sitting at a
   fake zero. Drawn even when the portal is empty, because a page that shows
   nothing at all looks broken. */
function summaryCards(){
  if(TAB !== "cases" && TAB !== "today") return "";   // calendar included in the exclusion
  const s = SUMMARY || {};
  const shown = SHOW_EXAMPLE ? examplesFor(ME.role) : [];
  const admin = ME.role === "admin";

  const card = (label, n, hint, tone, set) => {
    const act = set && n > 0;
    const on = act && CARD_FILTER && CARD_FILTER.label === label;
    return `<div class="stat ${tone||""}${act ? " click" : ""}${on ? " on" : ""}"${
        act ? ` data-act="cardFilter" data-label="${esc(label)}" data-set="${esc(set.join(","))}"` : ""}>
      <div class="stat-n">${n}</div>
      <div class="stat-l">${esc(label)}</div>
      ${hint ? `<div class="stat-h">${esc(hint)}</div>` : ""}
    </div>`;
  };

  const active = s.active_now || [], due = s.reports_due || [], low = s.auth_low || [];
  const late = s.tasks_overdue || [];
  const total = (s.total || 0) + shown.length;

  const cards = admin
    ? card("Open cases", (s.open || 0) + shown.length, total ? "" : "None yet")
      + card("Needs assignment", (s.unassigned || 0) + shown.filter(c => !c.assigned_name).length,
             "Waiting on you", (s.unassigned || 0) ? "warn" : "")
      + card("Out now", active.length, "A day is running", active.length ? "live" : "", active)
      + card("Reports due", due.length, "Day done, no report", due.length ? "warn" : "", due)
      + card("Authorization low", low.length,
             s.auth_warn_at ? `Past ${s.auth_warn_at}% of hours` : "Hours running out",
             low.length ? "warn" : "", low)
      + card("Tasks overdue", late.length, "Past their due date", late.length ? "warn" : "", late)
      + card("Expenses to review", (s.expenses_pending || []).length, "Awaiting your call",
             (s.expenses_pending || []).length ? "warn" : "", s.expenses_pending || [])
    : card("Assigned to you", total, total ? "" : "Nothing yet")
      + card("Out now", active.length, "Your day is running", active.length ? "live" : "", active)
      + card("Reports due", due.length, "Finish or fix a report", due.length ? "warn" : "", due)
      + card("Authorization low", low.length, "Call before exceeding", low.length ? "warn" : "", low)
      + card("Tasks overdue", late.length, "Past their due date", late.length ? "warn" : "", late);

  // No Hide button here — the banner over the case list already carries one,
  // and two controls doing the same thing is how a page starts feeling
  // untrustworthy about which one you actually pressed.
  return `<div class="stats">${cards}</div>${
    SHOW_EXAMPLE ? `<div class="ex-note" style="margin-bottom:16px">
      <b>These totals include the example</b> &mdash; they drop back to your real numbers when you hide it.
    </div>` : ""}`;
}

/* The investigator's day, answered directly: am I out now, what is assigned
   to me, what do I owe. Everything here is already scoped by the Worker. */
/* Short labels the way a wall calendar wants them, derived from the case
   type so the list stays configuration-driven. */
function calLabel(t, kind){
  const s = String(t || "");
  if(/surveillance/i.test(s)) return "SURV";
  if(/statement/i.test(s)) return "STATEMENT";
  if(/canvass|field/i.test(s)) return "CANVASS";
  if(/custody/i.test(s)) return "CUSTODY";
  if(/infidelity|adultery/i.test(s)) return "INFIDELITY";
  if(/scene/i.test(s)) return "SCENE";
  if(/background|social/i.test(s)) return "BACKGROUND";
  if(/skip|locate/i.test(s)) return "LOCATE";
  return kind === "claims" ? "INS" : "PRIVATE";
}

function calendarView(){
  if(!CAL) return `<div class="card"><div class="empty">Loading the calendar&hellip;</div></div>`;
  const [y, m] = CAL.month.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const daysIn = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const now = new Date();   // local, like the grid — UTC would drift the ring near midnight
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

  const byDate = {};
  for(const d of CAL.days){
    (byDate[d.day_date] = byDate[d.day_date] || []).push({
      kind: "day", label: calLabel(d.case_type, d.kind), case_no: d.case_no,
      who: d.investigator, running: !d.end_time, hours: d.hours,
    });
  }
  for(const o of CAL.offers){
    (byDate[o.investigation_date] = byDate[o.investigation_date] || []).push({
      kind: "offer", label: calLabel(o.case_type, o.kind), case_no: o.case_no || null,
      who: o.investigator || null, loc: o.general_location,
    });
  }

  let cells = "";
  for(let i = 0; i < lead; i++) cells += `<div class="cal-cell cal-pad"></div>`;
  for(let d = 1; d <= daysIn; d++){
    const iso = `${CAL.month}-${String(d).padStart(2, "0")}`;
    const evs = byDate[iso] || [];
    cells += `<div class="cal-cell${iso === today ? " cal-today" : ""}">
      <div class="cal-d">${d}</div>
      ${evs.map(e => e.kind === "offer"
        ? `<span class="cal-ev cal-offer" ${e.case_no ? `data-act="openCase" data-case="${esc(e.case_no)}"` : `data-act="tab" data-tab="today"`}
             title="Offered${e.loc ? " — " + esc(e.loc) : ""}">◦ ${esc(e.label)}${e.who ? " · " + esc(e.who) : ""}</span>`
        : `<span class="cal-ev${e.running ? " cal-run" : ""}" data-act="openCase" data-case="${esc(e.case_no)}"
             title="${esc(e.case_no)}${e.who ? " — " + esc(e.who) : ""}">${esc(e.label)}${
             ME.role === "admin" && e.who ? " · " + esc(e.who.split(" ")[0]) : ""}${e.hours != null ? ` · ${esc(e.hours)}h` : e.running ? " · out" : ""}</span>`
      ).join("")}
    </div>`;
  }
  const monthName = first.toLocaleDateString(undefined, {month: "long", year: "numeric"});
  return `<div class="card">
    <div class="bar">
      <h2 style="margin:0">Calendar</h2>
      <button class="btn sm ghost" data-act="calMonth" data-d="-1">&larr;</button>
      <b>${esc(monthName)}</b>
      <button class="btn sm ghost" data-act="calMonth" data-d="1">&rarr;</button>
      <span class="count">${ME.role === "admin" ? "every investigator" : "your days and offers"}</span>
    </div>
    <div class="cal-grid">
      ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(w => `<div class="cal-w">${w}</div>`).join("")}
      ${cells}
    </div>
    <p class="hint">Solid chips are investigation days — click one to open the case. Hollow chips are
      pending offers.</p>
  </div>`;
}

function casesView(){
  const q = FILTER.trim().toLowerCase();
  const admin = ME.role === "admin";
  // A card filter narrows to the exact cases behind that card's number; the
  // example never stands in among them, because an alert is real work.
  const base = CARD_FILTER
    ? CASES.filter(c => CARD_FILTER.set.has(c.case_no))
    : (SHOW_EXAMPLE ? CASES.concat(examplesFor(ME.role)) : CASES);
  const shown = base;
  const rows = shown.filter(c => !q || [c.case_no, c.client_name, c.subject_name, c.carrier, c.claim_number]
    .some(v => (v || "").toLowerCase().includes(q)));

  // Case numbers reach this markup from a public form, so they go in a data
  // attribute read by a delegated listener — never interpolated into script.
  //
  // The client/carrier column is admin-only: the Worker does not send those
  // fields to an investigator at all, so there is nothing to put in it.
  const body = rows.map(c => `
    <tr class="click${isExample(c.case_no) ? " ex" : ""}" data-act="openCase" data-case="${esc(c.case_no)}">
      <td class="mono">${esc(c.case_no)}</td>

        isExample(c.case_no) ? '<span class="tag ex-tag">Example</span>' : ""}${
        isDemo(c.case_no) ? '<span class="tag demo-tag">Test</span>' : ""}</td>
      ${admin ? `<td>${esc(c.kind === "claims" ? (c.carrier || "—") : (c.client_name || "—"))}
          ${c.claim_number ? `<div class="mono">${esc(c.claim_number)}</div>` : ""}</td>
      <td class="hide">${esc(c.subject_name || "—")}</td>`

      ${admin ? `<td class="hide">${esc(c.assigned_name || "—")}</td>` : ""}

    ? `<div class="note">Showing the ${CASES.length} most recent of ${TOTAL} cases. Search covers what is loaded.</div>` : "";

  const exBanner = SHOW_EXAMPLE ? `<div class="ex-note">
      <b>The rows marked Example are not real cases.</b> They are here to show the layout &mdash;
      ${ME.role === "admin"
        ? "a carrier assignment and a client intake, with every field filled in."
        : "an assignment exactly as one will look when it is given to you."}
      Open one to see the full detail. Nothing here is stored, and it disappears the moment you hide it.
      <button class="btn sm ghost" data-act="hideExample" style="margin-left:8px">Hide the example</button>
    </div>` : "";

  const filterChip = CARD_FILTER
    ? `<span class="chip">${esc(CARD_FILTER.label)}: ${CARD_FILTER.set.size}
         <button data-act="clearCardFilter" aria-label="Clear filter">&times;</button></span>`
    : "";

  return `<div class="card">
    <div class="bar">
      <h2 style="margin:0">Cases</h2>${filterChip}
      <input id="q" placeholder="${admin ? "Search case, client, carrier, claim no." : "Search case or subject"}" value="${esc(FILTER)}" data-act="filter">
      ${SHOW_EXAMPLE ? "" : `<button class="btn sm ghost" data-act="showExample">Show an example</button>`}
      ${admin ? `<button class="btn sm ghost" data-act="addDemo">Add a test case</button>${
        CASES.some(c => isDemo(c.case_no))
          ? `<button class="btn sm ghost" data-act="clearDemo">Remove test cases</button>` : ""}` : ""}
      <span class="count">${rows.length} of ${shown.length}${
        (s => s && (s.claims || s.consumer)
          ? ` · ${s.claims || 0} carrier · ${s.consumer || 0} private` : "")(SUMMARY)}</span>
    </div>
    ${exBanner}

          // is the sentence that made a real outage look like a quiet week.
          LOAD_ERR ? "The case list did not load, so nothing can be shown here yet."

function paint(){
  if(!ME){ app.innerHTML = loginView(); $("who").hidden = true; return; }
  $("who").hidden = false;
  $("who").innerHTML = `<b>${esc(ME.display_name || ME.username)}</b>${ME.role === "admin" ? "Admin" : "Investigator"}
    <button data-act="logout">Sign out</button>`;
  if(VIEW === "case" && WS_CASE){
    // The workspace takes the whole page. The back button carries the same
    // .close class the dialog's X had, so muscle memory and tests both hold.
    app.innerHTML = `<div class="casepage">
      <div class="pagebar"><button class="btn sm ghost close" data-act="backToCases">&larr; All cases</button></div>
      <div class="card"><div class="dlg" id="dlgBody">${
        isExample(WS_CASE) ? exampleBodyHtml() : caseBodyHtml()}</div></div>
    </div>`;
    return;
  }
  app.innerHTML = shell(
      TAB === "staff" ? staffView()
    : TAB === "sheets" ? sheetsView()
    : TAB === "today" ? todayView()
    : TAB === "calendar" ? calendarView()
    : TAB === "myreports" ? myReportsView()
    : TAB === "myexpenses" ? myExpensesView()
    : casesView());
  const q = $("q");
  if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

/* Loading the portal used to swallow every failure and paint an empty
   dashboard, which looks exactly like a portal with no cases in it. That is the
   worst possible way to fail: a case list that cannot load and a case list with
   nothing in it are not the same thing, and the screen said the same thing for
   both. Each fetch now records why it failed, and the page says so. */
async function render(){
  if(!ME){ paint(); return; }
  LOAD_ERR = "";
  let listed = false;
  try{
    const d = await api("/submissions?limit=200");
    CASES = Array.isArray(d.submissions) ? d.submissions : [];
    TOTAL = d.total || 0;
    listed = true;
  }catch(e){
    CASES = []; TOTAL = 0;
    LOAD_ERR = "The case list could not be loaded — " + e.message;
  }
  // A first sign-in lands on an empty table, which teaches nothing. Show the
  // worked example unasked — but only when the list genuinely loaded and is
  // genuinely empty, never as cover for a failed fetch.
  if(listed && CASES.length === 0) SHOW_EXAMPLE = true;

  if(ME.role !== "admin"){
    try{ OFFERS = (await api("/my/offers")).offers; }catch(e){ OFFERS = []; }
  }
  try{ SUMMARY = (await api("/summary")).summary; }
  catch(e){ SUMMARY = null; if(!LOAD_ERR) LOAD_ERR = "The dashboard totals could not be loaded — " + e.message; }

  // A half-applied schema is the one failure that looks like a dozen different
  // bugs, so ask directly rather than waiting to trip over it.
  try{
    const h = await api("/health");
    SCHEMA_MISSING = Array.isArray(h.missing_tables) ? h.missing_tables : [];
  }catch(e){ SCHEMA_MISSING = []; }

  if(ME.role === "admin"){
    try{ USERS = (await api("/users")).users; }catch(e){ USERS = []; }
    try{ INVITES = (await api("/invites")).invites; }catch(e){ INVITES = []; }
    try{ SHEETS = (await api("/sheets")).sheets; }catch(e){ SHEETS = []; }
  }
  paint();
}

/* --------------------------------------------------------------- actions */

async function doLogin(){
  const btn = $("loginBtn"), err = $("err");
  btn.disabled = true; btn.textContent = "Signing in…"; err.textContent = "";
  try{
    ME = (await api("/auth/login", {method:"POST", body:{username:$("u").value, password:$("p").value}})).user;
    await render();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

async function doAccept(token){
  const btn = $("acceptBtn"), err = $("err");
  err.textContent = "";
  if($("p1").value !== $("p2").value){ err.textContent = "Those passwords do not match."; return; }
  btn.disabled = true; btn.textContent = "Creating…";
  try{
    ME = (await api(`/invite/${token}/accept`, {method:"POST", body:{password:$("p1").value}})).user;
    history.replaceState({}, "", "/portal/");   // keep the token out of the address bar
    await render();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = "Create my account";
  }
}

async function doLogout(){
  try{ await api("/auth/logout", {method:"POST"}); }catch{}
  ME = null; CASES = []; USERS = []; INVITES = []; TAB = "cases"; LAST_LINK = ""; LAST_EMAILED = false; paint();
}

/* The case workspace. A case is not a record to read, it is work in progress,
   so opening one lands on tabs rather than one long detail list. Only the tabs
   that do something today are shown — an empty "Evidence" tab would promise a
   feature that is not there. */
async function openCase(caseNo, tab){
  WS_CASE = caseNo; WS_TAB = tab || "overview"; WS_ERR = ""; SUBJ_FORM = null; VIEW = "case";
  if(isExample(caseNo)){
    WS = null;   // examples are page-held demo data; they have no live workspace
    return paintCase();
  }
  try{
    const [sub, ws] = await Promise.all([
      api("/submissions/" + encodeURIComponent(caseNo)),
      api("/cases/" + encodeURIComponent(caseNo) + "/workspace"),
    ]);
    WS = { ...ws, submission: sub.submission };
  }catch(e){ alert(e.message); return; }
  paintCase();
}

async function reloadWorkspace(){
  if(!WS_CASE || isExample(WS_CASE)) return;
  try{
    const ws = await api("/cases/" + encodeURIComponent(WS_CASE) + "/workspace");
    WS = { ...ws, submission: WS ? WS.submission : null };
  }catch(e){ WS_ERR = e.message; }
  paintCase();
}

function wsTabs(){
  const admin = ME.role === "admin";
  const t = [["overview","Overview"], ["subject","Subject"], ["activity","Activity log"],
             ["field","Field work"], ["reports","Reports"], ["expenses","Expenses"], ["notes","Internal notes"],
             ["comms","Comm log"], ["tasks","Tasks"]];
  // Authorization is the insurance panel; it appears once there is one, and

  if(admin || (WS && WS.authorization && WS.authorization.authorized_hours != null)) t.push(["auth","Authorization"]);
  if(admin) t.push(["assign","Assignment"]);
  return t;
}

    const w = Math.max(0, Math.min(100, pct || 0));
    const tone = level >= 100 ? "over" : level >= 90 ? "high" : level >= 75 ? "warn" : "";
    return `<div class="meter ${tone}"><i style="width:${w}%"></i></div>`;
  };
  const hoursSet = a.authorized_hours != null;
  return `<div class="feebox">
    ${hoursSet ? `
      <div class="row"><span>Authorized</span><b>${esc(a.authorized_hours)} hours</b></div>
      <div class="row"><span>Used</span><b>${esc(a.hours_used)} hours</b></div>
      <div class="row"><span>Remaining</span><b>${esc(a.hours_remaining)} hours</b></div>
      ${bar(a.hours_used, a.authorized_hours, a.percent_used, a.warn_level)}
      ${a.warn_level != null ? `<div class="warnline ${a.warn_level >= 100 ? "over" : ""}">
         ${a.warn_level >= 100
           ? "<b>Authorization is used up.</b> Request more before any further work."
           : `<b>${esc(a.percent_used)}% of the authorization is used.</b> Past the ${esc(a.warn_level)}% mark.`}

          <label class="f"><span>Category</span>
            <select id="a_cat">${[["tolls","Tolls"],["parking","Parking"],["hotel","Hotel"],["airfare","Airfare"],
              ["rental","Rental vehicle"],["records","Records"],["database","Database"],["equipment","Equipment"],
              ["meals","Meals (if authorized)"],["other","Other"]].map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></label>
        </div>
        <label class="f"><span>What it was</span><input id="a_desc" placeholder="e.g. Parking garage across from the courthouse"></label>
        <p class="hint">Recorded under Expenses for the office's review and marked on the timeline together.</p>`
      : `
        <label class="f"><span>Common lines <span class="opt">picking one fills the box — edit freely</span></span>
          <select id="a_phrase" data-act="phrase">
            <option value="">Write my own / pick a line…</option>
            ${PHRASES.map(ph => `<option value="${esc(ph)}">${esc(ph)}</option>`).join("")}
          </select></label>
        <label class="f"><span>${QKIND === "note" ? "Field note"
            : QKIND === "location" ? "What is at this location"
            : QKIND === "vehicle" ? "What the vehicle is doing" : "What happened"}</span>
          <textarea id="a_desc" rows="2" placeholder="${
              QKIND === "note" ? "e.g. Neighbour waved; may have been noticed. Rotating position."
            : QKIND === "location" ? "e.g. ABC Fitness — subject's regular morning gym."
            : QKIND === "vehicle" ? "e.g. Parked nose-out in the driveway, engine running."
            : "e.g. Subject departed residence in the white GMC Sierra."}"></textarea></label>
        <div class="capgrid">
          <label class="cap"><input type="checkbox" id="a_sd"><span>Subject documented</span></label>
          <label class="cap"><input type="checkbox" id="a_va"><span>Video acquired</span></label>
          <label class="cap"><input type="checkbox" id="a_pa"><span>Photo taken</span></label>
        </div>
        <p class="hint">Tick what was captured at this moment — it goes on the timeline and into the
          report line. The files themselves attach when evidence storage arrives.</p>
        <div class="two">
          <label class="f"><span>Location ${QKIND === "location" ? "" : `<span class="opt">optional</span>`}</span>
            <input id="a_loc" placeholder="e.g. 2214 Old Forest Rd"></label>
          <label class="f"><span>Vehicle ${QKIND === "vehicle" ? "" : `<span class="opt">optional</span>`}</span>
            <input id="a_veh" placeholder="e.g. White GMC Sierra XKT-2209"></label>
        </div>
        <label class="f"><span>Internal note <span class="opt">optional, never client-facing</span></span><input id="a_note"></label>`}
      <button class="btn" type="submit">${
        QKIND === "mileage" ? "Record mileage" : QKIND === "expense" ? "Record expense" : "Add to the log"}</button>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>

    ${a.length ? Object.keys(byDay).map(d => `
      <div class="tl-day">${esc(fmtDay(d))}</div>
      <ol class="tl">
        ${byDay[d].map(e => `<li class="tl-i">
          <div class="tl-t">${esc(t12(e.at_time))}</div>
          <div class="tl-b">
            <span class="tag ${esc(e.kind)}">${esc(label(e.kind))}</span>
            <div class="tl-d">${esc(e.description)}</div>
            ${e.location ? `<div class="tl-m">at ${esc(e.location)}</div>` : ""}
            ${e.vehicle ? `<div class="tl-m">vehicle: ${esc(e.vehicle)}</div>` : ""}
            ${e.subject_documented || e.video_acquired || e.photo_acquired ? `<div>
              ${e.subject_documented ? '<span class="tag cap-sd">Subject documented</span>' : ""}
              ${e.video_acquired ? '<span class="tag cap-va">Video</span>' : ""}
              ${e.photo_acquired ? '<span class="tag cap-pa">Photo</span>' : ""}</div>` : ""}
            ${e.internal_note ? `<div class="tl-n">internal: ${esc(e.internal_note)}</div>` : ""}
            <div class="tl-m">${esc(e.investigator || "")}${e.edited_at ? " · edited" : ""}</div>
          </div></li>`).join("")}
      </ol>`).join("")
      : `<div class="empty">Nothing logged on this case yet.</div>`}`;
}

function fieldPanel(){
  const open = WS && WS.open_day;
  const notice = WS_NOTICE ? `<div class="dayon"><b>${esc(WS_NOTICE)}</b>
      <button class="btn sm" data-act="wsTab" data-tab="reports" style="margin-left:8px">Draft the daily report</button>
    </div>` : "";
  const days = (WS && WS.days) || [];
  const today = new Date().toISOString().slice(0,10);
  const now = new Date().toTimeString().slice(0,5);
  return `
    ${notice}
    ${open
      ? `<form class="quick" data-act="endDay">
           <div class="dayon"><b>Day running since ${esc(t12(open.start_time))}</b> on ${esc(fmtDay(open.day_date))}${
             open.start_mileage != null ? ` &middot; started at ${esc(open.start_mileage)} miles` : ""}.</div>
           <div class="two">
             <label class="f"><span>End time</span><input id="d_end" type="time" value="${now}"></label>
             <label class="f"><span>Ending mileage <span class="opt">optional</span></span><input id="d_emiles" inputmode="decimal"></label>
           </div>
           <label class="f"><span>Summary of the day <span class="opt">optional</span></span>
             <textarea id="d_sum" rows="3" placeholder="What the day established, in your own words."></textarea></label>
           <button class="btn danger" type="submit">End investigation day</button>
           ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
         </form>`
      : `<form class="quick" data-act="startDay">
           <div class="two">
             <label class="f"><span>Date</span><input id="d_date" type="date" value="${today}"></label>
             <label class="f"><span>Start time</span><input id="d_start" type="time" value="${now}"></label>
           </div>
           <label class="f"><span>Beginning mileage <span class="opt">optional</span></span><input id="d_smiles" inputmode="decimal"></label>
           <button class="btn" type="submit">Start investigation</button>
           ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
         </form>`}
    <h3 style="margin:18px 0 6px;font-size:1rem">Days on this case</h3>
    ${days.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>Date</th><th>Hours</th><th class="hide">Miles</th><th class="hide">Investigator</th></tr></thead>
      <tbody>${days.map(d => `<tr>
        <td>${esc(fmtDay(d.day_date))}<div class="tl-m">${esc(t12(d.start_time))}${d.end_time ? "–" + esc(t12(d.end_time)) : " · running"}</div></td>
        <td>${d.hours != null ? esc(d.hours) : "—"}</td>
        <td class="hide">${d.miles != null ? esc(d.miles) : "—"}</td>
        <td class="hide">${esc(d.investigator || "")}</td>
      </tr>${d.summary ? `<tr><td colspan="4" class="tl-n">${esc(d.summary)}</td></tr>` : ""}`).join("")}
      </tbody></table></div>`
      : `<div class="empty">No investigation days recorded yet.</div>`}`;
}

/* Reports. The draft is assembled from the log, then it is a document someone
   writes — so the editor is a plain textarea, and nothing moves to the next
   stage without a person pressing a button. */
function reportsPanel(){
  const admin = ME.role === "admin";
  const reports = (WS && WS.reports) || [];
  const days = ((WS && WS.days) || []).filter(d => d.end_time);
  const reported = new Set(reports.map(r => r.day_id));
  const spare = days.filter(d => !reported.has(d.id));
  const open = reports.find(r => r.id === WS_REPORT);

  const badge = s => `<span class="tag rs-${esc(s)}">${esc(reportLabel(s))}</span>`;

  return `
    ${spare.length ? `<form class="quick" data-act="genReport">
        <label class="f"><span>Draft a daily report from the activity log</span>
          <select id="r_day">${spare.map(d =>
            `<option value="${d.id}">${esc(d.day_date)} — ${esc(d.start_time)}–${esc(d.end_time || "")}${
              d.hours != null ? ` (${esc(d.hours)} hrs)` : ""}</option>`).join("")}</select></label>
        <button class="btn" type="submit">Generate draft</button>
        <p class="hint">It assembles the chronology from what you logged and formats the times.
          The wording stays yours &mdash; read every line before it goes anywhere.</p>
        ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
      </form>`
      : `<div class="note">${days.length
          ? "Every completed day on this case already has a report."
          : `End an investigation day first &mdash; a report is drafted from a day's activity log.
             <button class="btn sm ghost" data-act="wsTab" data-tab="field" style="margin-left:8px">Go to Field work</button>`}</div>`}

    ${reports.length ? `<div class="rlist">${reports.map(r => `
      <button class="rcard${r.id === WS_REPORT ? " on" : ""}" data-act="openReport" data-id="${r.id}">
        <div class="rc-h"><b>${esc(r.report_date)}</b> ${badge(r.status)}</div>
        <div class="tl-m">${esc(r.investigator || "")}${r.updated_at ? " · edited" : ""}</div>
        ${r.review_note ? `<div class="tl-n">Office note: ${esc(r.review_note)}</div>` : ""}
      </button>`).join("")}</div>` : ""}

    ${open ? `<div class="quick" style="margin-top:14px">
      <div class="rc-h" style="margin-bottom:8px"><b>${esc(open.report_date)}</b> ${badge(open.status)}</div>
      <textarea id="r_body" rows="16" class="rbody" ${
        (!admin && !["draft","needs_revision"].includes(open.status)) ? "readonly" : ""
      }>${esc(open.body)}</textarea>
      <div class="ractions">
        ${(admin || ["draft","needs_revision"].includes(open.status))
          ? `<button class="btn sm" data-act="saveReport" data-id="${open.id}">Save changes</button>` : ""}
        ${["draft","needs_revision"].includes(open.status)
          ? `<button class="btn sm ghost" data-act="reportStatus" data-id="${open.id}" data-to="submitted">Submit for review</button>` : ""}
        ${admin && open.status === "submitted" ? `
          <button class="btn sm ghost" data-act="reportStatus" data-id="${open.id}" data-to="needs_revision">Send back</button>
          <button class="btn sm" data-act="reportStatus" data-id="${open.id}" data-to="approved">Approve</button>` : ""}
        ${admin && open.status === "approved"
          ? `<button class="btn sm" data-act="reportStatus" data-id="${open.id}" data-to="delivered">Mark delivered</button>` : ""}
      </div>
      ${admin && open.status === "submitted"
        ? `<label class="f" style="margin-top:10px"><span>Note back to the investigator <span class="opt">optional</span></span>
             <input id="r_note" placeholder="What needs changing"></label>` : ""}
      ${!admin && open.status === "submitted"
        ? `<p class="hint">With the office for review. You will see a note here if anything needs changing.</p>` : ""}
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </div>` : ""}`;
}

const reportLabel = s => ({draft:"Draft", submitted:"Submitted", needs_revision:"Needs revision",
                           approved:"Approved", delivered:"Delivered"}[s] || s);

/* Expenses. Anyone on the case records what it cost them; the office makes
   the three separate decisions — owed back, billable on, company cost. */
function expensesPanel(){
  const admin = ME.role === "admin";
  const list = (WS && WS.expenses) || [];
  const today = new Date().toISOString().slice(0,10);
  const cats = [["mileage","Mileage"],["tolls","Tolls"],["parking","Parking"],["hotel","Hotel"],
    ["airfare","Airfare"],["rental","Rental vehicle"],["records","Records"],["database","Database"],
    ["equipment","Equipment"],["meals","Meals (if authorized)"],["other","Other"]];
  const money = n => n == null ? "" : "$" + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const totals = list.reduce((t,e)=>({amt:t.amt+(Number(e.amount)||0), mi:t.mi+(Number(e.miles)||0)}), {amt:0,mi:0});

  return `
    <form class="quick" data-act="addExpense">
      <div class="two">
        <label class="f"><span>Date</span><input id="x_date" type="date" value="${today}"></label>
        <label class="f"><span>Category</span>
          <select id="x_cat">${cats.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></label>
      </div>
      <div class="two">
        <label class="f"><span>Amount <span class="opt">dollars</span></span><input id="x_amt" inputmode="decimal"></label>
        <label class="f"><span>Miles <span class="opt">for mileage claims</span></span><input id="x_mi" inputmode="decimal"></label>
      </div>
      <label class="f"><span>What it was</span><input id="x_desc" placeholder="e.g. Parking garage at the courthouse — receipt in hand"></label>
      <button class="btn" type="submit">Record expense</button>
      <p class="hint">Receipt photos attach once evidence storage lands. Until then, keep the paper
        and note what it says here.</p>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>

    ${list.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th class="hide">Miles</th><th>Status</th></tr></thead>
      <tbody>${list.map(e => `<tr>
        <td>${esc(fmtDay(e.expense_date))}<div class="tl-m">${esc(e.investigator || "")}${e.edited_at ? " · edited" : ""}</div></td>
        <td>${esc(label(e.category) || e.category)}<div class="tl-m">${esc(e.description)}</div></td>
        <td>${money(e.amount) || "—"}</td>
        <td class="hide">${e.miles != null ? esc(e.miles) : "—"}</td>
        <td>${e.reviewed_at
            ? `${e.reimbursable ? '<span class="tag xr">Reimburse</span>' : ""}
               ${e.billable ? '<span class="tag xb">Billable</span>' : ""}
               ${e.internal ? '<span class="tag xi">Company</span>' : ""}
               ${!e.reimbursable && !e.billable && !e.internal ? '<span class="tag">Reviewed</span>' : ""}`
            : admin
            ? `<div class="xrev" data-id="${e.id}">
                 <label><input type="checkbox" class="xr-re"> reimburse</label>
                 <label><input type="checkbox" class="xr-bi"> billable</label>
                 <label><input type="checkbox" class="xr-in"> company</label>
                 <button class="btn sm" data-act="reviewExpense" data-id="${e.id}">Save</button>
               </div>`
            : '<span class="tag new">Awaiting review</span>'}</td>
      </tr>`).join("")}
      <tr><td><b>Total claimed</b></td><td></td><td><b>${money(totals.amt)}</b></td>
          <td class="hide"><b>${totals.mi || ""}</b></td><td></td></tr>
      </tbody></table></div>`
      : `<div class="empty">No expenses recorded on this case.</div>`}`;
}

/* Notes, categorised and visibility-tagged. What arrives here has already been
   filtered by the Worker — an admin-only note never reaches this page for an
   investigator, so there is nothing for the page to hide. */
function notesPanel(){
  const admin = ME.role === "admin";
  const notes = (WS && WS.notes) || [];
  const types = admin
    ? [["admin","Admin note"],["investigator","Investigator note"],["client_comm","Client communication"],
       ["strategy","Case strategy"],["subject","Subject information"],["evidence","Evidence note"],["billing","Billing note"]]
    : [["investigator","Investigator note"],["subject","Subject information"],["evidence","Evidence note"]];
  const visLabel = v => v === "admin" ? "Admin only" : v === "client_eligible" ? "Client eligible" : "Team";

  return `
    <form class="quick" data-act="addNote">
      <div class="two">
        <label class="f"><span>Type</span>
          <select id="n_type">${types.map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></label>
        ${admin ? `<label class="f"><span>Who can see it</span>
          <select id="n_vis">
            <option value="team">Admins + investigators on the case</option>
            <option value="admin">Admins only</option>
            <option value="client_eligible">Eligible for a client-facing record</option>
          </select></label>` : ""}
      </div>
      <label class="f"><span>Note</span><textarea id="n_body" rows="3"></textarea></label>
      <button class="btn" type="submit">Add note</button>
      ${admin ? `<p class="hint">"Client eligible" only marks a note as allowed into a future
        client-facing record. Nothing is ever sent automatically.</p>` : ""}
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>
    ${notes.length ? notes.map(n => `<div class="notecard">
        <div class="rc-h"><span class="tag">${esc(label(n.note_type) || n.note_type)}</span>
          <span class="tag ${n.visibility === "admin" ? "nv-admin" : n.visibility === "client_eligible" ? "nv-client" : "nv-team"}">${esc(visLabel(n.visibility))}</span></div>
        <div class="notebody">${esc(n.body)}</div>
        <div class="tl-m">${esc(n.author || "")} &middot; ${when(n.created_at)}${n.edited_at ? " · edited" : ""}</div>
      </div>`).join("")
      : `<div class="empty">No notes on this case yet.</div>`}`;
}

/* Priority 18 — the communication log. Office-authored: an admin records who
   was contacted, when and how; visibility decides what the assigned
   investigator sees, and the Worker's query enforces it. Documents
   communication only — nothing is ever sent from here. */
function commsPanel(){
  const admin = ME.role === "admin";
  const comms = (WS && WS.comms) || [];
  const typeLabel = t => ({email:"Email", phone:"Phone call", text:"Text",
    client_update:"Client update", investigator:"Investigator",
    authorization_request:"Authorization request", internal:"Internal"})[t] || t;
  const visLabel = v => v === "admin" ? "Admin only" : v === "client_eligible" ? "Client eligible" : "Team";
  const today = new Date().toISOString().slice(0,10);

  const composer = !admin ? "" : `
    <form class="quick" data-act="addComm">
      <div class="two">
        <label class="f"><span>How</span>
          <select id="c_type">${[["phone","Phone call"],["email","Email"],["text","Text"],
            ["client_update","Client update"],["investigator","Investigator communication"],
            ["authorization_request","Authorization request"],["internal","Internal"]]
            .map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></label>
        <label class="f"><span>With</span><input id="c_person" placeholder="e.g. D. Reyes, adjuster"></label>
      </div>
      <div class="two">
        <label class="f"><span>Date</span><input id="c_date" type="date" value="${today}"></label>
        <label class="f"><span>Time <span class="opt">optional</span></span><input id="c_time" type="time"></label>
      </div>
      <label class="f"><span>What was said</span><textarea id="c_sum" rows="3"
        placeholder="e.g. Adjuster approved a second day; written confirmation to follow by email."></textarea></label>
      <div class="two">
        <label class="f"><span>Follow up by <span class="opt">optional</span></span><input id="c_fup" type="date"></label>
        <label class="f"><span>Who can see it</span>
          <select id="c_vis">
            <option value="admin">Admins only</option>
            <option value="team">Admins + investigators on the case</option>
            <option value="client_eligible">Eligible for a client-facing record</option>
          </select></label>
      </div>
      <button class="btn" type="submit">Log the communication</button>
      <p class="hint">This records the communication &mdash; nothing is sent from here, and
        &ldquo;client eligible&rdquo; only marks it as allowed into a future client-facing record.</p>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>`;

  return `${composer}
    ${comms.length ? comms.map(c => `<div class="notecard">
        <div class="rc-h"><span class="tag">${esc(typeLabel(c.comm_type))}</span>
          ${c.person ? `<b style="font-size:.9rem">${esc(c.person)}</b>` : ""}
          ${admin ? `<span class="tag ${c.visibility === "admin" ? "nv-admin" : c.visibility === "client_eligible" ? "nv-client" : "nv-team"}">${esc(visLabel(c.visibility))}</span>` : ""}</div>
        <div class="notebody">${esc(c.summary)}</div>
        <div class="tl-m">${esc(fmtDay(c.at_date))}${c.at_time ? ` &middot; ${esc(t12(c.at_time))}` : ""}${
          c.follow_up_date ? ` &middot; <b>follow up ${esc(fmtDay(c.follow_up_date))}</b>` : ""} &middot; ${esc(c.author || "")}</div>
      </div>`).join("")
      : `<div class="empty">${admin ? "No communications logged on this case yet."
          : "Nothing shared with you on this case yet."}</div>`}`;
}

/* Priority 19 — follow-up tasks. Admin-created; assigning one to an
   investigator is the office choosing to tell them, and that assignment is
   the only way a task reaches one. The one write the field has is marking
   their own task done. */
function tasksPanel(){
  const admin = ME.role === "admin";
  const tasks = (WS && WS.tasks) || [];
  const today = new Date().toISOString().slice(0,10);
  const priTag = p => p === "urgent" ? `<span class="tag rs-needs_revision">urgent</span>`
    : p === "high" ? `<span class="tag rs-submitted">high</span>`
    : p === "low" ? `<span class="tag rs-draft">low</span>` : "";

  const composer = !admin ? "" : `
    <form class="quick" data-act="addTask">
      <label class="f"><span>What needs doing</span>
        <input id="t_task" placeholder="e.g. Call the adjuster to confirm the second day."></label>
      <div class="two">
        <label class="f"><span>Assigned to</span>
          <select id="t_who"><option value="">The office</option>
            ${USERS.filter(u => u.active).map(u =>
              `<option value="${u.id}">${esc(u.display_name || u.username)}</option>`).join("")}</select></label>
        <label class="f"><span>Due <span class="opt">optional</span></span><input id="t_due" type="date"></label>
      </div>
      <label class="f"><span>Priority</span>
        <select id="t_pri">${[["normal","Normal"],["high","High"],["urgent","Urgent"],["low","Low"]]
          .map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></label>
      <button class="btn" type="submit">Add task</button>
      <p class="hint">A task assigned to an investigator shows on their view of this case and on
        their dashboard when overdue. Office tasks stay with the office.</p>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>`;

  const row = t => {
    const overdue = t.status === "open" && t.due_date && t.due_date < today;
    return `<div class="rcard" style="cursor:default${t.status !== "open" ? ";opacity:.65" : ""}">
      <div class="rc-h"><b>${esc(t.task)}</b>${priTag(t.priority)}
        ${t.status === "open"
          ? `<button class="btn sm" data-act="taskStatus" data-id="${t.id}" data-s="done">Done</button>
             ${admin ? `<button class="btn sm ghost" data-act="taskStatus" data-id="${t.id}" data-s="cancelled">Cancel</button>` : ""}`
          : `<span class="tag ${t.status === "done" ? "rs-approved" : "rs-draft"}">${esc(t.status)}</span>
             ${admin ? `<button class="btn sm ghost" data-act="taskStatus" data-id="${t.id}" data-s="open">Reopen</button>` : ""}`}</div>
      <div class="tl-m">${t.assignee ? esc(t.assignee) : "The office"}${
        t.due_date ? ` &middot; due ${esc(fmtDay(t.due_date))}` : ""}${
        overdue ? ` &middot; <b style="color:#a33">overdue</b>` : ""}</div>
    </div>`;
  };

  return `${composer}
    ${tasks.length ? `<div class="rlist">${tasks.map(row).join("")}</div>`
      : `<div class="empty">${admin ? "No tasks on this case yet."
          : "Nothing is assigned to you on this case."}</div>`}`;
}

function authAdminForm(){
  const a = (WS && WS.authorization) || {};
  const types = (WS && WS.case_types) || [];
  const ins = types.filter(t => t.side === "insurance"), pri = types.filter(t => t.side === "private");
  const opt = t => `<option value="${t.id}" ${t.id === a.case_type_id ? "selected" : ""}>${esc(t.label)}</option>`;
  return `<form class="quick" data-act="saveMeta">
    <label class="f"><span>Case type</span>
      <select id="m_type">
        <option value="">— not set —</option>
        <optgroup label="Insurance">${ins.map(opt).join("")}</optgroup>
        <optgroup label="Private">${pri.map(opt).join("")}</optgroup>
      </select></label>
    <div class="two">
      <label class="f"><span>Authorized hours</span><input id="m_hours" inputmode="decimal" value="${a.authorized_hours ?? ""}"></label>
      <label class="f"><span>Authorized budget</span><input id="m_budget" inputmode="decimal" value="${a.authorized_budget ?? ""}"></label>
    </div>
    <label class="f"><span>Client rate for this case <span class="opt">blank = the firm's standard rate.
        Mileage is never billed to a client &mdash; the all-in price covers it.</span></span>
      <input id="m_chourly" inputmode="decimal" value="${a.case_rate_set ? a.billed_at_rate : ""}"></label>
    <label class="cap" style="margin:2px 0 10px">
      <input type="checkbox" id="m_showclient" ${a.show_client_identity ? "checked" : ""}>
      <span>Allow the assigned investigator to see who the client is
        <span class="opt">default no — reveals carrier, claim number and client name only; never
        contacts, billing or rates</span></span></label>
    <button class="btn" type="submit">Save authorization</button>
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;
}

function caseBodyHtml(){
  const admin = ME.role === "admin";
  if(!WS) return `<div class="empty">Loading the case&hellip;</div>`;
  const s = WS.submission || {};
  const a = WS.authorization || {};

  const panel =
      WS_TAB === "activity" ? activityPanel()
    : WS_TAB === "field"    ? fieldPanel()
    : WS_TAB === "reports"  ? reportsPanel()
    : WS_TAB === "expenses" ? expensesPanel()
    : WS_TAB === "notes"    ? notesPanel()
    : WS_TAB === "comms"    ? commsPanel()
    : WS_TAB === "tasks"    ? tasksPanel()
    : WS_TAB === "auth"     ? authPanel(a, admin) + (admin ? authAdminForm() : "")
    : WS_TAB === "assign"   ? assignPanel(s)
    : WS_TAB === "subject"  ? detailList(s, "subject") + caseDetailsPanel() + subjectsPanel(s)
    :                         myOfferBox() + detailList(s, "overview") + (a.authorized_hours != null ? authPanel(a, admin) : "");

  return `
    <h2>${esc(a.case_type || (s.kind === "claims" ? "Claim assignment" : "Client intake"))}</h2>
    <div class="case">${esc(WS_CASE)}</div>
    <div class="wstabs">${wsTabs().map(([k, lbl]) =>
      `<button class="${WS_TAB === k ? "on" : ""}" data-act="wsTab" data-tab="${k}">${esc(lbl)}</button>`).join("")}</div>
    <div class="wspanel">${panel}</div>`;
}

/* The workspace is a full page, not a popup — a case is where the day's work
   happens, and work does not happen through a keyhole. paint() routes here. */
function paintCase(){ paint(); }

async function openExampleCase(caseNo){ WS_CASE = caseNo; WS = null; VIEW = "case"; paint(); }

function exampleBodyHtml(){
  const s = examplesFor(ME.role).find(c => c.case_no === WS_CASE);
  if(!s) return "";
  const p = s.payload || {};

          <select id="asg">

          </select></label>
        <label class="f"><span>Status</span>
          <select id="sts">${["new","assigned","in_progress","closed"].map(v => `<option value="${v}" ${v === s.status ? "selected" : ""}>${esc(label(v))}</option>`).join("")}</select></label>
        <button class="btn" data-act="saveCase" data-case="${esc(s.case_no)}">Save</button>
        <div class="err" id="derr" style="width:100%"></div>

    ${isExample(s.case_no) ? `<div class="ex-note" style="margin-bottom:14px">
       <b>Example — not a real case.</b> ${ME.role === "admin"
         ? `Every field a live ${claim ? "carrier assignment" : "client intake"} can carry is filled in

            actually provided.`

    <h2>${claim ? "Claim assignment" : "Client intake"} — ${esc(s.service || "")}</h2>
    <div class="case">${esc(s.case_no)}</div>
    <dl class="detail">
      ${claim ? `${row("Carrier / TPA", p.carrier)}${row("Claim number", p.claim_number)}${row("Policy number", p.policy_number)}
                 ${row("Claim type", p.claim_type)}${row("Date of loss", p.date_of_loss)}${row("Adjuster", p.adjuster)}
                 ${row("Adjuster email", p.adjuster_email)}${row("Adjuster phone", p.adjuster_phone)}
                 ${row("Defense counsel", p.defense_counsel)}${row("Prior surveillance", p.prior_surveillance)}` : ""}
      ${row(claim ? "Assigning contact" : "Client", p.client_name)}${row("Phone", p.client_phone)}${row("Email", p.client_email)}
      ${claim ? "" : `${row("Address", p.client_address)}${row("Best time", p.best_time)}`}
      ${row(claim ? "Claimant" : "Subject", p.subject_name)}${row("Address", p.subject_address)}
      ${row("Description", p.subject_description)}${row(claim ? "Injury & restrictions" : "Relationship", p.subject_relationship)}
      ${row(claim ? "Scope" : "Objective", p.objective)}${row("Authorized hours", p.authorized_hours)}
      ${row("Not to exceed", p.not_to_exceed)}${row("Requested start", p.start_date)}
      ${row("Permitted days", p.permitted_days)}${row("Permitted times", p.permitted_times)}
      ${row("Weekend", p.weekend_authorized)}${row("Priority", p.priority)}
      ${row("Geographic limits", p.geographic_limits)}
      ${row(claim ? "Deadline" : "Timeline", p.timeline)}${row("Notes", p.notes)}${row("Attachments", p.attachments)}
      ${claim ? `${row("Billing reference", p.billing_reference)}${row("Invoices to", p.billing_email)}${row("Billing notes", p.billing_notes)}`
              : `${row("Due today", p.fee_due != null ? "$" + p.fee_due : "")}${row("Payment method", p.payment_method)}`}
      ${row(claim ? "Authorized by" : "Signed by", p.signed_name)}
      ${row("Received", when(s.created_at))}
    </dl>
    ${sig ? `<div><div style="font-size:.8rem;color:var(--muted)">Signature</div><img class="sig" src="${esc(sig)}" alt="signature"></div>` : ""}

  }

/* The intake detail, split so the workspace can show what the field needs
   (subject) apart from what the office needs (everything). Both read from the
   same submission — the Worker has already removed whatever this role may not
   see, so nothing here decides that. */
function detailList(s, mode){
  const p = s.payload || {};
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
  const claim = s.kind === "claims";
  const sig = safeImage(p.signature);

  if(mode === "subject"){
    return `<dl class="detail">
      ${row(claim ? "Claimant" : "Subject", p.subject_name)}${row("Address", p.subject_address)}
      ${row("Description", p.subject_description)}
      ${row(claim ? "Injury & restrictions" : "Relationship", p.subject_relationship)}
      ${row("Prior surveillance", p.prior_surveillance)}
      ${row(claim ? "Scope" : "Objective", p.objective)}
      ${row("Permitted days", p.permitted_days)}${row("Permitted times", p.permitted_times)}
      ${row("Weekend", p.weekend_authorized)}${row("Geographic limits", p.geographic_limits)}
      ${row("Field notes", p.notes)}
    </dl>`;
  }
  return `<dl class="detail">
    ${claim ? `${row("Carrier / TPA", p.carrier)}${row("Claim number", p.claim_number)}${row("Policy number", p.policy_number)}
               ${row("Claim type", p.claim_type)}${row("Date of loss", p.date_of_loss)}${row("Adjuster", p.adjuster)}
               ${row("Adjuster email", p.adjuster_email)}${row("Adjuster phone", p.adjuster_phone)}
               ${row("Defense counsel", p.defense_counsel)}` : ""}
    ${row(claim ? "Assigning contact" : "Client", p.client_name)}${row("Phone", p.client_phone)}${row("Email", p.client_email)}
    ${claim ? "" : `${row("Address", p.client_address)}${row("Best time", p.best_time)}`}
    ${row(claim ? "Claimant" : "Subject", p.subject_name)}
    ${row(claim ? "Scope" : "Objective", p.objective)}
    ${row("Authorized hours", p.authorized_hours)}${row("Not to exceed", p.not_to_exceed)}
    ${row("Requested start", p.start_date)}${row("Priority", p.priority)}
    ${row(claim ? "Deadline" : "Timeline", p.timeline)}${row("Attachments", p.attachments)}
    ${claim ? `${row("Billing reference", p.billing_reference)}${row("Invoices to", p.billing_email)}${row("Billing notes", p.billing_notes)}` : ""}
    ${row(claim ? "Authorized by" : "Signed by", p.signed_name)}
    ${row("Received", when(s.created_at))}
  </dl>
  ${sig ? `<div><div style="font-size:.8rem;color:var(--muted)">Signature</div><img class="sig" src="${esc(sig)}" alt="signature"></div>` : ""}`;
}

/* Priority 16 — the operational facts a private case's type calls for. The
   Worker chooses the field set from the case type and sends [key, label]
   pairs; this draws what arrives and decides nothing. Admin edits, an
   investigator reads. Claims cases never have one — their claim details are
   in the intake payload above. */
function caseDetailsPanel(){
  if(!WS || !WS.detail_fields) return "";
  const d = WS.details || {};
  if(ME.role !== "admin"){
    const rows = WS.detail_fields.filter(([k]) => d[k]);
    if(!rows.length) return "";
    return `<h3 style="margin:18px 0 6px;font-size:1rem">Case details</h3>
      <dl class="detail">${rows.map(([k, l]) => `<dt>${esc(l)}</dt><dd>${esc(d[k])}</dd>`).join("")}</dl>`;
  }
  return `<form class="quick" data-act="saveDetails" style="margin-top:16px">
    <h3 style="margin:0 0 8px;font-size:1rem">Case details</h3>
    <p class="hint" style="margin-bottom:10px">What this case type calls for. The assigned
      investigator sees these beside the subject; the client's identity and billing never travel
      with them. Frame objectives as <b>observe and document</b> &mdash; &ldquo;Document persons
      present and observed activity during the scheduled custody period&rdquo; &mdash; and leave
      what it means legally to courts and attorneys.</p>
    ${WS.detail_fields.map(([k, l]) => `
      <label class="f"><span>${esc(l)}${k === "objectives"
          ? ` <span class="opt">observe and document &mdash; never a legal conclusion</span>` : ""}</span>
        <textarea id="det_${k}" rows="2">${esc(d[k] || "")}</textarea></label>`).join("")}
    <button class="btn" type="submit">Save details</button>
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;
}

/* Priority 17 — structured subjects and their vehicles. Fieldwork records:
   both roles add and correct them (there is no delete — corrections are

   null, {mode:"new",pre}, {mode:"edit",id} or {mode:"veh",sid,vid?}. */
let SUBJ_FORM = null;

function subjForm(pre, id){

    <div class="two">
      <label class="f"><span>Name</span><input id="sf_name" value="${g("name")}"></label>

    </div>
    <div class="two">

      <label class="f"><span>Phone <span class="opt">if legitimately obtained</span></span><input id="sf_phone" value="${g("phone")}"></label>

function vehForm(sub){

      <label class="f"><span>Color</span><input id="vf_color" value="${g("color")}"></label>

    <div class="two">

function subjectsPanel(s){
  if(!WS) return "";
  const subs = WS.subjects || [];
  const p = (s && s.payload) || {};
  const fr = (l, v) => v ? `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>` : "";

  const vehLine = v => `<div class="tl-m">${esc([v.year, v.color, v.make, v.model].filter(Boolean).join(" "))}${
      v.plate ? ` &mdash; ${esc(v.plate)}${v.plate_state ? " (" + esc(v.plate_state) + ")" : ""}` : ""}
      <button class="btn sm ghost" data-act="vehEdit" data-sid="${v.subject_id}" data-vid="${v.id}">Edit</button></div>
    ${v.registered_owner ? `<div class="tl-n">Registered to ${esc(v.registered_owner)}</div>` : ""}
    ${v.notes ? `<div class="tl-n">${esc(v.notes)}</div>` : ""}`;

  const card = sub => {
    const editing = SUBJ_FORM && SUBJ_FORM.mode === "edit" && SUBJ_FORM.id === sub.id;
    return `<div class="rcard" style="cursor:default">
      <div class="rc-h"><b>${esc(sub.name)}</b>${sub.alias ? ` <span class="tl-m">&ldquo;${esc(sub.alias)}&rdquo;</span>` : ""}
        ${!SUBJ_FORM ? `<button class="btn sm ghost" data-act="subjEdit" data-id="${sub.id}">Edit</button>
        <button class="btn sm ghost" data-act="vehAdd" data-sid="${sub.id}">Add vehicle</button>` : ""}</div>
      ${editing ? subjForm(sub, sub.id) : `<dl class="detail">
        ${fr("Date of birth", sub.dob)}${fr("Height", sub.height)}${fr("Weight", sub.weight)}
        ${fr("Hair", sub.hair)}${fr("Descriptors", sub.descriptors)}${fr("Addresses", sub.addresses)}
        ${fr("Employer", sub.employer)}${fr("Phone", sub.phone)}
        ${fr("Social accounts", sub.social_accounts)}${fr("Notes", sub.notes)}
      </dl>`}
      ${(sub.vehicles || []).length && !editing ? `<div style="margin-top:4px"><b style="font-size:.85rem">Vehicles</b>${sub.vehicles.map(vehLine).join("")}</div>` : ""}
      ${SUBJ_FORM && SUBJ_FORM.mode === "veh" && SUBJ_FORM.sid === sub.id ? vehForm(sub) : ""}
    </div>`;
  };

  return `<h3 style="margin:18px 0 6px;font-size:1rem">Subjects &amp; vehicles</h3>
    ${subs.length ? `<div class="rlist">${subs.map(card).join("")}</div>`
      : `<p class="hint">No structured subject records yet. The intake snapshot above stays as
         received; records added here are the working copy the field can keep current.</p>`}
    ${SUBJ_FORM && SUBJ_FORM.mode === "new" ? subjForm(SUBJ_FORM.pre, null) : ""}
    ${!SUBJ_FORM ? `<div style="margin-top:8px">
        <button class="btn sm" data-act="subjNew">Add a subject</button>
        ${!subs.length && p.subject_name ? `<button class="btn sm ghost" data-act="subjFromIntake">Start from the intake subject</button>` : ""}
      </div>` : ""}`;
}

async function saveSubjectRec(id){
  WS_ERR = "";
  const body = {};
  for(const k of ["name","alias","dob","height","weight","hair","descriptors","addresses","employer","phone","social_accounts","notes"]){
    const el = $("sf_" + k);
    if(el) body[k] = el.value;
  }
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/subjects` + (id ? `/${id}` : ""), {method:"POST", body});
    SUBJ_FORM = null;
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function saveVehicleRec(sid, vid){
  WS_ERR = "";
  const body = {};
  for(const k of ["year","make","model","color","plate","plate_state","registered_owner","notes"]){
    const el = $("vf_" + k);
    if(el) body[k] = el.value;
  }
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/subjects/${sid}/vehicles` + (vid ? `/${vid}` : ""), {method:"POST", body});
    SUBJ_FORM = null;
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

function assignPanel(s){
  const offers = (WS && WS.offers) || [];
  const offerRows = offers.length ? `<h3 style="margin:16px 0 6px;font-size:1rem">Offers</h3>
    <div class="rlist">${offers.map(o => `<div class="rcard" style="cursor:default">
      <div class="rc-h"><b>${esc(o.investigator || "")}</b>

        o.compensation_hourly != null ? ` · pays $${esc(o.compensation_hourly)}/hr` : ""}</div>

  const offerForm = `<form class="quick" data-act="makeOffer" style="margin-top:16px">

        <select id="of_inv">${USERS.filter(u => u.active && u.id !== ME.id).map(u =>
          `<option value="${u.id}">${esc(u.display_name || u.username)}</option>`).join("")}</select></label>
      <label class="f"><span>Investigation date</span><input id="of_date" type="date"></label>
    </div>
    <div class="two">
      <label class="f"><span>Expected hours</span><input id="of_hours" inputmode="decimal"></label>
      <label class="f"><span>Pay <span class="opt">blank = their standing rate</span></span><input id="of_comp" inputmode="decimal"></label>

    <div class="two">
      <label class="f"><span>General location <span class="opt">e.g. "Lynchburg area"</span></span><input id="of_loc"></label>
