/* THE AGREED RETAINER, CHOSEN BEFORE THE SEND (PAYMENTS.md, owner 2026-08-15).

   PRIVATE SHEET ONLY — this returns nothing at all for the carrier one, the
   same shape as the payment section above, and the Worker refuses a retainer on
   a claims case independently. An insurance assignment is authorized in hour
   blocks; a retainer selector on it would be offering the wrong billing model.

   The figure is a property of the CASE, not of this email — the owner's wording
   is "becomes the AGREED RETAINER for that specific private client/case" — so
   it is written to `case_retainer` and everything downstream re-reads it. The
   hourly rate and the 4-hour minimum are untouched and must stay that way.

   The standard figure is only the STARTING point, never a reset: a case that
   agreed a higher one opens this selector on that higher one, and an amount
   matching no preset opens Custom with the real figure in the box rather than
   snapping to the nearest button.

   No figure is written in this file, here or anywhere else — a guard test fails
   on a dollar amount in the portal HTML, and these presets are numbers the
   `money()` helper decorates at render time. */
const RETAINER_PRESETS = [1500, 2000, 3000];

/* Null means "not a usable amount", which is how the caller distinguishes an
   empty Custom box from a real choice. Currency decoration is stripped because
   an admin who types a currency symbol and a comma has said exactly what they
   meant. */
function wizRetainerWanted(w){
  const raw = w.retainerPick === "custom" ? w.retainerCustom : w.retainerPick;
  const n = Number(String(raw == null ? "" : raw).replace(/[$,\s]/g, ""));
  return Number.isFinite(n) && n > 0 ? n : null;
}

function wizRetainerInit(w){
  const v = Number(w.retainer);
  if(!Number.isFinite(v) || v <= 0) return;
  if(RETAINER_PRESETS.includes(v)){ w.retainerPick = String(v); w.retainerCustom = ""; }
  else { w.retainerPick = "custom"; w.retainerCustom = String(v); }
}

function wizRetainerHtml(w){
  if(w.sheet !== "private_retainer") return "";
  const money = n => "$" + Number(n).toLocaleString("en-US");
  const pick = w.retainerPick || String(RETAINER_PRESETS[0]);
  return `<div class="feebox" style="margin:10px 0">
    <label class="f" style="margin:0"><span>Agreed retainer
      <span class="opt">what this client is being asked for</span></span>
      <select id="wiz_ret" data-act="wizRetPick">
        ${RETAINER_PRESETS.map(v => `<option value="${v}"${pick === String(v) ? " selected" : ""}
          >${money(v)}${v === RETAINER_PRESETS[0] ? " Standard" : ""}</option>`).join("")}
        <option value="custom"${pick === "custom" ? " selected" : ""}>Custom amount&hellip;</option>
      </select></label>
    ${pick === "custom" ? `<label class="f" style="margin:8px 0 0"><span>Custom retainer</span>
      <input id="wiz_retc" inputmode="decimal" placeholder="e.g. 2500"
        data-act-input="wizRetDirty" value="${esc(w.retainerCustom || "")}"></label>` : ""}
    <p class="hint">${w.retainerUnrecorded
      /* Said plainly, because the difference is invisible otherwise: the client
         is quoted this figure and the office cannot look it up afterwards. */
      ? `This figure will be quoted on the sheet and in the email, but there is no case to
         record it against, so <b>nothing is stored</b>. Add the case number, or set the
         retainer on the case once it exists.`
      : !w.caseNo
      ? `Quoted on this send. With no case number there is nowhere to record it, so it is not
         stored &mdash; add one to keep the agreed figure against the case.`
      : w.retainer == null
        /* Honest about what is on screen: this is the standard figure, not a
           reading of the case. Saying otherwise would invite an admin to treat
           an unloaded default as confirmation of what the client agreed. */
        ? `Preview reads back what <b>${esc(w.caseNo)}</b> has already agreed. Change this only to
           agree a different figure &mdash; leaving it alone keeps whatever the case holds.`
        : `This becomes the agreed retainer for <b>${esc(w.caseNo)}</b>, and is what the sheet, the
           subject line and the payment block all carry. The hourly rate and the four-hour minimum
           do not change.`}</p>
  </div>`;
}

/* Written on the way to Preview, so the preview is the document that will
   actually be sent — the same reason the sheet itself is re-read there. If this
   write fails the admin does not advance, rather than previewing a figure the
   case does not hold.

   It sends ONLY the amount. An absent `received` now means "unchanged" in the
   Worker, so changing what was agreed can never un-receive a retainer that was
   genuinely paid. */
async function wizRetainerSave(){
  const w = SHEET_WIZ;
  if(!w || w.sheet !== "private_retainer") return true;
  /* NOTHING IS WRITTEN UNLESS SOMEONE CHOSE SOMETHING, and this guard is the
     whole safety of the feature.

     Opened from Rate sheets there is no case number yet, so the selector shows
     the standard figure because it has nothing else to show. Writing that
     untouched default on the way to Preview would cut a case that had agreed a
     larger retainer back to the standard one — silently, as a side effect of
     looking at an email. An untouched selector is not a choice, and the case
     keeps what it agreed. */
  if(!w.retainerTouched) return true;
  const want = wizRetainerWanted(w);
  if(want == null){
    w.err = "Enter the custom retainer as a dollar amount above zero.";
    return false;
  }
  if(w.retainer != null && want === w.retainer) return true;
  /* A FIGURE WITH NOWHERE TO LIVE IS STILL THE FIGURE BEING QUOTED.

     This used to refuse: no case number meant no record, so the send stopped.
     Pre-case sends (#127) made that wrong — the case number is an optional
     subject-line reference, and the whole point is emailing someone who is not
     on the desk yet. Worse, a reference that was TYPED but matched no case hit
     the write below and came back a bare "not found", which read as though the
     send itself had failed.

     So the figure is carried instead. It travels with the preview and with the
     email, resolved by one helper server-side, so the screen and the client
     still cannot disagree — that was the real defect in #123, and persisting
     first was only ever one way to prevent it. What is NOT done is invent a
     case to store it against. The office is told plainly that it was not
     recorded. */
  if(!w.caseNo){ w.retainerOffered = want; w.retainerUnrecorded = true; return true; }
  try{
    await api(`/cases/${encodeURIComponent(w.caseNo)}/retainer`,
      {method:"POST", body:{retainer_amount: want}});
    w.retainer = want;
    w.retainerOffered = null;
    w.retainerUnrecorded = false;
    return true;
  }catch(e){
    /* A reference matching no case is not an error on this screen — it is the
       ordinary pre-case send. Carry the figure and say so. Anything else is a
       real failure and still stops, because silently swallowing every error
       here would hide a genuine one. */
    if(/not found/i.test(e.message || "")){
      w.retainerOffered = want; w.retainerUnrecorded = true; return true;
    }
    w.err = e.message; return false;
  }
}

/* THE SHEET THIS CASE WILL BE SENT, not the standard one. `SHEETS` is fetched
   once at sign-in with no case in hand, so it always carries the default
   retainer; a case that agreed a different figure has to re-read the sheet for
   itself, or the admin previews one number and the client receives another —
   which is what was happening. Failure leaves the
   default sheet in place rather than emptying the preview — a stale figure is
   corrected by the Worker at send time, a blank screen helps nobody. */
async function wizSheetLoad(){
  const w = SHEET_WIZ;
  /* A carried figure has to be re-read too, or a pre-case send previews the
     standard sheet while the email carries the agreed one — the same screen /
     client split, arriving through the new door. */
  if(!w || (!w.caseNo && w.retainerOffered == null)) return;
  try{
    const q = `case=${encodeURIComponent(w.caseNo || "")}`
      + (w.retainerOffered != null ? `&retainer=${encodeURIComponent(w.retainerOffered)}` : "");
    const r = await api(`/sheets?${q}`);
    if(SHEET_WIZ === w){
      w.sheetData = (r.sheets || []).find(s => s.id === w.sheet) || null;
      /* The selector opens on what the case ALREADY agreed — but never on top
         of a choice the admin has just made. Without the `retainerTouched`
         guard the re-read on the way to Preview would snap the figure they just
         chose back to whatever was stored a moment earlier. */
      if(r.retainer != null){
        w.retainer = Number(r.retainer);
        if(!w.retainerTouched) wizRetainerInit(w);
      }
    }
  }catch(e){ /* keep the default sheet */ }
  paint();
}

function sheetWizardHtml(){
  const w = SHEET_WIZ;
  const sheet = w.sheetData || SHEETS.find(s => s.id === w.sheet) || {};
  const intakeLabel = w.sheet === "insurance_assignment"
    ? "Insurance Assignment Intake" : "Private Client Intake";
  /* The include-intake choice lives on the FIRST screen (owner, 2026-08-14).
     It used to be a second step called Options, which meant it existed and
     was tested and the owner still never saw it — a control you must click
     Next to discover is not a visible option. One screen asks everything;
     Preview shows exactly what will go. */
  const steps = ["Recipient & options", "Preview"];
  const rail = `<div class="pkg-steps">${steps.map((s2, i) =>
    `<span class="pkg-step ${w.step > i + 1 ? "done" : w.step === i + 1 ? "on" : ""}">${
      w.step > i + 1 ? "&#10003;" : i + 1} ${s2}</span>`).join("")}</div>`;
  const body =
    w.step === 1 ? `
      <label class="f"><span>Send it to</span>
        <input id="wiz_to" type="email" value="${esc(w.to)}" placeholder="name@example.com"></label>
      <div class="two">
        <label class="f"><span>Case number <span class="opt">optional — subject line</span></span>
          <input id="wiz_case" value="${esc(w.caseNo)}"></label>
        <label class="f"><span>Add a line <span class="opt">optional</span></span>
          <input id="wiz_note" value="${esc(w.note)}" placeholder="e.g. As discussed this morning."></label>
      </div>
      <label class="cap" style="display:flex"><input type="checkbox" id="wiz_inc" ${w.include ? "checked" : ""}>
        <span>Include the <b>${intakeLabel}</b> form link</span></label>
      <p class="hint">The matching intake is paired automatically. ${w.sheet === "insurance_assignment"
        ? "Carriers land on the Secure Assignment Intake — never the consumer picker."
        : "Private clients land on the private intake — the carrier path is never offered."}</p>
      ${wizRetainerHtml(w)}
      ${wizPaymentHtml(w)}`
    : `
      <dl class="detail">
        <dt>Sheet</dt><dd>${esc(sheet.name || w.sheet)}</dd>
        <dt>To</dt><dd>${esc(w.to)}</dd>
        ${w.caseNo ? `<dt>Case</dt><dd>${esc(w.caseNo)}</dd>` : ""}
        ${w.sheet === "private_retainer" && (w.retainerOffered != null || w.retainer != null)
          /* The figure is named on the last screen before it goes, and said to
             be unrecorded where it is — this is the admin's final chance to add
             a case number, and after Send there is nothing to look it up by. */
          ? `<dt>Agreed retainer</dt><dd>$${esc(Number(
               w.retainerOffered != null ? w.retainerOffered : w.retainer).toLocaleString("en-US"))}${
               w.retainerUnrecorded
                 ? ` <span class="opt">quoted on this send &mdash; nothing is stored, there is no case to record it against</span>`
                 : ""}</dd>` : ""}
        ${w.note ? `<dt>Added line</dt><dd>${esc(w.note)}</dd>` : ""}
        <dt>Intake form</dt><dd>${w.include ? intakeLabel + " link included" : "Not included"}</dd>
        ${w.sheet === "private_retainer" ? `<dt>Payment options</dt><dd>${
          w.pay && (w.payMethods || []).length
            ? wizPaymentSendable().filter(m => w.payMethods.includes(m.id))
                .map(m => esc(m.display_name || m.label)).join(" + ")
            : "Not included"}</dd>` : ""}
      </dl>
      <p class="hint">The email is the sheet exactly as shown on this page${w.include ? ", plus the intake button" : ""}${
        w.sheet === "private_retainer" && w.pay && (w.payMethods || []).length ? ", plus the payment buttons" : ""}.
        Sending payment instructions does not mark the retainer paid.</p>`;
  return `<div class="amwrap" data-act="wizClose">
    <div class="amsheet" data-act="amNoop" role="dialog" aria-modal="true" aria-label="Send the rate sheet">
      <div class="amhead"><b>Send &mdash; ${esc(sheet.selector_label || sheet.name || "")}</b>
        <button class="amx" data-act="wizClose" aria-label="Close">&times;</button></div>
      ${rail}
      ${body}
      <div class="actions" style="margin-top:12px">
        ${w.step > 1 ? `<button class="btn ghost sm" data-act="wizStep" data-s="${w.step - 1}">&larr; Back</button>` : ""}
        ${w.step < 2 ? `<button class="btn sm" data-act="wizStep" data-s="${w.step + 1}">Preview &rarr;</button>`
          : `<button class="btn sm" data-act="wizSend">Send it</button>`}
      </div>
      ${w.err ? `<div class="err">${esc(w.err)}</div>` : ""}
    </div>
  </div>`;
}

/* SEND PAYMENT OPTIONS, standing alone (PAYMENTS.md second handoff §4).

   Two screens, the same shape as the sheet wizard so it reads as one product:
   ask, then preview exactly what will go. It deliberately does NOT offer the
   rate sheet or the intake — this exists precisely so instructions can follow
   later without resending either.

   Only methods that are actually sendable are offered, which is the same rule
   the wizard uses: a method with no admin-entered link cannot be ticked here,
   because the Worker would refuse the send and the client would have been shown
   an option they could not tap. Nothing on this screen ever derives a URL from
   a handle. */
function paySendHtml(){
  const q = PAY_SEND;
  const usable = wizPaymentSendable();
  const body = !PAYCFG
    ? `<p class="hint">Checking payment options&hellip;</p>`
    : !usable.length
      ? `<div class="feebox">
          <div class="row"><span><b>Payment options</b></span><span class="tag new">None ready</span></div>
          <p class="hint">No payment method is switched on with a payment link, so there is nothing
            to send. Settings &rarr; Private client payment methods.</p></div>`
    : q.step === 1 ? `
      <label class="f"><span>Send it to</span>
        <input id="ps_to" type="email" value="${esc(q.to)}" placeholder="name@example.com"></label>
      <div class="two">
        <label class="f"><span>Their name <span class="opt">optional — greets the email</span></span>
          <input id="ps_name" value="${esc(q.name)}"></label>
        <label class="f"><span>Case reference <span class="opt">optional — subject line</span></span>
          <input id="ps_case" value="${esc(q.caseNo)}"></label>
      </div>
      <label class="f"><span>Add a line <span class="opt">optional</span></span>
        <input id="ps_note" value="${esc(q.note)}" placeholder="e.g. As discussed this morning."></label>
      <div class="feebox" style="margin:10px 0">
        <div class="row"><span><b>Payment methods</b></span></div>
        ${usable.map(m => `<label class="cap" style="display:flex">
          <input type="checkbox" class="ps-pm" data-pm="${esc(m.id)}"
            ${(q.methods || []).includes(m.id) ? "checked" : ""}>
          <span>${esc(m.display_name || m.label)} <span class="opt">${esc(m.handle)}</span></span></label>`).join("")}
        <p class="hint">Either or both. Each is a button the client taps.</p>
      </div>`
    : `
      <dl class="detail">
        <dt>To</dt><dd>${esc(q.to)}${q.name ? ` (${esc(q.name)})` : ""}</dd>
        ${q.caseNo ? `<dt>Case</dt><dd>${esc(q.caseNo)}</dd>` : ""}
        ${q.note ? `<dt>Added line</dt><dd>${esc(q.note)}</dd>` : ""}
        <dt>Payment methods</dt><dd>${(q.methods || []).length
          ? usable.filter(m => q.methods.includes(m.id))
              .map(m => esc(m.display_name || m.label)).join(" + ")
          : "None chosen"}</dd>
        <dt>Rate sheet</dt><dd>Not included &mdash; this sends the payment instructions only</dd>
      </dl>
      <p class="hint">The client receives the payment buttons and nothing else.
        Sending instructions does not mark the retainer paid; it stays pending until
        you record the money.</p>`;
  const ready = PAYCFG && usable.length;
  return `<div class="amwrap" data-act="paySendClose">
    <div class="amsheet" data-act="amNoop" role="dialog" aria-modal="true" aria-label="Send payment options">
      <div class="amhead"><b>Send payment options</b>
        <button class="amx" data-act="paySendClose" aria-label="Close">&times;</button></div>
      ${ready ? `<div class="pkg-steps">${["Recipient & methods", "Preview"].map((s2, i) =>
        `<span class="pkg-step ${q.step > i + 1 ? "done" : q.step === i + 1 ? "on" : ""}">${
          q.step > i + 1 ? "&#10003;" : i + 1} ${s2}</span>`).join("")}</div>` : ""}
      ${body}
      ${ready ? `<div class="actions" style="margin-top:12px">
        ${q.step > 1 ? `<button class="btn ghost sm" data-act="paySendStep" data-s="1">&larr; Back</button>` : ""}
        ${q.step < 2
          ? `<button class="btn sm" data-act="paySendStep" data-s="2">Preview &rarr;</button>`
          : `<button class="btn sm" data-act="paySendGo"${q.busy ? " disabled" : ""}>${
              q.busy ? "Sending&hellip;" : "Send it"}</button>`}
      </div>` : ""}
      ${q.err ? `<div class="err">${esc(q.err)}</div>` : ""}
    </div>
  </div>`;
}

function paySendCollect(){
  if(!PAY_SEND) return;
  if($("ps_to")) PAY_SEND.to = $("ps_to").value.trim();
  if($("ps_name")) PAY_SEND.name = $("ps_name").value.trim();
  if($("ps_case")) PAY_SEND.caseNo = $("ps_case").value.trim();
  if($("ps_note")) PAY_SEND.note = $("ps_note").value.trim();
  const boxes = [...document.querySelectorAll(".ps-pm")];
  if(boxes.length) PAY_SEND.methods = boxes.filter(b => b.checked).map(b => b.dataset.pm);
}

async function paySendGo(){
  paySendCollect();
  const q = PAY_SEND;
  q.busy = true; q.err = ""; paint();
  try{
    const r = await api("/payment-options/email", {method:"POST", body:{
      to: q.to, name: q.name, case_no: q.caseNo, note: q.note, methods: q.methods}});
    /* §13 — the confirmation says what actually WENT, read back from the
       Worker's answer rather than from the boxes that were ticked, and states
       the one thing an admin might otherwise assume. */
    const names = (r.included.payment_methods || []).map(m => m.label).join(" and ");
    const msg = `Payment options sent to ${r.sent_to}${names ? ` — ${names}` : ""}. `
              + `The retainer is still pending until you record it.`;
    /* The dialog opens from two places — a lead card and the pre-case screen —
       and the confirmation has to land where the admin is actually standing. */
    LEAD_MSG = msg; SEND_MSG = msg;
    PAY_SEND = null;
    if(TAB === "sheets") loadSends();
    return render();
  }catch(e){ q.err = e.message; q.busy = false; }
  paint();
}

/* SENDING BEFORE A CASE EXISTS (owner, 2026-08-15 — PRE-CASE SENDS).

   The sends themselves never required a case, but until now the intake and the
   payment options could only be reached from a LEAD CARD, so in practice you
   had to put someone on the desk before you could email them anything. That is
   backwards: the intake is what turns a phone call into a lead.

   This is the door. Name and a valid email are enough; a case number, claim
   number or paper reference is carried if there is one and omitted if not.
   Nothing here creates a lead or a case — the owner was explicit that nothing
   may be conjured just to have something to send against. */
function preCaseSendsHtml(){
  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Send to someone new</h2>
      <span class="count">no case needed</span></div>
    <p class="note">For a caller who is not on the desk yet. A name and an email address are
      enough &mdash; a case or claim number is carried if you have one, and left out if you
      do not. Nothing here creates a lead or a case.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm ghost" data-act="preIntake" data-kind="private">Send private intake</button>
      <button class="btn sm ghost" data-act="preIntake" data-kind="insurance">Send insurance intake</button>
      <button class="btn sm ghost" data-act="prePay">Send payment options</button>
    </div>
    <p class="hint" style="margin-top:8px">The two intakes are separate forms and are never
      interchangeable. Payment options are private-client only and are never offered to a carrier.</p>
    ${SEND_MSG ? `<div class="ok" style="margin-top:8px">${esc(SEND_MSG)}</div>` : ""}
  </div>`;
}

/* The pre-case intake dialog: the smallest thing that can carry the owner's
   rule. The KIND is fixed by the button that opened it and shown as a fact, not
   as a control — an admin who wanted the other form pressed the other button,
   and a picker here would be one more way to send a carrier the consumer door. */
function preIntakeHtml(){
  const q = INTAKE_SEND;
  const label = q.kind === "insurance" ? "Insurance Assignment Intake" : "Private Client Intake";
  return `<div class="amwrap" data-act="preIntakeClose">
    <div class="amsheet" data-act="amNoop" role="dialog" aria-modal="true" aria-label="Send an intake form">
      <div class="amhead"><b>Send &mdash; ${esc(label)}</b>
        <button class="amx" data-act="preIntakeClose" aria-label="Close">&times;</button></div>
      <label class="f"><span>Send it to</span>
        <input id="pi_to" type="email" value="${esc(q.to)}" placeholder="name@example.com"></label>
      <label class="f"><span>Their name <span class="opt">optional &mdash; greets the email</span></span>
        <input id="pi_name" value="${esc(q.name)}"></label>
      <p class="hint">They receive the <b>${esc(label)}</b> and nothing else. No case is created,
        and no rate or payment information is included.</p>
      <div class="actions" style="margin-top:12px">
        <button class="btn sm" data-act="preIntakeGo"${q.busy ? " disabled" : ""}>${
          q.busy ? "Sending&hellip;" : "Send it"}</button>
      </div>
      ${q.err ? `<div class="err">${esc(q.err)}</div>` : ""}

}

async function preIntakeGo(){
  const q = INTAKE_SEND;
  if($("pi_to")) q.to = $("pi_to").value.trim();
  if($("pi_name")) q.name = $("pi_name").value.trim();
  if(!q.to){ q.err = "Enter the address to send it to."; return paint(); }
  q.busy = true; q.err = ""; paint();
  try{
    const r = await api("/intake-link/email", {method:"POST",
      body:{to: q.to, name: q.name, kind: q.kind}});
    SEND_MSG = `${r.intake} sent to ${r.sent_to}. No case was created.`;
    INTAKE_SEND = null;
    loadSends();
    return paint();
  }catch(e){ q.err = e.message; q.busy = false; }
  paint();
}

/* Requirement 6 — the history has to work without a case number. Every other
   view of a send hangs off a case, so a pre-case send was written correctly and
   then invisible. This is where it can be seen. */
/* A FAILED LOAD IS NOT AN EMPTY HISTORY (Codex stop-time review, 2026-08-15).

   This set `SENDS = []` in the catch, and the panel renders an empty list as
   "Nothing sent yet." So a 403, a dropped connection or a Worker hiccup told
   the office that nothing had ever been emailed to anyone — the screen
   asserting a fact it did not have. That is the worst possible failure for this
   particular panel, because its whole job is answering "did that go out?", and
   the wrong answer here is the one that reads as reassuring.

   Three states, kept apart: never loaded, loaded and genuinely empty, and
   failed. Only the middle one may say nothing was sent. */
async function loadSends(){
  try{ SENDS = (await api("/sends?limit=25")).sends || []; SENDS_ERR = ""; }
  catch(e){ SENDS = null; SENDS_ERR = e.message || "The send history did not load."; }
  paint();
}

const SEND_KIND_LABEL = {rate_sheet: "Rate sheet", intake: "Intake form",
  payment_options: "Payment options"};

function sendHistoryHtml(){
  /* The failure is DRAWN, never swallowed into an empty list — see loadSends.
     A Retry is offered because the question this panel answers matters enough
     to ask again, rather than leaving the office to reload the whole portal. */
  if(SENDS_ERR) return `<div class="card">
    <div class="bar"><h2 style="margin:0">Recent sends</h2>
      <span class="tag rs-needs_revision">Did not load</span></div>
    <div class="err">${esc(SENDS_ERR)}</div>
    <p class="hint">This is <b>not</b> the same as nothing having been sent. The history could not
      be read, so what went out is unknown from here.</p>
    <div class="actions"><button class="btn sm ghost" data-act="sendsRetry">Try again</button></div>
  </div>`;
  if(SENDS === null) return "";
  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Recent sends</h2>
      <span class="count">${SENDS.length}</span></div>
    ${!SENDS.length ? `<div class="empty">Nothing sent yet.</div>` : `<div class="rows">
      ${SENDS.map(s => `<div class="row">
        <span>
          <b>${esc(SEND_KIND_LABEL[s.kind] || s.kind)}</b>
          ${s.ok ? "" : `<span class="tag rs-needs_revision">Failed</span>`}
          <div style="font-size:.85rem;color:var(--muted)">${esc(s.recipient)}</div>
          <div style="font-size:.76rem;color:var(--muted)">
            ${s.case_no ? esc(s.case_no) : "No case &mdash; sent before one existed"}
            ${s.sent_by ? ` &middot; ${esc(s.sent_by)}` : ""}</div>
          ${s.ok ? "" : `<div class="hint">${esc(s.detail || "did not send")}</div>`}
        </span>
        <span style="font-size:.8rem;color:var(--muted);white-space:nowrap">${when(s.at)}</span>
      </div>`).join("")}
    </div>`}
  </div>`;
}

/* PHASE 8 — the star. Both roles get it: an investigator has their own handful
   of cases and the same reason to pin one. `.ch-right .btn` already floors it at
   44px, so the target comes for free rather than being restated here. */
function favStarHtml(no){
  if(!no) return "";
  const on = favCases().includes(no);
  return `<button class="btn sm ghost favstar${on ? " on" : ""}" data-act="favCase"
    data-case="${esc(no)}" aria-pressed="${on ? "true" : "false"}"
    title="${on ? "Remove from pinned" : "Pin this case"}">${
    on ? "&#9733; Pinned" : "&#9734; Pin"}</button>`;
}

/* The strip. Pinned first, then recently viewed, and EVERY chip is filtered
   through `CASES` — the authorized list the Worker returned. A stored case
   number the signed-in user cannot see, or one that has been archived, deleted
   or removed, simply does not appear: it is not in `CASES`, so there is nothing
   to draw and nothing stale to draw it from. The chip shows the case NUMBER and
   nothing else, which is also the only thing that was ever stored. */
function recentStripHtml(){
  const known = new Set((CASES || []).map(c => c.case_no));
  const pins = favCases().filter(n => known.has(n));
  const seen = new Set(pins);
  const recent = recentCases().filter(n => known.has(n) && !seen.has(n));
  if(!pins.length && !recent.length) return "";
  const chip = (n, pinned) => `<button class="rvchip${pinned ? " pin" : ""}"
    data-act="openCase" data-case="${esc(n)}">${pinned ? "&#9733; " : ""}${esc(n)}</button>`;
  return `<div class="rvstrip">
    ${pins.length ? `<span class="rvlab">Pinned</span>${pins.map(n => chip(n, true)).join("")}` : ""}
    ${recent.length ? `<span class="rvlab">Recent</span>${recent.map(n => chip(n, false)).join("")}` : ""}
  </div>`;
}

/* WHAT THE SEND SCREEN CAN PUT IN THE EMAIL, named on the sheet before it is
   opened (PAYMENTS.md §2 and §14). The carrier sheet lists its own intake and
   nothing else — §14 forbids the words Payment Options, Cash App and Venmo on
   that side, and the Worker refuses the send outright if one ever rode along
   (`sheetTakesPayment`, worker.js:1131). This is the copy, not the boundary.

   Each sheet is named POSITIVELY, which is the idiom the wizard already uses
   everywhere it gates payment. A sheet id nobody has taught this function about
   gets the wizard's own neutral wording and no payment line, so a future third
   sheet costs a missing detail rather than either naming the wrong intake or
   offering payment instructions to a carrier. */
function sheetIncludables(sheetId){
  if(sheetId === "private_retainer") return ["Private Client Intake Form", "Payment Options"];
  if(sheetId === "insurance_assignment") return ["Insurance Assignment Intake Form"];
  return ["The matching intake form"];
}

function casesView(){
  const q = FILTER.trim().toLowerCase();
  const admin = ME.role === "admin";
  // The list is exactly what the Worker returned. Nothing is appended to it,
  // so every row on this screen is a case that exists.
  /* THIS TABLE IS THE ONLY READER OF THE QUERIED SET. Archived and deleted come
     from their own fetch (CASES_Q); every other lens reads the working list that
     the rest of the page shares. */
  const queried = admin && (CASE_VIEW === "archived" || CASE_VIEW === "deleted");
  const src = queried ? (CASES_Q || []) : CASES;
  const srcTotal = queried ? TOTAL_Q : TOTAL;
  const base = CARD_FILTER
    ? src.filter(c => CARD_FILTER.set.has(c.case_no))
    : src;
  /* MASTER §31 — the Cases tab's lens. Open hides finished work; Completed is
     the artifact desk. Admin-only: an investigator's list is their
     assignments, and the desk carries invoices and client identity. */
  const terminal = c => ["complete", "closed", "cancelled"].includes(c.stage || "") || c.status === "closed";
  const shown = admin && CASE_VIEW === "open" ? base.filter(c => !terminal(c)) : base;
  const rows = shown.filter(c => !q || [c.case_no, c.client_name, c.subject_name, c.carrier, c.claim_number]
    .some(v => (v || "").toLowerCase().includes(q)));

  // Case numbers reach this markup from a public form, so they go in a data
  // attribute read by a delegated listener — never interpolated into script.
  //
  // The client/carrier column is admin-only: the Worker does not send those
  // fields to an investigator at all, so there is nothing to put in it.
  /* UNIT 5 — on a phone this table kept 187px of every row behind an inner
     scroll (measured at 320px). Under 560px the rows draw as stacked records:
     same markup, same handlers, every cell readable — including the columns
     `.hide` drops, which a stacked record has room for. `data-l` is the label
     the stacked cell prints over itself; the table header still owns the
     desktop names. */
  const body = rows.map(c => `
    <tr class="click" data-act="openCase" data-case="${esc(c.case_no)}">
      <td class="mono" data-l="Case">${esc(c.case_no)}</td>
      <td class="hide" data-l="Received">${when(c.created_at)}</td>
      <td data-l="Type"><span class="tag ${c.kind === "claims" ? "claims" : "consumer"}">${c.kind === "claims" ? "Claim" : "Client"}</span>${
        isDemo(c.case_no) ? '<span class="tag demo-tag">Test</span>' : ""}</td>
      ${admin ? `<td data-l="Client / carrier">${esc(c.kind === "claims" ? (c.carrier || "—") : (c.client_name || "—"))}
          ${c.claim_number ? `<div class="mono">${esc(c.claim_number)}</div>` : ""}</td>
      <td class="hide" data-l="Subject">${esc(c.subject_name || "—")}</td>`
      : `<td data-l="Subject">${esc(c.subject_name || "—")}</td>`}
      <td data-l="Status"><span class="tag ${esc(c.stage || c.status)}">${esc(label(c.stage || c.status))}</span></td>
      ${admin ? `<td class="hide" data-l="Assigned">${esc(c.assigned_name || "—")}</td>` : ""}
    </tr>`).join("");

  const more = srcTotal > src.length
    ? `<div class="note">Showing the ${src.length} most recent of ${srcTotal} cases. Search covers what is loaded.</div>` : "";

  const filterChip = CARD_FILTER
    ? `<span class="chip">${esc(CARD_FILTER.label)}: ${CARD_FILTER.set.size}
         <button data-act="clearCardFilter" aria-label="Clear filter">&times;</button></span>`
    : "";

  const lens = admin ? `<div class="lensrow">${
    [["all", "All"], ["open", "Open"], ["completed", "Completed"], ["archived", "Archived"], ["deleted", "Deleted"]].map(([v, l]) =>
      `<button class="lens ${CASE_VIEW === v ? "on" : ""}" data-act="caseView" data-v="${v}">${l}</button>`).join("")
    }</div>` : "";

  if(admin && CASE_VIEW === "completed"){
    return `<div class="card">
      <div class="bar">
        <h2 style="margin:0">Cases</h2>
        <input id="q" placeholder="Search case, client, carrier, claim no." value="${esc(FILTER)}" data-act="filter">
      </div>
      ${lens}
      ${completedDesk(q)}
    </div>`;
  }

  return `<div class="card">
    <div class="bar">
      <h2 style="margin:0">Cases</h2>${filterChip}
      <input id="q" placeholder="${admin ? "Search case, client, carrier, claim no." : "Search case or subject"}" value="${esc(FILTER)}" data-act="filter">
      <span class="count">${rows.length} of ${shown.length}${
        (s => s && (s.claims || s.consumer)
          ? ` · ${s.claims || 0} carrier · ${s.consumer || 0} private` : "")(SUMMARY)}</span>
    </div>
    ${lens}
    ${recentStripHtml()}
    ${more}
    ${rows.length ? `<div class="stacktbl" style="overflow-x:auto"><table>
      <thead><tr><th>Case</th><th class="hide">Received</th><th>Type</th>
      ${admin ? `<th>Client / carrier</th><th class="hide">Subject</th>` : `<th>Subject</th>`}
      <th>Status</th>${admin ? `<th class="hide">Assigned</th>` : ""}</tr></thead>
      <tbody>${body}</tbody></table></div>`
      : casesEmptyHtml(admin, shown.length > 0)}
  </div>`;
}

/* THE EMPTY STATE. Three states, kept apart on purpose, and none of them is
   allowed to invent a case to fill the space.

   "Did not load" is first and separate, because an outage that reads as a
   quiet week is the failure this page has already been bitten by once. Then
   "your search matched nothing", which is about the filter and not the data.
   Only the last one says the portal is genuinely empty, and it says what will
   put something in it — which is what a new admin actually needs to know. */
function casesEmptyHtml(admin, searching){
  const wrap = (title, hint) =>
    `<div class="empty"><div class="empty-title">${esc(title)}</div>
       <div class="empty-hint">${esc(hint)}</div></div>`;

  if(LOAD_ERR) return wrap("The case list did not load.",
    "This is a problem reaching the server, not an empty portal. Reload, and if it keeps happening tell the office before assuming there is no work.");

  if(searching) return wrap("Nothing matches that search.",
    "Clear the search box to see the full list.");

  if(admin && CASE_VIEW === "archived") return wrap("No archived cases.",
    "Archiving a finished case files it here. It keeps everything, and it can be restored at any time.");

  if(admin && CASE_VIEW === "deleted") return wrap("No deleted cases.",
    "A deleted case is kept here and can be put back. Nothing in the portal is removed for good.");

  return admin
    ? wrap("No cases yet.",
        "Intake forms arrive here as cases the moment someone submits one. You can also add a case from Intakes, or create a badged TEST- case from Settings to try the portal out.")
    : wrap("Nothing assigned to you yet.",
        "Cases appear here as soon as an admin assigns one to you. There is nothing to do until then.");
}

/* MASTER §31 — the desk itself. Every finished case with its artifacts one
   tap away, and a button only where the artifact exists (P22: no dead
   controls). The deep links land on the tab that holds the download — the
   reports tab has Print / Save as PDF, the package tab has Download and the
   evidence index inside the document. */
function completedDesk(q){
  if(!COMPLETED) return `<div class="empty">Loading completed cases&hellip;</div>`;
  if(COMPLETED.error) return `<div class="err">${esc(COMPLETED.error)}</div>`;
  let list = COMPLETED.completed || [];
  if(q) list = list.filter(c => [c.case_no, c.client_name, c.subject_name, c.carrier]
    .some(v => (v || "").toLowerCase().includes(q)));
  if(!list.length) return `<div class="empty">${q ? "Nothing completed matches that search."
    : `Nothing is completed yet. A case lands on this desk when its stage is set to
       <b>Complete</b>, it passes the closing checklist, or its client package is finalized.`}</div>`;
  const go = (c, tab, lbl) => `<button class="btn sm ghost" data-act="pkgJump"
      data-case="${esc(c.case_no)}" data-tab="${tab}">${lbl}</button>`;
  return `<div class="donegrid">${list.map(c => `<div class="donecard">
    <div class="dc-top">
      <div>
        <span class="tag ${c.kind === "claims" ? "claims" : "consumer"}">${c.kind === "claims" ? "Claim" : "Client"}</span>
        <span class="tag ${esc(c.stage || "complete")}">${c.stage ? esc(label(c.stage)) : "Package finalized"}</span>
        <div class="mono" style="font-weight:700;margin-top:6px">${esc(c.case_no)}</div>
        <div style="font-size:.87rem;margin-top:2px">${esc(c.kind === "claims" ? (c.carrier || "") : (c.client_name || ""))}</div>
        <div style="font-size:.83rem;color:var(--muted)">${esc(c.subject_name || "")}</div>
      </div>
      <div style="text-align:right;font-size:.79rem;color:var(--muted)">
        ${c.finalized_at ? `Package v${esc(String(c.build_version))} &middot; ${when(c.finalized_at)}` : ""}
        ${c.delivered_at ? `<br>Delivered ${when(c.delivered_at)}` : ""}
        ${c.stage_at ? `<br>${esc(label(c.stage || ""))} ${when(c.stage_at)}` : ""}
      </div>
    </div>
    <div class="dc-acts">
      <button class="btn sm" data-act="openCase" data-case="${esc(c.case_no)}">Open case</button>
      ${c.approved_reports ? go(c, "reports", `Final report${c.approved_reports > 1 ? ` &middot; ${c.approved_reports} days` : ""}`) : ""}
      ${c.evidence_count ? go(c, "evidence", `Case media &middot; ${c.evidence_count}`) : ""}
      ${c.build_id ? go(c, "package", "Client package") : ""}
      ${c.invoice ? go(c, "billing", `Invoice ${esc(c.invoice.invoice_no)}`) : ""}
      ${c.share_url ? `<button class="btn sm" data-act="pkgCopyLink" data-url="${esc(c.share_url)}">Copy video link</button>` : ""}
    </div>
  </div>`).join("")}</div>`;
}

/* REPORTS & PACKAGES (owner, 2026-08-16) — a top-level destination assembled
   from two routes that already existed. `/packages` is the same payload the
   dashboard reads; `/completed` is the desk that was reachable only by turning
   a lens inside Cases, which is a strange place to keep "what did we finish".
   There is no new Worker route, no new query and no new table behind this
   screen, and the dashboard is untouched.

   THE TWO BANDS ARE DERIVED, NOT STORED. "Ready to build" and "Packages ready"
   read the same fields `pkgNextStep` already decides on — an approved report
   with no finalized build, and a finalized build — so the three screens cannot
   disagree about what stage a case is at.

   Both routes are admin-only in the Worker, which is why the investigator's
   rail does not carry this and why the role check below is a guard rather than
   the boundary. The boundary is in `worker.js`, as always. */
function deliveryView(){
  if(ME.role !== "admin") return casesView();
  /* Three states kept apart, the way the case list keeps them: did not load,
     loaded and genuinely empty, and — for the completed half, inside
     completedDesk — failed. An empty screen must never stand in for a screen
     that could not be read. */
  if(!PKGS) return `<div class="card"><div class="empty">Loading reports and packages&hellip;</div></div>`;
  /* The packages read fails to an EMPTY LIST, which draws identically to a desk
     with nothing on it — so "Nothing is waiting on a package" would be a claim
     nobody checked (Codex stop-time review, 2026-08-16). */
  if(!PKGS_OK) return `<div class="card">
    <div class="bar"><h2 style="margin:0">Reports &amp; Packages</h2></div>
    <div class="err">The active-case read did not load, so what is ready to build and what is
      already finalized are unknown &mdash; not nothing. Reload, and if it keeps happening say so
      before assuming there is no work waiting.</div>
    <button class="btn sm ghost" data-act="reload" style="margin-top:10px">Try again</button>
  </div>`;
  const all = PKGS.packages || [];
  const ready = all.filter(p => ["approved", "delivered"].includes(p.report_status)
    && p.build_status !== "finalized");
  const built = all.filter(p => p.build_status === "finalized");

  const band = (title, count, list, empty) => `<div class="card">
    <div class="bar"><h2 style="margin:0">${title}</h2>
      <span class="count">${count}</span></div>
    ${list.length ? `<div class="pkgcards">${list.map(pkgCard).join("")}</div>`
      : `<div class="empty">${empty}</div>`}
  </div>`;

  return `<div class="deliverystack">
    ${band("Ready to build", `${ready.length} awaiting a package`, ready,
      `Nothing is waiting on a package. A case arrives here once its report is
       approved and no client package has been finalized yet.`)}
    ${band("Packages ready", `${built.length} finalized`, built,
      `No finalized packages yet. A package is built and finalized from a
       case's Package tab.`)}
    <div class="card">
      <div class="bar"><h2 style="margin:0">Recently completed</h2>
        <span class="count">closed, complete, or package finalized</span></div>
      ${completedDesk("")}
    </div>
  </div>`;
}

/* UIBUILD P20 — the working material moved off the case list into Settings,
   where trying things out is clearly separate from doing the work. The one
   Hide button stays over the list, and the empty state still offers the
   example, because teaching UI is not a test control. */
/* PRIVATE CLIENT PAYMENT METHODS (PAYMENTS.md §2/§8, owner 2026-08-15).

   This screen exists because the Worker refuses a send when a method is
   switched on with no payment link, and that refusal said "add a link in
   Settings" while no such screen existed — an error with no way to act on it.
   An admin was blocked from sending and had nothing to click.

   PRIVATE CLIENT ONLY. Nothing here is offered on an insurance sheet, a
   carrier email or the insurance wizard; the Worker decides that from the
   sheet id and the page never gets a vote. The handles themselves arrive from
   an admin-only route, so they are not in this file and not in the page source
   an investigator could read — only the labels are.

   NO CREDENTIALS. There is no field for a password, a token or an account
   login, and the Worker has no column to store one. */
function paymentSettingsHtml(){
  if(ME.role !== "admin") return "";
  if(!PAYCFG) return `<div class="card"><div class="bar"><h2 style="margin:0">Private client payment methods</h2></div>
    <div class="empty">Loading payment methods&hellip;</div></div>`;

  const row = m => {
    const clickable = !!(m.url || "").trim();
    /* Show what the admin last typed, not what the server last stored — but
       ONLY where they actually typed something. `d[k] || m[k]` would be the
       bug all over again: an empty string is a deliberate answer ("I cleared
       this"), and falling back on it restores the value they just removed. */
    const d = PAY_DRAFT[m.id];
    const val = k => (d && d[k] !== undefined) ? d[k] : m[k];
    return `<div class="feebox" style="margin:0 0 12px" data-pay="${esc(m.id)}">
      <div class="row"><span><b>${esc(m.label)}</b>${m.from_default
        ? ` <span class="opt">firm default</span>` : ""}</span>
        <span>${m.enabled
          ? (clickable ? `<span class="tag closed">On</span>`
                       : `<span class="tag rs-needs_revision">On, but not sendable</span>`)
          : `<span class="tag new">Off</span>`}</span></div>
      ${d ? `<p class="hint" style="color:var(--bad)"><b>Not saved yet.</b> The boxes below are what
        you typed. The state on the right is what clients get until this saves.</p>` : ""}
      ${m.enabled && !clickable ? `<p class="hint" style="color:var(--bad)">
        This method is switched on but has no payment link, so it cannot be offered to a client
        and a send that includes it will be refused. Add the link below, or switch it off.</p>` : ""}
      <label class="f"><span>Show to the client as</span>
        <input id="pm_name_${esc(m.id)}" value="${esc(val("display_name"))}" placeholder="${esc(m.label)}"></label>
      <label class="f"><span>Handle <span class="opt">shown to the client, exactly as typed</span></span>
        <input id="pm_handle_${esc(m.id)}" value="${esc(val("handle"))}"
          placeholder="${m.id === "venmo" ? "@Your-Venmo-Name" : "$YourCashtag"}"></label>
      <label class="f"><span>Payment link <span class="opt">required while this method is on</span></span>
        <input id="pm_url_${esc(m.id)}" value="${esc(val("url"))}"
          placeholder="${m.id === "venmo" ? "https://venmo.com/u/Your-Venmo-Name" : "https://cash.app/$YourCashtag"}"></label>
      <p class="hint">The link is never built from the handle. A Venmo handle is written with an
        @ and its web address is not &mdash; guessing one from the other sends a client somewhere
        that is not yours. Paste the address from the app.</p>
      <label class="f"><span>Instructions <span class="opt">optional</span></span>
        <input id="pm_note_${esc(m.id)}" value="${esc(val("instructions"))}"
          placeholder="e.g. Include your case number in the note"></label>
      <div class="actions">
        <button class="btn sm" data-act="paySave" data-id="${esc(m.id)}" data-on="1">Save and switch on</button>
        <button class="btn sm ghost" data-act="paySave" data-id="${esc(m.id)}" data-on="0">Save and switch off</button>
      </div>
    </div>`;
  };

  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Private client payment methods</h2></div>
    <p class="note">Where a private client sends the retainer. These appear only on the
      <b>private</b> rate sheet and its send flow &mdash; never on an insurance sheet, a carrier
      email, or anything an investigator can see.</p>
    ${PAY_MSG ? `<div class="${PAY_ERR ? "err" : "linkbox"}">${esc(PAY_MSG)}</div>` : ""}
    ${PAYCFG.map(row).join("")}
    <p class="hint">No password, login or account credential is stored here, and there is nowhere
      to put one. Everything on this screen is information the firm hands a client on purpose.</p>
  </div>`;
}

/* WHO GETS TOLD, AND ABOUT WHAT (owner request, 2026-08-16).

   Every number and address here is typed by an admin and lives in the database.
   Nothing is seeded, nothing is hardcoded, and the page holds no provider
   credential — it does not know how anything is delivered and does not need to.

   The alert wording is composed by the WORKER and shown here as a preview, so
   the office reads the exact words that would leave rather than a description of
   them, and so the preview cannot drift from the alert. */
let NOTIFY = null;        // {recipients, events, delivery} — null until loaded
let NOTIFY_ERR = "";      // a failed load is NOT an empty list; see loadSends
let NOTIFY_MSG = "";
let NOTIFY_NEW = false;   // is the add form open

async function loadNotify(){
  NOTIFY_ERR = "";
  try{ NOTIFY = await api("/notify-recipients"); }
  catch(e){ NOTIFY = null; NOTIFY_ERR = e.message; }
  paint();
}

function notifySettingsHtml(){
  if(ME.role !== "admin") return "";
  const evs = (NOTIFY && NOTIFY.events) || [];
  const rows = (NOTIFY && NOTIFY.recipients) || [];
  const del = (NOTIFY && NOTIFY.delivery) || {};
  /* Three states kept apart, the same rule the send history follows: never
     loaded, loaded and genuinely empty, and failed. Only the middle one may say
     nobody is set up. */
  const body = NOTIFY_ERR
    ? `<div class="err">The notification settings could not be loaded &mdash; ${esc(NOTIFY_ERR)}</div>`
    : !NOTIFY
      ? `<div class="empty">Loading notification settings&hellip;</div>`
      : `${rows.length ? rows.map(r => notifyRowHtml(r, evs)).join("") : `
          <p class="hint">Nobody is set up to be told yet. Add a phone number or an email address
            and choose which alerts it should get.</p>`}
        ${NOTIFY_NEW ? notifyFormHtml(null, evs) : `<div class="actions">
          <button class="btn sm" data-act="ntAdd">Add a recipient</button></div>`}`;

  return `<div class="card">

/* WHERE THE FIRM'S CASE FILES ACTUALLY ARE (owner, 2026-08-18).

   Since the Dropbox move, every new photograph and generated report goes to the
   firm's own Dropbox App Folder — and the portal said so NOWHERE. An admin
   could not tell whether the connection was alive, which account it was, or how
   to get to the files outside the portal. The plumbing was all built; only the
   window was missing.

   THIS IS NOT A FILE MANAGER, deliberately (owner: "use existing Dropbox
   backend; do not build a file manager"). Nothing here lists, renames, moves,
   deletes or downloads a file. Case media is already in the gallery, proxied
   through the Worker where the case's permission checks are. What this adds is
   the one thing the portal genuinely could not do: get you to the folder.

   EVERY VALUE IS THE WORKER'S. Connection, account, the three folder names and
   the URL template all arrive from `/dropbox/status`; this page substitutes a
   case number into a template it is given and assembles no path of its own.

   ADMIN ONLY, like all four Dropbox routes. `/status` names the connected
   account, and an investigator has no business holding the firm's connection
   open or closed. */
let DBX = null;        // the Worker's dropbox state — null until loaded
let DBX_ERR = "";      // a failed load is NOT "disconnected"; see loadSends
let DBX_MSG = "";
let DBX_SAVING = false;
/* WHAT THEY TYPED, WHEN THE WORKER REFUSED IT — the rule PAY_DRAFT exists for.
   Every paint rebuilds the input from `DBX.folder_name`, so without this a name
   refused for a bad character reverted to the stored one while the error still
   described the name they typed. `null` means untouched; an empty string is a
   deliberate answer and must survive as one. */
let DBX_DRAFT = null;

async function loadDropbox(){
  if(!ME || ME.role !== "admin") return;
  DBX_ERR = "";
  try{ DBX = (await api("/dropbox/status")).dropbox; }
  catch(e){ DBX = null; DBX_ERR = e.message; }
  paint();
}

/* The one place a case's Dropbox link is built, and it is a SUBSTITUTION into
   the Worker's template rather than a path this page knows how to write.
   Returns [] when there is no template — no folder name recorded, or nothing
   connected — because a link that goes to the wrong place is worse than no
   link. Case numbers are pinned to [A-Za-z0-9-] at ingest so encoding them
   changes nothing; it is here because relying on that from a second file is
   how the pinning stops being checked. */
function dbxCaseLinks(caseNo){
  if(!DBX || !DBX.case_url_template || !DBX.connected || !caseNo) return [];
  return (DBX.folders || []).map(f => ({
    name: f,
    url: DBX.case_url_template
      .replace("{case}", encodeURIComponent(caseNo))
      .replace("{folder}", encodeURIComponent(f)),
  }));
}

/* Opens the firm's own Dropbox in the browser. It is NOT a shared link: it
   carries no token and no bytes, and someone signed in to a different Dropbox
   account sees nothing. `noreferrer` keeps the portal's own URL — which
   contains the case number — out of Dropbox's Referer header. */
function dbxLink(url, label, cls){
  return `<a class="${cls}" style="display:inline-block;text-decoration:none" href="${esc(url)}"
    target="_blank" rel="noopener noreferrer">${label}</a>`;
}

function dbxCaseLinksHtml(caseNo){
  if(ME.role !== "admin") return "";
  const links = dbxCaseLinks(caseNo);
  if(!links.length) return "";
  return `<div class="rc-h" style="margin:14px 0 6px"><b>In Dropbox</b></div>
    <p class="hint" style="margin-top:0">The firm's own Dropbox, opened in a new tab. These are
      the folders this case's files are stored in &mdash; nothing is shared and nobody signed in
      to a different Dropbox account can open them. A folder appears once something has been
      stored in it.</p>
    <div class="actions">${links.map(l =>
      dbxLink(l.url, `${esc(l.name)} &#8599;`, "btn sm ghost")).join("")}</div>`;
}

  const head = `<div class="bar"><h2 style="margin:0">Dropbox &mdash; where case files are stored</h2></div>`;

        ? `<p class="hint">Nothing is connected, so new photographs and generated reports cannot

  const folderBox = `<label class="f"><span>App Folder name

        DBX_SAVING ? "disabled" : ""}>Clear</button>` : ""}
    </div>
    <p class="hint">Dropbox does not tell an app what its own App Folder was named, and the web

        ? `Case folder links below and on every case use it.`
        : `Until it is filled in, <b>Open Dropbox</b> goes to your Apps folder and there are no

           click.`} It is not a credential and no file is stored using it.</p>`;

  return wrap(`
    <div class="row"><span>Connection</span><span>${state}</span></div>

    <p class="note">New case photographs and generated reports are stored in the firm's own

    <div class="actions">

         "btn sm ghost")}
      ${d.app_configured && !d.not_set_up
        ? (d.connected
            ? (d.source === "worker secret" ? "" : `<button class="btn sm ghost" data-act="dbxDisconnect">Disconnect</button>`)

    ${folderBox}

    <p class="hint">Nothing on this screen lists, moves or downloads a file, and no link here is a
      Dropbox <i>shared</i> link &mdash; each one opens the firm's own Dropbox and shows nothing to
      anyone signed in elsewhere. Case files themselves are served through the portal, where the

}

async function saveDropboxFolder(clear){
  /* READ THE BOX BEFORE PAINTING. This is the EDIT_DRAFT rule and I broke it
     exactly as written: `paint()` rebuilds the inputs from `DBX`, so painting
     the "Saving…" state first wiped the admin's typed name and the save then
     sent an EMPTY value — and reported "Cleared." as though that had been
     asked for. The name they typed was destroyed by the act of saving it.
     Anything that repaints must collect first. */
  const el = $("dbx_folder");
  const name = clear ? "" : (el ? el.value.trim() : "");
  DBX_MSG = ""; DBX_SAVING = true; paint();
  try{
    const r = await api("/dropbox/folder", {method:"POST", body:{folder_name: name}});
    DBX = r.dropbox; DBX_ERR = ""; DBX_DRAFT = null;
    DBX_MSG = name ? "Saved. Case folder links use this name." : "Cleared.";
  }catch(e){ DBX_MSG = e.message; DBX_DRAFT = name; }
  DBX_SAVING = false; paint();
}

async function disconnectDropbox(){
  if(!confirm("Disconnect the firm's Dropbox? New photographs and reports cannot be stored "
    + "until it is reconnected. Files already saved are not touched.")) return;
  DBX_MSG = "";
  try{
    const r = await api("/dropbox/disconnect", {method:"POST", body:{}});
    DBX = r.dropbox; DBX_ERR = "";
    DBX_MSG = r.detail || "Disconnected.";
  }catch(e){ DBX_MSG = e.message; }
  paint();
}

/* ------------------------------------------------ storage health (Unit 14)

   The Settings panel that answers where the bytes are, from the one admin
   route. Three states, per the standing rule: a failed read must never draw
   as an empty store — the difference between "nothing is stored" and "the
   meter could not be read" is the whole reason the failsafe exists. */
let SH = { state: "never", data: null };
async function loadStorageHealth(force){
  if(SH.state === "loading") return;
  if(SH.state === "ok" && !force) return;
  SH.state = "loading"; paint();
  /* api() THROWS on a failed status, and a thrown read must land in the
     failed state — not in a stuck spinner with a page error behind it. */
  try{
    const res = await api("/storage-health");
    SH = (res && res.cloudflare) ? { state: "ok", data: res } : { state: "failed", data: null };
  }catch{ SH = { state: "failed", data: null }; }
  paint();
}
function shBytes(b){
  if(b == null) return "—";
  if(b >= 1073741824) return (b / 1073741824).toFixed(2) + " GB";
  if(b >= 1048576) return (b / 1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(b / 1024)) + " KB";
}
function shMeter(pct, warn){
  if(pct == null) return "";
  const tone = pct >= (warn || 75) ? "background:var(--warn)" : "background:var(--teal)";
  return `<div class="shbar"><div class="shfill" style="width:${Math.min(100, Math.max(0, pct))}%;${tone}"></div></div>`;
}
function storageHealthHtml(){
  if(ME.role !== "admin") return "";
  const head = `<div class="bar"><h2 style="margin:0">Storage health</h2>
    <button class="btn sm ghost" data-act="shRefresh">Refresh</button></div>
    <p class="note">Where the bytes are, from the records the portal already holds.
      Nothing here reads a file or changes anything.</p>`;
  if(SH.state === "never" || SH.state === "loading")
    return `<div class="card">${head}<div class="empty">Reading the storage record&hellip;</div></div>`;
  if(SH.state === "failed")
    return `<div class="card">${head}
      <div class="loaderr">The storage record could not be read just now. That is not the same as
        nothing being stored. <button class="btn sm ghost" data-act="shRefresh">Try again</button></div></div>`;
  const d = SH.data, cf = d.cloudflare, dbx = d.dropbox;
  const integ = d.integrity;
  const top = d.top_cases || [];
  const rd = d.readiness || {};
  const fails = d.failures;
  return `<div class="card">${head}
    <div class="tl-m" style="margin-bottom:6px">Safe to store right now:
      ${rd.ok ? `<span class="tag rs-approved">Yes &mdash; Dropbox is connected and answering</span>`
              : `<span class="tag rs-needs_revision">No &mdash; ${esc(rd.code || "unknown")}</span>`}
      ${dbx.last_upload_at ? `&middot; last successful upload ${when(dbx.last_upload_at)}` : "&middot; nothing has been uploaded yet"}</div>
    <h3 style="margin:8px 0 4px;font-size:1rem">Cloudflare (legacy files)</h3>
    <div class="tl-m">${shBytes(cf.live.bytes)} in ${cf.live.count} file(s) &middot;
      ${cf.percent_of_free}% of the free tier ${cf.percent_of_free >= cf.warn_at ? `<span class="tag new">over ${cf.warn_at}%</span>` : ""}</div>
    ${shMeter(cf.percent_of_free, cf.warn_at)}
    <div class="tl-m" style="margin-top:4px">Of that, video: <b>${shBytes(cf.live_video.bytes)}</b> in
      ${cf.live_video.count} file(s) &mdash; whether to export and remove legacy video is
      <b>an open decision nobody has made</b>; this screen informs it and does not perform it.</div>
    <div class="tl-m">${cf.deleted_rows} removed file record(s) kept as history.</div>

    <h3 style="margin:14px 0 4px;font-size:1rem">Dropbox (current case files)</h3>
    <div class="tl-m">${shBytes(dbx.live.bytes)} in ${dbx.live.count} file(s) &middot;
      ${dbx.video_copies_filed == null ? "" : `${dbx.video_copies_filed} timestamped video cop${dbx.video_copies_filed === 1 ? "y" : "ies"} filed &middot;`}
      ${dbx.report_pdfs_filed} report PDF(s) filed</div>
    ${dbx.space
      ? `<div class="tl-m">Account: <b>${shBytes(dbx.space.used_bytes)}</b>${dbx.space.allocated_bytes ? ` of ${shBytes(dbx.space.allocated_bytes)}` : ""}
          ${dbx.space.percent_used != null ? `(${dbx.space.percent_used}%)` : ""} used</div>
        ${shMeter(dbx.space.percent_used, 75)}`
      : `<div class="tl-m">Account usage could not be read just now
          <span class="opt">(${esc(dbx.space_reason || "unknown")})</span> &mdash; unknown, not zero.</div>`}
    <div class="tl-m">${dbx.deleted_rows} removed file record(s) kept as history.</div>

    <h3 style="margin:14px 0 4px;font-size:1rem">Integrity coverage</h3>
    ${integ
      ? `<div class="tl-m">${integ.with_hash} of ${integ.live_files} live file(s) carry a recorded
          SHA-256${integ.not_yet_recorded ? ` &middot; <b>${integ.not_yet_recorded}</b> not yet recorded
          &mdash; each records from its own card, one file at a time` : " &mdash; every live file is covered"}.</div>`
      : `<div class="tl-m">Unknown &mdash; the integrity table has not arrived on this database.</div>`}

    <h3 style="margin:14px 0 4px;font-size:1rem">Failed uploads</h3>
    ${fails === null || fails === undefined
      ? `<div class="tl-m">Unknown &mdash; the failure log has not arrived on this database.
          Run the <b>portal-setup</b> workflow once.</div>`
      : fails.total === 0
      ? `<div class="tl-m">None recorded. A refusal is logged the moment it happens, so this
          reading means no storage write has been refused since the log began.</div>`
      : `<div class="tl-m"><b>${fails.total}</b> refused storage write(s) on record. Most recent:</div>
        ${fails.recent.slice(0, 5).map(f => `<div class="tl-m">&bull; ${when(f.at)} &mdash;
          ${esc(f.kind)}${f.case_no ? ` on ${esc(f.case_no)}` : ""}${f.filename ? ` (${esc(f.filename)})` : ""}
          &mdash; <span class="tag rs-needs_revision">${esc(f.reason)}</span>${f.who ? ` &middot; ${esc(f.who)}` : ""}</div>`).join("")}`}

    ${top.length ? `<h3 style="margin:14px 0 4px;font-size:1rem">Heaviest cases</h3>
      <table class="stacktbl shtbl"><thead><tr><th>Case</th><th>Files</th><th>Dropbox</th><th>Legacy</th></tr></thead>
      <tbody>${top.map(t => `<tr>
        <td data-l="Case"><button class="linklike" data-act="openCase" data-no="${esc(t.case_no)}">${esc(t.case_no)}</button></td>
        <td data-l="Files">${t.files}</td>
        <td data-l="Dropbox">${shBytes(t.dropbox_bytes)}</td>
        <td data-l="Legacy">${shBytes(t.r2_bytes)}</td>
      </tr>`).join("")}</tbody></table>` : ""}
    <p class="hint">Read ${when(d.generated_at)}. The public health probe and the dashboard card
      keep their jobs; this is where the numbers behind them live.</p>
  </div>`;
}

    <p class="hint">A test case is a real row prefixed TEST-, badged wherever it appears, so you can
      work through the portal with something in it. Removing test cases removes every TEST- case and
      everything recorded against it &mdash; days, activity, reports, invoices, evidence and packages
      &mdash; and never touches a real case.</p>
    <p class="hint">There are deliberately no fabricated example cases. An empty list says it is
      empty rather than showing an invented client.</p>
  </div>`;
}

/* Recording is one call to the route that already owns the retainer, so the
   amount and the receipt move together and cannot disagree. `received: false`
   is the way back — the Worker deletes the receipt with the flag, because a
   case must not keep asserting a payment it no longer claims to have. */
async function recordRetainerPayment(received){
  const v = id => { const el = $(id); return el ? el.value.trim() : ""; };
  RET_MSG = ""; RET_ERR = false; RET_STUCK = false;
  const body = { received };
  if(received){
    const amt = v("ret_amt"), meth = v("ret_method"), date = v("ret_date"), ref = v("ret_ref");
    RET_DRAFT = { amt, meth, date, ref };
    /* AN AMOUNT IS REQUIRED HERE. Sent without one, `received: true` is the
       office ticking "the money is in" without saying how much — a flag with no
       payment behind it, so the case reads as received while the Received line
       shows nothing and Outstanding shows the whole retainer. That is not what anyone
       pressing THIS button means, and it was reachable by accident: a repaint
       emptied the field, so the press after a failure sent nothing. */
    if(!(Number(amt) > 0)){
      RET_MSG = "Enter the amount received. Recording a payment without a figure would mark "
              + "the retainer received with nothing behind it.";
      RET_ERR = true; paintCase(); return;
    }
    if(amt) body.amount_received = amt;
    if(meth) body.method = meth;
    if(date) body.paid_on = date;
    if(ref) body.reference = ref;
    /* One token per ATTEMPT. A dropped response and a second tap would
       otherwise record the same money twice, and an additive ledger takes both
       at face value. Generated here, so a retry of THIS attempt carries the
       same token while a genuinely new payment gets a new one. */
    RET_TOKEN = RET_TOKEN || `${WS_CASE}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    body.client_token = RET_TOKEN;
  }
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/retainer`, {method: "POST", body});
    RET_FORM = false; RET_DRAFT = {};
    RET_MSG = received
      ? "Payment recorded. The retainer now reads as received."
      : "Cleared — the retainer is pending again.";
    await reloadWorkspace();
  }catch(e){
    /* THE TOKEN IS KEPT ON PURPOSE. An error here means this attempt did not
       record, and pressing again must be a RETRY OF THE SAME ATTEMPT — same
       token, so the server can tell it apart from a genuinely second payment.
       Dropping it on failure is what used to turn one slow press into two
       recorded payments: the retry looked new, because nothing tied it to the
       attempt that may still have been in flight.

       The ONE exception is an attempt the Worker cannot resolve — a claim left
       by the old two-step version, where the money may or may not have landed.
       That token is unusable for ever, so the offer is an explicit new attempt.
       Still not automatic: the admin reads the payment list first, which is on
       this same screen, and decides. */
    if(e.code === "payment_indeterminate") RET_STUCK = true;
    RET_MSG = e.message; RET_ERR = true; paintCase();
  }
}

/* Voiding keeps the row. A payment recorded in error is corrected on the
   record, never erased — the same rule evidence and submitted reports follow. */
async function voidRetainerPayment(id){
  RET_MSG = ""; RET_ERR = false;
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/retainer/payment/${encodeURIComponent(id)}/void`,
      {method: "POST", body: {reason: "corrected in the portal"}});
    RET_MSG = "Payment voided. It stays on the record, marked.";
    await reloadWorkspace();
  }catch(e){
    RET_MSG = e.message; RET_ERR = true; paintCase();
  }
}

async function loadPaymentMethods(){
  try{ PAYCFG = (await api("/payment-methods")).methods; }
  catch(e){ PAYCFG = []; PAY_MSG = e.message; PAY_ERR = true; }
  paint();
}

/* Saving is the recovery path for the Worker's refusal, so the WORKER'S OWN
   words are shown on failure rather than a generic "could not save" — it is
   the message that says which method and what is missing, and paraphrasing it
   here would be a second place for the rule to drift. */
async function savePaymentMethod(id, enable){
  const v = k => { const el = $(`pm_${k}_${id}`); return el ? el.value : ""; };
  PAY_MSG = ""; PAY_ERR = false;
  /* Captured BEFORE the request, so a refusal leaves the admin looking at
     their own words rather than at the values the server still holds. */
  PAY_DRAFT[id] = { display_name: v("name"), handle: v("handle"),
                    url: v("url"), instructions: v("note") };
  try{
    const r = await api(`/payment-methods/${encodeURIComponent(id)}`, {method: "POST", body: {
      enabled: enable,
      display_name: v("name"), handle: v("handle"), url: v("url"), instructions: v("note"),
    }});
    PAYCFG = r.methods;
    delete PAY_DRAFT[id];   // saved: the server's copy is now the truth
    const m = (PAYCFG || []).find(x => x.id === id);
    PAY_MSG = `${m ? m.label : "Payment method"} saved — ${enable ? "clients will be offered it" : "switched off"}.`;
  }catch(e){ PAY_MSG = e.message; PAY_ERR = true; }
  paint();
}
