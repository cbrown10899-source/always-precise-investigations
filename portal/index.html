/* ------------------------------------------- the video timestamp generator

   Owner brief, 2026-08-17: a surveillance clip carries a date and time burned
   into the bottom-right corner, and the clock ADVANCES with the footage —
   5:14:32, 5:14:33, 5:14:34 — from a start time the operator sets.

   VIDEO IS DEVICE-FIRST. The original is a file on the investigator's own
   device and is opened here, never uploaded; the timestamped copy is rendered
   in this tab and saved back to that device. Nothing is staged on a server,
   nothing is sent to an outside service, and the portal is told only that a
   copy was made. The original file is opened read-only and is never rewritten.

   THE BURN-IN IS REAL PIXELS. Frames are drawn to a canvas with the stamp on
   top and re-encoded into a new video file, so the timestamp survives download,
   sharing and anything the clip is later put into. A CSS overlay would not, and
   the brief rules it out by name. */

const VST_TZ = "America/New_York";
/* SHA-256 needs the whole file in memory at once, so it is computed only when
   the file is small enough for that to be safe on a phone. An absent
   fingerprint is recorded as absent — never as a placeholder, which would read
   as an integrity check that had been done. */
const VST_HASH_MAX = 128 * 1024 * 1024;

/* THE ZONE IS RESOLVED FROM THE DATE and never hard-coded (owner: "Do not
   hard-code fixed EST year-round"). Virginia keeps daylight time for part of
   the year, so a fixed EST makes every summer timestamp an hour wrong.
   `Intl.DateTimeFormat` yields EST or EDT from the instant itself — no offset
   table to maintain and nothing that goes stale. */
function vstOffsetMs(ms, tz){
  const p = {};
  for(const x of new Intl.DateTimeFormat("en-US", {timeZone: tz, hour12: false,
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", second: "2-digit"}).formatToParts(new Date(ms))){
    p[x.type] = x.value;
  }
  const h = p.hour === "24" ? 0 : +p.hour;   // some engines render midnight as 24
  return Date.UTC(+p.year, +p.month - 1, +p.day, h, +p.minute, +p.second) - ms;
}

/* A wall-clock reading in a zone to the UTC instant it names. Two passes,
   because the correction the first pass applies can itself land on the far
   side of a daylight-saving change. */
function vstToUtc(y, mo, d, h, mi, s, tz){
  const wall = Date.UTC(y, mo - 1, d, h, mi, s);
  let ms = wall;
  for(let i = 0; i < 2; i++) ms = wall - vstOffsetMs(ms, tz);
  return ms;
}

/* The wording that gets burned in, exactly: 08/17/2026 05:14:32 PM EDT.
   Assembled from parts rather than from a format string, so the zone
   abbreviation is the one the browser resolved for that date. */
function vstLabel(ms, tz){
  const p = {};
  for(const x of new Intl.DateTimeFormat("en-US", {timeZone: tz || VST_TZ, hour12: true,
      year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit",
      minute: "2-digit", second: "2-digit", timeZoneName: "short"}).formatToParts(new Date(ms))){
    p[x.type] = x.value;
  }
  const pad = x => String(x == null ? "" : x).padStart(2, "0");
  return `${pad(p.month)}/${pad(p.day)}/${p.year} ${pad(p.hour)}:${pad(p.minute)}:${pad(p.second)} `
    + `${p.dayPeriod} ${p.timeZoneName}`
    // Some engines separate the day period with a narrow no-break space.
    .replace(/[  ]/g, " ");
}

/* A stored record's own wording, re-derived rather than remembered. The Worker
   validates the instant on the way in, so this cannot normally fail — but an
   unreadable one would make `Intl` throw and take out the whole panel it is
   drawn in, and a staff screen must not go blank over one bad row. */
function vstLabelOf(row){
  const ms = Date.parse(row && row.start_utc);
  if(!Number.isFinite(ms)) return "start time unreadable";
  try{ return vstLabel(ms, row.tz || VST_TZ); }catch{ return "start time unreadable"; }
}

/* The operator's entry, validated. Returns the instant or why it cannot be
   read — a half-typed field must not silently become a different time. */
function vstStart(){
  const v = VST;
  if(!v) return {ok: false, why: ""};
  const n = k => /^\d{1,4}$/.test(String(v[k]).trim()) ? parseInt(v[k], 10) : NaN;
  const mo = n("mo"), da = n("da"), yr = n("yr"), hr = n("hr"), mi = n("mi"), se = n("se");
  if([mo, da, yr, hr, mi, se].some(x => !Number.isFinite(x))) return {ok: false, why: "Fill in every part of the date and time."};
  if(mo < 1 || mo > 12) return {ok: false, why: "The month is 1 to 12."};
  if(da < 1 || da > 31) return {ok: false, why: "The day is 1 to 31."};
  if(yr < 2000 || yr > 2100) return {ok: false, why: "That year does not look right."};
  if(hr < 1 || hr > 12) return {ok: false, why: "The hour is 1 to 12 — AM or PM is beside it."};
  if(mi > 59 || se > 59) return {ok: false, why: "Minutes and seconds are 0 to 59."};
  const h24 = (hr % 12) + (v.ap === "PM" ? 12 : 0);
  const ms = vstToUtc(yr, mo, da, h24, mi, se, v.tz);
  if(!Number.isFinite(ms)) return {ok: false, why: "That date and time cannot be read."};
  return {ok: true, ms};
}

/* THE STAMP IS DRAWN INTO THE PICTURE. Scaled to the video's own resolution so
   it reads the same on a phone as on a monitor, white on a dark outline so it
   survives bright daylight and an unlit car park alike, a modest safe margin,
   and a MONOSPACE face — a proportional one makes the seconds digits shift
   sideways as they change, and the brief says it must not move. */
/* SIZED FROM THE AVAILABLE WIDTH, then shrunk until the whole stamp fits.

   Two goes at this. It was `H * 0.05` — the HEIGHT — while the stamp runs along
   the WIDTH, which on portrait gave a huge face. Taking it from the SHORT side
   fixed the size but not the proportion: the same face on a narrower picture
   still covers far more of it. Measured with a 26-character stamp, the drawn
   text as a fraction of the image width:

     landscape 4032 x 3024   52%     <- the owner confirmed this one reads right
     portrait  3024 x 4032   70%     <- reported oversized, and it was

   So the face is now derived from the WIDTH, to hit the same fraction whatever
   the shape: measure the text once at a known size to learn how wide this face
   actually is, then solve for the size that lands on the target. `measureText`
   is exact, so this is arithmetic rather than a guess, and the fallback font a
   given device picks is accounted for because it is the one being measured.

   `H * 0.08` caps it so a wide, short picture cannot get a stamp taller than
   itself, and the loop afterwards is the hard guarantee: whatever the target
   said, the text ends up inside the safe margins or it keeps shrinking. The
   floor is 8px, which a stamp of this length clears in about 125px of width.

   `vstDraw` is the ONE writer for photographs and video alike, so a portrait
   clip is fixed in both. */
function vstDraw(cx, W, H, text){
  const pad = Math.round(Math.min(W, H) * 0.035);
  const face = px => `600 ${px}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
  const room = Math.max(1, W - pad * 2);

  /* How wide this face draws this string, per pixel of font size. */
  const PROBE = 100;
  cx.font = face(PROBE);
  const per = Math.max(0.0001, cx.measureText(text).width / PROBE);

  let size = Math.round(W * 0.52 / per);          // the target share of the width
  size = Math.min(size, Math.round(H * 0.08));    // never taller than the picture wants
  size = Math.max(8, size);
  cx.font = face(size);
  /* THE GUARANTEE. Nothing above is allowed to leave the stamp hanging over the
     margin: it shrinks until the whole date, time and zone are inside. */
  for(let i = 0; i < 64 && size > 8 && cx.measureText(text).width > room; i++){
    size -= 1;
    cx.font = face(size);
  }
  cx.textAlign = "right";
  cx.textBaseline = "alphabetic";
  cx.save();
  cx.shadowColor = "rgba(0,0,0,.85)";
  cx.shadowBlur = Math.max(2, Math.round(size * 0.3));
  cx.lineWidth = Math.max(2, Math.round(size * 0.16));
  cx.lineJoin = "round";
  cx.strokeStyle = "rgba(0,0,0,.92)";
  cx.strokeText(text, W - pad, H - pad);
  cx.shadowBlur = 0;
  cx.fillStyle = "#ffffff";
  cx.fillText(text, W - pad, H - pad);
  cx.restore();
}

/* WebM only, and deliberately. The capability proof found `video/mp4` reporting
   supported on this platform while its only real codec, `avc1`, reports NOT
   supported — recording to it produces a file nothing can play. VP9 first,
   VP8 behind it. */
/* THE RECORDING FORMAT, IN PREFERENCE ORDER — MP4/H.264 FIRST.

   This order is the owner's iPhone test, 2026-08-18: the device reported
   `MediaRecorder` supporting BOTH mp4/avc1 and webm/vp9, this function handed
   back WebM because it was first in the list, and the end-to-end test then
   "wrote a file the iOS device could not read back". iOS records WebM and does
   not play it. H.264 in MP4 is what an iPhone plays, and it is what the owner
   asked the finished derivative to be.

   The earlier desktop measurement that made WebM first still holds THERE —
   `video/mp4` reports supported while `avc1` reports not, so a desktop that
   claims mp4 cannot really write one. Which is exactly why the order below is
   not the decision: `vstProveMime` is. */
const VST_MIMES = [
  "video/mp4;codecs=avc1.42E01E", "video/mp4;codecs=avc1.4d002a",
  "video/mp4;codecs=avc1", "video/mp4",
  "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm",
];

function vstMime(){
  if(typeof MediaRecorder === "undefined") return "";
  /* A format already PROVEN to round-trip on this device beats the declared
     list every time — see `vstProveMime`. */
  if(VST_PROVEN && VST_PROVEN.mime) return VST_PROVEN.mime;
  for(const t of VST_MIMES){
    try{ if(MediaRecorder.isTypeSupported(t)) return t; }catch{}
  }
  return "";
}

/* `isTypeSupported` IS NOT EVIDENCE, and this project has now been bitten by
   that twice in opposite directions: a desktop that reports `video/mp4` while
   its only codec reports not, and an iPhone that records WebM it cannot then
   open. The owner's rule is explicit — verify the generated file's CONTENT.

   So the format is chosen by actually writing a two-frame clip in each
   candidate and READING IT BACK on this same device. The first that survives
   the round trip wins; a format that cannot be read back is never selected,
   whatever it claims. Proven once per session and remembered. */
let VST_PROVEN = null;

async function vstRoundTrip(mime){
  try{
    if(!MediaRecorder.isTypeSupported(mime)) return {mime, ok: false, why: "not offered"};
  }catch{ return {mime, ok: false, why: "not offered"}; }
  try{
    const cv = document.createElement("canvas"); cv.width = 64; cv.height = 48;
    const cx = cv.getContext("2d");
    const st = cv.captureStream(0), tr = st.getVideoTracks()[0];
    const parts = [];
    const rec = new MediaRecorder(st, {mimeType: mime});
    rec.ondataavailable = e => { if(e.data && e.data.size) parts.push(e.data); };
    const stopped = new Promise(r => { rec.onstop = () => r(); setTimeout(r, 8000); });
    rec.start();
    for(let i = 0; i < 4; i++){
      cx.fillStyle = i % 2 ? "#fff" : "#123"; cx.fillRect(0, 0, 64, 48);
      tr.requestFrame();
      await new Promise(r => setTimeout(r, 60));
    }
    try{ rec.stop(); }catch{}
    await stopped;
    const blob = new Blob(parts, {type: mime});
    if(!blob.size) return {mime, ok: false, why: "recorder produced nothing"};
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true;
    const url = URL.createObjectURL(blob);
    const readable = await new Promise(r => {
      v.onloadeddata = () => r(true);
      v.onerror = () => r(false);
      setTimeout(() => r(false), 8000);
      v.src = url;
    });
    try{ v.removeAttribute("src"); v.load(); }catch{}
    try{ URL.revokeObjectURL(url); }catch{}
    return readable
      ? {mime, ok: true, bytes: blob.size, type: blob.type}
      : {mime, ok: false, why: "written, but this device could not read it back", bytes: blob.size};
  }catch(e){ return {mime, ok: false, why: (e && e.message) || String(e)}; }
}

async function vstProveMime(){
  if(VST_PROVEN) return VST_PROVEN;
  const tried = [];
  if(typeof MediaRecorder === "undefined"
     || typeof HTMLCanvasElement.prototype.captureStream !== "function"){

async function vstBoxCodec(file){
  if(!file || typeof file.slice !== "function") return null;

    let off = 0, moov = null, guard = 0;

      const head = await u8(off, 16);

      let size = dv.getUint32(0);
      const type = String.fromCharCode(head[4], head[5], head[6], head[7]);
      if(!/^[\x20-\x7e]{4}$/.test(type)) break;
      if(size === 1){ if(head.length < 16) break; size = Number(dv.getBigUint64(8)); }

   every track's `tkhd` (dimensions, and the rotation matrix iOS uses instead of
   turning the pixels), `mdhd` (timescale and duration), and `stsd` (the sample
   entry, and the `avcC`/`hvcC` configuration record that WebCodecs needs as its
   `description`). Audio tracks are reported because the owner has made audio a

const VST_AUDIO_CODECS = {
  "mp4a": "AAC", "alac": "Apple Lossless", "Opus": "Opus", "opus": "Opus",

function vstBox(bytes, off){
  if(off + 8 > bytes.length) return null;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let size = dv.getUint32(off), head = 8;
  const type = String.fromCharCode(bytes[off+4], bytes[off+5], bytes[off+6], bytes[off+7]);

     `©day` is where an Apple device writes the capture date, and a check that
     admitted only printable ASCII discarded it as if the box were corrupt. */
  if(!/^[\x20-\x7e\xa9]{4}$/.test(type)) return null;

  } else if(size === 0) size = bytes.length - off;

      const gpc = new DataView(cfg.buffer, cfg.byteOffset, cfg.byteLength).getUint32(2);
      const lvl = cfg[12];

      const con = [];
      for(let i = 6; i <= 11; i++) con.push(cfg[i]);

/* ---- THE SAMPLE TABLES: WHERE EVERY FRAME LIVES AND WHEN IT PLAYS ----

   avoiding a two-megabyte dependency for it is worth two hundred lines. The
   MUXER is vendored, because writing a standards-compliant MP4 is the one thing
   that must be right and cannot be tested here.

   The tables are the classic ISO/QuickTime set and they interlock:
     stts  decode deltas, run-length encoded
     ctts  composition offsets, when B-frames reorder presentation
     stsz  every sample's size (or one size for all)
     stsc  how many samples sit in each chunk, run-length encoded
     stco  where each chunk starts (co64 when the file is over 4 GB)
     stss  which samples are keyframes; absent means every sample is one

   which is what keeps an 84.7 MB original from ever being resident. */

function vstFullBox(bytes, box){ return {ver: bytes[box.start + box.head],
  body: box.start + box.head + 4}; }

  let sizes = [];

    if(uniform > 0) sizes = new Array(count).fill(uniform);
    else { sizes = new Array(count);

  }

  // ---- decode times, run-length encoded ----
  const dts = new Array(n); {
    const f = vstFullBox(bytes, stts);
    const runs = dv.getUint32(f.body);

      const cnt = dv.getUint32(f.body + 4 + r * 8);
      const delta = dv.getUint32(f.body + 8 + r * 8);
      for(let k = 0; k < cnt && i < n; k++){ dts[i++] = t; t += delta; }
