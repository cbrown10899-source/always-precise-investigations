<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Portal — Always Precise</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1a2c">
<link rel="icon" href="/assets/logo-white.webp">
<!-- Active Surveillance Mode is installable to a phone's home screen. It is
     the same secured site, not a second app: the shortcut only starts at
     ?surveillance=1, which opens the field launcher after the normal login.
     The icons are the firm's own Active Surveillance mark — deliberately NOT
     declared maskable, because an Android mask would crop the corners and take
     the "Always Precise Investigations" banner off the top of it. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="API Surveillance">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --navy:#0e1a2c; --navy-2:#13273f; --teal:#2f7d90; --teal-2:#3d97ad;
    --gold:#c99a3b; --ink:#1c2531; --muted:#5c6775; --line:#dfe3e8;
    --paper:#f4f5f7; --card:#fff; --good:#1c8a4d; --bad:#c14133; --warn:#a86a12;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}

  .top{background:var(--navy);color:#fff;padding:14px 20px;}
  .top .wrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .top .name{font-weight:700;letter-spacing:.03em;line-height:1.15;}
  .top .name span{display:block;font-weight:400;font-size:.72rem;color:#9db2c9;letter-spacing:.05em;}
  .top .who{margin-left:auto;font-size:.82rem;color:#cfe0f0;text-align:right;}
  .top .who b{display:block;color:#fff;}
  .top button{font:inherit;font-size:.82rem;background:transparent;border:1px solid #3c5878;color:#cfe0f0;border-radius:6px;padding:6px 12px;cursor:pointer;margin-left:12px;}
  .top button:hover{background:#1c3552;}

  main{max-width:1180px;margin:0 auto;padding:22px 16px 70px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{font:inherit;font-size:.9rem;font-weight:600;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--teal-2);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(16,29,51,.05);}
  .card.narrow{max-width:430px;margin:8vh auto 0;}
  h1{font-size:1.28rem;margin-bottom:4px;}
  h2{font-size:1.05rem;margin-bottom:12px;}
  .lead{color:var(--muted);font-size:.92rem;margin-bottom:18px;}
  label.f{display:block;margin-bottom:14px;}
  label.f > span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;}
  input,select,textarea{width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  input:focus,select:focus{outline:2px solid var(--teal-2);border-color:var(--teal-2);}
  .btn{font:inherit;font-size:.95rem;font-weight:700;border:0;border-radius:8px;padding:11px 20px;cursor:pointer;background:var(--teal);color:#fff;}
  .btn:hover{background:var(--teal-2);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn.sm{font-size:.82rem;padding:7px 13px;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn.danger{background:var(--bad);}
  .err{color:var(--bad);font-size:.86rem;margin-top:10px;min-height:1em;}
  .okmsg{color:var(--good);font-size:.86rem;margin-top:10px;min-height:1em;}

  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .bar input{max-width:280px;}
  .count{color:var(--muted);font-size:.86rem;margin-left:auto;}
  .note{background:#fdf7ec;border:1px solid #f0dcb6;color:#7a5a12;border-radius:8px;padding:10px 13px;font-size:.86rem;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;}
  tbody tr.click{cursor:pointer;}
  tbody tr.click:hover{background:#f7fafb;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;color:var(--teal);}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;}
  .tag.claims{background:#eaf4f7;color:#1f5c6d;}
  .tag.consumer{background:#f0eee9;color:#6b5a33;}
  .tag.new{background:#fdf1e3;color:var(--warn);}
  .tag.assigned{background:#eaf4f7;color:#1f5c6d;}
  .tag.in_progress{background:#e8f1fb;color:#1e4f8a;}
  .tag.closed{background:#e9f7ef;color:var(--good);}
  .tag.report_review{background:#f3ecfb;color:#5b3d8a;}
  .tag.awaiting_client{background:#fdf1e3;color:var(--warn);}
  .tag.complete{background:#e9f7ef;color:var(--good);}
  .tag.on_hold{background:#f1f1f1;color:#666;}
  .tag.cancelled{background:#f1f1f1;color:#888;}
  .tag.open{background:#fdf1e3;color:var(--warn);}
  .empty{color:var(--muted);padding:26px 4px;font-size:.92rem;}

  /* dashboard strip */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .stat.warn{border-color:#e8cf9e;background:#fdf9f1;}
  .stat-n{font-size:1.7rem;font-weight:800;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums;}
  .stat.warn .stat-n{color:#8a6410;}
  .stat-l{font-size:.82rem;font-weight:700;margin-top:2px;}
  .stat-h{font-size:.75rem;color:var(--muted);margin-top:1px;}
  .stat.live{border-color:#9fd3c0;background:#f0faf6;}
  .stat.live .stat-n{color:#1a6b3c;}
  .stat.click{cursor:pointer;}
  .stat.click:hover{border-color:var(--teal);}
  .stat.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;background:#f2f9fa;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#eaf5f7;border:1px solid #b7dbe3;
    color:var(--navy);border-radius:999px;padding:3px 6px 3px 11px;font-size:.8rem;font-weight:700;}
  .chip button{border:0;background:none;font:inherit;font-size:1rem;cursor:pointer;color:var(--teal-ink,#1d5c6c);line-height:1;}
  /* MASTER §31 — the Cases tab's lens and the Completed desk. */
  .lead-send{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;
    padding-top:8px;border-top:1px dashed var(--line);}
  .lead-send input{flex:1;min-width:170px;font:inherit;font-size:.85rem;border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;}
  .tag[class*="lead-"]{background:#f4f0e6;border-color:#d9c9a3;color:#7a5f2a;}
  .tag.lead-converted{background:#f4faf6;border-color:#9fd3b2;color:#1a6b3c;}
  .tag.lead-declined,.tag.lead-closed_lead{background:#f5f5f5;border-color:#ccc;color:#666;}
  .lensrow{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap;}
  .lens{font:inherit;font-size:.8rem;font-weight:700;padding:6px 14px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;}
  .lens.on{background:#13273f;border-color:#13273f;color:#fff;}
  .donegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;}
  .donecard{border:1px solid var(--line);border-radius:12px;padding:13px 15px;background:#fff;}
  .dc-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .dc-acts{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:10px;}
  /* rate sheets */
  .sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px;}
  .sheet-card{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:15px 16px;cursor:pointer;font:inherit;color:inherit;display:block;width:100%;}
  .sheet-card:hover{border-color:var(--teal);}
  .sheet-card.on{border-color:var(--teal);background:#f2f9fa;box-shadow:0 0 0 1px var(--teal) inset;}
  .sheet-n{font-weight:800;font-size:1.05rem;color:var(--navy);}
  .sheet-a{font-size:.78rem;color:var(--muted);margin:2px 0 8px;}
  .sheet-s{font-size:.88rem;}
  .sheet-go{margin-top:10px;font-size:.78rem;font-weight:700;color:var(--teal);}
  .sheet-note{font-size:.8rem;color:var(--muted);font-weight:400;max-width:46ch;}
  .loaderr{background:#fdecea;border:1px solid #f5c6c0;color:#8a2318;border-radius:10px;
    padding:12px 14px;margin-bottom:16px;font-size:.9rem;}
  /* case workspace — built to be usable from a phone in a parked car */
  .wstabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);
    margin:0 0 16px;padding-bottom:0;-webkit-overflow-scrolling:touch;}
  .wstabs button{flex:none;font:inherit;font-size:.88rem;font-weight:700;background:none;border:0;
    border-bottom:2px solid transparent;color:var(--muted);padding:9px 12px;cursor:pointer;white-space:nowrap;}
  .wstabs button.on{color:var(--navy);border-bottom-color:var(--teal);}
  .wspanel{min-height:120px;}
  .quick{background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;}
  .quick .btn{width:100%;}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;margin-bottom:12px;}
  .qk{position:relative;}
  .qk input{position:absolute;opacity:0;pointer-events:none;}
  .qk span{display:block;text-align:center;font-size:.8rem;font-weight:700;padding:10px 4px;
    border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
  .qk input:checked + span{border-color:var(--teal);background:#eaf5f7;color:var(--navy);}
  .qk input:focus-visible + span{outline:2px solid var(--teal);}
  .qk2{display:block;width:100%;text-align:center;font:inherit;font-size:.8rem;font-weight:700;
    padding:10px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
  .qk2.on{border-color:var(--teal);background:#eaf5f7;color:var(--navy);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-w{font-size:.68rem;font-weight:700;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0;}
  .cal-cell{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff;overflow:hidden;}
  .cal-pad{background:transparent;border-color:transparent;}
  .cal-today{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
  .cal-d{font-size:.72rem;font-weight:700;color:var(--muted);}
  .cal-ev{display:block;font-size:.64rem;font-weight:700;letter-spacing:.02em;color:#fff;background:var(--teal);
    border-radius:4px;padding:2px 5px;margin-top:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-ev.cal-run{background:#1a6b3c;}
  .cal-ev.cal-offer{background:#fff;color:var(--teal);border:1px dashed var(--teal);}
  /* Rate sheets: the numbers dominate (RATESHEETS.md mobile hierarchy). */
  .rs-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
  .rs-row:last-child{border-bottom:0;}
  .rs-l{flex:1;}
  .rs-sub{margin-left:8px;font-size:.78rem;color:var(--muted);font-weight:600;}
  .rs-note{font-size:.84rem;color:var(--muted);margin-top:3px;max-width:56ch;}
  .rs-v{white-space:nowrap;font-weight:700;padding-left:8px;}
  .rs-big .rs-v{font-size:1.55rem;font-weight:800;color:var(--navy,#12305a);line-height:1.1;}
  .rs-badge{display:inline-block;margin-left:8px;padding:2px 9px;border:1px solid #b7924c;color:#8a6d33;
    border-radius:10px;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:2px;}
  .rs-close{margin:14px 0 4px;padding:13px 15px;background:#fbf7ee;border-left:3px solid #b7924c;border-radius:0 8px 8px 0;}
  .rs-close b{display:block;margin-bottom:3px;}
  .rs-close p{margin:0;font-size:.88rem;color:#44505c;}
  @media(max-width:640px){.rs-big .rs-v{font-size:1.35rem;}}
  /* Invoices */
  .inv-line{display:grid;grid-template-columns:1fr 70px 90px 100px 34px;gap:6px;margin-bottom:6px;align-items:center;}
  .inv-line input{width:100%;}
  @media(max-width:640px){.inv-line{grid-template-columns:1fr 54px 70px 80px 30px;}}
  .inv-tot{text-align:right;font-size:1.05rem;margin:8px 0 2px;}
  .inv-tot b{font-size:1.35rem;color:var(--navy,#12305a);}
  #invdoc{border:1px solid var(--line);border-radius:10px;padding:26px 28px;background:#fff;margin-top:14px;}
  #invdoc h2{margin:0;}
  .doc-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--navy,#12305a);padding-bottom:12px;margin-bottom:14px;}
  .doc-refs dt{font-weight:700;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .doc-refs dd{margin:0 0 6px;}
  .doc-table{width:100%;border-collapse:collapse;margin:12px 0;}
  .doc-table th,.doc-table td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem;}
  .doc-table th:last-child,.doc-table td:last-child,.doc-table th.n,.doc-table td.n{text-align:right;}
  .doc-due{text-align:right;font-size:1.15rem;margin-top:10px;}
  .doc-due b{font-size:1.5rem;color:var(--navy,#12305a);}
  /* The Case Package view (UXSIMPLIFY P9/P13/P16/P17) */
  .pkg-blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:10px 0 14px;}
  .pkg-b{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;}
  .pkg-b b{display:block;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);}
  .pkg-b .pk-v{font-size:1.05rem;font-weight:700;margin-top:2px;}
  .pkg-b .pk-s{font-size:.95rem;margin-left:6px;}
  .pkg-b.done{border-color:#9fd3b2;background:#f4faf6;}
  .pkg-b.part{border-color:#e9d8a6;background:#fdfaf1;}
  .pkg-miss{border-left:3px solid #b7924c;background:#fbf7ee;border-radius:0 8px 8px 0;padding:12px 14px;margin:10px 0;}
  .pkg-miss li{margin:4px 0 4px 16px;}
  .pkg-pick{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;}
  .pkg-item{border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;width:118px;font-size:.72rem;}
  .pkg-item img{width:100%;height:64px;object-fit:cover;border-radius:5px;}
  .pkg-item.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
  #pkgdoc{border:1px solid var(--line);border-radius:10px;padding:26px 28px;background:#fff;margin-top:14px;}
  #pkgdoc img{max-width:100%;border-radius:6px;}
  /* UIBUILD P1: the navigation rail. Same .tabs machinery, new shape — a
     fixed sidebar at desktop widths, a drawer behind the burger on mobile. */
  .burger{display:none;background:transparent;border:0;color:#fff;font-size:1.4rem;cursor:pointer;padding:4px 10px;}
  @media(min-width:900px){
    body.withnav .tabs{position:fixed;left:0;top:58px;bottom:0;width:198px;flex-direction:column;
      align-items:stretch;gap:2px;padding:14px 10px;margin:0;background:#13273f;border-radius:0;
      overflow-y:auto;z-index:40;}
    body.withnav .tabs button{text-align:left;color:#c9d6e4;background:transparent;border-radius:8px;
      padding:9px 12px;font-weight:600;}
    body.withnav .tabs button.on{background:#1f3a58;color:#fff;}
    body.withnav .tabs button:hover{background:#1a3350;color:#fff;}
    body.withnav .tabs .side-intake{margin-top:auto;display:block;text-align:center;background:var(--gold,#c99a3b);
      color:#13273f;font-weight:800;border-radius:9px;padding:11px 12px;text-decoration:none;
      font:inherit;font-weight:800;border:0;cursor:pointer;width:100%;}
    /* The field door, at the top level. Outlined rather than gold: it is a
       primary action but it must not out-shout "+ Intake a Client". */
    body.withnav .tabs .side-surv{margin-top:14px;display:block;text-align:left;
      background:#0d1826;color:#e8eef5;border:1px solid #23405f;border-radius:9px;
      padding:10px 12px;font:inherit;font-weight:700;cursor:pointer;width:100%;}
    body.withnav .tabs .side-surv:hover{background:#16283d;color:#fff;}
    body.withnav #app{margin-left:198px;}
  }
  @media(max-width:899px){
    body.withnav .tabs{display:none;}
    body.withnav.navopen .tabs{display:flex;position:fixed;left:0;top:0;bottom:0;width:76%;max-width:300px;
      flex-direction:column;align-items:stretch;gap:2px;padding:60px 12px 14px;background:#13273f;z-index:60;
      overflow-y:auto;box-shadow:0 0 0 100vmax rgba(9,18,30,.45);}
    body.withnav.navopen .tabs button{text-align:left;color:#c9d6e4;background:transparent;border-radius:8px;padding:11px 12px;}
    body.withnav.navopen .tabs button.on{background:#1f3a58;color:#fff;}
    body.withnav.navopen .tabs .side-intake{margin-top:auto;display:block;text-align:center;
      background:var(--gold,#c99a3b);color:#13273f;font-weight:800;border-radius:9px;padding:11px;text-decoration:none;
      font:inherit;font-weight:800;border:0;cursor:pointer;width:100%;}
    body.withnav.navopen .tabs .side-surv{margin-top:14px;display:block;text-align:left;
      background:#0d1826;color:#e8eef5;border:1px solid #23405f;border-radius:9px;
      padding:11px 12px;font:inherit;font-weight:700;cursor:pointer;width:100%;}
    /* The base rule below is deliberately ABOVE this media query. It used to
       sit after it, and with equal specificity the later rule won: the burger
       was display:none at every width, the sidebar was hidden under 900px, and
       a phone had NO navigation at all while an iPad in landscape looked fine.
       Never move the base rule back below this block. */
    .burger{display:inline-block;}
  }
  /* Case Package cards (UIBUILD P3) */
  .pkgcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:10px;}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .pc-ring{flex:0 0 auto;}
  .pc-mods{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 8px;}
  .pc-m{flex:1 1 40px;min-width:52px;text-align:center;font-size:.62rem;color:var(--muted);
    border:1px solid var(--line);border-radius:8px;padding:5px 2px;cursor:pointer;background:#fff;}
  .pc-m b{display:block;font-size:.86rem;color:var(--ink,#1c2531);}
  .pc-m.done{border-color:#9fd3b2;background:#f4faf6;}
  .pc-m.part{border-color:#e9d8a6;background:#fdfaf1;}
  .pc-next{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);
    padding-top:10px;margin-top:4px;}
  .pc-next small{display:block;color:var(--muted);font-size:.72rem;}
  /* UIBUILD Phase 2 — the case page: P5 header, P6 sections, P7 overview. */
  .caseheader{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;
    margin-bottom:14px;}
  .ch-client{font-size:.92rem;margin-top:4px;}
  .ch-sub{font-size:.85rem;color:var(--muted);margin-top:2px;}
  .ch-right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
  .ch-right .tag{cursor:pointer;}
  .ch-line{font-size:.8rem;color:var(--muted);}
  .wsecs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;-webkit-overflow-scrolling:touch;}
  .wsecs button{flex:none;font:inherit;font-size:.76rem;font-weight:800;letter-spacing:.05em;
    text-transform:uppercase;background:#f2f5f8;border:1px solid var(--line);border-radius:9px;
    color:var(--muted);padding:8px 14px;cursor:pointer;white-space:nowrap;}
  .wsecs button.on{background:#13273f;border-color:#13273f;color:#fff;}
  .wsecs .sec-s{display:none;}
  .wsecs .sec-i{display:none;}
  /* UIBUILD P15 — on a phone the section bar is the bottom navigation:
     fixed under the thumb, short labels, the add button pinned above it. */
  @media(max-width:640px){
    /* The bottom bar is the ONLY navigation a phone has on a case, so it has
       to announce itself. The owner could not see it or hit it (2026-08-14),
       and it got three things wrong at once: it sat 6px off the screen edge,
       its targets were about 33px tall — under Apple's 44px minimum — and it
       was four small-caps words with nothing to recognise at a glance.

       `max(14px, env(...))` is the load-bearing bit. Without
       `viewport-fit=cover` iOS reports a safe-area inset of ZERO, so the old
       calc() added nothing and the buttons pressed against the bottom edge,
       where the home indicator lives and a thumb cannot land cleanly. The
       max() guarantees real clearance whether or not the browser reports an
       inset, and needs no change to the viewport meta. */
    .casepage .wsecs{position:fixed;left:0;right:0;bottom:0;z-index:65;background:#13273f;
      margin:0;padding:6px 6px max(14px,env(safe-area-inset-bottom));gap:4px;

      box-shadow:0 -6px 18px rgba(9,18,30,.34);}

      font-size:.68rem;letter-spacing:.03em;}
    .casepage .wsecs button .sec-i{display:block;font-size:1.3rem;line-height:1;}
    .casepage .wsecs button.on{background:#1f3a58;color:#fff;}
    /* "You are here" has to survive a glance in a car at dusk, so it is a gold
       cap rather than a slightly different navy. */
    .casepage .wsecs button.on::before{content:"";position:absolute;top:-6px;left:24%;right:24%;
      height:3px;border-radius:0 0 3px 3px;background:var(--gold,#c99a3b);}
    .casepage .wsecs .sec-l{display:none;}
    .casepage .wsecs .sec-s{display:inline;}
    .casepage{padding-bottom:100px;}
    .addact{bottom:96px;}
  }

const NO_CHANGE_LINE = "No change was noted during this period.";
const ARRIVAL_LINE = "Arrived in vicinity of subject residence.";
/* The arrival sentence generator (MASTER §10, SURVEILLANCE P6).

   P6 lists five position options in one breath — direct, indirect, primary
   route, secondary, mobile — but they are TWO independent things, and reading
   them as one list is a mistake worth not repeating. MASTER §10's own canonical
   example combines two of them at once:

     "…established an indirect surveillance position along the primary route
      of departure."

   A single five-way choice cannot express that sentence: it forces indirect OR
   primary. So VIEW (direct / indirect) and PLACEMENT (primary route / secondary
   route / mobile) are separate, and either may stand alone. The article rides
   with the view — "a direct", "an indirect" — because a generated line has to
   read like a report sentence, not a filled-in blank.

   Two rules this shape exists to keep. It composes ONLY from what the
   investigator actually entered: leave a box empty and its clause never
   appears, so the template can never assert a vehicle or a vantage nobody
   observed. And it stops regenerating the moment the narrative is hand-edited
   — past that point the hand is the author, and a later keystroke in an extras
   box must not overwrite what a person wrote.

   ONE function serves the desk sheet and the field mode, so a line composed in
   the car and the same line composed at the office cannot drift apart. */
const ARRIVAL_VIEW = [
  ["direct",   "Direct view",   "direct"],
  ["indirect", "Indirect view", "indirect"],
];
const ARRIVAL_PLACE = [
  ["primary",   "Primary route of departure", "along the primary route of departure"],
  ["secondary", "Secondary route",            "along a secondary route"],
  ["mobile",    "Mobile surveillance",        ""],
];
function arrivalSentence(vp, view, place, pos){
  const v = String(vp || "").trim().replace(/\.$/, "");
  const p = String(pos || "").trim().replace(/\.$/, "");
  const vw = (ARRIVAL_VIEW.find(o => o[0] === view) || [])[2] || "";
  const pl = ARRIVAL_PLACE.find(o => o[0] === place);
  let clause = "";
  if(place === "mobile"){
    // Mobile is not a position one establishes a view from — it is the method.
    clause = `Established ${vw ? `${vw} ` : ""}mobile surveillance`;
  } else if(vw || pl){
    const art = vw === "indirect" ? "an" : "a";
    clause = `Established ${vw ? `${art} ${vw}` : "a"} surveillance position${pl ? ` ${pl[2]}` : ""}`;
  }
  return ARRIVAL_LINE
    + (v ? ` ${v} present.` : "")
    + (clause ? ` ${clause}${p ? ` ${p}` : ""}.`
       : p ? ` Established surveillance position ${p}.` : "");
}
/* MASTER §10's fuller vocabulary (2026-08-14). The physical-observation set

/* Times are entered 24-hour by the clock widget and read 12-hour by people;

function t12(hhmm){
  const h = parseInt(String(hhmm).slice(0,2), 10), m = String(hhmm).slice(3,5);
  if(!Number.isFinite(h)) return String(hhmm || "");
  return `${h % 12 === 0 ? 12 : h % 12}:${m} ${h < 12 ? "AM" : "PM"}`;
}
function fmtDay(d){
  const t = new Date(String(d) + "T00:00:00");   // local midnight — no timezone drift
  return isNaN(t) ? String(d) : t.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"});
}

/* The calendar date HERE, where the investigator is standing.

   Every surveillance DATE used to come from `toISOString().slice(0,10)` while
   every surveillance TIME came from `toTimeString().slice(0,5)` — UTC against
   local, on the same line and in the same submitted record. In EDT that is
   four hours of disagreement every evening: at 20:15 on the 14th the page
   filed `2026-08-15` beside `20:15`, so evening surveillance — the bulk of
   this firm's work — was recorded a day late, with the times of the day
   before. It reached `case_days.day_date`, `case_reports.report_date` (which
   the Worker derives from it) and the timeline's ORDER BY, so a day could sort
   ahead of itself.

   `fmtDay` above already guards the reverse trip for the same reason. Use this
   for any date a HUMAN means by "today"; keep `toISOString()` for instants,
   which are genuinely UTC and stored that way. */
function ymdLocal(d){
  const t = d || new Date();
  const p = n => String(n).padStart(2, "0");
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
}
const hmLocal = d => (d || new Date()).toTimeString().slice(0,5);

/* A date and a time that belong to each other, from ONE reading of the clock.

   Every pairing in this file used to call `new Date()` twice — once for the
   date, once for the time — and two readings can fall either side of midnight.
   The window is sub-millisecond and it would be indistinguishable from a
   mystery if it ever fired: an entry stamped 23:59:59.9997 on one day and
   00:00:00.0001 on the next, filed with tomorrow's date and last night's time,
   sorting ahead of everything before it. Nothing detects that afterwards.

   So the invariant is made structural rather than improbable: one instant,
   both halves. Use this anywhere a date and a time are captured together;
   `ymdLocal` and `hmLocal` alone are for when only one of them is wanted. */
function stampNow(){
  const d = new Date();
  return { date: ymdLocal(d), time: hmLocal(d) };
}

function safeImage(src){

/* An investigator's copy of a case has the client stripped out of it by the
   Worker before it is sent — carrier, adjuster, claim and policy numbers,
   defense counsel, billing and the signature never arrive. The example has to
   be redacted the same way or it would promise a view that does not exist.

   This list mirrors FIELD_KEEP in case-portal/worker.js. The Worker is what

   they cannot drift apart. */
const FIELD_KEEP = [
  "subject_name", "subject_address", "subject_description", "subject_relationship",
  "objective", "authorized_hours", "timeline", "notes", "attachments",

];

function redactExample(c) {
  const kept = {};
  for (const k of FIELD_KEEP) if (c.payload[k] !== undefined) kept[k] = c.payload[k];
  return { ...c, carrier: null, claim_number: null, client_name: null, payload: kept };
}

async function api(path, opts = {}){
  const res = await fetch(API + path, {
    credentials: "same-origin",
    headers: opts.body ? {"Content-Type":"application/json"} : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if(res.status === 401 && ME){ ME = null; paint(); throw new Error("Your session ended. Please sign in again."); }
  if(!res.ok) throw new Error(data.error || "That did not work. Please try again.");
  return data;
}

    return `<div class="card narrow"><h1>Reset link not valid</h1>

  return `<div class="card narrow">

    <p class="lead">For <b>${esc(state.display_name || state.username)}</b>

    <form data-act="resetAccept">
      <label class="f"><span>New password</span><input id="p1" type="password" autocomplete="new-password" required></label>

function shell(inner){
  // Simplified navigation for the field, exactly as the handoff draws it —
  // not a miniature admin portal. Calendar and Availability join when their
  // features exist rather than sitting as dead tabs.
  const item = (id, label) => `<button class="${TAB === id ? "on" : ""}" data-act="tab" data-tab="${id}">${label}</button>`;
  const tabs = ME.role === "admin"
    ? item("dashboard", "&#8962; Dashboard")
      + item("cases", "&#128193; Cases")
      + item("leads", "&#128234; Leads & intakes")
      + item("calendar", "&#128197; Calendar")
      + item("sheets", "&#128179; Rate sheets")
      + item("invoices", "&#129534; Invoices")
      + item("staff", "&#128101; Staff")
      + item("settings", "&#9881; Settings")
      + `<button class="side-surv" data-act="surveillance">&#128373; Active surveillance</button>`
      + `<button class="side-intake" data-act="tab" data-tab="newlead">+ Intake a Client</button>`
    : item("cases", "&#128193; My assignments")
      + `<button class="side-surv" data-act="surveillance">&#128373; Active surveillance</button>`
      + item("today", "&#9728; Today")
      + item("calendar", "&#128197; Calendar")
      + item("myreports", "&#128196; Reports")
      + item("myexpenses", "&#129534; Expenses");
  // The schema notice comes first and is specific, because it is the one cause
  // that explains every other symptom at once.
  const schema = SCHEMA_MISSING.length ? `<div class="loaderr">
      <b>The database is not fully set up yet.</b> ${SCHEMA_MISSING.length}
      ${SCHEMA_MISSING.length === 1 ? "table is" : "tables are"} missing, so parts of the portal
      will fail until the schema is applied.
      <div style="font-size:.86rem;margin-top:8px">
        Fix it in one run: <b>GitHub &rarr; Actions &rarr; Set up the case portal &rarr; Run
        workflow</b>. It is safe to re-run &mdash; it finds the existing database, adds only what
        is missing, and leaves your account alone.
      </div>
      <div style="font-size:.78rem;margin-top:6px;opacity:.85">Missing: <span class="mono">${
        SCHEMA_MISSING.map(esc).join(", ")}</span></div>
      <button class="btn sm ghost" data-act="reload" style="margin-top:10px">Check again</button>
    </div>` : "";

  const problem = LOAD_ERR ? `<div class="loaderr">
      <b>Something did not load.</b> ${esc(LOAD_ERR)}
      <button class="btn sm ghost" data-act="reload" style="margin-left:8px">Try again</button>
      <div style="font-size:.82rem;margin-top:6px">Nothing below is necessarily the whole picture
        while this is showing.</div>
    </div>` : "";
  /* The send wizard is an overlay, mounted here rather than inside the Rate
     sheets view so a lead card can open it too (MASTER §5). */
  return `<div class="tabs">${tabs}</div>${schema}${problem}${summaryCards()}${inner}${
    SHEET_WIZ ? sheetWizardHtml() : ""}`;
}


/* --------------------------------------------------------- the dashboard */

/* UIBUILD P2-P4: the admin's landing view. The operational cards up top,
   the Outstanding balance, then the Case Package cards — each with its ring,
   its module states and ONE computed next step. Centralized logic (P24):
   pkgProgress and pkgNextStep are the only places that decide. */
let PKGS = null;

async function loadPackages(){
  try{ PKGS = await api("/packages"); }
  catch(e){ PKGS = {packages: [], outstanding: 0}; LOAD_ERR = e.message; }
  paint();
}

/* scope "field" (UIBUILD P15) is the investigator's version of both helpers:
   the modules they can see and the steps that are theirs — build and invoice
   are the office's and never appear. Same functions, one flag (P24). */
function pkgProgress(p, scope){
  const mods = [];
  mods.push(["activity", p.activity_count > 0 ? "done" : "none", `${p.activity_count} entr${p.activity_count === 1 ? "y" : "ies"}`]);
  mods.push(["report", ["approved", "delivered"].includes(p.report_status) ? "done" : p.report_status ? "part" : "none",
             p.report_status ? label(p.report_status) : "None"]);
  mods.push(["photos", p.photos > 0 ? "done" : "none", String(p.photos)]);
  if(p.videos > 0) mods.push(["video", "done", String(p.videos)]);
  if(scope !== "field"){
    mods.push(["build", p.build_status === "finalized" ? "done" : p.build_status ? "part" : "none",
               p.build_status === "finalized" ? "Final" : p.build_status ? "Draft" : "Not started"]);
    mods.push(["invoice", p.invoice_status === "paid" ? "done" : p.invoice_status ? "part" : "none",
               p.invoice_status ? label(p.invoice_status) : "Not created"]);
  }
  const done = mods.filter(m => m[1] === "done").length;
  return { mods, done, total: mods.length, pct: Math.round((done / mods.length) * 100) };
}

/* One vocabulary for module labels and where each one lives, shared by the
   dashboard cards and the case overview (UIBUILD P24). The tab keys are
   WS_TAB keys — openCase() and the case page both route by them. */
const MOD_LABEL = {activity: "Activity", report: "Report", photos: "Photos", video: "Video",
                   build: "Build", invoice: "Invoice"};
const MOD_TAB = {activity: "activity", report: "reports", photos: "evidence", video: "evidence",
                 build: "package", invoice: "billing"};

function pkgNextStep(p, scope){
  if(p.open_day) return {label: "Continue activity log", tab: "activity"};
  if(!p.days) return {label: "Start investigation day", tab: "field"};
  if(!p.report_status) return {label: "Draft the report", tab: "reports"};
  if(!["approved", "delivered"].includes(p.report_status)){
    if(scope === "field") return p.report_status === "submitted"
      ? {label: "Submitted — with the office for review", tab: "reports"}
      : {label: "Finish and submit the report", tab: "reports"};
    return {label: "Review report", tab: "reports"};
  }
  if(scope === "field") return {label: "Assignment complete — with the office", tab: "reports"};
  if(p.build_status !== "finalized") return {label: "Build case package", tab: "package"};
  if(!p.invoice_status) return {label: "Create invoice", tab: "billing"};
  if(p.invoice_status !== "paid") return {label: "Track the invoice", tab: "billing"};
  return {label: "Ready to close", tab: "billing"};
}

function ringHtml(pct){
  const r = 26, c = 2 * Math.PI * r;
  return `<svg class="pc-ring" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="${pct}% complete">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#e4e9ed" stroke-width="6"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${pct >= 100 ? "#2e7d4f" : "#2f7d90"}" stroke-width="6"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(100, pct) / 100)}"
      stroke-linecap="round" transform="rotate(-90 32 32)"/>
    <text x="32" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#13273f">${pct}%</text>
    <text x="32" y="43" text-anchor="middle" font-size="7" fill="#5c6775">Complete</text>
  </svg>`;
}

function pkgCard(p){
  const prog = pkgProgress(p);
  const next = pkgNextStep(p);
  const mark = st => st === "done" ? "&#10003;" : st === "part" ? "&#9685;" : "&#9675;";
  const authLine = p.kind === "claims"
    ? (p.authorized_hours != null
        ? `Auth: ${esc(p.authorized_hours)} hrs${p.authorized_budget != null ? " / $" + esc(p.authorized_budget.toLocaleString()) : ""} &middot; Used: ${esc(p.hours_used)} hrs`
        : "No authorization set")
    : (p.retainer
        ? `Retainer: $${esc(p.retainer.amount.toLocaleString())} &middot; Balance: $${esc(p.retainer.remaining.toLocaleString())}`
        : "Private client");
  return `<div class="pcard">
    <div class="pc-top">
      <div>
        <span class="tag ${p.kind === "claims" ? "claims" : "consumer"}">${esc(p.case_type || (p.kind === "claims" ? "Insurance" : "Private"))}</span>
        <div style="font-weight:800;margin-top:5px">${esc(p.client || "")}</div>
        <div style="font-size:.85rem;color:var(--muted)">${esc(p.subject || "")}</div>
        <div class="mono" style="font-size:.72rem;margin-top:3px">${esc(p.case_no)}</div>
        <div style="font-size:.76rem;color:var(--muted);margin-top:4px">${authLine}</div>
      </div>
      ${ringHtml(prog.pct)}
    </div>
    <div class="pc-mods">
      ${prog.mods.map(([id, st, sub]) => `<button class="pc-m ${st}" data-act="pkgJump"
          data-case="${esc(p.case_no)}" data-tab="${MOD_TAB[id]}">
        <b>${mark(st)}</b>${MOD_LABEL[id]}<div>${esc(sub)}</div></button>`).join("")}
    </div>
    <div class="pc-next">
      <div><small>Next step</small><b>${esc(next.label)}</b></div>
      <button class="btn sm" data-act="pkgJump" data-case="${esc(p.case_no)}" data-tab="${next.tab}">
        Continue case &rarr;</button>
    </div>
  </div>`;
}

/* SURVEILLANCE P18 — who is out right now. Operational only: who, which case,
   when they started, how long, and how recently they logged something. No
   location and no GPS — the handoff is explicit that this phase tracks nobody's
   position. Drawn only when someone is actually out. */
function outNowHtml(){
  const rows = (OUT_NOW && OUT_NOW.out_now) || [];
  if(!rows.length) return "";
  const skew = OUT_NOW.server_now ? Date.parse(OUT_NOW.server_now) - Date.now() : 0;
  const ago = iso => {
    if(!iso) return "—";
    const m = Math.max(0, Math.round(((Date.now() + skew) - Date.parse(iso)) / 60000));
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
  };
  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Out now</h2>
      <span class="count">${rows.length} in the field</span></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Investigator</th><th>Case</th><th>Started</th><th>Elapsed</th><th class="hide">Last activity</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="click" data-act="openCase" data-case="${esc(r.case_no)}">
        <td><b>${esc(r.investigator || "—")}</b></td>
        <td class="mono">${esc(r.case_no)}<div class="tl-m">${esc(r.subject_name || "")}</div></td>
        <td>${esc(t12(r.start_time))}</td>
        <td>${ago(r.started_at)}</td>
        <td class="hide">${r.last_activity
          ? `${esc(String(r.last_activity.description || "").slice(0, 44))}
             <div class="tl-m">${ago(r.last_activity.created_at)} ago &middot; ${r.activity_count} total</div>`
          : `<span class="tl-m">Nothing logged yet</span>`}</td>
      </tr>`).join("")}</tbody></table></div>
  </div>`;
}

function dashView(){
  if(!PKGS) return `<div class="card"><div class="empty">Loading the dashboard&hellip;</div></div>`;
  const out = PKGS.outstanding || 0;
  const active = (PKGS.packages || []);
  return `${outNowHtml()}
    <div class="stats" style="margin-top:0">
      <div class="stat ${out ? "click warn" : ""}" ${out ? `data-act="tab" data-tab="invoices"` : ""}>
        <div class="stat-n">$${esc(out.toLocaleString())}</div>
        <div class="stat-l">Outstanding</div>
        ${out ? `<div class="stat-h">View invoices</div>` : ""}
      </div>
    </div>
    <div class="card">
      <div class="bar"><h2 style="margin:0">Case packages</h2>
        <span class="count">At-a-glance progress for active cases</span>
        <button class="btn sm ghost" data-act="tab" data-tab="cases" style="margin-left:auto">View all cases &rarr;</button></div>
      ${active.length ? `<div class="pkgcards">${active.map(pkgCard).join("")}</div>`
        : `<div class="empty">No active cases. New intakes appear here as cases the moment they arrive.</div>`}
    </div>`;

/* The dashboard strip answers one question: what needs my attention today?
   Every card that can act carries the case numbers behind its count, so
   clicking it shows exactly those cases instead of leaving a number to go
   hunting after. Cards whose data does not exist yet — client responses,
   expenses, closure — arrive with their features rather than sitting at a
   fake zero. Drawn even when the portal is empty, because a page that shows
   nothing at all looks broken. */
function summaryCards(){
  if(TAB !== "cases" && TAB !== "today" && TAB !== "dashboard") return "";
  const s = SUMMARY || {};
  const shown = SHOW_EXAMPLE ? examplesFor(ME.role) : [];
  const admin = ME.role === "admin";

  const card = (label, n, hint, tone, set) => {
    const act = set && n > 0;
    const on = act && CARD_FILTER && CARD_FILTER.label === label;
    return `<div class="stat ${tone||""}${act ? " click" : ""}${on ? " on" : ""}"${
        act ? ` data-act="cardFilter" data-label="${esc(label)}" data-set="${esc(set.join(","))}"` : ""}>
      <div class="stat-n">${n}</div>
      <div class="stat-l">${esc(label)}</div>
      ${hint ? `<div class="stat-h">${esc(hint)}</div>` : ""}
    </div>`;
  };

  const active = s.active_now || [], due = s.reports_due || [], low = s.auth_low || [];
  const late = s.tasks_overdue || [];
  const total = (s.total || 0) + shown.length;

  const cards = admin
    ? card("Open cases", (s.open || 0) + shown.length, total ? "" : "None yet")
      + card("Needs assignment", (s.unassigned || 0) + shown.filter(c => !c.assigned_name).length,
             "Waiting on you", (s.unassigned || 0) ? "warn" : "")
      + card("Out now", active.length, "A day is running", active.length ? "live" : "", active)
      + card("Reports due", due.length, "Day done, no report", due.length ? "warn" : "", due)
      + card("Authorization low", low.length,
             s.auth_warn_at ? `Past ${s.auth_warn_at}% of hours` : "Hours running out",
             low.length ? "warn" : "", low)
      + card("Tasks overdue", late.length, "Past their due date", late.length ? "warn" : "", late)
      + card("Awaiting client", (s.awaiting_client || []).length, "Ball in their court", "",
             s.awaiting_client || [])
      + card("Ready to close", (s.ready_to_close || []).length, "Complete — run the checklist",
             (s.ready_to_close || []).length ? "live" : "", s.ready_to_close || [])
      + card("Expenses to review", (s.expenses_pending || []).length, "Awaiting your call",
             (s.expenses_pending || []).length ? "warn" : "", s.expenses_pending || [])
      + (s.storage ? card("Storage",
             (s.storage.bytes_used / 1073741824).toFixed(s.storage.bytes_used > 107374182 ? 1 : 2) + " GB",
             s.storage.percent_of_free + "% of the free plan" + (s.storage.percent_of_free >= 90 ? " — uploads pause at the cap" : ""),
             s.storage.percent_of_free >= 90 ? "over" : s.storage.percent_of_free >= 75 ? "warn" : "") : "")
    : card("Assigned to you", total, total ? "" : "Nothing yet")
      + card("Out now", active.length, "Your day is running", active.length ? "live" : "", active)
      + card("Reports due", due.length, "Finish or fix a report", due.length ? "warn" : "", due)
      + card("Authorization low", low.length, "Call before exceeding", low.length ? "warn" : "", low)
      + card("Tasks overdue", late.length, "Past their due date", late.length ? "warn" : "", late);

  // No Hide button here — the banner over the case list already carries one,
  // and two controls doing the same thing is how a page starts feeling
  // untrustworthy about which one you actually pressed.
  return `<div class="stats">${cards}</div>${
    SHOW_EXAMPLE ? `<div class="ex-note" style="margin-bottom:16px">
      <b>These totals include the example</b> &mdash; they drop back to your real numbers when you hide it.
    </div>` : ""}`;
}

/* The investigator's day, answered directly: am I out now, what is assigned
   to me, what do I owe. Everything here is already scoped by the Worker. */
/* Short labels the way a wall calendar wants them, derived from the case
   type so the list stays configuration-driven. */
function calLabel(t, kind){
  const s = String(t || "");
  if(/surveillance/i.test(s)) return "SURV";
  if(/statement/i.test(s)) return "STATEMENT";
  if(/canvass|field/i.test(s)) return "CANVASS";
  if(/custody/i.test(s)) return "CUSTODY";
  if(/infidelity|adultery/i.test(s)) return "INFIDELITY";
  if(/scene/i.test(s)) return "SCENE";
  if(/background|social/i.test(s)) return "BACKGROUND";
  if(/skip|locate/i.test(s)) return "LOCATE";
  return kind === "claims" ? "INS" : "PRIVATE";
}

function calendarView(){
  if(!CAL) return `<div class="card"><div class="empty">Loading the calendar&hellip;</div></div>`;
  const [y, m] = CAL.month.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const daysIn = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const now = new Date();   // local, like the grid — UTC would drift the ring near midnight
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

  const byDate = {};
  for(const d of CAL.days){
    (byDate[d.day_date] = byDate[d.day_date] || []).push({
      kind: "day", label: calLabel(d.case_type, d.kind), case_no: d.case_no,
      who: d.investigator, running: !d.end_time, hours: d.hours,
    });
  }
  for(const o of CAL.offers){
    (byDate[o.investigation_date] = byDate[o.investigation_date] || []).push({
      kind: "offer", label: calLabel(o.case_type, o.kind), case_no: o.case_no || null,
      who: o.investigator || null, loc: o.general_location,
    });
  }

  let cells = "";
  for(let i = 0; i < lead; i++) cells += `<div class="cal-cell cal-pad"></div>`;
  for(let d = 1; d <= daysIn; d++){
    const iso = `${CAL.month}-${String(d).padStart(2, "0")}`;
    const evs = byDate[iso] || [];
    cells += `<div class="cal-cell${iso === today ? " cal-today" : ""}">
      <div class="cal-d">${d}</div>
      ${evs.map(e => e.kind === "offer"
        ? `<span class="cal-ev cal-offer" ${e.case_no ? `data-act="openCase" data-case="${esc(e.case_no)}"` : `data-act="tab" data-tab="today"`}
             title="Offered${e.loc ? " — " + esc(e.loc) : ""}">◦ ${esc(e.label)}${e.who ? " · " + esc(e.who) : ""}</span>`
        : `<span class="cal-ev${e.running ? " cal-run" : ""}" data-act="openCase" data-case="${esc(e.case_no)}"
             title="${esc(e.case_no)}${e.who ? " — " + esc(e.who) : ""}">${esc(e.label)}${
             ME.role === "admin" && e.who ? " · " + esc(e.who.split(" ")[0]) : ""}${e.hours != null ? ` · ${esc(e.hours)}h` : e.running ? " · out" : ""}</span>`
      ).join("")}
    </div>`;
  }
  const monthName = first.toLocaleDateString(undefined, {month: "long", year: "numeric"});
  return `<div class="card">
    <div class="bar">
      <h2 style="margin:0">Calendar</h2>
      <button class="btn sm ghost" data-act="calMonth" data-d="-1">&larr;</button>
      <b>${esc(monthName)}</b>
      <button class="btn sm ghost" data-act="calMonth" data-d="1">&rarr;</button>
      <span class="count">${ME.role === "admin" ? "every investigator" : "your days and offers"}</span>
    </div>
    <div class="cal-grid">
      ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(w => `<div class="cal-w">${w}</div>`).join("")}
      ${cells}
    </div>
    <p class="hint">Solid chips are investigation days — click one to open the case. Hollow chips are
      pending offers.</p>
  </div>`;
}

function todayView(){
  const s = SUMMARY || {};
  const pending = (OFFERS || []).filter(o => o.status === "offered");
  const offerCards = pending.length ? `<h3 class="tl-day">Offered to you — accept or decline</h3>
    <div class="rlist">${pending.map(o => `<div class="rcard" style="cursor:default">
      <div class="rc-h"><b>${esc(o.case_type || "Investigation")}</b>
        <span class="tag rs-submitted">Offered</span></div>
      <div class="tl-m">${o.investigation_date ? esc(fmtDay(o.investigation_date)) : "Date to be set"}${
        o.expected_hours ? ` · ${esc(o.expected_hours)} hours` : ""}${
        o.general_location ? ` · ${esc(o.general_location)}` : ""}</div>
      <div class="tl-m">${o.compensation_hourly != null ? `Pays $${esc(o.compensation_hourly)}/hr` : ""}${
        o.mileage_terms ? ` · ${esc(o.mileage_terms)}` : ""}</div>
      <div class="ractions" style="margin-top:8px">
        <button class="btn sm" data-act="acceptOffer" data-id="${o.id}">Accept</button>
        <input class="of-reason" data-id="${o.id}" placeholder="Reason (optional)"
          style="flex:1;min-width:140px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:6px;padding:6px 8px">
        <button class="btn sm ghost" data-act="declineOffer" data-id="${o.id}">Decline</button>
      </div></div>`).join("")}</div>` : "";
  const active = s.active_now || [], due = s.reports_due || [];

  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Today</h2></div>

    ${active.length ? `<h3 class="tl-day">Out now — a day is running</h3>
      <div class="rlist">${active.map(no => caseRow(no, '<span class="tag cap-sd">Running</span>')).join("")}</div>` : ""}
    ${due.length ? `<h3 class="tl-day">Reports owed</h3>
      <div class="rlist">${due.map(no => caseRow(no, '<span class="tag rs-needs_revision">Report due</span>')).join("")}</div>` : ""}
    ${mine.length ? `<h3 class="tl-day">Your caseload</h3>
      <div class="rlist">${mine.map(c => caseRow(c.case_no)).join("")}</div>`
      : `<div class="empty">Nothing is assigned to you right now.</div>`}
    ${!active.length && !due.length && mine.length
      ? `<p class="note">Nothing is waiting on you beyond the caseload above.</p>` : ""}
  </div>`;
}

/* Two documents the office sends: the retainer sheet for a private client, the
   block ladder for a carrier. Neither is on the public site — a price is quoted
   to someone who asked, not published to everyone who visits. */
/* UIBUILD P16 — Leads & intakes: every early-stage submission as a card the
   office can act on. Leads ARE submissions — same table, same workspace, so
   accepting one is just walking it forward, and nothing can drift. */
function leadsView(){
  const stageOf = c => c.stage || c.status;
  const leadState = c => {
    const st = stageOf(c);
    if(st === "new") return ["New", "new"];
    if(st === "awaiting_client") return ["More info requested", "awaiting_client"];
    return ["Accepted", "assigned"];
  };
  const pool = CASES.filter(c => !["closed", "complete", "cancelled"].includes(stageOf(c)));
  const fresh = pool.filter(c => ["new", "awaiting_client"].includes(stageOf(c)));
  const accepted = pool.filter(c => !["new", "awaiting_client"].includes(stageOf(c))).slice(0, 6);

  const card = c => {
    const [lbl, tone] = leadState(c);
    const claim = c.kind === "claims";
    const open = ["new", "awaiting_client"].includes(stageOf(c));
    /* MASTER §5 — the lead's own status, beside (never instead of) the intake
       state. The select is the office's hand; the two sends stamp themselves. */
    const ls = c.lead_status || "lead";
    const sendRow = LEAD_SEND && LEAD_SEND.case_no === c.case_no ? `
      <div class="lead-send">
        <input id="ls_to" type="email" placeholder="name@example.com" value="${esc(LEAD_SEND.to)}">
        <button class="btn sm" data-act="leadIntakeSend" data-case="${esc(c.case_no)}"${LEAD_SEND.busy ? " disabled" : ""}>${LEAD_SEND.busy ? "Sending&hellip;" : "Send"}</button>
        <button class="btn sm ghost" data-act="leadIntakeCancel">Cancel</button>
        ${LEAD_SEND.err ? `<div class="err" style="flex-basis:100%;margin:4px 0 0">${esc(LEAD_SEND.err)}</div>` : ""}
      </div>` : "";
    return `<div class="pcard">
      <div class="pc-top"><div>
        <span class="tag ${claim ? "claims" : "consumer"}">${claim ? "Insurance" : "Private"}</span>
        <span class="tag ${tone}">${lbl}</span>
        <span class="tag lead-${esc(ls)}">${esc(LEAD_LABEL[ls] || ls)}</span>
        <div style="font-weight:800;margin-top:5px">${esc(claim ? (c.carrier || c.client_name || "—") : (c.client_name || "—"))}</div>
        <div style="font-size:.85rem;color:var(--muted)">${esc(c.subject_name || "")}</div>
        ${c.claim_number ? `<div class="mono" style="font-size:.72rem;margin-top:2px">Claim ${esc(c.claim_number)}</div>` : ""}
        <div class="mono" style="font-size:.72rem;margin-top:3px">${esc(c.case_no)}</div>
        <div style="font-size:.76rem;color:var(--muted);margin-top:4px">Received ${when(c.created_at)}</div>
        ${c.send_count ? `<div style="font-size:.76rem;color:var(--muted);margin-top:2px">
          &#9993; ${c.send_count} sent &middot; last ${when(c.last_sent_at)}</div>` : ""}
      </div>
      <label class="f" style="margin:0"><span>Lead status</span>
        <select data-act="leadStatus" data-case="${esc(c.case_no)}">
          ${Object.entries(LEAD_LABEL).map(([v, l]) =>
            `<option value="${v}" ${ls === v ? "selected" : ""}>${l}</option>`).join("")}
        </select></label>
      </div>
      <div class="pc-next">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn sm ghost" data-act="openCase" data-case="${esc(c.case_no)}">Review</button>
          <button class="btn sm ghost" data-act="openCaseTab" data-case="${esc(c.case_no)}" data-tab="comms">Message</button>
          <button class="btn sm ghost" data-act="leadSheet" data-case="${esc(c.case_no)}" data-kind="${esc(c.kind)}">Send rate sheet</button>
          <button class="btn sm ghost" data-act="leadIntake" data-case="${esc(c.case_no)}">Send intake</button>
        </div>
        ${sendRow}
        ${open ? `<button class="btn sm" data-act="openCaseTab" data-case="${esc(c.case_no)}" data-tab="assign">Accept &rarr;</button>` : ""}
      </div>
    </div>`;
  };

  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Leads &amp; intakes</h2>
      <span class="count">${fresh.length} awaiting a decision</span>
      <button class="btn sm" data-act="tab" data-tab="newlead" style="margin-left:auto">+ Intake a client</button></div>
    ${LEAD_MSG ? `<div class="note">${esc(LEAD_MSG)}</div>` : ""}
    ${fresh.length ? `<div class="pkgcards">${fresh.map(card).join("")}</div>`
      : `<div class="empty">Nothing waiting. New submissions and phoned-in leads land here the moment they exist.</div>`}
    ${accepted.length ? `<h3 style="margin:18px 0 6px;font-size:1rem">Recently accepted</h3>
      <div class="pkgcards">${accepted.map(card).join("")}</div>` : ""}
  </div>`;
}

/* UIBUILD P18 — the 3-step send wizard. The Options step offers exactly one
   intake — the sheet's own, paired by the Worker — so the wrong door cannot
   be sent from here even on a bad day. */
function sheetWizardHtml(){
  const w = SHEET_WIZ;
  const sheet = SHEETS.find(s => s.id === w.sheet) || {};
  const intakeLabel = w.sheet === "insurance_assignment"
    ? "Insurance Assignment Intake" : "Private Client Intake";
  /* The include-intake choice lives on the FIRST screen (owner, 2026-08-14).
     It used to be a second step called Options, which meant it existed and
     was tested and the owner still never saw it — a control you must click
     Next to discover is not a visible option. One screen asks everything;
     Preview shows exactly what will go. */
  const steps = ["Recipient & options", "Preview"];
  const rail = `<div class="pkg-steps">${steps.map((s2, i) =>
    `<span class="pkg-step ${w.step > i + 1 ? "done" : w.step === i + 1 ? "on" : ""}">${
      w.step > i + 1 ? "&#10003;" : i + 1} ${s2}</span>`).join("")}</div>`;
  const body =
    w.step === 1 ? `
      <label class="f"><span>Send it to</span>
        <input id="wiz_to" type="email" value="${esc(w.to)}" placeholder="name@example.com"></label>
      <div class="two">
        <label class="f"><span>Case number <span class="opt">optional — subject line</span></span>
          <input id="wiz_case" value="${esc(w.caseNo)}"></label>
        <label class="f"><span>Add a line <span class="opt">optional</span></span>
          <input id="wiz_note" value="${esc(w.note)}" placeholder="e.g. As discussed this morning."></label>
      </div>
      <label class="cap" style="display:flex"><input type="checkbox" id="wiz_inc" ${w.include ? "checked" : ""}>
        <span>Include the <b>${intakeLabel}</b> form link</span></label>
      <p class="hint">The matching intake is paired automatically. ${w.sheet === "insurance_assignment"
        ? "Carriers land on the Secure Assignment Intake — never the consumer picker."
        : "Private clients land on the private intake — the carrier path is never offered."}</p>`
    : `
      <dl class="detail">
        <dt>Sheet</dt><dd>${esc(sheet.name || w.sheet)}</dd>
        <dt>To</dt><dd>${esc(w.to)}</dd>
        ${w.caseNo ? `<dt>Case</dt><dd>${esc(w.caseNo)}</dd>` : ""}
        ${w.note ? `<dt>Added line</dt><dd>${esc(w.note)}</dd>` : ""}
        <dt>Intake form</dt><dd>${w.include ? intakeLabel + " link included" : "Not included"}</dd>
      </dl>
      <p class="hint">The email is the sheet exactly as shown on this page${w.include ? ", plus the intake button" : ""}.</p>`;
  return `<div class="amwrap" data-act="wizClose">
    <div class="amsheet" data-act="amNoop" role="dialog" aria-modal="true" aria-label="Send the rate sheet">
      <div class="amhead"><b>Send &mdash; ${esc(sheet.selector_label || sheet.name || "")}</b>
        <button class="amx" data-act="wizClose" aria-label="Close">&times;</button></div>
      ${rail}
      ${body}
      <div class="actions" style="margin-top:12px">
        ${w.step > 1 ? `<button class="btn ghost sm" data-act="wizStep" data-s="${w.step - 1}">&larr; Back</button>` : ""}
        ${w.step < 2 ? `<button class="btn sm" data-act="wizStep" data-s="${w.step + 1}">Preview &rarr;</button>`
          : `<button class="btn sm" data-act="wizSend">Send it</button>`}
      </div>
      ${w.err ? `<div class="err">${esc(w.err)}</div>` : ""}
    </div>
  </div>`;
}

function casesView(){
  const q = FILTER.trim().toLowerCase();
  const admin = ME.role === "admin";
  // A card filter narrows to the exact cases behind that card's number; the
  // example never stands in among them, because an alert is real work.
  const base = CARD_FILTER
    ? CASES.filter(c => CARD_FILTER.set.has(c.case_no))
    : (SHOW_EXAMPLE ? CASES.concat(examplesFor(ME.role)) : CASES);
  /* MASTER §31 — the Cases tab's lens. Open hides finished work; Completed is
     the artifact desk. Admin-only: an investigator's list is their
     assignments, and the desk carries invoices and client identity. */
  const terminal = c => ["complete", "closed", "cancelled"].includes(c.stage || "") || c.status === "closed";
  const shown = admin && CASE_VIEW === "open" ? base.filter(c => !terminal(c)) : base;
  const rows = shown.filter(c => !q || [c.case_no, c.client_name, c.subject_name, c.carrier, c.claim_number]
    .some(v => (v || "").toLowerCase().includes(q)));

  // Case numbers reach this markup from a public form, so they go in a data
  // attribute read by a delegated listener — never interpolated into script.
  //
  // The client/carrier column is admin-only: the Worker does not send those
  // fields to an investigator at all, so there is nothing to put in it.
  const body = rows.map(c => `
    <tr class="click${isExample(c.case_no) ? " ex" : ""}" data-act="openCase" data-case="${esc(c.case_no)}">
      <td class="mono">${esc(c.case_no)}</td>
      <td class="hide">${when(c.created_at)}</td>
      <td><span class="tag ${c.kind === "claims" ? "claims" : "consumer"}">${c.kind === "claims" ? "Claim" : "Client"}</span>${
        isExample(c.case_no) ? '<span class="tag ex-tag">Example</span>' : ""}${
        isDemo(c.case_no) ? '<span class="tag demo-tag">Test</span>' : ""}</td>
      ${admin ? `<td>${esc(c.kind === "claims" ? (c.carrier || "—") : (c.client_name || "—"))}
          ${c.claim_number ? `<div class="mono">${esc(c.claim_number)}</div>` : ""}</td>
      <td class="hide">${esc(c.subject_name || "—")}</td>`
      : `<td>${esc(c.subject_name || "—")}</td>`}
      <td><span class="tag ${esc(c.stage || c.status)}">${esc(label(c.stage || c.status))}</span></td>
      ${admin ? `<td class="hide">${esc(c.assigned_name || "—")}</td>` : ""}
    </tr>`).join("");

  const more = TOTAL > CASES.length
    ? `<div class="note">Showing the ${CASES.length} most recent of ${TOTAL} cases. Search covers what is loaded.</div>` : "";

  const exBanner = SHOW_EXAMPLE ? `<div class="ex-note">
      <b>The rows marked Example are not real cases.</b> They are here to show the layout &mdash;
      ${ME.role === "admin"
        ? "a carrier assignment and a client intake, with every field filled in."
        : "an assignment exactly as one will look when it is given to you."}
      Open one to see the full detail. Nothing here is stored, and it disappears the moment you hide it.
      <button class="btn sm ghost" data-act="hideExample" style="margin-left:8px">Hide the example</button>
    </div>` : "";

  const filterChip = CARD_FILTER
    ? `<span class="chip">${esc(CARD_FILTER.label)}: ${CARD_FILTER.set.size}
         <button data-act="clearCardFilter" aria-label="Clear filter">&times;</button></span>`
    : "";

  const lens = admin ? `<div class="lensrow">${
    [["all", "All"], ["open", "Open"], ["completed", "Completed"]].map(([v, l]) =>
      `<button class="lens ${CASE_VIEW === v ? "on" : ""}" data-act="caseView" data-v="${v}">${l}</button>`).join("")
    }</div>` : "";

  if(admin && CASE_VIEW === "completed"){
    return `<div class="card">
      <div class="bar">
        <h2 style="margin:0">Cases</h2>
        <input id="q" placeholder="Search case, client, carrier, claim no." value="${esc(FILTER)}" data-act="filter">
      </div>
      ${lens}
      ${completedDesk(q)}
    </div>`;
  }

  return `<div class="card">
    <div class="bar">
      <h2 style="margin:0">Cases</h2>${filterChip}
      <input id="q" placeholder="${admin ? "Search case, client, carrier, claim no." : "Search case or subject"}" value="${esc(FILTER)}" data-act="filter">
      <span class="count">${rows.length} of ${shown.length}${
        (s => s && (s.claims || s.consumer)
          ? ` · ${s.claims || 0} carrier · ${s.consumer || 0} private` : "")(SUMMARY)}</span>
    </div>
    ${lens}
    ${exBanner}
    ${more}
    ${rows.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>Case</th><th class="hide">Received</th><th>Type</th>
      ${admin ? `<th>Client / carrier</th><th class="hide">Subject</th>` : `<th>Subject</th>`}
      <th>Status</th>${admin ? `<th class="hide">Assigned</th>` : ""}</tr></thead>
      <tbody>${body}</tbody></table></div>`
      : `<div class="empty">${
          // Never claim the list is empty when it simply did not load — that
          // is the sentence that made a real outage look like a quiet week.
          LOAD_ERR ? "The case list did not load, so nothing can be shown here yet."
          : shown.length
            ? "Nothing matches that search."
            : (ME.role === "admin"
                ? "No submissions yet. Intake forms appear here as they arrive."
                : "Nothing assigned to you yet. Cases appear here when an admin assigns one.")
              + ` <button class="btn sm ghost" data-act="showExample" style="margin-left:8px">Show an example</button>`}</div>`}
  </div>`;
}

/* MASTER §31 — the desk itself. Every finished case with its artifacts one

   controls). The deep links land on the tab that holds the download — the
   reports tab has Print / Save as PDF, the package tab has Download and the
   evidence index inside the document. */

  if(!list.length) return `<div class="empty">${q ? "Nothing completed matches that search."

       <b>Complete</b>, it passes the closing checklist, or its client package is finalized.`}</div>`;
  const go = (c, tab, lbl) => `<button class="btn sm ghost" data-act="pkgJump"

      <div style="text-align:right;font-size:.79rem;color:var(--muted)">
        ${c.finalized_at ? `Package v${esc(String(c.build_version))} &middot; ${when(c.finalized_at)}` : ""}
        ${c.delivered_at ? `<br>Delivered ${when(c.delivered_at)}` : ""}
        ${c.stage_at ? `<br>${esc(label(c.stage || ""))} ${when(c.stage_at)}` : ""}
      </div>
    </div>
    <div class="dc-acts">
      <button class="btn sm" data-act="openCase" data-case="${esc(c.case_no)}">Open case</button>
      ${c.approved_reports ? go(c, "reports", `Final report${c.approved_reports > 1 ? ` &middot; ${c.approved_reports} days` : ""}`) : ""}
      ${c.evidence_count ? go(c, "evidence", `Evidence &middot; ${c.evidence_count}`) : ""}

/* PRIVATE CLIENT PAYMENT METHODS (PAYMENTS.md §2/§8, owner 2026-08-15).

   This screen exists because the Worker refuses a send when a method is
   switched on with no payment link, and that refusal said "add a link in
   Settings" while no such screen existed — an error with no way to act on it.
   An admin was blocked from sending and had nothing to click.

   PRIVATE CLIENT ONLY. Nothing here is offered on an insurance sheet, a
   carrier email or the insurance wizard; the Worker decides that from the
   sheet id and the page never gets a vote. The handles themselves arrive from
   an admin-only route, so they are not in this file and not in the page source
   an investigator could read — only the labels are.

   NO CREDENTIALS. There is no field for a password, a token or an account
   login, and the Worker has no column to store one. */
function paymentSettingsHtml(){
  if(ME.role !== "admin") return "";
  if(!PAYCFG) return `<div class="card"><div class="bar"><h2 style="margin:0">Private client payment methods</h2></div>
    <div class="empty">Loading payment methods&hellip;</div></div>`;

  const row = m => {
    const clickable = !!(m.url || "").trim();
    /* Show what the admin last typed, not what the server last stored — but
       ONLY where they actually typed something. `d[k] || m[k]` would be the
       bug all over again: an empty string is a deliberate answer ("I cleared
       this"), and falling back on it restores the value they just removed. */
    const d = PAY_DRAFT[m.id];
    const val = k => (d && d[k] !== undefined) ? d[k] : m[k];
    return `<div class="feebox" style="margin:0 0 12px" data-pay="${esc(m.id)}">
      <div class="row"><span><b>${esc(m.label)}</b>${m.from_default
        ? ` <span class="opt">firm default</span>` : ""}</span>
        <span>${m.enabled
          ? (clickable ? `<span class="tag closed">On</span>`
                       : `<span class="tag rs-needs_revision">On, but not sendable</span>`)
          : `<span class="tag new">Off</span>`}</span></div>
      ${d ? `<p class="hint" style="color:var(--bad)"><b>Not saved yet.</b> The boxes below are what
        you typed. The state on the right is what clients get until this saves.</p>` : ""}
      ${m.enabled && !clickable ? `<p class="hint" style="color:var(--bad)">
        This method is switched on but has no payment link, so it cannot be offered to a client
        and a send that includes it will be refused. Add the link below, or switch it off.</p>` : ""}
      <label class="f"><span>Show to the client as</span>
        <input id="pm_name_${esc(m.id)}" value="${esc(val("display_name"))}" placeholder="${esc(m.label)}"></label>
      <label class="f"><span>Handle <span class="opt">shown to the client, exactly as typed</span></span>
        <input id="pm_handle_${esc(m.id)}" value="${esc(val("handle"))}"
          placeholder="${m.id === "venmo" ? "@Your-Venmo-Name" : "$YourCashtag"}"></label>
      <label class="f"><span>Payment link <span class="opt">required while this method is on</span></span>
        <input id="pm_url_${esc(m.id)}" value="${esc(val("url"))}"
          placeholder="${m.id === "venmo" ? "https://venmo.com/u/Your-Venmo-Name" : "https://cash.app/$YourCashtag"}"></label>
      <p class="hint">The link is never built from the handle. A Venmo handle is written with an
        @ and its web address is not &mdash; guessing one from the other sends a client somewhere
        that is not yours. Paste the address from the app.</p>
      <label class="f"><span>Instructions <span class="opt">optional</span></span>
        <input id="pm_note_${esc(m.id)}" value="${esc(val("instructions"))}"
          placeholder="e.g. Include your case number in the note"></label>
      <div class="actions">
        <button class="btn sm" data-act="paySave" data-id="${esc(m.id)}" data-on="1">Save and switch on</button>
        <button class="btn sm ghost" data-act="paySave" data-id="${esc(m.id)}" data-on="0">Save and switch off</button>
      </div>
    </div>`;
  };

  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Private client payment methods</h2></div>
    <p class="note">Where a private client sends the retainer. These appear only on the
      <b>private</b> rate sheet and its send flow &mdash; never on an insurance sheet, a carrier
      email, or anything an investigator can see.</p>
    ${PAY_MSG ? `<div class="${PAY_ERR ? "err" : "linkbox"}">${esc(PAY_MSG)}</div>` : ""}
    ${PAYCFG.map(row).join("")}
    <p class="hint">No password, login or account credential is stored here, and there is nowhere
      to put one. Everything on this screen is information the firm hands a client on purpose.</p>
  </div>`;
}

/* Saving is the recovery path for the Worker's refusal, so the WORKER'S OWN
   words are shown on failure rather than a generic "could not save" — it is
   the message that says which method and what is missing, and paraphrasing it
   here would be a second place for the rule to drift. */
async function savePaymentMethod(id, enable){
  const v = k => { const el = $(`pm_${k}_${id}`); return el ? el.value : ""; };
  PAY_MSG = ""; PAY_ERR = false;
  /* Captured BEFORE the request, so a refusal leaves the admin looking at
     their own words rather than at the values the server still holds. */
  PAY_DRAFT[id] = { display_name: v("name"), handle: v("handle"),
                    url: v("url"), instructions: v("note") };
  try{
    const r = await api(`/payment-methods/${encodeURIComponent(id)}`, {method: "POST", body: {
      enabled: enable,
      display_name: v("name"), handle: v("handle"), url: v("url"), instructions: v("note"),
    }});
    PAYCFG = r.methods;
    delete PAY_DRAFT[id];   // saved: the server's copy is now the truth
    const m = (PAYCFG || []).find(x => x.id === id);
    PAY_MSG = `${m ? m.label : "Payment method"} saved — ${enable ? "clients will be offered it" : "switched off"}.`;
  }catch(e){ PAY_MSG = e.message; PAY_ERR = true; }
  paint();
}

/* Loading the portal used to swallow every failure and paint an empty
   dashboard, which looks exactly like a portal with no cases in it. That is the
   worst possible way to fail: a case list that cannot load and a case list with
   nothing in it are not the same thing, and the screen said the same thing for
   both. Each fetch now records why it failed, and the page says so. */
let BOOTED = false;
async function render(){
  if(!ME){ paint(); return; }
  if(!BOOTED){ BOOTED = true; if(ME.role === "admin" && TAB === "cases") TAB = "dashboard"; }
  LOAD_ERR = "";
  let listed = false;
  try{
    const d = await api("/submissions?limit=200");
    CASES = Array.isArray(d.submissions) ? d.submissions : [];
    TOTAL = d.total || 0;
    listed = true;
  }catch(e){
    CASES = []; TOTAL = 0;
    LOAD_ERR = "The case list could not be loaded — " + e.message;
  }
  // A first sign-in lands on an empty table, which teaches nothing. Show the
  // worked example unasked — but only when the list genuinely loaded and is
  // genuinely empty, never as cover for a failed fetch.
  if(listed && CASES.length === 0) SHOW_EXAMPLE = true;

  if(ME.role !== "admin"){
    try{ OFFERS = (await api("/my/offers")).offers; }catch(e){ OFFERS = []; }
  }
  try{ SUMMARY = (await api("/summary")).summary; }
  catch(e){ SUMMARY = null; if(!LOAD_ERR) LOAD_ERR = "The dashboard totals could not be loaded — " + e.message; }

  // A half-applied schema is the one failure that looks like a dozen different
  // bugs, so ask directly rather than waiting to trip over it.
  try{
    const h = await api("/health");
    SCHEMA_MISSING = Array.isArray(h.missing_tables) ? h.missing_tables : [];
  }catch(e){ SCHEMA_MISSING = []; }

  if(ME.role === "admin"){
    try{ USERS = (await api("/users")).users; }catch(e){ USERS = []; }
    try{ INVITES = (await api("/invites")).invites; }catch(e){ INVITES = []; }
    try{ SHEETS = (await api("/sheets")).sheets; }catch(e){ SHEETS = []; }
    // The dashboard is the admin's landing, so render() is a second door to
    // it — the tab click is not the only way in. Without this, the first
    // sign-in paints "Loading…" forever, because nothing ever fetches.
    if(TAB === "dashboard" && !PKGS) await loadPackages();
    // Same rule for who-is-out: landed on, not only clicked into.
    try{ OUT_NOW = await api("/active"); }catch(e){ OUT_NOW = null; }
  }
  paint();
}
