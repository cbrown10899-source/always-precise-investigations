/* Priority 20 — the nine operational stages. The select offers every stage
   except closed: closing goes through the checklist, and the Worker refuses
   the shortcut. A closed case shows closed as its current value so re-saving
   is a no-op rather than an error. */
function STAGE_OPTS(s){
  const wsStage = WS && WS.case_no === s.case_no ? WS.stage : null;
  const cur = wsStage || s.stage || (s.status === "new" ? "open" : s.status) || "open";
  const stages = ["open","assigned","in_progress","report_review","awaiting_client",
                  "complete","on_hold","cancelled"];
  const list = cur === "closed" ? ["closed", ...stages] : stages;
  return list.map(v => `<option value="${v}" ${v === cur ? "selected" : ""}>${esc(label(v))}</option>`).join("");
}

/* The closing checklist: eight attestations, the only door to closed. */
function closurePanel(){
  if(ME.role !== "admin" || !WS || !WS.closure) return "";
  const c = WS.closure;
  if(c.closed_at){
    return `<div class="feebox" style="margin-top:14px">
      <div class="row"><span><b>Case closed</b></span>
        <span>${esc(c.closed_by || "")} &middot; ${when(c.closed_at)}</span></div>
      <div class="row"><span style="color:var(--muted);font-size:.85rem">Reopen by setting a status
        above and saving.</span><span></span></div>
    </div>`;
  }
  const done = c.items.filter(([k]) => c.checklist[k]).length;
  return `<form class="quick" data-act="saveClosure" style="margin-top:14px">
    <h3 style="margin:0 0 8px;font-size:1rem">Close the case <span class="opt">${done}/${c.items.length} confirmed</span></h3>
    ${c.items.map(([k, l]) => `
      <label class="cap"><input type="checkbox" id="cl_${k}" ${c.checklist[k] ? "checked" : ""}><span>${esc(l)}</span></label>`).join("")}
    <div style="margin-top:10px">
      <button class="btn ghost sm" type="submit">Save checklist</button>
      <button class="btn sm" type="button" data-act="closeCase">Close the case</button>
    </div>
    <p class="hint">Every line is your confirmation, not the system's guess. Closing needs all
      ${c.items.length}; the case can be reopened later from the status above.</p>
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;
}

async function saveClosureTicks(){
  WS_ERR = "";
  const checklist = {};
  for(const [k] of ((WS && WS.closure && WS.closure.items) || [])){
    const el = $("cl_" + k);
    if(el) checklist[k] = el.checked;
  }
  try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/closure`, {method:"POST", body:{checklist}}); }
  catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function doCloseCase(){
  await saveClosureTicks();          // what is on screen is what gets judged
  if(WS_ERR) return;
  WS_ERR = "";
  try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/close`, {method:"POST", body:{}}); }
  catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}


/* Priority 6 — evidence, with the free-plan failsafe. Uploads land in the
   private R2 bucket through the Worker, which refuses anything that could
   push the account past the free tier. Both roles upload and read on their
   cases; classification and deletion are the office's. */
function evidencePanel(){
  const admin = ME.role === "admin";
  const rows = (WS && WS.evidence) || [];
  const mb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
  const clsLabel = c => ({client_deliverable:"Client deliverable", internal_only:"Internal only",
    do_not_use:"Do not use", needs_review:"Needs review", needs_redaction:"Needs redaction"})[c] || c;
  const clsTone = c => c === "client_deliverable" ? "rs-approved" : c === "do_not_use" ? "rs-needs_revision"
    : c === "needs_redaction" ? "rs-submitted" : "rs-draft";

  const kindOf = e => String(e.content_type || "").startsWith("image/") ? "photos"
    : String(e.content_type || "").startsWith("video/") ? "video" : "docs";
  const fileUrl = e => `/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${e.id}/file`;
  const momentOf = e => {
    if(!e.entry_id) return "";
    const m = ((WS && WS.activity) || []).find(a => a.id === e.entry_id);
    return m ? `<div class="tl-m">&#128206; ${esc(t12(m.at_time))} — ${esc(String(m.description || "").slice(0, 44))}</div>` : "";
  };

  // The gallery card (UIBUILD P12): the picture leads, the classification is
  // a compact badge, and the admin controls stay small under it.
  const card = e => e.deleted_at
    ? `<div class="evcard" style="opacity:.55">
        <div class="evtile">&#128465;</div>
        <div class="rc-h" style="margin-top:6px"><b>${esc(e.filename)}</b><span class="tag rs-draft">deleted</span></div>
        <div class="tl-m">${mb(e.size_bytes)} &middot; removed ${when(e.deleted_at)} &mdash; the record stays</div>
      </div>`
    : `<div class="evcard">
        ${kindOf(e) === "photos"
          ? `<a href="${fileUrl(e)}" target="_blank" rel="noopener"><img class="evthumb" src="${fileUrl(e)}" alt="${esc(e.filename)}" loading="lazy"></a>`
          : `<div class="evtile">${kindOf(e) === "video" ? "&#127909;" : "&#128196;"}</div>`}
        <div class="rc-h" style="margin-top:6px"><b><a href="${fileUrl(e)}"
             target="_blank" rel="noopener">${esc(e.filename)}</a></b>
          <span class="tag ${clsTone(e.classification)}">${esc(clsLabel(e.classification))}</span>
          ${kindOf(e) === "video" ? `<span class="tag">Portal</span>` : ""}</div>
        <div class="tl-m">${mb(e.size_bytes)} &middot; ${esc(e.uploaded_by || "")} &middot; ${when(e.uploaded_at)}</div>
        ${e.note ? `<div class="tl-n">${esc(e.note)}</div>` : ""}
        ${momentOf(e)}
        ${admin ? `<div style="margin-top:6px"><select data-act="evClass" data-id="${e.id}" style="font-size:.78rem">
            ${["needs_review","client_deliverable","internal_only","needs_redaction","do_not_use"]
              .map(c => `<option value="${c}" ${c === e.classification ? "selected" : ""}>${clsLabel(c)}</option>`).join("")}
          </select>
          <button class="btn sm ghost" data-act="evDelete" data-id="${e.id}">Delete</button></div>` : ""}
      </div>`;

  return `
    <form class="quick" data-act="evUpload">
      <label class="f"><span>File <span class="opt">photos, video, documents &mdash; originals are never overwritten</span></span>
        <input id="ev_file" type="file"></label>
      <div class="two">
        ${admin ? `<label class="f"><span>Classification</span>
          <select id="ev_class">${["needs_review","client_deliverable","internal_only","needs_redaction","do_not_use"]
            .map(c => `<option value="${c}">${clsLabel(c)}</option>`).join("")}</select></label>` : ""}
        <label class="f"><span>Note <span class="opt">optional</span></span>
          <input id="ev_note" placeholder="e.g. Subject loading lumber, clip 2 of 3."></label>
      </div>
      <label class="f"><span>Attach to <span class="opt">a subject's photo, or the activity moment a clip documents</span></span>
        <select id="ev_link">
          <option value="">Nothing in particular</option>
          ${((WS && WS.subjects) || []).length ? `<optgroup label="Subjects">
            ${WS.subjects.map(sj => `<option value="s:${sj.id}">${esc(sj.name)}</option>`).join("")}</optgroup>` : ""}
          ${((WS && WS.activity) || []).length ? `<optgroup label="Recent activity">
            ${WS.activity.slice(0, 8).map(a => `<option value="e:${a.id}">${esc(t12(a.at_time))} — ${esc(String(a.description || "").slice(0, 48))}</option>`).join("")}</optgroup>` : ""}
        </select></label>
      <button class="btn" type="submit">Upload evidence</button>
      <p class="hint">The free-plan failsafe is on: uploads stop before storage could ever bill.
        Large video should be split into parts.</p>
      ${WS_NOTICE ? `<div class="note">${esc(WS_NOTICE)}</div>` : ""}
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>
    <div class="evtabs">${[["all","All"], ["photos","Photos"], ["video","Video"], ["docs","Documents"]]
      .map(([k, lbl]) => {
        const n = k === "all" ? rows.length : rows.filter(e => !e.deleted_at && kindOf(e) === k).length;
        return `<button class="evtab ${EV_TAB === k ? "on" : ""}" data-act="evTab" data-t="${k}">${lbl}${n ? ` (${n})` : ""}</button>`;
      }).join("")}</div>
    ${(() => {
      const shown = EV_TAB === "all" ? rows : rows.filter(e => !e.deleted_at && kindOf(e) === EV_TAB);
      return shown.length ? `<div class="evgrid">${shown.map(card).join("")}</div>`
        : `<div class="empty">${rows.length ? "Nothing of this type on the case." : "Nothing stored on this case yet."}</div>`;
    })()}`;
}

async function uploadEvidenceFile(){
  WS_ERR = ""; WS_NOTICE = "";
  const f = $("ev_file") && $("ev_file").files[0];
  if(!f){ WS_ERR = "Pick a file first."; return paintCase(); }
  const fd = new FormData();
  fd.append("file", f);
  if($("ev_class")) fd.append("classification", $("ev_class").value);
  fd.append("note", $("ev_note").value);
  const link = $("ev_link") ? $("ev_link").value : "";
  if(link.startsWith("s:")) fd.append("subject_id", link.slice(2));
  if(link.startsWith("e:")) fd.append("entry_id", link.slice(2));
  try{
    const res = await fetch(`/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence`,
      {method: "POST", credentials: "same-origin", body: fd});
    const d = await res.json().catch(() => ({}));
    if(!res.ok) throw new Error(d.error || ("Upload failed (" + res.status + ")"));
    WS_NOTICE = "Stored. " + (d.usage ? d.usage.percent_of_free + "% of the free plan used." : "");
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function setEvidenceClass(id, cls){
  WS_ERR = "";
  try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/evidence/${id}`, {method:"POST", body:{classification: cls}}); }
  catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function deleteEvidenceRow(id){
  WS_ERR = "";
  try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/evidence/${id}/delete`, {method:"POST", body:{}}); }
  catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}


/* The Case Package (CASEBUILD.md + UXSIMPLIFY P9/P13/P16/P17). One screen
   that says what is done, what is missing, and finalizes the client package
   behind the Worker's gates. Admin-only — an investigator never selects
   client deliverables. */
let PKG = null;   // buildState from the Worker

async function loadPackage(){
  try{ PKG = await api(`/cases/${encodeURIComponent(WS_CASE)}/build`); }
  catch(e){ PKG = null; WS_ERR = e.message; }
  paintCase();
}

function pkgMark(state){   // done | part | none | warn — never color alone
  return state === "done" ? '<span class="pk-s">&#10003;</span>'
       : state === "part" ? '<span class="pk-s">&#9685;</span>'
       : state === "warn" ? '<span class="pk-s">!</span>'
       : '<span class="pk-s">&#9675;</span>';
}

function packagePanel(){
  if(!PKG) return `<div class="empty">Loading the package&hellip;</div>`;
  const b = PKG.build;
  const ev = PKG.evidence || [];
  const items = PKG.items || [];
  const inPkg = id => items.some(i => i.evidence_id === id);
  const photos = ev.filter(e => String(e.content_type || "").startsWith("image/"));
  const videos = ev.filter(e => String(e.content_type || "").startsWith("video/"));
  const others = ev.filter(e => !String(e.content_type || "").startsWith("image/")
                             && !String(e.content_type || "").startsWith("video/"));
  const eligible = e => e.classification === "client_deliverable";
  const act = (WS && WS.activity || []).length;
  const rep = PKG.approved_report ? "done" : ((WS && WS.reports || []).length ? "part" : "none");
  const inv = (PKG.invoices || [])[0];

  /* The mini-dashboard: state blocks, each a door (UXSIMPLIFY P9/P14/P19). */
  const blocks = `
    <div class="pkg-blocks">
      <button class="pkg-b ${act ? "done" : ""}" data-act="wsTab" data-tab="activity">
        <b>Activity</b><span class="pk-v">${act} entr${act === 1 ? "y" : "ies"}</span>${pkgMark(act ? "done" : "none")}</button>
      <button class="pkg-b ${rep === "done" ? "done" : rep === "part" ? "part" : ""}" data-act="wsTab" data-tab="reports">
        <b>Report</b><span class="pk-v">${PKG.approved_report ? "Approved" : (WS && WS.reports || []).length ? "In review" : "None"}</span>${pkgMark(rep)}</button>
      <button class="pkg-b ${photos.some(eligible) ? "done" : photos.length ? "part" : ""}" data-act="wsTab" data-tab="evidence">
        <b>Photos</b><span class="pk-v">${photos.length}</span>${pkgMark(photos.some(eligible) ? "done" : photos.length ? "part" : "none")}</button>
      ${videos.length ? `<button class="pkg-b ${videos.some(eligible) ? "done" : "part"}" data-act="wsTab" data-tab="evidence">
        <b>Video</b><span class="pk-v">${videos.length}</span>${pkgMark(videos.some(eligible) ? "done" : "part")}</button>` : ""}
      <button class="pkg-b ${b && b.status === "finalized" ? "done" : b ? "part" : ""}">
        <b>Case build</b><span class="pk-v">${b ? (b.status === "finalized" ? "Finalized" : "Draft v" + b.version) : "Not started"}</span>${pkgMark(b && b.status === "finalized" ? "done" : b ? "part" : "none")}</button>
      <button class="pkg-b ${inv ? (inv.status === "paid" ? "done" : "part") : ""}" data-act="tab" data-tab="invoices">
        <b>Invoice</b><span class="pk-v">${inv ? label(inv.status) : "Not created"}</span>${pkgMark(inv ? (inv.status === "paid" ? "done" : "part") : "none")}</button>
    </div>`;

  if(!b){
    return `${blocks}
      <p class="hint">The package pulls the approved report and the client-deliverable
        photos, video and documents into one deliverable, behind hard gates.</p>
      <button class="btn" data-act="pkgStart">Start the package build</button>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}`;
  }

  /* What's missing (UXSIMPLIFY P16): only what stands between here and
     finalized, each line the Worker's own words. */
  const missing = PKG.gates.length && b.status !== "finalized" ? `
    <div class="pkg-miss"><b>To finish this package</b>
      <ul>${PKG.gates.map(g => `<li>${esc(g)}</li>`).join("")}</ul></div>` : "";

  const pick = (list, kind) => list.length ? `
    <h3 style="margin:14px 0 4px;font-size:.95rem">${kind}</h3>
    <div class="pkg-pick">${list.map(e => {
      const on = inPkg(e.id);
      const img = String(e.content_type || "").startsWith("image/");
      const item = items.find(i => i.evidence_id === e.id);
      return `<div class="pkg-item${on ? " on" : ""}">
        ${img ? `<img src="/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${e.id}/file" alt="">` : ""}
        <div style="margin:4px 0 2px;word-break:break-all"><b>${esc(e.filename)}</b></div>
        <div style="color:var(--muted)">${eligible(e) ? "Client deliverable" : esc(e.classification.replace(/_/g, " "))}</div>
        ${b.status === "draft" ? (on
          ? `<button class="btn sm ghost" data-act="pkgRemove" data-id="${item ? item.id : ""}">Remove</button>`
          : `<button class="btn sm" data-act="pkgAdd" data-id="${e.id}">Add</button>`) : (on ? "In package" : "")}
      </div>`;
    }).join("")}</div>` : "";

  const doc = pkgDocHtml();

  return `${blocks}${missing}
    ${b.status === "draft" ? `
      <label class="f" style="max-width:340px"><span>Package type</span>
        <select data-act="pkgType">
          ${[["report_only","Report only"],["report_photos","Report + photos"],
             ["report_photos_video","Report + photos + video link"],["full","Full client package"]]
            .map(([v, l]) => `<option value="${v}" ${b.package_type === v ? "selected" : ""}>${l}</option>`).join("")}
        </select></label>
      ${pick(photos, "Photos")}${pick(videos, "Video")}${pick(others, "Documents")}
      <div class="actions" style="border-top:1px solid var(--line);padding-top:12px;margin-top:10px">
        <button class="btn" data-act="pkgFinalize">Finalize the package</button>
      </div>`
    : `
      <div class="feebox">
        <div class="row"><span><b>Package finalized</b> &mdash; v${b.version}</span>
          <span>${when(b.finalized_at)}</span></div>
        ${b.delivered_at ? `<div class="row"><span>Delivered</span><span>${when(b.delivered_at)}</span></div>` : ""}
        ${(PKG.providers && PKG.providers.dropbox && !PKG.providers.dropbox.configured && items.some(i => i.role === "video"))
          ? `<div class="row"><span style="color:var(--muted);font-size:.85rem">Video delivery: Dropbox is not
              connected &mdash; video is provided separately for now.</span><span></span></div>` : ""}
      </div>
      <div class="actions">
        <button class="btn" data-act="pkgPrint">Print / Save the package PDF</button>
        ${!b.delivered_at ? `<button class="btn ghost" data-act="pkgDelivered">Mark delivered</button>` : ""}
        <button class="btn ghost" data-act="pkgReopen">Reopen and rebuild</button>
      </div>`}
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    ${doc}`;
}

/* The document — exactly what prints (report, photographs, video listing,
   evidence index). Photos are embedded; video is listed, never embedded. */

    const e = evById[i.evidence_id] || {};
    return { n: n + 1, role: i.role, e,
      time: e.entry_time ? t12(e.entry_time) : "",
      desc: e.note || e.entry_description || e.filename || "" };

  const photos = rows.filter(r => r.role === "photo");

  <div id="pkgdoc">
    <div class="doc-head">
      <div><h2>Always Precise Investigations, LLC</h2>
        <div style="font-size:.85rem;color:var(--muted)">Va DCJS #11-9159 &middot; (434) 907-0975</div></div>
      <div style="text-align:right">
        <div style="font-size:1.1rem;font-weight:800;letter-spacing:.05em">INVESTIGATIVE REPORT</div>
        <div><b>${esc(WS_CASE)}</b></div>
        ${PKG.report ? `<div style="font-size:.88rem">Report of ${esc(fmtDay(PKG.report.report_date))}</div>` : ""}
      </div>
    </div>
    ${PKG.report ? `<div style="white-space:pre-line;font-size:.95rem">${esc(PKG.report.body)}</div>`

    ${photos.length ? `<h3 style="border-top:1px solid var(--line);padding-top:14px">PHOTOGRAPHS</h3>
      ${photos.map(r => `<div style="margin:0 0 14px">
        <img src="/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${r.e.id}/file" alt="">
        <div style="font-size:.85rem;color:var(--muted)">Photo ${String(r.n).padStart(2, "0")}${r.time ? ` &middot; ${esc(r.time)}` : ""} &middot; ${esc(r.desc)}</div>
      </div>`).join("")}` : ""}
    ${videos.length ? `<h3 style="border-top:1px solid var(--line);padding-top:14px">VIDEO EVIDENCE</h3>
      ${videos.map((r, i2) => `<div style="margin:0 0 10px">
        <b>Video ${String(i2 + 1).padStart(2, "0")}</b>${r.time ? ` &middot; ${esc(r.time)}` : ""}
        <div style="font-size:.9rem">${esc(r.desc)}</div>
      </div>`).join("")}
      <p style="font-size:.9rem"><b>VIDEO DELIVERY</b> &mdash; Selected video evidence is provided

      <table class="doc-table"><thead><tr><th>Exhibit</th><th>Time</th><th>Type</th><th>Description</th><th>Delivery</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td>${r.role === "photo" ? "Photo" : r.role === "video" ? "Video" : "Document"} ${String(r.n).padStart(2, "0")}</td>
          <td>${esc(r.time)}</td><td>${esc(r.role)}</td><td>${esc(r.desc)}</td>
          <td>${r.role === "video" ? "Video delivery" : "Report"}</td>
        </tr>`).join("")}</tbody></table>` : ""}
    <p style="font-size:.85rem;border-top:1px solid var(--line);padding-top:10px;color:var(--muted)">

async function pkgApi(path, body){
  WS_ERR = "";
  try{ PKG = await api(path, {method: "POST", body: body || {}}); }
  catch(e){
    WS_ERR = e.message;
    if(e.gates) WS_ERR = "Not ready: " + e.gates.join(" ");
    await loadPackage(); return;
  }
  paintCase();
}

/* Priority 19 — follow-up tasks. Admin-created; assigning one to an
   investigator is the office choosing to tell them, and that assignment is
   the only way a task reaches one. The one write the field has is marking
   their own task done. */
function tasksPanel(){
  const admin = ME.role === "admin";
  const tasks = (WS && WS.tasks) || [];
  const today = new Date().toISOString().slice(0,10);
  const priTag = p => p === "urgent" ? `<span class="tag rs-needs_revision">urgent</span>`
    : p === "high" ? `<span class="tag rs-submitted">high</span>`
    : p === "low" ? `<span class="tag rs-draft">low</span>` : "";

  const composer = !admin ? "" : `
    <form class="quick" data-act="addTask">
      <label class="f"><span>What needs doing</span>
        <input id="t_task" placeholder="e.g. Call the adjuster to confirm the second day."></label>
      <div class="two">
        <label class="f"><span>Assigned to</span>
          <select id="t_who"><option value="">The office</option>
            ${USERS.filter(u => u.active).map(u =>
              `<option value="${u.id}">${esc(u.display_name || u.username)}</option>`).join("")}</select></label>
        <label class="f"><span>Due <span class="opt">optional</span></span><input id="t_due" type="date"></label>
      </div>
      <label class="f"><span>Priority</span>
        <select id="t_pri">${[["normal","Normal"],["high","High"],["urgent","Urgent"],["low","Low"]]
          .map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></label>
      <button class="btn" type="submit">Add task</button>
      <p class="hint">A task assigned to an investigator shows on their view of this case and on
        their dashboard when overdue. Office tasks stay with the office.</p>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>`;

  const row = t => {
    const overdue = t.status === "open" && t.due_date && t.due_date < today;
    return `<div class="rcard" style="cursor:default${t.status !== "open" ? ";opacity:.65" : ""}">
      <div class="rc-h"><b>${esc(t.task)}</b>${priTag(t.priority)}
        ${t.status === "open"
          ? `<button class="btn sm" data-act="taskStatus" data-id="${t.id}" data-s="done">Done</button>
             ${admin ? `<button class="btn sm ghost" data-act="taskStatus" data-id="${t.id}" data-s="cancelled">Cancel</button>` : ""}`
          : `<span class="tag ${t.status === "done" ? "rs-approved" : "rs-draft"}">${esc(t.status)}</span>
             ${admin ? `<button class="btn sm ghost" data-act="taskStatus" data-id="${t.id}" data-s="open">Reopen</button>` : ""}`}</div>
      <div class="tl-m">${t.assignee ? esc(t.assignee) : "The office"}${
        t.due_date ? ` &middot; due ${esc(fmtDay(t.due_date))}` : ""}${
        overdue ? ` &middot; <b style="color:#a33">overdue</b>` : ""}</div>
    </div>`;
  };

  return `${composer}
    ${tasks.length ? `<div class="rlist">${tasks.map(row).join("")}</div>`
      : `<div class="empty">${admin ? "No tasks on this case yet."
          : "Nothing is assigned to you on this case."}</div>`}`;
}

function caseBodyHtml(){
  const admin = ME.role === "admin";
  if(!WS) return `<div class="empty">Loading the case&hellip;</div>`;
  const s = WS.submission || {};
  const a = WS.authorization || {};

  const panel =
      WS_TAB === "activity" ? activityPanel()
    : WS_TAB === "field"    ? fieldPanel()
    : WS_TAB === "reports"  ? reportsPanel()
    : WS_TAB === "expenses" ? expensesPanel()
    : WS_TAB === "notes"    ? notesPanel()
    : WS_TAB === "comms"    ? commsPanel()
    : WS_TAB === "package"  ? packagePanel()
    : WS_TAB === "evidence" ? evidencePanel()
    : WS_TAB === "tasks"    ? tasksPanel()
    : WS_TAB === "auth"     ? authPanel(a, admin) + (admin ? authAdminForm() : "")
    : WS_TAB === "assign"   ? assignPanel(s)
    : WS_TAB === "subject"  ? detailList(s, "subject") + caseDetailsPanel() + subjectsPanel(s)
    : WS_TAB === "details"  ? detailList(s, "overview")
    : WS_TAB === "billing"  ? billingPanel(s, a)
    : admin                 ? overviewPanel(s, a)
    :                         myOfferBox() + detailList(s, "overview") + (a.authorized_hours != null ? authPanel(a, admin) : "");

  const sec = wsSectionFor(WS_TAB);
  return `
    ${caseHeader(s, a, admin)}
    <div class="wsecs">${wsSections().map(([k, lbl]) =>
      `<button class="${sec[0] === k ? "on" : ""}" data-act="wsSec" data-sec="${k}">${esc(lbl)}</button>`).join("")}</div>
    <div class="wstabs">${sec[2].map(([k, lbl]) =>
      `<button class="${WS_TAB === k ? "on" : ""}" data-act="wsTab" data-tab="${k}">${esc(lbl)}</button>`).join("")}</div>
    <div class="wspanel">${panel}</div>`;
}

/* UIBUILD P5 — the case header. Identity on the left, state on the right.
   Who is paying appears for the office only: an investigator's header is the
   subject and the case number, mirroring what the Worker already redacts.
   Status stays a single control on the Assignment panel — the header chip and
   Edit case both route there rather than duplicating a live form. */
function caseHeader(s, a, admin){
  const p = s.payload || {};
  const claim = s.kind === "claims";
  const stage = (WS && WS.stage) || s.status || "open";
  const assignee = admin && s.assigned_to ? USERS.find(u => u.id === s.assigned_to) : null;
  const clientLine = claim ? (p.carrier || p.client_name || "") : (p.client_name || "");
  return `<div class="caseheader">
    <div>
      <span class="tag ${claim ? "claims" : "consumer"}">${esc(a.case_type || (claim ? "Claim assignment" : "Client intake"))}</span>
      <span class="case" style="display:inline-block;margin-left:8px">${esc(WS_CASE)}</span>
      ${admin && clientLine ? `<div class="ch-client"><b>${esc(clientLine)}</b>${claim && p.claim_number ? ` &middot; Claim ${esc(p.claim_number)}` : ""}</div>` : ""}
      ${p.subject_name ? `<div class="ch-sub">${claim ? "Claimant" : "Subject"}: ${esc(p.subject_name)}</div>` : ""}
    </div>
    <div class="ch-right">
      ${admin
        ? `<span class="tag ${esc(stage)}" data-act="wsTab" data-tab="assign" title="Change status on Assignment" style="cursor:pointer">${esc(label(stage))}</span>
           <div class="ch-line">${assignee ? "Assigned: " + esc(assignee.display_name || assignee.username) : "Unassigned"}</div>
           <button class="btn sm ghost" data-act="wsTab" data-tab="assign">Edit case</button>`
        : `<span class="tag ${esc(stage)}">${esc(label(stage))}</span>`}
    </div>
  </div>`;
}

/* The case, in the same shape a /packages row has — so the overview reuses
   pkgProgress and pkgNextStep instead of growing a second opinion (P24). */
function wsPkgShape(){
  const days = (WS && WS.days) || [];
  const live = ((WS && WS.evidence) || []).filter(e => !e.deleted_at);
  const reports = (WS && WS.reports) || [];
  const best = reports.find(r => ["approved", "delivered"].includes(r.status))
            || reports.find(r => r.status === "submitted") || reports[0] || null;
  return {
    activity_count: ((WS && WS.activity) || []).length,
    report_status: best ? best.status : null,
    photos: live.filter(e => String(e.content_type || "").startsWith("image/")).length,
    videos: live.filter(e => String(e.content_type || "").startsWith("video/")).length,
    build_status: (WS && WS.build_status) || null,
    invoice_status: (WS && WS.invoice_status) || null,
    days: days.length,
    open_day: days.some(d => !d.end_time),
  };
}

/* UIBUILD P7 — the admin's case overview: summary, package progress and ONE
   next step across the top; recent activity and the evidence picture below.
   Every line routes somewhere real (P22). */
function overviewPanel(s, a){
  const p = s.payload || {};
  const claim = s.kind === "claims";
  const shape = wsPkgShape();
  const prog = pkgProgress(shape);
  const next = pkgNextStep(shape);
  const mark = st => st === "done" ? "&#10003;" : st === "part" ? "&#9685;" : "&#9675;";
  const assignee = s.assigned_to ? USERS.find(u => u.id === s.assigned_to) : null;
  const acts = ((WS && WS.activity) || []).slice(0, 5);
  const docs = ((WS && WS.evidence) || []).filter(e => !e.deleted_at).length - shape.photos - shape.videos;
  const row = (k, v) => v == null || v === "" ? "" : `<div class="ov-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`;
  return `
    <div class="ovgrid">
      <div class="ovcard">
        <h3>Case summary</h3>
        ${claim
          ? (a.authorized_hours != null
              ? row("Authorized", a.authorized_hours + " hrs")
                + row("Used", a.hours_used + " hrs")
                + row("Remaining", a.hours_remaining + " hrs")
              : row("Authorization", "Not set"))
          : (a.retainer
              ? row("Retainer", "$" + a.retainer.amount.toLocaleString())
                + row("Balance", "$" + a.retainer.remaining.toLocaleString())
              : row("Type", "Private client"))}
        ${row("Requested start", p.start_date)}
        ${row("Priority", p.priority)}
        ${row("Investigator", assignee ? (assignee.display_name || assignee.username) : "Unassigned")}
        ${row("Received", when(s.created_at))}
      </div>
      <div class="ovcard">
        <h3>Case package progress</h3>
        <div class="ov-ring">${ringHtml(prog.pct)}</div>
        <ul class="ov-mods">${prog.mods.map(([id, st, sub]) =>
          `<li><button data-act="wsTab" data-tab="${MOD_TAB[id]}">
             <span><b>${mark(st)}</b> ${MOD_LABEL[id]}</span><span style="color:var(--muted)">${esc(sub)}</span></button></li>`).join("")}</ul>
      </div>
      <div class="ovcard ov-next">
        <h3>Next step</h3>
        <div class="nx">${esc(next.label)}</div>
        <button class="btn" data-act="wsTab" data-tab="${next.tab}">Go &rarr;</button>
      </div>
    </div>
    <div class="ovgrid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
      <div class="ovcard">
        <h3>Recent activity</h3>
        ${acts.length ? `<ul class="ov-recent">${acts.map(e =>
            `<li><span class="t">${esc(t12(e.at_time))}</span><span>${esc(String(e.description || "").slice(0, 90))}</span></li>`).join("")}</ul>`
          : `<div class="empty">No activity yet. The timeline starts with the first investigation day.</div>`}
        <div class="ov-foot"><button class="btn sm ghost" data-act="wsTab" data-tab="activity">View full timeline &rarr;</button></div>
      </div>
      <div class="ovcard">
        <h3>Evidence overview</h3>
        ${(() => {   // a first look at the pictures; each thumb opens the gallery
          const th = ((WS && WS.evidence) || [])
            .filter(e => !e.deleted_at && String(e.content_type || "").startsWith("image/")).slice(0, 4);
          return th.length ? `<div class="ovthumbs">${th.map(e =>
            `<button data-act="wsTab" data-tab="evidence" style="padding:0;border:0;background:none;cursor:pointer">
               <img src="/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${e.id}/file"
                 alt="${esc(e.filename)}" loading="lazy"></button>`).join("")}</div>` : "";
        })()}
        <div class="ov-row"><span>Photos</span><b>${shape.photos}</b></div>
        <div class="ov-row"><span>Video</span><b>${shape.videos}</b></div>
        <div class="ov-row"><span>Documents</span><b>${docs}</b></div>
        <div class="ov-foot"><button class="btn sm ghost" data-act="wsTab" data-tab="evidence">View all evidence &rarr;</button></div>
      </div>
    </div>`;
}

/* ADMIN &rarr; Billing & closing: invoicing the case and walking it closed —
   the two things that used to ride the bottom of the old overview. */
function billingPanel(s, a){
  return `
    ${!isExample(WS_CASE) ? `<div class="actions" style="padding-bottom:12px">
        <button class="btn sm" data-act="createInvoice" data-case="${esc(WS_CASE)}">Create invoice</button>
        ${(s.kind === "claims" && a.authorized_hours != null) || s.kind !== "claims"
          ? `<button class="btn sm ghost" data-act="createInvoiceAuth" data-case="${esc(WS_CASE)}">Create from ${s.kind === "claims" ? "authorization" : "retainer"}</button>` : ""}
      </div>` : ""}
    ${closurePanel()}`;
}

/* The workspace is a full page, not a popup — a case is where the day's work
   happens, and work does not happen through a keyhole. paint() routes here. */
function paintCase(){ paint(); }

async function openExampleCase(caseNo){ WS_CASE = caseNo; WS = null; VIEW = "case"; paint(); }

function exampleBodyHtml(){
  const s = examplesFor(ME.role).find(c => c.case_no === WS_CASE);
  if(!s) return "";
  const p = s.payload || {};
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
  const claim = s.kind === "claims";
  const sig = safeImage(p.signature);

  const controls = isExample(s.case_no)
    ? `<div class="actions"><div style="color:var(--muted);font-size:.88rem">
         ${ME.role === "admin"
           ? "On a real case, this is where you assign it to an investigator and set its status."
           : "On a real case assigned to you, everything above is what you would see. Assignment and status are set by the office."}
       </div></div>`
    : ME.role === "admin"
    ? `<div class="actions">
        <label class="f"><span>Assigned to</span>
          <select id="asg">
            <option value="">— unassigned —</option>
            ${USERS.filter(u => u.active).map(u => `<option value="${u.id}" ${u.id === s.assigned_to ? "selected" : ""}>${esc(u.display_name || u.username)}</option>`).join("")}
          </select></label>
        <label class="f"><span>Status</span>
          <select id="sts">${STAGE_OPTS(s)}</select></label>
        <button class="btn" data-act="saveCase" data-case="${esc(s.case_no)}">Save</button>
        <div class="err" id="derr" style="width:100%"></div>
      </div>` : "";

  return `
    ${isExample(s.case_no) ? `<div class="ex-note" style="margin-bottom:14px">
       <b>Example — not a real case.</b> ${ME.role === "admin"
         ? `Every field a live ${claim ? "carrier assignment" : "client intake"} can carry is filled in
            here, including the signature. A real case shows exactly this, with whatever the sender
            actually provided.`
         : `This is the whole of what an assignment shows you: the subject, the scope and the
            deadline. Who the case is for &mdash; the carrier, the adjuster, the claim number,
            billing &mdash; stays with the office.`}</div>` : ""}
    <h2>${claim ? "Claim assignment" : "Client intake"} — ${esc(s.service || "")}</h2>
    <div class="case">${esc(s.case_no)}</div>
    <dl class="detail">
      ${claim ? `${row("Carrier / TPA", p.carrier)}${row("Claim number", p.claim_number)}${row("Policy number", p.policy_number)}
                 ${row("Claim type", p.claim_type)}${row("Date of loss", p.date_of_loss)}${row("Adjuster", p.adjuster)}
                 ${row("Adjuster email", p.adjuster_email)}${row("Adjuster phone", p.adjuster_phone)}
                 ${row("Defense counsel", p.defense_counsel)}${row("Prior surveillance", p.prior_surveillance)}` : ""}
      ${row(claim ? "Assigning contact" : "Client", p.client_name)}${row("Phone", p.client_phone)}${row("Email", p.client_email)}
      ${claim ? "" : `${row("Address", p.client_address)}${row("Best time", p.best_time)}`}
      ${row(claim ? "Claimant" : "Subject", p.subject_name)}${row("Address", p.subject_address)}
      ${row("Description", p.subject_description)}${row(claim ? "Injury & restrictions" : "Relationship", p.subject_relationship)}
      ${row(claim ? "Scope" : "Objective", p.objective)}${row("Authorized hours", p.authorized_hours)}
      ${row("Not to exceed", p.not_to_exceed)}${row("Requested start", p.start_date)}
      ${row("Permitted days", p.permitted_days)}${row("Permitted times", p.permitted_times)}
      ${row("Weekend", p.weekend_authorized)}${row("Priority", p.priority)}
      ${row("Geographic limits", p.geographic_limits)}
      ${row(claim ? "Deadline" : "Timeline", p.timeline)}${row("Notes", p.notes)}${row("Attachments", p.attachments)}
      ${claim ? `${row("Billing reference", p.billing_reference)}${row("Invoices to", p.billing_email)}${row("Billing notes", p.billing_notes)}`
              : `${row("Due today", p.fee_due != null ? "$" + p.fee_due : "")}${row("Payment method", p.payment_method)}`}
      ${row(claim ? "Authorized by" : "Signed by", p.signed_name)}
      ${row("Received", when(s.created_at))}
    </dl>
    ${sig ? `<div><div style="font-size:.8rem;color:var(--muted)">Signature</div><img class="sig" src="${esc(sig)}" alt="signature"></div>` : ""}
    ${controls}`;
  }

/* The intake detail, split so the workspace can show what the field needs
   (subject) apart from what the office needs (everything). Both read from the
   same submission — the Worker has already removed whatever this role may not
   see, so nothing here decides that. */
function detailList(s, mode){
  const p = s.payload || {};
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
  const claim = s.kind === "claims";
  const sig = safeImage(p.signature);

  if(mode === "subject"){
    return `<dl class="detail">
      ${row(claim ? "Claimant" : "Subject", p.subject_name)}${row("Address", p.subject_address)}
      ${row("Description", p.subject_description)}
      ${row(claim ? "Injury & restrictions" : "Relationship", p.subject_relationship)}
      ${row("Prior surveillance", p.prior_surveillance)}
      ${row(claim ? "Scope" : "Objective", p.objective)}
      ${row("Permitted days", p.permitted_days)}${row("Permitted times", p.permitted_times)}
      ${row("Weekend", p.weekend_authorized)}${row("Geographic limits", p.geographic_limits)}
      ${row("Field notes", p.notes)}
    </dl>`;
  }
  return `<dl class="detail">
    ${claim ? `${row("Carrier / TPA", p.carrier)}${row("Claim number", p.claim_number)}${row("Policy number", p.policy_number)}
               ${row("Claim type", p.claim_type)}${row("Date of loss", p.date_of_loss)}${row("Adjuster", p.adjuster)}
               ${row("Adjuster email", p.adjuster_email)}${row("Adjuster phone", p.adjuster_phone)}
               ${row("Defense counsel", p.defense_counsel)}` : ""}
    ${row(claim ? "Assigning contact" : "Client", p.client_name)}${row("Phone", p.client_phone)}${row("Email", p.client_email)}
    ${claim ? "" : `${row("Address", p.client_address)}${row("Best time", p.best_time)}`}
    ${row(claim ? "Claimant" : "Subject", p.subject_name)}
    ${row(claim ? "Scope" : "Objective", p.objective)}
    ${row("Authorized hours", p.authorized_hours)}${row("Not to exceed", p.not_to_exceed)}
    ${row("Requested start", p.start_date)}${row("Priority", p.priority)}
    ${row(claim ? "Deadline" : "Timeline", p.timeline)}${row("Attachments", p.attachments)}
    ${claim ? `${row("Billing reference", p.billing_reference)}${row("Invoices to", p.billing_email)}${row("Billing notes", p.billing_notes)}` : ""}
    ${row(claim ? "Authorized by" : "Signed by", p.signed_name)}
    ${row("Received", when(s.created_at))}
  </dl>
  ${sig ? `<div><div style="font-size:.8rem;color:var(--muted)">Signature</div><img class="sig" src="${esc(sig)}" alt="signature"></div>` : ""}`;
}

/* Priority 16 — the operational facts a private case's type calls for. The
   Worker chooses the field set from the case type and sends [key, label]
   pairs; this draws what arrives and decides nothing. Admin edits, an
   investigator reads. Claims cases never have one — their claim details are
   in the intake payload above. */
function caseDetailsPanel(){
  if(!WS || !WS.detail_fields) return "";
  const d = WS.details || {};
  if(ME.role !== "admin"){
    const rows = WS.detail_fields.filter(([k]) => d[k]);
    if(!rows.length) return "";
    return `<h3 style="margin:18px 0 6px;font-size:1rem">Case details</h3>
      <dl class="detail">${rows.map(([k, l]) => `<dt>${esc(l)}</dt><dd>${esc(d[k])}</dd>`).join("")}</dl>`;
  }
  return `<form class="quick" data-act="saveDetails" style="margin-top:16px">
    <h3 style="margin:0 0 8px;font-size:1rem">Case details</h3>
    <p class="hint" style="margin-bottom:10px">What this case type calls for. The assigned
      investigator sees these beside the subject; the client's identity and billing never travel
      with them. Frame objectives as <b>observe and document</b> &mdash; &ldquo;Document persons
      present and observed activity during the scheduled custody period&rdquo; &mdash; and leave
      what it means legally to courts and attorneys.</p>
    ${WS.detail_fields.map(([k, l]) => `
      <label class="f"><span>${esc(l)}${k === "objectives"
          ? ` <span class="opt">observe and document &mdash; never a legal conclusion</span>` : ""}</span>
        <textarea id="det_${k}" rows="2">${esc(d[k] || "")}</textarea></label>`).join("")}
    <button class="btn" type="submit">Save details</button>
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;
}

/* Priority 17 — structured subjects and their vehicles. Fieldwork records:
   both roles add and correct them (there is no delete — corrections are
   edits, stamped in the Worker). One form is open at a time: SUBJ_FORM is
   null, {mode:"new",pre}, {mode:"edit",id} or {mode:"veh",sid,vid?}. */
let SUBJ_FORM = null;

function subjForm(pre, id){
  const g = k => esc((pre && pre[k]) || "");
  return `<form class="quick" data-act="saveSubject" data-id="${id || ""}" style="margin-top:10px">
    <div class="two">
      <label class="f"><span>Name</span><input id="sf_name" value="${g("name")}"></label>
      <label class="f"><span>Alias / nickname</span><input id="sf_alias" value="${g("alias")}"></label>
    </div>
    <div class="two">
      <label class="f"><span>Date of birth <span class="opt">if legitimately supplied</span></span><input id="sf_dob" value="${g("dob")}"></label>
      <label class="f"><span>Phone <span class="opt">if legitimately obtained</span></span><input id="sf_phone" value="${g("phone")}"></label>
    </div>
    <div class="two">
      <label class="f"><span>Height</span><input id="sf_height" value="${g("height")}"></label>
      <label class="f"><span>Weight</span><input id="sf_weight" value="${g("weight")}"></label>
    </div>
    <label class="f"><span>Hair</span><input id="sf_hair" value="${g("hair")}"></label>
    <label class="f"><span>Other descriptors</span><textarea id="sf_descriptors" rows="2">${g("descriptors")}</textarea></label>
    <label class="f"><span>Addresses</span><textarea id="sf_addresses" rows="2">${g("addresses")}</textarea></label>
    <div class="two">
      <label class="f"><span>Employer / workplace</span><input id="sf_employer" value="${g("employer")}"></label>
      <label class="f"><span>Known social accounts</span><input id="sf_social_accounts" value="${g("social_accounts")}"></label>
    </div>
    <label class="f"><span>Notes</span><textarea id="sf_notes" rows="2">${g("notes")}</textarea></label>
    <button class="btn" type="submit">Save subject</button>
    <button class="btn ghost" type="button" data-act="subjCancel">Cancel</button>
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;
}

function vehForm(sub){
  const v = (SUBJ_FORM.vid && (sub.vehicles || []).find(x => x.id === SUBJ_FORM.vid)) || {};
  const g = k => esc(v[k] || "");
  return `<form class="quick" data-act="saveVehicle" data-sid="${sub.id}" data-vid="${v.id || ""}" style="margin-top:10px">
    <div class="two">
      <label class="f"><span>Year</span><input id="vf_year" value="${g("year")}"></label>
      <label class="f"><span>Color</span><input id="vf_color" value="${g("color")}"></label>
    </div>
    <div class="two">
      <label class="f"><span>Make</span><input id="vf_make" value="${g("make")}"></label>
      <label class="f"><span>Model</span><input id="vf_model" value="${g("model")}"></label>
    </div>
    <div class="two">
      <label class="f"><span>Plate</span><input id="vf_plate" value="${g("plate")}"></label>
      <label class="f"><span>Plate state</span><input id="vf_plate_state" value="${g("plate_state")}"></label>
    </div>
    <label class="f"><span>Registered owner <span class="opt">if lawfully obtained</span></span><input id="vf_registered_owner" value="${g("registered_owner")}"></label>
    <label class="f"><span>Notes</span><textarea id="vf_notes" rows="2">${g("notes")}</textarea></label>
    <button class="btn" type="submit">Save vehicle</button>
    <button class="btn ghost" type="button" data-act="subjCancel">Cancel</button>
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;
}

function subjectsPanel(s){
  if(!WS) return "";
  const subs = WS.subjects || [];
  const p = (s && s.payload) || {};
  const fr = (l, v) => v ? `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>` : "";

  const vehLine = v => `<div class="tl-m">${esc([v.year, v.color, v.make, v.model].filter(Boolean).join(" "))}${
      v.plate ? ` &mdash; ${esc(v.plate)}${v.plate_state ? " (" + esc(v.plate_state) + ")" : ""}` : ""}
      <button class="btn sm ghost" data-act="vehEdit" data-sid="${v.subject_id}" data-vid="${v.id}">Edit</button></div>
    ${v.registered_owner ? `<div class="tl-n">Registered to ${esc(v.registered_owner)}</div>` : ""}
    ${v.notes ? `<div class="tl-n">${esc(v.notes)}</div>` : ""}`;

  const card = sub => {
    const editing = SUBJ_FORM && SUBJ_FORM.mode === "edit" && SUBJ_FORM.id === sub.id;
    return `<div class="rcard" style="cursor:default">
      <div class="rc-h"><b>${esc(sub.name)}</b>${sub.alias ? ` <span class="tl-m">&ldquo;${esc(sub.alias)}&rdquo;</span>` : ""}
        ${!SUBJ_FORM ? `<button class="btn sm ghost" data-act="subjEdit" data-id="${sub.id}">Edit</button>
        <button class="btn sm ghost" data-act="vehAdd" data-sid="${sub.id}">Add vehicle</button>` : ""}</div>
      ${editing ? subjForm(sub, sub.id) : `<dl class="detail">
        ${fr("Date of birth", sub.dob)}${fr("Height", sub.height)}${fr("Weight", sub.weight)}
        ${fr("Hair", sub.hair)}${fr("Descriptors", sub.descriptors)}${fr("Addresses", sub.addresses)}
        ${fr("Employer", sub.employer)}${fr("Phone", sub.phone)}
        ${fr("Social accounts", sub.social_accounts)}${fr("Notes", sub.notes)}
      </dl>`}
      ${(sub.vehicles || []).length && !editing ? `<div style="margin-top:4px"><b style="font-size:.85rem">Vehicles</b>${sub.vehicles.map(vehLine).join("")}</div>` : ""}
      ${(() => {
        const media = ((WS && WS.evidence) || []).filter(e => e.subject_id === sub.id && !e.deleted_at);
        return media.length && !editing ? `<div style="margin-top:6px"><b style="font-size:.85rem">Photos &amp; files</b>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${media.map(e => {
            const href = `/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence/${e.id}/file`;
            return String(e.content_type || "").startsWith("image/")
              ? `<a href="${href}" target="_blank" rel="noopener"><img src="${href}" alt="${esc(e.filename)}"
                   style="max-height:72px;border-radius:6px;border:1px solid var(--line)"></a>`
              : `<a class="tag rs-draft" style="text-decoration:none" href="${href}" target="_blank" rel="noopener">${esc(e.filename)}</a>`;
          }).join("")}</div></div>` : "";
      })()}
      ${SUBJ_FORM && SUBJ_FORM.mode === "veh" && SUBJ_FORM.sid === sub.id ? vehForm(sub) : ""}
    </div>`;
  };

  return `<h3 style="margin:18px 0 6px;font-size:1rem">Subjects &amp; vehicles</h3>
    ${subs.length ? `<div class="rlist">${subs.map(card).join("")}</div>`
      : `<p class="hint">No structured subject records yet. The intake snapshot above stays as
         received; records added here are the working copy the field can keep current.</p>`}
    ${SUBJ_FORM && SUBJ_FORM.mode === "new" ? subjForm(SUBJ_FORM.pre, null) : ""}
    ${!SUBJ_FORM ? `<div style="margin-top:8px">
        <button class="btn sm" data-act="subjNew">Add a subject</button>
        ${!subs.length && p.subject_name ? `<button class="btn sm ghost" data-act="subjFromIntake">Start from the intake subject</button>` : ""}
      </div>` : ""}`;
}

async function saveSubjectRec(id){
  WS_ERR = "";
  const body = {};
  for(const k of ["name","alias","dob","height","weight","hair","descriptors","addresses","employer","phone","social_accounts","notes"]){
    const el = $("sf_" + k);
    if(el) body[k] = el.value;
  }
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/subjects` + (id ? `/${id}` : ""), {method:"POST", body});
    SUBJ_FORM = null;
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

async function saveVehicleRec(sid, vid){
  WS_ERR = "";
  const body = {};
  for(const k of ["year","make","model","color","plate","plate_state","registered_owner","notes"]){
    const el = $("vf_" + k);
    if(el) body[k] = el.value;
  }
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/subjects/${sid}/vehicles` + (vid ? `/${vid}` : ""), {method:"POST", body});
    SUBJ_FORM = null;
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}


/* ------------------------------------------------------------- invoices */

/* The office's money desk (INVOICING.md). Admin-only — nothing here is ever
   rendered for an investigator, and the Worker refuses them anyway. The
   document block below is exactly what prints: Print / Save as PDF hides
   everything else on the page. */
const INV_STATUS_LABEL = s => ({draft:"Draft", ready:"Ready", sent_to_bill:"Sent to BILL",
  sent_to_client:"Sent to client", partially_paid:"Partially paid", paid:"Paid",
  overdue:"Overdue", void:"Void"})[s] || s;
const usd = n => "$" + Number(n || 0).toLocaleString("en-US",
  {minimumFractionDigits: (Number(n) % 1 ? 2 : 0), maximumFractionDigits: 2});

function invoicesView(){
  if(INV_OPEN) return invoiceDetailView();
  if(!INVOICES) return `<div class="card"><div class="empty">Loading invoices&hellip;</div></div>`;
  const sm = INVOICES.summary || {};
  const stat = (label, v, tone) => `<div class="stat ${tone || ""}">
    <div class="stat-n">${v}</div><div class="stat-l">${esc(label)}</div></div>`;
  const rows = (INVOICES.invoices || []).map(i => `<tr data-act="invOpen" data-id="${i.id}" style="cursor:pointer">
      <td><b>${esc(i.invoice_no)}</b><div class="mono">${esc(i.case_no)}</div></td>
      <td class="hide">${esc((i.bill_to || "").split("\n")[0])}${i.refs.claim_number ? `<div class="mono">${esc(i.refs.claim_number)}</div>` : ""}</td>
      <td class="hide">${esc(fmtDay(i.issue_date || "") || "—")}</td>
      <td>${esc(fmtDay(i.due_date || "") || "—")}</td>
      <td>${usd(i.total)}</td>
      <td>${usd(i.balance_due)}</td>
      <td><span class="tag ${esc(i.display_status)}">${esc(INV_STATUS_LABEL(i.display_status))}</span></td>

  return `<div class="stats">
      ${stat("Outstanding", usd(sm.outstanding), sm.outstanding ? "warn" : "")}
      ${stat("Due soon", sm.due_soon || 0)}
      ${stat("Overdue", sm.overdue || 0, sm.overdue ? "warn" : "")}

      <div class="bar"><h2 style="margin:0">Invoices</h2>
        <select data-act="invFilterStatus">
          ${[["","All statuses"],["draft","Draft"],["ready","Ready"],["sent_to_bill","Sent to BILL"],
             ["overdue","Overdue"],["partially_paid","Partially paid"],["paid","Paid"],["void","Void"]]
            .map(([v,l]) => `<option value="${v}" ${INV_FILTER.status === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <select data-act="invFilterType">
          ${[["","Both sides"],["insurance","Insurance"],["private","Private"]]
            .map(([v,l]) => `<option value="${v}" ${INV_FILTER.type === v ? "selected" : ""}>${l}</option>`).join("")}
        </select>
        <input data-act="invFilterQ" placeholder="Search # / case / claim" value="${esc(INV_FILTER.q)}" style="max-width:220px">
      </div>
      ${rows ? `<div style="overflow-x:auto"><table>
          <thead><tr><th>Invoice</th><th class="hide">Bill to</th><th class="hide">Issued</th>
            <th>Due</th><th>Amount</th><th>Balance</th><th>Status</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`
        : `<div class="empty">No invoices${INV_FILTER.status || INV_FILTER.type || INV_FILTER.q ? " match" : " yet — open a case and use Create invoice"}.</div>`}
      ${INV_MSG ? `<div class="note" style="margin-top:8px">${esc(INV_MSG)}</div>` : ""}
    </div>`;
}

async function loadInvoices(){
  try{ INVOICES = await api("/invoices" + (Object.values(INV_FILTER).some(Boolean)
    ? `?status=${encodeURIComponent(INV_FILTER.status)}&type=${encodeURIComponent(INV_FILTER.type)}&q=${encodeURIComponent(INV_FILTER.q)}` : ""));
    INV_SETTINGS = INVOICES.settings;
  }catch(e){ INVOICES = {invoices: [], summary: {}}; INV_MSG = e.message; }
  paint();
}

async function openInvoice(id){
  try{
    const d = await api("/invoices/" + id);
    INV_OPEN = d.invoice; INV_WARN = d.warnings || []; INV_EVENTS = d.events || [];
    INV_SETTINGS = d.settings; INV_MSG = "";
  }catch(e){ INV_MSG = e.message; }
  if(TAB !== "invoices"){ TAB = "invoices"; }
  VIEW = "list";
  paint();
}

function invLinesFromDom(){
  const lines = [];
  for(let idx = 0; idx < (INV_OPEN.lines || []).length; idx++){
    const el = $("il_d_" + idx);
    if(!el) continue;
    lines.push({ description: el.value, qty: $("il_q_" + idx).value,
                 rate: $("il_r_" + idx).value, amount: $("il_a_" + idx).value });
  }
  return lines;
}

async function saveInvoiceFields(){
  INV_MSG = "";
  const refs = {};
  for(const k of ["claim_number","po_number","authorization_number","vendor_number","adjuster","service_dates","client_reference"]){
    const el = $("ir_" + k); if(el) refs[k] = el.value;
  }
  try{
    const body = { internal_notes: $("iv_inotes").value };
    if($("iv_billto") && !$("iv_billto").disabled){
      Object.assign(body, { bill_to: $("iv_billto").value, billing_email: $("iv_bemail").value,
        payment_terms: $("iv_terms").value, issue_date: $("iv_issue").value || null,
        due_date: $("iv_due").value || null, client_notes: $("iv_cnotes").value, refs });
    }
    const d = await api("/invoices/" + INV_OPEN.id, {method: "POST", body});
    INV_OPEN = d.invoice; INV_MSG = "Saved.";
  }catch(e){ INV_MSG = e.message; }
  paint();
}

async function saveInvoiceLines(){
  INV_MSG = "";

    const d = await api(`/invoices/${INV_OPEN.id}/lines`, {method: "POST", body: {lines: invLinesFromDom()}});
    INV_OPEN = d.invoice; INV_MSG = "Lines saved.";

async function recordInvPayment(){
  INV_MSG = "";
  try{
    const d = await api(`/invoices/${INV_OPEN.id}/payments`, {method: "POST", body: {

function copyInvoiceDetails(){
  const i = INV_OPEN;
  const lineTxt = (i.lines || []).map(l => `  ${l.description}: ${usd(l.amount)}`).join("\n");
  const txt = [`Invoice #: ${i.invoice_no}`,
    `Bill to: ${(i.bill_to || "").replace(/\n/g, " — ")}`,
    i.refs.claim_number ? `Claim #: ${i.refs.claim_number}` : "",
    `Case #: ${i.case_no}`, lineTxt,
    `Amount: ${usd(i.total)}`,
    i.payment_terms ? `Terms: ${i.payment_terms}` : "",
    i.due_date ? `Due: ${i.due_date}` : ""].filter(Boolean).join("\n");
  try{ navigator.clipboard.writeText(txt); INV_MSG = "Billing details copied — paste into BILL."; }
  catch(e){ INV_MSG = "Could not reach the clipboard."; }
  paint();
}

async function createInvoiceFor(caseNo, fromAuth){
  try{
    const d = await api(`/cases/${encodeURIComponent(caseNo)}/invoices`, {method: "POST",
      body: fromAuth ? {from_authorization: true} : {}});
    await openInvoice(d.invoice.id);
  }catch(e){
    if(String(e.message).includes("duplicate")){
      if(confirm(e.message)){
        const d2 = await api(`/cases/${encodeURIComponent(caseNo)}/invoices`, {method: "POST",
          body: {confirm_duplicate: true, ...(fromAuth ? {from_authorization: true} : {})}});
        return openInvoice(d2.invoice.id);
      }
      return;
    }
    WS_ERR = e.message; paintCase();
  }
}

async function addActivityEntry(){
  WS_ERR = "";
  const date = $("a_date").value, time = $("a_time").value;
  try{
    if(QKIND === "mileage" || QKIND === "expense"){
      // These are money, so the real record is the expense; the timeline entry
      // marks when it happened so the day still reads as one story.
      const desc = $("a_desc").value.trim();
      const miles = QKIND === "mileage" ? $("a_miles").value : "";
      const amt = QKIND === "expense" ? $("a_amt").value : "";
      await api(`/cases/${encodeURIComponent(WS_CASE)}/expenses`, {method:"POST", body:{
        expense_date: date, category: QKIND === "mileage" ? "mileage" : $("a_cat").value,
        miles, amount: amt, description: desc,
      }});
      await api(`/cases/${encodeURIComponent(WS_CASE)}/activity`, {method:"POST", body:{
        kind: QKIND, at_date: date, at_time: time,
        description: QKIND === "mileage" ? `${miles} miles — ${desc}` : `$${amt} ${$("a_cat").value} — ${desc}`,
      }});
    }else{
      const loc = $("a_loc").value, veh = $("a_veh").value;
      if(QKIND === "location" && !loc.trim()){ WS_ERR = "A location entry needs the location."; return paintCase(); }
      if(QKIND === "vehicle" && !veh.trim()){ WS_ERR = "A vehicle entry needs the vehicle."; return paintCase(); }
      await api(`/cases/${encodeURIComponent(WS_CASE)}/activity`, {method:"POST", body:{
        kind: QKIND, at_date: date, at_time: time,
        description: $("a_desc").value,
        location: loc, vehicle: veh,
        internal_note: $("a_note").value,
        subject_documented: $("a_sd") ? $("a_sd").checked : false,
        video_acquired: $("a_va") ? $("a_va").checked : false,
        photo_acquired: $("a_pa") ? $("a_pa").checked : false,
      }});
    }
    ACT_MODAL = null;   // success closes the sheet; the timeline is the confirmation
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

/* The quick path (P9): a picked line, the clock, and Add to log. Also carries
   the one-tap No-change entry and the correction of an existing entry. */
async function quickAddEntry(oneTapLine){
  WS_ERR = "";
  try{
    if(!oneTapLine && ACT_MODAL && ACT_MODAL.edit){
      // The Worker allows exactly these four fields to change, and stamps it.
      await api(`/cases/${encodeURIComponent(WS_CASE)}/activity/${ACT_MODAL.edit}`, {method:"POST", body:{
        description: $("qa_desc").value,
        location: $("qa_loc").value, vehicle: $("qa_veh").value, internal_note: $("qa_note").value,
      }});
    }else{
      const now = new Date();
      const body = oneTapLine ? {
        kind: "activity", description: oneTapLine,
        at_date: now.toISOString().slice(0,10), at_time: now.toTimeString().slice(0,5),
      } : {
        kind: "activity",
        at_date: $("qa_date").value, at_time: $("qa_time").value,
        description: $("qa_desc").value,
        location: $("qa_loc").value, vehicle: $("qa_veh").value,
        internal_note: $("qa_note").value,
        subject_documented: $("qa_sd").checked,
        video_acquired: $("qa_va").checked,
        photo_acquired: $("qa_pa").checked,
      };
      // Ticked files ride to the new moment. Read before the paint eats the DOM.
      const links = oneTapLine ? []
        : [...document.querySelectorAll(".qa-ev:checked")].map(x => Number(x.dataset.id));
      const made = await api(`/cases/${encodeURIComponent(WS_CASE)}/activity`, {method:"POST", body});
      for(const evId of links){
        try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/evidence/${evId}/link`,
          {method:"POST", body:{entry_id: made.id}}); }
        catch(e){ WS_ERR = "The entry saved, but a file link failed — " + e.message; }
      }
    }
    ACT_MODAL = null;
  }catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

/* --------------------------------------------------------- event routing */
/* One delegated listener. Nothing user-supplied is ever written into an
   inline handler, where the browser would decode it back into script. */

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act === "backToCases"){ VIEW = "list"; render(); }
  else if(act === "navToggle"){ document.body.classList.toggle("navopen"); }
  else if(act === "pkgJump"){ openCase(el.dataset.case, el.dataset.tab === "overview" ? undefined : el.dataset.tab); }
  else if(act === "tab"){
    TAB = el.dataset.tab; paint();
    if(TAB === "calendar") loadCalendar(CAL ? CAL.month : "");
    if(TAB === "invoices"){ INV_OPEN = null; INV_MSG = ""; loadInvoices(); }
    if(TAB === "dashboard"){ PKGS = null; loadPackages(); }
    document.body.classList.remove("navopen");
    if(TAB === "myreports") api("/my/reports").then(d => { MY_REPORTS = d; paint(); }).catch(()=>{});
    if(TAB === "myexpenses"){
      api("/my/expenses").then(d => { MY_EXPENSES = d; paint(); }).catch(()=>{});
      api("/my/comp").then(d => { MY_COMP = d; paint(); }).catch(()=>{});
    }
  }
  else if(act === "openCaseTab"){ openCase(el.dataset.case, el.dataset.tab); }
  else if(act === "showExample"){ SHOW_EXAMPLE = true; paint(); }
  else if(act === "hideExample"){ SHOW_EXAMPLE = false; paint(); }
  else if(act === "logout"){ doLogout(); }
  else if(act === "openCase"){ openCase(el.dataset.case); }
  else if(act === "saveCase"){ saveCase(el.dataset.case); }
  else if(act === "toggleActive"){ toggleActive(Number(el.dataset.id), Number(el.dataset.active)); }
  else if(act === "revokeInvite"){ revokeInvite(Number(el.dataset.id)); }
  else if(act === "reload"){ render(); }
  else if(act === "cardFilter"){
    const label = el.dataset.label;
    CARD_FILTER = CARD_FILTER && CARD_FILTER.label === label
      ? null   // clicking the active card clears it
      : { label, set: new Set(el.dataset.set.split(",").filter(Boolean)) };
    paint();
  }
  else if(act === "clearCardFilter"){ CARD_FILTER = null; paint(); }
  else if(act === "addDemo"){ addDemoCase(); }
  else if(act === "clearDemo"){ clearDemoCases(); }
  else if(act === "wsTab"){ if(WS_TAB !== el.dataset.tab){ WS_NOTICE = ""; ACT_MODAL = null; }
    WS_TAB = el.dataset.tab; WS_ERR = "";
    if(WS_TAB === "package"){ PKG = null; loadPackage(); } else paintCase(); }
  else if(act === "wsSec"){
    // A section opens on its first panel; WS_TAB stays the only routing state.
    const sec = wsSections().find(x => x[0] === el.dataset.sec);
    if(sec){ if(WS_TAB !== sec[2][0][0]){ WS_NOTICE = ""; ACT_MODAL = null; }
      WS_TAB = sec[2][0][0]; WS_ERR = "";
      if(WS_TAB === "package"){ PKG = null; loadPackage(); } else paintCase(); } }
  else if(act === "qkind"){ QKIND = el.dataset.k; WS_ERR = ""; paintCase(); }
  else if(act === "actOpen"){ WS_ERR = "";
    ACT_MODAL = {tab:"quick", cat: favLines().length ? "fav" : "arrival", search:"", pick:null, edit:null};
    paintCase(); }
  else if(act === "actClose"){ ACT_MODAL = null; WS_ERR = ""; paintCase(); }
  else if(act === "actTab"){ if(ACT_MODAL){ ACT_MODAL.tab = el.dataset.t; WS_ERR = ""; paintCase(); } }
  else if(act === "actCat"){ if(ACT_MODAL){ ACT_MODAL.cat = el.dataset.c; paintCase(); } }
  else if(act === "actStar"){ favToggle(el.dataset.line); paintCase(); }
  else if(act === "actPick"){
    if(el.dataset.line === NO_CHANGE_LINE){ quickAddEntry(el.dataset.line); }   // one tap (P9)
    else if(ACT_MODAL){ ACT_MODAL.pick = el.dataset.line; ACT_MODAL.dirty = false; WS_ERR = ""; paintCase(); } }
  else if(act === "actBack"){ if(ACT_MODAL){ ACT_MODAL.pick = null; WS_ERR = ""; paintCase(); } }
  else if(act === "actEdit"){
    const entry = ((WS && WS.activity) || []).find(x => x.id === Number(el.dataset.id));
    if(entry){ WS_ERR = "";
      ACT_MODAL = {tab:"quick", pick:"", edit: entry.id,
        pre:{description: entry.description, location: entry.location,
             vehicle: entry.vehicle, internal_note: entry.internal_note}};
      paintCase(); } }
  else if(act === "subjNew"){ SUBJ_FORM = {mode:"new", pre:{}}; WS_ERR = ""; paintCase(); }
  else if(act === "subjFromIntake"){
    const p = (WS && WS.submission && WS.submission.payload) || {};
    SUBJ_FORM = {mode:"new", pre:{name: p.subject_name || "", addresses: p.subject_address || "",
                                  descriptors: p.subject_description || ""}};
    WS_ERR = ""; paintCase();
  }
  else if(act === "subjEdit"){ SUBJ_FORM = {mode:"edit", id: Number(el.dataset.id)}; WS_ERR = ""; paintCase(); }
  else if(act === "vehAdd"){ SUBJ_FORM = {mode:"veh", sid: Number(el.dataset.sid)}; WS_ERR = ""; paintCase(); }
  else if(act === "vehEdit"){ SUBJ_FORM = {mode:"veh", sid: Number(el.dataset.sid), vid: Number(el.dataset.vid)}; WS_ERR = ""; paintCase(); }
  else if(act === "subjCancel"){ SUBJ_FORM = null; WS_ERR = ""; paintCase(); }
  else if(act === "taskStatus"){ setTaskStat(Number(el.dataset.id), el.dataset.s); }
  else if(act === "closeCase"){ doCloseCase(); }
  else if(act === "invOpen"){ openInvoice(Number(el.dataset.id)); }
  else if(act === "invBack"){ INV_OPEN = null; INV_MSG = ""; loadInvoices(); }
  else if(act === "invStatus"){ setInvStatus(el.dataset.s); }
  else if(act === "invCopy"){ copyInvoiceDetails(); }
  else if(act === "invPrint"){
    document.body.classList.add("printing-invoice");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-invoice"), 400);
  }
  else if(act === "invAddLine"){
    INV_OPEN.lines = invLinesFromDom().concat([{description: "", qty: "", rate: "", amount: ""}]);
    paint();
  }
  else if(act === "invDelLine"){
    const lines = invLinesFromDom(); lines.splice(Number(el.dataset.i), 1);
    INV_OPEN.lines = lines; paint();
  }
  else if(act === "invSaveLines"){ saveInvoiceLines(); }
  else if(act === "evDelete"){ deleteEvidenceRow(Number(el.dataset.id)); }
  else if(act === "pkgStart"){ pkgApi(`/cases/${encodeURIComponent(WS_CASE)}/build`); }
  else if(act === "pkgAdd"){ pkgApi(`/build/${PKG.build.id}/items`, {evidence_id: Number(el.dataset.id)}); }
  else if(act === "pkgRemove"){ pkgApi(`/build/${PKG.build.id}/items/${el.dataset.id}/remove`); }
  else if(act === "pkgFinalize"){ pkgApi(`/build/${PKG.build.id}/finalize`); }
  else if(act === "pkgReopen"){ pkgApi(`/build/${PKG.build.id}/reopen`); }
  else if(act === "pkgDelivered"){ pkgApi(`/build/${PKG.build.id}/delivered`); }
  else if(act === "pkgPrint"){
    document.body.classList.add("printing-package");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-package"), 400);
  }
  else if(act === "createInvoice"){ createInvoiceFor(el.dataset.case, false); }
  else if(act === "createInvoiceAuth"){ createInvoiceFor(el.dataset.case, true); }
  else if(act === "openReport"){
    WS_REPORT = WS_REPORT === Number(el.dataset.id) ? null : Number(el.dataset.id);
    REP_VIEW = "preview"; WS_ERR = ""; paintCase();
  }
  else if(act === "repView"){
    REP_VIEW = el.dataset.v; WS_ERR = "";
    // Versions load on first look, then stay.
    if(REP_VIEW === "versions" && WS_REPORT && !REP_VERS[WS_REPORT]) loadReportVersions(WS_REPORT);
    else paintCase();
  }
  else if(act === "repPrint"){
    document.body.classList.add("printing-report");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-report"), 400);
  }
  else if(act === "evTab"){ EV_TAB = el.dataset.t; paintCase(); }
  else if(act === "saveReport"){ saveReportBody(Number(el.dataset.id)); }
  else if(act === "reportStatus"){ setReportStage(Number(el.dataset.id), el.dataset.to); }
  else if(act === "reviewExpense"){ reviewExpenseEntry(Number(el.dataset.id)); }
  else if(act === "saveUserRates"){ saveUserRates(Number(el.dataset.id)); }
  else if(act === "resetLink"){ requestResetLink(Number(el.dataset.id)); }
  else if(act === "deleteUser"){ deleteUserAccount(Number(el.dataset.id)); }
  else if(act === "copyResetLink"){
    if(RESET_BOX) navigator.clipboard.writeText(RESET_BOX.url).then(() => { el.textContent = "Copied"; });
  }
  else if(act === "acceptOffer"){ respondOffer(Number(el.dataset.id), "accept"); }
  else if(act === "declineOffer"){ respondOffer(Number(el.dataset.id), "decline"); }
  else if(act === "withdrawOffer"){ withdrawOffer(Number(el.dataset.id)); }
  else if(act === "calMonth"){
    const [y, m] = CAL.month.split("-").map(Number);
    const n = new Date(y, m - 1 + Number(el.dataset.d), 1);
    loadCalendar(`${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, "0")}`);
  }
  else if(act === "openSheet"){
    OPEN_SHEET = OPEN_SHEET === el.dataset.sheet ? null : el.dataset.sheet;
    SHEET_MSG = ""; paint();
  }
  else if(act === "emailSheet"){ emailSheet(el.dataset.sheet); }
  else if(act === "copyLink"){
    navigator.clipboard.writeText(LAST_LINK).then(() => { el.textContent = "Copied"; });
  }
  else if(act === "mailLink"){
    ev.preventDefault();
    const subject = encodeURIComponent("Your Always Precise case portal login");
    const body = encodeURIComponent(
      "You have been given access to the Always Precise Investigations case portal.\n\n" +
      "Open this link to choose your password:\n" + LAST_LINK +
      "\n\nThe link works once and expires in 7 days.");
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  }
});

document.addEventListener("submit", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  ev.preventDefault();
  const a = el.dataset.act;
  if(a === "login") doLogin();
  else if(a === "invite") doInvite();
  else if(a === "accept") doAccept(new URLSearchParams(location.search).get("invite") || "");
  else if(a === "resetAccept") doResetAccept(new URLSearchParams(location.search).get("reset") || "");
  else if(a === "addActivity") addActivityEntry();
  else if(a === "quickAdd") quickAddEntry(null);
  else if(a === "startDay") startInvestigationDay();
  else if(a === "endDay") endInvestigationDay();
  else if(a === "saveMeta") saveCaseMeta();
  else if(a === "genReport") generateReportDraft();
  else if(a === "addExpense") addExpenseEntry();
  else if(a === "addNote") addNoteEntry();
  else if(a === "addComm") addCommEntry();
  else if(a === "addTask") addTaskEntry();
  else if(a === "saveClosure") saveClosureTicks();
  else if(a === "invSave") saveInvoiceFields();
  else if(a === "invBillSave") saveInvBill();
  else if(a === "invPay") recordInvPayment();
  else if(a === "evUpload") uploadEvidenceFile();
  else if(a === "makeOffer") makeCaseOffer();
  else if(a === "saveDetails") saveCaseDetails();
  else if(a === "saveSubject") saveSubjectRec(el.dataset.id ? Number(el.dataset.id) : null);
  else if(a === "saveVehicle") saveVehicleRec(Number(el.dataset.sid), el.dataset.vid ? Number(el.dataset.vid) : null);
});

document.addEventListener("input", ev => {
  const din = ev.target.dataset ? ev.target.dataset.actInput : "";
  if(din === "amSearch" && ACT_MODAL){ ACT_MODAL.search = ev.target.value; paintCase(); return; }
  if(din === "amDirty" && ACT_MODAL){ ACT_MODAL.dirty = true; return; }
  if(din === "amArrival" && ACT_MODAL && !ACT_MODAL.dirty){
    // The arrival template (P9): the extras generate the sentence — until the
    // narrative is hand-edited, which makes the hand the author.
    const vp = ($("qa_vp") ? $("qa_vp").value : "").trim();
    const pos = ($("qa_pos") ? $("qa_pos").value : "").trim();
    if($("qa_desc")) $("qa_desc").value = ARRIVAL_LINE
      + (vp ? ` ${vp.replace(/\.$/, "")} present.` : "")
      + (pos ? ` Established surveillance position ${pos.replace(/\.$/, "")}.` : "");
    return;
  }
  if(ev.target.dataset && ev.target.dataset.act === "filter"){ FILTER = ev.target.value; paint(); }
  if(ev.target.dataset && ev.target.dataset.act === "invFilterStatus"){ INV_FILTER.status = ev.target.value; loadInvoices(); }
  if(ev.target.dataset && ev.target.dataset.act === "invFilterType"){ INV_FILTER.type = ev.target.value; loadInvoices(); }
  if(ev.target.dataset && ev.target.dataset.act === "invFilterQ"){ INV_FILTER.q = ev.target.value; loadInvoices(); }
  if(ev.target.dataset && ev.target.dataset.act === "evClass"){ setEvidenceClass(Number(ev.target.dataset.id), ev.target.value); }
  if(ev.target.dataset && ev.target.dataset.act === "pkgType"){ pkgApi(`/build/${PKG.build.id}/package`, {package_type: ev.target.value}); }
});

/* ------------------------------------------------------------------- boot */

(async function boot(){
  const rtoken = new URLSearchParams(location.search).get("reset");
  if(rtoken){
    try{ app.innerHTML = resetView(await api("/reset/" + encodeURIComponent(rtoken))); }
    catch(e){ app.innerHTML = resetView({error: e.message}); }
    return;
  }
  const token = new URLSearchParams(location.search).get("invite");
  if(token){
    try{
      const s = await api("/invite/" + encodeURIComponent(token));
      app.innerHTML = inviteView(s);
    }catch(e){
      app.innerHTML = inviteView({error: e.message});
    }
    return;
  }
  try{
    ME = (await api("/auth/me")).user;   // resume an existing session
    await render();
  }catch{ paint(); }
})();
</script>
</body>
</html>
