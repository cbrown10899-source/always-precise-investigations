    photo_acquired: $("sv_pa") ? $("sv_pa").checked : false,
    video_acquired: $("sv_va") ? $("sv_va").checked : false,
    ...(SV.entry.source ? {source: SV.entry.source, command_id: SV.entry.command_id,
                          heard: SV.entry.heard} : {}),
  };
  try{
    await api(`/cases/${encodeURIComponent(WS_CASE)}/activity`, {method:"POST", body});
    SV.entry = null;
    SV.ok = "✓ Activity saved.";
  }catch(e){ SV.err = e.message; }
  await svReload();
}

/* Photo and video (P10/P11): the phone's own picker, straight to the same
   evidence route. Classification is not offered — field uploads land as
   needs_review and the office decides delivery, which is the existing rule. */
/* PHOTOGRAPHS ONLY. Video was the other caller here until 2026-08-17, when the
   owner made video device-first: a clip is no longer uploaded at all, so the
   Video button opens the timestamp generator instead and this has one job. The
   Worker refuses a video upload anyway — that is where the rule lives — but a
   picker that still offered video would be inviting a refusal. */
function svPickFile(kind){
  SV.err = ""; SV.ok = "";
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = "image/*";
  inp.capture = "environment";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fd = new FormData();
    fd.append("file", f);
    // Ride with the moment it documents when there is one.
    const last = ((WS && WS.activity) || [])[0];
    if(last) fd.append("entry_id", String(last.id));
    SV.ok = "Uploading…"; paint();
    try{
      const res = await fetch(`/portal-api/cases/${encodeURIComponent(WS_CASE)}/evidence`,
        {method:"POST", credentials:"same-origin", body: fd});
      const d = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(d.error || ("Upload failed (" + res.status + ")"));
      SV.ok = `Photo stored${last ? " with the last entry" : ""}.`;
    }catch(e){ SV.err = e.message; SV.ok = ""; }
    await svReload();
  };
  inp.click();
}

/* Voice, level 2 (P8). The transcript is shown and never auto-submitted. */
function svMic(){
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec){ SV.err = "This browser has no speech recognition — the keyboard's dictation works in every field."; return paint(); }
  if(SV.listening && SV._rec){ try{ SV._rec.stop(); }catch{} return; }
  /* THE BUG THE OWNER FELT AS "Tap to speak does nothing". The loop was holding
     the page's one speech session, so this started a second engine on top of it
     and the browser ignored it. Take the session properly instead: the operator
     tapped this, so this is what they want listening. */
  if(SV.voice && SV.voice.on){
    svVoiceLog("Tap to speak took the microphone");
    svVoiceStop("handoff");
    SV.err = "";
  }
  const r = new Rec();
  r.lang = "en-US"; r.interimResults = false; r.maxAlternatives = 1;
  r.onresult = ev => {
    const said = [...ev.results].map(x => x[0].transcript).join(" ").trim();
    SV.heard = said; SV.listening = false; paint();
  };
  r.onerror = ev => { SV.listening = false; SV.err = "Speech input stopped: " + (ev.error || "unknown"); paint(); };
  r.onend = () => { if(SV.listening){ SV.listening = false; paint(); } };
  SV._rec = r; SV.listening = true; SV.err = ""; paint();
  try{ r.start(); }catch(e){ SV.listening = false; SV.err = e.message; paint(); }
}

   control, in its own place, behind its own confirmation — never a retry of the
   same press, and never something the End button can turn into.

   TWO ADMINS ON ONE CASE IS THE ORDINARY CASE, not the exception: you can start

            nothing, and the Worker ended whichever session was newest — so with

/* The confirmation NAMES the person and the request carries their DAY — the two
   have to agree, or a button labelled for one admin ends another's clock. */
async function endOtherAdminsDay(dayId, who){
  if(!confirm(`End ${who}'s session?\n\n` +
    "They are out on this case now. Their hours are recorded to them, and this " +
    "cannot be undone from here — they would have to start a new day.")) return;
  WS_ERR = ""; DAY_OTHER = "";
  try{
    /* NOW, not a field: an admin ending someone else's session has no End form
       in front of them — that form belongs to their own day, which is exactly
       the day they do not have. The Worker requires an end time, so the moment
       of the press is the honest one. Mileage and summary are theirs to know,
       not this admin's to invent. */
    const r = await api(`/cases/${encodeURIComponent(WS_CASE)}/day/end-other`, {method:"POST", body:{
      end_time: new Date().toTimeString().slice(0, 5), day_id: dayId,
    }});

function wizCollect(){
  if(!SHEET_WIZ) return;

  if($("wiz_case")) SHEET_WIZ.caseNo = $("wiz_case").value.trim();
  if($("wiz_note")) SHEET_WIZ.note = $("wiz_note").value.trim();
  if($("wiz_inc")) SHEET_WIZ.include = $("wiz_inc").checked;
  if($("wiz_ret")) SHEET_WIZ.retainerPick = $("wiz_ret").value;
  if($("wiz_retc")) SHEET_WIZ.retainerCustom = $("wiz_retc").value.trim();
  if($("wiz_pay")) SHEET_WIZ.pay = $("wiz_pay").checked;
  const boxes = [...document.querySelectorAll(".wiz-pm")];
  if(boxes.length){
    SHEET_WIZ.payMethods = boxes.filter(b => b.checked).map(b => b.dataset.pm);
  }
}

async function wizSend(){
  wizCollect();
  const w = SHEET_WIZ;
  /* Only the private sheet may carry payment, and only what was ticked. The
     Worker decides this too, from the sheet id — sending the flag here for a
     carrier sheet would be refused rather than obeyed. */
  const paying = w.sheet === "private_retainer" && w.pay && (w.payMethods || []).length;
  try{
    const r = await api(`/sheets/${encodeURIComponent(w.sheet)}/email`,
      {method:"POST", body:{to: w.to, note: w.note, case_no: w.caseNo, include_intake: w.include,
        /* Only ever sent when there was nowhere to store it. The Worker
           ignores it outright if the case has a figure of its own, so this
           cannot overwrite what the office agreed. */
        ...(w.retainerOffered != null ? {retainer_amount: w.retainerOffered} : {}),
        ...(paying ? {include_payment: true, methods: w.payMethods} : {})}});
    /* §13 — say what actually WENT, read back from the Worker's own answer
       rather than from the boxes that were ticked. */
    const inc = r.included || {};
    const bits = [];
    if(w.include) bits.push("the intake link");
    if((inc.payment_methods || []).length){
      bits.push(inc.payment_methods.map(m => m.label).join(" and "));
    }
    SHEET_MSG = `Sent to ${r.sent_to}${bits.length ? ", with " + bits.join(" and ") : ""}.`
      + ((inc.payment_methods || []).length ? " The retainer is still pending until you record it." : "");
    if(w.fromLead){ LEAD_MSG = SHEET_MSG; SHEET_WIZ = null; return render(); }
    SHEET_WIZ = null;
  }catch(e){ w.err = e.message; }
  paint();
}

/* Manual intake (P17): one POST, then either straight into the case or back
   to the leads desk with the number in hand. */
/* Read what is on screen into the draft. Called before every repaint of this
   form — choosing a profile, changing the contact, opening the picker — for
   the reason written above the form itself. */
function nlCollect(){
  if(!NL) return;
  const v = NL.v || (NL.v = {});
  for(const id of ["nl_firm", "nl_atty", "nl_email", "nl_phone", "nl_client", "nl_subject",
    "nl_asgtype", "nl_retainer", "nl_arrangement", "nl_legal_deadline", "nl_carrier",
    "nl_claim", "nl_policy", "nl_service", "nl_obj", "nl_deadline", "nl_notes"]){
    const el = $(id);
    if(el) v[id] = el.value;
  }
  const save = $("nl_saveprof");
  if(save) NL.saveProfile = save.checked;
}

async function submitManualIntake(openAfter){
  nlCollect();
  const g = id => (NL.v && NL.v[id] != null) ? NL.v[id] : "";
  const legal = NL.kind === "legal";
  const body = {
    kind: NL.kind,
    carrier: g("nl_carrier"), client_name: g("nl_client"),
    client_email: g("nl_email"), client_phone: g("nl_phone"),
    claim_number: g("nl_claim"), policy_number: g("nl_policy"),
    subject_name: g("nl_subject"), objective: g("nl_obj"),
    timeline: g("nl_deadline"), notes: g("nl_notes"),
    service: NL.kind === "claims" ? "Insurance claim assignment" : g("nl_service"),
  };
  if(legal){
    Object.assign(body, {
      firm_name: g("nl_firm"), attorney_name: g("nl_atty"),
      attorney_email: g("nl_email"), attorney_phone: g("nl_phone"),
      assignment_type: g("nl_asgtype"), payment_arrangement: g("nl_arrangement"),
      deadline: g("nl_legal_deadline"),
    });
    /* The paralegal and the billing contact the office chose off the firm —
       the owner's steps 4 and 5. Chosen, never assumed: no selection posts
       nothing rather than the firm's first paralegal. */
    const para = NL.paralegal, bill = NL.billing;
    if(para){
      body.paralegal_name = [para.first_name, para.last_name].filter(Boolean).join(" ");
      body.paralegal_email = para.email || "";
      body.paralegal_phone = ((para.phones || [])[0] || {}).number || "";
    }
    if(bill){
      body.billing_name = [bill.first_name, bill.last_name].filter(Boolean).join(" ");
      body.billing_email = bill.email || "";
      body.billing_phone = ((bill.phones || [])[0] || {}).number || "";
    }
  }
  /* The firm's own details, carried from the profile rather than retyped.
     Anything the office edited on the form wins — these fill only what the
     short form does not ask for. */
  if(NL.firm){
    for(const [k, val2] of Object.entries(NL.firm)) if(val2 && !body[k]) body[k] = val2;
  }
  /* UNIT 7 — the profile this came from, recorded ALONGSIDE the case rather
     than as part of it. Everything above is what the office actually has on
     screen, prefilled or typed; the Worker never re-reads the profile. */
  if(NL.profile_id){
    body.profile_id = NL.profile_id;
    if(NL.contact_id) body.profile_contact_id = NL.contact_id;
  }else if(NL.saveProfile){
    body.save_profile = true;
  }
  const retainerAmt = legal ? String(g("nl_retainer") || "").replace(/[^0-9.]/g, "") : "";
  try{
    const r = await api("/intakes", {method: "POST", body});
    /* THE AGREED RETAINER KEEPS ITS ONE WRITER (LEGAL-INTAKE.md D5): the quick
       form records it through the same route the private send wizard uses, so
       the figure lands in case_retainer exactly as any private client's does —
       agreed, never received. A failure here must not lose the lead that was
       just created: it is reported on the lead screen instead. */
    if(legal && retainerAmt && Number(retainerAmt) > 0){
      try{ await api(`/cases/${encodeURIComponent(r.case_no)}/retainer`,
        {method: "POST", body: { retainer_amount: Number(retainerAmt) }}); }
      catch(e){ LEAD_MSG = `Saved as ${r.case_no}, but the retainer did not record — ${e.message}`; }
    }
    /* The tick is a convenience, and it says what it actually did. Where a
       possible match exists it creates nothing and points at the deliberate
       door — a convenience must not be the one path that walks past the
       warning every other door stops at. */
    let profMsg = "";
    if(NL.saveProfile && !NL.profile_id){
      profMsg = r.profile_saved ? " Saved as a reusable profile too."
        : r.profile_reason === "possible_duplicate"
          ? ` A similar profile already exists (${(r.matches || []).map(m => m.name).join(", ")}), so`
            + ` none was created — open the case and use Save as profile to decide.`
          : "";
    }
    NL = null;
    if(openAfter){ await render(); return openCase(r.case_no); }
    LEAD_MSG = LEAD_MSG
      || `Saved as ${r.case_no}. It waits under New until you accept it.${profMsg}`;
    TAB = "leads";
    await render();
  }catch(e){ NL.err = e.message; paint(); }
}

/* --------------------------------------------------------- event routing */
/* One delegated listener. Nothing user-supplied is ever written into an
   inline handler, where the browser would decode it back into script. */

/* Escape is the desktop way out of the viewer, beside the Back control. Scoped
   to the viewer alone so it cannot start closing other things by surprise. */
document.addEventListener("keydown", ev => {
  /* UNIT 8 — keyboard on the search box, and ONLY there: arrows to move,
     Enter to open, Escape to clear. Scoped to the input so it cannot start
     stealing keys from the rest of the portal. */
  if(ev.target && ev.target.id === "gsearch"){
    const n = (SRCH.results || []).length;
    if(ev.key === "ArrowDown" && n){ ev.preventDefault(); SRCH.hi = (SRCH.hi + 1) % n; paint(); return; }
    if(ev.key === "ArrowUp" && n){ ev.preventDefault(); SRCH.hi = (SRCH.hi - 1 + n) % n; paint(); return; }
    if(ev.key === "Enter" && n){
      ev.preventDefault();
      const r = (SRCH.results || [])[SRCH.hi < 0 ? 0 : SRCH.hi];
      if(!r) return;
      const d = r.dest || {};
      if(d.view === "profile"){ VIEW = "list"; TAB = "profiles"; render().then(() => profOpenId(d.id)); }
      else openCase(d.case_no, d.tab || undefined);
      return;
    }
    if(ev.key === "Escape"){ SRCH = { q: "", results: null, err: "", busy: false, hi: -1 }; paint(); return; }
  }
  if(ev.key === "Escape" && EV_VIEW){ EV_VIEW = null; paintEvView(); }
  /* Escape does NOT abandon a render in progress — a stray key must not throw
     away a copy that has been running for minutes. Stop is a deliberate button. */
  else if(ev.key === "Escape" && VST && VST.step !== "working"){ vstClose(); }
});

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act === "backToCases"){ VIEW = "list"; render(); }
  else if(act === "navToggle"){
    const open = document.body.classList.toggle("navopen");
    const bg = $("burger"); if(bg) bg.setAttribute("aria-expanded", open ? "true" : "false");
  }
  else if(act === "pkgJump"){ openCase(el.dataset.case, el.dataset.tab === "overview" ? undefined : el.dataset.tab); }
  /* The top-level door into the field view (owner, 2026-08-14). It used to
     exist ONLY inside a case's Overview tab, so on an iPad you had to open
     Cases, open a case and land on Overview before there was any way in —
     and the only other door was ?surveillance=1, which assumes the icon is
     already on the home screen. This is the same launcher that URL opens. */
  else if(act === "surveillance"){
    document.body.classList.remove("navopen");
    openSurveillanceLauncher();
  }
  else if(act === "tab"){
    if(TAB === "leads" && el.dataset.tab !== "leads") LEAD_MSG = "";
    TAB = el.dataset.tab; paint();
    if(TAB === "calendar") loadCalendar(CAL ? CAL.month : "");
    if(TAB === "invoices"){ INV_OPEN = null; INV_MSG = ""; loadInvoices(); }
    /* The send history is admin-only and lives beside the pre-case sends, so it
       is fetched when that screen is opened rather than held from sign-in. */
    if(TAB === "sheets" && ME.role === "admin"){ SEND_MSG = ""; loadSends(); }
    if(TAB === "dashboard"){ PKGS = null; loadPackages(); loadCompleted(); RECENT = null; loadRecent();
      loadAttention().then(paint); }
    /* Arriving at Search is a fresh box: the last query is not the office's
       current question, and a stale result list under a stale term is worse
       than an empty one. */
    if(TAB === "search"){ SRCH = { q: "", results: null, err: "", busy: false, hi: -1 }; }
    /* Reports & Packages reads the two routes it is assembled from, both
       admin-only in the Worker. Fetched on arrival for the same reason the
       dashboard refetches: a stale package stage is a wrong next step. */
    if(TAB === "delivery" && ME.role === "admin"){ PKGS = null; loadPackages(); loadCompleted(); }
    /* UNIT 7 — the directory is fetched on ARRIVAL, like every other tab that
       carries data. A tab click paints; only these lines fetch. Reading a
       stale list is the failure that matters here: a firm saved from a case
       would be missing from the very screen that answers "do we already have
       them?", and the office would create a second one. */
    if(TAB === "profiles" && ME.role === "admin"){
      PROF_OPEN = null; PROF_FORM = null; PROF_CONTACT = null; PROF_MSG = "";
      PROF_OK = false; PROF_ERR = "";
      loadProfiles().then(paint);
    }
    // Arriving at Settings is a fresh start: drafts are for recovering from a
    // refusal in front of you, not for surviving a trip around the portal.
    if(TAB === "settings" && ME.role === "admin"){
      PAY_MSG = ""; PAY_ERR = false; PAY_DRAFT = {}; loadPaymentMethods();
      NOTIFY = null; NOTIFY_MSG = ""; NOTIFY_NEW = false; loadNotify();
      DBX = null; DBX_MSG = ""; DBX_SAVING = false; DBX_DRAFT = null; loadDropbox();
      SH = { state: "never", data: null }; loadStorageHealth();
    }
    document.body.classList.remove("navopen");
    if(TAB === "myreports") api("/my/reports").then(d => { MY_REPORTS = d; paint(); }).catch(()=>{});
    if(TAB === "myexpenses"){
      api("/my/expenses").then(d => { MY_EXPENSES = d; paint(); }).catch(()=>{});
      api("/my/comp").then(d => { MY_COMP = d; paint(); }).catch(()=>{});
    }
  }
  else if(act === "openCaseTab"){ openCase(el.dataset.case, el.dataset.tab); }
  else if(act === "paySave"){ savePaymentMethod(el.dataset.id, el.dataset.on === "1"); }
  else if(act === "ntAdd"){ NOTIFY_NEW = true; NOTIFY_MSG = ""; paint(); }
  else if(act === "ntEdit"){ NOTIFY_NEW = Number(el.dataset.id); NOTIFY_MSG = ""; paint(); }
  else if(act === "ntCancel"){ NOTIFY_NEW = false; NOTIFY_MSG = ""; paint(); }
  else if(act === "ntSave"){ saveNotifyRecipient(el.dataset.id ? Number(el.dataset.id) : null); }
  else if(act === "ntToggle"){ notifyAction(`/notify-recipients/${el.dataset.id}`, {enabled: el.dataset.on !== "1"}); }
  else if(act === "ntDelete"){
    if(confirm("Remove this recipient?\n\nThey stop being told anything. Switching them off "
      + "instead keeps the number and its choices.")) notifyAction(`/notify-recipients/${el.dataset.id}/delete`);
  }
  /* PAYMENTS.md §10's RECORD PAYMENT, from the lead card. THE SAME WRITER, not
     a second one: it opens the case and puts the existing retainer form up, the
     way `ovRecordPaymentHtml` reaches it from Overview. Same `RET_*` state, same
     idempotency token, same route.

     `openCase` resets retainer state for the case it lands on and returns early
     if the workspace fails to load, so the form is only raised once that landing
     is confirmed — otherwise a failed open leaves a payment form floating over
     whichever case was on screen before. */
  else if(act === "leadRecordPay"){
    const no = el.dataset.case;
    openCase(no).then(() => { if(WS && WS_CASE === no){ RET_FORM = true; paintCase(); } });
  }
  /* THE ONE VIEWER, opened from all six evidence surfaces. It repaints only its
     own root, so the screen behind is not re-rendered — which is what makes
     closing return the user to exactly the scroll position, tab and panel they
     came from, rather than to a rebuilt approximation of it. */
  /* PHASE 8 — pinning is an EXPLICIT act and this is its only writer. Nothing
     infers a favourite from opening, sending or working a case. */
  else if(act === "favCase"){ favToggleCase(el.dataset.case); paint(); }
  else if(act === "evOpen"){
    EV_VIEW = { src: el.dataset.src, name: el.dataset.name || "", type: el.dataset.type || "" };
    paintEvView();
  }
  else if(act === "evClose"){ EV_VIEW = null; paintEvView(); }
  /* The video timestamp generator. `vstCollect()` before every repaint, for the
     reason EDIT_DRAFT exists: the inputs are rebuilt from VST each paint, so a
     correction not read back first would revert without a sound. */
  else if(act === "vstOpen"){
    /* An explicit empty data-case means "ask" — the dashboard and navigation
       doors set it that way deliberately, and must not silently inherit
       whichever case happens to be open behind them. */
    const attr = el.getAttribute("data-case");
    vstOpen(attr === null ? (WS_CASE || "") : attr);
  }
  else if(act === "vstPickCase"){
    VST.caseNo = el.getAttribute("data-case") || "";
    VST.err = "";
    // Attaching a copy that already exists writes its record now; otherwise
    // the flow simply carries on to the time.
    if(VST.out){ VST.step = "done"; paintVStamp(); vstRecord().then(paintVStamp); }
    else { VST.step = "when"; paintVStamp(); }
  }
  else if(act === "vstSkipCase"){ VST.caseNo = ""; VST.step = "when"; paintVStamp(); }
  else if(act === "vstAttach"){ VST.step = "case"; paintVStamp(); vstLoadCases(); }
  else if(act === "vstUseTime"){
    vstCollect();
    const s = vstStart();
    if(!s.ok){ VST.err = s.why; } else { VST.err = ""; VST.startMs = s.ms; VST.step = "preview"; }
    paintVStamp();
  }
  else if(act === "vstEditTime"){ VST.step = "when"; VST.err = ""; paintVStamp(); }
  else if(act === "vstGo"){ vstGenerate(); }
  else if(act === "vstSave"){ vstSave(); }
  else if(act === "vstSaved"){ vstConfirmSaved(); }
  else if(act === "vstDropbox"){ vstDropboxSave(); }
  /* Cancel is a flag the loop reads between parts, not a torn-down request:
     the session is simply never finished, so nothing lands in the folder. */

    /* Everything sendable starts ticked, the same default the send wizard uses:
       an admin unticks what they do not want rather than hunting for what they
       do. The configuration is fetched on demand because the leads desk has not
       been near Settings. */
    (async () => {
      if(!PAYCFG) await loadPaymentMethods();
      if(PAY_SEND && !PAY_SEND.methods.length){
        PAY_SEND.methods = wizPaymentSendable().map(m => m.id);
      }
      paint();
    })();
    paint();
  }
  /* PRE-CASE SENDS (owner, 2026-08-15) — the door that did not exist. Opened
     from the Rate sheets view, which has no case context by nature, so nothing
     here is prefilled from a lead and nothing needs to be. */
  else if(act === "preIntake"){
    INTAKE_SEND = {kind: el.dataset.kind === "insurance" ? "insurance" : "private",
                   to: "", name: "", err: "", busy: false};
    SEND_MSG = ""; paint();
    const inp = $("pi_to"); if(inp) inp.focus();
  }
  else if(act === "sendsRetry"){ SENDS_ERR = ""; loadSends(); }
  else if(act === "preIntakeClose"){ INTAKE_SEND = null; paint(); }
  else if(act === "preIntakeGo"){ preIntakeGo(); }
  else if(act === "prePay"){
    /* The same dialog the lead card opens, with no case behind it. Deliberately
       the same code path: a second payment dialog would be a second place for
       the private-only boundary to be got wrong. */
    PAY_SEND = {caseNo: "", to: "", name: "", note: "", methods: [], step: 1,
                err: "", busy: false};
    SEND_MSG = "";
    (async () => {
      if(!PAYCFG) await loadPaymentMethods();
      if(PAY_SEND && !PAY_SEND.methods.length){
        PAY_SEND.methods = wizPaymentSendable().map(m => m.id);
      }
      paint();
    })();
    paint();
  }
  else if(act === "paySendClose"){ PAY_SEND = null; paint(); }
  else if(act === "paySendStep"){
    paySendCollect();
    const s2 = Number(el.dataset.s);
    if(s2 > 1 && !PAY_SEND.to){ PAY_SEND.err = "Enter the address to send it to."; }
    else if(s2 > 1 && !(PAY_SEND.methods || []).length){
      /* Refused here rather than sent as an empty PAYMENT OPTIONS heading. The
         Worker refuses it too; this just answers it where it can be fixed. */
      PAY_SEND.err = "Choose at least one payment method.";
    }
    else { PAY_SEND.err = ""; PAY_SEND.step = s2; }
    paint();
  }
  else if(act === "paySendGo"){ paySendGo(); }
  else if(act === "leadIntakeCancel"){ LEAD_SEND = null; paint(); }
  else if(act === "leadIntakeSend"){ sendLeadIntakeMail(el.dataset.case); }
  else if(act === "wizPayToggle"){ wizCollect(); paint(); }
  else if(act === "wizClose"){ SHEET_WIZ = null; paint(); }
  else if(act === "wizStep"){
    wizCollect();
    const s2 = Number(el.dataset.s);
    if(s2 > 1 && !SHEET_WIZ.to){ SHEET_WIZ.err = "Enter the address to send it to."; paint(); }
    /* The case number can be TYPED on step 1, so the sheet is re-read on the
       way to Preview: the retainer belongs to the case, and the preview has to
       be the document that will actually be sent.
       The agreed retainer is WRITTEN first, for the same reason — the sheet is
       then re-read from the server and shows the figure the case actually
       holds, so the preview can never display an amount that was not stored. */
    else if(s2 > 1){
      SHEET_WIZ.err = "";
      wizRetainerSave().then(okd => {
        if(!SHEET_WIZ) return;
        if(!okd) return paint();
        SHEET_WIZ.step = s2; paint(); wizSheetLoad();
      });
    }
    else { SHEET_WIZ.err = ""; SHEET_WIZ.step = s2; paint(); }
  }
  else if(act === "wizSend"){ wizSend(); }
  else if(act === "nlKind"){ NL = {kind: el.dataset.k, err: "", v: {}}; paint(); }
  else if(act === "nlBack"){ NL = {kind: null, err: "", v: {}}; paint(); }
  else if(act === "nlSave"){ submitManualIntake(el.dataset.open === "1"); }
  /* ------------------------------------------------- UNIT 7: the picker */
  else if(act === "nlPickOpen"){ nlCollect(); NL.pick = {open: true, q: ""}; paint(); }
  else if(act === "nlPickClose"){ nlCollect(); NL.pick = null; paint(); }
  else if(act === "nlPickChoose"){
    nlCollect();
    const p = ((NL.pick && NL.pick.results) || []).find(x => String(x.id) === el.dataset.id);
    if(p){
      const c = (p.contacts || []).find(x => x.preferred && x.active)
        || (p.contacts || []).find(x => x.active) || null;
      NL.profile = p; NL.profile_id = p.id; NL.contact_id = c ? c.id : null;
      NL.pick = null;
      nlPrefill(p, c);
    }
    paint();
  }
  else if(act === "nlPickClear"){
    nlCollect();
    /* Starting fresh clears the LINK and the values that came with it, and
       leaves everything the office typed for this assignment alone. */
    const keep = NL.v || {};
    for(const k of ["nl_firm", "nl_atty", "nl_email", "nl_phone", "nl_carrier", "nl_client",
      "nl_arrangement"]) delete keep[k];
    NL.profile = null; NL.profile_id = null; NL.contact_id = null; NL.v = keep;
    NL.firm = null; NL.paralegal = null; NL.paralegal_id = null;
    NL.billing = null; NL.billing_id = null;
    paint();
  }
  else if(act === "legalSave"){ saveLegalPanel(); }
  /* ------------------------------------------ UNIT 7: clients & firms */
  /* ---------------------------------------------- UNIT 8: search & alerts */
  else if(act === "srchClear"){ SRCH = { q: "", results: null, err: "", busy: false, hi: -1 }; paint(); }
  else if(act === "srchRetry"){ SRCH.err = ""; runSearch(); }
  else if(act === "srchGoCase"){
    /* STRAIGHT TO THE WORK. The whole point is not search -> results -> cases
       -> search again; a result opens the case at the panel that matched. */
    openCase(el.dataset.case, el.dataset.tab || undefined);
  }
  else if(act === "srchGoProfile"){
    VIEW = "list"; TAB = "profiles";
    const id = el.dataset.id;
    render().then(() => profOpenId(id));
  }
  /* UNIT 9 — choosing a report style. The preview turns over LOCALLY first, so
     switching between templates is a repaint rather than a round trip, and the
     one write that records the choice follows. Nothing is regenerated and no
     PDF is stored by looking: the document, the print view, the download and
     the Dropbox copy all come from this same rendering when they are asked
     for. */
  else if(act === "tmplPick"){
    if(!PKG || !PKG.build || PKG.build.status !== "draft") return;
    const want = el.dataset.t;
    if(want === tmplCurrent()) return;
    const was = PKG.template;
    PKG.template = want; PKG.template_msg = ""; paintCase();
    /* api() rather than pkgApi(): pkgApi swallows its own failure into WS_ERR
       and reloads, so the rollback below would never run and the picker would
       sit showing a style the record does not hold. */
    api(`/build/${PKG.build.id}/template`, {method: "POST", body: {template: want}})
      .then(st => { PKG = st; paintCase(); })
      .catch(e => {
        /* AND IT SAYS SO IF THE CHOICE DID NOT STICK. A preview showing one
           style while the record holds another is the drift this whole unit is
           built to avoid. */
        PKG.template = was;
        PKG.template_msg = "That template was not saved — " + e.message;
        paintCase();
      });
  }
  else if(act === "attnFilter"){ ATTN_FILTER = el.dataset.k || "all"; paint(); }
  else if(act === "attnRetry"){ ATTN_ERR = ""; loadAttention().then(paint); }
  else if(act === "profKind"){ PROF_KIND = el.dataset.k || ""; loadProfiles().then(paint); }
  else if(act === "profInactive"){ PROF_INACTIVE = el.checked; loadProfiles().then(paint); }
  else if(act === "profReload"){ PROF_OK = false; PROF_ERR = ""; loadProfiles().then(paint); }
  else if(act === "profOpen"){ profOpenId(el.dataset.id); }
  /* From inside a case the workspace is a whole page, so leaving it is the
     first half of opening the directory — the same exit the Settings tab
     needed after a suite run walked straight from a case into it. */
  else if(act === "profOpenFromCase"){
    VIEW = "list"; TAB = "profiles";
    const id = el.dataset.id;
    render().then(() => profOpenId(id));
  }
  else if(act === "profBack"){
    PROF_OPEN = null; PROF_FORM = null; PROF_CONTACT = null; PROF_MSG = "";
    loadProfiles().then(paint);
  }
  else if(act === "profNew"){
    PROF_OPEN = null; PROF_MSG = "";
    PROF_FORM = {mode: "new", kind: "law_firm", v: {}, matches: [], err: ""};
    paint();
  }
  else if(act === "profFormKind"){
    profFormCollect();
    PROF_FORM.kind = el.dataset.k; PROF_FORM.matches = [];
    paint();
  }
  else if(act === "profEdit"){
    const P = PROF_OPEN.profile;
    PROF_FORM = {mode: "edit", kind: P.kind, err: "", matches: [], v: {
      name: P.name || "", email: P.email || "", address: P.address || "",
      billing_name: P.billing_name || "", billing_email: P.billing_email || "",
      payment_arrangement: P.payment_arrangement || "", notes: P.notes || "",
      phones: (P.phones || []).map(x => ({number: x.number, label: x.label || ""})),
    }};
    paint();
  }
  else if(act === "profCancel"){
    PROF_FORM = null;
    if(!PROF_OPEN){ loadProfiles().then(paint); } else paint();
  }
  else if(act === "profSave"){ profSave(el.dataset.confirm === "1"); }
  else if(act === "profActive"){
    const on = el.dataset.on === "1";
    api(`/profiles/${el.dataset.id}`, {method: "POST", body: {active: on}})
      .then(r => { PROF_OPEN.profile = r.profile;
        PROF_MSG = on ? "Active again." : "Set inactive. Every case it is on is unchanged."; })
      .catch(e => { PROF_MSG = e.message; })
      .then(paint);
  }
  else if(act === "profDelete"){
    /* An explicit confirmation, and the Worker refuses outright when any case
       has ever used it — so a client's history can never go with a profile. */
    if(!confirm("Delete this profile? Cases it is already on are never touched — and if it is on any, "
      + "the portal will refuse and offer Inactive instead.")) return;
    api(`/profiles/${el.dataset.id}/delete`, {method: "POST"})
      .then(() => { PROF_OPEN = null; PROF_MSG = "Profile deleted. No case was affected.";
        return loadProfiles(); })
      .catch(e => { PROF_MSG = e.message; })
      .then(paint);
  }
  else if(act === "profStart"){
    const p = (PROF_OPEN && PROF_OPEN.profile && String(PROF_OPEN.profile.id) === el.dataset.id)
      ? PROF_OPEN.profile : (PROF || []).find(x => String(x.id) === el.dataset.id);
    if(p && p.contacts) profStart(p);
    else api(`/profiles/${el.dataset.id}`).then(d => profStart(d.profile)).catch(e => {
      PROF_MSG = e.message; paint(); });
  }
  else if(act === "profContactNew"){ PROF_CONTACT = {id: null, v: {}, err: "", matches: []}; paint(); }
  else if(act === "profContactEdit"){
    const c = (PROF_OPEN.profile.contacts || []).find(x => String(x.id) === el.dataset.id);
    PROF_CONTACT = {id: c.id, err: "", matches: [], v: {
      first_name: c.first_name || "", last_name: c.last_name || "", role: c.role || "",
      email: c.email || "", preferred: !!c.preferred,
      phones: (c.phones || []).map(x => ({number: x.number, label: x.label || ""})),
    }};
    paint();
  }
  else if(act === "profContactCancel"){ PROF_CONTACT = null; paint(); }
  else if(act === "profContactSave"){ profContactSave(el.dataset.id, el.dataset.confirm === "1"); }
  else if(act === "profContactPref"){
    api(`/profiles/${PROF_OPEN.profile.id}/contacts/${el.dataset.id}`,
      {method: "POST", body: {preferred: true}})
      .then(r => { PROF_OPEN.profile = r.profile; })
      .catch(e => { PROF_MSG = e.message; }).then(paint);
  }
  else if(act === "profContactActive"){
    api(`/profiles/${PROF_OPEN.profile.id}/contacts/${el.dataset.id}`,
      {method: "POST", body: {active: el.dataset.on === "1"}})
      .then(r => { PROF_OPEN.profile = r.profile; })
      .catch(e => { PROF_MSG = e.message; }).then(paint);
  }
  else if(act === "profContactRemove"){
    if(!confirm("Remove this contact from the profile? Cases they are already on keep everything "
      + "they were created with.")) return;
    api(`/profiles/${PROF_OPEN.profile.id}/contacts/${el.dataset.id}/remove`, {method: "POST"})
      .then(r => { PROF_OPEN.profile = r.profile; PROF_MSG = "Contact removed. No case changed."; })
      .catch(e => { PROF_MSG = e.message; }).then(paint);
  }
  /* On the case: link it, save it, or clear the link. All three are things an
     admin presses; none of them happens on its own. */
  /* The match is run because this was pressed — not on every case open, which
     is what it used to cost. */
  else if(act === "caseProfMatch"){
    api(`/cases/${encodeURIComponent(WS_CASE)}/profile-match`)
      .then(r => { WS.profile = {...(WS.profile || {}), suggested: r.matches || [], looked: true}; })
      .catch(e => { WS_NOTICE = e.message; }).then(paintCase);
  }
  else if(act === "caseProfLink"){
    api(`/cases/${encodeURIComponent(WS_CASE)}/profile`, {method: "POST",
      body: {profile_id: Number(el.dataset.id)}})
      .then(r => { WS.profile = r.profile; WS_NOTICE = "Linked to the saved profile."; })
      .catch(e => { WS_NOTICE = e.message; }).then(paintCase);
  }
  else if(act === "caseProfSave"){
    api(`/cases/${encodeURIComponent(WS_CASE)}/profile`, {method: "POST",
      body: {save_as_profile: true, confirm_new: el.dataset.confirm === "1"}})
      .then(r => { WS.profile = r.profile; WS_NOTICE = "Saved as a reusable profile."; })
      .catch(e => {
        WS_NOTICE = e.code === "possible_duplicate"
          ? "A similar profile already exists: " + (e.matches || []).map(m => m.name).join(", ")
            + ". Use it below, or save anyway."
          : e.message;
        if(e.code === "possible_duplicate") WS.profile = {...(WS.profile || {}), suggested: e.matches || [], dup: true};
      }).then(paintCase);
  }
  else if(act === "caseProfClear"){
    api(`/cases/${encodeURIComponent(WS_CASE)}/profile`, {method: "POST", body: {clear: true}})
      .then(r => { WS.profile = r.profile; WS_NOTICE = "Link removed. The case is unchanged."; })
      .catch(e => { WS_NOTICE = e.message; }).then(paintCase);
  }
  else if(act === "copyLink"){
    navigator.clipboard.writeText(LAST_LINK).then(() => { el.textContent = "Copied"; });
  }
  else if(act === "mailLink"){
    ev.preventDefault();
    const subject = encodeURIComponent("Your Always Precise case portal login");
    const body = encodeURIComponent(
      "You have been given access to the Always Precise Investigations case portal.\n\n" +
      "Open this link to choose your password:\n" + LAST_LINK +
      "\n\nThe link works once and expires in 7 days.");
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  }
});

/* THE PAGE HAD NO `change` LISTENER, so a <select> whose whole job is choosing
   between saved contacts did nothing at all: it rendered, it looked right, and
   picking a different attorney changed neither the prefilled name nor what was
   posted. A control that draws is not a control that works — the same lesson
   the Timestamp Video quick tool taught at a different layer. */
document.addEventListener("change", ev => {
  const act = ev.target.dataset ? ev.target.dataset.actChange : "";
  /* The daily summary's controls: capture-then-recompose, per day. */
  if(act === "dsCtl"){ dsCtl(parseInt(ev.target.dataset.day, 10)); return; }
  if(!act || !NL) return;
  if(act === "nlPickContact"){
    nlCollect();
    const c = (NL.profile.contacts || []).find(x => String(x.id) === ev.target.value);
    if(c){ NL.contact_id = c.id; nlPrefill(NL.profile, c); }
    paint();
  }else if(act === "nlPickPara"){
    nlCollect();
    const c = (NL.profile.contacts || []).find(x => String(x.id) === ev.target.value);
    NL.paralegal_id = c ? c.id : null;
    NL.paralegal = c || null;
    paint();
  }else if(act === "nlPickBill"){
    nlCollect();
    const c = (NL.profile.contacts || []).find(x => String(x.id) === ev.target.value);
    NL.billing_id = c ? c.id : null;
    NL.billing = c || null;
    paint();
  }
});

document.addEventListener("input", ev => {
  const din = ev.target.dataset ? ev.target.dataset.actInput : "";
  /* Typing IN the paragraph is the writer taking it over: the flag flips and
     nothing rewrites the box — no repaint here, the cursor is in it. */
  if(din === "dsText"){
    const st = DS_DRAFT[parseInt(ev.target.dataset.day, 10)];
    if(st){ st.text = ev.target.value; st.manual = true; }
    return;
  }
  /* Typing in a small builder field: keep the value, recompose the paragraph
     only while it is still the machine's, and do NOT rebuild the box the
     cursor is sitting in — only the textarea is rewritten, and only when the
     writer has not claimed it. */
  if(din === "dsDirtyCtl"){
    const dayId = parseInt(ev.target.dataset.day, 10);
    dsCollect(dayId);
    const st = DS_DRAFT[dayId];
    const day = ((WS && WS.days) || []).find(d => d.id === dayId);
    if(st && day && !st.manual){
      st.text = dsCompose(day, st.sel);
      const ta = $("ds_text"); if(ta) ta.value = st.text;
    }
    return;
  }
  /* UNIT 7 — the two searches. Both repaint, and both hand the cursor back in
     paint() rather than here, because the box is rebuilt by that repaint. */
  if(din === "profSearch"){ PROF_Q = ev.target.value; profSearchSoon(); return; }
  if(din === "srchType"){ SRCH.q = ev.target.value; srchSoon(); return; }
  if(din === "nlPickSearch" && NL){ nlCollect(); nlPickSearch(ev.target.value); return; }
  if(din === "svSearch" && SV){ SV.search = ev.target.value; paint();
    const q = $("sv_q"); if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } return; }
  if(din === "svDirty" && SV){ SV.dirty = true; return; }
  /* Filtering the case list repaints the panel, which rebuilds the box the
     cursor is in — so the cursor goes straight back, the way the activity
     sheet's own search already does it. */
  if(din === "vstSearch" && VST){ VST.q = ev.target.value; paintVStamp();
    const q = $("vst_q"); if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } return; }
  /* Typing a custom retainer counts as choosing one. No repaint — the box the
     cursor is sitting in must not be rebuilt underneath it mid-number. */
  if(din === "wizRetDirty" && SHEET_WIZ){ SHEET_WIZ.retainerTouched = true; return; }
  /* What will actually be burned in, following the typing. Only this one line
     is rewritten — a repaint would rebuild the box the cursor is in, mid-number,
     the same reason `vstProgress` exists. */
  if(din === "pstInc" && PST){ PST.includeCopy = !!ev.target.checked; return paintPStamp(); }
  if(din === "pstSearch" && PST){ PST.q = ev.target.value; paintPStamp();
    const b = $("pst_q"); if(b){ b.focus(); b.setSelectionRange(b.value.length, b.value.length); } return; }
  if(din === "pstWhen" && PST){
    pstCollect();
    const res = $("pst_res");
    if(res){
      const w = pstWhen();
      res.innerHTML = (w.ok ? esc(vstLabel(w.ms, PST.tz)) : "&mdash;")
        + `<small>${w.ok ? "This is what will be burned into the picture"
          : esc(w.why || "Fill in the date and time")}</small>`;
    }
    return;
  }
  if(din === "svArrival" && SV && !SV.dirty){
    // The same generator the desk sheet uses, so a line composed in the car and
    // the same line composed at the office cannot read differently.
    const d = $("sv_desc");
    if(d) d.value = arrivalSentence(
      $("sv_vp") ? $("sv_vp").value : "",
      $("sv_view") ? $("sv_view").value : "",
      $("sv_place") ? $("sv_place").value : "",
      $("sv_pos") ? $("sv_pos").value : "");
    return;
  }
  if(din === "amSearch" && ACT_MODAL){ ACT_MODAL.search = ev.target.value; paintCase(); return; }
  if(din === "amDirty" && ACT_MODAL){ ACT_MODAL.dirty = true; return; }
  if(din === "amArrival" && ACT_MODAL && !ACT_MODAL.dirty){
    // The arrival template (P9): the extras generate the sentence — until the
    // narrative is hand-edited, which makes the hand the author.
    if($("qa_desc")) $("qa_desc").value = arrivalSentence(
      $("qa_vp") ? $("qa_vp").value : "",
      $("qa_view") ? $("qa_view").value : "",
      $("qa_place") ? $("qa_place").value : "",
      $("qa_pos") ? $("qa_pos").value : "");
    return;
  }
  if(ev.target.dataset && ev.target.dataset.act === "filter"){ FILTER = ev.target.value; paint(); }
  if(ev.target.dataset && ev.target.dataset.act === "invFilterStatus"){ INV_FILTER.status = ev.target.value; loadInvoices(); }
  if(ev.target.dataset && ev.target.dataset.act === "invFilterType"){ INV_FILTER.type = ev.target.value; loadInvoices(); }
  if(ev.target.dataset && ev.target.dataset.act === "invFilterQ"){ INV_FILTER.q = ev.target.value; loadInvoices(); }
  if(ev.target.dataset && ev.target.dataset.act === "evClass"){ setEvidenceClass(Number(ev.target.dataset.id), ev.target.value); }
  if(ev.target.dataset && ev.target.dataset.act === "pkgType"){ pkgApi(`/build/${PKG.build.id}/package`, {package_type: ev.target.value}); }
  if(ev.target.dataset && ev.target.dataset.act === "wizRetPick" && SHEET_WIZ){
    wizCollect(); SHEET_WIZ.retainerTouched = true; SHEET_WIZ.err = ""; paint();
  }
  if(ev.target.dataset && ev.target.dataset.act === "leadStatus"){
    const caseNo = ev.target.dataset.case, v = ev.target.value;
    api(`/leads/${encodeURIComponent(caseNo)}/status`, {method:"POST", body:{status: v}})
      .then(() => { const c = CASES.find(x => x.case_no === caseNo); if(c) c.lead_status = v;
                    LEAD_MSG = `${caseNo} — ${LEAD_LABEL[v] || v}.`; paint(); })
      .catch(e => { LEAD_MSG = e.message; paint(); });
  }
  // Saves on blur, so the admin can write the paragraph without a repaint
  // pulling the cursor out from under them mid-sentence.
  if(ev.target.dataset && ev.target.dataset.act === "pkgSummary"){ pkgApi(`/build/${PKG.build.id}/summary`, {body: ev.target.value}); }
});

/* ------------------------------------------------------------------- boot */

(async function boot(){
  const rtoken = new URLSearchParams(location.search).get("reset");
  if(rtoken){
    try{ app.innerHTML = resetView(await api("/reset/" + encodeURIComponent(rtoken))); }
    catch(e){ app.innerHTML = resetView({error: e.message}); }
    return;
  }
  const token = new URLSearchParams(location.search).get("invite");
  if(token){
    try{
      const s = await api("/invite/" + encodeURIComponent(token));
      app.innerHTML = inviteView(s);
    }catch(e){
      app.innerHTML = inviteView({error: e.message});
    }
    return;
  }
  try{
    ME = (await api("/auth/me")).user;   // resume an existing session
    /* Launched from the home screen (SURVEILLANCE P16): go straight to the
       field launcher — resume a running day, or list what could start one.
       Signing in first still lands here, because the flag survives the load. */
    if(new URLSearchParams(location.search).get("surveillance")){
      await openSurveillanceLauncher();
      return;
    }
    await render();
  }catch{ paint(); }
})();
</script>
</body>
</html>
