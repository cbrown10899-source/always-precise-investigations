          ${v.out && v.out.sourceAudio ? `<div class="vst-k"><span>Original's audio</span>
            <span>${esc(v.out.sourceAudio)} &mdash; still on your original, untouched</span></div>` : ""}
          <div class="vst-k"><span>On this device</span><span>${
            v.savedHere ? "Saved" : "Generated &mdash; not yet saved"}</span></div>
          <div class="vst-k"><span>Case</span><span>${v.caseNo ? esc(v.caseNo) : "Not attached to a case"}</span></div>
          ${v.err ? `<p class="vst-err">${esc(v.err)}</p>` : ""}
          ${v.saveMsg ? `<p class="vst-ok">${esc(v.saveMsg)}</p>` : ""}
          ${v.caseNo ? "" : `<p class="vst-note">Nothing about this copy is recorded in the portal
            while it belongs to no case. Attach it and the record is written then.</p>
            <button class="vst-btn" data-act="vstAttach">Attach it to a case</button>`}
          ${v.savedHere ? "" : `<button class="vst-btn go" data-act="vstSave">${
            (navigator.canShare && navigator.share) ? "Share or save to this device"
                                                   : "Save to this device"}</button>`}
          ${v.caseNo && v.recId ? `
            <button class="vst-btn" data-act="vstDropbox" ${v.dbxBusy || v.dbxPath ? "disabled" : ""}>${
              v.dbxPath ? "Copy saved to Dropbox"
                        : v.dbxBusy ? `Sending to Dropbox&hellip; ${v.dbxPct || 0}%`
                                    : "Also save a copy to the case Dropbox folder"}</button>
            ${v.dbxBusy ? `<button class="vst-btn" data-act="vstDropboxCancel">Cancel the Dropbox upload</button>` : ""}
            <p class="vst-note">Optional, and separate from saving to this device. The original stays
              on your device untouched either way.</p>` : ""}
          ${v.started && !v.savedHere ? `<p class="vst-note">The download has started. This page cannot see
            where your browser put it, so it will not claim the file is saved &mdash; check it landed, then
            confirm below.</p>
            <button class="vst-btn" data-act="vstSaved">I have got the file &mdash; mark it saved</button>` : ""}
          <p class="vst-note">${v.previewFailed ? "" : "Play it back above if you want to check the "
            + "clock in the bottom-right corner &mdash; it is not required. "}The copy exists only on this
            device until you save it; the portal keeps the record of it, never the video.</p>
          <button class="vst-btn" data-act="vstEditTime">Correct the time and make it again</button>
          <button class="vst-btn" data-act="vstClose">Close</button>
        </div>`;
  return `<div class="vst" role="dialog" aria-modal="true" aria-label="Video timestamp">
    <div class="vst-bar">
      <b>Video timestamp${v.caseNo ? " &middot; " + esc(v.caseNo) : ""}</b>
      ${v.step === "working" ? "" : `<button class="vst-x" data-act="vstClose">Close</button>`}
    </div>
    <div class="vst-body">${body}</div>
  </div>`;
}

function paint(){
  paintEvView();
  paintPStamp();
  paintVStamp();
  if(!ME){ app.innerHTML = loginView(); $("who").hidden = true;
    document.body.classList.remove("withnav", "navopen");
    if($("burger")) $("burger").hidden = true;
    return; }
  document.body.classList.add("withnav");
  if($("burger")) $("burger").hidden = false;
  $("who").hidden = false;
  $("who").innerHTML = `<b>${esc(ME.display_name || ME.username)}</b>${ME.role === "admin" ? "Admin" : "Investigator"}
    <button data-act="logout">Sign out</button>`;
  // Active Surveillance takes the whole screen — it is a field view, not a
  // panel inside the office one.
  if(SV && SV.tab === "launcher"){ app.innerHTML = svLauncher(); return; }
  if(SV && WS_CASE){ app.innerHTML = svView(); return; }
  if(VIEW === "case" && WS_CASE){
    // The workspace takes the whole page. The back button carries the same
    // .close class the dialog's X had, so muscle memory and tests both hold.
    app.innerHTML = `<div class="casepage">
      <div class="pagebar"><button class="btn sm ghost close" data-act="backToCases">&larr; Back to Cases</button></div>
      <div class="card"><div class="dlg" id="dlgBody">${caseBodyHtml()}</div></div>
    </div>`;
    // Typing in the sheet's search repaints; hand the cursor straight back.
    const amq = $("am_q");
    if(amq && ACT_MODAL && ACT_MODAL.search){ amq.focus(); amq.setSelectionRange(amq.value.length, amq.value.length); }
    return;
  }
  app.innerHTML = shell(
      TAB === "dashboard" ? dashView()
    : TAB === "staff" ? staffView()
    : TAB === "settings" ? settingsView()
    : TAB === "leads" ? leadsView()
    : TAB === "newlead" ? newLeadView()
    : TAB === "profiles" ? profilesView()
    : TAB === "search" ? searchView()
    : TAB === "sheets" ? sheetsView()
    : TAB === "delivery" ? deliveryView()
    : TAB === "invoices" ? invoicesView()
    : TAB === "today" ? todayView()
    : TAB === "calendar" ? calendarView()
    : TAB === "myreports" ? myReportsView()
    : TAB === "myexpenses" ? myExpensesView()
    : casesView());
  const q = $("q");
  if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  /* The directory and picker searches repaint on every keystroke, so the
     cursor has to be handed back or typing lands one character at a time in a
     box that keeps losing focus. Same treatment the case search already gets. */
  for(const id of ["prof_q", "nl_pick", "gsearch"]){
    const el = $(id);
    if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
}

/* Loading the portal used to swallow every failure and paint an empty
   dashboard, which looks exactly like a portal with no cases in it. That is the
   worst possible way to fail: a case list that cannot load and a case list with
   nothing in it are not the same thing, and the screen said the same thing for
   both. Each fetch now records why it failed, and the page says so. */
let BOOTED = false;
async function render(){
  if(!ME){ paint(); return; }
  if(!BOOTED){ BOOTED = true; if(ME.role === "admin" && TAB === "cases") TAB = "dashboard"; }
  LOAD_ERR = "";
  /* An empty list stays empty. A first sign-in used to be met with two
     fabricated cases so the table had something in it — the screen taught the
     layout and misrepresented the caseload in the same breath, and the reader
     had no way to tell which half was true. Nothing is substituted now; the
     empty state says which of the three situations it is, and LOAD_ERR is what
     keeps "could not load" from being drawn as "no work". */
  /* THE ORDINARY WORKING SET, ALWAYS, whatever lens the Cases tab is on. Every
     other view on the page reads this, so it must never be the archived query. */
  try{
    const d = await api("/submissions?limit=200");
    CASES = Array.isArray(d.submissions) ? d.submissions : [];
    TOTAL = d.total || 0;
    CASES_OK = true;
  }catch(e){
    CASES = []; TOTAL = 0; CASES_OK = false;
    LOAD_ERR = "The case list could not be loaded — " + e.message;
  }

  /* The archived and deleted lenses are a different SET, not a filter over the
     rows above: the Worker excludes those cases from every other view, so asking
     for them is a second query — and it lands in its own variable, which only
     the Cases table reads. Cleared whenever the lens is not one of them, so a
     stale archived list cannot outlive the lens that fetched it. */
  if(CASE_VIEW === "archived" || CASE_VIEW === "deleted"){
    try{
      const dq = await api("/submissions?limit=200&view=" + encodeURIComponent(CASE_VIEW));
      CASES_Q = Array.isArray(dq.submissions) ? dq.submissions : [];
      TOTAL_Q = dq.total || 0;
      CASES_Q_OK = true;
    }catch(e){
      CASES_Q = []; TOTAL_Q = 0; CASES_Q_OK = false;
      // Same rule as above: a failed load is never drawn as an empty archive.
      LOAD_ERR = "The " + CASE_VIEW + " cases could not be loaded — " + e.message;
    }
  }else{
    CASES_Q = null; TOTAL_Q = 0; CASES_Q_OK = false;
  }

  if(ME.role !== "admin"){
    try{ OFFERS = (await api("/my/offers")).offers; }catch(e){ OFFERS = []; }
  }
  try{ SUMMARY = (await api("/summary")).summary; }
  catch(e){ SUMMARY = null; if(!LOAD_ERR) LOAD_ERR = "The dashboard totals could not be loaded — " + e.message; }

  // A half-applied schema is the one failure that looks like a dozen different
  // bugs, so ask directly rather than waiting to trip over it.
  try{
    const h = await api("/health");
    SCHEMA_MISSING = Array.isArray(h.missing_tables) ? h.missing_tables : [];
  }catch(e){ SCHEMA_MISSING = []; }

  if(ME.role === "admin"){
    try{ USERS = (await api("/users")).users; }catch(e){ USERS = []; }
    try{ INVITES = (await api("/invites")).invites; }catch(e){ INVITES = []; }
    try{ SHEETS = (await api("/sheets")).sheets; }catch(e){ SHEETS = []; }
    // The dashboard is the admin's landing, so render() is a second door to
    // it — the tab click is not the only way in. Without this, the first
    // sign-in paints "Loading…" forever, because nothing ever fetches.
    // Delivery is included so the reload action can clear a failed read and
    // land back here — with dashboard-only guards, Try again on the delivery
    // tab would null PKGS and then nothing would ever fetch it: a spinner
    // that never resolves, which is the false-empty bug wearing a new face.
    if((TAB === "dashboard" || TAB === "delivery") && !PKGS) await loadPackages();
    // Recently completed reads the same route the Cases lens and Reports &
    // Packages already use. Landed on, not only clicked into, for the reason
    // directly above.
    if((TAB === "dashboard" || TAB === "delivery") && !COMPLETED) loadCompleted();
    if(TAB === "dashboard" && ME.role === "admin" && !RECENT && !RECENT_ERR) loadRecent();
    /* The exception list, fetched on arrival like everything else the
       dashboard draws — and refetched, because a stale queue is a wrong next
       action rather than an old number. */
    if(TAB === "dashboard" && ME.role === "admin") await loadAttention();
    /* The directory, landed on rather than only clicked into — the same rule,
       and the same reason: a tab reached by reload must still fetch.

       And it refetches EVERY time the list is what is being shown, not only
       when it has never loaded. Guarding on "never loaded" left a stale list
       behind: save a firm from a case, come back to the directory, and it
       still showed the set fetched before the firm existed — the screen whose
       whole job is answering "who do we already work for" quietly answering
       it wrong. One indexed read, the same as the case list does. */
    if(TAB === "profiles" && !PROF_OPEN && !PROF_FORM) await loadProfiles();
    // Same rule for who-is-out: landed on, not only clicked into.
    try{ OUT_NOW = await api("/active"); }catch(e){ OUT_NOW = null; }
  }
  paint();
}

/* --------------------------------------------------------------- actions */

async function doLogin(){
  const btn = $("loginBtn"), err = $("err");
  btn.disabled = true; btn.textContent = "Signing in…"; err.textContent = "";
  try{
    ME = (await api("/auth/login", {method:"POST", body:{username:$("u").value, password:$("p").value}})).user;
    /* Launched from the home-screen shortcut with no session yet: the flag has
       to survive the sign-in, or a freshly installed app drops you in the
       office portal instead of the field. boot() only sees the flag when a
       session already exists, which is the second time onwards. */
    if(new URLSearchParams(location.search).get("surveillance")) return openSurveillanceLauncher();
    await render();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

async function doAccept(token){
  const btn = $("acceptBtn"), err = $("err");
  err.textContent = "";
  if($("p1").value !== $("p2").value){ err.textContent = "Those passwords do not match."; return; }
  btn.disabled = true; btn.textContent = "Creating…";
  try{
    ME = (await api(`/invite/${token}/accept`, {method:"POST", body:{password:$("p1").value}})).user;
    history.replaceState({}, "", "/portal/");   // keep the token out of the address bar
    await render();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = "Create my account";
  }
}

/* A SESSION BOUNDARY IS A HARDER RESET THAN A CASE CHANGE.

   Everything cleared here is page-level state about ONE signed-in person's
   work, and none of it may survive into whoever signs in next. On a shared
   machine it did: the case they had open, the workspace rows the Worker served
   THEM, and any unfinished payment all persisted, so the next sign-in landed
   straight back in the previous user's case drawn from the previous user's
   data. An investigator signing in after an admin would be looking at the
   client name and claim number that `redactRow` exists to withhold — the
   boundary is enforced in the Worker, but this page was still holding the
   answer it had already been given. */
function sessionForget(){
  ME = null; TAB = "cases"; FILTER = ""; TOTAL = 0;
  /* Everything the Worker answered for THAT person. The case list carries
     client names and carriers; USERS and INVITES are admin-only; LAST_LINK and
     RESET_BOX are a live invitation and a live password-reset URL. */
  CASES = []; USERS = []; INVITES = []; PKGS = null; OUT_NOW = null;
  // The archived/deleted set is case data too, and its lens is a view choice
  // that should not follow one person's session into the next one.
  CASES_Q = null; TOTAL_Q = 0; CASES_Q_OK = false; CASE_VIEW = "all";
  /* PHASE 8, owner 2026-08-17: recently viewed AND pinned both clear here.
     This is a shared-office desktop, and leaving the last person's pinned cases
     on screen for whoever signs in next is exactly what the decision ruled out.
     If per-user server-side preferences are built later, favourites may persist
     for that user — that is a different feature and is not this one. */
  clearCaseMemory();
  // The two "did this read succeed" flags go with the data they describe: a
  // stale true would let the next person's dashboard vouch for a read that
  // happened in someone else's session.
  PKGS_OK = false; CASES_OK = false;
  LAST_LINK = ""; LAST_EMAILED = false; RESET_BOX = null;
  PAYCFG = null; PAY_DRAFT = {}; PAY_MSG = ""; PAY_ERR = false;
  SUMMARY = null; SHEETS = []; SHEET_MAIL = ""; OPEN_SHEET = null; SHEET_MSG = ""; SHEET_WIZ = null;
  NL = null; LEAD_SEND = null; LEAD_MSG = ""; PAY_SEND = null;
  SRCH = { q: "", results: null, err: "", busy: false, hi: -1 };
  ATTN = null; ATTN_OK = false; ATTN_ERR = ""; ATTN_FILTER = "all";
  PROF = null; PROF_OK = false; PROF_ERR = ""; PROF_SETUP = false; PROF_MSG = "";
  PROF_Q = ""; PROF_KIND = ""; PROF_INACTIVE = false;
  PROF_OPEN = null; PROF_FORM = null; PROF_CONTACT = null;
  INTAKE_SEND = null; SEND_MSG = ""; SENDS = null; SENDS_ERR = "";
  INVOICES = null; INV_OPEN = null; INV_MSG = ""; INV_WARN = []; INV_EVENTS = [];
  INV_SETTINGS = null; INV_FILTER = {status: "", type: "", q: ""};
  retainerReset(); RET_CASE = null;
  WS = null; WS_CASE = null; WS_TAB = "overview"; WS_ERR = ""; WS_REPORT = null;
  WS_NOTICE = ""; ACT_MODAL = null; REP_VIEW = "preview"; REP_VERS = {}; EV_TAB = "all";
  VIEW = "list"; SV = null; SV_SKEW = 0; svTickStop();
  document.body.classList.remove("surv");
}

async function doLogout(){
  try{ await api("/auth/logout", {method:"POST"}); }catch{}
  /* The whole clear-down, and nothing beside it. A second list here is how the
     expiry path came to clear less than this one did: sessionForget() held the
     workspace while doLogout held the case list, so a session that TIMED OUT
     left an admin's cases, invitations and reset links sitting in the page for
     whoever signed in next. One owner, both boundaries. */
  sessionForget(); paint();
}

/* The case workspace. A case is not a record to read, it is work in progress,
   so opening one lands on tabs rather than one long detail list. Only the tabs
   that do something today are shown — an empty "Evidence" tab would promise a
   feature that is not there. */
async function openCase(caseNo, tab){
  WS_CASE = caseNo; WS_TAB = tab || "overview"; WS_ERR = ""; SUBJ_FORM = null; ACT_MODAL = null; VIEW = "case";
  REP_VIEW = "preview"; REP_VERS = {}; EV_TAB = "all";
  /* Unit 11: integrity answers and the manifest belong to the case they were
     read on — carried to the next case they would state another file's facts. */
  EV_VERIFY = {}; EV_IBUSY = 0; MAN = null; MAN_OPEN = false; MAN_ERR = ""; MAN_BUSY = false;
  /* Unit 12: a daily-summary draft belongs to the case whose day it narrates —
     carried to the next case it would offer one case's paragraph for another
     case's day. Day ids are global, so this is a correctness reset, not tidying. */
  DS_DRAFT = {};
  /* THE RETAINER FORM BELONGS TO THE CASE IT WAS OPENED ON. All of its state is
     page-level, so without this an unfinished payment followed the admin to the
     next case: the form still open, still carrying the FIGURE they typed for
     someone else, and still holding the first case's idempotency token. A
     prefilled amount on another client's retainer is the kind of mistake that
     is only found when the money is reconciled. */
  retainerEnter(caseNo);
  try{
    const [sub, ws] = await Promise.all([
      api("/submissions/" + encodeURIComponent(caseNo)),
      api("/cases/" + encodeURIComponent(caseNo) + "/workspace"),
    ]);
    WS = { ...ws, submission: sub.submission };
  }catch(e){ alert(e.message); return; }
  /* PHASE 8 — recorded HERE, after both reads came back, so "recently viewed"
     means a case this user was actually allowed to open. A refusal returns
     above this line and leaves no trace of the case number. */
  recentPush(caseNo);
  /* The Dropbox connection is the FIRM'S, not the case's, so this is fetched
     once and reused: an admin opening ten cases makes one request. `loadDropbox`
     returns immediately for an investigator, who is refused the route anyway.

     A FAILED CHECK IS RETRIED on the next case, deliberately. Skipping on
     `DBX_ERR` would let one dropped request remove the folder links for the
     rest of the session with nothing on the case screen to explain it — the
     absence of a link says nothing, which is exactly what makes it worth
     retrying rather than remembering. */
  if(!DBX) loadDropbox();
  // Landing straight on the Package panel (the dashboard's Build jump) needs
  // the build fetched, exactly as the tab click would have done.
  if(WS_TAB === "package"){ PKG = null; return loadPackage(); }
  if(WS_TAB === "timeline"){ paintCase(); return loadTimeline(); }
  paintCase();
}

async function reloadWorkspace(){
  if(!WS_CASE) return;
  try{
    const ws = await api("/cases/" + encodeURIComponent(WS_CASE) + "/workspace");
    WS = { ...ws, submission: WS ? WS.submission : null };
  }catch(e){ WS_ERR = e.message; }
  paintCase();
}

/* UIBUILD P6 — the case page navigates in four sections, with the panels as
   sub-tabs inside them. WS_TAB stays the single routing key (openCase, the
   dashboard's pkgJump and every in-panel jump keep working unchanged); the
   active section is DERIVED from it, never stored, so the two cannot drift.
   An investigator's four sections are their own — nothing administrative. */
function wsSections(){
  /* The 4th element is the bottom-bar label (UIBUILD P15) — the same four
     sections, phone-width words. The 5th is its icon: a word in small caps is
     not something you recognise at a glance in a car, which is what the owner
     hit on 2026-08-14. The glyphs match .sv-nav wherever the label does, so
     the field bar and the case bar read as one system rather than two. */
  if(ME.role === "admin"){
    return [
      ["overview",  "Overview",          [["overview","Overview"], ["details","Intake details"], ["subject","Subject"]], "Home", "&#8962;"],
      ["fieldwork", "Fieldwork",         [["field","Field work"], ["activity","Activity log"],
                                          /* UNIT 10 — the chronology of the whole case, beside the
                                             log it is mostly made of. Both roles carry it; what is
                                             IN it is decided in the Worker. */
                                          ["timeline","Timeline"]], "Field", "&#128065;"],
      ["repev",     "Report & Media",    [["reports","Reports"], ["evidence","Case media"], ["package","Package"]], "Report", "&#128196;"],
      ["admin",     "Admin",             [["edit","Edit case"], ["assign","Assignment"],
                                          /* Unit 6: only a legal case carries the firm/matter panel —
                                             a tab that exists with nothing behind it is a dead door. */
                                          ...(WS && WS.legal ? [["legal","Legal"]] : []),
                                          ["auth","Authorization"], ["expenses","Expenses"],
                                          ["notes","Internal notes"], ["comms","Comm log"], ["tasks","Tasks"],
                                          ["billing","Billing & closing"]], "Admin", "&#9881;"],
    ];
  }
  const assignment = [["overview","Overview"], ["subject","Subject"], ["tasks","Tasks"],
                      ["comms","Comm log"], ["notes","Internal notes"]];
  // The authorization view joins the assignment context once hours are set —
  // an investigator works to a cap they can see, and nothing about money.
  if(WS && WS.authorization && WS.authorization.authorized_hours != null) assignment.push(["auth","Authorization"]);
  return [
    ["assignment", "Assignment", assignment, "Home", "&#8962;"],
    ["activity",   "Activity",   [["field","Field work"], ["activity","Activity log"],
                                   ["timeline","Timeline"], ["expenses","Expenses"]], "Activity", "&#9998;"],
    ["evidence",   "Case media", [["evidence","Case media"]], "Media", "&#128247;"],
    ["report",     "Report",     [["reports","Reports"]], "Report", "&#128196;"],
  ];
}
function wsSectionFor(tab){
  const secs = wsSections();
  return secs.find(s => s[2].some(t => t[0] === tab)) || secs[0];
}

function authPanel(a, admin){
  if(!a) return "";
  const bar = (used, total, pct, level) => {
    if(total == null) return "";
    const w = Math.max(0, Math.min(100, pct || 0));
    const tone = level >= 100 ? "over" : level >= 90 ? "high" : level >= 75 ? "warn" : "";
    return `<div class="meter ${tone}"><i style="width:${w}%"></i></div>`;
  };
  const hoursSet = a.authorized_hours != null;
  return `<div class="feebox">
    ${hoursSet ? `
      <div class="row"><span>Confirmed authorization</span><b>${esc(a.authorized_hours)} hours</b></div>
      <div class="row"><span>Used</span><b>${esc(a.hours_used)} hours</b></div>
      <div class="row"><span>Remaining</span><b>${esc(a.hours_remaining)} hours</b></div>
      ${bar(a.hours_used, a.authorized_hours, a.percent_used, a.warn_level)}
      ${a.warn_level != null ? `<div class="warnline ${a.warn_level >= 100 ? "over" : ""}">
         ${a.warn_level >= 100
           ? "<b>Authorization is used up.</b> Request more before any further work."
           : `<b>${esc(a.percent_used)}% of the authorization is used.</b> Past the ${esc(a.warn_level)}% mark.`}
       </div>` : ""}`
      : (((WS && WS.submission && WS.submission.payload) || {}).authorized_hours_status === "pending"
          ? `<div class="row"><span>Authorized hours</span><b>Authorization pending</b></div>
             <div class="warnline"><b>The carrier submitted this assignment with authorization pending.</b>
               Confirm the hours with them before any billable field work starts.</div>`
          : `<div class="row"><span>Authorized hours</span><span>Not set</span></div>`)}
    ${admin && a.package_price != null ? `
      <div class="row"><span>Authorized package</span><b>$${esc(a.package_price.toLocaleString())} &middot; ${esc(a.package_label)}</b></div>` : ""}
    ${admin && a.authorized_budget != null ? `
      <div class="row" style="border-top:1px solid #cfe6ec;margin-top:8px;padding-top:8px">
        <span>Authorized budget</span><b>$${esc(a.authorized_budget.toLocaleString())}</b></div>
      <div class="row"><span>Billable so far</span><b>$${esc(a.billable_so_far.toLocaleString())}</b></div>
      <div class="row"><span>Remaining</span><b>$${esc(a.budget_remaining.toLocaleString())}</b></div>
      <div class="row"><span style="color:var(--muted);font-size:.82rem">Billed at $${esc(a.billed_at_rate)}/hr</span><span></span></div>` : ""}
    ${admin && a.retainer ? `
      <div class="row" style="border-top:1px solid #cfe6ec;margin-top:8px;padding-top:8px">
        <span>Original retainer</span><b>$${esc(a.retainer.amount.toLocaleString())}</b></div>
      <div class="row"><span>Status</span>${a.retainer.received
        ? `<span class="tag closed">Retainer received</span>`
        : `<span class="tag rs-needs_revision">Retainer pending</span>`}</div>
      <div class="row"><span>Applied so far</span><b>$${esc(a.retainer.applied.toLocaleString())}</b></div>
      <div class="row"><span>Remaining retainer</span><b>$${esc(a.retainer.remaining.toLocaleString())}</b></div>
      ${a.retainer.approx_hours_remaining != null ? `<div class="row">
        <span style="color:var(--muted);font-size:.82rem">&asymp; ${esc(a.retainer.approx_hours_remaining)} hours at this case's rate</span><span></span></div>` : ""}
      ${retainerReceiptHtml(a.retainer)}` : ""}
    ${a.miles_total ? `<div class="row"><span>Miles logged</span><span>${esc(a.miles_total)}</span></div>` : ""}
  </div>`;
}

/* RETAINER PENDING → RECORD PAYMENT (PAYMENTS.md §5/§11).

   A private case sits at Retainer pending until an admin records the money.
   Sending payment instructions never moves it — the Worker keeps the two in
   separate tables so that cannot happen by accident, and this screen says so
   in as many words, because the confirmation after a send is exactly where
   someone would assume otherwise.

   The details are optional. An admin who knows the money landed can say so
   while still hunting for the transaction note; what they DO enter is
   validated by the Worker, and its message is shown rather than paraphrased.

   Credit card and Other are absent by owner correction, 2026-08-15: the firm
   does not accept them, and a method it cannot take would push the failure
   onto the client mid-retainer. */
const RETAINER_METHOD_OPTIONS = [
  ["cash_app", "Cash App"], ["venmo", "Venmo"], ["check", "Check"],
  ["cash", "Cash"], ["ach_bill", "ACH / BILL"],
];

/* `payment_send.methods` is the comma-separated ids that actually went out, and
   §10 wants them read back as "Cash App + Venmo". The two ids a payment send can
   carry are already named above, so this reads the labels from there rather than
   keeping a second copy that could disagree about what Venmo is called. An id
   nobody has a label for is dropped rather than printed raw — the office reading
   "cash_app" learns nothing the line did not already say. */
function payMethodLabels(csv){
  const by = Object.fromEntries(RETAINER_METHOD_OPTIONS);
  return String(csv || "").split(",").map(s => by[s.trim()]).filter(Boolean).join(" + ");
}

function retainerReceiptHtml(r){
  /* AGREED / RECEIVED / OUTSTANDING are the owner's three figures, and
     OUTSTANDING is what the client still owes. `remaining` above it is a
     different number — the retainer the recorded work has not yet consumed —
     and the owner was explicit that the unpaid balance must not borrow that
     word. Both appear on this panel, so they are labelled apart. */
  const paid = (r.payments || []).filter(p => !p.voided);
  const voided = (r.payments || []).filter(p => p.voided);
  const money = n => "$" + esc(Number(n).toLocaleString());
  if(paid.length || voided.length){
    return `<div class="row" style="border-top:1px dashed #cfe6ec;margin-top:6px;padding-top:6px">
        <span>Received</span><b>${money(r.received_total || 0)}</b></div>
      <div class="row"><span>Outstanding</span><b${r.outstanding > 0 ? ` style="color:var(--bad)"` : ""}>${
        money(r.outstanding || 0)}</b></div>
      ${paid.map(p => `<div class="row"><span style="font-size:.85rem">${money(p.amount)}${
        p.method_label ? " &middot; " + esc(p.method_label) : ""}${
        p.paid_on ? " &middot; " + esc(fmtDay(p.paid_on)) : ""}${
        p.reference ? `<div style="color:var(--muted);font-size:.8rem">${esc(p.reference)}</div>` : ""}
        <div style="color:var(--muted);font-size:.78rem">Recorded by ${esc(p.recorded_by || "the office")}${
        p.recorded_at ? " &middot; " + when(p.recorded_at) : ""}</div></span>
        <button class="btn sm ghost" data-act="retVoid" data-id="${esc(String(p.id))}">Void</button></div>`).join("")}
      ${voided.map(p => `<div class="row"><span style="font-size:.85rem;text-decoration:line-through;color:var(--muted)">${
        money(p.amount)}${p.method_label ? " &middot; " + esc(p.method_label) : ""}</span>
        <span style="color:var(--muted);font-size:.78rem">Voided${p.voided_by ? " by " + esc(p.voided_by) : ""}${
        p.void_reason ? " &middot; " + esc(p.void_reason) : ""}</span></div>`).join("")}
      <div class="actions"><button class="btn sm" data-act="retOpen">Record another payment</button></div>
      <p class="hint">A payment recorded in error is voided, never deleted &mdash; the record keeps
        what was believed at the time and who corrected it.</p>
      ${RET_FORM ? retainerFormHtml(r) : ""}
      ${RET_MSG ? `<div class="${RET_ERR ? "err" : "linkbox"}">${esc(RET_MSG)}</div>` : ""}`;
  }
  return `${RET_FORM ? retainerFormHtml(r)
    : `<div class="actions"><button class="btn sm" data-act="retOpen">Record payment</button></div>
      <p class="hint">The retainer stays pending until a payment is recorded here. Sending payment
        instructions does not mark it paid.</p>`}
    ${RET_MSG ? `<div class="${RET_ERR ? "err" : "linkbox"}">${esc(RET_MSG)}</div>` : ""}`;
}

function retainerFormHtml(r){
  return `<div style="border-top:1px dashed #cfe6ec;margin-top:6px;padding-top:8px">
    <label class="f"><span>Amount received</span>
      <input id="ret_amt" inputmode="decimal" placeholder="${esc(String(r.amount))}"
        value="${esc(RET_DRAFT.amt || "")}"></label>
    <label class="f"><span>Payment method <span class="opt">optional</span></span>
      <select id="ret_method"><option value="">&mdash;</option>${RETAINER_METHOD_OPTIONS
        .map(([v, l]) => `<option value="${v}"${RET_DRAFT.meth === v ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    <div class="two">
      <label class="f"><span>Payment date <span class="opt">when the client paid</span></span>
        <input id="ret_date" type="date" value="${esc(RET_DRAFT.date || "")}"></label>
      <label class="f"><span>Reference <span class="opt">optional</span></span>
        <input id="ret_ref" placeholder="e.g. cheque 1041, or the app's note"
          value="${esc(RET_DRAFT.ref || "")}"></label>
    </div>
    <div class="actions">
      <button class="btn sm" data-act="retSave">Record payment</button>
      <button class="btn sm ghost" data-act="retCancel">Cancel</button>
    </div>
    <p class="hint">Only the amount is needed &mdash; record it now and fill in the method and
      reference when you have them.</p>
    ${RET_MSG ? `<div class="${RET_ERR ? "err" : "linkbox"}">${esc(RET_MSG)}</div>` : ""}
    ${RET_STUCK ? `<div class="actions">
      <button class="btn sm" data-act="retNewAttempt">Start a new attempt</button>
    </div>` : ""}
  </div>`;
}

/* RECORD PAYMENT WHERE THE MONEY IS ALREADY SHOWN (owner, WORKFLOW-SIMPLIFICATION
   §1 — "Make Record Payment easy to reach").

   The control existed only inside the retainer block on Admin &rarr; Authorization,
   which is a section group and a tab deep: Cases, the case, Admin, Authorization,
   then scroll. Overview had been showing Retainer and Balance the whole time and
   offered no way to act on them, and no pointer to where you could.

   THIS IS THE SAME CONTROL, not a second one. Same `retOpen` action, same
   `retainerFormHtml`, same `RET_*` state, same route — so a payment started here
   and a payment started on Authorization are the one flow, including the
   idempotency token and the indeterminate-attempt escape. Nothing about
   recording a payment changes; only where it can be started.

   Money stays admin-only on both sides: `overviewPanel` is reached only on the
   admin branch of the panel dispatch, and `authorizationFor` puts `retainer` in
   the payload only `if (forAdmin)`. The role check here is the third, because a
   control that spends money should not rely on a caller staying admin-only. */
function ovRecordPaymentHtml(r){
  if(ME.role !== "admin" || !r) return "";
  return `<div class="ov-row"><span>Payment</span>
      <button class="btn sm" data-act="retOpen">Record payment</button></div>
    ${RET_FORM ? retainerFormHtml(r) : ""}
    ${!RET_FORM && RET_MSG ? `<div class="${RET_ERR ? "err" : "linkbox"}">${esc(RET_MSG)}</div>` : ""}`;
}

/* The activity panel is the TIMELINE (UIBUILD P10): the day's story first,
   with one prominent + Add activity that opens the sheet. The form no longer
   sits on the page. */
/* =========================================================================
   UNIT 10 — THE CASE TIMELINE (owner brief, 2026-08-20)

   "OPEN CASE -> TIMELINE -> SEE WHAT HAPPENED IN ORDER -> FILTER IF NEEDED ->
   OPEN THE UNDERLYING ITEM." So this panel is chronology and navigation, and
   it edits nothing: every row's action goes to the screen the record actually
   lives on, which is where editing already works.

   THE WORKER COMPOSES THE WORDS AND THE CLOCK. Dates, times and the EST/EDT
   label arrive as strings because the case is worked in Virginia and a laptop
   set to another zone must not draw an 8:15 PM observation at 5:15 PM while
   the report beside it says otherwise. One writer, as everywhere else here. */

let TL = null;           // the loaded payload — null means NEVER LOADED
let TL_ERR = "";         // why it did not load — never drawn as an empty case
let TL_CASE = "";        // which case TL belongs to
let TL_CAT = "all";      // the category chip
let TL_RANGE = "all";    // all | today | 7 | custom
let TL_FROM = "", TL_TO = "";
let TL_ORDER = "desc";   // newest first by default
let TL_LIMIT = 0;        // 0 = the Worker's own page size
let TL_BUSY = false;

/* Category chips. Only the ones with something behind them are drawn, so an
   investigator sees no Payments chip and a case with no court dates has no
   Dates chip — a filter that is always empty stops being read. */
const TL_CATS = [
  ["activity", "Activity", "&#9998;"],
  ["media",    "Media",    "&#128247;"],
  ["reports",  "Reports",  "&#128196;"],
  ["payments", "Payments", "&#128179;"],
  ["case",     "Case",     "&#8962;"],
  ["package",  "Package",  "&#128230;"],
  ["legal",    "Dates",    "&#128197;"],
];
const TL_CAT_LABEL = Object.fromEntries(TL_CATS.map(c => [c[0], c[1]]));

/* One glyph per event type. Restrained on purpose and text-only — no image
   asset ships for this, and the badge carries the WORD as well as the mark so
   it does not depend on recognising a shape. */
const TL_ICON = {
  case_created: "&#8962;", assigned: "&#128100;", status: "&#9873;",
  archived: "&#128230;", deleted: "&#128465;",
  day_start: "&#9654;", day_end: "&#9632;", activity: "&#9998;",
  photo: "&#128247;", video: "&#127909;", photo_stamp: "&#128247;", video_stamp: "&#127909;",
  report_created: "&#128196;", report_status: "&#128196;",
  payment: "&#128179;", payment_void: "&#128179;",
  invoice: "&#129534;", invoice_status: "&#129534;",
  package: "&#128230;", legal_date: "&#128197;",
};
/* The state chip's word. `label()` is the page's general map and covers the
   case stages; a report status, a package action and an invoice transition are
   its own vocabulary, and a chip reading "needs_revision" is a database column
   showing through. */
const TL_STATE_WORD = { draft: "Draft", submitted: "Submitted", needs_revision: "Needs revision",
  approved: "Approved", delivered: "Delivered", void: "Void", voided: "Voided",
  finalized: "Finalized", reopened: "Reopened", created: "Started", ready: "Ready",
  paid: "Paid", partially_paid: "Part paid", sent_to_bill: "Sent to BILL",
  sent_to_client: "Sent to client" };
const tlState = s => TL_STATE_WORD[s] || label(s);

const TL_TYPE_WORD = {
  case_created: "Case", assigned: "Assignment", status: "Case",
  archived: "Case", deleted: "Case",
  day_start: "Day", day_end: "Day", activity: "Observation",
  photo: "Photo", video: "Video", photo_stamp: "Photo", video_stamp: "Video",
  report_created: "Report", report_status: "Report",
  payment: "Payment", payment_void: "Payment",
  invoice: "Invoice", invoice_status: "Invoice",
  package: "Package", legal_date: "Legal date",
};

function tlQuery(){
  const p = [];
  if(TL_ORDER === "asc") p.push("order=asc");
  if(TL_LIMIT) p.push("limit=" + TL_LIMIT);
  const r = tlRangeDays();
  if(r.from) p.push("from=" + r.from);
  if(r.to) p.push("to=" + r.to);
  return p.length ? "?" + p.join("&") : "";
}

/* The range, as two calendar days. `ymdLocal` is what the rest of the page
   already means by "today" — the day where the person is standing — so Today
   and Last 7 days agree with the day an entry was filed under. */
function tlRangeDays(){
  if(TL_RANGE === "custom") return { from: TL_FROM || "", to: TL_TO || "" };
  if(TL_RANGE === "all") return { from: "", to: "" };
  const days = TL_RANGE === "today" ? 0 : 6;
  const start = new Date(); start.setDate(start.getDate() - days);
  return { from: ymdLocal(start), to: ymdLocal(new Date()) };
}

async function loadTimeline(force){
  if(!WS_CASE) return;
  /* A CASE CHANGE INVALIDATES IT. Everything here is page-level state, so
     without this the previous case's chronology would draw under the new case's
     header for as long as the fetch took — and, on a failure, permanently. */
  if(TL_CASE !== WS_CASE){ TL = null; TL_ERR = ""; TL_CASE = WS_CASE;
    TL_CAT = "all"; TL_RANGE = "all"; TL_FROM = ""; TL_TO = ""; TL_LIMIT = 0; }
  if(TL && !force) return;
  TL_BUSY = true;
  if(TL) paintCase();          // show the re-read before waiting on it
  try{
    TL = await api("/cases/" + encodeURIComponent(WS_CASE) + "/timeline" + tlQuery());
    TL_ERR = "";
  }catch(e){
    /* THREE STATES, KEPT APART. A failed read must never draw as "nothing has
       happened on this case" — the same rule loadSends was rewritten for, and
       the one this portal has already been bitten by. */
    TL = null; TL_ERR = e.message || "The timeline did not load.";
  }
  TL_BUSY = false;
  paintCase();
}

function tlEvents(){
  if(!TL) return [];
  return TL_CAT === "all" ? (TL.events || [])
                          : (TL.events || []).filter(e => e.category === TL_CAT);
}

/* 24-hour to the way people read it, through the same `t12` the activity log
   and the reports already use. A date-only record shows a dash and says so on
   hover rather than being given a time it does not have. */
function tlClock(e){
  return e.time
    ? `<span class="tl2-h">${esc(t12(e.time))}</span><span class="tl2-z">${esc(e.tz || "")}</span>`
    : `<span class="tl2-h tl2-allday" title="This record carries a date and no time">&mdash;</span>
       <span class="tl2-z">all day</span>`;
}

function tlEventHtml(e){
  const cat = esc(e.category || "case");
  const src = (e.link && e.link.tab) || "";
  const go = src
    ? `<button class="tl2-go" data-act="tlGo" data-tab="${esc(src)}"${
        e.link.id != null ? ` data-id="${esc(String(e.link.id))}"` : ""
      } data-type="${esc(e.type)}">${esc(TL_GO_WORD[src] || "Open")}</button>` : "";
  return `<li class="tl2-i${e.removed ? " off" : ""}">
    <div class="tl2-when">${tlClock(e)}</div>
    <div class="tl2-line" aria-hidden="true"><i class="tl2-dot c-${cat}">${TL_ICON[e.type] || "&bull;"}</i></div>
    <div class="tl2-body">
      <div class="tl2-head">
        <span class="tl2-kind c-${cat}">${esc(TL_TYPE_WORD[e.type] || e.type)}</span>
        ${e.status ? `<span class="tl2-state">${esc(tlState(e.status))}</span>` : ""}
        ${e.source === "voice" ? `<span class="tl2-state">Voice</span>` : ""}
        ${e.edited ? `<span class="tl2-state">Edited</span>` : ""}
      </div>
      <div class="tl2-t">${esc(e.title || "")}</div>
      ${e.detail ? `<div class="tl2-d">${esc(e.detail)}</div>` : ""}
      ${(e.attached || []).length ? `<div class="tl2-att">
        <span class="tl2-attl">Attached evidence</span>
        ${e.attached.map(a => `<button class="tl2-file" data-act="tlGo" data-tab="evidence"
          data-id="${esc(String(a.id))}" data-type="${esc(a.kind)}"
          >${a.kind === "video" ? "&#127909;" : "&#128247;"} ${esc(a.filename)}</button>`).join("")}
      </div>` : ""}
      <div class="tl2-m">
        ${e.who ? `<span>${esc(e.who)}</span>` : ""}
        ${e.recorded_date ? `<span title="This was recorded after the fact">recorded ${
          esc(fmtDay(e.recorded_date))}${e.recorded_time ? " " + esc(t12(e.recorded_time)) : ""}</span>` : ""}
        ${e.removed && e.removed_by ? `<span>removed by ${esc(e.removed_by)}</span>` : ""}
        ${go}
      </div>
    </div>
  </li>`;
}

/* Which word the action button uses. The tab is where the record lives; the
   word is what an operator calls that screen. */
const TL_GO_WORD = { activity: "Open activity", evidence: "Open media",
  reports: "Open report", billing: "Open billing", invoices: "Open invoice",
  package: "Open package", legal: "Open case details", assign: "Open assignment",
  field: "Open field work", overview: "Open case" };

function tlHeadHtml(){
  const c = (TL && TL.context) || {};
  const bits = [];
  if(c.subject) bits.push(["Subject", c.subject]);
  if(c.client) bits.push([c.kind === "claims" ? "Carrier" : "Client", c.client]);
  if(c.claim_number) bits.push(["Claim", c.claim_number]);
  if(c.investigator) bits.push(["Investigator", c.investigator]);
  if(c.span) bits.push(["Covers", fmtDay(c.span.from) + " – " + fmtDay(c.span.to)]);
  /* NOT A SECOND CASE HEADER. The case number and status are three lines above
     this panel already; what is repeated here is only what a chronology needs
     to be read on its own — and on paper, where the header is not. */
  return `<div class="tl2-ctx">
    <div class="tl2-ctxn"><b>${esc(TL ? TL.case_no : WS_CASE)}</b>
      ${c.stage ? `<span class="tag ${esc(c.stage)}">${esc(label(c.stage))}</span>` : ""}</div>
    ${bits.map(([k, v]) => `<div class="tl2-ctxb"><span>${esc(k)}</span>${esc(v)}</div>`).join("")}
  </div>`;
}

function tlFiltersHtml(){
  const counts = (TL && TL.counts) || {};
  const total = (TL && TL.total) || 0;
  const chips = TL_CATS.filter(([k]) => counts[k]);
  const r = tlRangeDays();
  return `<div class="tl2-bar">
    <div class="lensrow tl2-chips" role="group" aria-label="Filter the timeline">
      <button class="lens ${TL_CAT === "all" ? "on" : ""}" data-act="tlCat" data-c="all"${
        TL_CAT === "all" ? ' aria-current="true"' : ""}>All <b>${total}</b></button>
      ${chips.map(([k, lbl, icon]) => `<button class="lens ${TL_CAT === k ? "on" : ""}"
        data-act="tlCat" data-c="${k}"${TL_CAT === k ? ' aria-current="true"' : ""}
        ><span aria-hidden="true">${icon}</span> ${esc(lbl)} <b>${counts[k]}</b></button>`).join("")}
    </div>
    <div class="lensrow tl2-chips" role="group" aria-label="Date range and order">
      ${[["all", "All time"], ["today", "Today"], ["7", "Last 7 days"], ["custom", "Dates…"]]
        .map(([k, lbl]) => `<button class="lens ${TL_RANGE === k ? "on" : ""}" data-act="tlRange"
          data-r="${k}"${TL_RANGE === k ? ' aria-current="true"' : ""}>${esc(lbl)}</button>`).join("")}
      <span class="tl2-sep" aria-hidden="true"></span>
      ${[["desc", "Newest first"], ["asc", "Oldest first"]].map(([k, lbl]) =>
        `<button class="lens ${TL_ORDER === k ? "on" : ""}" data-act="tlOrder" data-o="${k}"${
          TL_ORDER === k ? ' aria-current="true"' : ""}>${esc(lbl)}</button>`).join("")}
    </div>
    ${TL_RANGE === "custom" ? `<div class="tl2-dates">
      <label class="f"><span>From</span><input type="date" id="tl_from" value="${esc(TL_FROM)}"></label>
      <label class="f"><span>To</span><input type="date" id="tl_to" value="${esc(TL_TO)}"></label>
      <button class="btn sm" data-act="tlDates">Apply</button>
      ${TL_FROM || TL_TO ? `<button class="btn sm ghost" data-act="tlRange" data-r="all">Clear</button>` : ""}
    </div>` : r.from ? `<div class="tl2-note">Showing ${esc(fmtDay(r.from))} to ${esc(fmtDay(r.to))}.</div>` : ""}
  </div>`;
}

/* WHAT IS ON SCREEN AGAINST WHAT EXISTS. Three numbers can differ — the rows
   the chip left, the events this request returned, and how many the case has —
   and saying "12 of 150" when 150 are not on screen either is the kind of
   half-true count that stops being read. Each case is spelled out. */
function tlCountText(rows, shown, total){
  const partial = total > shown;
  if(TL_CAT === "all"){
    return partial ? `${shown} of ${total} events`
                   : `${shown} event${shown === 1 ? "" : "s"}`;
  }
  const cat = TL_CAT_LABEL[TL_CAT] || TL_CAT;
  return partial ? `${rows} ${cat} in the ${shown} loaded — ${total} events in all`
                 : `${rows} ${cat} of ${shown} events`;
}

function timelinePanel(){
  /* NEVER LOADED, LOADED AND EMPTY, AND FAILED are three different answers and
     the failure is checked FIRST. A timeline that draws as a quiet case when
     the read fell over is the reassuring direction to be wrong in, which is
     the one this portal has already paid for once. */
  if(TL_ERR) return `<div class="card">
    <div class="bar"><h2 style="margin:0">Timeline</h2>
      <span class="tag rs-needs_revision">Did not load</span></div>
    <div class="err">${esc(TL_ERR)}</div>
    <p class="hint">This is <b>not</b> the same as nothing having happened. The chronology could
      not be read, so what is on this case is unknown from here.</p>
    <div class="actions"><button class="btn sm ghost" data-act="tlRetry">Try again</button></div>
  </div>`;
  if(!TL) return `<div class="empty">Reading the case&hellip;</div>`;
  /* A RANGE OR ORDER CHANGE RE-READS. Without something on screen saying so,
     the beat between the click and the answer reads as a control that did
     nothing — which is how the office learns to press it twice. */
  const busy = TL_BUSY;

  const rows = tlEvents();
  const shown = (TL.events || []).length;
  const more = (TL.total || 0) > shown;
  const days = [];
  for(const e of rows){
    if(!days.length || days[days.length - 1].d !== e.date) days.push({ d: e.date, list: [] });
    days[days.length - 1].list.push(e);
  }

  return `<div class="tl2-wrap${busy ? " busy" : ""}"${busy ? ' aria-busy="true"' : ""}>
    ${tlFiltersHtml()}
    ${busy ? `<div class="tl2-note">Re-reading the case&hellip;</div>` : ""}
    ${TL.capped_sources && TL.capped_sources.length ? `<div class="note">
      This case has more than the timeline reads in one go &mdash;
      ${esc(TL.capped_sources.join(", "))} ${TL.capped_sources.length > 1 ? "were" : "was"}
      cut at the read limit. Narrow the dates to see further back.</div>` : ""}
    ${TL.missing_sources && TL.missing_sources.length ? `<div class="note">
      Not every source could be read: ${esc(TL.missing_sources.join(", "))}.
      Those parts of the chronology are missing rather than empty.</div>` : ""}

    <div id="tldoc" class="tl2-doc">
      ${tlHeadHtml()}
      ${!rows.length ? `<div class="empty">${TL.total
        ? `Nothing in this case is <b>${esc(TL_CAT_LABEL[TL_CAT] || TL_CAT)}</b>.
           <button class="btn sm ghost" data-act="tlCat" data-c="all">Show everything</button>`
        : (tlRangeDays().from
            ? `Nothing happened on this case in that range.`
            : `Nothing has been recorded on this case yet. Starting a day, logging an
               entry or filing a photograph is what fills this in.`)}</div>`
      : days.map(g => `<div class="tl2-day">${esc(fmtDay(g.d))}</div>
          <ol class="tl2">${g.list.map(tlEventHtml).join("")}</ol>`).join("")}
    </div>

    <div class="tl2-foot">
      <span class="tl2-count">${esc(tlCountText(rows.length, shown, TL.total || 0))}</span>
      ${more ? `<button class="btn sm ghost" data-act="tlMore">Show more</button>` : ""}

      second copy, and nothing is edited from this screen. Open an entry to change it.</p>

/* PRINT REUSES WHAT IS ALREADY ON SCREEN. The brief's preferred first export is
   "a printable/exportable chronological view", and the browser's own print
   dialog saves a PDF from it — so nothing is generated, stored, uploaded to
   Dropbox or written to R2, and there is no second PDF writer in this file.
   `#tldoc` is the printed region, matching #invdoc / #pkgdoc / #repdoc. */
function tlPrint(){
  document.body.classList.add("printing-timeline");
  window.print();
  setTimeout(() => document.body.classList.remove("printing-timeline"), 400);
}

/* THE LINK OPENS THE RECORD, and for a file that means the viewer rather than
   a tab that merely contains it somewhere. Everything else routes by WS_TAB,
   which is this page's one piece of case routing. */
function tlGo(tab, id, kind){
  /* A FILE OPENS IN THE VIEWER, not in a tab that happens to contain it. The
     evidence row is already in the workspace, so this costs no request. */
  if(tab === "evidence" && id){
    const ev = ((WS && WS.evidence) || []).find(x => String(x.id) === String(id));
    if(ev){
      EV_VIEW = { src: API + "/cases/" + encodeURIComponent(WS_CASE) + "/evidence/" + ev.id + "/file",
                  name: ev.filename || "", type: ev.content_type || "" };
      paintEvView();
      return;
    }
  }
  // An invoice lives outside the case workspace; opening it means opening it.
  if(tab === "invoices"){ if(id) return openInvoice(Number(id));
    TAB = "invoices"; INV_OPEN = null; INV_MSG = ""; VIEW = "list"; paint(); return loadInvoices(); }
  /* A LINK MUST LAND SOMEWHERE THAT EXISTS. The Legal panel only appears on a
     case that has one and Billing is admin territory, so a tab this caller
     does not have would leave WS_TAB pointing at a panel the section bar
     cannot even show — a dead end reached by a control that looked live. */
  const known = wsSections().some(sec => sec[2].some(t => t[0] === tab));
  WS_NOTICE = ""; ACT_MODAL = null; WS_ERR = "";
  WS_TAB = known ? tab : "overview";
  if(WS_TAB === "package"){ PKG = null; loadPackage(); return; }
  paintCase();
}

/* Reports. The draft is assembled from the log, then it is a document someone
   writes — so the editor is a plain textarea, and nothing moves to the next
   stage without a person pressing a button. */
/* ------------------------------------------------ daily summary (Unit 12)

   THE PARAGRAPH IS BUILT, NEVER GUESSED. Every sentence below is a
   deterministic template over values the case actually records or the writer
   explicitly picked — the owner's brief forbids invented facts and forbids
   sending case facts to a language model, so there is no inference and no
   network call anywhere in this engine. A value that is absent SHAPES the
   sentence rather than being filled: no year prints no year, no plate prints
   no plate clause, no registered owner prints no owner clause. "Registered to
   unknown" is a sentence this engine cannot produce.

   The wording lives here once. The Worker stores what the writer saved and
   decides nothing about phrasing. */

const DS_STATES = { AL:"Alabama", AK:"Alaska", AZ:"Arizona", AR:"Arkansas", CA:"California",
  CO:"Colorado", CT:"Connecticut", DE:"Delaware", FL:"Florida", GA:"Georgia", HI:"Hawaii",
  ID:"Idaho", IL:"Illinois", IN:"Indiana", IA:"Iowa", KS:"Kansas", KY:"Kentucky",
  LA:"Louisiana", ME:"Maine", MD:"Maryland", MA:"Massachusetts", MI:"Michigan",
  MN:"Minnesota", MS:"Mississippi", MO:"Missouri", MT:"Montana", NE:"Nebraska",
  NV:"Nevada", NH:"New Hampshire", NJ:"New Jersey", NM:"New Mexico", NY:"New York",
  NC:"North Carolina", ND:"North Dakota", OH:"Ohio", OK:"Oklahoma", OR:"Oregon",
  PA:"Pennsylvania", RI:"Rhode Island", SC:"South Carolina", SD:"South Dakota",
  TN:"Tennessee", TX:"Texas", UT:"Utah", VT:"Vermont", VA:"Virginia", WA:"Washington",
  WV:"West Virginia", WI:"Wisconsin", WY:"Wyoming", DC:"District of Columbia" };

/* The weekday belongs to the DATE, not to any clock: built at UTC noon-less
   midnight and read back as UTC, so no machine's zone can shift 08-20 into
   Wednesday. The same rule tlLocal() follows at the other end. */
function dsDateParts(dateStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr || ""));
  if(!m) return null;
  return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
}
function dsWeekday(dateStr){
  const d = dsDateParts(dateStr);
  return d ? d.toLocaleDateString("en-US", { weekday: "long", timeZone: "UTC" }) : "";
}
function dsHeading(dateStr){
  const d = dsDateParts(dateStr);
  return d ? d.toLocaleDateString("en-US", { weekday: "long", month: "long",
    day: "numeric", year: "numeric", timeZone: "UTC" }).toUpperCase() : "";
}
function dsMDY(dateStr){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr || ""));
  return m ? `${m[2]}-${m[3]}-${m[1]}` : String(dateStr || "");
}
function dsArticle(next){ return /^[aeiou]/i.test(String(next || "").trim()) ? "an" : "a"; }
function dsCountWord(n){
  const w = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];
  return w[n] || String(n);
}
function dsTime(t){ return t ? t12(t) : ""; }
function dsSentence(str){
  let t = String(str || "").trim();
  if(!t) return "";
  t = t[0].toUpperCase() + t.slice(1);
  return /[.!?]$/.test(t) ? t : t + ".";
}

/* One vehicle as prose, from its recorded fields and nothing else. */
function dsVehiclePhrase(v){
  const bits = [String(v.year || "").trim(), String(v.color || "").trim().toLowerCase(),
                String(v.make || "").trim(), String(v.model || "").trim()].filter(Boolean);
  let out = bits.length ? `${dsArticle(bits[0])} ${bits.join(" ")}` : "a vehicle";
  const plate = String(v.plate || "").trim();
  if(plate){
    const st = DS_STATES[String(v.plate_state || "").trim().toUpperCase()]
      || String(v.plate_state || "").trim();
    out += st ? ` bearing ${st} registration ${plate}` : ` bearing registration ${plate}`;
  }
  return out;
}
function dsVehicleShort(v){
  const bits = [String(v.color || "").trim().toLowerCase(), String(v.make || "").trim(),
                String(v.model || "").trim()].filter(Boolean);
  return bits.length ? bits.join(" ") : (String(v.plate || "").trim() || "the vehicle");
}

/* The vehicles sentence: zero is NOT written here (an explicit no-vehicles
   line is its own deliberate choice), one gets its own sentence with the
   owner as a second sentence, several read as a list with inline owners. */
function dsVehiclesSentence(vs, where){
  const w = String(where || "in the driveway").trim();
  if(!vs.length) return "";
  if(vs.length === 1){
    const v = vs[0];
    let out = dsSentence(`${dsVehiclePhrase(v)} was observed ${w}`);
    const owner = String(v.registered_owner || "").trim();
    if(owner) out += ` The vehicle was recorded as registered to ${owner}.`;
    return out;
  }
  const parts = vs.map(v => {
    const owner = String(v.registered_owner || "").trim();
    return dsVehiclePhrase(v) + (owner ? `, registered to ${owner}` : "");
  });
  const list = parts.length === 2 ? parts.join(", and ")
    : parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];
  return `${dsCountWord(vs.length)} vehicles were observed ${w}: ${list}.`;
}

const DS_OPENINGS = [
  ["residence", "…at the subject's residence"],
  ["vicinity",  "…in the vicinity of the location"],
  ["commenced", "Investigative activity commenced…"],
];
function dsOpening(kind, day, sel){
  const wd = dsWeekday(day.day_date), md = dsMDY(day.day_date);
  const t = dsTime(sel.start_time || day.start_time);
  const loc = String(sel.location || "").trim();
  if(!wd || !t) return "";
  if(kind === "vicinity")  return `On ${wd}, ${md}, surveillance was initiated at ${t}${loc ? ` in the vicinity of ${loc}` : ""}.`;
  if(kind === "commenced") return `On ${wd}, ${md}, investigative activity commenced at ${t}${loc ? ` at ${loc}` : ""}.`;
  return `On ${wd}, ${md}, surveillance was initiated at ${t} at ${loc || "the subject's residence"}.`;
}

const DS_MODES = [
  ["as",       "As written"],
  ["depart",   "Subject departed"],
  ["arrive",   "Subject arrived"],
  ["business", "Entered a business"],
  ["mobile",   "Mobile surveillance"],
  ["return",   "Returned to residence"],
  ["custom",   "My own wording"],
];
function dsActSentence(e, mode, sel){
  const t = dsTime(e.at_time);
  const veh = (sel.act_veh && sel.act_veh[e.id])
    ? dsVehicleList().find(v => String(v.id) === String(sel.act_veh[e.id])) : null;
  const loc = String(e.location || "").trim();
  if(mode === "depart")
    return `At ${t}, the subject exited ${loc || "the residence"} and departed${veh ? ` in the ${dsVehicleShort(veh)}` : ""}.`;
  if(mode === "arrive")   return `At ${t}, the subject arrived at ${loc || "the location"}.`;
  if(mode === "business") return `At ${t}, the subject arrived at ${loc || "the establishment"} and entered the establishment.`;
  if(mode === "mobile")   return `Mobile surveillance was initiated as the subject departed the area.`;
  if(mode === "return")   return `At ${t}, the subject returned to the residence.`;
  if(mode === "custom")   return dsSentence((sel.act_text && sel.act_text[e.id]) || "");
  return `At ${t}, ${String(e.description || "").trim().replace(/^([A-Z])/, c => c.toLowerCase())}`
    .replace(/[.!?]?$/, ".");
}

const DS_GAPS = [
  ["period", "No activity was observed at the residence during this period."],
  ["before_end", "No additional activity was observed prior to the conclusion of surveillance."],
];
const DS_REASONS = [
  ["", "— no stated reason —"],
  ["returned",  "after the subject returned to the residence and no additional activity was observed"],
  ["noactivity","after no additional activity was observed"],
  ["lost",      "after visual contact with the subject was lost during mobile surveillance"],
  ["released",  "at the direction of the client"],
  ["hours",     "upon reaching the authorized hours"],
  ["weather",   "due to weather conditions"],
  ["custom",    "my own wording…"],
];
function dsClosing(day, sel){
  const t = dsTime(sel.end_time || day.end_time);
  if(!t) return "";
  let why = "";
  if(sel.reason === "custom") why = String(sel.reason_text || "").trim();
  else if(sel.reason) why = (DS_REASONS.find(r => r[0] === sel.reason) || ["", ""])[1];
  return `Surveillance was concluded at ${t}${why ? ` ${why}` : ""}.`;
}

/* The whole paragraph, in the day's own order: opening, vehicles, the chosen
   activity moments chronologically, the optional quiet line, the close. */
function dsCompose(day, sel){
  const parts = [];
  const open = dsOpening(sel.opening || "residence", day, sel);
  if(open) parts.push(open);
  if(sel.no_vehicles) parts.push("No vehicles associated with the subject were observed at the residence.");
  else parts.push(dsVehiclesSentence(
    dsVehicleList().filter(v => (sel.vehicles || []).includes(v.id)), sel.veh_where));
  for(const e of dsDayEntries(sel.day_id)){
    if(!(sel.acts || []).includes(e.id)) continue;
    parts.push(dsActSentence(e, (sel.act_mode && sel.act_mode[e.id]) || "as", sel));
  }
  if(sel.gap) parts.push((DS_GAPS.find(g => g[0] === sel.gap) || ["", ""])[1]);
  const close = dsClosing(day, sel);
  if(close) parts.push(close);
  return parts.filter(Boolean).join(" ");
}

function dsVehicleList(){
  return ((WS && WS.subjects) || []).flatMap(sj => sj.vehicles || []);
}
function dsDayEntries(dayId){
  return ((WS && WS.activity) || []).filter(e => e.day_id === dayId && !e.removed_at)
    .slice().sort((a, b) => (a.at_time < b.at_time ? -1 : a.at_time > b.at_time ? 1
      : a.id - b.id));
}
function dsSavedFor(dayId){
  return ((WS && WS.day_summaries) || []).find(r => r.day_id === dayId) || null;
}

/* PER-DAY, STRUCTURALLY. Everything the builder holds is keyed by the day id,
   so Thursday's vehicles cannot leak into Friday by any code path — the
   cross-day independence the brief demands is the shape of the state. */
let DS_DRAFT = {};
function dsState(day){
  if(DS_DRAFT[day.id]) return DS_DRAFT[day.id];
  const saved = dsSavedFor(day.id);
  let sel = null;
  if(saved && saved.config){ try{ sel = JSON.parse(saved.config); }catch{} }
  if(!sel || typeof sel !== "object") sel = null;
  const st = {
    manual: !!(saved && String(saved.narrative || "").trim()) && !(sel && sel.composed),
    text: saved ? String(saved.narrative || "") : "",
    sel: Object.assign({
      day_id: day.id, opening: "residence",
      start_time: day.start_time || "", end_time: day.end_time || "",
      location: dsDefaultLocation(), veh_where: "in the driveway",
      vehicles: [], acts: [], act_mode: {}, act_text: {}, act_veh: {},
      gap: "", reason: "", reason_text: "", no_vehicles: false,
    }, sel || {}),
  };
  st.sel.day_id = day.id;
  /* A saved paragraph that exactly matches what its selections compose is
     still the machine's; anything else is the writer's and is protected. */
  if(saved && String(saved.narrative || "").trim()){
    st.manual = saved.narrative !== dsCompose(day, st.sel);
  }
  if(!saved) st.text = dsCompose(day, st.sel);
  DS_DRAFT[day.id] = st;
  return st;
}
function dsDefaultLocation(){
  const sj = ((WS && WS.subjects) || [])[0];
  const addr = sj && String(sj.addresses || "").split(/\n/)[0].trim();
  return addr ? `the subject's residence at ${addr}` : "";
}

/* EVERY VALUE FIRST, THEN THE REPAINT — the edCollect rule, because this
   panel rebuilds itself on every control change and a textarea that is not
   read back before the rebuild is a paragraph silently reverted. */
function dsCollect(dayId){
  const st = DS_DRAFT[dayId];
  if(!st) return;
  const g = id => $(id);
  const ta = g("ds_text"); if(ta) st.text = ta.value;
  const sel = st.sel;
  if(g("ds_open")) sel.opening = g("ds_open").value;
  if(g("ds_time")) sel.start_time = g("ds_time").value;
  if(g("ds_loc")) sel.location = g("ds_loc").value;
  if(g("ds_vwhere")) sel.veh_where = g("ds_vwhere").value === "custom"
    ? (g("ds_vwherec") ? g("ds_vwherec").value : sel.veh_where)
    : g("ds_vwhere").value;
  if(g("ds_noveh")) sel.no_vehicles = g("ds_noveh").checked;
  sel.vehicles = dsVehicleList().filter(v => g("ds_veh_" + v.id) && g("ds_veh_" + v.id).checked)
    .map(v => v.id);
  sel.acts = dsDayEntries(dayId).filter(e => g("ds_act_" + e.id) && g("ds_act_" + e.id).checked)
    .map(e => e.id);
  for(const e of dsDayEntries(dayId)){
    if(g("ds_mode_" + e.id)) sel.act_mode[e.id] = g("ds_mode_" + e.id).value;
    if(g("ds_cust_" + e.id)) sel.act_text[e.id] = g("ds_cust_" + e.id).value;
    if(g("ds_vsel_" + e.id)) sel.act_veh[e.id] = g("ds_vsel_" + e.id).value;
  }
  if(g("ds_end")) sel.end_time = g("ds_end").value;
  if(g("ds_reason")) sel.reason = g("ds_reason").value;
  if(g("ds_reasonc")) sel.reason_text = g("ds_reasonc").value;
}

/* A control changed: capture everything, then recompose ONLY when the
   paragraph is still the machine's. A manually edited paragraph is never
   touched by a control — the writer is told the two have parted and offered
   Rebuild, which is a deliberate act with a confirmation. */
function dsCtl(dayId){
  dsCollect(dayId);
  const st = DS_DRAFT[dayId];
  const day = ((WS && WS.days) || []).find(d => d.id === dayId);
  if(st && day && !st.manual) st.text = dsCompose(day, st.sel);
  paintCase();
}
function dsRebuild(dayId){
  const st = DS_DRAFT[dayId];
  const day = ((WS && WS.days) || []).find(d => d.id === dayId);
  if(!st || !day) return;
  dsCollect(dayId);
  if(st.manual && !confirm("Rebuild the paragraph from the selections? Your manual wording "
    + "for this day will be replaced.")) return;
  st.text = dsCompose(day, st.sel);
  st.manual = false;
  paintCase();
}
async function dsSave(dayId){
  dsCollect(dayId);
  const st = DS_DRAFT[dayId];
  if(!st) return;
  st.err = ""; st.okmsg = "";
  const day = ((WS && WS.days) || []).find(d => d.id === dayId);
  const composed = !st.manual || (day && st.text === dsCompose(day, st.sel));
  const res = await api(`/cases/${encodeURIComponent(WS_CASE)}/days/${dayId}/summary`, {
    method: "POST",
    body: { narrative: st.text, config: Object.assign({}, st.sel, { composed }) },
  });
  if(res && res.ok){
    st.okmsg = "Saved.";
    if(WS) WS.day_summaries = res.day_summaries || WS.day_summaries;
  } else st.err = (res && res.error) || "Could not save the summary.";
  paintCase();
}

function dsChip(kind){
  const lbl = { day: "FROM DAY", case: "FROM CASE", act: "FROM ACTIVITY" }[kind];
  return lbl ? `<span class="dsb-chip">${lbl}</span>` : "";
}

    <p class="hint" style="margin:4px 0 10px">The paragraph builds itself from the day&rsquo;s recorded
      facts and what you pick below &mdash; then the words are yours to edit. Nothing here changes the
      activity log.</p>

    <div class="dsb-grid">
      <label class="f"><span>Opening ${dsChip("day")}</span>
        <select id="ds_open" data-act-change="dsCtl" data-day="${day.id}" ${editable ? "" : "disabled"}>
          ${DS_OPENINGS.map(([k, l]) => `<option value="${k}" ${k === (sel.opening || "residence") ? "selected" : ""}>${l}</option>`).join("")}
        </select></label>
      <label class="f"><span>Started ${dsChip("day")}</span>

        <input id="ds_loc" value="${esc(sel.location || "")}" data-act-input="dsDirtyCtl" data-day="${day.id}"

    </div>

    <div class="rc-h" style="margin-top:10px"><b>Vehicles observed</b></div>
    ${vehicles.length ? vehicles.map(veh).join("") : `<div class="tl-m">No vehicles are recorded on this case&rsquo;s subjects yet.</div>`}
    <div class="dsb-grid">

        <input id="ds_reasonc" value="${esc(sel.reason_text || "")}" data-act-input="dsDirtyCtl"
          data-day="${day.id}" placeholder="e.g. at the adjuster's request" ${editable ? "" : "disabled"}></label>` : ""}

    <textarea id="ds_text" rows="7" class="rbody" data-act-input="dsText" data-day="${day.id}"
      ${editable ? "" : "disabled"}>${esc(st.text)}</textarea>
    ${st.manual ? `<p class="hint">This wording is protected: the controls above stopped rewriting the
      box the moment it became yours. <b>Rebuild</b> replaces it from the selections, and asks first.</p>` : ""}
    <div class="ractions">
      ${editable ? `<button class="btn sm" data-act="dsSave" data-day="${day.id}">Save summary</button>
      <button class="btn sm ghost" data-act="dsRebuild" data-day="${day.id}">Rebuild from selections</button>` :
      `<span class="tl-m">This day&rsquo;s report is with the office, so its summary is read-only for you.</span>`}
    </div>
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ""}
    ${st.okmsg ? `<div class="note">${esc(st.okmsg)}</div>` : ""}
  </div>`;
}

/* UIBUILD P11 — the report preview screen. The document leads; the panel nav

/* EDIT CASE (owner, 2026-08-16) — one place to correct what the case says.

   THE CASE NUMBER IS READ-ONLY and is shown as text, not an input. It is in the
   send log, on invoices and in every email subject line that has already gone
   out; there is no rename here and there should not be.

   NOTHING IS DUPLICATED. Identity and phone numbers are this panel's own —
   nothing else could edit them. Case type, agreed retainer, status and
   assignment already have routes and controls, so Save calls THOSE routes, the
   way `saveCaseMeta` already does. Internal notes are a list with their own
   panel, so this links there rather than growing a second box that would write
   somewhere different.

   Tap targets are 44px minimum and the layout is one column on a phone — the
   `.two` grid already collapses, and nothing here is wider than the card. */
const PHONE_LABELS_UI = ["mobile", "work", "home", "other"];
let EDIT_MSG = "", EDIT_ERR = false;

/* WHAT THE ADMIN HAS TYPED, KEPT ACROSS REPAINTS — the same rule `RET_DRAFT`
   exists for, and the same bug it was written to stop.

   Every paint rebuilds these inputs from `WS`. Adding a phone row repaints, so
   without this an admin who corrected a name and then pressed "Add another
   number" watched the name quietly revert to the stored value — and the save
   then sent the OLD name back with a straight face. Caught by a test that
   compared what was typed with what was sent.

   Keyed by case so opening another one never inherits a half-typed correction. */
let EDIT_DRAFT = {};

function edDraft(){
  if(!EDIT_DRAFT[WS_CASE]) EDIT_DRAFT[WS_CASE] = {};
  return EDIT_DRAFT[WS_CASE];
}
/* Read every field on screen into the draft. Called before anything that
   repaints and before saving, so the draft is always what the admin can see. */
function edCollect(){
  const d = edDraft();
  const v = id => { const el = $(id); return el ? el.value : null; };
  for(const [k, id] of [["client","ed_client"], ["email","ed_email"], ["subject","ed_subject"],
                        ["address","ed_address"], ["claim","ed_claim"], ["type","ed_type"],
                        ["status","ed_status"], ["retainer","ed_retainer"], ["asg","ed_asg"]]){
    const got = v(id);
    if(got !== null) d[k] = got;
  }
  if($("edc_num_0") || d.client_phones) d.client_phones = readPhoneRows("edc");
  for(const sub of (WS && WS.subjects) || []){
    if($("eds" + sub.id + "_num_0") || (d.subject_phones || {})["s" + sub.id]){
      d.subject_phones = d.subject_phones || {};
      d.subject_phones["s" + sub.id] = readPhoneRows("eds" + sub.id);
    }
  }
  return d;
}

function phoneRowsHtml(prefix, list){
  const rows = (list && list.length ? list : [{ number: "", label: "" }]);
  return rows.map((p, i) => `<div class="two" style="align-items:end">
      <label class="f"><span>${i === 0 ? "Phone" : "Also"} <span class="opt">optional</span></span>
        <input id="${prefix}_num_${i}" inputmode="tel" value="${esc(p.number || "")}"></label>
      <label class="f"><span>Label</span>
        <select id="${prefix}_lab_${i}"><option value="">&mdash;</option>${
          PHONE_LABELS_UI.map(l => `<option value="${l}"${
            (p.label || "") === l ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    </div>`).join("") +
    `<div class="actions"><button class="btn sm ghost" data-act="edAddPhone" data-p="${prefix}">Add another number</button></div>`;
}

    <label class="f"><span>Investigator <span class="opt">optional &mdash; a case may stay unassigned</span></span>
      <select id="ed_asg"><option value="">&mdash; unassigned &mdash;</option>${
        USERS.filter(u => u.active).map(u => `<option value="${u.id}"${
          u.id === s.assigned_to ? " selected" : ""}>${esc(u.display_name || u.username)}</option>`).join("")}</select></label>

    <div class="actions" style="margin-top:12px">
      <button class="btn" data-act="edSave">Save changes</button>
      <button class="btn sm ghost" data-act="wsTab" data-tab="notes">Internal notes &rarr;</button>
    </div>
    ${EDIT_MSG ? `<div class="${EDIT_ERR ? "err" : "linkbox"}">${esc(EDIT_MSG)}</div>` : ""}
  </div>`;
}

function readPhoneRows(prefix){
  const out = [];
  for(let i = 0; i < 12; i++){
    const n = $(prefix + "_num_" + i);
    if(!n) continue;
    const number = n.value.trim();
    if(!number) continue;
    const l = $(prefix + "_lab_" + i);
    out.push({ number, label: l ? l.value : "" });
  }
  return out;
}

async function saveCaseEdit(){
  EDIT_MSG = ""; EDIT_ERR = false;
  /* THE DRAFT IS WHAT GETS SENT, and it is refreshed from the screen first. A
     save that re-read the inputs directly would send whatever the last repaint
     put there — which is how a corrected name went back to the server unchanged
     and the office was told "Case updated." */
  const d = edCollect();
  const t = k => String(d[k] == null ? "" : d[k]).trim();
  const subjects = (WS && WS.subjects) || [];
  const subjectPhones = {};
  for(const sub of subjects){
    subjectPhones[String(sub.id)] = (d.subject_phones || {})["s" + sub.id] || [];
  }
  try{
    /* This panel's own fields. */
    await api(`/cases/${encodeURIComponent(WS_CASE)}/edit`, {method:"POST", body:{
      client_name: t("client"), client_email: t("email"),
      subject_name: t("subject"), subject_address: t("address"),
      claim_number: t("claim"),
      client_phones: d.client_phones || [],
      ...(subjects.length ? {subject_phones: subjectPhones} : {}),
    }});
    /* Everything with a route of its own goes to that route — one writer each. */
    if(d.type !== undefined) await api(`/cases/${encodeURIComponent(WS_CASE)}/meta`,
      {method:"POST", body:{case_type_id: t("type")}});
    if(d.retainer !== undefined) await api(`/cases/${encodeURIComponent(WS_CASE)}/retainer`,
      {method:"POST", body:{retainer_amount: t("retainer")}});
    if(d.asg !== undefined) await api(`/submissions/${encodeURIComponent(WS_CASE)}/assign`,
      {method:"POST", body:{user_id: t("asg") === "" ? null : Number(t("asg"))}});
    if(d.status !== undefined) await api(`/submissions/${encodeURIComponent(WS_CASE)}/status`,
      {method:"POST", body:{status: t("status")}});
    EDIT_DRAFT[WS_CASE] = null;   // saved, so the draft is spent
    EDIT_MSG = "Case updated.";
  }catch(e){ EDIT_MSG = e.message; EDIT_ERR = true; }
  await reloadWorkspace();
  /* THE LIST HOLDS THE OLD NAME UNTIL IT IS REFETCHED. `CASES` is loaded once by
     render(), and the case row carries client_name and subject_name — so
     correcting a name here and not reloading leaves the office looking at the
     mistake they just fixed, on the screen they go back to. */
  await render();
}

/* Priority 20 — the nine operational stages. The select offers every stage
   except closed: closing goes through the checklist, and the Worker refuses
   the shortcut. A closed case shows closed as its current value so re-saving
   is a no-op rather than an error. */
function STAGE_OPTS(s){
  const wsStage = WS && WS.case_no === s.case_no ? WS.stage : null;
  const cur = wsStage || s.stage || (s.status === "new" ? "open" : s.status) || "open";
  const stages = ["open","assigned","in_progress","report_review","awaiting_client",
                  "complete","on_hold","cancelled"];
  const list = cur === "closed" ? ["closed", ...stages] : stages;
  return list.map(v => `<option value="${v}" ${v === cur ? "selected" : ""}>${esc(label(v))}</option>`).join("");
}

/* The closing checklist: eight attestations, the only door to closed. */
function closurePanel(){
  if(ME.role !== "admin" || !WS || !WS.closure) return "";
  const c = WS.closure;
  if(c.closed_at){
    /* REOPEN IS A BUTTON, NOT AN INSTRUCTION (owner, WORKFLOW-SIMPLIFICATION §2).

       This used to read "Reopen by setting a status above and saving." Nothing
       was above it: the closing panel renders in Admin → Billing & closing and
       the status selector lives in Admin → Assignment, a different tab. The one
       sentence telling an admin how to undo a closure pointed off the screen and
       did not name where to go.

       It is the SAME route the status selector posts to — `/submissions/:no/status`
       with a stage of `open` — so `setStatus` clears `closed_by`/`closed_at` and
       keeps the checklist ticks as history, exactly as before. No new status, and
       closing still goes only through the checklist. */
    return `<div class="feebox" style="margin-top:14px">
      <div class="row"><span><b>Case closed</b></span>
        <span>${esc(c.closed_by || "")} &middot; ${when(c.closed_at)}</span></div>
      <div class="row"><span style="color:var(--muted);font-size:.85rem">Reopening keeps every tick
        below as history &mdash; nothing is lost by opening it again.</span>
        <button class="btn sm ghost" data-act="reopenCase">Reopen case</button></div>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </div>`;
  }
  const done = c.items.filter(([k]) => c.checklist[k]).length;
  return `<form class="quick" data-act="saveClosure" style="margin-top:14px">
    <h3 style="margin:0 0 8px;font-size:1rem">Close the case <span class="opt">${done}/${c.items.length} confirmed</span></h3>
    ${c.items.map(([k, l]) => `
      <label class="cap"><input type="checkbox" id="cl_${k}" ${c.checklist[k] ? "checked" : ""}><span>${esc(l)}</span></label>`).join("")}
    <div style="margin-top:10px">
      <button class="btn ghost sm" type="submit">Save checklist</button>
      <button class="btn sm" type="button" data-act="closeCase">Close the case</button>
    </div>
    <p class="hint">Every line is your confirmation, not the system's guess. Closing needs all
      ${c.items.length}; the case can be reopened later from the status above.</p>
    ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
  </form>`;
}

async function saveClosureTicks(){
  WS_ERR = "";
  const checklist = {};
  for(const [k] of ((WS && WS.closure && WS.closure.items) || [])){
    const el = $("cl_" + k);
    if(el) checklist[k] = el.checked;
  }
  try{ await api(`/cases/${encodeURIComponent(WS_CASE)}/closure`, {method:"POST", body:{checklist}}); }
  catch(e){ WS_ERR = e.message; }
  await reloadWorkspace();
}

   further than Archive: the case leaves every ordinary view, Archived included,
