<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Portal — Always Precise</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e1a2c">
<link rel="icon" href="/assets/logo-white.webp">
<style>
  :root{
    --navy:#0e1a2c; --navy-2:#13273f; --teal:#2f7d90; --teal-2:#3d97ad;
    --gold:#c99a3b; --ink:#1c2531; --muted:#5c6775; --line:#dfe3e8;
    --paper:#f4f5f7; --card:#fff; --good:#1c8a4d; --bad:#c14133; --warn:#a86a12;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}

  .top{background:var(--navy);color:#fff;padding:14px 20px;}
  .top .wrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .top .name{font-weight:700;letter-spacing:.03em;line-height:1.15;}
  .top .name span{display:block;font-weight:400;font-size:.72rem;color:#9db2c9;letter-spacing:.05em;}
  .top .who{margin-left:auto;font-size:.82rem;color:#cfe0f0;text-align:right;}
  .top .who b{display:block;color:#fff;}
  .top button{font:inherit;font-size:.82rem;background:transparent;border:1px solid #3c5878;color:#cfe0f0;border-radius:6px;padding:6px 12px;cursor:pointer;margin-left:12px;}
  .top button:hover{background:#1c3552;}

  main{max-width:1180px;margin:0 auto;padding:22px 16px 70px;}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs button{font:inherit;font-size:.9rem;font-weight:600;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 14px;cursor:pointer;}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--teal-2);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(16,29,51,.05);}
  .card.narrow{max-width:430px;margin:8vh auto 0;}
  h1{font-size:1.28rem;margin-bottom:4px;}
  h2{font-size:1.05rem;margin-bottom:12px;}
  .lead{color:var(--muted);font-size:.92rem;margin-bottom:18px;}
  label.f{display:block;margin-bottom:14px;}
  label.f > span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;}
  input,select,textarea{width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;}
  input:focus,select:focus{outline:2px solid var(--teal-2);border-color:var(--teal-2);}
  .btn{font:inherit;font-size:.95rem;font-weight:700;border:0;border-radius:8px;padding:11px 20px;cursor:pointer;background:var(--teal);color:#fff;}
  .btn:hover{background:var(--teal-2);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn.sm{font-size:.82rem;padding:7px 13px;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn.danger{background:var(--bad);}
  .err{color:var(--bad);font-size:.86rem;margin-top:10px;min-height:1em;}
  .okmsg{color:var(--good);font-size:.86rem;margin-top:10px;min-height:1em;}

  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .bar input{max-width:280px;}
  .count{color:var(--muted);font-size:.86rem;margin-left:auto;}
  .note{background:#fdf7ec;border:1px solid #f0dcb6;color:#7a5a12;border-radius:8px;padding:10px 13px;font-size:.86rem;margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap;}
  tbody tr.click{cursor:pointer;}
  tbody tr.click:hover{background:#f7fafb;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;color:var(--teal);}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px;}
  .tag.claims{background:#eaf4f7;color:#1f5c6d;}
  .tag.consumer{background:#f0eee9;color:#6b5a33;}
  .tag.new{background:#fdf1e3;color:var(--warn);}
  .tag.assigned{background:#eaf4f7;color:#1f5c6d;}
  .tag.in_progress{background:#e8f1fb;color:#1e4f8a;}
  .tag.closed{background:#e9f7ef;color:var(--good);}
  .empty{color:var(--muted);padding:26px 4px;font-size:.92rem;}

  /* dashboard strip */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;}
  .stat.warn{border-color:#e8cf9e;background:#fdf9f1;}
  .stat-n{font-size:1.7rem;font-weight:800;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums;}
  .stat.warn .stat-n{color:#8a6410;}
  .stat-l{font-size:.82rem;font-weight:700;margin-top:2px;}
  .stat-h{font-size:.75rem;color:var(--muted);margin-top:1px;}
  /* rate sheets */
  .sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px;}
  .sheet-card{text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;
    padding:15px 16px;cursor:pointer;font:inherit;color:inherit;display:block;width:100%;}
  .sheet-card:hover{border-color:var(--teal);}
  .sheet-card.on{border-color:var(--teal);background:#f2f9fa;box-shadow:0 0 0 1px var(--teal) inset;}
  .sheet-n{font-weight:800;font-size:1.05rem;color:var(--navy);}
  .sheet-a{font-size:.78rem;color:var(--muted);margin:2px 0 8px;}
  .sheet-s{font-size:.88rem;}
  .sheet-go{margin-top:10px;font-size:.78rem;font-weight:700;color:var(--teal);}
  .sheet-note{font-size:.8rem;color:var(--muted);font-weight:400;max-width:46ch;}
  /* case workspace — built to be usable from a phone in a parked car */
  .wstabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);
    margin:0 0 16px;padding-bottom:0;-webkit-overflow-scrolling:touch;}
  .wstabs button{flex:none;font:inherit;font-size:.88rem;font-weight:700;background:none;border:0;
    border-bottom:2px solid transparent;color:var(--muted);padding:9px 12px;cursor:pointer;white-space:nowrap;}
  .wstabs button.on{color:var(--navy);border-bottom-color:var(--teal);}
  .wspanel{min-height:120px;}
  .quick{background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;}
  .quick .btn{width:100%;}
  .qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:6px;margin-bottom:12px;}
  .qk{position:relative;}
  .qk input{position:absolute;opacity:0;pointer-events:none;}
  .qk span{display:block;text-align:center;font-size:.8rem;font-weight:700;padding:10px 4px;
    border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
  .qk input:checked + span{border-color:var(--teal);background:#eaf5f7;color:var(--navy);}
  .qk input:focus-visible + span{outline:2px solid var(--teal);}
  .opt{font-weight:400;color:var(--muted);font-size:.78rem;}
  .dayon{background:#eaf5f7;border:1px solid #b7dbe3;border-radius:8px;padding:10px 12px;
    font-size:.88rem;margin-bottom:12px;}
  .meter{height:8px;border-radius:999px;background:#dbe6ea;overflow:hidden;margin:8px 0 2px;}
  .meter i{display:block;height:100%;background:var(--teal);}
  .meter.warn i{background:#d19a1f;} .meter.high i{background:#c9711f;} .meter.over i{background:#b23a2c;}
  .warnline{font-size:.85rem;color:#7a5410;background:#fdf7ec;border:1px solid #e8cf9e;
    border-radius:8px;padding:8px 10px;margin-top:8px;}
  .warnline.over{color:#8a2318;background:#fdecea;border-color:#f5c6c0;}
  .tl-day{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);margin:16px 0 6px;}
  .tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);}
  .tl-i{display:flex;gap:10px;padding:8px 0 8px 12px;position:relative;}
  .tl-i::before{content:"";position:absolute;left:-5px;top:14px;width:8px;height:8px;
    border-radius:50%;background:var(--teal);}
  .tl-t{flex:none;width:64px;font-family:ui-monospace,monospace;font-size:.82rem;font-weight:700;color:var(--navy);}
  .tl-b{flex:1;min-width:0;}
  .tl-d{font-size:.92rem;}
  .tl-m{font-size:.78rem;color:var(--muted);}
  .tl-n{font-size:.78rem;color:#7a5410;}
  /* reports */
  .rlist{display:grid;gap:8px;margin-top:14px;}
  .rcard{text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:11px 13px;cursor:pointer;width:100%;}
  .rcard:hover{border-color:var(--teal);}
  .rcard.on{border-color:var(--teal);background:#f2f9fa;}
  .rc-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .rbody{width:100%;font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:.86rem;line-height:1.55;border:1px solid var(--line);border-radius:8px;
    padding:12px;background:#fff;resize:vertical;}
  .rbody[readonly]{background:#f4f6f8;color:var(--muted);}
  .ractions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .tag.rs-draft{background:#e6ebf0;color:#42505f;}
  .tag.rs-submitted{background:#dcecf2;color:#1d5c6c;}
  .tag.rs-needs_revision{background:#fdf0da;color:#7a5410;}
  .tag.rs-approved{background:#dff2e5;color:#1a6b3c;}
  .tag.rs-delivered{background:#12305a;color:#fff;}
  @media(max-width:560px){
    .wspanel .two{grid-template-columns:1fr;}
    .tl-t{width:52px;}
    dialog{width:100%;max-width:100%;border-radius:0;margin:0;height:100%;max-height:100%;}
    .dlg{padding:16px;}
  }
  .ex-note{background:#fdf7ec;border:1px solid #e8cf9e;color:#6b4f12;border-radius:8px;
    padding:11px 14px;font-size:.88rem;margin-bottom:14px;}
  .tag.ex-tag{background:#f3e2bd;color:#6b4f12;margin-left:6px;}
  tbody tr.ex{background:repeating-linear-gradient(45deg,#fffdf7,#fffdf7 10px,#fdf7ec 10px,#fdf7ec 20px);}
  tbody tr.ex:hover{background:#fdf3e0;}
  tbody tr.ex td:first-child{box-shadow:inset 3px 0 0 #d9b45e;}

  .linkbox{background:#f1f7f9;border:1px solid #cfe6ec;border-radius:8px;padding:12px 14px;margin-top:12px;}
  .linkbox code{display:block;word-break:break-all;font-family:ui-monospace,monospace;font-size:.82rem;color:#14495a;margin-bottom:10px;}

  dialog{border:0;border-radius:12px;padding:0;max-width:760px;width:calc(100% - 32px);box-shadow:0 18px 50px rgba(10,20,32,.34);}
  dialog::backdrop{background:rgba(10,20,32,.55);}
  .dlg{padding:22px;}
  .dlg h2{margin-bottom:2px;}
  .dlg .case{font-family:ui-monospace,monospace;color:var(--teal);font-weight:700;margin-bottom:14px;}
  dl.detail{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:14px 0;font-size:.9rem;}
  dl.detail dt{color:var(--muted);white-space:nowrap;}
  dl.detail dd{word-break:break-word;}
  .sig{max-width:250px;border-bottom:1px solid #c7ccd3;margin-top:4px;}
  .dlg .actions{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:8px;}
  .dlg .actions label.f{margin-bottom:0;min-width:170px;}
  .close{position:absolute;right:14px;top:12px;background:transparent;border:0;font-size:1.5rem;line-height:1;color:var(--muted);cursor:pointer;}
  .rel{position:relative;}
  @media(max-width:760px){
    dl.detail{grid-template-columns:1fr;gap:2px;}
    dl.detail dt{margin-top:8px;}
    th.hide,td.hide{display:none;}
  }
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="10" fill="#13273f"/><path d="M32 12l6 8-6 8-6-8z" fill="#3d97ad"/><path d="M32 30l10 12H22z" fill="#c99a3b"/></svg>
    <div class="name">ALWAYS PRECISE<span>INVESTIGATIONS · CASE PORTAL</span></div>
    <div class="who" id="who" hidden></div>
  </div>
</div>

<main id="app"></main>

<dialog id="dlg"><div class="rel"><button class="close" data-act="closeDlg" aria-label="Close">&times;</button><div class="dlg" id="dlgBody"></div></div></dialog>

<script>
"use strict";

/* The API is mounted on this same domain, at /portal-api/*, by a Cloudflare
   Worker route. It has to be same-origin: a session cookie set by a
   workers.dev hostname would be cross-site and never sent back. */
const API = "/portal-api";

const $ = id => document.getElementById(id);
const app = $("app");
let ME = null, TAB = "cases", CASES = [], USERS = [], INVITES = [], TOTAL = 0, FILTER = "", LAST_LINK = "", LAST_EMAILED = false;
let SUMMARY = null, SHEETS = [], SHEET_MAIL = "", OPEN_SHEET = null, SHEET_MSG = "";
// The open case workspace: which case, which tab, its loaded data, last error.
let WS = null, WS_CASE = null, WS_TAB = "overview", WS_ERR = "", WS_REPORT = null;
/* Examples show themselves on a first sign-in and can be recalled later. */
let SHOW_EXAMPLE = false;

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function when(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? esc(iso) : d.toLocaleString([], {month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit"});
}
const label = s => ({
  new:"New", assigned:"Assigned", in_progress:"In progress", closed:"Closed",
  activity:"Activity", photo:"Photo", video:"Video", location:"Location",
  vehicle:"Vehicle", note:"Note", mileage:"Mileage", expense:"Expense",
}[s] || s);

/* Only ever render an image the browser will treat as image data. Anything
   else in that field came from a public form and is not to be trusted. */
function safeImage(src){
  return typeof src === "string" && /^data:image\/(png|jpeg|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(src) ? src : "";
}


/* ------------------------------------------------------------- examples */
/* Two worked cases so a new sign-in shows the real layout instead of an empty
   table. They live here and nowhere else: never fetched, never stored, never
   written to the database. Every case number starts with EXAMPLE- and the
   router only accepts [A-Za-z0-9-], so one could never collide with a real
   case even if it somehow reached the API.

   The data is realistic on purpose — a layout demonstrated with "Lorem ipsum"
   teaches nobody where the claim number goes. The names and numbers are
   invented. */
const EXAMPLE_SIGNATURE = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPAAAABGCAIAAAB9pI6tAAABZ0lEQVR42u3bwRGCQAxA0dRgJdZj/33o1fGksmST8P54Vsi+AUSJpzSoMAIBLQEtAS0BLaAloCWgJaAloAW0BLQEtAS0BLSAloCWgJaAloAW0BLQEtAS0BLQAloCWrog6Nv98cfLshVZEaAPOYb7+0kWXIuc5YumjrH+aaRpC/H+iVsWLorMfdXiAZ1wjKh8JIq9E6/2tnznHLxbXkPn7BLWHX03A52/J1gXobz8OnM/6I2wsK45hEzZMYMy1i12PEF2nLqtrW/Qotxxg2Me5Uuxbn06qgi6xShHsp50ZVUCdLtRjlx+t3TWgJ50jmvkAOVTQHcfaEcTKOeBHnYNalMvDdr3KpTngJ4xgl4/rSF71l2OYRUxhDLQQzyhDPQGW8t5+WM30CVYH9Tm0Rugi7Je+wgZykDXku05X6AvLds8gW6P29yAloAW0BLQEtAS0BLQAloCWgJaAloCWkBLQEtAS0BLn70AC1I/GEqi0NIAAAAASUVORK5CYII=";

const EXAMPLE_CASES = [
  {
    case_no: "EXAMPLE-CLAIM-0001", kind: "claims", service: "Insurance Claim Assignment",
    status: "assigned", client_name: "Karen Whitfield", subject_name: "Marcus Ellery",
    carrier: "Blue Ridge Mutual", claim_number: "WC-2026-104871",
    created_at: "2026-08-11T14:20:00.000Z", assigned_name: "You",
    payload: {
      carrier: "Blue Ridge Mutual", claim_number: "WC-2026-104871",
      policy_number: "BRM-88-441209", claim_type: "Workers' compensation",
      date_of_loss: "04/18/2026",
      adjuster: "Karen Whitfield", adjuster_email: "kwhitfield@blueridgemutual.example",
      adjuster_phone: "(540) 555-0173",
      defense_counsel: "Poe & Marsden — R. Marsden",
      prior_surveillance: "Yes — by another vendor",
      client_name: "Karen Whitfield", client_phone: "(540) 555-0173",
      client_email: "kwhitfield@blueridgemutual.example",
      subject_name: "Marcus Ellery",
      subject_address: "2214 Old Forest Rd, Lynchburg, VA 24501",
      subject_description: "White GMC Sierra, VA plate XKT-2209. 6'1\", heavy build, beard.",
      subject_relationship: "Lumbar disc herniation. No lifting over 15 lbs, no ladders, no prolonged standing. Off work since 04/22.",
      objective: "Establish activity level against the stated restrictions. Claimant reportedly helps at a family landscaping business on weekends — verify or rule out.",
      authorized_hours: "8 hours authorized — call before exceeding",
      timeline: "Commission hearing 09/12 — report needed by 09/01",
      notes: "Neighbour on the corner is a retired deputy; avoid parking on that side.",
      attachments: "claim-file.pdf, ISO-report.pdf, claimant-photo.jpg",
      billing_reference: "PO-77412", billing_email: "ap@blueridgemutual.example",
      billing_notes: "Submit through the carrier vendor portal. PO must appear on the invoice.",
      signed_name: "Karen Whitfield", payment_method: "Invoiced to carrier", fee_due: 0,
      signature: EXAMPLE_SIGNATURE,
    },
  },
  {
    case_no: "EXAMPLE-INTAKE-0002", kind: "consumer", service: "Surveillance",
    status: "new", client_name: "Denise Harlow", subject_name: "R. Harlow",
    carrier: null, claim_number: null,
    created_at: "2026-08-11T09:05:00.000Z", assigned_name: null,
    payload: {
      client_name: "Denise Harlow", client_phone: "(434) 555-0148",
      client_email: "d.harlow@example.com",
      client_address: "88 Peakland Pl, Lynchburg, VA 24503",
      best_time: "Weekday evenings after 6pm",
      subject_name: "R. Harlow",
      subject_address: "Same — believed staying elsewhere Thursdays",
      subject_description: "Grey Honda Accord, VA plate LMR-8841",
      subject_relationship: "Spouse",
      objective: "Document whereabouts on Thursday evenings. Attorney has advised documentation is needed before filing.",
      timeline: "Before the 09/04 hearing date",
      notes: "Please do not call the house phone. Mobile only.",
      attachments: "marriage-cert.pdf",
      signed_name: "Denise Harlow", payment_method: "venmo", fee_due: 1500,
      signature: EXAMPLE_SIGNATURE,
    },
  },
];

/* An investigator's copy of a case has the client stripped out of it by the
   Worker before it is sent — carrier, adjuster, claim and policy numbers,
   defense counsel, billing and the signature never arrive. The example has to
   be redacted the same way or it would promise a view that does not exist.

   This list mirrors FIELD_KEEP in case-portal/worker.js. The Worker is what
   enforces it; this only keeps the example honest. A test compares the two so
   they cannot drift apart. */
const FIELD_KEEP = [
  "subject_name", "subject_address", "subject_description", "subject_relationship",
  "objective", "authorized_hours", "timeline", "notes", "attachments",
  "claim_type", "date_of_loss", "prior_surveillance",
  "start_date", "permitted_days", "permitted_times", "weekend_authorized",
  "priority", "geographic_limits",
];

function redactExample(c) {
  const kept = {};
  for (const k of FIELD_KEEP) if (c.payload[k] !== undefined) kept[k] = c.payload[k];
  return { ...c, carrier: null, claim_number: null, client_name: null, payload: kept };
}

/* An investigator only ever has cases assigned to them, so they see the claim
   example and not the unassigned intake — redacted, as a real one would be. */
function examplesFor(role) {
  return role === "admin"
    ? EXAMPLE_CASES
    : EXAMPLE_CASES.filter(c => c.kind === "claims").map(redactExample);
}
function isExample(caseNo) { return String(caseNo || "").startsWith("EXAMPLE-"); }

async function api(path, opts = {}){
  const res = await fetch(API + path, {
    credentials: "same-origin",
    headers: opts.body ? {"Content-Type":"application/json"} : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if(res.status === 401 && ME){ ME = null; paint(); throw new Error("Your session ended. Please sign in again."); }
  if(!res.ok) throw new Error(data.error || "That did not work. Please try again.");
  return data;
}

/* ------------------------------------------------------------------ views */

function loginView(){
  return `<div class="card narrow">
    <h1>Case Portal</h1>
    <p class="lead">Staff sign-in. Accounts are created by invitation only — there is no public sign-up.</p>
    <form data-act="login">
      <label class="f"><span>Username</span><input id="u" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="f"><span>Password</span><input id="p" type="password" autocomplete="current-password" required></label>
      <button class="btn" style="width:100%" id="loginBtn">Sign in</button>
      <div class="err" id="err"></div>
    </form>
  </div>`;
}

function inviteView(state){
  if(state.error){
    return `<div class="card narrow">
      <h1>Invitation not valid</h1>
      <p class="lead">${esc(state.error)}</p>
      <a class="btn" href="/portal/" style="display:inline-block;text-decoration:none">Go to sign-in</a>
    </div>`;
  }
  return `<div class="card narrow">
    <h1>Set your password</h1>
    <p class="lead">Welcome, ${esc(state.display_name || state.username)}. Choose a password for
      <b>${esc(state.username)}</b> (${state.role === "admin" ? "admin" : "investigator"}).
      Nobody else ever sees it — not even whoever invited you.</p>
    <form data-act="accept">
      <label class="f"><span>New password</span><input id="p1" type="password" autocomplete="new-password" required></label>
      <label class="f"><span>Confirm password</span><input id="p2" type="password" autocomplete="new-password" required></label>
      <p class="lead">At least 12 characters, with an uppercase letter, a lowercase letter and a digit.</p>
      <button class="btn" style="width:100%" id="acceptBtn">Create my account</button>
      <div class="err" id="err"></div>
    </form>
  </div>`;
}

function shell(inner){
  const tabs = ME.role === "admin"
    ? `<button class="${TAB==="cases"?"on":""}" data-act="tab" data-tab="cases">Cases</button>
       <button class="${TAB==="sheets"?"on":""}" data-act="tab" data-tab="sheets">Rate sheets</button>
       <button class="${TAB==="staff"?"on":""}" data-act="tab" data-tab="staff">Staff</button>`
    : "";
  return `<div class="tabs">${tabs}</div>${summaryCards()}${inner}`;
}

/* The dashboard strip. Drawn whether or not there is any work in the system —
   an empty portal that shows nothing at all looks broken, and a new admin needs
   to see the shape of the thing before the first case arrives. */
function summaryCards(){
  if(TAB === "staff" || TAB === "sheets") return "";
  const s = SUMMARY || {};
  const shown = SHOW_EXAMPLE ? examplesFor(ME.role) : [];
  const bump = k => shown.filter(c => c.status === k).length;
  const admin = ME.role === "admin";
  const card = (label, n, hint, tone) => `<div class="stat ${tone||""}">
      <div class="stat-n">${n}</div>
      <div class="stat-l">${esc(label)}</div>
      ${hint ? `<div class="stat-h">${esc(hint)}</div>` : ""}
    </div>`;

  const total = (s.total || 0) + shown.length;
  const cards = admin
    ? card("Cases", total, total ? "" : "None yet")
      + card("Unassigned", (s.unassigned || 0) + shown.filter(c => !c.assigned_name).length,
             "Waiting on you", (s.unassigned || bump("new")) ? "warn" : "")
      + card("In progress", (s.in_progress || 0) + bump("in_progress"), "Out in the field")
      + card("Carrier", (s.claims || 0) + shown.filter(c => c.kind === "claims").length, "Insurance work")
      + card("Private", (s.consumer || 0) + shown.filter(c => c.kind !== "claims").length, "Non-insurance")
    : card("Assigned to you", total, total ? "" : "Nothing yet")
      + card("In progress", (s.in_progress || 0) + bump("in_progress"), "Started")
      + card("Closed", (s.closed || 0) + bump("closed"), "Finished");

  // No Hide button here — the banner over the case list already carries one,
  // and two controls doing the same thing is how a page starts feeling
  // untrustworthy about which one you actually pressed.
  return `<div class="stats">${cards}</div>${
    SHOW_EXAMPLE ? `<div class="ex-note" style="margin-bottom:16px">
      <b>These totals include the example</b> &mdash; they drop back to your real numbers when you hide it.
    </div>` : ""}`;
}

/* Two documents the office sends: the retainer sheet for a private client, the
   block ladder for a carrier. Neither is on the public site — a price is quoted
   to someone who asked, not published to everyone who visits. */

        <div class="sheet-a">${esc(s.audience)}</div>

        <input id="sh_to" type="email" placeholder="name@example.com" value="${esc(SHEET_MAIL)}"></label>

    </div>

function casesView(){
  const q = FILTER.trim().toLowerCase();
  const admin = ME.role === "admin";
  const shown = SHOW_EXAMPLE ? CASES.concat(examplesFor(ME.role)) : CASES;
  const rows = shown.filter(c => !q || [c.case_no, c.client_name, c.subject_name, c.carrier, c.claim_number]
    .some(v => (v || "").toLowerCase().includes(q)));

  // Case numbers reach this markup from a public form, so they go in a data
  // attribute read by a delegated listener — never interpolated into script.
  //
  // The client/carrier column is admin-only: the Worker does not send those
  // fields to an investigator at all, so there is nothing to put in it.
  const body = rows.map(c => `
    <tr class="click${isExample(c.case_no) ? " ex" : ""}" data-act="openCase" data-case="${esc(c.case_no)}">
      <td class="mono">${esc(c.case_no)}</td>
      <td class="hide">${when(c.created_at)}</td>
      <td><span class="tag ${c.kind === "claims" ? "claims" : "consumer"}">${c.kind === "claims" ? "Claim" : "Client"}</span>${
        isExample(c.case_no) ? '<span class="tag ex-tag">Example</span>' : ""}</td>
      ${admin ? `<td>${esc(c.kind === "claims" ? (c.carrier || "—") : (c.client_name || "—"))}
          ${c.claim_number ? `<div class="mono">${esc(c.claim_number)}</div>` : ""}</td>
      <td class="hide">${esc(c.subject_name || "—")}</td>`
      : `<td>${esc(c.subject_name || "—")}</td>`}
      <td><span class="tag ${esc(c.status)}">${esc(label(c.status))}</span></td>
      ${admin ? `<td class="hide">${esc(c.assigned_name || "—")}</td>` : ""}
    </tr>`).join("");

  const more = TOTAL > CASES.length
    ? `<div class="note">Showing the ${CASES.length} most recent of ${TOTAL} cases. Search covers what is loaded.</div>` : "";

  const exBanner = SHOW_EXAMPLE ? `<div class="ex-note">
      <b>The rows marked Example are not real cases.</b> They are here to show the layout &mdash;
      ${ME.role === "admin"
        ? "a carrier assignment and a client intake, with every field filled in."
        : "an assignment exactly as one will look when it is given to you."}
      Open one to see the full detail. Nothing here is stored, and it disappears the moment you hide it.
      <button class="btn sm ghost" data-act="hideExample" style="margin-left:8px">Hide the example</button>
    </div>` : "";

  return `<div class="card">
    <div class="bar">
      <h2 style="margin:0">Cases</h2>
      <input id="q" placeholder="${admin ? "Search case, client, carrier, claim no." : "Search case or subject"}" value="${esc(FILTER)}" data-act="filter">
      ${SHOW_EXAMPLE ? "" : `<button class="btn sm ghost" data-act="showExample">Show an example</button>`}
      <span class="count">${rows.length} of ${shown.length}</span>
    </div>
    ${exBanner}
    ${more}
    ${rows.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>Case</th><th class="hide">Received</th><th>Type</th>
      ${admin ? `<th>Client / carrier</th><th class="hide">Subject</th>` : `<th>Subject</th>`}
      <th>Status</th>${admin ? `<th class="hide">Assigned</th>` : ""}</tr></thead>
      <tbody>${body}</tbody></table></div>`
      : `<div class="empty">${shown.length
            ? "Nothing matches that search."
            : (ME.role === "admin"
                ? "No submissions yet. Intake forms appear here as they arrive."
                : "Nothing assigned to you yet. Cases appear here when an admin assigns one.")
              + ` <button class="btn sm ghost" data-act="showExample" style="margin-left:8px">Show an example</button>`}</div>`}
  </div>`;
}

/* ------------------------------------------------------------- rendering */

function paint(){
  if(!ME){ app.innerHTML = loginView(); $("who").hidden = true; return; }
  $("who").hidden = false;
  $("who").innerHTML = `<b>${esc(ME.display_name || ME.username)}</b>${ME.role === "admin" ? "Admin" : "Investigator"}
    <button data-act="logout">Sign out</button>`;
  app.innerHTML = shell(TAB === "staff" ? staffView() : TAB === "sheets" ? sheetsView() : casesView());
  const q = $("q");
  if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

async function render(){
  if(!ME){ paint(); return; }
  try{
    const d = await api("/submissions?limit=200");
    CASES = d.submissions; TOTAL = d.total;
    // A first sign-in lands on an empty table, which teaches nothing. Show the
    // worked example unasked, once, until there is real work to look at.
    if(CASES.length === 0) SHOW_EXAMPLE = true;
    try{ SUMMARY = (await api("/summary")).summary; }catch(e){ SUMMARY = null; }
    if(ME.role === "admin"){
      USERS = (await api("/users")).users;
      INVITES = (await api("/invites")).invites;
      try{ SHEETS = (await api("/sheets")).sheets; }catch(e){ SHEETS = []; }
    }
  }catch(e){ /* paint anyway; the message surfaces on the next action */ }
  paint();
}

/* --------------------------------------------------------------- actions */

async function doLogin(){
  const btn = $("loginBtn"), err = $("err");
  btn.disabled = true; btn.textContent = "Signing in…"; err.textContent = "";
  try{
    ME = (await api("/auth/login", {method:"POST", body:{username:$("u").value, password:$("p").value}})).user;
    await render();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = "Sign in";
  }
}

async function doAccept(token){
  const btn = $("acceptBtn"), err = $("err");
  err.textContent = "";
  if($("p1").value !== $("p2").value){ err.textContent = "Those passwords do not match."; return; }
  btn.disabled = true; btn.textContent = "Creating…";
  try{
    ME = (await api(`/invite/${token}/accept`, {method:"POST", body:{password:$("p1").value}})).user;
    history.replaceState({}, "", "/portal/");   // keep the token out of the address bar
    await render();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = "Create my account";
  }
}

async function doLogout(){
  try{ await api("/auth/logout", {method:"POST"}); }catch{}
  ME = null; CASES = []; USERS = []; INVITES = []; TAB = "cases"; LAST_LINK = ""; LAST_EMAILED = false; paint();
}

/* The case workspace. A case is not a record to read, it is work in progress,
   so opening one lands on tabs rather than one long detail list. Only the tabs
   that do something today are shown — an empty "Evidence" tab would promise a
   feature that is not there. */
async function openCase(caseNo, tab){
  WS_CASE = caseNo; WS_TAB = tab || "overview"; WS_ERR = "";
  if(isExample(caseNo)){
    WS = null;   // examples are page-held demo data; they have no live workspace
    return paintCase();
  }
  try{
    const [sub, ws] = await Promise.all([
      api("/submissions/" + encodeURIComponent(caseNo)),
      api("/cases/" + encodeURIComponent(caseNo) + "/workspace"),
    ]);
    WS = { ...ws, submission: sub.submission };
  }catch(e){ alert(e.message); return; }
  paintCase();
}

async function reloadWorkspace(){
  if(!WS_CASE || isExample(WS_CASE)) return;
  try{
    const ws = await api("/cases/" + encodeURIComponent(WS_CASE) + "/workspace");
    WS = { ...ws, submission: WS ? WS.submission : null };
  }catch(e){ WS_ERR = e.message; }
  paintCase();
}

function wsTabs(){
  const admin = ME.role === "admin";
  const t = [["overview","Overview"], ["subject","Subject"], ["activity","Activity log"],
             ["field","Field work"], ["reports","Reports"]];
  // Authorization is the insurance panel; it appears once there is one, and
  // always for an admin so it can be set.
  if(admin || (WS && WS.authorization && WS.authorization.authorized_hours != null)) t.push(["auth","Authorization"]);
  if(admin) t.push(["assign","Assignment"]);
  return t;
}

function authPanel(a, admin){
  if(!a) return "";
  const bar = (used, total, pct, level) => {
    if(total == null) return "";
    const w = Math.max(0, Math.min(100, pct || 0));
    const tone = level >= 100 ? "over" : level >= 90 ? "high" : level >= 75 ? "warn" : "";
    return `<div class="meter ${tone}"><i style="width:${w}%"></i></div>`;
  };
  const hoursSet = a.authorized_hours != null;
  return `<div class="feebox">
    ${hoursSet ? `
      <div class="row"><span>Authorized</span><b>${esc(a.authorized_hours)} hours</b></div>
      <div class="row"><span>Used</span><b>${esc(a.hours_used)} hours</b></div>
      <div class="row"><span>Remaining</span><b>${esc(a.hours_remaining)} hours</b></div>
      ${bar(a.hours_used, a.authorized_hours, a.percent_used, a.warn_level)}
      ${a.warn_level != null ? `<div class="warnline ${a.warn_level >= 100 ? "over" : ""}">
         ${a.warn_level >= 100
           ? "<b>Authorization is used up.</b> Request more before any further work."
           : `<b>${esc(a.percent_used)}% of the authorization is used.</b> Past the ${esc(a.warn_level)}% mark.`}
       </div>` : ""}`
      : `<div class="row"><span>Authorized hours</span><span>Not set</span></div>`}
    ${admin && a.authorized_budget != null ? `
      <div class="row" style="border-top:1px solid #cfe6ec;margin-top:8px;padding-top:8px">
        <span>Authorized budget</span><b>$${esc(a.authorized_budget.toLocaleString())}</b></div>
      <div class="row"><span>Billable so far</span><b>$${esc(a.billable_so_far.toLocaleString())}</b></div>
      <div class="row"><span>Remaining</span><b>$${esc(a.budget_remaining.toLocaleString())}</b></div>
      <div class="row"><span style="color:var(--muted);font-size:.82rem">Billed at $${esc(a.billed_at_rate)}/hr</span><span></span></div>` : ""}
    ${a.miles_total ? `<div class="row"><span>Miles logged</span><span>${esc(a.miles_total)}</span></div>` : ""}
  </div>`;
}

function activityPanel(){
  const a = (WS && WS.activity) || [];

      <div class="qgrid">

      </div>
      <div class="two">
        <label class="f"><span>Date</span><input id="a_date" type="date" value="${today}"></label>
        <label class="f"><span>Time</span><input id="a_time" type="time" value="${now}"></label>
      </div>
      <label class="f"><span>What happened</span>
        <textarea id="a_desc" rows="2" placeholder="e.g. Subject departed residence in the white GMC Sierra."></textarea></label>
      <div class="two">
        <label class="f"><span>Location <span class="opt">optional</span></span><input id="a_loc" placeholder="e.g. 2214 Old Forest Rd"></label>
        <label class="f"><span>Vehicle <span class="opt">optional</span></span><input id="a_veh" placeholder="e.g. White GMC Sierra XKT-2209"></label>
      </div>
      <label class="f"><span>Internal note <span class="opt">optional, never client-facing</span></span><input id="a_note"></label>
      <button class="btn" type="submit">Add to the log</button>
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </form>

    ${a.length ? Object.keys(byDay).map(d => `
      <div class="tl-day">${esc(when(d + "T12:00:00Z"))}</div>
      <ol class="tl">
        ${byDay[d].map(e => `<li class="tl-i">
          <div class="tl-t">${esc(e.at_time)}</div>
          <div class="tl-b">
            <span class="tag ${esc(e.kind)}">${esc(label(e.kind))}</span>

          </div></li>`).join("")}
      </ol>`).join("")
      : `<div class="empty">Nothing logged on this case yet.</div>`}`;
}

           <label class="f"><span>Beginning mileage <span class="opt">optional</span></span><input id="d_smiles" inputmode="decimal"></label>
           <button class="btn" type="submit">Start investigation</button>
           ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
         </form>`}
    <h3 style="margin:18px 0 6px;font-size:1rem">Days on this case</h3>
    ${days.length ? `<div style="overflow-x:auto"><table>
      <thead><tr><th>Date</th><th>Hours</th><th class="hide">Miles</th><th class="hide">Investigator</th></tr></thead>
      <tbody>${days.map(d => `<tr>
        <td>${esc(d.day_date)}<div class="tl-m">${esc(d.start_time)}${d.end_time ? "–" + esc(d.end_time) : " · running"}</div></td>
        <td>${d.hours != null ? esc(d.hours) : "—"}</td>
        <td class="hide">${d.miles != null ? esc(d.miles) : "—"}</td>
        <td class="hide">${esc(d.investigator || "")}</td>
      </tr>${d.summary ? `<tr><td colspan="4" class="tl-n">${esc(d.summary)}</td></tr>` : ""}`).join("")}

/* Reports. The draft is assembled from the log, then it is a document someone
   writes — so the editor is a plain textarea, and nothing moves to the next
   stage without a person pressing a button. */
function reportsPanel(){
  const admin = ME.role === "admin";
  const reports = (WS && WS.reports) || [];
  const days = ((WS && WS.days) || []).filter(d => d.end_time);
  const reported = new Set(reports.map(r => r.day_id));
  const spare = days.filter(d => !reported.has(d.id));
  const open = reports.find(r => r.id === WS_REPORT);

  const badge = s => `<span class="tag rs-${esc(s)}">${esc(reportLabel(s))}</span>`;

  return `
    ${spare.length ? `<form class="quick" data-act="genReport">
        <label class="f"><span>Draft a daily report from the activity log</span>
          <select id="r_day">${spare.map(d =>
            `<option value="${d.id}">${esc(d.day_date)} — ${esc(d.start_time)}–${esc(d.end_time || "")}${
              d.hours != null ? ` (${esc(d.hours)} hrs)` : ""}</option>`).join("")}</select></label>
        <button class="btn" type="submit">Generate draft</button>
        <p class="hint">It assembles the chronology from what you logged and formats the times.
          The wording stays yours &mdash; read every line before it goes anywhere.</p>
        ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
      </form>`
      : `<div class="note">${days.length
          ? "Every completed day on this case already has a report."
          : "End an investigation day first — a report is drafted from a day's activity log."}</div>`}

    ${reports.length ? `<div class="rlist">${reports.map(r => `
      <button class="rcard${r.id === WS_REPORT ? " on" : ""}" data-act="openReport" data-id="${r.id}">
        <div class="rc-h"><b>${esc(r.report_date)}</b> ${badge(r.status)}</div>
        <div class="tl-m">${esc(r.investigator || "")}${r.updated_at ? " · edited" : ""}</div>
        ${r.review_note ? `<div class="tl-n">Office note: ${esc(r.review_note)}</div>` : ""}
      </button>`).join("")}</div>` : ""}

    ${open ? `<div class="quick" style="margin-top:14px">
      <div class="rc-h" style="margin-bottom:8px"><b>${esc(open.report_date)}</b> ${badge(open.status)}</div>
      <textarea id="r_body" rows="16" class="rbody" ${
        (!admin && !["draft","needs_revision"].includes(open.status)) ? "readonly" : ""
      }>${esc(open.body)}</textarea>
      <div class="ractions">
        ${(admin || ["draft","needs_revision"].includes(open.status))
          ? `<button class="btn sm" data-act="saveReport" data-id="${open.id}">Save changes</button>` : ""}
        ${["draft","needs_revision"].includes(open.status)
          ? `<button class="btn sm ghost" data-act="reportStatus" data-id="${open.id}" data-to="submitted">Submit for review</button>` : ""}
        ${admin && open.status === "submitted" ? `
          <button class="btn sm ghost" data-act="reportStatus" data-id="${open.id}" data-to="needs_revision">Send back</button>
          <button class="btn sm" data-act="reportStatus" data-id="${open.id}" data-to="approved">Approve</button>` : ""}
        ${admin && open.status === "approved"
          ? `<button class="btn sm" data-act="reportStatus" data-id="${open.id}" data-to="delivered">Mark delivered</button>` : ""}
      </div>
      ${admin && open.status === "submitted"
        ? `<label class="f" style="margin-top:10px"><span>Note back to the investigator <span class="opt">optional</span></span>
             <input id="r_note" placeholder="What needs changing"></label>` : ""}
      ${!admin && open.status === "submitted"
        ? `<p class="hint">With the office for review. You will see a note here if anything needs changing.</p>` : ""}
      ${WS_ERR ? `<div class="err">${esc(WS_ERR)}</div>` : ""}
    </div>` : ""}`;
}

const reportLabel = s => ({draft:"Draft", submitted:"Submitted", needs_revision:"Needs revision",
                           approved:"Approved", delivered:"Delivered"}[s] || s);

function authAdminForm(){
  const a = (WS && WS.authorization) || {};
  const types = (WS && WS.case_types) || [];
  const ins = types.filter(t => t.side === "insurance"), pri = types.filter(t => t.side === "private");
  const opt = t => `<option value="${t.id}" ${t.id === a.case_type_id ? "selected" : ""}>${esc(t.label)}</option>`;
  return `<form class="quick" data-act="saveMeta">
    <label class="f"><span>Case type</span>
      <select id="m_type">
        <option value="">— not set —</option>
        <optgroup label="Insurance">${ins.map(opt).join("")}</optgroup>
        <optgroup label="Private">${pri.map(opt).join("")}</optgroup>
      </select></label>
    <div class="two">
      <label class="f"><span>Authorized hours</span><input id="m_hours" inputmode="decimal" value="${a.authorized_hours ?? ""}"></label>

    <button class="btn" type="submit">Save authorization</button>

function paintCase(){
  const admin = ME.role === "admin";
  if(isExample(WS_CASE)) return paintExampleCase();
  if(!WS) return;
  const s = WS.submission || {};
  const a = WS.authorization || {};

  const panel =
      WS_TAB === "activity" ? activityPanel()
    : WS_TAB === "field"    ? fieldPanel()
    : WS_TAB === "reports"  ? reportsPanel()
    : WS_TAB === "auth"     ? authPanel(a, admin) + (admin ? authAdminForm() : "")
    : WS_TAB === "assign"   ? assignPanel(s)
    : WS_TAB === "subject"  ? detailList(s, "subject")
    :                         detailList(s, "overview") + (a.authorized_hours != null ? authPanel(a, admin) : "");

  $("dlgBody").innerHTML = `
    <h2>${esc(a.case_type || (s.kind === "claims" ? "Claim assignment" : "Client intake"))}</h2>
    <div class="case">${esc(WS_CASE)}</div>
    <div class="wstabs">${wsTabs().map(([k, lbl]) =>
      `<button class="${WS_TAB === k ? "on" : ""}" data-act="wsTab" data-tab="${k}">${esc(lbl)}</button>`).join("")}</div>
    <div class="wspanel">${panel}</div>`;
  if(!$("dlg").open) $("dlg").showModal();
}

async function openExampleCase(caseNo){ WS_CASE = caseNo; WS = null; paintExampleCase(); }

      ${row("Description", p.subject_description)}${row(claim ? "Injury & restrictions" : "Relationship", p.subject_relationship)}
      ${row(claim ? "Scope" : "Objective", p.objective)}${row("Authorized hours", p.authorized_hours)}
      ${row("Not to exceed", p.not_to_exceed)}${row("Requested start", p.start_date)}

/* The intake detail, split so the workspace can show what the field needs
   (subject) apart from what the office needs (everything). Both read from the
   same submission — the Worker has already removed whatever this role may not
   see, so nothing here decides that. */
function detailList(s, mode){
  const p = s.payload || {};
  const row = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
  const claim = s.kind === "claims";
  const sig = safeImage(p.signature);

  if(mode === "subject"){
    return `<dl class="detail">
      ${row(claim ? "Claimant" : "Subject", p.subject_name)}${row("Address", p.subject_address)}
      ${row("Description", p.subject_description)}
      ${row(claim ? "Injury & restrictions" : "Relationship", p.subject_relationship)}
      ${row("Prior surveillance", p.prior_surveillance)}
      ${row(claim ? "Scope" : "Objective", p.objective)}
      ${row("Permitted days", p.permitted_days)}${row("Permitted times", p.permitted_times)}
      ${row("Weekend", p.weekend_authorized)}${row("Geographic limits", p.geographic_limits)}
      ${row("Field notes", p.notes)}
    </dl>`;
  }
  return `<dl class="detail">
    ${claim ? `${row("Carrier / TPA", p.carrier)}${row("Claim number", p.claim_number)}${row("Policy number", p.policy_number)}
               ${row("Claim type", p.claim_type)}${row("Date of loss", p.date_of_loss)}${row("Adjuster", p.adjuster)}
               ${row("Adjuster email", p.adjuster_email)}${row("Adjuster phone", p.adjuster_phone)}
               ${row("Defense counsel", p.defense_counsel)}` : ""}
    ${row(claim ? "Assigning contact" : "Client", p.client_name)}${row("Phone", p.client_phone)}${row("Email", p.client_email)}
    ${claim ? "" : `${row("Address", p.client_address)}${row("Best time", p.best_time)}`}
    ${row(claim ? "Claimant" : "Subject", p.subject_name)}
    ${row(claim ? "Scope" : "Objective", p.objective)}
    ${row("Authorized hours", p.authorized_hours)}${row("Not to exceed", p.not_to_exceed)}
    ${row("Requested start", p.start_date)}${row("Priority", p.priority)}
    ${row(claim ? "Deadline" : "Timeline", p.timeline)}${row("Attachments", p.attachments)}
    ${claim ? `${row("Billing reference", p.billing_reference)}${row("Invoices to", p.billing_email)}${row("Billing notes", p.billing_notes)}` : ""}
    ${row(claim ? "Authorized by" : "Signed by", p.signed_name)}
    ${row("Received", when(s.created_at))}
  </dl>
  ${sig ? `<div><div style="font-size:.8rem;color:var(--muted)">Signature</div><img class="sig" src="${esc(sig)}" alt="signature"></div>` : ""}`;
}

}

async function setReportStage(id, to){

    await api(`/cases/${encodeURIComponent(WS_CASE)}/meta`, {method:"POST", body:{
      case_type_id: $("m_type").value,
      authorized_hours: $("m_hours").value,

    }});

async function saveCase(caseNo){
  const err = $("derr"); err.textContent = "";
  const uid = $("asg").value;
  try{
    await api(`/submissions/${encodeURIComponent(caseNo)}/assign`, {method:"POST", body:{user_id: uid === "" ? null : Number(uid)}});
    await api(`/submissions/${encodeURIComponent(caseNo)}/status`, {method:"POST", body:{status: $("sts").value}});
    $("dlg").close();
    await render();
  }catch(e){ err.textContent = e.message; }

async function doInvite(){
  const err = $("uerr"), okm = $("uok"); err.textContent = ""; okm.textContent = "";
  try{
    // Read the address before render() rebuilds the form and clears the field.
    const addr = $("nv_email").value.trim();
    const r = await api("/invites", {method:"POST", body:{
      username: $("nv_user").value.trim().toLowerCase(),
      display_name: $("nv_name").value.trim(),
      email: addr,
      role: $("nv_role").value,
    }});
    LAST_LINK = r.url;
    LAST_EMAILED = r.emailed === true;
    await render();
    const o = $("uok");
    if(o) o.textContent = LAST_EMAILED
      ? `Invitation emailed to ${addr}.`
      : (addr
          ? "Invitation created, but nothing was emailed — send them the link below yourself."
          : "Invitation created. Copy the link below and send it to them.");
  }catch(e){ err.textContent = e.message; }
}

async function toggleActive(id, active){
  if(!active && !confirm("Disable this account? Any session they have open ends immediately.")) return;
  try{ await api(`/users/${id}/active`, {method:"POST", body:{active: Boolean(active)}}); await render(); }
  catch(e){ alert(e.message); }
}

async function revokeInvite(id){
  if(!confirm("Revoke this invitation? The link stops working immediately.")) return;
  try{ await api(`/invites/${id}/revoke`, {method:"POST"}); LAST_LINK = ""; LAST_EMAILED = false; await render(); }
  catch(e){ alert(e.message); }
}

async function emailSheet(id){
  const to = ($("sh_to").value || "").trim();
  const note = ($("sh_note") ? $("sh_note").value : "").trim();
  const caseNo = ($("sh_case") ? $("sh_case").value : "").trim();
  SHEET_MAIL = to;
  if(!to){ SHEET_MSG = "Enter the address to send it to."; paint(); return; }
  const btn = document.querySelector('[data-act="emailSheet"]');
  if(btn){ btn.disabled = true; btn.textContent = "Sending…"; }
  try{
    const r = await api(`/sheets/${encodeURIComponent(id)}/email`,
      {method:"POST", body:{to, note, case_no:caseNo}});
    SHEET_MSG = `Sent to ${r.sent_to}.`;
    SHEET_MAIL = "";
  }catch(e){ SHEET_MSG = e.message; }
  paint();
}

/* --------------------------------------------------------- event routing */
/* One delegated listener. Nothing user-supplied is ever written into an
   inline handler, where the browser would decode it back into script. */

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act === "closeDlg"){ $("dlg").close(); }
  else if(act === "tab"){ TAB = el.dataset.tab; paint(); }
  else if(act === "showExample"){ SHOW_EXAMPLE = true; paint(); }
  else if(act === "hideExample"){ SHOW_EXAMPLE = false; paint(); }
  else if(act === "logout"){ doLogout(); }
  else if(act === "openCase"){ openCase(el.dataset.case); }
  else if(act === "saveCase"){ saveCase(el.dataset.case); }
  else if(act === "toggleActive"){ toggleActive(Number(el.dataset.id), Number(el.dataset.active)); }
  else if(act === "revokeInvite"){ revokeInvite(Number(el.dataset.id)); }
  else if(act === "wsTab"){ WS_TAB = el.dataset.tab; WS_ERR = ""; paintCase(); }
  else if(act === "openReport"){
    WS_REPORT = WS_REPORT === Number(el.dataset.id) ? null : Number(el.dataset.id);
    WS_ERR = ""; paintCase();
  }
  else if(act === "saveReport"){ saveReportBody(Number(el.dataset.id)); }
  else if(act === "reportStatus"){ setReportStage(Number(el.dataset.id), el.dataset.to); }
  else if(act === "openSheet"){
    OPEN_SHEET = OPEN_SHEET === el.dataset.sheet ? null : el.dataset.sheet;
    SHEET_MSG = ""; paint();
  }
  else if(act === "emailSheet"){ emailSheet(el.dataset.sheet); }
  else if(act === "copyLink"){
    navigator.clipboard.writeText(LAST_LINK).then(() => { el.textContent = "Copied"; });
  }
  else if(act === "mailLink"){
    ev.preventDefault();
    const subject = encodeURIComponent("Your Always Precise case portal login");
    const body = encodeURIComponent(
      "You have been given access to the Always Precise Investigations case portal.\n\n" +
      "Open this link to choose your password:\n" + LAST_LINK +
      "\n\nThe link works once and expires in 7 days.");
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  }
});

document.addEventListener("submit", ev => {
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  ev.preventDefault();
  const a = el.dataset.act;
  if(a === "login") doLogin();
  else if(a === "invite") doInvite();
  else if(a === "accept") doAccept(new URLSearchParams(location.search).get("invite") || "");
  else if(a === "addActivity") addActivityEntry();
  else if(a === "startDay") startInvestigationDay();
  else if(a === "endDay") endInvestigationDay();
  else if(a === "saveMeta") saveCaseMeta();
  else if(a === "genReport") generateReportDraft();
});

document.addEventListener("input", ev => {
  if(ev.target.dataset && ev.target.dataset.act === "filter"){ FILTER = ev.target.value; paint(); }
});

/* ------------------------------------------------------------------- boot */

(async function boot(){
  const token = new URLSearchParams(location.search).get("invite");
  if(token){
    try{
      const s = await api("/invite/" + encodeURIComponent(token));
      app.innerHTML = inviteView(s);
    }catch(e){
      app.innerHTML = inviteView({error: e.message});
    }
    return;
  }
  try{
    ME = (await api("/auth/me")).user;   // resume an existing session
    await render();
  }catch{ paint(); }
})();
</script>
</body>
</html>
