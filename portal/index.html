   investigator actually entered: leave a box empty and its clause never
   appears, so the template can never assert a vehicle or a vantage nobody
   observed. And it stops regenerating the moment the narrative is hand-edited
   — past that point the hand is the author, and a later keystroke in an extras
   box must not overwrite what a person wrote.

   ONE function serves the desk sheet and the field mode, so a line composed in
   the car and the same line composed at the office cannot drift apart. */
const ARRIVAL_VIEW = [
  ["direct",   "Direct view",   "direct"],
  ["indirect", "Indirect view", "indirect"],
];
const ARRIVAL_PLACE = [
  ["primary",   "Primary route of departure", "along the primary route of departure"],
  ["secondary", "Secondary route",            "along a secondary route"],
  ["mobile",    "Mobile surveillance",        ""],
];
function arrivalSentence(vp, view, place, pos){
  const v = String(vp || "").trim().replace(/\.$/, "");
  const p = String(pos || "").trim().replace(/\.$/, "");
  const vw = (ARRIVAL_VIEW.find(o => o[0] === view) || [])[2] || "";
  const pl = ARRIVAL_PLACE.find(o => o[0] === place);
  let clause = "";
  if(place === "mobile"){
    // Mobile is not a position one establishes a view from — it is the method.
    clause = `Established ${vw ? `${vw} ` : ""}mobile surveillance`;
  } else if(vw || pl){
    const art = vw === "indirect" ? "an" : "a";
    clause = `Established ${vw ? `${art} ${vw}` : "a"} surveillance position${pl ? ` ${pl[2]}` : ""}`;
  }
  return ARRIVAL_LINE
    + (v ? ` ${v} present.` : "")
    + (clause ? ` ${clause}${p ? ` ${p}` : ""}.`
       : p ? ` Established surveillance position ${p}.` : "");
}

/* Times are entered 24-hour by the clock widget and read 12-hour by people;
   the reports already write 12-hour, so the timeline matches them. */
function t12(hhmm){
  const h = parseInt(String(hhmm).slice(0,2), 10), m = String(hhmm).slice(3,5);
  if(!Number.isFinite(h)) return String(hhmm || "");
  return `${h % 12 === 0 ? 12 : h % 12}:${m} ${h < 12 ? "AM" : "PM"}`;
}
function fmtDay(d){
  const t = new Date(String(d) + "T00:00:00");   // local midnight — no timezone drift
  return isNaN(t) ? String(d) : t.toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric", year:"numeric"});
}

/* The calendar date HERE, where the investigator is standing.

   Every surveillance DATE used to come from `toISOString().slice(0,10)` while
   every surveillance TIME came from `toTimeString().slice(0,5)` — UTC against
   local, on the same line and in the same submitted record. In EDT that is
   four hours of disagreement every evening: at 20:15 on the 14th the page
   filed `2026-08-15` beside `20:15`, so evening surveillance — the bulk of
   this firm's work — was recorded a day late, with the times of the day
   before. It reached `case_days.day_date`, `case_reports.report_date` (which
   the Worker derives from it) and the timeline's ORDER BY, so a day could sort
   ahead of itself.

   `fmtDay` above already guards the reverse trip for the same reason. Use this
   for any date a HUMAN means by "today"; keep `toISOString()` for instants,
   which are genuinely UTC and stored that way. */
function ymdLocal(d){
  const t = d || new Date();
  const p = n => String(n).padStart(2, "0");
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())}`;
}
const hmLocal = d => (d || new Date()).toTimeString().slice(0,5);

/* A date and a time that belong to each other, from ONE reading of the clock.

   Every pairing in this file used to call `new Date()` twice — once for the
   date, once for the time — and two readings can fall either side of midnight.
   The window is sub-millisecond and it would be indistinguishable from a
   mystery if it ever fired: an entry stamped 23:59:59.9997 on one day and
   00:00:00.0001 on the next, filed with tomorrow's date and last night's time,
   sorting ahead of everything before it. Nothing detects that afterwards.

   So the invariant is made structural rather than improbable: one instant,
   both halves. Use this anywhere a date and a time are captured together;
   `ymdLocal` and `hmLocal` alone are for when only one of them is wanted. */
function stampNow(){
  const d = new Date();
  return { date: ymdLocal(d), time: hmLocal(d) };
}

async function api(path, opts = {}){
  const res = await fetch(API + path, {
    credentials: "same-origin",
    headers: opts.body ? {"Content-Type":"application/json"} : {},
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  /* A session that ended is a session boundary too — the same clear-down as
     signing out, or an expiry leaves the next person exactly where the last one
     was standing. */
  if(res.status === 401 && ME){ sessionForget(); paint(); throw new Error("Your session ended. Please sign in again."); }
  if(!res.ok){
    /* Carry the status and the body on the error. Callers that need to act on
       WHICH failure it was — a stale idempotency token, a finalize refused by
       its gates — cannot tell from a message string, and matching on prose is
       how a rule ends up encoded in two places. */
    const err = new Error(data.error || "That did not work. Please try again.");
    err.status = res.status;
    Object.assign(err, data);
    throw err;
  }
  return data;
}

     the keys behind Intakes, Billing and Rate Sheets.

     Tasks & Follow-ups and Clients & Contacts are deliberately absent. Neither
     has a cross-case route behind it, and this file's rule is that a tab
     arrives with its feature rather than sitting dead. */
  const item = (id, label) => `<button class="${TAB === id ? "on" : ""}"${
    TAB === id ? ` aria-current="page"` : ""} data-act="tab" data-tab="${id}">${label}</button>`;
  const group = (title, ...items) => `<div class="navgrp">${title}</div>${items.join("")}`;

  /* The two doors that DO something rather than going somewhere. Kept in one
     separated block at the foot of the rail so they read as actions, and so
     Active Surveillance — the field view's only top-level entrance — is not
     buried mid-list where it sat for the investigator. */
  const foot = `<div class="navfoot">
    <button class="side-surv" data-act="surveillance">&#128373; Active Surveillance</button>
    <!-- Timestamp Video is a door that does something, so it belongs in this
         block rather than in a list of places. It is here for BOTH roles and
         on every screen: an investigator has no Dashboard, and the owner's
         rule is that nobody should have to open a case to reach the utility.
         The case it belongs to is chosen inside it, against the caller's own
         case list — so the authorization boundary is the one it always was. -->
    <button class="side-vst" data-act="vstOpen" data-case="">&#127909; Timestamp Video</button>
    <!-- And its sibling. PHOTO-TIMESTAMP.md D1 put this on the photograph only;
         with nothing uploaded there was then no way in at all, which is how the
         owner came to look for it here and find nothing. -->
    <button class="side-vst" data-act="pstLaunch" data-case="">&#128247; Timestamp Photo</button>${
    ME.role === "admin"
      ? `<button class="side-intake" data-act="tab" data-tab="newlead">+ Intake a Client</button>` : ""}
  </div>`;

  const tabs = (ME.role === "admin"
    ? group("Operations",
        item("dashboard", "&#8962; Dashboard"),
        item("search", "&#128269; Search"),
        item("cases", "&#128193; Cases"),
        item("leads", "&#128234; Intakes"),
        item("profiles", "&#127970; Clients &amp; Firms"),
        item("calendar", "&#128197; Calendar"))
      + group("Delivery &amp; Billing",
        item("delivery", "&#128230; Reports &amp; Packages"),
        item("sheets", "&#128179; Rate Sheets"),
        item("invoices", "&#129534; Billing"))
      + group("Team &amp; System",
        item("staff", "&#128101; Staff"),
        item("settings", "&#9881; Settings"))
    : group("Operations",
        /* The field gets the same door. What it FINDS is decided in the
           Worker, scoped to their own cases — not by leaving the door out. */
        item("search", "&#128269; Search"),
        item("cases", "&#128193; My assignments"),
        item("today", "&#9728; Today"),
        item("calendar", "&#128197; Calendar"))
      + group("Delivery",
        item("myreports", "&#128196; Reports"),
        item("myexpenses", "&#129534; Expenses"))
    ) + foot;
  // The schema notice comes first and is specific, because it is the one cause
  // that explains every other symptom at once.
  const schema = SCHEMA_MISSING.length ? `<div class="loaderr">
      <b>The database is not fully set up yet.</b> ${SCHEMA_MISSING.length}
      ${SCHEMA_MISSING.length === 1 ? "table is" : "tables are"} missing, so parts of the portal
      will fail until the schema is applied.
      <div style="font-size:.86rem;margin-top:8px">
        Fix it in one run: <b>GitHub &rarr; Actions &rarr; Set up the case portal &rarr; Run
        workflow</b>. It is safe to re-run &mdash; it finds the existing database, adds only what
        is missing, and leaves your account alone.
      </div>
      <div style="font-size:.78rem;margin-top:6px;opacity:.85">Missing: <span class="mono">${
        SCHEMA_MISSING.map(esc).join(", ")}</span></div>
      <button class="btn sm ghost" data-act="reload" style="margin-top:10px">Check again</button>
    </div>` : "";

  const problem = LOAD_ERR ? `<div class="loaderr">
      <b>Something did not load.</b> ${esc(LOAD_ERR)}
      <button class="btn sm ghost" data-act="reload" style="margin-left:8px">Try again</button>
      <div style="font-size:.82rem;margin-top:6px">Nothing below is necessarily the whole picture
        while this is showing.</div>
    </div>` : "";
  /* The send wizard is an overlay, mounted here rather than inside the Rate
     sheets view so a lead card can open it too (MASTER §5). */
  /* QUICK TOOLS SIT HERE, NOT IN A VIEW (owner, 2026-08-18 — "the live dashboard
     does not visibly show the timestamp video quick tool").

     It was only ever drawn by `dashView()`, and that is the condition that hid
     it. Two ways that bites, both real: an INVESTIGATOR has no Dashboard at all,
     and under 900px the navigation rail — where the other copy lives — is behind
     the burger, so on a phone anywhere but the Dashboard the only door was
     inside a menu. The owner ruled that out by name.

     Drawn once, from the shell, so it is in the same place on every top-level
     screen for both roles. The case workspace and the field view do not go
     through `shell()` and are deliberately untouched: each has its own door. */
  return `<div class="tabs">${tabs}</div>${schema}${problem}${quickToolsHtml()}${
    summaryCards()}${inner}${
    SHEET_WIZ ? sheetWizardHtml() : ""}${PAY_SEND ? paySendHtml() : ""}${
    INTAKE_SEND ? preIntakeHtml() : ""}`;
}


/* --------------------------------------------------------- the dashboard */

/* UIBUILD P2-P4: the admin's landing view. The operational cards up top,
   the Outstanding balance, then the Case Package cards — each with its ring,
   its module states and ONE computed next step. Centralized logic (P24):
   pkgProgress and pkgNextStep are the only places that decide. */
let PKGS = null;
/* WHETHER A READ SUCCEEDED, NOT JUST WHAT IT RETURNED (Codex stop-time review,
   2026-08-16). Both of these substitute an EMPTY value when they fail —
   `PKGS = {packages: []}` and `CASES = []` — which is byte-identical to a
   portal that genuinely has no work in it. Anything that answers "is there
   anything to do?" has to be able to tell those apart, or it eventually
   answers "no" on behalf of a read that never happened. */
let PKGS_OK = false, CASES_OK = false;

async function loadPackages(){
  try{ PKGS = await api("/packages"); PKGS_OK = true; }
  catch(e){ PKGS = {packages: [], outstanding: 0}; PKGS_OK = false; LOAD_ERR = e.message; }
  paint();
}

/* One writer for the completed desk, because it now has two doors — the Cases
   lens and Reports & Packages. Fetched on every arrival so the desk is never
   stale after a case was closed in another tab, and a failure is CARRIED
   (completedDesk draws COMPLETED.error) rather than painting an empty desk,
   which would read as "nothing has ever been finished". */
function loadCompleted(){
  COMPLETED = null; paint();
  return api("/completed").then(d => { COMPLETED = d; paint(); })
    .catch(e => { COMPLETED = {completed: [], error: e.message}; paint(); });
}

/* scope "field" (UIBUILD P15) is the investigator's version of both helpers:
   the modules they can see and the steps that are theirs — build and invoice
   are the office's and never appear. Same functions, one flag (P24). */
function pkgProgress(p, scope){
  const mods = [];
  mods.push(["activity", p.activity_count > 0 ? "done" : "none", `${p.activity_count} entr${p.activity_count === 1 ? "y" : "ies"}`]);
  mods.push(["report", ["approved", "delivered"].includes(p.report_status) ? "done" : p.report_status ? "part" : "none",
             p.report_status ? label(p.report_status) : "None"]);
  mods.push(["photos", p.photos > 0 ? "done" : "none", String(p.photos)]);
  if(p.videos > 0) mods.push(["video", "done", String(p.videos)]);
  if(scope !== "field"){
    mods.push(["build", p.build_status === "finalized" ? "done" : p.build_status ? "part" : "none",
               p.build_status === "finalized" ? "Final" : p.build_status ? "Draft" : "Not started"]);
    mods.push(["invoice", p.invoice_status === "paid" ? "done" : p.invoice_status ? "part" : "none",
               p.invoice_status ? label(p.invoice_status) : "Not created"]);
  }
  const done = mods.filter(m => m[1] === "done").length;
  return { mods, done, total: mods.length, pct: Math.round((done / mods.length) * 100) };
}

/* One vocabulary for module labels and where each one lives, shared by the
   dashboard cards and the case overview (UIBUILD P24). The tab keys are
   WS_TAB keys — openCase() and the case page both route by them. */
const MOD_LABEL = {activity: "Activity", report: "Report", photos: "Photos", video: "Video",
                   build: "Build", invoice: "Invoice"};
const MOD_TAB = {activity: "activity", report: "reports", photos: "evidence", video: "evidence",
                 build: "package", invoice: "billing"};

function pkgNextStep(p, scope){
  if(p.open_day) return {label: "Continue activity log", tab: "activity"};
  if(!p.days) return {label: "Start investigation day", tab: "field"};
  if(!p.report_status) return {label: "Draft the report", tab: "reports"};
  if(!["approved", "delivered"].includes(p.report_status)){
    if(scope === "field") return p.report_status === "submitted"
      ? {label: "Submitted — with the office for review", tab: "reports"}
      : {label: "Finish and submit the report", tab: "reports"};
    return {label: "Review report", tab: "reports"};
  }
  if(scope === "field") return {label: "Assignment complete — with the office", tab: "reports"};
  if(p.build_status !== "finalized") return {label: "Build case package", tab: "package"};
  if(!p.invoice_status) return {label: "Create invoice", tab: "billing"};
  if(p.invoice_status !== "paid") return {label: "Track the invoice", tab: "billing"};
  return {label: "Ready to close", tab: "billing"};
}

function ringHtml(pct){
  const r = 26, c = 2 * Math.PI * r;
  return `<svg class="pc-ring" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="${pct}% complete">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#e4e9ed" stroke-width="6"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${pct >= 100 ? "#2e7d4f" : "#2f7d90"}" stroke-width="6"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(100, pct) / 100)}"
      stroke-linecap="round" transform="rotate(-90 32 32)"/>
    <text x="32" y="30" text-anchor="middle" font-size="13" font-weight="800" fill="#13273f">${pct}%</text>
    <text x="32" y="43" text-anchor="middle" font-size="7" fill="#5c6775">Complete</text>
  </svg>`;
}

function pkgCard(p){
  const prog = pkgProgress(p);
  const next = pkgNextStep(p);
  const mark = st => st === "done" ? "&#10003;" : st === "part" ? "&#9685;" : "&#9675;";
  const authLine = p.kind === "claims"
    ? (p.authorized_hours != null
        ? `Auth: ${esc(p.authorized_hours)} hrs${p.authorized_budget != null ? " / $" + esc(p.authorized_budget.toLocaleString()) : ""} &middot; Used: ${esc(p.hours_used)} hrs`
        : "No authorization set")
    : (p.retainer
        ? `Retainer: $${esc(p.retainer.amount.toLocaleString())} &middot; Balance: $${esc(p.retainer.remaining.toLocaleString())}`
        : "Private client");
  return `<div class="pcard">
    <div class="pc-top">
      <div>
        <span class="tag ${p.kind === "claims" ? "claims" : "consumer"}">${esc(p.case_type || (p.kind === "claims" ? "Insurance" : "Private"))}</span>
        <div style="font-weight:800;margin-top:5px">${esc(p.client || "")}</div>
        <div style="font-size:.85rem;color:var(--muted)">${esc(p.subject || "")}</div>
        <div class="mono" style="font-size:.72rem;margin-top:3px">${esc(p.case_no)}</div>
        <div style="font-size:.76rem;color:var(--muted);margin-top:4px">${authLine}</div>
      </div>
      ${ringHtml(prog.pct)}
    </div>
    <div class="pc-mods">
      ${prog.mods.map(([id, st, sub]) => `<button class="pc-m ${st}" data-act="pkgJump"
          data-case="${esc(p.case_no)}" data-tab="${MOD_TAB[id]}">
        <b>${mark(st)}</b>${MOD_LABEL[id]}<div>${esc(sub)}</div></button>`).join("")}
    </div>
    <div class="pc-next">
      <div><small>Next step</small><b>${esc(next.label)}</b></div>
      <button class="btn sm" data-act="pkgJump" data-case="${esc(p.case_no)}" data-tab="${next.tab}">
        Continue case &rarr;</button>
    </div>
  </div>`;
}

/* SURVEILLANCE P18 — who is out right now. Operational only: who, which case,
   when they started, how long, and how recently they logged something. No
   location and no GPS — the handoff is explicit that this phase tracks nobody's
   position. Drawn only when someone is actually out. */
function outNowHtml(){
  const rows = (OUT_NOW && OUT_NOW.out_now) || [];
  if(!rows.length) return "";
  const skew = OUT_NOW.server_now ? Date.parse(OUT_NOW.server_now) - Date.now() : 0;
  const ago = iso => {
    if(!iso) return "—";
    const m = Math.max(0, Math.round(((Date.now() + skew) - Date.parse(iso)) / 60000));
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
  };
  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Out now</h2>
      <span class="count">${rows.length} in the field</span></div>
    <div class="stacktbl" style="overflow-x:auto"><table>
      <thead><tr><th>Investigator</th><th>Case</th><th>Started</th><th>Elapsed</th><th class="hide">Last activity</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="click" data-act="openCase" data-case="${esc(r.case_no)}">
        <td data-l="Investigator"><b>${esc(r.investigator || "—")}</b></td>
        <td class="mono" data-l="Case">${esc(r.case_no)}<div class="tl-m">${esc(r.subject_name || "")}</div></td>
        <td data-l="Started">${esc(t12(r.start_time))}</td>
        <td data-l="Elapsed">${ago(r.started_at)}</td>
        <td class="hide" data-l="Last activity">${r.last_activity
          ? `${esc(String(r.last_activity.description || "").slice(0, 44))}
             <div class="tl-m">${ago(r.last_activity.created_at)} ago &middot; ${r.activity_count} total</div>`
          : `<span class="tl-m">Nothing logged yet</span>`}</td>
      </tr>`).join("")}</tbody></table></div>
  </div>`;
}

/* ONE WRITER FOR THE CARD, TWO BEHAVIOURS (2026-08-16).

   On Cases the strip sits directly above the list it filters, so a card
   narrows in place. On the Dashboard there is no list underneath, so a card
   that only set a filter would appear to do nothing — it carries `go`, the tab
   that actually shows what it counted. The markup is shared so the two can
   never drift apart visually while behaving differently. */
function statCard(label, n, hint, tone, opts){
  const o = opts || {};
  const set = Array.isArray(o.set) ? o.set : null;
  // Clickable only when there is something behind it. A card offering to show
  // you nothing is a dead control.
  const act = (set && set.length) || (o.go && n) ? true : false;
  const on = set && set.length && CARD_FILTER && CARD_FILTER.label === label;
  const attrs = !act ? ""
    : set && set.length
      ? ` data-act="cardFilter" data-label="${esc(label)}" data-set="${esc(set.join(","))}"${
          o.go ? ` data-go="${esc(o.go)}"` : ""}`
      : ` data-act="tab" data-tab="${esc(o.go)}"`;
  /* VISUAL PHASE 1 — a zero is still the truth and is still shown, but it must
     not shout as loudly as a real number. The office scans this strip for what
     needs them; eight equally loud figures, six of them zero, is the thing that
     made it unscannable. Nothing is hidden and nothing is invented — only the
     weight changes. A currency-prefixed nought and "0 GB" both count as zero
     here, which is why the test allows a leading non-digit. (No amount is
     written in this file, deliberately — a guard test fails on one.) */
  const isZero = /^[^0-9]*0([^0-9].*)?$/.test(String(n));
  return `<div class="stat ${tone || ""}${act ? " click" : ""}${on ? " on" : ""}${
    isZero ? " zero" : ""}"${attrs}>
    <div class="stat-n">${n}</div>
    <div class="stat-l">${esc(label)}</div>
    ${hint ? `<div class="stat-h">${esc(hint)}</div>` : ""}
  </div>`;
}

/* THE TWO BANDS (owner, 2026-08-16). Needs attention, then Current work.

   EVERY NUMBER HERE ALREADY EXISTED. `/summary` and `/packages` are the only
   two reads; no route, query or column was added for this screen, and nothing
   is invented to fill a slot. Where the Worker does not provide a figure there
   is simply no card — a dashboard that closes a gap with a plausible zero is
   the failure this file keeps returning to.

   That is also why there is no Retainer figure standing on its own and no
   Today / Next Actions queue: the first is only knowable for the cases
   `/packages` returns, and the second has no read behind it at all. */
function dashBands(){
  if(ME.role !== "admin") return "";
  const s = SUMMARY;

  /* VISUAL PHASE 1 — the two bands are no longer the same weight. Needs
     attention is the alert strip and keeps its cards; Current work is an
     operational read-out and is drawn compactly, because eight identical boxes
     made neither of them scannable and pushed the actual work queue off the
     first screen. The band's own class is what the stylesheet keys on. */
  const band = (title, sub, go, body, kind) => `<div class="band${kind ? " band-" + kind : ""}">
    <div class="bandhead"><h2>${title}</h2>
      ${sub ? `<span class="bandsub">${esc(sub)}</span>` : ""}
      ${go ? `<span class="bandgo">${go}</span>` : ""}</div>
    ${body}</div>`;

  /* DID NOT LOAD IS NOT EMPTY. The totals are their own read and can fail on
     their own; drawing this band full of zeros would report a quiet day. */
  if(!s) return band("Needs attention", "", "",
    `<div class="empty">The dashboard totals could not be read. That is a problem reaching the
      server, not an empty portal — do not take the screens below as the whole picture until
      it loads.</div>`);

  /* THE PACKAGES READ FAILS TO AN EMPTY LIST, so three of these cards would
     otherwise report a confident zero for something nobody managed to look at
     (Codex stop-time review, 2026-08-16). This file's standing rule is that a
     card whose data does not exist is ABSENT rather than zero — the same
     reason there is no client-response card. */
  const pkOk = PKGS_OK;
  const pk = (pkOk && PKGS && Array.isArray(PKGS.packages)) ? PKGS.packages : [];
  const A = k => Array.isArray(s[k]) ? s[k] : [];
  const due = A("reports_due"), low = A("auth_low"), active = A("active_now");
  const late = A("tasks_overdue"), waiting = A("awaiting_client");
  const closing = A("ready_to_close"), exp = A("expenses_pending");

  /* Retainer pending rides on the packages payload, which already carries
     `retainer.received` for every private case it returns. It is folded in with
     the authorization warning because they are one question to the office —
     "is this case cleared to keep working?" — and the hint says both halves so
     the number is never a mystery. */
  const retPend = pk.filter(p => p.kind === "consumer" && p.retainer && !p.retainer.received)
    .map(p => p.case_no);
  const money = [...new Set([...low, ...retPend])];

  const st = s.storage;
  const stPct = st ? st.percent_of_free : null;
  // The free-plan failsafe keeps its promotion: quiet in the line below until
  // it is close to the cap, a card in front of you once it is.
  const stLoud = stPct != null && stPct >= 75;

  const attention =
      statCard("New intakes", s.new || 0, "Waiting to be read",
               (s.new || 0) ? "warn" : "", {go: "leads"})
    + statCard("Reports due", due.length, "Day done, no report",
               due.length ? "warn" : "", {set: due, go: "cases"})
    /* With the packages read down this card can only speak for the
       authorization half, so it says only that rather than implying it
       checked both. */
    + statCard(pkOk ? "Retainer / authorization" : "Authorization", money.length,
               (s.auth_warn_at ? `Past ${s.auth_warn_at}% of hours` : "Hours running out")
                 + (pkOk ? ", or retainer not received" : " — retainers could not be read"),
               money.length ? "warn" : "", {set: money, go: "cases"})
    /* NEVER A WARNING. The owner is explicit that assignment stays optional, so
       this card reports and does not scold: a case can run unassigned. */
    + statCard("Needs assignment", s.unassigned || 0, "No investigator yet — optional",
               "", {go: "cases"})
    /* UNIT 5 — a dead file store is attention, a healthy one is not: the card
       exists only in the broken states, because "Dropbox: fine" on every
       morning's dashboard is how a card stops being read. The flag arrives on
       /summary (admin only) from local state — nothing here calls Dropbox. */
    + (s.dropbox_configured !== undefined && !s.dropbox_ok
        ? statCard("Dropbox", "Off",
            s.dropbox_configured
              ? "Not connected — new photos and reports cannot be stored"
              : "Not set up on the Worker yet",
            "over", {go: "settings"}) : "")
    + (stLoud ? statCard("Storage",
               (st.bytes_used / 1073741824).toFixed(st.bytes_used > 107374182 ? 1 : 2) + " GB",
               stPct + "% of the free plan" + (stPct >= 90 ? " — uploads pause at the cap" : ""),
               stPct >= 90 ? "over" : "warn", {}) : "");

  const ready = pk.filter(p => ["approved", "delivered"].includes(p.report_status)
    && p.build_status !== "finalized");
  const built = pk.filter(p => p.build_status === "finalized");
  const out = (PKGS && PKGS.outstanding) || 0;

  /* Active today is the Worker's own set and stands on its own. The other three
     are derived from the packages payload, so they are drawn only when it
     actually arrived. */
  const work =
      statCard("Active today", active.length, "A day is running now",
               active.length ? "live" : "", {set: active, go: "cases"})
    + (pkOk
      ? statCard("Ready to build", ready.length, "Report approved, no package",
                 "", {go: "delivery"})
        + statCard("Packages ready", built.length, "Finalized and deliverable",
                 built.length ? "live" : "", {go: "delivery"})
        + statCard("Outstanding", "$" + out.toLocaleString(), out ? "Billed and unpaid" : "Nothing unpaid",
                 out ? "warn" : "", {go: "invoices"})
      : "");

  /* NO SILENT CAP. `/packages` returns the 24 most recent active cases, so the
     three cards derived from it describe that set and say so rather than
     implying they counted the whole book. */
  const capped = pk.length >= 24;

  const also = (label, n, set, go) => {
    if(n == null) return "";
    const clickable = (set && set.length) || go;
    return clickable
      ? `<button class="alsoitem" ${set && set.length
          ? `data-act="cardFilter" data-label="${esc(label)}" data-set="${esc(set.join(","))}" data-go="cases"`
          : `data-act="tab" data-tab="${esc(go)}"`}><b>${n}</b> ${esc(label)}</button>`
      : `<span class="alsoitem"><b>${n}</b> ${esc(label)}</span>`;
  };

  /* Real work, but not today's headline. A line of text rather than five more
     cards — the owner asked for fewer busy cards, and deleting these outright
     would quietly remove alerts somebody depends on. */
  const alsoLine = `<div class="alsoline">
    ${also("open cases", s.open || 0, null, "cases")}
    ${also("tasks overdue", late.length, late)}
    ${also("awaiting client", waiting.length, waiting)}
    ${also("ready to close", closing.length, closing)}
    ${also("expenses to review", exp.length, exp)}
    ${!stLoud && stPct != null ? `<span class="alsoitem"><b>${stPct}%</b> storage used</span>` : ""}
  </div>`;

  return band("Needs attention",
      s.total ? "" : "Nothing has arrived yet — this fills itself as work comes in",
      `<button class="btn sm" data-act="tab" data-tab="leads">Review intakes &rarr;</button>`,
      `<div class="stats">${attention}</div>`)
    + band("Current work",
      !pkOk ? "The active-case read did not load"
        : capped ? "Across the 24 most recent active cases" : "",
      `<button class="btn sm ghost" data-act="tab" data-tab="delivery">Reports &amp; Packages &rarr;</button>`,
      `<div class="stats">${work}</div>`
      + (!pkOk ? `<div class="qfoot" style="border:0;padding-top:2px">Ready to build,
          Packages ready and Outstanding are not shown because the active-case read failed.
          They are unknown, not zero.</div>` : ""),
      "work")
    + alsoLine;
}

/* Who a case number belongs to, for a queue row that would otherwise be a bare
   reference. CASES is the list the page already loaded; a case it does not
   hold simply shows its number, which is still actionable. Nothing is guessed
   and nothing is fetched for this. */
function caseBrief(no){
  const c = (CASES || []).find(x => x.case_no === no);
  if(!c) return null;
  return c.kind === "claims" ? (c.carrier || c.client_name || "") : (c.client_name || "");
}

/* TODAY / NEXT ACTIONS (owner, 2026-08-16). A compact work queue: one row per
   case, one direct action on it, ordered the way the office's day actually
   runs.

   IT IS BUILT FROM THE ALERTS THAT ALREADY EXIST — `/summary`'s sets and
   `/packages`' fields. No metric is invented, no route was added, and no case
   appears whose reason was not already computed by the Worker.

   TWO ALERTS ARE DELIBERATELY NOT HERE. A day running (`active_now`) needs no
   decision from the office, and a case awaiting the client has its ball in
   their court. Both stay on the also-line above, so nothing is lost — but a
   queue that lists things you cannot act on stops being read, and then the
   things you can act on go with it.

   ASSIGNMENT IS NOT IN IT EITHER. Assigning is optional, so an unassigned case
   is never queued as an outstanding task. */
const QUEUE_MAX = 8;
const QUEUE_RULES = [
  ["new",       "New intake to read",                  "Review intake",     "overview"],
  ["reports",   "Report waiting on you",               "Review report",     "reports"],
  ["tasks",     "Task past its due date",              "Open tasks",        "tasks"],
  ["retainer",  "Retainer not received",               "Open billing",      "billing"],
  ["auth",      "Authorization running low",           "Open authorization","auth"],
  ["build",     "Report approved — package to build",  "Build package",     "package"],
  ["expenses",  "Expense waiting on your call",        "Review expense",    "expenses"],
  ["closing",   "Complete — run the closing checklist","Open closing",      "billing"],
];

/* The queue's three states — never loaded, loaded and empty, failed — used to
   be derived in the browser from `/summary` counts, with `queueUnknowns()`
   naming the sources that had not answered. UNIT 8 moved the derivation to the
   Worker (`/attention`), which knows WHY each row is there and which panel does
   the work, so those helpers had no readers left and are gone rather than left
   sitting as a second, staler answer to the same question. The rule they
   existed for is unchanged and is enforced in `nextActionsHtml` below: a read
   that failed is never drawn as a clear desk. */

/* WHAT THE QUEUE COULD NOT SEE (Codex stop-time review, 2026-08-16).

   The first version guarded only `SUMMARY === null`, and that is one of four
   ways an input can go missing. `/packages` failing leaves `PKGS.packages` an
   EMPTY ARRAY, the case list failing leaves `CASES` empty, and a half-applied
   schema makes the Worker omit whole alert sets from `/summary` without
   comment — each of which quietly deleted a category of work and left the
   queue free to announce a clear desk.





/* RECENTLY COMPLETED — a compact list off `/completed`, the same route the
   Cases lens and Reports & Packages read. The desk itself keeps the full cards
   with every artifact on them; here it answers one question, "what did we
   finish", in one line each. Nothing invented and no example records: an empty
   list says it is empty. */
const DONE_MAX = 5;

function recentlyCompletedHtml(){
  const head = body => `<div class="card quietcard">

      <button class="btn sm ghost" data-act="tab" data-tab="delivery"
        style="margin-left:auto">Reports &amp; Packages &rarr;</button></div>

  if(!COMPLETED) return head(`<div class="empty">Loading completed cases&hellip;</div>`);
  if(COMPLETED.error) return head(`<div class="err">The completed list did not load &mdash;
    ${esc(COMPLETED.error)}. This is not an empty desk.

    <div class="empty-hint">A case arrives here when its stage is set to Complete, it passes the

    const who = c.kind === "claims" ? (c.carrier || c.client_name || "") : (c.client_name || "");
    /* What actually finished, in the order the desk itself decides it: a
       finalized package is the strongest statement, then the stage. */
    const what = c.finalized_at
      ? `Package v${esc(String(c.build_version))} finalized`

        ${who ? `<div class="qwho">${esc(who)}${c.subject_name ? " &middot; " + esc(c.subject_name) : ""}</div>` : ""}
        <div class="qno mono">${esc(c.case_no)}${at ? " &middot; " + when(at) : ""}</div>
      </div>
      <div class="qgo"><button class="btn sm ghost" data-act="openCase"
        data-case="${esc(c.case_no)}">Open case &rarr;</button></div>

  }).join("")}</div>

/* UNIT 5 — RECENT ACTIVITY. Three states kept apart, the loadSends rule:
   never loaded, failed (which says so), and loaded-and-quiet. The rows are
   the Worker's — time, what, which case — and each links to its case. */
let RECENT = null, RECENT_ERR = "";
async function loadRecent(){
  RECENT_ERR = "";
  try{ RECENT = (await api("/recent-activity")).activity; }
  catch(e){ RECENT = null; RECENT_ERR = e.message; }
  paint();
}
const RECENT_ICON = { intake: "&#128234;", day: "&#128373;", report: "&#128196;",
                      evidence: "&#128247;", payment: "&#128181;", package: "&#128230;" };
/* ================================================ UNIT 8: GLOBAL SEARCH

   ONE COMPONENT, TWO PLACEMENTS — the dashboard's first card and its own
   top-level screen — so the office never has to open Cases first, and the two
   can never drift into different behaviour. Both roles have it; the Worker
   decides what each may find.

   The request is debounced and refuses to run under two characters, so typing
   a case number is one or two round trips rather than fourteen. */

let SRCH_TIMER = null;
function srchSoon(){
  if(SRCH_TIMER) clearTimeout(SRCH_TIMER);
  SRCH_TIMER = setTimeout(() => { SRCH_TIMER = null; runSearch(); }, 220);
}

async function runSearch(){
  const q = (SRCH.q || "").trim();
  SRCH.hi = -1;
  if(q.length < 2){ SRCH.results = null; SRCH.err = ""; SRCH.busy = false; paint(); return; }
  SRCH.busy = true; SRCH.err = "";
  try{
    const d = await api("/search?q=" + encodeURIComponent(q));
    /* A LATE ANSWER TO AN OLD QUERY MUST NOT LAND. Typing "smith" fires for
       "sm" and "smi" too, and the slowest of them arriving last would paint
       results for a question the office had already moved on from. */
    if((SRCH.q || "").trim() !== q) return;
    SRCH.results = d.results || []; SRCH.capped = !!d.capped;
  }catch(e){
    if((SRCH.q || "").trim() !== q) return;
    /* NOT AN EMPTY RESULT LIST. "Nothing found" and "the search did not run"
       are different answers and only one of them is reassuring. */
    SRCH.results = null; SRCH.err = e.message;
  }
  SRCH.busy = false;
  paint();
}

function srchResultHtml(r, i){
  const type = SRCH_TYPE[r.type] || "Result";
  const dest = r.dest || {};
  const attrs = dest.view === "profile"

    : `data-act="srchGoCase" data-case="${esc(dest.case_no || "")}"${
        dest.tab ? ` data-tab="${esc(dest.tab)}"` : ""}`;
  return `<button class="srchrow${i === SRCH.hi ? " hi" : ""}" ${attrs}>
    <span class="srchtype srchtype-${esc(r.type)}">${esc(type)}</span>
    <span class="srchmain">
      <span class="srchtitle">${esc(r.title || "")}</span>
      ${r.subtitle ? `<span class="srchsub">${esc(r.subtitle)}</span>` : ""}
      <span class="srchwhy">Matched: ${esc((r.matched || []).join(", "))}</span>
    </span>
  </button>`;
}

function searchPanelHtml(){
  const q = (SRCH.q || "").trim();
  const body = SRCH.err
    ? `<div class="err">The search did not run &mdash; ${esc(SRCH.err)}. This is not
        "nothing found". <button class="btn sm ghost" data-act="srchRetry">Try again</button></div>`

    ? `<p class="hint">Two letters or more. Try a case number, a claim or matter number, a

    : !SRCH.results.length

    : `<div class="srchlist">${SRCH.results.map(srchResultHtml).join("")}</div>
       ${SRCH.capped ? `<div class="qfoot">Showing the first ${SRCH.results.length}. Narrow the

    </label>

}

/* ============================================ UNIT 8: NEEDS ATTENTION

   The Unit 5 queue, fed by the Worker instead of derived from counts in the
   browser. Same card, same one-row-per-case discipline, same refusal to draw a
   failed read as a clear desk — but each row now knows WHY it is there and
   which panel does the work.

   THERE IS NO DISMISSAL. A row leaves because the thing was done. */

async function loadAttention(){
  ATTN_ERR = "";
  try{
    const d = await api("/attention");
    ATTN = d; ATTN_OK = true;
  }catch(e){
    ATTN = null; ATTN_OK = false;
    ATTN_ERR = "The attention list could not be loaded — " + e.message;
  }
}

/* ONE ROW PER CASE, most serious first, with the rest counted on the row.
   A case can be in four alert sets at once and four rows for one file is a
   queue nobody finishes — the rule the Unit 5 card already enforced. */
function attnRows(){
  if(!ATTN || !Array.isArray(ATTN.alerts)) return null;
  const want = ATTN_FILTER;
  const list = ATTN.alerts.filter(a =>
    want === "all" || a.severity === want || a.kind === want);
  const byCase = new Map();
  for(const a of list){
    const key = a.case_no || `x:${a.kind}:${a.what}`;
    if(!byCase.has(key)) byCase.set(key, { ...a, more: 0 });
    else byCase.get(key).more++;
  }
  return [...byCase.values()];
}

function attnFilterHtml(){
  if(!ATTN) return "";
  const c = ATTN.counts || {}, k = ATTN.kinds || {};
  const chip = (v, label, n) => `<button class="lens${ATTN_FILTER === v ? " on" : ""}"
    data-act="attnFilter" data-k="${v}">${label}${n ? ` <span class="lensn">${n}</span>` : ""}</button>`;
  return `<div class="lenses attnlenses">
    ${chip("all", "All", ATTN.total || 0)}
    ${c.urgent ? chip("urgent", "Urgent", c.urgent) : ""}
    ${Object.entries(ATTN_KIND).filter(([key]) => k[key])
      .map(([key, label]) => chip(key, label, k[key])).join("")}
  </div>`;
}

function nextActionsHtml(){
  const rows = attnRows();
  const count = !rows ? "the office's queue"
    : rows.length ? `${ATTN.total || rows.length} waiting` : "nothing waiting";
  const head = body => `<div class="card queuecard">
    <div class="bar"><h2 style="margin:0">Today / next actions</h2>
      <span class="count">${esc(count)}</span></div>
    ${rows && (ATTN.total || 0) ? attnFilterHtml() : ""}
    ${body}</div>`;

  /* DID NOT LOAD IS NOT AN EMPTY QUEUE. This page has been bitten twice by an
     outage drawn as good news, and the queue is the worst place for it. */
  if(!rows) return head(`<div class="empty">
    <div class="empty-title">The queue could not be built.</div>
    <div class="empty-hint">${esc(ATTN_ERR || "The attention list did not load.")}
      Do not read this as a clear desk.
      <button class="btn sm ghost" data-act="attnRetry" style="margin-left:8px">Try again</button>
    </div></div>`);

  if(!rows.length && ATTN_FILTER !== "all") return head(`<div class="empty">
    <div class="empty-title">Nothing under that filter.</div>
    <div class="empty-hint">Clear it to see everything waiting.</div></div>`);

  /* AN INCOMPLETE QUEUE MAY NOT REPORT A CLEAR DESK. Some sources answered and
     some could not be read at all; with nothing from the ones that did, the
     honest statement is that we do not know, and it names which part is
     missing. The rule predates Unit 8 — only the place it is enforced moved
     when the derivation went to the Worker. */
  const blind = (ATTN && ATTN.missing_sources) || [];
  if(!rows.length && blind.length) return head(`<div class="empty">
    <div class="empty-title">The queue is incomplete.</div>
    <div class="empty-hint">Nothing came back from the alerts that did load, but
      ${esc(attnList(blind))} could not be read &mdash; so this is not a clear desk, it is a
      partial view. It usually means the database is missing tables the portal-setup workflow
      creates.</div></div>`);

  if(!rows.length) return head(`<div class="empty">
    <div class="empty-title">Nothing needs you right now.</div>
    <div class="empty-hint">This fills itself as work arrives &mdash; a new intake, a finished day
      with no report, a retainer still unpaid, a hearing coming up, a package left unfinished.
      Nothing here is a to-do list somebody has to keep up to date, and nothing here is dismissed:
      a row leaves when the thing is done.</div></div>`);

  const shown = rows.slice(0, QUEUE_MAX);
  return head(`<div class="queue">${shown.map(r => {
    const who = r.case_no ? caseBrief(r.case_no) : "";
    const act = r.action || {};
    /* Colour is never the only signal — the chip says the word. */
    const chip = `<span class="sev sev-${esc(r.severity)}">${esc(ATTN_SEV[r.severity] || r.severity)}</span>`;
    const go = act.view === "settings"
      ? `<button class="btn sm ghost" data-act="tab" data-tab="settings">${esc(act.label || "Open")} &rarr;</button>`
      : `<button class="btn sm ghost" data-act="pkgJump" data-case="${esc(r.case_no || "")}"
           data-tab="${esc(act.tab || "overview")}">${esc(act.label || "Open")} &rarr;</button>`;
    return `<div class="qrow">
      <div class="qmain">
        <div class="qwhat">${chip}${esc(r.what)}${r.more
          ? ` <span class="qmore">&middot; ${r.more} more on this case</span>` : ""}</div>
        <div class="qwhy">${esc(r.why || "")}</div>
        ${who ? `<div class="qwho">${esc(who)}</div>` : ""}
        ${r.case_no ? `<div class="qno mono">${esc(r.case_no)}</div>` : ""}
      </div>
      <div class="qgo">${go}</div>
    </div>`;
  }).join("")}</div>
  ${rows.length > QUEUE_MAX ? `<div class="qfoot">Showing the first ${QUEUE_MAX} of
    ${rows.length}. Filter above to narrow it.</div>` : ""}
  ${blind.length ? `<div class="qfoot">This queue is missing ${esc(attnList(blind))} &mdash; those
    could not be read, so there may be more waiting than is listed here.</div>` : ""}`);
}

/* "a, b and c" — the queue's own, because the sentence above is the only
   place on this page that needs it. */
function attnList(a){
  return a.length < 2 ? (a[0] || "")
    : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
}

function recentActivityHtml(){

}

function dashView(){
  if(!PKGS) return `<div class="card"><div class="empty">Loading the dashboard&hellip;</div></div>`;
  const active = (PKGS.packages || []);
  /* UNIT 8 hierarchy: SEARCH first, then what needs doing, then the live

  return `${searchCardHtml()}${nextActionsHtml()}${dashBands()}${outNowHtml()}${recentActivityHtml()}

      ${!PKGS_OK
        /* A failed read fails to an EMPTY list so the page can keep drawing —
           which draws identically to a desk with no cases on it. "No active

           job is answering "what is in flight". Same rule as deliveryView. */
        ? `<div class="err">The active-case read did not load, so this list is unknown &mdash;

        : `<div class="empty">No active cases. New intakes appear here as cases the moment they arrive.</div>`}
    </div>

}

/* The dashboard strip answers one question: what needs my attention today?
   Every card that can act carries the case numbers behind its count, so
   clicking it shows exactly those cases instead of leaving a number to go
   hunting after. Cards whose data does not exist yet — client responses,
   expenses, closure — arrive with their features rather than sitting at a
   fake zero. Drawn even when the portal is empty, because a page that shows
   nothing at all looks broken. */
/* THE STRIP ABOVE A LIST, WHICH IS NOT THE DASHBOARD (2026-08-16).

   The Dashboard draws `dashBands()` instead: two named bands with one primary
   action each. Here on Cases and Today the same cards keep their original flat
   shape, because in this position they are a FILTER CONTROL over the list
   immediately beneath them, not a summary of the day. Banding them here would
   put a heading between a control and the thing it controls. */
function summaryCards(){
  if(TAB !== "cases" && TAB !== "today") return "";
  const s = SUMMARY || {};
  const admin = ME.role === "admin";

  const card = (label, n, hint, tone, set) => statCard(label, n, hint, tone, {set: n > 0 ? set : null});

  const active = s.active_now || [], due = s.reports_due || [], low = s.auth_low || [];
  const late = s.tasks_overdue || [];
  // Every number here is the Worker's. Nothing is padded to avoid a zero:
  // a zero IS the answer when there is no work, and a total that quietly
  // counted a fabricated case was a total nobody could reconcile.
  const total = s.total || 0;

  const cards = admin
    ? card("Open cases", s.open || 0, total ? "" : "None yet")
      + card("Needs assignment", s.unassigned || 0,
             "Waiting on you", (s.unassigned || 0) ? "warn" : "")
      + card("Out now", active.length, "A day is running", active.length ? "live" : "", active)
      + card("Reports due", due.length, "Day done, no report", due.length ? "warn" : "", due)
      + card("Authorization low", low.length,
             s.auth_warn_at ? `Past ${s.auth_warn_at}% of hours` : "Hours running out",
             low.length ? "warn" : "", low)
      + card("Tasks overdue", late.length, "Past their due date", late.length ? "warn" : "", late)
      + card("Awaiting client", (s.awaiting_client || []).length, "Ball in their court", "",
             s.awaiting_client || [])
      + card("Ready to close", (s.ready_to_close || []).length, "Complete — run the checklist",
             (s.ready_to_close || []).length ? "live" : "", s.ready_to_close || [])
      + card("Expenses to review", (s.expenses_pending || []).length, "Awaiting your call",
             (s.expenses_pending || []).length ? "warn" : "", s.expenses_pending || [])
      + (s.storage ? card("Storage",
             (s.storage.bytes_used / 1073741824).toFixed(s.storage.bytes_used > 107374182 ? 1 : 2) + " GB",
             s.storage.percent_of_free + "% of the free plan" + (s.storage.percent_of_free >= 90 ? " — uploads pause at the cap" : ""),
             s.storage.percent_of_free >= 90 ? "over" : s.storage.percent_of_free >= 75 ? "warn" : "") : "")
    : card("Assigned to you", total, total ? "" : "Nothing yet")
      + card("Out now", active.length, "Your day is running", active.length ? "live" : "", active)
      + card("Reports due", due.length, "Finish or fix a report", due.length ? "warn" : "", due)
      + card("Authorization low", low.length, "Call before exceeding", low.length ? "warn" : "", low)
      + card("Tasks overdue", late.length, "Past their due date", late.length ? "warn" : "", late);

  return `<div class="stats">${cards}</div>`;
}

/* The investigator's day, answered directly: am I out now, what is assigned
   to me, what do I owe. Everything here is already scoped by the Worker. */
/* Short labels the way a wall calendar wants them, derived from the case
   type so the list stays configuration-driven. */
function calLabel(t, kind){
  const s = String(t || "");
  if(/surveillance/i.test(s)) return "SURV";
  if(/statement/i.test(s)) return "STATEMENT";
  if(/canvass|field/i.test(s)) return "CANVASS";
  if(/custody/i.test(s)) return "CUSTODY";
  if(/infidelity|adultery/i.test(s)) return "INFIDELITY";
  if(/scene/i.test(s)) return "SCENE";
  if(/background|social/i.test(s)) return "BACKGROUND";
  if(/skip|locate/i.test(s)) return "LOCATE";
  return kind === "claims" ? "INS" : "PRIVATE";
}

function calendarView(){
  if(!CAL) return `<div class="card"><div class="empty">Loading the calendar&hellip;</div></div>`;
  const [y, m] = CAL.month.split("-").map(Number);
  const first = new Date(y, m - 1, 1);
  const daysIn = new Date(y, m, 0).getDate();
  const lead = first.getDay();
  const now = new Date();   // local, like the grid — UTC would drift the ring near midnight
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;

  const byDate = {};
  for(const d of CAL.days){
    (byDate[d.day_date] = byDate[d.day_date] || []).push({
      kind: "day", label: calLabel(d.case_type, d.kind), case_no: d.case_no,
      who: d.investigator, running: !d.end_time, hours: d.hours,
    });
  }
  for(const o of CAL.offers){
    (byDate[o.investigation_date] = byDate[o.investigation_date] || []).push({
      kind: "offer", label: calLabel(o.case_type, o.kind), case_no: o.case_no || null,
      who: o.investigator || null, loc: o.general_location,
    });
  }

  let cells = "";
  for(let i = 0; i < lead; i++) cells += `<div class="cal-cell cal-pad"></div>`;
  for(let d = 1; d <= daysIn; d++){
    const iso = `${CAL.month}-${String(d).padStart(2, "0")}`;
    const evs = byDate[iso] || [];
    cells += `<div class="cal-cell${iso === today ? " cal-today" : ""}">
      <div class="cal-d">${d}</div>
      ${evs.map(e => e.kind === "offer"
        ? `<span class="cal-ev cal-offer" ${e.case_no ? `data-act="openCase" data-case="${esc(e.case_no)}"` : `data-act="tab" data-tab="today"`}
             title="Offered${e.loc ? " — " + esc(e.loc) : ""}">◦ ${esc(e.label)}${e.who ? " · " + esc(e.who) : ""}</span>`
        : `<span class="cal-ev${e.running ? " cal-run" : ""}" data-act="openCase" data-case="${esc(e.case_no)}"
             title="${esc(e.case_no)}${e.who ? " — " + esc(e.who) : ""}">${esc(e.label)}${
             ME.role === "admin" && e.who ? " · " + esc(e.who.split(" ")[0]) : ""}${e.hours != null ? ` · ${esc(e.hours)}h` : e.running ? " · out" : ""}</span>`
      ).join("")}
    </div>`;
  }
  const monthName = first.toLocaleDateString(undefined, {month: "long", year: "numeric"});
  return `<div class="card">
    <div class="bar">
      <h2 style="margin:0">Calendar</h2>
      <button class="btn sm ghost" data-act="calMonth" data-d="-1">&larr;</button>
      <b>${esc(monthName)}</b>
      <button class="btn sm ghost" data-act="calMonth" data-d="1">&rarr;</button>
      <span class="count">${ME.role === "admin" ? "every investigator" : "your days and offers"}</span>
    </div>
    <div class="cal-grid">
      ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(w => `<div class="cal-w">${w}</div>`).join("")}
      ${cells}
    </div>
    <p class="hint">Solid chips are investigation days — click one to open the case. Hollow chips are
      pending offers.</p>
  </div>`;
}

/* Two documents the office sends: the retainer sheet for a private client, the
   block ladder for a carrier. Neither is on the public site — a price is quoted
   to someone who asked, not published to everyone who visits. */
/* UIBUILD P16 — Intakes: every early-stage submission as a card the
   office can act on. Leads ARE submissions — same table, same workspace, so
   accepting one is just walking it forward, and nothing can drift. */
function leadsView(){
  const stageOf = c => c.stage || c.status;
  const leadState = c => {
    const st = stageOf(c);
    if(st === "new") return ["New", "new"];
    if(st === "awaiting_client") return ["More info requested", "awaiting_client"];
    return ["Accepted", "assigned"];
  };
  const pool = CASES.filter(c => !["closed", "complete", "cancelled"].includes(stageOf(c)));
  const fresh = pool.filter(c => ["new", "awaiting_client"].includes(stageOf(c)));
  const accepted = pool.filter(c => !["new", "awaiting_client"].includes(stageOf(c))).slice(0, 6);

  const card = c => {
    const [lbl, tone] = leadState(c);
    const claim = c.kind === "claims";
    const open = ["new", "awaiting_client"].includes(stageOf(c));
    /* MASTER §5 — the lead's own status, beside (never instead of) the intake
       state. The select is the office's hand; the two sends stamp themselves. */
    const ls = c.lead_status || "lead";
    /* PAYMENTS.md §10 — a returned private intake whose retainer has not
       arrived is the one lead state with an obvious next action, and the card
       is where the office is looking. The condition needs no new field: the
       office marking the lead `intake_received` IS "the private intake has been
       returned", and it is one of the nine statuses already in LEAD_STATUSES.

       The status pair is scoped exactly as §10 scopes it. The sent line is NOT:
       a private lead that was emailed instructions should say so whatever its
       lead status, or the office resends blind. */
    const retPending = !claim && ls === "intake_received" && !c.retainer_received;
    const paySent = !claim && c.pay_sent_at;
    const sendRow = LEAD_SEND && LEAD_SEND.case_no === c.case_no ? `
      <div class="lead-send">
        <input id="ls_to" type="email" placeholder="name@example.com" value="${esc(LEAD_SEND.to)}">
        <button class="btn sm" data-act="leadIntakeSend" data-case="${esc(c.case_no)}"${LEAD_SEND.busy ? " disabled" : ""}>${LEAD_SEND.busy ? "Sending&hellip;" : "Send"}</button>
        <button class="btn sm ghost" data-act="leadIntakeCancel">Cancel</button>
        ${LEAD_SEND.err ? `<div class="err" style="flex-basis:100%;margin:4px 0 0">${esc(LEAD_SEND.err)}</div>` : ""}
      </div>` : "";
    const legal = !!c.legal;
    /* The owner's four arrangements, as the office reads them. check_pickup is
       the one with a live state attached: AWAITING PICKUP, and never paid by
       any act on this screen. */
    const ARR = { bill_ach: "BILL.com invoice / ACH", check_pickup: "Awaiting pickup — retainer check at the firm",
                  check_mail: "Awaiting mailed check", existing_billing: "Existing billing arrangement" };
    return `<div class="pcard">
      <div class="pc-top"><div>
        <span class="tag ${legal ? "legaltag" : claim ? "claims" : "consumer"}">${legal ? "Legal" : claim ? "Insurance" : "Private"}</span>
        <span class="tag ${tone}">${lbl}</span>
        <span class="tag lead-${esc(ls)}">${esc(LEAD_LABEL[ls] || ls)}</span>
        <div style="font-weight:800;margin-top:5px">${esc(legal ? (c.legal_firm || c.client_name || "—")
          : claim ? (c.carrier || c.client_name || "—") : (c.client_name || "—"))}</div>
        ${legal && c.legal_attorney ? `<div style="font-size:.82rem;color:var(--muted)">${esc(c.legal_attorney)}</div>` : ""}
        ${legal && c.client_name && c.legal_firm ? `<div style="font-size:.82rem">Client: ${esc(c.client_name)}</div>` : ""}
        <div style="font-size:.85rem;color:var(--muted)">${esc(c.subject_name || "")}</div>
        ${legal && c.legal_assignment ? `<div style="font-size:.78rem;color:var(--muted);margin-top:2px">${esc(c.legal_assignment)}${
          c.legal_deadline ? ` &middot; due ${esc(c.legal_deadline)}` : ""}</div>` : ""}
        ${legal && c.legal_arrangement ? `<div style="font-size:.78rem;margin-top:2px"><span class="tag lead-quoted">${
          esc(ARR[c.legal_arrangement] || c.legal_arrangement)}</span></div>` : ""}
        ${c.claim_number ? `<div class="mono" style="font-size:.72rem;margin-top:2px">Claim ${esc(c.claim_number)}</div>` : ""}
        <div class="mono" style="font-size:.72rem;margin-top:3px">${esc(c.case_no)}</div>
        <div style="font-size:.76rem;color:var(--muted);margin-top:4px">Received ${when(c.created_at)}</div>
        ${c.send_count ? `<div style="font-size:.76rem;color:var(--muted);margin-top:2px">
          &#9993; ${c.send_count} sent &middot; last ${when(c.last_sent_at)}</div>` : ""}
      </div>
      <label class="f" style="margin:0"><span>Lead status</span>
        <select data-act="leadStatus" data-case="${esc(c.case_no)}">
          ${Object.entries(LEAD_LABEL).map(([v, l]) =>
            `<option value="${v}" ${ls === v ? "selected" : ""}>${l}</option>`).join("")}
        </select></label>
      </div>
      ${retPending || paySent ? `<div class="retpend">
        ${retPending ? `<div class="rp-ok">&#10003; Private intake received</div>
          <div class="rp-due">Retainer pending</div>` : ""}
        ${paySent ? `<div class="rp-sent">Payment instructions sent${
          payMethodLabels(c.pay_methods) ? ` &middot; ${esc(payMethodLabels(c.pay_methods))}` : ""
          } &middot; ${when(c.pay_sent_at)}</div>` : ""}
      </div>` : ""}
      <div class="pc-next">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn sm ghost" data-act="openCase" data-case="${esc(c.case_no)}">Review</button>
          <button class="btn sm ghost" data-act="openCaseTab" data-case="${esc(c.case_no)}" data-tab="comms">Message</button>
          <button class="btn sm ghost" data-act="leadSheet" data-case="${esc(c.case_no)}" data-kind="${esc(c.kind)}">Send rate sheet</button>
          <button class="btn sm ghost" data-act="leadIntake" data-case="${esc(c.case_no)}">Send intake</button>
          ${claim || legal ? "" : `<button class="btn sm ghost" data-act="leadPayOpen"
            data-case="${esc(c.case_no)}" data-name="${esc(c.client_name || "")}"
            data-to="${esc(c.client_email || "")}">${
            paySent ? "Resend payment options" : "Send payment options"}</button>`}
          ${retPending ? `<button class="btn sm ghost" data-act="leadRecordPay"
            data-case="${esc(c.case_no)}">Record payment</button>` : ""}
        </div>
        ${sendRow}
        ${open ? `<button class="btn sm" data-act="openCaseTab" data-case="${esc(c.case_no)}" data-tab="assign">Accept &rarr;</button>` : ""}
      </div>
    </div>`;
  };

  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Intakes</h2>
      <span class="count">${fresh.length} awaiting a decision</span>
      <button class="btn sm" data-act="tab" data-tab="newlead" style="margin-left:auto">+ Intake a client</button></div>
    ${LEAD_MSG ? `<div class="note">${esc(LEAD_MSG)}</div>` : ""}
    ${fresh.length ? `<div class="pkgcards">${fresh.map(card).join("")}</div>`
      : `<div class="empty">Nothing waiting. New submissions and phoned-in leads land here the moment they exist.</div>`}
    ${accepted.length ? `<h3 style="margin:18px 0 6px;font-size:1rem">Recently accepted</h3>
      <div class="pkgcards">${accepted.map(card).join("")}</div>` : ""}
  </div>`;
}

/* ================================================== UNIT 7: CLIENTS & FIRMS

   The directory of saved profiles, and the picker that makes a repeat
   assignment a few taps. Everything here is a reusable DEFAULT: choosing a
   profile fills the form in, the office edits the form, and the case is
   created from the form. Editing a firm later cannot reach a case that
   already exists — there is no code path from one to the other.

   Admin only. The Worker refuses every route to an investigator; this page
   simply never draws the door. */

const profPhoneLine = list => (list || []).map(p =>
  `${esc(p.number)}${p.label ? ` <span class="opt">${esc(p.label)}</span>` : ""}`).join(" &middot; ");
const profWho = c => [c.first_name, c.last_name].filter(Boolean).join(" ");

async function loadProfiles(){
  PROF_ERR = "";
  const qs = new URLSearchParams();
  if(PROF_Q) qs.set("q", PROF_Q);
  if(PROF_KIND) qs.set("kind", PROF_KIND);
  if(PROF_INACTIVE) qs.set("inactive", "1");
  try{
    const d = await api("/profiles" + (qs.toString() ? "?" + qs : ""));
    PROF = Array.isArray(d.profiles) ? d.profiles : [];
    PROF_SETUP = !!d.not_set_up;
    PROF_OK = true;
  }catch(e){
    /* NOT an empty list. A directory that says "no clients yet" when the
       request failed is the reassuring direction of wrong. */
    PROF = null; PROF_OK = false;
    PROF_ERR = "The client directory could not be loaded — " + e.message;
  }
}

function profilesView(){
  if(PROF_OPEN) return profileDetailView();
  if(PROF_FORM && PROF_FORM.mode === "new") return profileFormView();

  const chip = (k, label) => `<button class="lens${PROF_KIND === k ? " on" : ""}"
    data-act="profKind" data-k="${k}">${label}</button>`;
  const body = !PROF_OK
    ? (PROF_ERR
        ? `<div class="err">${esc(PROF_ERR)}
             <button class="btn sm ghost" data-act="profReload">Try again</button></div>`
        : `<div class="empty">Loading&hellip;</div>`)
    : PROF_SETUP
    ? `<div class="empty"><b>Not set up yet.</b><br>The client profile tables are not on this
         database. Run the <b>portal-setup</b> workflow once and this directory works —
         nothing else in the portal is affected meanwhile.</div>`
    : !PROF.length
    ? (PROF_Q || PROF_KIND
        ? `<div class="empty">Nothing matched that search. Clear it to see everyone.</div>`
        : `<div class="empty"><b>No saved clients or firms yet.</b><br>Save one here, or from a
             case you have already taken — then the next assignment from them starts prefilled.</div>`)
    : `<div class="pkgcards">${PROF.map(profCard).join("")}</div>`;

  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Clients &amp; Firms</h2>
      ${PROF_OK && !PROF_SETUP ? `<span class="count">${PROF.length} profile${PROF.length === 1 ? "" : "s"}</span>` : ""}
      <button class="btn sm" data-act="profNew" style="margin-left:auto">+ New profile</button></div>
    ${PROF_MSG ? `<div class="note">${esc(PROF_MSG)}</div>` : ""}
    <div class="profbar">
      <input id="prof_q" class="profsearch" type="search" placeholder="Search a firm, a person, an email or a phone number"
        value="${esc(PROF_Q)}" data-act-input="profSearch" autocomplete="off">
      <div class="lenses">
        ${chip("", "All")}${chip("law_firm", "Law firms")}${chip("insurance_org", "Insurance")}${chip("private_client", "Private")}
      </div>
      <label class="cap"><input type="checkbox" data-act="profInactive" ${PROF_INACTIVE ? "checked" : ""}>
        <span>Include inactive</span></label>
    </div>
    ${body}
  </div>`;
}

function profCard(p){
  const preferred = (p.contacts || []).find(c => c.preferred) || (p.contacts || [])[0];
  return `<div class="pcard">
    <div class="pc-top"><div>
      <span class="tag ${p.kind === "law_firm" ? "legaltag" : p.kind === "insurance_org" ? "claims" : "consumer"}"
        >${esc(PROF_KIND_LABEL[p.kind] || p.kind)}</span>
      ${p.active ? "" : `<span class="tag">Inactive</span>`}
      <div style="font-weight:800;margin-top:5px">${esc(p.name)}</div>
      ${p.address ? `<div style="font-size:.82rem;color:var(--muted)">${esc(p.address)}</div>` : ""}

    <label class="f"><span>Label</span>
      <select id="pf_phl${i}">${["", ...PHONE_LABELS_UI].map(l =>
        `<option value="${l}"${((v.phones && v.phones[i] && v.phones[i].label) || "") === l ? " selected" : ""}
          >${l ? l[0].toUpperCase() + l.slice(1) : "—"}</option>`).join("")}</select></label>

/* COLLECT BEFORE PAINT, always. Every paint rebuilds these inputs from state,
   so a repaint that has not collected first silently reverts whatever was
   typed and then saves the old value while reporting success — the bug
   EDIT_DRAFT and the Dropbox folder save were both written to stop. */
function profFormCollect(){
  if(!PROF_FORM) return;
  const g = id => { const el = $(id); return el ? el.value : undefined; };
  const v = PROF_FORM.v || (PROF_FORM.v = {});
  for(const k of ["name", "email", "address", "billing_name", "billing_email",
    "payment_arrangement", "notes"]){
    const got = g("pf_" + k);
    if(got !== undefined) v[k] = got;
  }
  const phones = [];
  for(let i = 0; i < 2; i++){
    const n = g("pf_ph" + i);
    if(n === undefined) continue;
    phones[i] = {number: n, label: g("pf_phl" + i) || ""};
  }
  if(phones.length) v.phones = phones;
}
function profContactCollect(){
  if(!PROF_CONTACT) return;
  const g = id => { const el = $(id); return el ? el.value : undefined; };
  const v = PROF_CONTACT.v || (PROF_CONTACT.v = {});
  for(const [k, id] of [["first_name", "pc_first"], ["last_name", "pc_last"],
    ["role", "pc_role"], ["email", "pc_email"]]){
    const got = g(id);
    if(got !== undefined) v[k] = got;
  }
  const pref = $("pc_pref");
  if(pref) v.preferred = pref.checked;
  const phones = [];
  for(let i = 0; i < 2; i++){
    const n = g("pc_ph" + i);
    if(n === undefined) continue;
    phones[i] = {number: n, label: g("pc_phl" + i) || ""};
  }
  if(phones.length) v.phones = phones;
}

const profPhonesOut = v => (v.phones || []).filter(p => p && String(p.number || "").trim())
  .map(p => ({number: p.number, label: p.label || ""}));

/* One request per pause in typing, not one per keystroke. The directory is a
   cheap indexed read, but a search box that fires on every letter turns a
   four-word firm name into twenty round trips. */
let PROF_TIMER = null;
function profSearchSoon(){
  if(PROF_TIMER) clearTimeout(PROF_TIMER);
  PROF_TIMER = setTimeout(() => { PROF_TIMER = null; loadProfiles().then(paint); }, 220);
}

/* THE CASE'S OWN VIEW OF ITS PROFILE. Three states: linked, matched-but-not-
   linked, and neither — and the second offers the association as a button an
   admin presses. Nothing here writes on its own, and nothing it shows changes
   a single stored value on the case. */
function caseProfileHtml(){
  if(!WS || ME.role !== "admin") return "";
  const P = WS.profile;
  if(!P || P.not_set_up) return "";
  if(P.link && P.profile){
    return `<div class="card">
      <div class="bar"><h2 style="margin:0">Client profile</h2></div>
      <div class="quick">
        <div class="rowline"><span>${esc(PROF_KIND_LABEL[P.profile.kind] || "Profile")}</span>
          <b>${esc(P.profile.name)}${P.profile.active ? "" : " (inactive)"}</b></div>
        ${P.contact_name ? `<div class="rowline"><span>Contact used</span>
          <b>${esc(P.contact_name)}</b></div>` : ""}
        <div class="actions">
          <button class="btn sm ghost" data-act="profOpenFromCase" data-id="${P.profile.id}">Open profile</button>
          <button class="btn sm ghost" data-act="caseProfClear">Remove the link</button>
        </div>
        <p class="hint">This case keeps the details it was created with. Editing the profile
          changes what the <b>next</b> assignment starts with, never this one.</p>
      </div>
    </div>`;
  }
  const sugg = P.suggested || [];
  return `<div class="card">
    <div class="bar"><h2 style="margin:0">Client profile</h2>
      <span class="count">${sugg.length ? "Possible match" : P.looked ? "No match" : "Not saved"}</span></div>
    <div class="quick">
      ${sugg.length ? `<div class="dupwarn">
        <b>Possible existing profile.</b>
        ${sugg.map(m => `<div class="duprow">
          <span>${esc(m.name)} <span class="opt">${esc(PROF_KIND_LABEL[m.kind] || m.kind)}</span></span>
          <button class="btn sm" data-act="caseProfLink" data-id="${m.id}">Use this profile</button>
        </div>`).join("")}
        <p class="hint">Nothing is merged either way: linking records that this case came from
          them, and never writes what was submitted into their saved details.</p>
        <button class="btn sm ghost" data-act="caseProfSave" data-confirm="1">Save as a separate new profile</button>
      </div>`
      : `<p class="note">No saved client or firm is linked to this case.${
           P.looked ? " Nothing saved looks like a match." : ""}</p>
         <div class="actions">
           ${P.looked ? "" : `<button class="btn sm ghost" data-act="caseProfMatch">Look for a match</button>`}
           <button class="btn sm" data-act="caseProfSave">Save as profile</button>
         </div>
         <p class="hint">Saving keeps the firm, the people and the numbers this case already
           carries, so the next assignment from them starts filled in.${
           P.looked ? "" : " Looking for a match reads the saved directory and changes nothing."}</p>`}
    </div>
  </div>`;
}

async function profOpenId(id){
  PROF_MSG = ""; PROF_FORM = null; PROF_CONTACT = null;
  try{
    PROF_OPEN = await api(`/profiles/${encodeURIComponent(id)}`);
  }catch(e){ PROF_OPEN = null; PROF_ERR = e.message; }
  paint();
}

async function profSave(confirmNew){
  const editing = PROF_FORM && PROF_FORM.mode === "edit";
  profFormCollect();
  const F = PROF_FORM, v = F.v || {};
  F.err = ""; F.matches = [];
  const body = {name: v.name || "", email: v.email || "", address: v.address || "",
    billing_name: v.billing_name || "", billing_email: v.billing_email || "",
    notes: v.notes || "", phones: profPhonesOut(v)};
  if((editing ? PROF_OPEN.profile.kind : F.kind) === "law_firm"){
    body.payment_arrangement = v.payment_arrangement || "";
  }
  try{
    if(editing){
      if(confirmNew) body.confirm_new = true;
      const r = await api(`/profiles/${PROF_OPEN.profile.id}`, {method: "POST", body});
      PROF_OPEN.profile = r.profile;
      PROF_FORM = null; PROF_MSG = "Saved. Cases already created keep the details they were created with.";
    }else{
      body.kind = F.kind;
      if(confirmNew) body.confirm_new = true;
      const r = await api("/profiles", {method: "POST", body});
      PROF_FORM = null; PROF_MSG = `${r.profile.name} saved.`;
      await loadProfiles();
      await profOpenId(r.profile.id);
      return;
    }
  }catch(e){
    /* The refusal carries what it matched, so the office is shown the firm it
       might already have rather than a sentence about one. */
    if(e.code === "possible_duplicate"){ F.matches = e.matches || []; }
    else F.err = e.message;
  }
  paint();
}

async function profContactSave(id, confirmNew){
  profContactCollect();
  const C = PROF_CONTACT, v = C.v || {};
  C.err = ""; C.matches = [];
  const body = {first_name: v.first_name || "", last_name: v.last_name || "",
    role: v.role || "", email: v.email || "", preferred: !!v.preferred,
    phones: profPhonesOut(v)};
  if(confirmNew) body.confirm_new = true;
  const pid = PROF_OPEN.profile.id;
  try{
    const r = id
      ? await api(`/profiles/${pid}/contacts/${id}`, {method: "POST", body})
      : await api(`/profiles/${pid}/contacts`, {method: "POST", body});
    PROF_OPEN.profile = r.profile; PROF_CONTACT = null;
  }catch(e){
    if(e.code === "possible_duplicate_contact"){ C.matches = e.matches || []; }
    else C.err = e.message;
  }
  paint();
}

/* Starting an assignment from a profile: the one workflow this whole unit is
   for. It opens the quick form already filled in, on the door that matches the
   profile's type, with the preferred contact chosen and everything editable. */
function profStart(p){
  const kind = p.kind === "law_firm" ? "legal" : p.kind === "insurance_org" ? "claims" : "consumer";
  const contact = (p.contacts || []).find(c => c.preferred && c.active)
    || (p.contacts || []).find(c => c.active) || null;
  NL = {kind, profile: p, profile_id: p.id, contact_id: contact ? contact.id : null, v: {}};
  nlPrefill(p, contact);
  PROF_OPEN = null; PROF_FORM = null; PROF_CONTACT = null;
  TAB = "newlead";
  paint();
}

/* PREFILL IS A COPY INTO THE FORM, and that is the whole architecture in one
   function: from here on the values belong to the assignment. The office may
   change any of them, and changing one changes this case and nothing else —
   the saved profile is only written by the profile screens. */
function nlPrefill(p, contact){
  const v = NL.v || (NL.v = {});
  const firstPhone = (p.phones || [])[0];
  const contactPhone = contact && (contact.phones || [])[0];
  const who = contact ? [contact.first_name, contact.last_name].filter(Boolean).join(" ") : "";
  if(NL.kind === "legal"){
    v.nl_firm = p.name;
    v.nl_atty = who;
    v.nl_email = (contact && contact.email) || p.email || "";
    v.nl_phone = (contactPhone && contactPhone.number) || (firstPhone && firstPhone.number) || "";
    if(p.payment_arrangement) v.nl_arrangement = p.payment_arrangement;
    /* THE FIRM'S OWN DETAILS RIDE ALONG, not just the person's. The owner's
       words are "do not ask Admin to re-enter the firm's address and contact
       data" — without these the case's Legal panel opened blank on the office
       address and the switchboard, and somebody retyped a letterhead the
       portal already had. They are not rendered as inputs on this short form;
       they are carried on the draft and posted with it. */
    NL.firm = {
      firm_address: p.address || "",
      firm_phone: (firstPhone && firstPhone.number) || "",
      firm_email: p.email || "",
      billing_name: p.billing_name || "",
      billing_email: p.billing_email || "",
    };
  }else if(NL.kind === "claims"){
    v.nl_carrier = p.name;
    v.nl_client = who;
    v.nl_email = (contact && contact.email) || p.email || "";
    v.nl_phone = (contactPhone && contactPhone.number) || (firstPhone && firstPhone.number) || "";
    NL.firm = null;
  }else{
    v.nl_client = p.name;
    v.nl_email = p.email || "";
    v.nl_phone = (firstPhone && firstPhone.number) || "";
    /* A repeat private client's address is identity, not a case fact. */
    NL.firm = {client_address: p.address || ""};
  }
  /* NOTHING CASE-SPECIFIC IS PREFILLED. Not a claim number, not a subject, not
     an objective, not a matter number, not a deadline — those belong to the
     new matter and the owner said so in as many words. */
}

/* The picker inside a quick intake form. It is a FOCUSED profile search, not
   the global case search — that is Unit 8. No media, no Dropbox, one route. */
async function nlPickSearch(q){
  NL.pick = NL.pick || {};
  NL.pick.q = q;
  if(!q || q.length < 2){ NL.pick.results = null; paint(); return; }
  const kind = NL.kind === "legal" ? "law_firm" : NL.kind === "claims" ? "insurance_org" : "private_client";
  try{
    const d = await api(`/profiles?kind=${kind}&q=${encodeURIComponent(q)}&limit=8`);
    NL.pick.results = d.profiles || [];
    NL.pick.not_set_up = !!d.not_set_up;
  }catch(e){ NL.pick.results = []; NL.pick.err = e.message; }
  paint();
}

/* Payment options on the send wizard (PAYMENTS.md §3, owner 2026-08-15).

   PRIVATE SHEET ONLY, and this function returns nothing at all for the carrier
   one — no hidden section, no disabled control, nothing an adjuster's sheet
   could ever render. The Worker refuses `include_payment` on the insurance
   sheet regardless, so this is the second of two independent gates rather than
   the only one.

   actually sendable are offered: a method with no payment link cannot be
   ticked here, because the send would be refused and the client would get an
   option they cannot tap. That refusal has a repair screen now, and this
   points at it by name. */
function wizPaymentSendable(){
  return (PAYCFG || []).filter(m => m.enabled && (m.url || "").trim());
}

/* The wizard opens from Rate sheets and from a lead, neither of which has been
   near Settings, so the configuration is fetched on demand. Everything
   sendable starts ticked: the owner's onboarding flow sends the sheet, the
   intake and both payment options together, and an admin unticks what they do
   not want rather than hunting for what they do. */
async function wizPaymentLoad(){
  if(!SHEET_WIZ || SHEET_WIZ.sheet !== "private_retainer") return;
  if(!PAYCFG) await loadPaymentMethods();
  if(!SHEET_WIZ) return;
  if(!(SHEET_WIZ.payMethods || []).length){
    SHEET_WIZ.payMethods = wizPaymentSendable().map(m => m.id);
  }
  paint();
}
