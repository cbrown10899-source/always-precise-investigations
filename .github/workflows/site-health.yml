name: Daily site health
# Probes the LIVE domain every morning: security headers, TLS expiry,
# every sitemap URL answering 200 (with slow-page notes), robots and
# security.txt, and a homepage weight budget. Green runs are silent;
# a failure fails the workflow AND opens an issue with the report.
on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 7:00 AM ET daily
  workflow_dispatch: {}
permissions:
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Probe alwayspreciseinvestigations.net
        run: |
          set -uo pipefail
          D="https://alwayspreciseinvestigations.net"
          HOST="alwayspreciseinvestigations.net"
          FAILS=0
          R=report.md
          echo "# Site health — $HOST — $(date -u +%F)" > $R
          ok()   { echo "- ✅ $1" >> $R; }
          note() { echo "- 🐢 $1" >> $R; }
          bad()  { echo "- ❌ $1" >> $R; FAILS=$((FAILS+1)); }

          echo "## Security headers" >> $R
          H=$(curl -sSI --max-time 20 "$D/" || true)
          for h in strict-transport-security content-security-policy x-content-type-options x-frame-options referrer-policy permissions-policy cross-origin-opener-policy; do
            if echo "$H" | grep -qi "^$h:"; then ok "$h"; else bad "missing header: $h"; fi
          done

          echo "## TLS certificate" >> $R
          END=$(echo | openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2 || true)
          if [ -n "$END" ]; then
            LEFT=$(( ($(date -d "$END" +%s) - $(date +%s)) / 86400 ))
            if [ "$LEFT" -ge 14 ]; then ok "certificate valid, $LEFT days left"; else bad "certificate expires in $LEFT days"; fi
          else
            bad "could not read TLS certificate"
          fi

          echo "## Sitemap sweep (every indexed URL)" >> $R
          N=0
          for u in $(curl -s --max-time 20 "$D/sitemap.xml" | grep -oP '(?<=<loc>)[^<]+'); do
            N=$((N+1))
            res=$(curl -so /dev/null --max-time 25 -w '%{http_code} %{time_total}' "$u" || echo "000 0")
            code=${res%% *}; t=${res##* }
            if [ "$code" != "200" ]; then bad "$u → HTTP $code"
            elif awk "BEGIN{exit !($t>3.0)}"; then note "$u took ${t}s"; fi
          done
          if [ "$N" -gt 0 ]; then ok "$N sitemap URLs checked"; else bad "sitemap returned no URLs"; fi

          echo "## Plumbing" >> $R
          for p in /robots.txt /.well-known/security.txt; do
            c=$(curl -so /dev/null --max-time 20 -w '%{http_code}' "$D$p" || echo 000)
            if [ "$c" = "200" ]; then ok "$p"; else bad "$p → HTTP $c"; fi
          done

          echo "## Speed proxy" >> $R
          SZ=$(curl -so /dev/null --max-time 20 -w '%{size_download}' "$D/" || echo 0)
          TT=$(curl -so /dev/null --max-time 20 -w '%{time_total}' "$D/" || echo 0)
          if [ "$SZ" -lt 150000 ] && [ "$SZ" -gt 1000 ]; then ok "homepage document ${SZ} bytes in ${TT}s"; else bad "homepage document out of range: ${SZ} bytes"; fi

          cat $R >> "$GITHUB_STEP_SUMMARY"
          [ "$FAILS" -eq 0 ]
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "Site health check failed — $(date -u +%F)" \
            --body-file report.md || true
