name: Daily site health
# Probes the LIVE domain: security headers, TLS expiry, every sitemap URL,
# robots/security.txt, and a homepage weight budget. Detects Cloudflare
# bot challenges explicitly so a blocked probe can't masquerade as a real
# result. Green runs are silent; failures update/open a single issue.
on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 7:00 AM ET daily
  workflow_dispatch: {}
permissions:
  issues: write
# A manual run overlapping the scheduled one would have both probes editing
# the same tracking issue.
concurrency:
  group: site-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Probe alwayspreciseinvestigations.net
        run: |
          set -uo pipefail
          D="https://alwayspreciseinvestigations.net"
          HOST="alwayspreciseinvestigations.net"
          MARKER="Always Precise"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36 CorlinHealthCheck/1.0"
          CURL=(curl -sS --max-time 25 --compressed -A "$UA" -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" -H "Accept-Language: en-US,en;q=0.9")
          FAILS=0
          R=report.md
          echo "# Site health — $HOST — $(date -u +%F)" > $R
          ok()   { echo "- ✅ $1" >> $R; }
          note() { echo "- 🐢 $1" >> $R; }
          bad()  { echo "- ❌ $1" >> $R; FAILS=$((FAILS+1)); }

          echo "## Reachability" >> $R
          HDRS=$(mktemp); BODY=$(mktemp)
          CODE=$("${CURL[@]}" -D "$HDRS" -o "$BODY" -w '%{http_code}' "$D/" || echo 000)
          CFM=$(grep -i '^cf-mitigated:' "$HDRS" | tr -d '\r' || true)
          if [ -n "$CFM" ] || [ "$CODE" = "403" ] || [ "$CODE" = "503" ]; then
            bad "Cloudflare is challenging this probe (HTTP $CODE ${CFM:-}). Every result below is the CHALLENGE PAGE, not the site. Fix: Cloudflare dashboard → Security → WAF → Custom rules → 'Skip' rule where User-Agent contains 'CorlinHealthCheck' (works for WAF/Security-Level challenges; free-plan Bot Fight Mode has no exceptions — it must be toggled off for this probe to pass)."
          elif [ "$CODE" != "200" ]; then
            bad "homepage → HTTP $CODE"
          elif ! grep -q "$MARKER" "$BODY"; then
            bad "homepage answered 200 but does not contain '$MARKER' — wrong or placeholder content served"
          else
            ok "homepage 200 with expected content"
          fi

          echo "## Security headers" >> $R
          for h in strict-transport-security content-security-policy x-content-type-options x-frame-options referrer-policy permissions-policy cross-origin-opener-policy; do
            if grep -qi "^$h:" "$HDRS"; then ok "$h"; else bad "missing header: $h"; fi
          done

          echo "## TLS certificate" >> $R
          END=$(echo | openssl s_client -servername "$HOST" -connect "$HOST:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2 || true)
          if [ -n "$END" ]; then
            LEFT=$(( ($(date -d "$END" +%s) - $(date +%s)) / 86400 ))
            if [ "$LEFT" -ge 14 ]; then ok "certificate valid, $LEFT days left"; else bad "certificate expires in $LEFT days"; fi
          else
            bad "could not read TLS certificate"
          fi

          echo "## Sitemap sweep (every indexed URL)" >> $R
          N=0
          for u in $("${CURL[@]}" "$D/sitemap.xml" | grep -oP '(?<=<loc>)[^<]+'); do
            N=$((N+1))
            res=$("${CURL[@]}" -o /dev/null -w '%{http_code} %{time_total}' "$u" || echo "000 0")
            code=${res%% *}; t=${res##* }
            if [ "$code" != "200" ]; then bad "$u → HTTP $code"
            elif awk "BEGIN{exit !($t>3.0)}"; then note "$u took ${t}s"; fi
          done
          if [ "$N" -gt 0 ]; then ok "$N sitemap URLs checked"; else bad "sitemap returned no URLs"; fi

          echo "## Plumbing" >> $R
          for p in /robots.txt /.well-known/security.txt; do
            c=$("${CURL[@]}" -o /dev/null -w '%{http_code}' "$D$p" || echo 000)
            if [ "$c" = "200" ]; then ok "$p"; else bad "$p → HTTP $c"; fi
          done

          echo "## Speed proxy" >> $R
          SZ=$(wc -c < "$BODY")
          if [ "$SZ" -lt 150000 ] && [ "$SZ" -gt 8000 ]; then ok "homepage document ${SZ} bytes"; else bad "homepage document out of range: ${SZ} bytes"; fi

          cat $R >> "$GITHUB_STEP_SUMMARY"
          [ "$FAILS" -eq 0 ]
      - name: Report failure in one issue (no daily duplicates)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list -R "${{ github.repository }}" --state open --search "Site health check failing in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" -R "${{ github.repository }}" --body-file report.md
          else
            gh issue create -R "${{ github.repository }}" --title "Site health check failing" --body-file report.md
          fi
