name: Rebuild location pages

# build-locations.py is the source of truth for the /private-investigator/
# pages, the service-area hub and sitemap.xml — but the generated HTML is what
# is committed and deployed. Running the generator here keeps the two from
# drifting, and means editing the PLACES list is enough to add a service area
# (no local Python needed).
on:
  push:
    branches: [master]
    paths: ['build-locations.py']
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

# This job commits to master. Two overlapping runs would race on the push and
# one would fail outright, so let an in-flight rebuild finish rather than
# cancelling it midway.
concurrency:
  group: build-locations
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Generate pages
        run: python3 build-locations.py

      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Generator output already matches the committed pages."
            exit 0
          fi
          git add private-investigator sitemap.xml
          git commit -m "Rebuild location pages from build-locations.py"

          # master can move while this run is building. A bare push would just
          # be rejected and fail the job, so rebase onto whatever landed and
          # try again. The commit only touches generated files, so replaying it
          # on a newer base is safe.
          for attempt in 1 2 3; do
            if git push; then
              echo "deployed=yes" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/master."
            git pull --rebase origin master
          done
          echo "Could not push the rebuild after 3 attempts." >&2
          exit 1

      # A push made with GITHUB_TOKEN deliberately does not trigger other
      # workflows, so the commit above would sit undeployed. Ask for the
      # deploy explicitly.
      - name: Deploy the rebuilt pages
        if: env.deployed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
