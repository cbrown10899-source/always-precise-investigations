name: Deploy site to Cloudflare Pages

# Every push to master rebuilds the public site and deploys it to the
# existing "always-precise" Pages project. No manual uploads.
on:
  push:
    branches: [master]
  workflow_dispatch: {}   # lets you trigger a deploy by hand from the Actions tab

# One deploy at a time, newest wins. A push that touches build-locations.py
# starts a deploy of the pre-rebuild tree, and the rebuild then dispatches a
# second deploy of the regenerated tree. Left to race, the older run can land
# last and publish stale pages. Cancelling the in-flight run makes the most
# recent content the one that ends up live.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The artifact is built from an explicit ALLOW-LIST
      # (.github/deploy-manifest.txt), not from the repository minus a list of
      # excludes. That distinction is the whole reason this step was rewritten:
      # with excludes, every new file and directory was public by default and a
      # guard was the only thing between it and the internet. On 2026-08-14
      # .claude/agents/*.md arrived, the markdown guard correctly refused it,
      # and THE PUBLIC SITE STOPPED DEPLOYING for four merges — while
      # deploy-portal.yml kept shipping the Worker, so the portal moved and the
      # website did not, with nothing saying so. Adding one more --exclude fixes
      # that instance and leaves the next one waiting.
      #
      # The stager also FAILS if a listed path has gone missing, so a renamed
      # page is caught here rather than by someone finding a 404 weeks later.
      #
      # .github/test-deploy.mjs runs this same script and asserts what may and
      # may not appear in the artifact. Run it after touching either file.
      - name: Stage public site (explicit allow-list)
        run: node .github/stage-site.mjs _site

      - name: Prove the artifact is safe to publish
        run: node .github/test-deploy.mjs

      # "Has the site actually deployed?" was unanswerable from outside for four
      # days, which is how the freeze went unnoticed. This makes it one request:
      #   curl https://alwayspreciseinvestigations.net/.well-known/build.txt
      # Written AFTER the guard runs, so the artifact test sees a pure tree.
      # It publishes a short commit hash and a timestamp and nothing else — no
      # branch, no message, no author. If even that is unwanted, delete this
      # step; nothing depends on the file.
      - name: Stamp the build so "what is live" is answerable
        run: |
          mkdir -p _site/.well-known
          printf 'commit: %s\nbuilt:  %s\n' \
            "$(echo "$GITHUB_SHA" | cut -c1-7)" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/.well-known/build.txt
          cat _site/.well-known/build.txt

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 63a4b8fd9efe4137e1f91c49b5e61c6f
          command: pages deploy _site --project-name=always-precise --branch=main --commit-dirty=true
