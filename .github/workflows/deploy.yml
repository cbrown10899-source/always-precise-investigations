name: Deploy site to Cloudflare Pages

# Every push to master rebuilds the public site and deploys it to the
# existing "always-precise" Pages project. No manual uploads.
on:
  push:
    branches: [master]
  workflow_dispatch: {}   # lets you trigger a deploy by hand from the Actions tab

# One deploy at a time, newest wins. A push that touches build-locations.py
# starts a deploy of the pre-rebuild tree, and the rebuild then dispatches a
# second deploy of the regenerated tree. Left to race, the older run can land
# last and publish stale pages. Cancelling the in-flight run makes the most
# recent content the one that ends up live.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage public site (exclude non-site files)
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'visitor-alerts' \
            --exclude 'case-portal' \
            --exclude 'build-locations.py' \
            --exclude 'README.md' \
            --exclude 'CLAUDE.md' \
            --exclude '*.mjs' \
            ./ _site/
          # Internal notes must never reach the public site. CLAUDE.md was
          # being published until 2026-08-12 — it describes where each
          # boundary is enforced, which is a map for anyone probing them.
          # case-portal/ is excluded above and is the only home for anything
          # internal; a rate sheet in the repo root would be served verbatim.
          for leak in CLAUDE.md README.md PRICING.md; do
            if [ -e "_site/$leak" ]; then echo "::error::$leak staged for deploy"; exit 1; fi
          done
          if find _site -name '*.md' | grep -q .; then
            echo "::error::markdown staged for deploy:"; find _site -name '*.md'; exit 1
          fi
          # Test suites are not part of the site. They were served publicly
          # until 2026-08-12 — no secrets in them, but a public copy of the
          # test harness is a map of exactly what the defenses check.
          if find _site -name '*.mjs' | grep -q .; then
            echo "::error::test files staged for deploy:"; find _site -name '*.mjs'; exit 1
          fi
          echo "Files to deploy:"; find _site -type f | wc -l

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 63a4b8fd9efe4137e1f91c49b5e61c6f
          command: pages deploy _site --project-name=always-precise --branch=main --commit-dirty=true
