name: Deploy case-portal Worker

# Uploads new Worker code while KEEPING the deployed bindings, vars and
# secrets (content-only PUT), the same way the visitor-alerts Worker deploys.
# The D1 binding is configured once by hand — see case-portal/README.md — and
# is preserved by this upload.
on:
  push:
    branches: [master]
    paths: ['case-portal/worker.js']
  workflow_dispatch: {}

# Two overlapping uploads of the same script; newest content wins.
concurrency:
  group: deploy-portal
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Test before deploying
        run: node case-portal/test-worker.mjs

      - name: Upload Worker content (settings preserved)
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          NAME=api-case-portal
          ACCT=63a4b8fd9efe4137e1f91c49b5e61c6f
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/scripts/$NAME/content" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@case-portal/worker.js;type=application/javascript+module' \
            -o /dev/null -w 'upload HTTP %{http_code}\n'

      - name: Health check
        run: |
          sleep 5
          curl -sf https://api-case-portal.corlinllc.workers.dev/health; echo
