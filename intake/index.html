<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Intake — Always Precise Investigations</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e1a2c">
<style>
  :root{
    --navy:#0e1a2c; --navy-2:#13273f; --teal:#2f7d90; --teal-2:#3d97ad;
    --gold:#c99a3b; --ink:#1c2531; --muted:#5c6775; --line:#dfe3e8;
    --paper:#f4f5f7; --card:#ffffff; --good:#1c8a4d; --bad:#c14133;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}
  .top{background:var(--navy);color:#fff;padding:16px 20px;}
  .top .wrap{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .mark{width:34px;height:34px;flex:none;}
  .top .name{font-weight:700;letter-spacing:.03em;font-size:1.02rem;line-height:1.15;}
  .top .name span{display:block;font-weight:400;font-size:.72rem;color:#9db2c9;letter-spacing:.05em;}
  .top .meta{margin-left:auto;text-align:right;font-size:.74rem;color:#9db2c9;line-height:1.5;}
  .top .meta a{color:#cfe0f0;text-decoration:none;font-weight:600;}

  main{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
  .progress{display:flex;gap:6px;margin:6px 0 18px;}
  .progress i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .2s;}
  .progress i.done{background:var(--teal-2);}
  .stepno{font-size:.78rem;color:var(--muted);margin-bottom:14px;letter-spacing:.03em;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(16,29,51,.05);}
  h1{font-size:1.3rem;margin-bottom:4px;}
  .lead{color:var(--muted);font-size:.92rem;margin-bottom:18px;}
  label.f{display:block;margin-bottom:14px;}
  label.f > span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;}
  label.f > span .req{color:var(--bad);}
  input[type=text],input[type=tel],input[type=email],select,textarea{
    width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:11px 12px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-2);border-color:var(--teal-2);}
  textarea{min-height:96px;resize:vertical;}
  .hint{font-size:.78rem;color:var(--muted);margin-top:4px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  @media(max-width:520px){.two{grid-template-columns:1fr;}}

  .opt{display:block;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s;}
  .opt:hover{border-color:var(--teal-2);}
  .opt.sel{border-color:var(--teal-2);background:#f0f8fa;}
  .opt .badge{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--teal-2);
    color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;vertical-align:middle;}
  .opt input{margin-right:8px;}
  .opt b{font-size:1rem;}
  .opt .desc{color:var(--muted);font-size:.86rem;margin-top:2px;}
  .opt .price{float:right;color:var(--navy);font-weight:700;}

  .feebox{background:#f0f8fa;border:1px solid #cfe6ec;border-radius:10px;padding:14px 16px;margin:4px 0 16px;font-size:.9rem;}
  .feebox .row{display:flex;justify-content:space-between;padding:3px 0;}
  .feebox .due{border-top:1px solid #cfe6ec;margin-top:6px;padding-top:8px;font-weight:700;font-size:1.02rem;}
  .agree{font-size:.82rem;color:#3a4653;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fbfbfc;margin-bottom:14px;}
  .agree h4{margin:10px 0 4px;font-size:.85rem;color:var(--ink);}
  .agree p{margin-bottom:8px;}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;margin-bottom:14px;}
  .chk input{margin-top:3px;flex:none;width:18px;height:18px;}

  .sigwrap{border:1px solid var(--line);border-radius:8px;background:#fff;position:relative;}
  canvas#sig{display:block;width:100%;height:170px;border-radius:8px;touch-action:none;cursor:crosshair;}
  .sigline{position:absolute;left:16px;right:16px;bottom:34px;border-bottom:1px solid #c7ccd3;pointer-events:none;}
  .sigx{position:absolute;left:16px;bottom:16px;color:var(--muted);font-size:.8rem;pointer-events:none;}
  .sigclear{position:absolute;right:10px;top:10px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:.78rem;padding:4px 10px;cursor:pointer;color:var(--muted);}

  .pay-opt{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 4px;}
  .pay-opt .opt{flex:1;min-width:150px;margin:0;text-align:center;}
  .pay-btn{display:inline-block;width:100%;text-align:center;color:#fff;font-weight:700;text-decoration:none;padding:14px;border-radius:8px;font-size:1.05rem;margin-top:6px;}
  .pay-btn.venmo{background:#3D95CE;} .pay-btn.cashapp{background:#00C244;}

  .nav{display:flex;gap:10px;margin-top:20px;}
  .btn{font:inherit;font-size:1rem;font-weight:700;border:0;border-radius:8px;padding:13px 22px;cursor:pointer;}
  .btn.primary{background:var(--teal);color:#fff;flex:1;}
  .btn.primary:hover{background:var(--teal-2);}
  .btn.primary:disabled{opacity:.6;cursor:default;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1em;}

  .record{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;}
  .record h2{font-size:1.2rem;margin-bottom:2px;}
  .record .case{color:var(--teal);font-weight:700;font-family:ui-monospace,monospace;}
  .record dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:.9rem;}
  .record dt{color:var(--muted);}
  .record dd{color:var(--ink);}
  .record img.sig{max-width:260px;border-bottom:1px solid #c7ccd3;margin-top:4px;}
  .ok{background:#e9f7ef;border:1px solid #b6e0c6;color:#166534;border-radius:8px;padding:12px 14px;font-size:.9rem;margin-bottom:14px;}
  .warn{background:#fdecea;border:1px solid #f5c6c0;color:#8a2318;border-radius:8px;padding:12px 14px;font-size:.9rem;margin-bottom:14px;}
  .foot{max-width:680px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.78rem;text-align:center;}
  @media print{.top .meta,.nav,.sigclear{display:none;}body{background:#fff;}}
.sr-page-title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="10" fill="#13273f"/><path d="M32 12l6 8-6 8-6-8z" fill="#3d97ad"/><path d="M32 30l10 12H22z" fill="#c99a3b"/></svg>
    <div class="name">ALWAYS PRECISE<span>INVESTIGATIONS · CLIENT INTAKE</span></div>
    <div class="meta">
      <a id="m-phone" href="tel:+14349070975">(434) 907-0975</a><br>
      <span id="m-lic">Va DCJS #11-9159</span>
    </div>
  </div>
</div>

<main>
  <div class="stepno">Case <b id="caseno" style="font-family:ui-monospace,monospace;color:var(--teal)"></b></div>
  <div class="progress" id="progress"></div>

  <div id="app"></div>
</main>
<div class="foot">Confidential. Submitted only to Always Precise Investigations. Licensed &amp; insured · Va DCJS #11-9159.</div>

<script>
"use strict";

/* ============ Phase 1: Configuration ============ */
const FIRM = {
  name:    "Always Precise Investigations",
  phone:   "(434) 907-0975",
  tel:     "+14349070975",
  email:   "AlwaysPreciseInvestigations@gmail.com",
  license: "11-9159",          // Va DCJS
  venmo:   "Trever-Brown9",    // NO @  (personal — swap to business before client use)
  cashtag: "TreverB"           // NO $  (personal — swap to business before client use)
};
/* ============ Rate card ============
   THE ONLY PLACE PRICES ARE SET. Change a number here and it changes the option
   the client picks, the agreement they sign, the amount in the Venmo and Cash
   App links, the printed payment sheet and what is recorded in the portal.
   Nothing downstream hard-codes a figure.

   These are derived from the firm's own hourly rate below: 4 hours at cost as
   the entry point, then a widening discount so a longer engagement is worth
   committing to. The 3-day block works out to about $92/hr.

   Adding or removing a block is safe — the step renders whatever is in this
   array, and `id` is what gets stored, so keep an id stable once it has been
   used on a real case. */
const HOURLY = 100;          // overage rate once a block is used up
const PACKAGES = [
  { id:"half",  label:"Half day",   hours:4,  price:400,
    desc:"A single window — a shift change, a scheduled appointment, one evening." },
  { id:"day",   label:"Full day",   hours:8,  price:800,
    desc:"A full day of coverage. The usual starting point when a pattern is not yet known." },
  { id:"two",   label:"Two days",   hours:16, price:1500, tag:"Most chosen",
    desc:"Two days, usually split to compare a weekday against a weekend." },
  { id:"three", label:"Three days", hours:24, price:2200, tag:"Best value",
    desc:"Three days across a week. Enough to establish a routine rather than a snapshot." },
];
const pkg = id => PACKAGES.find(p => p.id === id) || null;

const FEES = {
  surveillance: { label:"Surveillance", hourly:HOURLY, packages:true },
  process:      { label:"Process Serving", flat:150 },
  // Carrier work is invoiced, not paid up front through a consumer payment app.
  // No rate is published here on purpose: claims rates are set per fee schedule
  // and confirmed in writing before work begins. The blocks above are consumer
  // pricing and must not be shown on the claims path.
  claims:       { label:"Insurance Claim Assignment", billed:true }
};
/* Web3Forms access key goes here for email delivery; until then submissions
   go through FormSubmit to the firm inbox (needs one-time activation). */
const WEB3FORMS_KEY = "71016cd4-875b-4e71-9cb8-1a1c13f50c43";

/* The case portal keeps a record of every submission so it can be looked up
   later — email alone leaves no searchable history. This key is not a secret
   (this page is public, so anyone can read it); it only keeps casual noise out
   of the table, which the Worker also rate- and size-limits. Delivery to the
   firm inbox stays on Web3Forms, so a portal outage cannot lose a client. */
const PORTAL_API = "/portal-api";
const PORTAL_INGEST_KEY = "8d9ad57784dbc7e00d86806d2c186d60337fb4f762ea5f100ef311f70a84eb7b";

/* ============ State ============ */
const CASE_NO = "API-" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-" + String(Math.floor(1000+Math.random()*9000));
const S = { step:0, svc:null, pkg:null, pay:null, sig:null, files:[] };
// A carrier assignment collects claim details and ends in invoicing, so the
// claims path has its own step list; surveillance adds a step to choose how
// much coverage to buy. All three share the first two steps, which is what
// makes it safe to switch service without stranding S.step.
const STEPS       = ["info","service","subject","objective","agreement","payment"];
const SURV_STEPS  = ["info","service","package","subject","objective","agreement","payment"];
const CLAIM_STEPS = ["info","service","claim","subject","objective","agreement","billing"];
function steps(){
  if(S.svc==="claims") return CLAIM_STEPS;
  return S.svc==="surveillance" ? SURV_STEPS : STEPS;
}
function isClaims(){ return S.svc==="claims"; }
const app = document.getElementById("app");
const $ = id => document.getElementById(id);

/* keep field values across step re-renders */
const val = {};
function capture(scope){ (scope||document).querySelectorAll("[data-k]").forEach(el=>{ val[el.dataset.k] = el.type==="checkbox" ? el.checked : el.value; }); }

/* ============ Boot ============ */
document.addEventListener("DOMContentLoaded", () => {
  $("caseno").textContent = CASE_NO;
  $("m-phone").textContent = FIRM.phone; $("m-phone").href = "tel:" + FIRM.tel;
  $("m-lic").textContent = "Va DCJS #" + FIRM.license;
  render();
});

const money = n => "$" + Number(n).toLocaleString();
function svc(){ return S.svc ? FEES[S.svc] : null; }
function amountDue(){
  const f=svc(); if(!f) return 0;
  if(isClaims()) return 0;            // invoiced to the carrier, nothing due at intake
  if(S.svc==="surveillance"){ const p=pkg(S.pkg); return p ? p.price : 0; }
  return f.flat;
}

/* ============ Render ============ */
// The two paths have different step counts, so the progress bar is rebuilt
// whenever the count changes rather than being fixed once at boot.
function paintProgress(){
  const p=$("progress"), n=steps().length;
  if(p.children.length!==n){
    p.innerHTML="";
    for(let i=0;i<n;i++) p.insertAdjacentHTML("beforeend","<i></i>");
  }
  [...p.children].forEach((el,i)=> el.classList.toggle("done", i<=S.step));
}
function render(){
  const step = steps()[S.step];
  paintProgress();
  app.innerHTML = view(step);
  restore();
  if(step==="agreement") initSig();
  if(step==="payment") paintPay();
  window.scrollTo(0,0);
}
function restore(){ document.querySelectorAll("[data-k]").forEach(el=>{ if(val[el.dataset.k]!==undefined){ if(el.type==="checkbox") el.checked=val[el.dataset.k]; else el.value=val[el.dataset.k]; } }); }

function navButtons(nextLabel){
  return `<div class="nav">
    ${S.step>0 ? `<button type="button" class="btn ghost" onclick="back()">Back</button>` : ""}
    <button type="button" class="btn primary" onclick="next()">${nextLabel||"Continue"}</button>
  </div><div class="err" id="err"></div>`;
}

function view(step){
  if(step==="info") return `<div class="card">
    <h1 class="sr-page-title">Client Intake</h1>
    <h2>Your information</h2>
    <p class="lead">Tell us how to reach you. Everything you share is confidential.</p>
    <label class="f"><span>Full name <b class="req">*</b></span><input type="text" data-k="c_name" autocomplete="name"></label>
    <div class="two">
      <label class="f"><span>Phone</span><input type="tel" data-k="c_phone" autocomplete="tel"></label>
      <label class="f"><span>Email</span><input type="email" data-k="c_email" autocomplete="email"></label>
    </div>
    <p class="hint" style="margin-top:-6px;margin-bottom:12px;">Give us at least one — phone or email.</p>
    <label class="f"><span>Mailing address</span><input type="text" data-k="c_addr" autocomplete="street-address" placeholder="Street, City, VA, ZIP"></label>
    <label class="f"><span>Best time to reach you</span><input type="text" data-k="c_best" placeholder="e.g. weekday evenings"></label>
    ${navButtons()}
  </div>`;

  if(step==="service") return `<div class="card">
    <h2>What do you need?</h2>
    <p class="lead">Select the service. Fees are shown up front — no surprises.</p>
    <label class="opt" id="opt-surveillance" onclick="pickSvc('surveillance')">
      <span class="price">From ${money(PACKAGES[0].price)}</span>
      <input type="radio" name="svc" ${S.svc==="surveillance"?"checked":""}><b>Surveillance</b>
      <div class="desc">Documented surveillance for personal or legal matters. Bought in blocks of coverage from ${PACKAGES[0].hours} hours (${money(PACKAGES[0].price)}) &mdash; you choose how much on the next step.</div>
    </label>
    <label class="opt" id="opt-process" onclick="pickSvc('process')">
      <span class="price">${money(FEES.process.flat)} flat</span>
      <input type="radio" name="svc" ${S.svc==="process"?"checked":""}><b>Process Serving</b>
      <div class="desc">Reliable service of legal documents across Virginia. ${money(FEES.process.flat)} flat fee.</div>
    </label>
    <label class="opt" id="opt-claims" onclick="pickSvc('claims')">
      <span class="price">Invoiced</span>
      <input type="radio" name="svc" ${S.svc==="claims"?"checked":""}><b>Insurance Claim Assignment</b>
      <div class="desc">For carriers, TPAs, self-insured employers and defense counsel. Workers' comp, auto and liability claims — billed to the carrier, nothing due at assignment.</div>
    </label>
    ${navButtons()}
  </div>`;

  if(step==="package"){
    const sel = pkg(S.pkg);
    return `<div class="card">
      <h2>How much coverage?</h2>
      <p class="lead">Surveillance is bought as a block of hours. Pick the one that fits &mdash; we'll
        tell you honestly on the call if we think a different block suits the case better.</p>
      ${PACKAGES.map(p => `
        <label class="opt ${S.pkg===p.id?"sel":""}" id="opt-pkg-${p.id}" onclick="pickPkg('${p.id}')">
          <span class="price">${money(p.price)}</span>
          <input type="radio" name="pkg" ${S.pkg===p.id?"checked":""}><b>${p.label} &mdash; ${p.hours} hours</b>${
            p.tag?`<span class="badge">${p.tag}</span>`:""}
          <div class="desc">${p.desc}</div>
        </label>`).join("")}
      <div class="feebox" style="margin-top:14px">
        <div class="row"><span>Hours are used flexibly</span><span>Across whatever days suit the case</span></div>
        <div class="row"><span>If the case needs longer</span><span>${money(HOURLY)}/hr, only with your approval first</span></div>
        <div class="row due"><span>Due today</span><span>${sel?money(sel.price):"Choose a block above"}</span></div>
      </div>
      <p class="hint">Nothing beyond the block you choose is ever charged without asking you first.
        Questions before you decide? Call ${FIRM.phone}.</p>
      ${navButtons()}
    </div>`;
  }

  if(step==="claim") return `<div class="card">
    <h2>Claim details</h2>
    <p class="lead">Enough to open the file and match our report to yours.</p>
    <label class="f"><span>Carrier / TPA / employer <b class="req">*</b></span><input type="text" data-k="k_carrier" autocomplete="organization" placeholder="Company assigning the file"></label>
    <div class="two">
      <label class="f"><span>Claim number <b class="req">*</b></span><input type="text" data-k="k_claimno"></label>
      <label class="f"><span>Policy number</span><input type="text" data-k="k_policy"></label>
    </div>
    <div class="two">
      <label class="f"><span>Claim type</span>
        <select data-k="k_type">
          <option value="">Select…</option>
          <option>Workers' compensation</option>
          <option>Auto liability</option>
          <option>General liability</option>
          <option>Property</option>
          <option>Disability</option>
          <option>Other</option>
        </select></label>
      <label class="f"><span>Date of loss</span><input type="text" data-k="k_dol" placeholder="MM/DD/YYYY"></label>
    </div>
    <label class="f"><span>Adjuster / assigning contact</span><input type="text" data-k="k_adjuster"></label>
    <div class="two">
      <label class="f"><span>Adjuster email</span><input type="email" data-k="k_adj_email" autocomplete="email"></label>
      <label class="f"><span>Adjuster phone</span><input type="tel" data-k="k_adj_phone" autocomplete="tel"></label>
    </div>
    <label class="f"><span>Defense counsel <span class="hint" style="font-weight:400">(if the file is in litigation)</span></span><input type="text" data-k="k_counsel" placeholder="Firm and attorney"></label>
    <label class="f"><span>Billing reference / PO</span><input type="text" data-k="k_po" placeholder="If your billing requires one"></label>
    <label class="f"><span>Prior surveillance on this claim?</span>
      <select data-k="k_prior">
        <option value="">Select…</option>
        <option>None</option>
        <option>Yes — by our firm</option>
        <option>Yes — by another vendor</option>
        <option>Unknown</option>
      </select>
      <span class="hint">Prior activity changes how a subject behaves. Worth knowing before we go out.</span></label>
    ${navButtons()}
  </div>`;

  if(step==="subject") return `<div class="card">
    <h2>${isClaims()?"The claimant":"Subject of the investigation"}</h2>
    <p class="lead">${isClaims()
      ? "Who we are going out on. Addresses and vehicles are what make or break a first day in the field."
      : "Who or what should we look into? Share whatever you know — more detail helps."}</p>
    <label class="f"><span>${isClaims()?"Claimant's name":"Subject's name"}</span><input type="text" data-k="s_name"></label>
    <label class="f"><span>Known address or location</span><input type="text" data-k="s_addr"></label>
    <label class="f"><span>Vehicle / physical description</span><input type="text" data-k="s_desc" placeholder="Make, model, color, plate, appearance…"></label>
    ${isClaims()
      ? `<label class="f"><span>Alleged injury &amp; stated restrictions</span><textarea data-k="s_rel" placeholder="Reported injury, work status, and any restrictions in the file…"></textarea></label>`
      : `<label class="f"><span>Relationship to you</span><input type="text" data-k="s_rel" placeholder="e.g. spouse, tenant, employee, defendant"></label>`}
    <label class="f"><span>Documents or photos</span>
      <input type="file" id="files" multiple onchange="pickFiles(this)" style="font-size:.9rem;padding:8px 0;border:0;">
      <span class="hint" id="filenote">${isClaims()?"Attach the claim file, recorded statement, ISO report or a photo of the claimant.":"Attach court papers or a photo of the subject if you have them."}</span></label>
    ${navButtons()}
  </div>`;

  if(step==="objective") return `<div class="card">
    <h2>${isClaims()?"Scope &amp; deadline":"Your objective"}</h2>
    <p class="lead">${isClaims()
      ? "What does this file need to answer, and by when?"
      : "What outcome are you hoping for, and how soon?"}</p>
    <label class="f"><span>${isClaims()?"What does the file need to establish?":"What do you want to find out or accomplish?"}</span><textarea data-k="o_goal" placeholder="${isClaims()?"e.g. activity level versus stated restrictions, employment verification, scene documentation…":"Describe the situation and the result you need…"}"></textarea></label>
    ${isClaims()?`<label class="f"><span>Authorized hours / budget</span><input type="text" data-k="o_hours" placeholder="e.g. 8 hours authorized, or call before exceeding"></label>`:""}
    <label class="f"><span>${isClaims()?"Deadline":"Timeline / urgency"}</span><input type="text" data-k="o_time" placeholder="${isClaims()?"e.g. hearing 9/12, report needed by 9/1":"e.g. before a court date on 8/15, ASAP, flexible"}"></label>
    <label class="f"><span>Anything else we should know</span><textarea data-k="o_notes" placeholder="Optional"></textarea></label>
    ${navButtons()}
  </div>`;

  if(step==="agreement"){
    const f=svc(), due=amountDue();
    const feeLines = isClaims()
      ? `<div class="row"><span>Billing</span><b>Invoiced to the carrier</b></div>
         <div class="row"><span>Rate</span><span>Per agreed fee schedule</span></div>
         <div class="row"><span>Mileage &amp; travel time</span><span>Not charged in our service area</span></div>`
      : S.svc==="surveillance"
      ? (()=>{ const p=pkg(S.pkg); return `
         <div class="row"><span>Coverage selected</span><b>${p?`${p.label} — ${p.hours} hours`:"—"}</b></div>
         <div class="row"><span>Price for that block</span><b>${p?money(p.price):"—"}</b></div>
         <div class="row"><span>Additional hours, if approved</span><span>${money(f.hourly)}/hr</span></div>`; })()
      : `<div class="row"><span>Flat service fee</span><b>${money(f.flat)}</b></div>`;
    const dueLine = isClaims()
      ? `<div class="row due"><span>Due at assignment</span><span>Nothing — invoiced</span></div>`
      : `<div class="row due"><span>Due today</span><span>${money(due)}</span></div>`;
    return `<div class="card">
      <h2>${isClaims()?"Assignment terms &amp; authorization":"Agreement &amp; signature"}</h2>
      <p class="lead">${isClaims()
        ? `Please review the terms for this <b>${f?f.label.toLowerCase():"assignment"}</b> and authorize below.`
        : `Please review the terms for <b>${f?f.label:"the selected service"}</b> and sign below.`}</p>
      <div class="feebox">${feeLines}${dueLine}</div>
      <div class="agree">
      ${isClaims() ? `
        <h4>Assignment</h4>
        <p>The assigning party retains ${FIRM.name} ("the firm," Va DCJS #${FIRM.license}) to perform the claim investigation described in this intake. Work begins on written acceptance of the assignment; no payment is due at intake.</p>
        <h4>Billing</h4>
        <p>Work is invoiced to the carrier, third-party administrator or assigning employer under the agreed fee schedule. The applicable rate and any estimated hours are confirmed in writing before work begins. Mileage and travel time are not charged within our service area. Authorized hours are not exceeded without prior approval from the assigning contact.</p>
        <h4>Lawful conduct</h4>
        <p>All work is performed lawfully and from lawful vantage points. The firm does not trespass on private property, record into a residence, place tracking devices on vehicles it has no authority over, access accounts or devices, or misrepresent itself to obtain financial or medical records. Surveillance is conducted without contact with the claimant.</p>
        <h4>Reporting</h4>
        <p>Deliverables are a written activity report with a time-stamped narrative, supported by video and photographs, together with the source footage. Negative results are reported as plainly as positive results. The investigator who performed the work is available for deposition and hearing testimony as to what they personally observed.</p>
        <h4>Confidentiality &amp; no guarantee</h4>
        <p>Claim information is kept confidential except as required by law, and work product is released only to the assigning party and its counsel. Investigative work cannot guarantee a particular result or finding.</p>
      ` : `
        <h4>Engagement</h4>
        <p>The client retains ${FIRM.name} ("the firm," Va DCJS #${FIRM.license}) to perform ${f?f.label.toLowerCase():"the selected"} services described in this intake. Work begins after the fee shown above is received.</p>
        <h4>Fees</h4>
        <p>${S.svc==="surveillance"
            ? (()=>{ const p=pkg(S.pkg); return `The client purchases a block of <b>${p?p.hours:"—"} investigative hours</b> for <b>${p?money(p.price):"—"}</b>, due today. Those hours are used across whatever dates and times the firm judges most likely to produce results for the stated objective, and include the written report and the footage gathered. Hours beyond the purchased block are billed at ${money(f.hourly)} per hour and are never incurred without the client's prior approval. Travel within the firm's service area is not charged separately.`; })()
            : `A flat fee of ${money(f.flat)} is due today for one service attempt as permitted by law. Additional attempts or addresses may incur additional fees agreed in advance.`}</p>
        <h4>Lawful purpose &amp; conduct</h4>
        <p>The client affirms a lawful and legitimate purpose for this engagement. The firm does not accept cyber-stalking matters and has no ability to access, hack, or retrieve data from a third party's phone, accounts, or devices. All work is performed lawfully; findings are provided for the client's stated purpose only.</p>
        <h4>Confidentiality &amp; no guarantee</h4>
        <p>The firm keeps client information confidential except as required by law. Investigative work cannot guarantee a particular result or finding.</p>
      `}
      </div>
      <label class="chk"><input type="checkbox" data-k="a_consent"><span>${isClaims()
        ? `I am authorized to assign this claim on behalf of the party named above, and I authorize ${FIRM.name} to proceed on the terms stated.`
        : `I have read and agree to the terms above, I affirm a lawful purpose, and I authorize ${FIRM.name} to proceed.`}</span></label>
      <label class="f"><span>Type your full legal name <b class="req">*</b></span><input type="text" data-k="a_typed" placeholder="Your full legal name"></label>
      <div style="font-size:.85rem;font-weight:600;margin-bottom:6px;">Signature <b class="req">*</b></div>
      <div class="sigwrap">
        <button type="button" class="sigclear" onclick="clearSig()">Clear</button>
        <canvas id="sig"></canvas>
        <div class="sigline"></div><div class="sigx">Sign with your finger or mouse</div>
      </div>
      ${navButtons(isClaims()?"Continue":"Continue to payment")}
    </div>`;
  }

  if(step==="billing") return `<div class="card">
    <h2>Billing</h2>
    <p class="lead">Nothing is due now. This assignment is invoiced to the carrier under the agreed fee schedule.</p>
    <div class="feebox">
      <div class="row"><span>Carrier / TPA</span><b>${esc(val.k_carrier||"—")}</b></div>
      <div class="row"><span>Claim number</span><span>${esc(val.k_claimno||"—")}</span></div>
      ${val.k_po?`<div class="row"><span>Billing reference / PO</span><span>${esc(val.k_po)}</span></div>`:""}
      <div class="row due"><span>Due at assignment</span><span>Nothing — invoiced</span></div>
    </div>
    <label class="f"><span>Send invoices to</span><input type="email" data-k="b_email" placeholder="Accounts payable or billing email"></label>
    <label class="f"><span>Billing notes</span><textarea data-k="b_notes" placeholder="Portal, invoicing requirements, required references…"></textarea></label>
    <p class="hint">We confirm the rate and any estimated hours in writing before going out. Questions on rates? Call ${FIRM.phone}.</p>
    ${navButtons("Submit assignment")}
  </div>`;

  if(step==="payment"){
    const f=svc(), due=amountDue(), p=pkg(S.pkg);
    return `<div class="card">
      <h2>Payment</h2>
      <p class="lead">${p
        ? `<b>${p.label} — ${p.hours} hours of coverage.</b> ${money(due)} is due today to begin.`
        : `A fee of <b>${money(due)}</b> is due today to begin.`} Choose how you'd like to pay.</p>
      <div class="pay-opt">
        <label class="opt ${S.pay==="venmo"?"sel":""}" onclick="pickPay('venmo')"><input type="radio" name="pay" ${S.pay==="venmo"?"checked":""}><b>Venmo</b></label>
        <label class="opt ${S.pay==="cashapp"?"sel":""}" onclick="pickPay('cashapp')"><input type="radio" name="pay" ${S.pay==="cashapp"?"checked":""}><b>Cash App</b></label>
      </div>
      <div id="paylink"></div>
      <p class="hint">Payments go to ${FIRM.name} (Trever Brown). Please confirm the name in the app before sending. You can also pay by another method — just call ${FIRM.phone}.</p>
      ${navButtons("Submit intake")}
    </div>`;
  }
  return "";
}

/* ============ Step actions ============ */
function pickSvc(k){ capture(); S.svc=k; if(k!=="surveillance") S.pkg=null; render(); }
function pickPkg(k){ capture(); S.pkg=k; render(); }
function pickPay(k){ capture(); S.pay=k; paintPay(); document.querySelectorAll(".pay-opt .opt").forEach(o=>o.classList.remove("sel")); }
function pickFiles(input){ S.files=[...input.files].map(f=>f.name); const n=$("filenote"); if(n) n.textContent = S.files.length? S.files.length+" file(s) attached: "+S.files.join(", ") : "Attach court papers or a photo of the subject if you have them."; }

function paintPay(){
  const box=$("paylink"); if(!box) return;
  const due=amountDue(), note=encodeURIComponent("Case "+CASE_NO);
  if(S.pay==="venmo"){
    const url=`https://venmo.com/${FIRM.venmo}?txn=pay&amount=${due}&note=${note}`;
    box.innerHTML=`<a class="pay-btn venmo" href="${url}" target="_blank" rel="noopener noreferrer">Pay ${money(due)} with Venmo</a>`;
  }else if(S.pay==="cashapp"){
    const url=`https://cash.app/$${FIRM.cashtag}/${due}`;
    box.innerHTML=`<a class="pay-btn cashapp" href="${url}" target="_blank" rel="noopener noreferrer">Pay ${money(due)} with Cash App</a>`;
  }else box.innerHTML="";
  document.querySelectorAll(".pay-opt .opt").forEach((o,i)=>o.classList.toggle("sel",(i===0&&S.pay==="venmo")||(i===1&&S.pay==="cashapp")));
}

/* ============ Signature pad ============ */
let sigCtx=null, drawing=false, sigDirty=false;
function initSig(){
  const c=$("sig"); if(!c) return;
  const ratio=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight;
  c.width=w*ratio; c.height=h*ratio;
  sigCtx=c.getContext("2d"); sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.2; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#12305a";
  if(S.sig){ const img=new Image(); img.onload=()=>sigCtx.drawImage(img,0,0,w,h); img.src=S.sig; sigDirty=true; }
  const pos=e=>{ const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  const start=e=>{ e.preventDefault(); drawing=true; sigDirty=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); };
  const move =e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); };
  const end  =()=>{ if(drawing){ drawing=false; S.sig=c.toDataURL("image/png"); } };
  c.onpointerdown=start; c.onpointermove=move; window.addEventListener("pointerup",end);
}
function clearSig(){ const c=$("sig"); if(!c||!sigCtx) return; sigCtx.clearRect(0,0,c.width,c.height); S.sig=null; sigDirty=false; }

/* ============ Navigation + validation ============ */
function fail(msg){ const e=$("err"); if(e) e.textContent=msg; window.scrollTo(0,document.body.scrollHeight); }
function validate(step){
  capture();
  if(step==="info"){
    if(!(val.c_name||"").trim()) return "Please enter your full name.";
    if(!(val.c_phone||"").trim() && !(val.c_email||"").trim()) return "Add a phone number or email so we can reach you.";
  }
  if(step==="service" && !S.svc) return "Please choose a service.";
  if(step==="package" && !S.pkg) return "Please choose how much coverage you need.";
  if(step==="claim"){
    if(!(val.k_carrier||"").trim()) return "Please enter the carrier, TPA or employer assigning the file.";
    if(!(val.k_claimno||"").trim()) return "Please enter the claim number.";
  }
  if(step==="agreement"){
    if(!val.a_consent) return isClaims()
      ? "Please confirm you are authorized to assign this claim."
      : "Please check the box to agree to the terms.";
    if(!(val.a_typed||"").trim()) return "Please type your full legal name.";
    if(!S.sig || !sigDirty) return "Please sign in the box above.";
  }
  if(step==="payment" && !S.pay) return "Choose a payment method (or call us to pay another way).";
  return null;
}
function next(){
  const step=steps()[S.step], msg=validate(step);
  if(msg){ fail(msg); return; }
  if(step==="payment" || step==="billing"){ finish(); return; }
  S.step++; render();
}
function back(){ capture(); if(S.step>0){ S.step--; render(); } }

/* ============ Phase 2: Submission ============ */
function buildPayload(){
  const f=svc();
  const p = {
    case_no:CASE_NO,
    service:f?f.label:"",
    fee_due:amountDue(),
    payment_method:S.pay||"",
    client_name:val.c_name||"", client_phone:val.c_phone||"", client_email:val.c_email||"",
    client_address:val.c_addr||"", best_time:val.c_best||"",
    subject_name:val.s_name||"", subject_address:val.s_addr||"", subject_description:val.s_desc||"", subject_relationship:val.s_rel||"",
    objective:val.o_goal||"", timeline:val.o_time||"", notes:val.o_notes||"",
    attachments:(S.files||[]).join(", "),
    signed_name:val.a_typed||"", signature:S.sig||"",
    submitted_at:new Date().toLocaleString()
  };
  const blk = pkg(S.pkg);
  if(blk){
    // What was bought. `package` and `package_price` are commercial and stay
    // admin-only by default — FIELD_KEEP in the portal Worker is an allow-list,
    // so a new field like these is not sent to an investigator unless someone
    // adds it. `authorized_hours` is deliberately the existing allow-listed
    // field: the investigator does need to know the cap they are working to,
    // and hours are not a price.
    Object.assign(p, {
      package:`${blk.label} — ${blk.hours} hours`,
      package_hours:blk.hours,
      package_price:blk.price,
      authorized_hours:`${blk.hours} hours purchased — call before exceeding`,
    });
  }
  if(isClaims()){
    // Claim identifiers lead the payload so the assignment email is filable
    // against the carrier's own record without opening the attachment.
    Object.assign(p, {
      carrier:val.k_carrier||"", claim_number:val.k_claimno||"", policy_number:val.k_policy||"",
      claim_type:val.k_type||"", date_of_loss:val.k_dol||"",
      adjuster:val.k_adjuster||"", adjuster_email:val.k_adj_email||"", adjuster_phone:val.k_adj_phone||"",
      defense_counsel:val.k_counsel||"", billing_reference:val.k_po||"", prior_surveillance:val.k_prior||"",
      authorized_hours:val.o_hours||"", billing_email:val.b_email||"", billing_notes:val.b_notes||"",
      payment_method:"Invoiced to carrier"
    });
  }
  return p;
}
/* What a submission is allowed to tell a third party.
 *
 * The email relay is outside our infrastructure, so it is sent only enough to
 * say a case arrived and who to ring back. What the client actually typed —
 * the claimant, the address, the vehicle, the alleged injury, the objective,
 * the claim and policy numbers, the signature — stays in the case portal on
 * our own Cloudflare account and is read there, behind a staff login.
 *
 * Contact details are included on purpose: without them, a portal outage would
 * leave a real enquiry with no way to reach the person who made it. */
function buildNotice(p, stored){
  return {
    case_no: p.case_no,
    service: p.service,
    type: p.claim_number || p.carrier ? "Insurance claim assignment" : "Client intake",
    contact_name: p.client_name || p.signed_name || "",
    contact_phone: p.client_phone || "",
    contact_email: p.client_email || "",
    submitted_at: p.submitted_at,
    recorded_in_portal: stored ? "yes" : "NO — not recorded, see below",
    where_to_read_it: stored
      ? "Open the case portal at /portal/ and search this case number. The details are deliberately not in this email."
      : "THIS SUBMISSION WAS NOT RECORDED. Nothing else was kept. Call the contact above today; their own copy of the details is on their screen."
  };
}

/* Notify the firm that something arrived. Never carries the case content. */
async function notifyFirm(notice){
  if(WEB3FORMS_KEY){
    const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:"New "+notice.type+" "+notice.case_no,from_name:"Website Intake",...notice})});
    const d=await r.json(); return !!d.success;
  }
  const r=await fetch("https://formsubmit.co/ajax/"+FIRM.email,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
    body:JSON.stringify({_subject:"New "+notice.type+" "+notice.case_no,_template:"table",...notice})});
  const d=await r.json().catch(()=>({})); return d && (d.success==="true"||d.success===true);
}

/* The case portal is the record. This is the write that has to succeed. */
async function recordInPortal(p){
  if(!PORTAL_INGEST_KEY || PORTAL_INGEST_KEY === "PASTE_INGEST_KEY") return false;
  try{
    const r = await fetch(PORTAL_API + "/ingest", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Ingest-Key":PORTAL_INGEST_KEY},
      body:JSON.stringify(p)
    });
    return r.ok;
  }catch(e){ return false; }
}

async function finish(){
  const btn=document.querySelector(".btn.primary"); const err=$("err");
  const p=buildPayload();
  btn.disabled=true; btn.textContent="Sending…"; if(err) err.textContent="";

  // Store first, then notify — the notice reports whether the store worked.
  const stored = await recordInPortal(p);
  let notified=false, threw=false;
  try{ notified = await notifyFirm(buildNotice(p, stored)); }catch(e){ threw=true; }

  // The client is told it landed only if the firm can actually act on it:
  // either the details are recorded, or someone has their number to call.
  renderRecord(p, stored || notified, threw, stored);
}

/* ============ Final record ============ */
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function row(label,v){ return v ? `<dt>${label}</dt><dd>${esc(v)}</dd>` : ""; }
function renderRecord(p, sent, threw, stored){
  document.querySelectorAll("#progress i").forEach(el=>el.classList.add("done"));
  const claims = isClaims();
  const status = stored
    ? `<div class="ok"><b>${claims?"Assignment submitted.":"Intake submitted."}</b> Always Precise Investigations has received your ${claims?"assignment":"request"}. We'll ${claims?"confirm acceptance and the rate in writing before going out":"contact you shortly"}. Keep your case number for reference.</div>`
    : sent
    ? `<div class="warn"><b>Received, but please keep this page.</b> We have your contact details and your case number, and we will call you — but the details you entered did not save on our side. Printing or screenshotting this page means nothing is lost.</div>`
    : `<div class="warn"><b>We couldn't confirm delivery.</b> Please call <b>${FIRM.phone}</b> or email <b>${FIRM.email}</b> and give your case number so we don't miss you. Your details are shown below — you can print or screenshot this page.</div>`;
  app.innerHTML = `<div class="record">
    ${status}
    <h2>${claims?"Claim Assignment":"Client Intake"} — ${esc(p.service)}</h2>
    <div>Case <span class="case">${esc(p.case_no)}</span></div>
    <dl>
      ${claims?`${row("Carrier / TPA",p.carrier)}${row("Claim number",p.claim_number)}${row("Policy number",p.policy_number)}${row("Claim type",p.claim_type)}${row("Date of loss",p.date_of_loss)}${row("Adjuster",p.adjuster)}${row("Adjuster email",p.adjuster_email)}${row("Adjuster phone",p.adjuster_phone)}${row("Defense counsel",p.defense_counsel)}${row("Prior surveillance",p.prior_surveillance)}`:""}
      ${row(claims?"Assigning contact":"Name",p.client_name)}${row("Phone",p.client_phone)}${row("Email",p.client_email)}
      ${claims?"":`${row("Address",p.client_address)}${row("Best time",p.best_time)}`}
      ${row(claims?"Claimant":"Subject",p.subject_name)}${row(claims?"Claimant address":"Subject address",p.subject_address)}${row("Description",p.subject_description)}${row(claims?"Injury & restrictions":"Relationship",p.subject_relationship)}
      ${row(claims?"Scope":"Objective",p.objective)}${claims?row("Authorized hours",p.authorized_hours):""}${row(claims?"Deadline":"Timeline",p.timeline)}${row("Notes",p.notes)}${row("Attachments",p.attachments)}
      ${row("Service",p.service)}
      ${claims
        ? `${row("Billing","Invoiced to carrier")}${row("Billing reference / PO",p.billing_reference)}${row("Invoices to",p.billing_email)}${row("Billing notes",p.billing_notes)}`
        : `${row("Coverage purchased",p.package)}${row("Due today",money(p.fee_due))}${row("Payment method",p.payment_method)}`}
      ${row(claims?"Authorized by":"Signed by",p.signed_name)}
    </dl>
    ${p.package?`<div class="feebox" style="margin-top:4px">
      <div class="row"><span>${esc(p.package)}</span><b>${money(p.package_price)}</b></div>
      <div class="row"><span>Additional hours, only with your approval</span><span>${money(HOURLY)}/hr</span></div>
      <div class="row due"><span>Total due today</span><span>${money(p.fee_due)}</span></div>
    </div>`:""}
    ${p.signature?`<div><div style="font-size:.8rem;color:var(--muted)">Signature</div><img class="sig" src="${p.signature}" alt="signature"></div>`:""}
    <div class="nav"><button type="button" class="btn ghost" onclick="window.print()">Print / Save PDF</button></div>
  </div>`;
  window.scrollTo(0,0);
}
</script>
<script src="/beacon.js" defer></script>
