<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Intake — Always Precise Investigations</title>
<!-- noindex is deliberate: this form is reached by being sent the link, not by
     search. The OG tags below are not for search either — they are what a mail
     client or messenger draws when the emailed link is previewed. -->
<meta name="robots" content="noindex">
<meta name="description" content="Secure client intake for Always Precise Investigations, LLC. Send what you know now — anything you don't have on hand can follow later. Licensed Virginia private investigators, Va DCJS #11-9159.">
<link rel="canonical" href="https://alwayspreciseinvestigations.net/intake/">

<meta property="og:title" content="Secure Client Intake — Always Precise Investigations">
<meta property="og:description" content="A few minutes to open your file. Send what you know now — anything you don't have on hand can follow later.">

<style>
  :root{
    --navy:#0e1a2c; --navy-2:#13273f; --teal:#2f7d90; --teal-2:#3d97ad;
    --gold:#c99a3b; --ink:#1c2531; --muted:#5c6775; --line:#dfe3e8;
    --paper:#f4f5f7; --card:#ffffff; --good:#1c8a4d; --bad:#c14133;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;}
  .top{background:var(--navy);color:#fff;padding:16px 20px;}
  .top .wrap{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px;}
  .mark{width:34px;height:34px;flex:none;}
  .top .name{font-weight:700;letter-spacing:.03em;font-size:1.02rem;line-height:1.15;}
  .top .name span{display:block;font-weight:400;font-size:.72rem;color:#9db2c9;letter-spacing:.05em;}
  .top .meta{margin-left:auto;text-align:right;font-size:.74rem;color:#9db2c9;line-height:1.5;}
  .top .meta a{color:#cfe0f0;text-decoration:none;font-weight:600;}

  main{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
  .progress{display:flex;gap:6px;margin:6px 0 18px;}
  .progress i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background .2s;}
  .progress i.done{background:var(--teal-2);}
  .stepno{font-size:.78rem;color:var(--muted);margin-bottom:14px;letter-spacing:.03em;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 1px 3px rgba(16,29,51,.05);}
  h1{font-size:1.3rem;margin-bottom:4px;}
  .lead{color:var(--muted);font-size:.92rem;margin-bottom:18px;}
  label.f{display:block;margin-bottom:14px;}
  label.f > span{display:block;font-size:.85rem;font-weight:600;margin-bottom:5px;}
  .req{color:var(--bad);}
  input[type=text],input[type=tel],input[type=email],select,textarea{
    width:100%;font-size:16px;font-family:inherit;color:var(--ink);background:#fff;
    border:1px solid var(--line);border-radius:8px;padding:11px 12px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-2);border-color:var(--teal-2);}
  textarea{min-height:96px;resize:vertical;}
  .hint{font-size:.78rem;color:var(--muted);margin-top:4px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  @media(max-width:520px){.two{grid-template-columns:1fr;}}

  .opt{display:block;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,background .15s;}
  /* THE FIELD-LABEL MARKERS. `.optn` is deliberately NOT `.opt`: that name is
     the big service-picker card above, so `<span class="opt">optional</span>`
     inside a label rendered as a 602x53 bordered box with cursor:pointer — a
     clickable-looking card in the middle of a field label. Measured on the
     Legal step before this was renamed. Same class-name contest CLAUDE.md
     records for .qgrid, .dlg and the burger rule; a marker class gets its own
     name. */
  .optn{font-weight:400;color:var(--muted);font-size:.78rem;letter-spacing:0;text-transform:none;}
  .substep{margin:18px 0 6px;font-size:.9rem;color:#12305a;letter-spacing:.02em;}
  .opt:hover{border-color:var(--teal-2);}
  .opt.sel{border-color:var(--teal-2);background:#f0f8fa;}
  .opt .badge{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--teal-2);
    color:#fff;font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;vertical-align:middle;}
  .opt input{margin-right:8px;}
  .opt b{font-size:1rem;}
  .opt .desc{color:var(--muted);font-size:.86rem;margin-top:2px;}

  .feebox{background:#f0f8fa;border:1px solid #cfe6ec;border-radius:10px;padding:14px 16px;margin:4px 0 16px;font-size:.9rem;}
  .feebox .row{display:flex;justify-content:space-between;padding:3px 0;}
  .feebox .due{border-top:1px solid #cfe6ec;margin-top:6px;padding-top:8px;font-weight:700;font-size:1.02rem;}
  .agree{font-size:.82rem;color:#3a4653;max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fbfbfc;margin-bottom:14px;}
  .agree h4{margin:10px 0 4px;font-size:.85rem;color:var(--ink);}
  .agree p{margin-bottom:8px;}
  .chk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;margin-bottom:14px;}
  /* INTAKE-NA: the small "don't have this yet" control under a field. */
  .na{display:flex;gap:7px;align-items:center;font-size:.8rem;color:var(--muted);margin:-8px 0 14px;cursor:pointer;}
  .na input{width:auto;margin:0;}
  input:disabled,textarea:disabled{background:#f2f5f8;color:#9aa4ae;}
  .chk input{margin-top:3px;flex:none;width:18px;height:18px;}

  .sigwrap{border:1px solid var(--line);border-radius:8px;background:#fff;position:relative;}
  canvas#sig{display:block;width:100%;height:170px;border-radius:8px;touch-action:none;cursor:crosshair;}
  .sigline{position:absolute;left:16px;right:16px;bottom:34px;border-bottom:1px solid #c7ccd3;pointer-events:none;}
  .sigx{position:absolute;left:16px;bottom:16px;color:var(--muted);font-size:.8rem;pointer-events:none;}
  .sigclear{position:absolute;right:10px;top:10px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:.78rem;padding:4px 10px;cursor:pointer;color:var(--muted);}

  .nav{display:flex;gap:10px;margin-top:20px;}
  .btn{font:inherit;font-size:1rem;font-weight:700;border:0;border-radius:8px;padding:13px 22px;cursor:pointer;}
  .btn.primary{background:var(--teal);color:#fff;flex:1;}
  .btn.primary:hover{background:var(--teal-2);}
  .btn.primary:disabled{opacity:.6;cursor:default;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1em;}

  .record{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;}
  .record h2{font-size:1.2rem;margin-bottom:2px;}
  .record .case{color:var(--teal);font-weight:700;font-family:ui-monospace,monospace;}
  .record dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:.9rem;}
  .record dt{color:var(--muted);}
  .record dd{color:var(--ink);}
  .record img.sig{max-width:260px;border-bottom:1px solid #c7ccd3;margin-top:4px;}
  .ok{background:#e9f7ef;border:1px solid #b6e0c6;color:#166534;border-radius:8px;padding:12px 14px;font-size:.9rem;margin-bottom:14px;}
  .warn{background:#fdecea;border:1px solid #f5c6c0;color:#8a2318;border-radius:8px;padding:12px 14px;font-size:.9rem;margin-bottom:14px;}
  .foot{max-width:680px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.78rem;text-align:center;}
  @media print{.top .meta,.nav,.sigclear{display:none;}body{background:#fff;}}
.sr-page-title{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="10" fill="#13273f"/><path d="M32 12l6 8-6 8-6-8z" fill="#3d97ad"/><path d="M32 30l10 12H22z" fill="#c99a3b"/></svg>
    <div class="name">ALWAYS PRECISE<span id="m-kind">INVESTIGATIONS · CLIENT INTAKE</span></div>
    <div class="meta">
      <a id="m-phone" href="tel:+14349070975">(434) 907-0975</a><br>
      <span id="m-lic">Va DCJS #11-9159</span>
    </div>
  </div>
</div>

<main>
  <div class="stepno">Case <b id="caseno" style="font-family:ui-monospace,monospace;color:var(--teal)"></b></div>
  <div class="progress" id="progress"></div>

  <div id="app"></div>
</main>
<div class="foot">Confidential. Submitted only to Always Precise Investigations. Licensed &amp; insured · Va DCJS #11-9159.</div>

<script>
"use strict";

/* ============ Phase 1: Configuration ============ */
const FIRM = {
  name:    "Always Precise Investigations",
  phone:   "(434) 907-0975",
  tel:     "+14349070975",
  email:   "AlwaysPreciseInvestigations@gmail.com",
  license: "11-9159"           // Va DCJS
  // No payment is taken on this page any more — the office sends a fee sheet
  // from the portal and the client pays from that, so the handles that used to
  // build the payment buttons live wherever those instructions are written.
};
/* ============ NO PRICES ON THIS PAGE ============
   This is a public page, and the firm does not publish quotes — not for private
   clients and not for carriers. A rate is sent privately, by the office, to
   someone who has asked for one. Nothing about how that is done belongs in
   this file — this page ships to the public, comments included, and an
   internal filename in View Source is a pointer for anyone who looks
   (owner decision, 2026-08-21: pricing is never published here).

   So the intake collects the case and nothing else. It does not quote, it does
   not total, and it does not take a payment. The office sends the sheet, and
   the client pays from that.

   Do not reintroduce a figure here. There is a test that fails if a dollar
   amount appears anywhere in this file. */

/* Carrier surveillance authorization presets. HOURS, NEVER A RATE — this page
   is public and carrier pricing is quoted per assignment. The 8-hour day is the
   billing minimum and 24 hours is the usual initial authorization. The internal
   rate that goes with them is held privately in the portal and is deliberately
   not named here, filename included: this file is public. */
const AUTH_PRESETS = [
  { id:"a8",     label:"8 hours — 1 day",   desc:"A single day of coverage. Our minimum surveillance day." },
  { id:"a16",    label:"16 hours — 2 days", desc:"Two days, typically split to compare different days of the week." },
  { id:"a24",    label:"24 hours — 3 days", desc:"The usual initial authorization — enough to establish a pattern rather than a snapshot." },
  { id:"custom", label:"Custom authorization", desc:"Tell us the hours or the structure you need and we will work to it." },
  { id:"pending", label:"Authorization pending", desc:"Submit the assignment now — we confirm the authorized hours with you before any billable field work starts." },
];
const authPreset = id => AUTH_PRESETS.find(a => a.id === id) || null;

/* Labels only. Every one of these used to carry a figure; none does now. */
const FEES = {
  surveillance: { label:"Surveillance" },
  process:      { label:"Process Serving" },
  claims:       { label:"Insurance Claim Assignment", billed:true },
  legal:        { label:"Legal Investigation Assignment", billed:true }
};
/* Web3Forms access key goes here for email delivery; until then submissions
   go through FormSubmit to the firm inbox (needs one-time activation). */
const WEB3FORMS_KEY = "71016cd4-875b-4e71-9cb8-1a1c13f50c43";

/* The case portal keeps a record of every submission so it can be looked up
   later — email alone leaves no searchable history. This key is not a secret
   (this page is public, so anyone can read it); it only keeps casual noise out
   of the table, which the Worker also rate- and size-limits. Delivery to the
   firm inbox stays on Web3Forms, so a portal outage cannot lose a client. */
const PORTAL_API = "/portal-api";
const PORTAL_INGEST_KEY = "8d9ad57784dbc7e00d86806d2c186d60337fb4f762ea5f100ef311f70a84eb7b";

/* ============ State ============ */
const CASE_NO = "API-" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-" + String(Math.floor(1000+Math.random()*9000));
/* A carrier arriving from the insurance pages must never be shown the consumer
   side of the business. Landing on the shared service picker would offer an
   adjuster domestic surveillance, with a private-client price beside it, which
   is the wrong first impression of the firm and tells them nothing they want.

   So `/intake/?assignment=insurance` is the carrier door: the service is fixed
   to a claim assignment, the picker is dropped from the flow entirely, and the
   page identifies itself as an assignment intake rather than a client intake.
   Every "Submit an Assignment" button on the insurance pages points here.

   Bare `/intake/` is unchanged and still offers all three, for anyone who
   arrives without going through the insurance pages. */
const CARRIER_ONLY = /^(insurance|carrier|claims)$/i
  .test(new URLSearchParams(location.search).get("assignment") || "");

/* And ?assignment=private is the other door (audit, 2026-08-14): the link the
   office emails a private client. They still choose between
   surveillance and process serving, so the picker stays — it just no longer
   offers them an insurance claim assignment they were never going to file.
   Bare /intake/ is unchanged and still offers all three. */
const PRIVATE_ONLY = /^private$/i
  .test(new URLSearchParams(location.search).get("assignment") || "");

/* And ?assignment=legal is the third door (Unit 6, LEGAL-INTAKE.md): the link
   a law office is sent. The path is fixed, the picker is dropped, and the page
   titles itself "Legal Investigation Assignment" — a case-assignment form for
   attorneys and paralegals, not a consumer questionnaire. Bare /intake/ still
   offers everything. */
const LEGAL_ONLY = /^legal$/i
  .test(new URLSearchParams(location.search).get("assignment") || "");

const S = { step:0, svc:CARRIER_ONLY ? "claims" : LEGAL_ONLY ? "legal" : null, sig:null, files:[] };

/* ============ Required / optional markers ============

   ONE WRITER FOR THE WORDING, so a label cannot say something the form does
   not enforce. Three markers, because requiredness here has three shapes and
   only two of them are a yes/no:

     REQ   the field blocks the step on its own — validate() names it.
     OPT   the step submits with it blank. The word is "(optional)" in full,
           because a bare "optional" beside a label reads as part of the label.
     pair  neither of two fields is required alone and neither is optional —
           validate() wants ONE of them (phone/email, client/matter number,
           claimant name/claim number). Marking either "(optional)" would be
           untrue, and marking either required would be untrue the other way,
           so the pair says what it actually is.

   The public ingest validates only case_no — deliberately, so a Worker outage
   can never cost the firm a client — which makes validate() below the real
   gate and therefore the thing these markers have to agree with. The suite
   compares the two by filling ONLY the unmarked fields and submitting.

   Nothing here is decoration: a field with no marker at all is a bug the
   suite fails on. */
const REQ  = ' <b class="req">*</b>';
const OPT  = ' <span class="optn">(optional)</span>';
const PAIR = t => ` <span class="optn">(${t})</span>`;
const ONE_CONTACT = PAIR('phone or email &mdash; give us one');
const ONE_MATTER  = PAIR('client name or matter number &mdash; give us one');
const ONE_FILEID  = PAIR('claimant name or claim number &mdash; give us one');
// A carrier assignment collects claim details and ends in invoicing, so the
// claims path has its own step list; surveillance adds a step to choose how
// much coverage to buy. All three share the first two steps, which is what
// makes it safe to switch service without stranding S.step.
const STEPS       = ["info","service","subject","objective","agreement"];
const CLAIM_STEPS = ["info","service","claim","subject","objective","authorization","agreement","billing"];
/* The legal path (Unit 6): firm and contacts, then the matter, then the
   subject the firm already knows about, then the assignment itself. No payment
   step and no figure anywhere — a paralegal finishes this in a few minutes
   with what is on their desk, and anything not to hand follows later. */
const LEGAL_STEPS = ["info","service","firm","matter","subject","objective","agreement"];
function steps(){
  // A fixed door has no service picker to show, so it is dropped rather
  // than rendered and skipped — a step that exists but is never reached still
  // draws a segment on the progress bar.
  if(CARRIER_ONLY) return CLAIM_STEPS.filter(s => s !== "service");
  if(LEGAL_ONLY) return LEGAL_STEPS.filter(s => s !== "service");
  if(S.svc==="claims") return CLAIM_STEPS;
  if(S.svc==="legal") return LEGAL_STEPS;
  return STEPS;
}
function isClaims(){ return S.svc==="claims"; }
function isLegal(){ return S.svc==="legal"; }
const app = document.getElementById("app");
const $ = id => document.getElementById(id);

/* keep field values across step re-renders */
const val = {};
function capture(scope){ (scope||document).querySelectorAll("[data-k]").forEach(el=>{ val[el.dataset.k] = el.type==="checkbox" ? el.checked : el.value; }); }

/* INTAKE-NA: value and availability are separate things. The control disables
   the input and records the state; toggling back restores the input with
   whatever was typed. Natural language only — nothing here says "N/A", and no
   fake value is ever forced to pass validation. */
function naBox(k, text){
  return `<label class="na"><input type="checkbox" data-k="${k}_na" data-na-for="${k}" onchange="naFlip(this)"><span>${text || "I don't have this information right now"}</span></label>`;
}
function naFlip(box){
  const input = document.querySelector(`[data-k="${box.dataset.naFor}"]`);
  if(input) input.disabled = box.checked;
  capture();
}
function applyNaStates(){
  document.querySelectorAll("[data-na-for]").forEach(b => {
    const t = document.querySelector(`[data-k="${b.dataset.naFor}"]`);
    if(t) t.disabled = !!b.checked;
  });
}

/* What the submitter marked as not-yet-known, in their words — drawn on the
   review box before signing and on the final record. */
function naSummary(){
  const items = [];
  const who = isClaims() ? "Claimant" : "Subject";
  if(isClaims()){
    if(val.k_claimno_na) items.push("Claim number — not available at submission");
    if(val.k_dol_mode === "Unknown") items.push("Date of loss — unknown");
    else if(val.k_dol_mode === "Approximate date" && (val.k_dol||"").trim()) items.push("Date of loss — approximate");
  }
  if(val.s_addr_na) items.push(who + " address — not available yet");
  if(val.s_desc_na) items.push("Vehicle / description — not available yet");
  if(isClaims()){
    if(val.z_auth === "pending") items.push("Authorization — pending confirmation");
    if(val.z_start_mode && val.z_start_mode !== "Specific date") items.push("Requested start — " + val.z_start_mode.toLowerCase());
    if(val.b_email_na) items.push("Billing contact — to follow");
  }
  return items;
}

/* ============ Boot ============ */
document.addEventListener("DOMContentLoaded", () => {
  $("caseno").textContent = CASE_NO;
  $("m-phone").textContent = FIRM.phone; $("m-phone").href = "tel:" + FIRM.tel;
  $("m-lic").textContent = "Va DCJS #" + FIRM.license;
  if(CARRIER_ONLY){
    $("m-kind").textContent = "INVESTIGATIONS · ASSIGNMENT INTAKE";
    document.title = "Secure Assignment Intake — Always Precise Investigations";
  }
  if(LEGAL_ONLY){
    $("m-kind").textContent = "INVESTIGATIONS · LEGAL ASSIGNMENT";
    document.title = "Legal Investigation Assignment — Always Precise Investigations";
  }
  render();
});

function svc(){ return S.svc ? FEES[S.svc] : null; }

/* ============ Render ============ */
// The two paths have different step counts, so the progress bar is rebuilt
// whenever the count changes rather than being fixed once at boot.
function paintProgress(){
  const p=$("progress"), n=steps().length;
  if(p.children.length!==n){
    p.innerHTML="";
    for(let i=0;i<n;i++) p.insertAdjacentHTML("beforeend","<i></i>");
  }
  [...p.children].forEach((el,i)=> el.classList.toggle("done", i<=S.step));
}
function render(){
  const step = steps()[S.step];
  paintProgress();
  app.innerHTML = view(step);
  restore();
  if(step==="agreement") initSig();
  window.scrollTo(0,0);
}
function restore(){ document.querySelectorAll("[data-k]").forEach(el=>{ if(val[el.dataset.k]!==undefined){ if(el.type==="checkbox") el.checked=val[el.dataset.k]; else el.value=val[el.dataset.k]; } }); applyNaStates(); }

function navButtons(nextLabel){
  return `<div class="nav">
    ${S.step>0 ? `<button type="button" class="btn ghost" onclick="back()">Back</button>` : ""}
    <button type="button" class="btn primary" onclick="next()">${nextLabel||"Continue"}</button>
  </div><div class="err" id="err"></div>`;
}

function view(step){
  /* An adjuster and a private client are asked different questions here. A
     carrier is an organization with a title and a direct line; a mailing
     address and "best time to reach you" are consumer questions that read as
     amateur on an assignment form. */
  if(step==="info") return isClaims() ? `<div class="card">
    <h1 class="sr-page-title">Secure Assignment Intake</h1>
    <h2>Assigning contact</h2>
    <p class="lead">Who is assigning this file, and how we reach you about it.
      Send us what you know now &mdash; anything you don't have yet can be provided later.</p>
    <label class="f"><span>Full name${REQ}</span><input type="text" data-k="c_name" autocomplete="name"></label>
    <div class="two">
      <label class="f"><span>Title${OPT}</span><input type="text" data-k="c_title" placeholder="e.g. Claims Adjuster, SIU Investigator"></label>
      <label class="f"><span>Organization type${OPT}</span>
        <select data-k="c_orgtype">
          <option value="">Select…</option>
          <option>Insurance carrier</option>
          <option>Third-party administrator</option>
          <option>Self-insured employer</option>
          <option>Insurance defense firm</option>
          <option>Risk pool / municipal</option>
          <option>SIU department</option>
          <option>Other</option></select></label>
    </div>
    <div class="two">
      <label class="f"><span>Direct phone${ONE_CONTACT}</span><input type="tel" data-k="c_phone" autocomplete="tel"></label>
      <label class="f"><span>Email${ONE_CONTACT}</span><input type="email" data-k="c_email" autocomplete="email"></label>
    </div>
    <p class="hint" style="margin-top:-6px;">Give us at least one — phone or email. A request number is issued the moment this is submitted.</p>
    ${navButtons()}
  </div>` : `<div class="card">
    <h1 class="sr-page-title">Client Intake</h1>
    <h2>Your information</h2>
    <p class="lead">Tell us how to reach you. Everything you share is confidential.
      Send us what you know now &mdash; anything you don't have yet can be provided later.</p>
    <label class="f"><span>Full name${REQ}</span><input type="text" data-k="c_name" autocomplete="name"></label>
    <div class="two">
      <label class="f"><span>Phone${ONE_CONTACT}</span><input type="tel" data-k="c_phone" autocomplete="tel"></label>
      <label class="f"><span>Email${ONE_CONTACT}</span><input type="email" data-k="c_email" autocomplete="email"></label>
    </div>
    <p class="hint" style="margin-top:-6px;margin-bottom:12px;">Give us at least one — phone or email.</p>

      <div class="row due"><span>Due at assignment</span><span>Nothing — invoiced</span></div>
    </div>
    <label class="f"><span>Send invoices to${OPT}</span><input type="email" data-k="b_email" placeholder="Accounts payable or billing email"></label>
    ${naBox("b_email", "Billing contact to follow — invoicing details can come later")}
    <label class="f"><span>Billing notes${OPT}</span><textarea data-k="b_notes" placeholder="Portal, invoicing requirements, required references…"></textarea></label>
    <p class="hint">We confirm the rate and any estimated hours in writing before going out. Questions on rates? Call ${FIRM.phone}.</p>
    ${navButtons("Submit assignment")}
  </div>`;

  return "";
}

/* ============ Step actions ============ */
function pickSvc(k){
  // The private door does not offer the carrier or legal paths; refusing here
  // too means a stale link or a hand-typed value cannot reach them either.
  if(PRIVATE_ONLY && (k === "claims" || k === "legal")) return;
  capture(); S.svc=k; render();
}
function pickAuth(k){ capture(); val.z_auth=k; render(); }
function pickArr(k){ capture(); val.l_arrangement=k; render(); }
function pickFiles(input){ S.files=[...input.files].map(f=>f.name); const n=$("filenote"); if(n) n.textContent = S.files.length? S.files.length+" file(s) attached: "+S.files.join(", ") : "Attach court papers or a photo of the subject if you have them."; }


/* ============ Signature pad ============ */
let sigCtx=null, drawing=false, sigDirty=false;
function initSig(){
  const c=$("sig"); if(!c) return;
  const ratio=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight;
  c.width=w*ratio; c.height=h*ratio;
  sigCtx=c.getContext("2d"); sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.2; sigCtx.lineCap="round"; sigCtx.lineJoin="round"; sigCtx.strokeStyle="#12305a";
  if(S.sig){ const img=new Image(); img.onload=()=>sigCtx.drawImage(img,0,0,w,h); img.src=S.sig; sigDirty=true; }
  const pos=e=>{ const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; };
  const start=e=>{ e.preventDefault(); drawing=true; sigDirty=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); };
  const move =e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); };
  const end  =()=>{ if(drawing){ drawing=false; S.sig=c.toDataURL("image/png"); } };
  c.onpointerdown=start; c.onpointermove=move; window.addEventListener("pointerup",end);
}
function clearSig(){ const c=$("sig"); if(!c||!sigCtx) return; sigCtx.clearRect(0,0,c.width,c.height); S.sig=null; sigDirty=false; }

/* ============ Navigation + validation ============ */
function fail(msg){ const e=$("err"); if(e) e.textContent=msg; window.scrollTo(0,document.body.scrollHeight); }
function validate(step){
  capture();
  if(step==="info"){
    if(!(val.c_name||"").trim()) return "Please enter your full name.";
    if(!(val.c_phone||"").trim() && !(val.c_email||"").trim()) return "Add a phone number or email so we can reach you.";
  }
  if(step==="service" && !S.svc) return "Please choose a service.";
  if(step==="firm"){
    if(!(val.lf_firm||"").trim()) return "Please name the law firm.";
    if(!(val.lf_atty||"").trim()) return "Please name the assigning attorney.";
  }
  if(step==="matter"){
    if(!(val.lm_client||"").trim() && !(val.lm_matter||"").trim())
      return "Give the client's name or the firm's matter number — the file has to be identifiable.";
  }
  if(step==="authorization"){
    if(!val.z_auth) return "Please choose how many hours you are authorizing — or pick Authorization pending.";
    if(val.z_auth==="custom" && !(val.z_custom||"").trim()) return "Please describe the custom authorization.";
  }
  /* INTAKE-NA core rule: the carrier is the one requirement here. A claim
     number may genuinely not exist yet on an urgent assignment — the control
     under the field records that instead of blocking. */
  if(step==="claim"){
    if(!(val.k_carrier||"").trim()) return "Please enter the carrier, TPA or employer assigning the file.";
  }
  /* The file has to be identifiable: the claimant's name, or failing that the
     claim number from the earlier step. Never both required — one. */
  if(step==="subject" && isClaims()){
    if(!(val.s_name||"").trim() && !(val.k_claimno||"").trim()){
      return "Give us the claimant's name — or go back and add the claim number — so the file can be identified.";
    }
  }
  /* The owner's firm line: contact plus a basic case purpose. Everything else
     can follow, but an essentially empty form must not submit. */
  if(step==="objective"){
    if(!(val.o_goal||"").trim()) return isClaims()
      ? "A sentence on what the file needs to establish is all we need to start."
      : "Tell us briefly what you would like documented — a sentence is enough.";
  }
  if(step==="agreement"){
    if(!val.a_consent) return isClaims()
      ? "Please confirm you are authorized to assign this claim."
      : "Please check the box to agree to the terms.";
    if(!(val.a_typed||"").trim()) return "Please type your full legal name.";
    if(!S.sig || !sigDirty) return "Please sign in the box above.";
  }
  return null;
}
function next(){
  const step=steps()[S.step], msg=validate(step);
  if(msg){ fail(msg); return; }
  // The consumer path now ends on the agreement — there is no payment step,
  // because there is no figure to charge until the fee sheet is agreed.
  if(step==="billing" || (step==="agreement" && !isClaims())){ finish(); return; }
  S.step++; render();
}
function back(){ capture(); if(S.step>0){ S.step--; render(); } }

/* ============ Phase 2: Submission ============ */
function buildPayload(){
  const f=svc();
  const p = {
    case_no:CASE_NO,
    service:f?f.label:"",
    fee_due:0,          // nothing is quoted or charged at intake any more
    client_name:val.c_name||"", client_phone:val.c_phone||"", client_email:val.c_email||"",
    client_address:val.c_addr||"", best_time:val.c_best||"",
    subject_name:val.s_name||"", subject_address:val.s_addr||"", subject_description:val.s_desc||"", subject_relationship:val.s_rel||"",
    objective:val.o_goal||"", timeline:val.o_time||"", notes:val.o_notes||"",
    attachments:(S.files||[]).join(", "),
    signed_name:val.a_typed||"", signature:S.sig||"",
    submitted_at:new Date().toLocaleString()
  };
  if(isLegal()){
    /* The legal payload (LEGAL-INTAKE.md). Two identities are deliberately
       kept apart: `client_name` is the FIRM'S CLIENT — the party the matter is
       about, what the office needs on the case — while the reachable contact
       is the SUBMITTER (the paralegal or attorney filling this in), whose
       details ride client_email/client_phone plus contact_name so a call-back
       reaches the person who actually sent it. assignment:'legal' is the
       marker of record the Worker files the case by. */
    Object.assign(p, {
      assignment: "legal",
      contact_name: val.c_name||"",
      client_name: val.lm_client||"",
      firm_name: val.lf_firm||"", firm_address: val.lf_firm_addr||"",
      firm_phone: val.lf_firm_phone||"", firm_email: val.lf_firm_email||"",
      attorney_name: val.lf_atty||"", attorney_email: val.lf_atty_email||"", attorney_phone: val.lf_atty_phone||"",
      paralegal_name: val.lf_para||"", paralegal_email: val.lf_para_email||"", paralegal_phone: val.lf_para_phone||"",
      billing_name: val.lf_bill||"", billing_email: val.lf_bill_email||"", billing_phone: val.lf_bill_phone||"",
      billing_reference: val.lf_bill_ref||"",
      matter_number: val.lm_matter||"", court_case_number: val.lm_court_no||"",
      court_jurisdiction: val.lm_court||"",
      assignment_type: val.lm_type||"", conflict_names: val.lm_conflicts||"",
      deadline: val.lm_deadline||"", hearing_date: val.lm_hearing||"",
      trial_date: val.lm_trial||"", other_date: val.lm_other||"", other_date_label: val.lm_other_label||"",
      special_instructions: val.lm_instructions||"",
      payment_arrangement: val.l_arrangement||""
    });
  }
  if(isClaims()){
    // Claim identifiers lead the payload so the assignment email is filable
    // against the carrier's own record without opening the attachment.
    Object.assign(p, {
      carrier:val.k_carrier||"", claim_number:val.k_claimno||"", policy_number:val.k_policy||"",
      claim_type:val.k_type||"", date_of_loss:val.k_dol||"",
      adjuster:val.k_adjuster||"", adjuster_email:val.k_adj_email||"", adjuster_phone:val.k_adj_phone||"",
      defense_counsel:val.k_counsel||"", billing_reference:val.k_po||"", prior_surveillance:val.k_prior||"",
      billing_email:val.b_email||"", billing_notes:val.b_notes||"",
      contact_title:val.c_title||"", organization_type:val.c_orgtype||"",
      payment_method:"Invoiced to carrier"
    });
    // What the carrier authorized. The operational half of this — hours, days,
    // times, weekend, priority, geography — is what an investigator needs to
    // work inside the authorization, and those fields are allow-listed in the
    // portal Worker. The not-to-exceed amount is commercial and stays
    // admin-only, which the allow-list gives us by default.
    const a = authPreset(val.z_auth);
    Object.assign(p, {
      authorized_hours: val.z_auth==="custom"
        ? (val.z_custom||"Custom authorization")
        : (a ? a.label : ""),
      not_to_exceed:val.z_nte||"",
      start_date:(!val.z_start_mode || val.z_start_mode==="Specific date") ? (val.z_start||"") : "",
      permitted_days:val.z_days||"", permitted_times:val.z_times||"",
      weekend_authorized:val.z_weekend||"", priority:val.z_priority||"",
      geographic_limits:val.z_geo||"",
    });
    if(val.z_billing) p.billing_notes = [p.billing_notes, val.z_billing].filter(Boolean).join(" — ");
  }

  /* INTAKE-NA status model: availability rides beside the value, and a status
     key appears only when the state is not plain "provided". Values stay
     empty — never a typed "Unknown" or a placeholder date. */
  if(isClaims()){
    if(val.k_claimno_na){ p.claim_number = ""; p.claim_number_status = "not_available"; }
    if(val.k_dol_mode === "Unknown"){ p.date_of_loss = ""; p.date_of_loss_status = "unknown"; }
    else if(val.k_dol_mode === "Approximate date" && (p.date_of_loss||"").trim()){ p.date_of_loss_status = "approximate"; }
    /* The pending preset's own LABEL is "Authorization pending", and writing
       it into the value put a placeholder beside its own status — the one
       thing INTAKE-NA forbids, and the only NA field that still did it.
       Blank the value; the status is where the gap is spelled out. */
    if(val.z_auth === "pending"){ p.authorized_hours = ""; p.authorized_hours_status = "pending"; }
    /* Same rule for prior surveillance. Its select offered a literal
       "Unknown", which is exactly the string the placeholder guard bans —
       and prior_surveillance is in FIELD_KEEP, so an investigator was shown
       the word rather than the empty-value/status pair. */
    if(val.k_prior === "Unknown"){ p.prior_surveillance = ""; p.prior_surveillance_status = "unknown"; }
    if(val.z_start_mode && val.z_start_mode !== "Specific date"){
      p.start_date_status = ({"As soon as available":"asap","Flexible":"flexible","To be determined":"tbd"})[val.z_start_mode] || "flexible";
    }
    if(val.b_email_na){ p.billing_email = ""; p.billing_email_status = "not_available"; }
  }
  if(val.s_addr_na){ p.subject_address = ""; p.subject_address_status = "not_available"; }
  if(val.s_desc_na){ p.subject_description = ""; p.subject_description_status = "not_available"; }
  return p;
}
/* What a submission is allowed to tell a third party.
 *
 * The email relay is outside our infrastructure, so it is sent only enough to
 * say a case arrived and who to ring back. What the client actually typed —
 * the claimant, the address, the vehicle, the alleged injury, the objective,
 * the claim and policy numbers, the signature — stays in the case portal on
 * our own Cloudflare account and is read there, behind a staff login.
 *
 * Contact details are included on purpose: without them, a portal outage would
 * leave a real enquiry with no way to reach the person who made it. */
function buildNotice(p, stored){
  return {
    case_no: p.case_no,
    service: p.service,
    type: p.assignment === "legal" ? "Legal investigation assignment"
        : p.claim_number || p.carrier ? "Insurance claim assignment" : "Client intake",
    /* For a legal assignment the reachable person is the SUBMITTER — the
       paralegal or attorney — never the firm's client, whose name is case
       content and stays in the portal. */
    contact_name: (p.assignment === "legal" ? p.contact_name : p.client_name) || p.signed_name || "",
    contact_phone: p.client_phone || "",
    contact_email: p.client_email || "",
    submitted_at: p.submitted_at,
    recorded_in_portal: stored ? "yes" : "NO — not recorded, see below",
    where_to_read_it: stored
      ? "Open the case portal at /portal/ and search this case number. The details are deliberately not in this email."
      : "THIS SUBMISSION WAS NOT RECORDED. Nothing else was kept. Call the contact above today; their own copy of the details is on their screen."
  };
}

/* Notify the firm that something arrived. Never carries the case content. */
async function notifyFirm(notice){
  if(WEB3FORMS_KEY){
    const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:"New "+notice.type+" "+notice.case_no,from_name:"Website Intake",...notice})});
    const d=await r.json(); return !!d.success;
  }
  const r=await fetch("https://formsubmit.co/ajax/"+FIRM.email,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
    body:JSON.stringify({_subject:"New "+notice.type+" "+notice.case_no,_template:"table",...notice})});
  const d=await r.json().catch(()=>({})); return d && (d.success==="true"||d.success===true);
}

/* The case portal is the record. This is the write that has to succeed. */
async function recordInPortal(p){
  if(!PORTAL_INGEST_KEY || PORTAL_INGEST_KEY === "PASTE_INGEST_KEY") return false;
  try{
    const r = await fetch(PORTAL_API + "/ingest", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Ingest-Key":PORTAL_INGEST_KEY},
      body:JSON.stringify(p)
    });
    return r.ok;
  }catch(e){ return false; }
}

async function finish(){
  const btn=document.querySelector(".btn.primary"); const err=$("err");
  const p=buildPayload();
  btn.disabled=true; btn.textContent="Sending…"; if(err) err.textContent="";

  // Store first, then notify — the notice reports whether the store worked.
  const stored = await recordInPortal(p);
  let notified=false, threw=false;
  try{ notified = await notifyFirm(buildNotice(p, stored)); }catch(e){ threw=true; }

  // The client is told it landed only if the firm can actually act on it:
  // either the details are recorded, or someone has their number to call.
  renderRecord(p, stored || notified, threw, stored);
}

/* ============ Final record ============ */
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function row(label,v){ return v ? `<dt>${label}</dt><dd>${esc(v)}</dd>` : ""; }
/* A field marked not-yet-known shows AS that on the record — the form accepted
   the answer on purpose, and the printout should say so rather than go silent. */
const NA_WORDS = { not_available:"Not available at submission", unknown:"Unknown at submission",
  approximate:"Approximate", asap:"As soon as available", flexible:"Flexible",
  tbd:"To be determined", pending:"Authorization pending" };
function rowS(label, v, status){
  if(v) return `<dt>${label}</dt><dd>${esc(v)}${status==="approximate" ? ' <i style="color:var(--muted)">(approximate)</i>' : ""}</dd>`;
  if(status) return `<dt>${label}</dt><dd><i style="color:var(--muted)">${esc(NA_WORDS[status] || "Not available yet")}</i></dd>`;
  return "";
}
function renderRecord(p, sent, threw, stored){
  document.querySelectorAll("#progress i").forEach(el=>el.classList.add("done"));
  const claims = isClaims();
  const status = stored
    ? `<div class="ok"><b>${claims?"Assignment submitted.":"Intake submitted."}</b> Always Precise Investigations has received your ${claims?"assignment":"request"}. We'll ${claims?"confirm acceptance and the rate in writing before going out":"contact you shortly"}. Keep your case number for reference.</div>`
    : sent
    ? `<div class="warn"><b>Received, but please keep this page.</b> We have your contact details and your case number, and we will call you — but the details you entered did not save on our side. Printing or screenshotting this page means nothing is lost.</div>`
    : `<div class="warn"><b>We couldn't confirm delivery.</b> Please call <b>${FIRM.phone}</b> or email <b>${FIRM.email}</b> and give your case number so we don't miss you. Your details are shown below — you can print or screenshot this page.</div>`;
  app.innerHTML = `<div class="record">
    ${status}
    <h2>${claims?"Claim Assignment":"Client Intake"} — ${esc(p.service)}</h2>
    <div>Case <span class="case">${esc(p.case_no)}</span></div>
    <dl>
      ${claims?`${row("Carrier / TPA",p.carrier)}${rowS("Claim number",p.claim_number,p.claim_number_status)}${row("Policy number",p.policy_number)}${row("Claim type",p.claim_type)}${rowS("Date of loss",p.date_of_loss,p.date_of_loss_status)}${row("Adjuster",p.adjuster)}${row("Adjuster email",p.adjuster_email)}${row("Adjuster phone",p.adjuster_phone)}${row("Defense counsel",p.defense_counsel)}${row("Prior surveillance",p.prior_surveillance)}`:""}
      ${row(claims?"Assigning contact":"Name",p.client_name)}${row("Phone",p.client_phone)}${row("Email",p.client_email)}
      ${claims?"":`${row("Address",p.client_address)}${row("Best time",p.best_time)}`}
      ${row(claims?"Claimant":"Subject",p.subject_name)}${rowS(claims?"Claimant address":"Subject address",p.subject_address,p.subject_address_status)}${rowS("Description",p.subject_description,p.subject_description_status)}${row(claims?"Injury & restrictions":"Relationship",p.subject_relationship)}
      ${row(claims?"Scope":"Objective",p.objective)}${claims?`${rowS("Authorized hours",p.authorized_hours,p.authorized_hours_status)}${row("Not to exceed",p.not_to_exceed)}${rowS("Requested start",p.start_date,p.start_date_status)}${row("Permitted days",p.permitted_days)}${row("Permitted times",p.permitted_times)}${row("Weekend",p.weekend_authorized)}${row("Priority",p.priority)}${row("Geographic limits",p.geographic_limits)}`:""}${row(claims?"Deadline":"Timeline",p.timeline)}${row("Notes",p.notes)}${row("Attachments",p.attachments)}
      ${row("Service",p.service)}
      ${claims
        ? `${row("Billing","Invoiced to carrier")}${row("Billing reference / PO",p.billing_reference)}${row("Invoices to",p.billing_email)}${row("Billing notes",p.billing_notes)}`
        : `${row("Fee","Sent to you in writing — nothing charged yet")}`}
      ${row(claims?"Authorized by":"Signed by",p.signed_name)}
    </dl>
    ${p.signature?`<div><div style="font-size:.8rem;color:var(--muted)">Signature</div><img class="sig" src="${p.signature}" alt="signature"></div>`:""}
    <div class="nav"><button type="button" class="btn ghost" onclick="window.print()">Print / Save PDF</button></div>
  </div>`;
  window.scrollTo(0,0);
}
</script>
<script src="/beacon.js" defer></script>
</body>
</html>
