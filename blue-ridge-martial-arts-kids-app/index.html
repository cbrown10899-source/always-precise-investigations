<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Blue Ridge Martial Arts — Kids App</title>
    <meta
      name="description"
      content="Practise martial arts safely at home and arrive at class ready. A companion app for young students at Blue Ridge Martial Arts, Forest, VA."
    />

    <!-- The masthead's own sky, so the browser chrome matches the app. -->
    <meta name="theme-color" content="#10233f" />
    <meta name="color-scheme" content="light" />

    <!-- iOS standalone behaviour: the installed app gets no Safari chrome and
         a dark status bar that reads on the navy masthead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blue Ridge" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <meta property="og:title" content="Blue Ridge Martial Arts — Kids App" />
    <meta
      property="og:description"
      content="Stronger Kids. Brighter Futures. At-home practice for young martial artists."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This app needs JavaScript to run. Please enable it, or ask Blue Ridge Martial Arts for the
      printed practice sheet.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
